<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>임용 국어 공부</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink-900: #1B2420;
    --ink-800: #232D28;
    --ink-700: #2C3730;
    --paper: #EDE6D3;
    --paper-dim: #E1D8BE;
    --accent: #4C9285;
    --accent-deep: #2E6559;
    --warm: #C2492E;
    --warm-deep: #9B3722;
    --text-on-paper: #241F18;
    --text-on-ink: #EDE6D3;
    --muted-on-ink: #8FA39A;
    --muted-on-paper: #8A8370;
    --radius: 14px;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    background: var(--ink-900);
    color: var(--text-on-ink);
    font-family: 'Noto Sans KR', sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    overflow-x: hidden;
  }
  #app {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    max-width: 640px;
    margin: 0 auto;
    padding: 0 20px 28px;
  }

  /* ---------- Header ---------- */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 2px 10px;
    min-height: 44px;
  }
  .back-btn {
    background: none;
    border: none;
    color: var(--muted-on-ink);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 15px;
    cursor: pointer;
    padding: 8px 6px 8px 0;
    display: flex;
    align-items: center;
    gap: 6px;
    visibility: hidden;
  }
  .back-btn.show { visibility: visible; }
  .back-btn:hover { color: var(--text-on-ink); }
  .crumb {
    font-size: 13px;
    color: var(--muted-on-ink);
    letter-spacing: 0.02em;
  }
  .progress-dots {
    display: flex;
    gap: 5px;
  }
  .progress-dots span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--ink-700);
    transition: background 0.25s ease;
  }
  .progress-dots span.done { background: var(--accent); }
  .progress-dots span.current { background: var(--warm); }

  main { flex: 1; display: flex; flex-direction: column; }

  /* ---------- Genre screen ---------- */
  .hero {
    padding: 18px 4px 28px;
  }
  .hero h1 {
    font-family: 'Noto Serif KR', serif;
    font-weight: 600;
    font-size: 30px;
    line-height: 1.3;
    margin: 0 0 8px;
  }
  .hero p {
    color: var(--muted-on-ink);
    font-size: 14.5px;
    line-height: 1.6;
    margin: 0;
    max-width: 46ch;
  }
  .genre-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .genre-card {
    background: var(--ink-800);
    border: 1px solid var(--ink-700);
    border-radius: var(--radius);
    padding: 20px 18px;
    text-align: left;
    cursor: pointer;
    color: var(--text-on-ink);
    font-family: 'Noto Sans KR', sans-serif;
    transition: border-color 0.2s ease, transform 0.15s ease;
  }
  .genre-card:active { transform: scale(0.98); }
  .genre-card:hover { border-color: var(--accent); }
  .genre-card .gname {
    font-family: 'Noto Serif KR', serif;
    font-size: 19px;
    font-weight: 600;
    display: block;
    margin-bottom: 6px;
  }
  .genre-card .gcount {
    font-size: 13px;
    color: var(--muted-on-ink);
  }

  /* ---------- Work list screen ---------- */
  .work-list { display: flex; flex-direction: column; gap: 10px; margin-top: 6px; }
  .work-item {
    background: var(--ink-800);
    border: 1px solid var(--ink-700);
    border-radius: var(--radius);
    padding: 16px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    text-align: left;
    color: var(--text-on-ink);
    font-family: 'Noto Sans KR', sans-serif;
  }
  .work-item:hover { border-color: var(--accent); }
  .work-item .wtitle {
    font-family: 'Noto Serif KR', serif;
    font-size: 17px;
    font-weight: 600;
  }
  .work-item .wauthor {
    font-size: 13px;
    color: var(--muted-on-ink);
    margin-top: 3px;
  }
  .work-item .wcheck {
    color: var(--accent);
    font-size: 13px;
    flex-shrink: 0;
    margin-left: 10px;
  }
  .section-title {
    font-size: 13px;
    color: var(--muted-on-ink);
    letter-spacing: 0.02em;
    margin: 20px 2px 4px;
  }

  /* ---------- Card screen ---------- */
  .card-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 10px 0 20px;
  }
  .card {
    background: var(--paper);
    color: var(--text-on-paper);
    border-radius: 18px;
    padding: 44px 28px 34px;
    min-height: 46vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    cursor: pointer;
    position: relative;
    box-shadow: 0 16px 40px rgba(0,0,0,0.35);
  }
  .card .orig {
    font-family: 'Noto Serif KR', serif;
    font-weight: 500;
    font-size: clamp(22px, 6vw, 30px);
    line-height: 1.6;
    white-space: pre-line;
  }
  .card .trans {
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 16px;
    line-height: 1.7;
    color: var(--accent-deep);
    margin-top: 22px;
    padding-top: 20px;
    border-top: 1px solid var(--paper-dim);
    white-space: pre-line;
    display: none;
    max-width: 40ch;
  }
  .card.revealed .trans { display: block; }
  .tap-hint {
    position: absolute;
    bottom: 14px;
    left: 0; right: 0;
    text-align: center;
    font-size: 12px;
    color: var(--muted-on-paper);
  }
  .card-controls {
    display: flex;
    justify-content: center;
    margin-top: 18px;
  }
  .reveal-btn {
    background: transparent;
    border: 1px solid var(--accent);
    color: var(--accent);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 14.5px;
    font-weight: 600;
    padding: 11px 26px;
    border-radius: 999px;
    cursor: pointer;
  }
  .reveal-btn:hover { background: var(--ink-800); }
  .reveal-btn.on {
    background: var(--accent);
    color: var(--ink-900);
  }

  /* ---------- Summary screen ---------- */
  .summary-card {
    background: var(--ink-800);
    border: 1px solid var(--ink-700);
    border-radius: var(--radius);
    padding: 24px 22px;
    margin-bottom: 14px;
  }
  .summary-card h2 {
    font-family: 'Noto Serif KR', serif;
    font-size: 15px;
    color: var(--accent);
    margin: 0 0 10px;
    font-weight: 600;
  }
  .summary-card p, .summary-card li {
    font-size: 15px;
    line-height: 1.7;
    margin: 0;
    color: var(--text-on-ink);
  }
  .summary-card ul { padding-left: 18px; margin: 0; }
  .summary-card li { margin-bottom: 6px; }
  .summary-title {
    font-family: 'Noto Serif KR', serif;
    font-size: 26px;
    font-weight: 700;
    margin: 4px 0 2px;
  }
  .summary-author {
    color: var(--muted-on-ink);
    font-size: 14px;
    margin-bottom: 22px;
  }
  .summary-actions {
    display: flex;
    gap: 10px;
    margin-top: 8px;
  }
  .btn {
    flex: 1;
    border-radius: 999px;
    padding: 13px 14px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 14.5px;
    font-weight: 600;
    cursor: pointer;
    border: 1px solid var(--ink-700);
    background: var(--ink-800);
    color: var(--text-on-ink);
  }
  .btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--ink-900);
  }

  .empty-note {
    color: var(--muted-on-ink);
    font-size: 13.5px;
    line-height: 1.7;
    margin-top: 24px;
    padding: 16px 18px;
    border: 1px dashed var(--ink-700);
    border-radius: var(--radius);
  }

  /* ---------- Random draw ---------- */
  .random-entry {
    width: 100%;
    margin-top: 16px;
    background: linear-gradient(135deg, var(--accent-deep), var(--ink-800));
    border: 1px solid var(--accent);
    border-radius: var(--radius);
    padding: 18px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    color: var(--text-on-ink);
    font-family: 'Noto Sans KR', sans-serif;
    text-align: left;
  }
  .random-entry:active { transform: scale(0.98); }
  .random-entry .rtitle {
    font-family: 'Noto Serif KR', serif;
    font-size: 17px;
    font-weight: 600;
    display: block;
    margin-bottom: 4px;
  }
  .random-entry .rsub {
    font-size: 12.5px;
    color: var(--muted-on-ink);
  }
  .random-entry .rdice { font-size: 26px; }

  .random-source {
    text-align: center;
    font-size: 13px;
    color: var(--muted-on-ink);
    margin-bottom: 10px;
  }
  .random-source b { color: var(--text-on-ink); font-weight: 600; }
  .verse-card {
    background: var(--paper);
    color: var(--text-on-paper);
    border-radius: 18px;
    padding: 40px 26px 30px;
    min-height: 34vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    box-shadow: 0 16px 40px rgba(0,0,0,0.35);
    cursor: pointer;
    position: relative;
  }
  .verse-card .orig {
    font-family: 'Noto Serif KR', serif;
    font-weight: 500;
    font-size: clamp(20px, 5.5vw, 27px);
    line-height: 1.6;
    white-space: pre-line;
  }
  .verse-card .trans {
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 15.5px;
    line-height: 1.7;
    color: var(--accent-deep);
    margin-top: 20px;
    padding-top: 18px;
    border-top: 1px solid var(--paper-dim);
    white-space: pre-line;
    max-width: 40ch;
  }
  .tab-bar {
    display: flex;
    gap: 8px;
    margin: 16px 0 4px;
  }
  .tab-btn {
    flex: 1;
    background: var(--ink-800);
    border: 1px solid var(--ink-700);
    color: var(--muted-on-ink);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 14px;
    font-weight: 600;
    padding: 13px 8px;
    border-radius: 999px;
    cursor: pointer;
  }
  .tab-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--ink-900);
  }
  .tab-btn.next-tab {
    background: var(--warm);
    border-color: var(--warm);
    color: var(--text-on-ink);
  }
  .tab-content {
    margin-top: 14px;
  }
  .fulltext-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .fulltext-line {
    background: var(--ink-800);
    border: 1px solid var(--ink-700);
    border-radius: var(--radius);
    padding: 16px 18px;
  }
  .fulltext-line.hit {
    border-color: var(--warm);
    box-shadow: 0 0 0 1px var(--warm);
  }
  .fulltext-line .fo {
    font-family: 'Noto Serif KR', serif;
    font-size: 16px;
    line-height: 1.7;
    white-space: pre-line;
  }
  .fulltext-line .ft {
    font-size: 13.5px;
    color: var(--muted-on-ink);
    line-height: 1.6;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid var(--ink-700);
    white-space: pre-line;
  }

  .genre-card.disabled { opacity: 0.45; }
  ::selection { background: var(--accent); color: var(--ink-900); }
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="back-btn" id="backBtn">‹ 뒤로</button>
    <div class="crumb" id="crumb"></div>
    <div class="progress-dots" id="progressDots"></div>
  </header>
  <main id="main"></main>
</div>

  { id:'sangdaebyeolgok', genre:'경기체가', title:'상대별곡', author:'권근', era:'조선 전기',

      {orig:'各房拜 禮筆後 大廳齊座\n正其道 明其義 參酌古今 時政得失 民間利害 救弊條條\n위 狀上ㅅ 景 긔 엇더하니잇고\n(葉) 君明臣直 太平聖代 (×2) 위 從諫如流ㅅ 景 긔 엇더하니잇고', trans:'각 방에서 아침 인사가 끝난 후 대청에 가지런히 앉아\n도를 바로잡고 의를 밝히며 고금의 일을 참작하여, 정치의 득과 실과 민간의 이해에 관한 폐단을 조목조목 구제하여\n아, 서장으로 올리는 광경, 그것이 어떠합니까\n임금은 현명하고 신하는 충직한 태평성대 — 아, 임금이 신하의 직간을 자연스럽게 듣는 광경 그것이 어떠합니까'},
      {orig:'圓議後 公事畢 房主有司\n脫衣冠 呼先生 섯거안자 烹龍炮鳳 黃金醴酒 滿金臺盞\n위 勸上ㅅ 景 긔 엇더하니잇고\n(엽) 즐거온뎌 先任監察 (×2) 위 醉혼ㅅ 景 긔 엇더하니잇고', trans:'회의가 끝난 후 공무를 마치니, 방주 유사들이\n의관을 벗고 서로 선생이라 부르며 섞어 앉아, 진귀한 요리에 좋은 술을 잔에 가득 부어\n아, 권해 올리는 광경, 그것이 어떠합니까\n즐겁도다 선임감찰 — 아, 술에 취한 광경 그것이 어떠합니까'},

  { id:'gyuwonga', genre:'가사', title:'규원가', author:'허난설헌', era:'조선 중기',
    lines:[
      {orig:'엇그제 저멋더니 ᄒᆞ마 어이 다 늘거니. 少年行樂 생각ᄒᆞ니 일러도 속절업다. 늘거야 서른 말ᄉᆞᆷ ᄒᆞ자니 목이 멘다\n父生母育 辛苦ᄒᆞ야 이 내 몸 길러 낼 제, 公候配匹은 못 바라도 君子好逑 願ᄒᆞ더니, 三生의 怨業이오 月下의 緣分ᄋᆞ로 長安遊俠 輕薄子ᄅᆞᆯ ᄭᅮᆷᄀᆞᆮ치 만나 잇서\n當時의 用心ᄒᆞ기 살어름 디듸는 듯, 三五 二八 겨오 지나 天然麗質 절로 이니, 이 얼골 이 態度로 百年期約ᄒᆞ얏더니\n年光이 훌훌ᄒᆞ고 造物이 多猜ᄒᆞ야, 봄바람 가을 믈이 뵈오리 북 지나듯. 雪鬂花顔 어ᄃᆡ 두고 面目可憎되거고나. 내 얼골 내 보거니 어느 임이 날 괼소냐. 스스로 慚愧ᄒᆞ니 누구를 怨望ᄒᆞ리', trans:'엊그제 젊었더니 이미 어이 다 늙었는가. 어린 시절 즐거움을 생각하니 말해도 속절없다. 늙어서 서러운 말씀 하자니 목이 멘다\n부모님이 애써 길러 낼 때, 높은 벼슬아치의 배필은 못 바라도 군자의 좋은 짝을 원했더니, 삼생의 원업이요 월하의 인연으로 장안의 경박한 사내를 꿈같이 만나서\n당시에 마음 쓰기를 살얼음 디디는 듯, 열대여섯 살 겨우 지나 타고난 고운 자태 절로 이니, 이 얼굴 이 태도로 백년기약 하였더니\n세월이 빠르고 조물주가 시기하여, 봄바람 가을 물이 베올 사이 북 지나듯 (빠르게) 지나가네. 눈처럼 흰 살쩍과 고운 얼굴 어디 가고 남 보기 부끄러운 얼굴이 되었구나. 내 얼굴 내가 보아도 어느 임이 나를 사랑하리. 스스로 부끄러우니 누구를 원망하리 (기)'},
      {orig:'三三五五 冶遊園의 새 사람이 나단 말가. 곳 피고 날 저물 제 定處 업시 나가 잇어, 白馬 金鞭으로 어ᄃᆡ어ᄃᆡ 머무는고. 遠近을 모르거니 消息이야 더욱 알랴. 因緣을 긋쳐신들 ᄉᆡᆼ각이야 업슬소냐. 얼골을 못 보거든 그립기나 마르려믄\n열두 ᄯᅢ 김도 길샤 설흔 날 支離ᄒᆞ다. 玉窓에 심ᄀᆞᆫ 梅花 몃 번이나 픠여 진고. 겨울 밤 차고 찬 제 자최눈 섯거 치고, 여름날 길고 길 제 구ᄌᆞᆫ 비는 무스 일고. 三春花柳 好時節에 景物이 시름업다. 가을 ᄃᆞᆯ 방에 들고 蟋蟀이 床에 울 제, 긴 한숨 디ᄂᆞᆫ 눈물 속절업시 혬만 만타. 아마도 모진 목숨 죽기도 어려울사', trans:'삼삼오오 모여 다니는 놀이터에 새 사람이 났단 말인가. 꽃 피고 날 저물 때 정처없이 나가 있어, 백마 타고 금 채찍을 들고 어디 어디 머무는가. 멀고 가까운지를 모르는데 소식이야 더욱 알랴. 인연이 끊어져 있어도 생각이야 없을소냐. 얼굴을 못 보거든 그립기나 말면\n열두 때 길기도 긴데 서른 날은 지루하다. 옥창에 심은 매화 몇 번이나 피어 졌는가. 겨울 밤 차고 찬 때 눈은 섞어 치고, 여름날 길고 길 때 궂은 비는 무슨 일인가. 봄 한창 좋은 시절에 경물이 시름없다. 가을 달 방에 들고 귀뚜라미가 상에 울 때, 긴 한숨 지는 눈물 속절 없이 걱정만 많다. 아마도 모진 목숨 죽기도 어려울사 (승)'},
      {orig:'도로혀 풀쳐 혜니 이리 ᄒᆞ여 어이 ᄒᆞ리. 靑燈을 돌라 노코 綠綺琴 빗기 안아, 碧蓮花 한 곡조를 시름 조ᄎᆞ 섯거 타니, 瀟湘夜雨의 댓소리 섯도ᄂᆞᆫ ᄃᆞᆺ, 華表 千年의 別鶴이 우니ᄂᆞᆫ ᄃᆞᆺ, 玉手의 타는 手段 녯 소래 잇다마ᄂᆞᆫ, 芙蓉帳 寂寞ᄒᆞ니 뉘 귀에 들리소니. 肝腸이 九曲 되야 구븨구븨 ᄭᅳᆫ쳐서라', trans:'돌이켜 생각해 보니 이리 하여 어이 하리. 청등을 달아 놓고 가야금에 빗겨 앉아, 벽련화 한 곡조를 시름과 함께 섞어 타니, 소상야우의 댓소리가 섞여 도는 듯, 화표 천년의 별학이 우는 듯, 옥 같은 손이 타는 솜씨는 옛 가락이 그대로 있다마는, 부용장이 적막하니 누구 귀에 들릴까. 간장이 구곡이 되어 굽이굽이 끊어질 듯 애통하구나 (전)'},
      {orig:'ᄎᆞᆯ하리 잠을 드러 ᄭᅮᆷ의나 보려 ᄒᆞ니, 바람의 디ᄂᆞᆫ 닢과 풀 속에 우는 즘생, 무스 일 원수로서 잠조차 ᄭᅢ오ᄂᆞᆫ다. 天上의 牽牛織女 銀河水 막혀서도, 七月 七夕 一年一度 失期치 아니거든, 우리 님 가신 후는 무슨 弱水 가렷관듸, 오거나 가거나 消息조차 ᄭᅳ쳣는고\n欄干의 비겨 셔서 님 가신 ᄃᆡ 바라보니, 草露ᄂᆞᆫ 맷쳐 잇고 暮雲이 디나갈 제, 竹林 푸른 고ᄃᆡ 새 소리 더욱 설다. 세상의 서룬 사람 수업다 ᄒᆞ려니와, 薄命ᄒᆞᆫ 紅顔이야 날 가ᄐᆞ니 ᄯᅩ 이실가. 아마도 이 님의 지위로 살동말동 ᄒᆞ여라', trans:'차라리 잠을 들어 꿈에나 보려 하니, 바람에 지는 잎과 풀 속에 우는 짐승, 무슨 일 원수로서 잠조차 깨우는가. 천상의 견우직녀 은하수 막혀서도, 칠월칠석 일 년에 한 번 기회를 놓치지 않거든, 우리 님 가신 후는 무슨 약수가 가렸길래, 오거나 가거나 소식조차 그쳤는가\n난간에 빗겨 서서 님 가신 데 바라보니, 이슬은 맺혀 있고 구름이 지나갈 때, 죽림 푸른 곳에 새 소리가 더욱 서럽다. 세상에 서러운 사람 수없다 하려니와, 박복한 미인이야 나 같은 사람이 또 있을까. 아마도 이 님의 지위로 살동말동 하여라 (결)'}

  { id:'gyeonyeoga', genre:'가사', title:'계녀가', author:'작자 미상', era:'조선 후기',
    lines:[
      {orig:'아해야 들어봐라 내 본래 소루(疏漏)하야 범사(凡事)에 등한(等閒)하고 자녀지정(子女慈情) 바이 없어 오남매 너 하나를 십칠년 생장토록 일언반사(一言半事) 교훈없이 자행자재(自行自長) 길렀으니 견문이 바이 없어 일무가관(一無可觀) 되었으니\n연기장생(年紀長生)하였으며 매작(媒妁)이 구혼하니 울산산성 엄씨댁에 길연(吉緣)이 거리런가 문벌도 좋거니와 가법이 장할시고 층층분(層層分) 인심인물 뉘 아니 칭찬하리 사심이 과흡(過冾)하야 일언에 결낙(決諾)이라\n무오지월(戊午年) 염유일(念六日)에 도요지절(挑夭之節) 되었구나 전안청(奠雁廳) 빈주석(賓主席)에 현서(賢壻)를 맞아보니 표연한 저 거동이 계군(鷄群)에 서봉(瑞鳳)일세 심중두제(沈中愷悌) 군자태(君子態)요 고명현달(功名顯達) 부귀상(富貴相)이 택서고망(擇壻高望) 맞혔으니 의기가인(宜其家人) 어찌할가\n내 염에 생각하니 좋은 중에 걱정이라 너 비록 미거하나 자질이 방사하니 교훈이나 하여볼가 오날날 하난 말이 너희 듣기 꿈 같으나 인성이 본선하니 깨쳐나면 되나니라', trans:'아이야 들어봐라 내 본래 엉성하여 매사를 등한시하고 자녀에 대한 애정이 별로 없어 오남매 중 너 하나를 열일곱 해 기르도록 변변한 가르침 없이 제멋대로 자라게 했으니 견문이 전혀 없어 하나도 볼만한 것이 없으니\n나이를 먹고 자라 중매인이 구혼하니 울산산성 엄씨댁에 좋은 인연이 걸렸던지 문벌도 좋거니와 집안 법도도 훌륭하구나 여러 어른들이 칭찬하지 않는 사람이 없다 내 생각에 흡족하여 한 번에 허락했다\n무오년 염유일에 혼인할 때가 되었구나 식장의 손님과 주인 자리에서 어진 사위를 맞아보니 표연한 저 거동이 닭중에 봉황이로구나 침착하고 화평하며 즐거운 군자의 태도요 공을 세워 명망이 높아 귀하게 될 상이 택서고망 맞혔으니 신부는 어떨까\n속으로 생각하니 좋은 중에 걱정이다 네가 비록 사리가 어둡지만 본성이 무던하니 교훈이나 해 볼까 오늘날 하는 말이 너희 듣기 꿈 같겠지만 인성이 본래 선하니 깨우치면 되느니라'},
      {orig:'고사에 실린 말삼 역력히 있건마는 장황하여 다 못하고 대강으로 기록하니 자세히 들어두고 명심하야 잊지마라 태임(太姙)태사 착한 사적 만고에 유훈이요 그 남은 유자군자 여자 중에 몇몇인고 지금도 짐작하면 옛사람뿐이로다\n인문이 생긴 후에 오륜이 쫒아나니 규중에 여자로서 다 알 수야 있나마는 칠거지악(七去之惡) 옛법이라 삼종지도(三從之道) 모를소냐 그 중에 사친지도(事親之道) 백행중에 으뜸이라 효자의 애일지심(愛日之心) 백년이 순식이니 순식간 사친사를 일시인들 잊을소냐', trans:'고사에 실린 말씀 역력히 있건마는 장황하여 다 못하고 대강으로 기록하니 자세히 들어두고 명심하여 잊지마라 태임태사의 착한 행적은 만고에 전해진 가르침이요 그 외의 숨은 군자가 여자 가운데 몇이나 있겠는가 지금도 생각해보면 옛사람 뿐이로다\n문화가 생긴 후에 오륜이 이어 생겼으나 규중의 여자로서 다 알 수야 있냐마는 칠거지악과 삼종지도를 모를소냐 그중에 부모를 모시는 도리는 모든 행동 중에 으뜸이다 효자의 애일지심 백년이 잠깐이니 순식간의 부모님 모시는 생각을 잠시라도 잊을소냐'},
      {orig:'온공(溫恭)히 뜻을 두고 지성으로 봉양하되 혼정지성(昏定之省) 석달 사친 대체로 하련마는 사질이 있으나마 냉철없이 있지 말고 자주자주 나아가서 기운을 살핀 후에 안색을 화케하며 소릴르 낮초와서 문안을 드린 후에 음식을 묻자오며 잠죽히 기달려서 묻난 말삼 대답하고\n음식을 공궤(供饋)하되 구미를 맞초와서 찾기를 기대말고 때 맞초와 드리오며 없다는 칭탁(稱託) 마라 성효(誠孝)가 지성하면 얼음 속에 잉어 나고 설중에 죽순이라 의복을 받아오되 한서를 살펴봐서 철철이 때를 찾아 생각 전에 바치오며 품 맞고 길이 맞고', trans:'온순하게 공경하기에 뜻을 두고 지성으로 봉양하되 아침저녁 문안인사를 세 달은 대체로 하련마는 사정이 있어도 깜빡 잊지 말고 자주자주 나아가서 기운을 살핀 후에 안색을 화하게 하며 소리를 낮춰서 문안을 드린 후에 음식을 드실지 여쭙고 말없이 기다려서 묻는 말씀 대답하고\n음식을 바치되 입맛에 맞춰서 찾기를 기대 말고 맞춰 드리며 없다는 핑계 마라 참된 효성이 지극하면 얼음 속에 잉어나고 눈 속에서 죽순이 오른다 의복을 드릴 때 덥고 추움을 살펴 봐서 철철이 때를 찾아 찾으시기 전에 바치오며 품 맞고 길이 맞고'},
      {orig:'일념에 조심하고 기운이 첨상(添傷)되야 황황한 이 모양이 주야에 전읍이라 잠시도 잊지말고 탕로를 친집(親執)하며 급한중 정신차려 약물을 조심하라 효성이 극진하면 복상(復常)이 쉽사오니 복상이 되신 후에 평시와 가깝거든 안색도 화케하며 몸수렴도 하나니라', trans:'진심으로 조심하여라 기운이 쇠약해져 병이 생기시면 당황하는 모습으로 밤낮으로 걱정하며 울어라 잠시도 잊지 말고 탕약 화로를 손수 들고 일하고 급한 중 정신차려 약을 조심하라 효성이 극진하면 회복이 쉽게 되니 회복이 되신 후에 평소 상태와 같거든 안색도 좋게 하며 몸치장도 하느니라'},
      {orig:'시키신 일 있삽거든 물러가 진작하되 동동촉촉 조심하야 하다가 의심커든 다시금 사려하되 불안키 알지말고 자망(自妄)으로 하지마라 내 난 것이 자망이요 내 난 것이 병통이라 먹던 술도 떨어지니 아난 길을 물어 가라 꾸중이 나리거든 황급히 들어보면 무비 다 교훈이라\n교훈없이 사람되리 옳다고 발명말고 그르거된 자죄하되 속속히 개과하여 두 번 허물 짓지마라 한두 번 글러지면 옳던 일도 글러지고 한두 번 옳은 뒤난 용서가 쉬우니라 하해 같은 자정으로 더구나 감격하야 다시금 조심하라', trans:'시키신 일 있거든 물러가 진작 하되 동동촉촉 조심하여 하다가 의심이 나거든 다시금 여쭈어보되 죄송하게 생각 말고 버릇없이 잘난 체하지 마라 내는 것이 잘난 체요 내는 것이 병통이라 먹던 숟가락도 떨어지니 아는 길을 물어 가라 꾸중을 하시거든 황급히 들어보면 그것이 다 교훈이다\n교훈없이 사람되리 옳다고 변명하지 말고 그르거든 반성하되 속속히 개과하여 두 번 잘못하지마라 한 두 번 잘못하면 옳던 일도 글러지고 한두 번 옳은 뒤엔 용서받기 쉬우니라 하해같은 마음으로 사랑을 하시거든 더욱 감격하여 다시금 조심해라'},
      {orig:'쓰시난 기물 등도 애중히 녀기거된 하물며 친동기야 부모일신 갈랐으니 그 아니 친애할까 소소한 일 허물 말고 내 도리다 극진하면 남이라도 화합커든 동기야 이를손가 형제가 기흡(旣翕)하면 화락차심(和樂且湛) 하나니라\n인간애 우애보전 내간에도 매였으니 우애가 끊어지면 화기가 다시 없어 가도가 부재하면 그 아니 한심하리 일척포(一尺布) 일승곡(一升穀)을 있난대로 갈라하고 우애만 생각하니 재물을 의론마라 재물 끝에 의 상하면 형제가 남과 같다 천륜으로 생긴 우애 나날이 솟아나니 형우제공(兄友弟恭) 각각하면 목족(睦族)도 되려니와 차차로 추원(追遠)하면 봉선지심(奉先之心) 절로 난다', trans:'쓰시는 물건 등도 소중히 여기거든 하물며 형제간이야 한 부모 몸에서 났으니 그 아니 친애할까 소소한 일 허물 말고 내 도리를 극진히 하면 남이라도 화합하거든 형제간이야 이를 말인가 형제가 의가 좋으면 희락하고 즐거우니라\n인간의 우애 보전이 집안 여자에게도 달려 있으니 우애가 끊어지면 화기가 다시 없어 집안의 법도가 부재하면 그 아니 한심하리 적은 베와 적은 곡식도 있는 대로 나누어 갖고 우애만 생각하고 재물을 따지지 마라 재물 끝에 의가 상하면 형제가 남과 같다 천륜으로 생긴 우애 나날이 솟아 나니 형우제공 각각 하면 일가가 화목해지려니와 차차로 조상을 따르면 존경하는 마음이 절로 난다'},
      {orig:'예수를 다 알소냐 칭가유무(稱家有無) 형세대로 제일이 당하거던 전기에 조심하야 의복을 씻어 입고 제계를 정히 하되 부정지색 보지말며 부정지성 듣지말고 각자가 제수등물(祭需等物) 정결토록 조심하야 한가지나 잊을세라 차차로 생각하야 정성이 지극하고 군고초창 그 가운데 신도가 흠향하고 여음이 있나니라', trans:'예절을 다 알소냐 집안 살림의 형편대로 제삿날이 되거든 미리 조심하여 의복을 씻어 입고 제계를 정히 하되 부정한 색을 보지 말며 부정한 소리를 듣지 말고 온갖 제사에 쓰는 음식들은 정결하도록 조심하여 한가지나 잊을세라 차차로 생각하여 정성이 지극하면 향불이 타오르는 가운데 혼령이 제물을 받고 조상이 베푸는 복이 있느니라'},
      {orig:'조선의 기친 문호 그 아니 극중한가 문호를 수호하여 접빈객 길할세라 의당에 통지 있어 손님이 오시거든 없다고 눈속말고 있난 것 사념마라 반가음 볼지라도 조심을 다시 하여 반찬이 유무간에 먹도록 대접하면 돌아가 공론인사(公論人事) 손님이 돌아가 하는 말이 아모집 아모댁이 안흠세도 없거니와 밖에서 생색이라', trans:'조상이 물려주신 집안 중요하지 않겠는가 집안을 수호하여 손님 대접을 잘해라 외당이 연락이 있어 손님이 오시거든 없다고 눈속임 말고 있는 것 아끼지 마라 밥상에 음식을 차릴 때도 조심을 다시 하여 반찬이 있건 없건 먹도록 대접하면 손님이 돌아가 하는 말이 어느 집 어느 부인이 허물도 없다고 밖에서 자랑한다'},
      {orig:'접빈객 하자하면 사령없이 되겠나냐 비복은 사령이라 수족과 같으니라 귀천이 다르나마 그도 또한 현육이니 살뜩이 거두우되 은위를 병시하라 위엄이 지중하면 충성이 전로 없고 은애를 과히하면 버릇없기 쉬우니라\n의식을 살펴보와 기한이 없게 하며 의심커던 쓰지마라 시킨 후에 의심마라 양반이 의심하면 속을 뜨나니라 죄가 있어 꾸짖어도 사정을 촌탁(忖度)하여 위령을 세우나마 의리를 타이르면 감복도 하려니와 위우가 없나니라', trans:'손님 대접을 하려고 하면 심부름꾼 없이 되겠느냐 남녀 종은 심부름꾼이라 수족과 같으니라 귀천이 다르지만 노비도 또한 한 식구와 같으니 알뜰이 거두되 은혜와 위엄을 동시에 베풀어라 위엄이 지중하면 충성이 절로 없고 은정과 애정을 과히 하면 버릇 없기 쉬우니라\n입고 먹는 것을 살펴 주어 배고픔과 추위가 없게 하며 의심이 들거든 쓰지 마라 시킨 후에 의심 마라 양반이 의심하면 속이는 마음을 갖느니라 죄가 있어 꾸짖어도 사정을 알아보고 위엄을 세워서 의리로 타이르면 감복도 하려니와 뒤탈이 없고 근심이 없느니라'},
      {orig:'인간에 대부귀난 운수에 관계하나 안치산(內治産) 잘못하면 손해가 없을소냐 근검이 으뜸이나 일봐가며 할 것이며 절용이 좋다해도 쓸 때야 안 쓸쏘냐 범백을 요량하야 중도에 맞게하라 못할 일을 한다하면 남에게 천히 뵈고 쓸 데를 아니 쓰면 남에게 득담한다 조선의 세전지업 한푼인들 허비하며 근로이 지은 농사 한 알인들 허용할까\n직임조순 주식제의 여자의 본사로다 치산에 쓰난 기물 제 자리에 정해 두고 문호를 단속하며 실당을 정히 하라', trans:'인간의 부귀는 운수에 달렸지만 안살림을 잘못하면 손해가 없겠는가 근검이 으뜸이나 일을 봐가며 할 것이며 절약이 좋다 해도 쓸 때에 안 쓸소냐 온갖 일을 생각하여 적당히 알맞게 해라 못할 일을 한다 하면 남에게 천히 보이고 쓸 데를 아니 쓰면 남에게 말을 듣는다 조상들이 물려 주신 가업 한 푼인들 허비하며 성실하게 지은 농사 한 톨인들 낭비할까\n비단·명주를 직조하고 먹고 마시고 제사 지내는 일은 여자의 본래 일이로다 치산(살림)에 쓰는 기물은 제자리에 바로 두고 대문과 창호를 단속하며 방과 마루를 깨끗이 해라'},
      {orig:'여인주조 할지라도 언어를 조심하라 남의 흉이 한 가지면 내 흉이 몇 가지냐 착한 사람 본을 받고 흉한 사람 경계하면 그 중에 사장 있어 내 사람 느나니라 부녀의 본 성품이 편협하기 쉽사오니 일시에 못 참은 말 후회한들 미칠소냐 참기를 위주하고 속 너르기 힘을 써라 차차로 행해가면 그것도 공부되어 천성도 고치거던 허물이야 짓겠느냐\n매사를 당하거던 식사를 하지 말고 진정으로 하여라 식사는 헛일이라 남부터 먼저 아니 무색하기 측량있나 기름이 좋다하나 기름 끝에 흉이 있고 훼언이 설다해도 그것이 사장이라 훼언 듣고 자책하면 내 허물 내 알아서 다디사 명심하면 훼언이 예언되네', trans:'남과 이야기할지라도 언어를 조심해라 남의 흉이 한 가지면 내 흉이 몇가지냐 착한 사람 본을 받고 흉한 사람 경계하면 그 중에 스승이 있어 내 사람됨이 는다 부녀의 본 성품이 편협하기 쉬우니 일시에 못참은 말 후회한들 뭐하느냐 참기를 위주로 하고 속 넓히기에 힘을 써라 차차로 행해가면 그것도 공부되어 천성도 고치거든 잘못이야 저지를까\n매사에 거짓말을 하지 말고 진정으로 해라 거짓말은 헛일이다 남부터 먼저 알아차리니 부끄럽기 한이 없다 칭찬이 좋다 하나 칭찬 끝에 흉이 있고 헐뜯는 말이 서운하다 하지만 그것이 스승이 된다 헐뜯는 말 듣고 자책하면 내 잘못 내가 알아서 다시금 명심하면 꾸짖는 말이 칭찬이 된다'},
      {orig:'부녀 소리 높이하면 가도가 불길하니 빈계신명(牝鷄晨鳴) 옛 경계는 규범에 관계되니 진선진미 못할망정 유순하기 으뜸이라 주궁휼빈(周窮恤貧)하난 도와 시혜보은(施惠報恩)하난 일이 옛부터 적선지가(積善之家) 차례로 규범있어 어른의 할 탓이라 네게야 관계있나\n봉양군자(奉養君子)하난 도와 교양자녀 하난 법은 너의 듣기 수괴하야 아즉이야 다 못할다 너 사람 무던하니 허다한 경계지언(警戒之言)이 이만이만뿐이로다', trans:'여자의 소리가 크면 가문의 법도가 불길하니 암탉이 새벽에 운다는 옛 경계의 말은 부인의 도리에 관계되어 진선진미를 못할망정 유순하기가 으뜸이다 궁하고 가난한 것을 도와주는 것과 은혜를 베풀고 은혜를 갚는 것이 예부터 좋은 일을 많이 한 집이 차례로 규범이 있어서 어른이 할 일이다 그러니 그것이 너와 관계가 있겠느냐\n남편을 받들고 자녀를 교양 있게 하는 법은 네가 듣기 부끄러워하여 아직 다 못하겠다 네가 사람이 무던하니 허다한 경계하여 가르치는 말은 이만하겠다 (결어)'}
    ],
    summary:{
      theme:'시집가는 딸에게 부모가 사구고·화형제·봉제사·접빈객·어비복·치산·언행 등 가정에서 지켜야 할 부덕(婦德)을 조목조목 가르치는 교훈 가사(계녀가류)',
      features:['화자(친정 부모)가 딸에게 직접 말을 건네는 대화체 형식 — 혼인 배경(서사)으로 시작해 8개 항목(사구고·화형제·봉제사·접빈객·어비복·치산·여공·행신)을 차례로 훈계',
   '사친지도(부모 봉양)를 백행의 으뜸으로 제시하며 칠거지악·삼종지도 등 유교적 여성 규범을 직접 근거로 제시',
   '결어에서 "봉양군자·교양자녀"는 부끄러워 다 말하지 못하겠다며 말을 아끼는 점이 다른 계녀가류와 구별되는 특이점'],
      examPoints:['계녀가류 가사(교훈가사)의 대표적 특징 — 항목을 나열하며 구체적 행동 지침을 제시하는 서술 방식을 <용부가>(반면교사 방식)·<복선화음가>(대조적 인물담 방식)와 비교해둘 것',

  { id:'seonsangtan', genre:'가사', title:'선상탄', author:'박인로', era:'조선 중기',
    lines:[
      {orig:'늘고 病든 몸을 舟師로 보ᄂᆡ실ᄉᆡ, 乙巳 三夏애 진동영 ᄂᆞ려오니, 關防重地예 炳이 깁다 안자실랴. 一長劒 비기 ᄎᆞ고 兵船에 구테 올나, 勵氣瞋目ᄒᆞ야 對馬島을 구어보니 ᄇᆞ람 조친 黃雲은 遠近에 사혀 잇고. 아득ᄒᆞᆫ 滄波ᄂᆞᆫ 긴 하ᄂᆞᆯ과 ᄒᆞᆫ 빗칠쇠', trans:'늙고 병든 몸을 주사(수군을 통솔하는 벼슬)로 보내셔서, 을사년 여름에 진동영에 내려오니, 변방의 중요한 요새지에서 병이 깊다고 앉아있을소냐. 일장검을 빗겨 차고 병선에 구태여 올라, 기운을 떨치고 눈을 부릅떠 대마도를 굽어보니 바람 따르는 황운(전란의 상처)은 멀고 가까이 쌓여 있고, 아득한 물결은 먼 하늘과 한 빛이로구나 (서사)'},
      {orig:'船上에 徘徊ᄒᆞ며 古今을 思憶ᄒᆞ고, 어리미친 懷抱애 軒轅氏를 애ᄃᆞ노라. 大洋이 茫茫ᄒᆞ야 天地예 둘려시니, 진실로 ᄇᆡ 아니면 風波萬里 밧긔, 어ᄂᆡ 四夷 엿볼넌고. 무ᄉᆞᆷ 일 ᄒᆞ려 ᄒᆞ야 ᄇᆡ 못기를 비롯ᄒᆞᆫ고. 萬世千秋에 ᄀᆞ업ᄉᆞᆫ 큰 弊 되야, 普天之下애 萬民怨 길우ᄂᆞ다', trans:'선상에서 배회하며 고금을 생각하고, 어리석고 미친 듯한 마음에 배를 처음 만든 헌원씨를 원망하노라. 대양이 아득하여 천지에 둘려 있으니, 진실로 배가 아니면 풍파 이는 만리 밖에서 어느 오랑캐가 우리나라를 엿볼 것인가. 무슨 일 하려고 배 만들기를 시작했는고. 만세 천추에 끝없는 큰 폐단이 되어 온 세상에 만백성의 원한을 길렀는가 (본사1, 배를 처음 만든 헌원씨를 원망함)'},
      {orig:'어즈버 ᄭᆡᄃᆞ라니 秦始皇의 타실로다. ᄇᆡ 비록 잇다 ᄒᆞ나 倭를 아니 삼기던들, 日本 對馬島로 뷘 ᄇᆡ 졀로 나올넌가. 뉘 말을 미더 듯고, 童男童女를 그ᄃᆡ도록 드려다가, 海中 모든 셤에 難當賊을 기쳐 두고, 痛憤ᄒᆞᆫ 羞辱이 華夏애 다 밋나다\n長生不死藥을 얼ᄆᆡ나 어더 ᄂᆡ여, 萬里長城 놉히 사고 몃 萬年을 사도ᄯᅥᆫ고. ᄂᆞᆷᄃᆡ로 죽어가니 有益ᄒᆞᆫ 줄 모ᄅᆞ로다. 어즈버 ᄉᆡᆼ각ᄒᆞ니 徐市 等이 已甚ᄒᆞ다. 人臣이 되야셔 亡命도 ᄒᆞᄂᆞᆫ 것가. 神仙을 못 보거든 수이나 도라오면, 舟師 이 시럼은 전혀 업게 삼길럿다', trans:'아, 생각하니 진시황의 탓이로다. 배가 비록 있다 하나 왜적을 만들지 않았다면 일본 대마도로부터 빈 배가 절로 나왔을 것인가. 누구 말을 믿어 듣고 동남동녀를 그곳으로 데려다가, 바다 가운데 모든 섬에 감당하기 어려운 도적을 남겨 두어, 분한 수치와 모욕이 중국에까지 미치게 하였는가\n불로장생약을 얼마나 얻어내어 만리장성을 높이 쌓고 몇 만 년을 살려 했던고. 남처럼 죽어가니 유익한 줄 모르겠도다. 아, 생각하니 서불의 무리가 너무 심한 짓을 했다. 신하의 몸으로 망명한 것인가. 신선을 못 만나거든 쉬이나 돌아왔으면 주사의 이 시름은 전혀 없었을 것을 (본사2, 왜적이 생기게 한 진시황과 서불을 원망함)'},
      {orig:'두어라, 旣往不咎라 일너 무엇ᄒᆞ로소니. 속졀업ᄉᆞᆫ 是非를 후리쳐 더뎌 두쟈. 潛思覺悟ᄒᆞ니 내 ᄯᅳᆺ도 固執고야. 皇帝作舟車ᄂᆞᆫ 왼 줄도 모ᄅᆞ로다. 張翰 江東애 秋風을 만나신들 扁舟 곳 아니 타면, 天淸海闊ᄒᆞ다 어ᄂᆡ 興이 절로 나며, 三公도 아니 밧골 第一江山애 浮萍 ᄀᆞᆺᄒᆞᆫ 漁父生涯을 一葉舟 아니면, 어ᄃᆡ 부쳐 ᄃᆞᆫ힐ᄂᆞᆫ고', trans:'두어라, 기왕불구(지나간 일은 어찌할 수 없다)라 일러 무엇하리. 속절없는 시비는 후리쳐 던져 두자. 곰곰이 생각하고 깨달으니 내 뜻도 고집스럽구나. 황제가 배와 수레를 만든 것이 그른 줄도 모르겠도다. 장한이 강동에서 가을바람을 만난들 작은 배를 아니 타면 맑은 하늘 넓은 바다에 어찌 흥이 절로 나며, 삼공 벼슬과도 아니 바꿀 제일강산에서 부평 같은 어부 생애를 일엽편주 아니면 무엇에 의탁하여 다닐 것인가 (본사3, 자연을 즐기는 수단으로서의 배의 가치를 생각)'},
      {orig:'일언 닐 보건ᄃᆡᆫ, ᄇᆡ 삼긴 制度야 至妙ᄒᆞᆫ 덧ᄒᆞ다마ᄂᆞᆫ, 엇디ᄒᆞᆫ 우리 물은 ᄂᆞᄂᆞᆫ ᄃᆞᆺᄒᆞᆫ 板屋船을 晝夜의 빗기 ᄐᆞ고, 臨風詠月호ᄃᆡ 興이 전혀 업ᄂᆞᆫ게오. 昔日 舟中에ᄂᆞᆫ 杯盤이 狼藉터니 금일 주중에는 大劒長槍ᄲᅮᆫ이로다. ᄒᆞᆫ 가지 ᄇᆡ 언마ᄂᆞᆫ 가진ᄇᆡ 다라니, 期間 憂樂이 서로 ᄀᆞᆺ지 못ᄒᆞ도다', trans:'이런 일을 보니 배 만든 제도야 지극히 묘한 듯하다마는, 어찌 우리 무리는 나는 듯한 판옥선을 밤낮으로 빗겨 타고 바람 쐬며 달을 읊되 흥이 전혀 없는 것인가. 옛날 배 안에는 술상이 어지럽게 흩어졌더니 오늘날 배 안에는 큰 칼과 긴 창뿐이로다. 같은 배이건마는 가진 바가 다르니, 그 사이 근심과 즐거움이 서로 같지 못하도다 (본사4, 과거와 달리 배가 전쟁의 수단으로 쓰이고 있음)'},
      {orig:'時時로 멀이 드러 北辰을 ᄇᆞ라보며, 傷時 老淚ᄅᆞᆯ 天一方의 디이ᄂᆞ다. 吾東方 文物이 漢唐宋애 디랴마ᄂᆞᆫ, 國運이 不幸ᄒᆞ야 海醜 兇謀애 萬古羞을 안고 이셔, 百分에 ᄒᆞᆫ 가지도 못 시셔 ᄇᆞ려거든, 이 몸이 無狀ᄒᆞᆫᄃᆞᆯ 臣子ㅣ 되야 이셔다가, 窮達이 길이 달라 몬 뫼ᄋᆞᆸ고 늘거신ᄃᆞᆯ, 憂國 丹心이야 어ᄂᆡ 刻애 이즐넌고', trans:'시시로 머리 들어 북신(임금 계신 곳)을 바라보며, 시절을 근심하는 늙은이의 눈물을 하늘 한 모퉁이에 떨어뜨린다. 우리나라 문물이 한·당·송나라에 뒤지랴마는, 국운이 불행하여 왜적의 흉악한 꾀에 빠져 만고의 수치를 안고 있어, 백에 한 가지도 씻지 못하고 있거든, 이 몸이 변변찮으나마 신하가 되어서, 신분이 달라 임금을 모시지 못하고 늙었은들, 나라를 걱정하는 충심이야 어느 때에 잊을 것인가 (본사5, 임진왜란의 치욕과 우국단심)'},
      {orig:'慷慨 계운 壯氣ᄂᆞᆫ 老當益壯ᄒᆞ다마ᄂᆞᆫ, 됴고마ᄂᆞᆫ 이 몸이 病中에 드러시니, 雪憤伸寃 어려올 ᄃᆞᆺ ᄒᆞ건마ᄂᆞᆫ, 그러나, 死諸葛도 生中達을 멀리 좃고, 발 업ᄉᆞᆫ 孫賓도 龐涓을 잡아거든, ᄒᆞ믈며 이 몸은 手足이 ᄀᆞ자 잇고 命脈이 이어시니, 鼠竊狗偸을 저그나 저흘소냐. 飛船에 ᄃᆞᆯ려드러 先鋒을 거치면, 九十月 霜風 落葉가치 헤치리라. 七縱七禽우린ᄃᆞᆯ 못ᄒᆞᆯ 것가', trans:'강개를 못 이기는 씩씩한 기운은 늙을수록 더욱 씩씩하다마는, 조그마한 이 몸이 병중에 들었으니, 분을 씻고 원통함을 풀기 어려울 듯하건마는, 그러나 죽은 제갈량도 살아있는 사마의를 멀리 쫓고, 발 없는 손빈도 방연을 잡았거든, 하물며 이 몸은 손발이 온전히 있고 목숨이 붙어 있으니 좀도둑 같은 왜적을 조금인들 두려워하겠는가. 날랜 배에 달려들어 선봉을 거치면 구시월 서릿바람에 낙엽같이 헤치리라. 칠종칠금을 우리라고 못 할 것인가 (본사6, 왜적을 물리치겠다는 결의와 의지)'},
      {orig:'蠢彼島夷들아 수이 乞降ᄒᆞ야ᄉᆞ라. 降者 不殺이니 너를 구ᄐᆡ 殲滅ᄒᆞ랴. 吾王 聖德이 欲竝生ᄒᆞ시니라. 太平天下에 堯舜 君民 되야 이셔, 日月光華ᄂᆞᆫ 朝復朝 ᄒᆞ얏거든, 戰船 ᄐᆞ던 우리 몸도 魚舟에 唱晩ᄒᆞ고, 秋月春風에 놉히 베고 누어 이셔, 聖代 海不揚波ᄅᆞᆯ 다시 보려 ᄒᆞ노라', trans:'꿈틀거리는 섬 오랑캐들아 어서 항복하여라. 항복한 자는 죽이지 않으니 굳이 너를 섬멸하랴. 우리 임금의 성덕이 함께 살기를 바라시니라. 태평천하에 요순 시절 임금과 백성이 되어, 해와 달 같은 임금의 성덕은 아침마다 다시 밝게 비치거든, 전선 타던 우리 몸도 고기잡이배에서 늦도록 노래하고, 가을 달 봄바람에 높이 베고 누워, 태평성대에 바다가 잔잔함을 다시 보려 하노라 (결사, 평화 공존의 의지와 태평성대에 대한 바람)'}
    ],
    summary:{
      theme:'임진왜란 직후 병선을 타고 대마도를 바라보며 전쟁에 대한 한탄과 우국충정, 평화에 대한 염원을 노래함',
      features:['전쟁 가사의 대표작 — 배(舟)를 매개로 시상을 전개','헌원씨(배를 처음 만듦)·진시황과 서불(왜적의 기원)·제갈량·손빈 등 중국 고사를 인용하는 용사(用事)의 수사법이 두드러짐','전쟁 전후 \'배\'의 쓰임 변화(풍류의 수단→전쟁의 수단)를 대조해 비애를 드러냄'],
      examPoints:['우국충정과 화자 개인의 늙고 병든 처지가 결합된 정서를 <관동별곡>의 연군지정과 비교해둘 것','결사에서 왜적에 대한 항복 권유와 평화 공존의 의지로 마무리되는 구조(적개심→평화 기원)의 전환을 확인','한문투 문장과 고사 인용이 많다는 점이 박인로 가사의 특징이자 단점으로도 언급됨','전선(戰船)과 어주(漁舟)·일엽주(고깃배) 이미지의 대비를 통해 전쟁 이전의 풍류와 전쟁의 참혹함을 대조하는 구조를 확인해둘 것']
    }},
  { id:'nonggawollyeongga', genre:'가사', title:'농가월령가', author:'정학유', era:'조선 후기',
    lines:[
      {orig:'정월은 맹춘(孟春)이라 입춘(立春) 우수(雨水) 절기로다. 산중 간학에 빙설은 남았으나 평교 광야에 운물이 변하도다\n어와 우리 성상 애민중농하오시니 간측하신 권농 윤음 방곡에 반포하니 슬프다 농부들아 아무리 무지한들 네몸 이해 고사하고 성의를 어길소냐\n산전수답 상반하여 힘대로 하오리라 일년 흉풍은 측량하지 못하여도 인력이 극진하면 천재는 면하리니 제각각 근면하여 게을리 굴지 마라', trans:'정월은 초봄이라 입춘, 우수 절기로다. 산속 골짜기에 빙설은 남았으나 넓은 들판에는 구름과 만물의 기운이 변하는구나\n어와 우리 임금님이 백성을 사랑하고 농사를 중히 여기시니, 간곡하신 권농 윤음을 방방곡곡에 반포하니 — 슬프다 농부들아, 아무리 무지한들 네 몸 이해는 따지지 말고 성상의 뜻을 어길 것이냐\n밭과 논을 가려 힘대로 농사지으리라. 한 해의 풍흉은 헤아리지 못해도 사람의 힘을 다하면 하늘의 재앙은 면하리니, 저마다 부지런히 하여 게으르게 굴지 마라'},
      {orig:'일년지계 재춘하니 범사를 미리하라 봄에 만일 실시하면 종년일이 낭패되네\n농기를 다스리고 농우를 살펴 먹여 재거름 재워 놓고 한편으로 실어 내니 보리밭에 오줌치기 작년보다 힘써 하라\n늙은이 근력 없어 힘든 일은 못하여도 낮이면 이엉 엮고 밤이면 새끼 꼬아 때 맞게 집 이으면 큰 근심 덜리로다. 실과 나무 보굿 깎고 가지 사이 돌 끼우기 정조날 미명시에 시험조로 하여 보자', trans:'한 해의 계획은 봄에 있으니 모든 일을 미리 하라. 봄에 만일 때를 놓치면 한 해가 다 가도록 낭패를 보네\n농기구를 손질하고 소를 잘 먹여 살펴, 두엄을 재워 놓고 한편으로 실어 내니, 보리밭에 오줌 거름 주기를 작년보다 힘써 하라\n늙은이는 근력이 없어 힘든 일은 못해도, 낮에는 지붕 이엉을 엮고 밤에는 새끼를 꼬아 때맞게 지붕을 이으면 큰 근심을 덜 것이다. 과일나무 껍질 벗기고 가지 사이에 돌 끼우기를 정월 초하루 이른 새벽에 시험 삼아 해 보자'},
      {orig:'며느리 잊지 말고 소국주 밑하여라. 삼춘 백화시에 화전 일취하여 보자. 상원날 달을 보아 수한을 안다하니 노농의 징험이라 대강은 짐작느니\n정초에 세배함은 돈후한 풍속이라. 새 의복 떨쳐 입고 친척 인리 서로 찾아 남녀노소 아동까지 삼삼오오 다닐 적에 와삭버석 울긋불긋 물색이 번화하다\n사내아이 연날리기 계집아이 널뛰기요, 윷놀아 내기하니 소년들 놀이로다. 사당에 세알하니 병탕에 주과로다', trans:'며느리는 잊지 말고 소국주(봄술)를 담가라. 늦봄 온갖 꽃 필 때에 화전을 부쳐 한번 취해 보자. 정월 대보름날 달을 보아 그해 홍수와 가뭄을 안다 하니 — 늙은 농부의 경험이라 대강은 짐작하느니\n정초에 세배하는 것은 인정 두터운 풍속이다. 새 옷을 차려입고 친척과 이웃을 서로 찾아, 남녀노소 아이들까지 삼삼오오 다닐 적에 오가는 소리와 색색의 옷차림이 번화하다\n사내아이는 연날리기, 계집아이는 널뛰기요, 윷놀아 내기하니 소년들의 놀이로다. 사당에 세배하니 떡국에 술과 과일이로다'},
      {orig:'움파와 미나리를 무엄에 곁들이면 보기에 신선하여 오신채를 부러하랴. 보름날 약밥 제도 신라적 풍속이라. 묵은 산채 삶아 내니 육미와 바꿀소냐\n귀밝히는 약술이며 부스럼 삭는 생밤이라. 먼저 불러 더위팔기 달맞이 횃불 켜기 흘러 오는 풍속이요 아이들 놀이로다', trans:'움파와 미나리를 무나물에 곁들이면 보기에 신선하여 오신채(다섯 가지 매운 나물)가 부러우랴. 보름날 약밥을 짓는 제도는 신라 때 풍속이다. 묵은 산나물을 삶아 내니 고기 맛과 바꿀소냐\n귀 밝아지는 약술이며 부스럼을 삭이는 생밤이라. 먼저 불러 "더위팔기" 하기, 달맞이하며 횃불 켜기는 예로부터 흘러온 풍속이요 아이들의 놀이로다'},
      {orig:'<五月令>\n오월이라 중하되니 망종 하지 절기로다. 남풍은 때맞추어 맥추를 재촉하니 보리밭 누른빛이 밤사이 나겠구나. 문 앞에 터를 닦고 타맥장 하오리라\n드는 낫 베어다가 단단이 헤쳐 놓고 도리깨 마주서서 짓내어 두드리니 불고 쓴 듯하던 집안 졸연히 흥성하다', trans:'오월이라 여름의 한가운데니 망종·하지 절기로다. 남풍이 때맞추어 보리 수확을 재촉하니 보리밭 누른빛이 밤사이 짙어지겠구나. 문 앞에 타작할 자리를 닦아 놓으리라\n잘 드는 낫으로 베어다가 단단히 헤쳐 놓고 도리깨로 마주서서 짓찧어 두드리니, 조용하던 집안이 갑자기 흥성해진다'},
      {orig:'담석에 남은 곡식 하마 거의 진하리니 중간에 이 곡식이 신구상계하겠구나. 이 곡식 아니려면 여름농사 어찌할꼬. 천심을 생각하니 은혜도 망극하다\n목동은 놀지 말고 농우를 보살펴라. 뜬물에 꼴 먹이고 이슬풀 자로 뜯겨 그루갈이 모심기 제힘을 빌리로다', trans:'얼마 남지 않은 곡식이 이제 거의 다하리니, 이 보리가 묵은 곡식과 새 곡식을 이어 주겠구나. 이 곡식이 아니었으면 여름 농사를 어찌할꼬. 하늘의 뜻을 생각하니 은혜가 그지없다\n목동은 놀지 말고 소를 잘 보살펴라. 뜬물에 꼴을 먹이고 이슬 젖은 풀을 자주 뜯겨, 그루갈이(그루터기에 다시 심기)와 모내기에 그 힘을 빌리는구나'},
      {orig:'보리짚 말리고 솔가지 많이 쌓아 장마나무 준비하여 임시 걱정 없이하세\n잠농을 마칠 때에 사나이 힘을 빌어 누에섶도 하려니와 고치나무 장만하소. 고치를 따 오리라 청명한 날 가리어서 발 위에 엷게 널고 폭양에 말리니\n쌀고치 무리고치 누른 고치 흰 고치를 색색이 분별하여 일이분 씨로 두고 그나마 켜오리라 자애를 차려놓고 왕채에 올려내니 빙설 같은 실올이라. 사랑홉다 자애 소리 금슬을 고루는 듯. 부녀들 적공들여 이 재미 보는구나', trans:'보리짚을 말리고 솔가지를 많이 쌓아 장마철에 땔 나무를 준비하여 뒷걱정을 없게 하세\n누에치기를 마칠 때에는 남자의 힘을 빌려 누에섶도 마련하려니와 고치나무도 장만하소. 청명한 날을 가려 고치를 따 와서 발 위에 얇게 널고 뙤약볕에 말리니\n쌀고치·무리고치·누런 고치·흰 고치를 색깔별로 가려 일이 분은 씨고치로 남겨 두고, 그 나머지는 켜리라 물레를 차려 놓고 왕채에 올려 내니 눈처럼 흰 실올이라. 사랑스럽다 물레 소리는 거문고와 비파를 고르는 듯하다. 부녀들이 애써 노력한 보람을 이 재미로 보는구나'},
      {orig:'오월 오일 단옷날 물색이 생신하다. 오이밭에 첫물 따니 이슬에 젖었으며 앵두 익어 붉은 빛이 아침볕에 눈부시다. 목맺힌 영계 소리 익힘벌로 자로 운다\n향촌의 아녀들아 추천을 말려니와 청홍상 창포비녀 가절을 허송마라. 노는 틈에 하올 일이 약쑥이나 베어 두소', trans:'오월 오일 단옷날은 만물의 빛이 새롭다. 오이밭에 첫물을 따니 이슬에 젖었으며 앵두가 익어 붉은빛이 아침볕에 눈부시다. 목이 잠긴 영계(어린 닭) 소리가 익숙해지려는 듯 자주 운다\n향촌의 아낙네들아 그네뛰기를 말리려니와, 푸른 저고리 붉은 치마에 창포 비녀 꽂고 좋은 시절을 헛되이 보내지 마라. 노는 틈틈이 할 일은 약쑥이나 베어 두소'},
      {orig:'상천이 지인하사 유연히 작운하니 때미쳐 오는 비를 뉘 능히 막을소냐. 처음에 부슬부슬 먼지를 적신 후에 밤 들어 오는 소리 패연히 드리운다\n관솔불 둘러앉아 내일 일 마련할 제 뒷논은 뉘 심고 앞밭은 뉘가 갈꼬. 도롱이 접사리며 삿갓은 몇 벌인고', trans:'하늘이 지극히 어지시어 유연히 구름을 지으니 때맞추어 오는 비를 누가 능히 막을소냐. 처음에는 부슬부슬 먼지를 적시더니 밤이 되자 오는 빗소리가 세차게 드리운다\n관솔불 둘레에 둘러앉아 내일 할 일을 마련할 제 — 뒷논은 누가 심고 앞밭은 누가 갈꼬. 도롱이와 접사리며 삿갓은 몇 벌이나 있는가'},
      {orig:'모찌기는 자네 하소 논 삶기는 내가 함세. 들깨 모 담배 모는 머슴아이 맡아 내고 가지모 고추모는 아기딸이 하려니와 맨드라미 봉선화는 네 사전 너무 마라\n아기어멈 방지찧어 들바라지 점심하소. 보리밭 찬국에 고추장 상치쌈을 식구를 헤아리되 넉넉히 능을 두소. 샐 때에 문에 나니 개울에 물 넘는다. 메나리 화답하니 격양가가 아니던가', trans:'모찌기는 자네가 하소, 논 삶기는 내가 함세. 들깨 모와 담배 모는 머슴아이가 맡아 내고, 가지 모와 고추 모는 딸아이가 하려니와 맨드라미·봉선화는 네 쌈짓돈을 너무 많이 쓰지 마라\n아기 어멈은 방아를 찧어 들일하는 이들 점심을 준비하소. 보리밭에서 딴 찬 나물국에 고추장 상추쌈을, 식구 수를 헤아리되 넉넉하게 마련해 두소. 날이 샐 때에 문을 나서니 개울에 물이 넘친다. 서로 농부가로 화답하니 격양가가 아니던가'},
      {orig:'<八月令>\n팔월이라 중추되니 백로 추분 절기로다. 북두성 자조 돌아 서천을 가리키니 선선한 조석기운 추의가 완연하다. 귀뚜라미 맑은 소리 벽간에서 들리구나\n아침에 안개 끼고 밤이면 이슬 내려 백곡을 성실하고 만물을 재촉하니 들구경 돌아보니 힘들인 일 공생한다', trans:'팔월이라 한가을이니 백로·추분 절기로다. 북두칠성 자루가 자주 돌아 서쪽 하늘을 가리키니 선선한 아침저녁 기운에 가을 느낌이 완연하다. 귀뚜라미 맑은 소리가 벽 사이에서 들리는구나\n아침에는 안개가 끼고 밤이면 이슬이 내려 온갖 곡식을 여물게 하고 만물을 재촉하니, 들 구경을 돌아보니 힘들여 일한 보람이 나타난다'},
      {orig:'백곡이 이삭 패고 여물 들어 고개숙여 서풍에 익은 빛은 황운이 일어난다. 백설 같은 목화송이 산호 같은 고추 다래 처마에 널었으니 가을볕 명랑하다. 안팎 마당 닦아 놓고 발채 망구 장만하소\n목화 따는 다래끼에 수수 이삭 콩가지요 나무꾼 돌아올 제 머루 다래 산과로다. 뒷동산 밤 대추는 아이들 세상이라. 아람도 말리어라 철대어 쓰게 하소', trans:'온갖 곡식이 이삭 패고 여물어 고개를 숙이니 서풍에 익은 빛은 누런 구름처럼 일어난다. 백설 같은 목화송이와 산호 같은 고추가 처마에 널려 있으니 가을볕이 명랑하다. 안팎 마당을 닦아 놓고 발채와 삼태기를 장만하소\n목화 따는 다래끼에 수수 이삭과 콩 가지요, 나무꾼이 돌아올 제 머루·다래가 산에서 나는 과실이로다. 뒷동산의 밤과 대추는 아이들 세상이라. 여문 밤알도 말리어라, 요긴할 때 쓰게 하소'},
      {orig:'명주를 끊어 내어 추양에 마전하고 쪽들이고 잇들이니 청홍이 색색이라\n부모님 연만하니 수의도 유의하고 그나마 마르재어 자녀의 혼수하세', trans:'명주를 끊어 내어 가을볕에 바래고 쪽빛과 잇빛으로 물들이니 청홍이 색색이라\n부모님 연세가 많으시니 수의도 미리 준비하고, 그 나머지는 마르고 재어서 자녀들의 혼수를 마련하세'},
      {orig:'집 위에 굳은 박은 요긴한 기명이라. 대싸리 비를 매어 마당질에 쓰오리라\n참깨 들깨 거둔 후에 중오려 타작하고 담뱃줄 녹두 말을 아쉬워 작전하라. 장구경도 하려니와 흥정할 것 잊지 마소', trans:'지붕 위에 단단히 여문 박은 요긴한 그릇이라. 대싸리로 비를 매어 마당질에 쓰리라\n참깨·들깨 거둔 후에 좀 이른 벼를 타작하고, 담배와 녹두를 팔아서라도 아쉬운 대로 돈을 마련하라. 장 구경도 하려니와 흥정할 것도 잊지 마소'},
      {orig:'북어 쾌 젓조기로 추석 명일 쇠어 보세. 신도주 오려 송편 박나물 토란국을 선산에 제물하고 이웃집 나눠 먹세\n며느리 말미받아 본집에 근친갈 제 개 잡아 삶아 건져 떡고리와 술병이라. 초록 장웃 반물 치마 장속하고 다시보니 여름 동안 지친 얼굴 소복이 되었느냐. 중추야 밝은 달에 지기 펴고 놀고 오소', trans:'북어 한 쾌와 젓조기로 추석 명절을 쇠어 보세. 햅쌀로 빚은 술과 올벼 송편, 박나물, 토란국을 조상 산소에 제물로 올리고 이웃집과 나눠 먹세\n며느리는 휴가를 받아 친정에 갈 때 개를 잡아 삶아 건진 떡고리와 술병을 챙긴다. 초록 장옷에 짙은 남색 치마로 단장하고 다시 보니, 여름내 지친 얼굴이 회복되었느냐. 한가위 밝은 달 아래 뜻과 기운을 펴고 놀다 오소'},
      {orig:'금년 할일 못다하니 명년 계교하오리라. 밀대 베어 더운갈이 모맥을 추경하세. 끝끝이 못 익어도 급한 대로 걷고 갈소\n인공만 그러할까 천시도 이러하니 반각도 쉴새 없이 마치며 시작느니', trans:'올해 할 일을 다 못했으니 내년 계획을 세우리라. 밀대를 베고 뜨거울 때 갈아서 보리·밀을 가을에 심어 두세. 끝내 덜 익어도 급한 대로 거두고 밭을 갈소\n사람의 일만 그러할까, 하늘의 때도 이러하니 — 잠시도 쉴 새 없이 하나를 마치면 곧 다음이 시작되는구나'}
    ],
    summary:{
      theme:'농가에서 절기에 따라 해야 할 농사일과 세시풍속을 월별로 노래함(이 자료 수록 범위: 정월령·오월령·팔월령)',
      features:['월령체(月令體) 가사 — 계절의 흐름에 따라 농사일과 풍속을 사실적으로 기록','정월(설·대보름 풍속)→오월(보리타작·누에치기·단오)→팔월(추석·길쌈·혼수 준비)로 이어지는 계절별 농가 생활상','각 절기·풍속에 대한 정보를 풍부하게 담아 \'농서(農書)\'로서의 실용적 성격도 지님'],
      examPoints:['<동동>(고려가요)과 같은 월령체 계열이지만, <동동>이 임에 대한 그리움(서정)을 노래하는 데 비해 <농가월령가>는 농사와 풍속(교술)을 사실적으로 기록한다는 차이를 비교해둘 것','작가가 직접 농사짓지 않는 사대부라는 점에서 "보수적 이데올로기의 재생산인가, 실체험에 근거한 애정 어린 기록인가"에 대한 해석 차이를 정리해둘 것','정학유(정약용의 아들) 작이라는 배경지식, 서사(우주의 생성과 역법)-본사(1~12월령)-결사(농업 권면)의 전체 구조']
    }},
  { id:'boksunhwaeumga', genre:'가사', title:'복선화음가', author:'작자 미상', era:'조선 후기',
    lines:[
      {orig:'어와세상 사람들아 이내말씀 들어보소 불행한 이내몸이 여자몸이 되었으니 이한림의 증손녀요 정학사의 외손녀라 소학호경 열녀전을 십여세에 외워내고 처신범절 행동거지 침선방적 수놓기도 십사세에 통달하니 누가아니 칭찬하랴\n악한행실 경계하고 착한사람 본을받아 일동일정 선히하니 남녀노소 하는말이 천상적강 이소저는 부귀공명 누리리라 그얼굴 그태도는 천만고에 처음이라 이러하기 칭찬받고 금옥으로 귀히길러 십오세가 그에되니 여자유행 법을좇아 강호로 출가하니 김한림의 증손부라', trans:'어와 세상 사람들아 이내 말씀 들어보소, 불행한 이내 몸이 여자 몸이 되었으니 — 이한림의 증손녀요 정학사의 외손녀라. 소학과 열녀전을 십여 세에 외워내고 처신·범절·행동거지·바느질·길쌈·수놓기도 십사 세에 통달하니 누가 아니 칭찬하랴\n악한 행실을 경계하고 착한 사람을 본받아 일거일동을 선하게 하니 남녀노소가 하는 말이 "하늘에서 내려온 이 소저는 부귀공명을 누리리라, 그 얼굴 그 태도는 천만고에 처음이다" 하며 칭찬받고 금옥같이 귀히 길러져 열다섯 살이 되니, 여자가 마땅히 가야 할 길을 따라 강호로 시집가니 김한림의 증손부라'},
      {orig:'경계좋은 화류중에 삼월망간 우기하니 등명군 십이병은 군복병치 찬란하고 전배후배 열두한림 오색복색 황홀하다 각사에 가진시비 좌우로 세의하니 거리거리 구경꾼이 뉘아니 칭찬하리 풍류남자 오라버니 배행기구 거룩하다\n은안백마 뒤세우고 청사행 사인교에 청사도포 학술안경 대모장도 빗겨타고 오동설합 백흥연죽 이해수층 드리우고 옥삼전대 요강타구 수배규중 차지로다 소주약주 가진안주 복마구중 완득이라 탄탄정로 좋은길로 하루이틀 사흘안에 강호에 득달하니 시댁이 어디런고', trans:'경치 좋은 화려한 동네에 삼월 그믐께 비가 오니, 등불 밝힌 열두 병사는 군복 차림이 찬란하고 앞뒤로 늘어선 열두 한림은 오색 복색이 황홀하다. 관아마다 딸린 시비들이 좌우로 시위하니 거리마다 구경꾼이 칭찬하지 않는 이가 없다. 풍류남자인 오라버니의 배행 차림새가 거룩하다\n은 안장 백마를 뒤세우고 푸른 비단 휘장 사인교에 청사 도포, 학슬안경, 대모 장도를 비껴 차고, 오동나무 서랍에 흰 연죽을 드리우고, 옥삼 전대와 요강·타구까지 규중을 대신하는 차림이로다. 소주·약주 갖은 안주를 가득 실었다. 탄탄한 큰길로 하루 이틀 사흘 안에 강호에 다다르니 시댁이 어디런가'},
      {orig:'주렴속에 잠깐보니 수간모옥 청계상에 동래서복 가련하다 반별은 좋건마는 가세가 영채하니 신행이 허다하인 밥인들 먹일쏘냐 합천치수 팔연판은 쟁반에 붉은대초 도리어 무색하다 폐백을 드린후에 눈을감고 앉았으니 허다한 구경꾼이 서로일러 하는말이 아까울사 저신부야 곱기괴히 기른낭자 간구한 저시집에 그고생을 아찌할꼬 극난한기 혼인이라 저대도록 속았는고', trans:'주렴 속에서 잠깐 보니 몇 칸 안 되는 초가집이 맑은 시냇가에 있으니 가련하다. 마을은 좋건마는 가세가 궁핍하니 신행 온 많은 하인들 밥인들 먹일쏘냐. 갖춘 예물의 붉은 대추도 도리어 무색하다. 폐백을 드린 후에 눈을 감고 앉았으니 허다한 구경꾼이 서로 일러 하는 말이 "아깝구나 저 신부야, 곱게 기른 낭자가 저 가난한 시집에서 그 고생을 어찌할꼬, 몹시 어려운 혼인이라 저렇게까지 속았는가"'},
      {orig:'하루밤 지낸후에 회마치행 하올적에 배행왔던 오라버니 날을보고 하는말씀 가세가 이러하니 할 일없다 도로가자 차마혼자 못가겠다 어여쁜 우리누이 이고생을 어찌하리 두말말고 도로가자\n오라버니 하는말씀 이말이 왠말이요 삼종지도 중한법과 여자유행 읽었으니 부모형제 멀었으라 행예예혼 하올적에 재물을 의논함이 잇적에 천한바요 사군자의 경계로다\n수간모옥 적은집은 구고계신 내집이요 안밖문중 번화갑제 친부모의 옛집이다 하늘이 정한팔자 순종하면 복이되고 시댁이 간구하나 천생지록 있으리라 굶고벗기 매양이며 가도가 심하시도 구고에 뜻을받아 효성으로 봉양하면 도리어 감동하사 불상기특 사랑하오 그런말씀 다시말고 초치를 보중하사 평안지중 환차하사 시댁에 간구한말 부모님께 부디마오\n자애자정 우리부모 이말씀 들으시면 가뜩이나 늙은친당 침식이 불안한데 선웃음 좋은말로 시가사를 자랑하여 부모마음 편케하오\n오라버니 하는말씀 아름다운 우리누이 오히려 놀랏드니 금일에야 다시보니 백행이 구비하니 무궁복록 누리리라 수지부모 귀한몸을 안보하여 잘있으라 눈물뿌려 작별하고 현사당 하온후에 삼일을 지낸후에 세수작객 예법으로', trans:'하루밤 지낸 후에 회마 행차를 할 적에 배행 왔던 오라버니 나를 보고 하는 말씀 — "가세가 이러하니 할 일 없다, 도로 가자. 차마 혼자 못 가겠다. 어여쁜 우리 누이 이 고생을 어찌하리, 두말 말고 도로 가자"\n(내가) 오라버니께 하는 말씀 — "이 말이 웬 말이오. 삼종지도의 중한 법과 여자가 지킬 도리를 읽었으니 부모형제가 멀리 있겠는가. 혼인을 할 적에 재물을 의논함이 예로부터 천한 바요 군자가 경계할 일이로다\n작은 초가집은 시부모 계신 내 집이요 화려한 큰 집은 친정 부모의 옛집이다. 하늘이 정한 팔자 순종하면 복이 되고 시댁이 가난하나 하늘이 준 복록이 있으리라. 굶고 헐벗기를 늘 하며 가도가 심히 어려워도 시부모의 뜻을 받아 효성으로 봉양하면 도리어 감동하시어 불쌍히 여기고 기특히 여겨 사랑하시리니, 그런 말씀 다시 말고 몸조심하시어 평안히 돌아가셔서 시댁이 가난하다는 말은 부모님께 부디 마시오\n자애로운 우리 부모님이 이 말씀 들으시면 가뜩이나 늙으신 친정 부모님이 잠자리와 식사가 불안하실 텐데, 웃는 얼굴로 좋은 말로 시댁 일을 자랑하여 부모님 마음을 편케 하겠소"\n오라버니 하는 말씀 — "아름다운 우리 누이, 오히려 놀랐더니 오늘에야 다시 보니 온갖 행실이 구비하니 끝없는 복록을 누리리라. 부모님이 주신 귀한 몸을 잘 보전하여 잘 있거라" 눈물 뿌려 작별하고 사당에 인사한 후에 삼일을 지낸 후에 세수하고 손님 대접하는 예법으로'},
      {orig:'부엌으로 니러가니 소슬한 한부엌에 탕관하나 뿐이로다 감지에 부모봉양 무엇으로 하잔말고 진황시 서방님은 아는것이 글뿐이요 시정모른 늙은구고 다만망영 뿐이로다 하인을 급히불러 이웃집에 보냈더니 돌아와 하는말이 전에꾼쌀 아니주고 염치없이 또왔느냐 두말말고 바빠가라 그렁저렁 하노라니 때가님에 못이로다\n자개함농 열어놓고 약간전양 대어내어 쌀팔고 반찬사니 기식이 장식이라 앞에 드린 금봉채는 김장자집 전당하고 왜포당포 찬찬의복 시찬가에 전당하고 상개구개 두로불수 앉은빗에 길게하고 공단대단 핫이불은 이자랑집 영영방매 혼수가 많다한들 걸로어찌 당할쏘냐 친정에 약간구지 헌시루에 물붓기라', trans:'부엌으로 일어나 가니 쓸쓸한 부엌에 국그릇 하나뿐이로다. 맛있는 음식으로 부모 봉양은 무엇으로 하잔 말인가. 진작부터 서방님은 아는 것이 글뿐이요 시세 모르는 늙은 시부모는 다만 망령뿐이로다. 하인을 급히 불러 이웃집에 보냈더니 돌아와 하는 말이 "전에 꾼 쌀도 안 주고 염치없이 또 왔느냐, 두말 말고 바삐 가라" 그렇게 하는 동안 끼니때가 다 지나갔다\n자개장롱 열어 놓고 약간의 돈을 마련하여 쌀 사고 반찬 사니 살림이 이만저만이 아니다. 앞서 받은 금봉채는 김장자 집에 전당하고 왜포·당포 옷감들은 시장에 전당하고, 이런저런 그릇들은 앉은 자리에서 늘어놓아 팔고, 공단·대단 이불은 이자랑 집에 영영 팔아넘기니 — 혼수가 많다 한들 그것으로 어찌 견디랴, 친정에서 마련해 준 것도 헌 시루에 물 붓기라'},
      {orig:'고운낭자 대단치마 과거보기 소용이라 하도못한 소과대과 무방초시 무슨일고 사시장춘 고운이복 그우머시 지탕하리 허리띠 열두죽은 버선집기 다진했내 여간쌀되 밥을진들 부모남편 진지하고 수삼노복 나눠주니 저먹을것 전혀없다 한때굶어 두때쉴시 치마끈을 졸라맨들 글로어찌 당할소냐 눈이캄캄 하올적에 헛두통을 앓노라니 사랑에서 무슨호기 수청한림 급히불러 손님두분 오셨으니 술사오고 점심해라 호령이 등등하니 시행을 아니하면 사랑에 망신이요 시행을 하자한들 두주먹 붉었으니 생각다 할 일없어 인두가왜 전당주고 술사오고 양식팔아 손님대접 하였슨들 그무엇이 넉넉하여 지오기를 하잔말가 이틀사흘 유한손님 만류하기 무슨일고 봉제접빈 지성인들 없는바에 어이하리 반갱이요 차려놓니 잔드리는 이내마음 일언일도 한빈지사 이모양이 한심하다', trans:'고운 낭자와 비단 치마는 과거 보이려 소용될 물건이라, 하다 못한 소과·대과에 무슨 초시가 필요한고. 사시사철 고운 옷은 그 무엇으로 지탱하리. 허리띠 열두 죽은 버선짓기로 다 되었네. 여간한 쌀되로 밥을 지어도 부모와 남편 진지 올리고 종 몇 사람에게 나눠주니 내가 먹을 것은 전혀 없다. 한 때 굶고 두 때 굶어 치마끈을 졸라맨들 그것으로 어찌 견디랴. 눈이 캄캄해질 적에 헛두통을 앓노라니, 사랑채에서 무슨 소란인가 하인을 급히 불러 "손님 두 분 오셨으니 술 사오고 점심해라" 호령이 등등하니, 시행하지 않으면 사랑채에 망신이요 시행하자 한들 두 주먹뿐이라 생각다 못해 인두와 가위를 전당 잡히고, 술 사오고 양식 팔아 손님 대접을 하였은들 그 무엇이 넉넉하여 대접을 다 하겠는가. 이틀 사흘 머무는 손님을 만류하기는 무슨 일인고. 정성껏 손님 대접하고 싶어도 가진 것이 없으니 어찌하리. 변변찮은 밥상을 차려놓고 잔을 올리는 이 내 마음, 한 마디 한 마디가 가난한 살림이라 이 모양이 한심하다'},
      {orig:'사사이 생각하니 없는것이 한이로다 분한심사 다시먹고 곰곰생각 다시하니 김장자 이부자는 근본적 부자련가 수족이 다성하고 이목구비 온전하니 내힘써 내먹으면 그무엇을 부러하리 비단치마 입던허리 행주치마 둘러입고 운혜당혜 신든발에 석새짚신 졸여신고 단장안의 묵은처마 갈고매고 개간하여 외가지를 굵게 길러 성시에 팔아오고 뽕을따 누에쳐서 오색당사 고운실을 유황같은 큰비틀에 필필이 짜낼적에 쌍원앙 공작이며 기린봉황 범나비라 문채도 찬란하고 수법도 기이하다 오회월려 고은실은 수놓기로 다진하고 호상의 돈천냥은 비단값이 부족하다', trans:'일마다 생각하니 없는 것이 한이로다. 분한 마음을 다시 먹고 곰곰이 다시 생각하니 — 김장자·이부자는 원래부터 부자였던가. 손발이 다 성하고 이목구비가 온전하니 내 힘써 내가 벌어먹으면 그 무엇을 부러워하리. 비단 치마 입던 허리에 행주치마 둘러 입고 운혜·당혜 신던 발에 짚신을 졸라매어 신고, 담장 안의 묵은 밭을 갈고 매어 개간하여 오이 가지를 굵게 길러 시장에 내다 팔고, 뽕을 따 누에를 쳐서 오색 명주실을 큰 베틀에 필필이 짜낼 적에 쌍원앙·공작이며 기린·봉황·범나비라 — 무늬도 찬란하고 수법도 기이하다. 여러 달 고운 실로 수놓기를 다 마치니 부잣집의 천 냥으로도 그 비단값이 부족하다'},
      {orig:'새이새이 틈을타셔 칠십노인 수의짓고 첩상북근 고운의복 녹의홍상 쳐녀치장 어린아이 색옷이며 대신입는 조복이라 저녁에 켜는불로 새벽조반 얼른짓네 알알이 혜여먹고 준준이 모아보니 양이모여 관이되고 관이모여 백이로다\n울을뜯고 담을치고 집을짓고 기와이고 앞패에 좋은전답 많을시고 안밧마구 노새나귀 때를 찾아 우는소리 십이중문 줄행낭줄 왕방울을 걸어두고 고대광실 높은집에 춘혀마다 풍경달아 동남풍이 건듯하면 잠든날을 깨와셔라 보라대단 요이불을 반자까지 도로싸고 용목괘상 두리상을 자개함농 겹쳐놓고 오동설합 백통연죽 서초양초 가득하며 왜화기며 당화기와 동내반상 안성유기 삼간고의 가득하고 수중하님 열둘이요 반빗하님 스물둘이라 좌우로 버려시니 육간대청 가득하다', trans:'틈틈이 시간을 내어 칠십 노인 수의를 짓고, 몸단장할 고운 의복, 녹의홍상 처녀 치장, 어린아이 색동옷이며 대신 입는 관복까지 마련하는구나. 저녁에 켜던 불로 새벽 조반을 얼른 짓네. 알알이 헤아려 먹고 조금씩 모아 보니 양이 모여 관이 되고 관이 모여 백이 되었도다\n울타리를 걷고 담을 쌓고 집을 짓고 기와를 이니 앞뒤로 좋은 전답이 많을시고. 안팎 마구간에 노새·나귀가 때를 찾아 우는 소리, 열두 겹 중문 곳간마다 왕방울을 걸어두고, 고대광실 높은 집 처마마다 풍경을 달아 동남풍이 스치면 잠든 날도 깨우는구나. 보드라운 비단 요이불을 반자까지 두르고, 용목 괘상과 두리상, 자개장롱을 겹쳐 놓고, 오동나무 서랍에 백통 연죽, 서양초·양초가 가득하며 왜자기·당자기와 안성유기 반상기가 삼간 창고에 가득하고, 몸종 열둘에 부엌 몸종 스물둘이 좌우로 늘어서니 육간대청이 가득하다'},
      {orig:'올벼타작 일천석은 적은고에 넣어두고 늦벼타작 이천석은 각처마랍 용정하고 도지쌀 책백석은 김동지집 봉수하고 시찬갑 팔천냥은 이낭청에 배삭이 날마다 소를잡아 부모봉양 유족하다 찬물도 허다하다 아침저녁 갈아놓고 혼정신성 하올적에 가진실과 약주로다 안진나락 선다락에 가진찬합 열두설합 굴병사탕 편강이며 약과산자 장복이라 주먹같은 굵은대초 춘시호도 겹쳐놓고 전복쌈약 표육을 생율쳐서 새이놓고 호초생강 양념이며 은안백척 인절미라', trans:'올벼 타작 천 석은 작은 창고에 넣어 두고 늦벼 타작 이천 석은 여러 곳에 두루 쓰이고, 도지쌀 백 석은 김동지 댁에 바치고, 팔천 냥의 물건 값은 이낭청 댁에 갚으니, 날마다 소를 잡아 부모 봉양이 넉넉하다. 반찬도 그지없이 많다. 아침저녁 새로 갈아 올리고 아침저녁 문안 인사드릴 때에는 온갖 과일과 약주로다. 곳간마다 갖은 찬합 열두 서랍, 곶감·사탕·편강이며 약과·산자가 늘어서 있고, 주먹만한 굵은 대추와 곶감·호두를 겹쳐 놓고, 전복쌈·약포·육포를 생밤과 곁들여 놓고 후추·생강 양념에 은빛 나는 흰 인절미로다'},
      {orig:'지악이 복이되고 지성이면 감천이라 시집온지 십년만에 가산이 이러하오 아들형제 고명딸은 형용도 기이하다 내외간에 화락하니 걱정인들 있을소냐 갑자구월 초파일에 국화주를 한잔먹고 안석에 의지하여 춘관을 분부하여 다리 치드러 누워 옥단어미 책보이고 담배대 가로물고 고요히 듣노라니 호련이 잠이들어 정신이 흔흔터니 큰대문에 무슨일로 저대도록 요란한고 청천백일 무슨일고 천동벽력 고이하다 놀래여 밤을깨여 완자영창 열트리매 똥배불은 하님연을 저리급히 연줍난고 엿주시오 하는말이 박벽인지 창안백발 우리존구 청여장을 둘너집고 황황이 들어와서 나를보고 하는말씀 이번과거 즉일창방 너의남편 내아들이 장원급제 하였으니 이런경사 또있느냐 지금까지 오래살아 부귀공명 이런경사 애다를소냐 너의시모 삼년만 더살드면 동희동락 하련마는 혼자보기 아깝도다 내마음 아프거든 너의내외 오죽하랴', trans:'악착같이 애씀이 복이 되고 정성이면 하늘도 감동한다더니, 시집온 지 십 년 만에 가산이 이렇게 되었소. 아들 형제와 고명딸은 모습도 기이하게 잘났다. 부부간에 화락하니 걱정인들 있을소냐. 갑자년 구월 초파일에 국화주를 한 잔 먹고 안석에 기대어 춘관에게 분부하여 다리를 뻗고 누워 옥단어미에게 책을 읽히게 하고 담뱃대를 가로 물고 고요히 듣노라니 어느덧 잠이 들어 정신이 몽롱하던 차에, 큰 대문에서 무슨 일로 저렇게 요란한고. 청천백일에 무슨 일인고, 마른하늘에 날벼락처럼 괴이하다. 놀라서 잠을 깨어 완자 영창을 열어젖히니 하님이 저리도 급히 연통을 전하는가. "여쭙습니다" 하는 말이 — 벽력인지 백발 성성한 우리 시아버님이 푸른 지팡이를 둘러 짚고 황급히 들어오셔서 나를 보고 하시는 말씀 "이번 과거 급제자 발표에 네 남편, 내 아들이 장원급제하였으니 이런 경사 또 있겠느냐. 지금까지 오래 살아 이런 부귀공명 경사를 보니 남 부러울 것 없다. 네 시어머니가 삼 년만 더 살았더라면 함께 기뻐하련만, 혼자 보기가 아깝구나. 내 마음이 아프거든 너희 내외는 오죽하랴"'},
      {orig:'전후방군 허다하니 첫째돈이 백양이라 하루이틀 사흘만에 두본거구 거룩하다 재인무동 열두놈은 오색비단 가진치장 식천금은 안백마는 삼복두 대모각대 어사화 한가지가 향풍에 나부낀다 전후에 가진전배 복색도 황홀하다 안동방고 이한림은 실내위 하는소리 어여쁜 우리낭군 분성적도 괴괴하다 당분왜밀 어디두고 먹을갈아 성적할지 회가로 칠을하니 얼숭덩숭 그린모양 호랑등을 부러할가 모자빠진 허망근에 똥지천 무슨일고 가재잡고 나연후에 팔벌이고 개금줄지 박장대소 뉘아닐가 말거꾸로 타신양반 서울길로 갸라시냐\n사당의 고유하고 경사인사 채못하여 실내위 하는소리 김정성래 서판서라 전애방골 코리육촌 실내그만 욕비시오 승지댁 사촌형님 무슨일로 부르시나 괴득스런 사종동서 팔을어이 이끄시오 안밖으로 허다빈객 차답상도 융숭하다 초입사에 주성장영 멸군으로 안변부사 성지당상 동내부사 물망으로 평안감사 국은도 망극하다 쌍교독교 홀녀타고 고을마다 따일적에 연광이 사십이라 아름답고 고은얼굴 인간공도 면할소냐', trans:'앞뒤로 딸린 방군이 허다하니 첫째 돈이 백 냥이라. 하루 이틀 사흘 만에 채비가 두루 거룩하다. 재인 무동 열두 명은 오색 비단으로 갖은 치장을 하고, 천금 값 안장 백마며 겹치마 예복에 대모관대, 어사화 한 가지가 봄바람에 나부낀다. 앞뒤로 딸린 행렬 복색도 황홀하다. 안동 방고와 이한림은 (부인들이) 시부모 뵙는 예를 갖추는 소리에, 어여쁜 우리 낭군이 얼굴 단장하는 것도 고요하다. 짙은 분과 밀랍은 어디 두고 먹을 갈아 화장할지, 재를 개어 칠을 하니 얼룩덜룩 그린 모양이 호랑이 등을 부러워할까. 모자 빠진 허망한 관에 무슨 일인고, (익살스러운 놀이로) 손뼉치고 웃는 모습에 누가 아니 웃으랴, 말을 거꾸로 타신 양반은 서울 길로 가시는가\n사당에 고하고 경사를 인사하기도 미처 다 못하여 안식구들 맞는 소리, "김정승 댁이오, 서판서 댁이오" — 이웃 사촌, 먼 친척까지 "안식구 그만 수고하시오", "승지댁 사촌 형님은 무슨 일로 부르시나", "괴이한 사촌 동서는 팔을 왜 이끄시오" 하며 안팎으로 허다한 손님이 다과상도 융숭하다. 처음 벼슬길에 올라 소년 장군으로 안변부사, 명망 높아 동래부사, 물망에 올라 평안감사까지 오르니 나라의 은혜가 그지없다. 쌍교·독교 홀로 타고 고을마다 부임할 적에 나이 사십이라, 아름답고 고운 얼굴이 사람의 떳떳한 도리(늙음)를 피할소냐'},
      {orig:'아들형제 진사급제 가문도 혁혁하다 딸을길러 출가하니 혼수범절 치행이야 다시일러 어떠하리 춘하추동 사철이복 대외생전 유족하다 바느질에 침선채며 대마구종 춘득이요 전갈하님 영매로다 남노여비 가졌으니 전답인들 아니주랴 대한불갈 좋은전답 삼백석 받는 추수 동도지 오천냥은 요용소치 유연하다 나의신행 올때가 도리어 생각난다', trans:'아들 형제가 다 진사에 급제할 만큼 가문도 혁혁하다. 딸을 길러 시집보내니 혼수와 행장은 다시 말해 무엇하리. 사철 입을 옷은 평생 입고도 남을 만큼 준비했다. 바느질에 쓸 비단이며, 말을 몰고 갈 마부는 춘득이요 전갈을 전할 하님은 영매로다. 남녀 종까지 딸려 주었으니 논밭인들 아니 줄까 — 큰 가뭄에도 마르지 않는 좋은 논밭 삼백 석 받는 추수, 동쪽 땅 세준 논에서 받는 오천 냥은 필요할 때 쓰고도 남을 듯하다. 내가 시집 올 때가 도리어 생각난다'},
      {orig:'저건너 괴똥어미 시집살이 하던말을 너도더러 알거니와 대강일러 경계하마 지일처음 시집올지 가산이 만금이라 마당에 노적이요 너른광에 금은이라 신행하여 오는 날에 가마문을 나서면서 눈을들어 사방살펴 기침을 크게하니 신부행실 바이없다 차담상에 허다엄식 생율먹기 고아하다 무슨배가 그리고파 국마시고 떡을먹노라 좌중부녀 어이알아 떡조각을 집어들고 이도주고 저도주니 새댁행실 전혀없다 입구먹에 침이흘러 연지분도 간데없고 앗가을사 대단치마 어룽더룽 흉악하다', trans:'저 건너 괴똥어미 시집살이 하던 말을 너도 들어 알거니와 대강 일러 경계하마. 맨 처음 시집올 때 가산이 만금이라 마당에 곡식더미요 넓은 창고에 금은이라. 신행하여 오는 날에 가마문을 나서면서 눈을 들어 사방을 살펴보며 기침을 크게 하니 신부 행실이 전혀 없다. 다담상에 음식이 가득한데 생밤을 먹다니 괴이하다. 무슨 배가 그리 고파 국을 마시고 떡을 먹느라 자리에 앉은 부녀들이 어찌 알아채고 떡 조각을 집어 들고 이도 주고 저도 주니 새댁의 행실이 전혀 없다. 입에 침이 흘러 연지분도 간데없고 아깝구나 비단 치마가 얼룩덜룩 흉악하다'},
      {orig:'신부행동 그려하니 뉘안이 위면하리 삼일을 지낼후에 형용도 기기하다 백주의 낮잠자기 혼자앉아 군소리며 둘이앉아 흉보기와 문틈으로 손보기며 담에올라 시비구경 어른말씀 토달기와 금강산 어찌알고 구경하니 둘째로다 기역니은 모르거든 책을어찌 들고앉노 안짐안짐 용열하고 걸음거리 망측하다 달음박질 하는때에 너털웃음 무슨일고 치마꼬리 히여지고 비녀빠져 개가문다 허리띠 어디두고 붉은허리 들어내노\n어른걱정 하올적에 족박함박 드던지며 성내여 솟대닷기 독살부려 그릇깨기 등잔뒤에 남보기며 가만가만 말돗깨와 아니한말 지여내여 일가간에 이간질과 좋은물건 잠깐보며 도적하기 여사로다 그중에 행실보소 악한사람 부동하여 착한사람 흉보기와 지쳐신 그러하기 남편인들 귀할소냐 금실조차 살풀이며 무병하라 푸닥거리 이복주고 금전주어 아들낳고 부귀하기 정성껏 빌어보소 산에올라 산지하고 질에가서 불공한들 지심사 그러하니 귀신인들 도울소냐 우환이 연접하니 사망인들 없을소냐', trans:'신부 행동 그러하니 누가 아니 외면하리. 삼일을 지낸 후에 하는 짓도 기괴하다. 대낮에 낮잠 자기, 혼자 앉아 군소리하기, 둘이 앉아 남 흉보기와 문틈으로 엿보기며, 담에 올라 시비 구경하고 어른 말씀에 말대꾸하기 — 금강산이 어떤 곳인 줄이나 알고 구경했나, (신부 행실의) 둘째로다. 기역니은도 모르면서 책을 어찌 들고 앉았는고. 앉는 자세는 용렬하고 걸음걸이는 망측하다. 달음박질할 때에 너털웃음은 무슨 일인고. 치마 끝은 헤어지고 비녀 빠져 개가 문다. 허리띠는 어디 두고 붉은 허리를 드러내는가\n어른이 걱정할 때에는 쪽박·함박을 던지며 성내어 솥때 닦기, 독살부려 그릇 깨기, 등잔 뒤에서 남 엿보며 가만가만 말 옮기고, 하지도 않은 말을 지어내어 일가간에 이간질하고, 좋은 물건을 잠깐 보면 훔치기가 예삿일이로다. 그중에 행실을 보소 — 악한 사람과 한통속이 되어 착한 사람 흉보기와 제 처신이 그러하니 남편인들 귀하게 여기겠느냐. 금슬이 좋아지라고 살풀이하며, 병 없으라고 푸닥거리에 옷과 돈을 바치고, 아들 낳고 부귀하기를 정성껏 빌어 보소 — 산에 올라 산신께 빌고 절에 가서 불공을 드린들 마음 씀씀이가 그러하니 귀신인들 도와주겠는가. 근심 걱정이 잇달으니 죽는 일인들 없을소냐'},
      {orig:'딸아딸아 아기딸아 복선화음 하는법이 이를보니 분명하다 저건너 괴똥어미 너도거면 안보았나 허다시간 포진천물 남용남식 하고나서 그모양이 되었구나 딸아딸아 고명딸아 괴똥어미 경계하고 너의어미 살을받아 세금결시 이른말은 부디각골 명심하라 딸아딸아 울지말고 부디부디 잘가거라 효봉구고 승순군자 동기우애 지친화목 기쁜소식 듣기오면 명연삼월 화류시에 모녀상봉 하느니라', trans:'딸아 딸아 아기 딸아, 복선화음(선한 이에게 복이, 방탕한 이에게 화가 내린다) 하는 법이 이를 보니 분명하다. 저 건너 괴똥어미를 너도 거기서 안 보았느냐. 오랜 세월 하늘이 준 재물을 함부로 쓰고 먹어대다가 그 모양이 되었구나. 딸아 딸아 고명딸아, 괴똥어미를 경계하고 네 어미의 삶을 본받아 정성껏 이른 말은 부디 뼈에 새겨 명심하라. 딸아 딸아 울지 말고 부디부디 잘 가거라. 시부모를 잘 받들고 남편에게 순종하며 형제간에 우애하고 친척과 화목하게 지내다가, 기쁜 소식 들리면 내년 삼월 꽃 피는 시절에 모녀가 다시 만나느니라'}
    ],

   '화자(어머니) 자신이 가난한 시집에 들어가 근검·길쌈으로 가산을 일으키고 아들이 장원급제하는 성공담(이야기 속 이야기 형식)',

  { id:'nuhangsa', genre:'가사', title:'누항사', author:'박인로', era:'조선 중기',
    lines:[
      {orig:'어리고 우활(迂闊)ᄒᆞᆯ산 이 ᄂᆡ 우ᄒᆡ 더니 업다. 길흉 화복(吉凶禍福)을 하날긔 부쳐 두고, 누항(陋巷) 깁푼 곳의 초막(草幕)을 지어 두고, 풍조우석(風朝雨夕)에 석은 딥히 셥히 되야, 셔 홉 밥 닷 홉 죽(粥)에 연기(煙氣)도 하도 할샤. 설 데인 숙냉(熟冷)애 뷘 배 쇡일 ᄲᅮᆫ이로다.\n생애 이러ᄒᆞ다 장부(丈夫) ᄯᅳᆺ을 옴길넌가. 안빈 일념(安貧一念)을 젹을망정 품고 이셔, 수의(隨宜)로 살려 ᄒᆞ니 날로조차 저어(齟齬)ᄒᆞ다', trans:'어리석고 세상 물정에 어두운 사람이 내 위에 없다. 길흉화복을 하늘에 부쳐 두고, 누항 깊은 곳에 초막을 지어 두고, 비바람 치는 아침저녁에 썩은 짚이 땔감이 되어, 세 홉 밥 다섯 홉 죽에 연기도 하도 많구나. 설 데운 숭늉에 빈 배를 채울 뿐이로다.\n생애 이러하다고 장부의 뜻을 옮길 것인가. 안빈일념을 적을망정 품고 있어, 옳은 일을 좇아 살려 하니 날이 갈수록 뜻대로 되지 않는다 (서사)'},
      {orig:'ᄀᆞᄋᆞᆯ히 부족(不足)거든 봄이라 유여(有餘)ᄒᆞ며, 주머니 뷔엿거든 병(甁)의라 담겨시랴. 빈곤(貧困)ᄒᆞᆫ 인생(人生)이 천지간(天地間)의 나ᄲᅮᆫ이라. 기한(飢寒)이 절신(切身)ᄒᆞ다 일단심(一丹心)을 이질ᄂᆞᆫ가. 분의망신(奮義忘身)ᄒᆞ야 죽어야 말녀 너겨, 우탁 우랑(于槖于囊)의 줌줌이 모아 녀코, 병과(兵戈) 오재(五載)예 감사심(敢死心)을 가져 이셔, 이시섭혈(履尸涉血)ᄒᆞ야 몃 백전(百戰)을 지ᄂᆡ연고', trans:'가을이 부족하거든 봄이라 여유있으며, 주머니 비었거든 병이라 담겨있으랴. 빈곤한 인생이 천지간에 나뿐이다. 배고프고 추운 것이 심하다고 하여 일편단심을 잊을 것인가. 의를 떨쳐 몸을 돌보지 않아 죽어야 그만두겠다고 여겨, 전대와 망태에 줌줌이 모아 넣고, 전란 오 년에 용감하게 죽겠다는 마음을 가지고 있어, 주검과 피를 밟고 몇 백전을 지냈는가 (본사1, 전쟁에 임해 죽을 고비를 넘겼던 일을 떠올림)'},
      {orig:'일신(一身)이 여가(餘暇) 잇사 일가(一家)를 도라보랴. 일노장수(一奴長鬚)ᄂᆞᆫ 노주분(奴主分)을 이졋거든, 고여춘급(告余春及)을 어ᄂᆡ 사이 ᄉᆡᆼ각ᄒᆞ리. 경당문노(耕當問奴) 인ᄃᆞᆯ 눌ᄃᆞ려 물ᄅᆞᆯᄂᆞᆫ고. 궁경가색(躬耕稼穡)이 ᄂᆡ 분(分)인 줄 알리로다. 신야경수(莘野耕叟)와 농상경옹(瓏上耕翁)을 천(賤)타 ᄒᆞ리 업것마ᄂᆞᆫ, 아므려 갈고젼ᄃᆞᆯ 어ᄂᆡ 쇼로 갈로손고', trans:'내 몸이 여유가 있어 일가를 돌아보겠는가. 나이 많은 노비는 노인과 주인의 구분을 잊었거든, 봄이 왔다고 나에게 일러줄 것을 어느 사이에 생각하리. 농사를 노비에게 물어야 하는데 누구에게 물을 것인가. 몸소 농사를 짓는 것이 내 분수인 줄 알리로다. 밭 갈던 옛 노인들을 천하다 할 이가 없겠지만, 아무리 갈고자 한들 어느 소로 갈 것인가 (본사2, 전란 후 몸소 농사를 짓고자 하나 소가 없어서 고심함)'},
      {orig:'한기태심(旱旣太甚)ᄒᆞ야 시절(時節)이 다 느즌 졔, 서주(西疇) 놉흔 논애 잠ᄭᅡᆫ ᄀᆡᆫ 녈비예 도상(道上) 무원수(無源水)를 반만ᄭᅡᆫ ᄃᆡ혀두고, 쇼 ᄒᆞᆫ 젹 듀마 ᄒᆞ고 엄섬이 ᄒᆞᄂᆞᆫ 말삼 친절(親切)호라 너긴 집의 ᄃᆞᆯ 업슨 황혼(黃昏)의 허위허위 다라 가셔, 구디 다ᄃᆞᆫ 문(門) 밧긔 어득히 혼자 서셔 큰 기ᄎᆞᆷ 아함이를 양구(良久)토록 ᄒᆞ온 후(後)에, 어와 긔 뉘신고 염치(廉恥) 업산 ᄂᆡ옵노라', trans:'가뭄이 이미 심하여 때가 다 늦은 때, 서쪽 높은 논에 잠깐 갠 지나가는 비에 길 위에 근원 없이 흐르는 물을 반만큼 대어 두고, 소 한 번 주마 하고 엉성히 하는 말을 친절하다 여긴 집에 달 없는 황혼에 허위허위 달려 가서, 굳게 닫은 문 밖에 아득히 혼자 서서 큰 기침을 오랫동안 한 후에, "아이고 거기 누구신가" "염치없는 나올시다" (본사3, 가뭄에 언뜻 내리는 비를 보고 밭을 갈기 위해 소를 빌리러 감)'},
      {orig:'초경(初更)도 거읜ᄃᆡ 긔 엇지 와 겨신고. 연년(年年)에 이러ᄒᆞ기 구차(苟且)ᄒᆞᆫ 줄 알건마ᄂᆞᆫ 쇼 업ᄉᆞᆫ 궁가(窮家)애 혜염 만하 왓삽노라. 공(空)ᄒᆞ니나 갑시나 주엄 즉도 ᄒᆞ다마ᄂᆞᆫ, 다만 어제 밤의 거넨 집 져 사ᄅᆞᆷ이, 목 불근 수기치(雉)을 옥지읍(玉脂泣)게 ᄭᅮ어 ᄂᆡ고, 간 이근 삼해주(三亥酒)을 취(醉)토록 권(勸)ᄒᆞ거든, 이러한 은혜(恩惠)을 어이 아니 갑흘넌고. 내일(來日)로 주마 ᄒᆞ고 큰 언약(言約)ᄒᆞ야거든, 실약(失約)이 미편(未便)ᄒᆞ니 사셜이 어려왜라\n실위(實爲) 그러ᄒᆞ면 혈마 어이ᄒᆞᆯ고. 헌 먼덕 수기 스고 측 업슨 집신에 설피설피 물너 오니, 풍채(風採) 저근 형용(形容)애 ᄀᆡ 즈칠 ᄲᅮᆫ이로다', trans:'"초경이 거의 다 됐는데 어찌 와 계신가" "매년 이러기가 구차한 줄 알지마는 소 없는 가난한 집에 걱정이 많아 왔사옵니다. 공짜로나 값을 받고나 줄 법도 하다마는, 다만 어젯밤에 건넛집 저 사람이 목 붉은 수꿩을 기름이 흐르게 구워 내고 갓 익은 삼해주를 취하도록 권하거든 이러한 은혜를 어찌 아니 갚을 것인가. 내일 주마 하고 굳게 언약하였으니 약속을 어기면 편치 않으니 말씀드리기 난처하오"\n"사실이 그러하면 설마 어찌하리" 헌 모자 숙여 쓰고 축 없는 짚신에 설피설피 물러나 오니, 풍채 작은 내 모습에 개가 짖을 뿐이로다 (본사4, 소를 빌리러 갔다가 수모를 당하고 옴)'},
      {orig:'와실(蝸室)에 드러간ᄃᆞᆯ 잠이 와사 누어시랴. 북창(北牕)을 비겨 안자 ᄉᆡ배ᄅᆞᆯ 기다리니, 무정(無情)한 대승(戴勝)은 이ᄂᆡ 한(恨)을 도우ᄂᆞ다. 종조(終朝) 추창(惆悵)ᄒᆞ야 먼 들흘 바라보니, 즐기ᄂᆞᆫ 농가(農歌)도 흥(興) 업서 들리ᄂᆞ다. 세정(世情) 모ᄅᆞᆫ 한숨은 그칠 줄을 모ᄅᆞᄂᆞ다\nᄋᆞᄭᅡ온 져 소뷔(犁)ᄂᆞᆫ 볏보님도 됴ᄒᆞᆯ세고. 가시 엉긘 묵은 밧도 용이(容易)케 갈련마ᄂᆞᆫ, 허당 반벽(虛堂半壁)에 슬ᄃᆡ업시 걸려고야. 춘경(春耕)도 거의거다 후리쳐 더뎌 두쟈', trans:'좁은 방에 들어간들 잠이 와서 누워 있겠는가. 북창을 빗겨 앉아 새벽을 기다리니, 무정한 오디새는 이 내 한을 돋우는구나. 아침 내내 슬퍼하며 먼 들을 바라보니, 즐기는 농가도 흥 없이 들린다. 세상물정 모르는 한숨은 그칠 줄을 모른다\n아까운 저 쟁기는 쟁기의 날도 좋구나. 가시 엉킨 묵은 밭도 쉽게 갈련마는, 텅 빈 집 벽에 쓸데없이 걸려있구나. 봄 농사도 거의 다 끝났다, 후리쳐 던져 두자 (본사5, 매정한 세태를 한탄하며 밭갈이를 포기함)'},
      {orig:'강호(江湖)ᄒᆞᆫ ᄭᅮᆷ을 ᄭᅮ언지도 오ᄅᆡ러니, 구복(口腹)이 위루(爲累)ᄒᆞ야 어지버 이져ᄯᅥ다. 첨피기욱(瞻彼淇燠)혼ᄃᆡ 녹죽(綠竹)도 하도 할샤. 유비군자(有斐君子)들아 낙ᄃᆡ ᄒᆞ나 빌려ᄉᆞ라. 노화(蘆花) 깁픈 곳애 명월 청풍(明月淸風) 벗이 되야, 님ᄌᆡ 업ᄉᆞᆫ 풍월강산(風月江山)애 절로절로 늘그리라. 무심(無心)한 백구(白鷗)야 오라 ᄒᆞ며 말라 ᄒᆞ랴. 다토리 업슬ᄉᆞᆫ 다문 인가 너기로라', trans:'강호에 묻혀 살 꿈을 꾼 지도 오래더니, 먹고사는 일에 얽매여 아, 잊고 있었구나. 저 강가를 보니 푸른 대나무도 많고 많구나. 훌륭한 군자들아 낚싯대 하나 빌려다오. 갈대꽃 깊은 곳에 밝은 달 맑은 바람을 벗으로 삼아, 임자 없는 풍월강산에 절로절로 늙으리라. 무심한 백구야 오라 하며 가라 하랴. 다툴 이 없는 것은 다만 이뿐인가 여기노라 (본사6, 자연에 묻혀 늙어 가기를 소망함)'},
      {orig:'무상(無狀)한 이 몸애 무ᄉᆞᆫ 지취(志趣) 이스리마ᄂᆞᆫ, 두세 이렁 밧논를 다 무겨 더뎌 두고, 이시면 죽(粥)이오 업시면 굴물망졍, 남의 집 남의 거슨 전혀 부러 말렷스라. ᄂᆡ 빈천(貧賤) 슬히 너겨 손을 헤다 물너가며, 남의 부귀(富貴) 불리 너겨 손을 치다 나아오랴. 인간(人間) 어ᄂᆡ 일이 명(命) 밧긔 삼겨시리. 빈이무원(貧而無怨)을 어렵다 ᄒᆞ건마ᄂᆞᆫ ᄂᆡ 생애(生涯) 이러호ᄃᆡ 설온 ᄯᅳᆺ은 업노왜라. 단사표음(簞食瓢飮)을 이도 족(足)히 너기로라. 평생(平生) ᄯᅳᆺ이 온포(溫飽)애ᄂᆞᆫ 업노왜라\n태평천하(太平天下)애 충효(忠孝)를 일을 삼아 화형제(和兄弟) 신붕우(信朋友) 외다 ᄒᆞ리 뉘 이시리. 그 밧긔 남은 일이야 삼긴 ᄃᆡ로 살렷노라', trans:'변변찮은 이 몸에 무슨 지취가 있으리마는, 두세 이랑 밭논을 다 묵혀 던져 두고, 있으면 죽이요 없으면 굶을망정, 남의 집 남의 것은 전혀 부러워 말리라. 내 빈천을 슬피 여겨 손을 내젓는다고 물러가며, 남의 부귀를 부럽게 여겨 손짓한다고 나아오랴. 인간 세상 어느 일이 운명 밖에 생겨났으리. 가난하되 원망하지 않기가 어렵다 하건마는 내 생애 이러하되 서러운 뜻은 없도다. 한 그릇 밥과 한 표주박 물을 이도 족하게 여기노라. 평생의 뜻이 배부르고 따뜻함에는 없도다\n태평천하에 충효를 일로 삼아 형제간에 화목하고 벗에게 신의 있음을 그르다 할 이 누가 있으리. 그 밖의 남은 일이야 타고난 대로 살아가리라 (결사, 빈이무원의 삶을 추구하면서 충효와 우애·신의를 지향하고자 함)'}
    ],
    summary:{
      theme:'임진왜란 직후 곤궁한 생활 속에서도 빈이무원(貧而無怨)·안빈낙도의 삶을 추구하는 사대부의 심경을 노래함',
      features:['전가귀거래류 가사 — 전쟁 후 실제 궁핍한 생활상을 사실적으로 그려냄(다른 강호가사류의 관념적 안빈낙도와 차별화)','대화체를 사용하여 소를 빌리러 갔다가 수모를 당하는 장면을 극적·서사적으로 형상화 — 사대부 가사에 드문 사실적 산문체','이덕형에게 화답하여 지은 작품으로 알려짐'],
      examPoints:['소를 빌리러 갔다가 수모를 당하는 장면(본사4)의 대화체 서술은 조선 후기 가사의 변모(관념적 자연예찬 → 현실 인식 강화)를 보여주는 핵심 대목으로 자주 출제됨','강호가사(관념적 자연 예찬)에서 현실 인식이 강화된 가사로의 이행을 보여주는 작품으로 <상춘곡>·<면앙정가> 등과 비교하는 문항 가능','빈이무원·단사표음 등 유교 경전(논어)에서 온 표현의 배경지식 확인','사대부로서의 지위도, 온전한 농민으로서의 여건도 갖추지 못한 처지에서 오는 소외감과, 그럼에도 유교적 가치(충효·우애·신의)로 귀착하는 결말 구조를 확인해둘 것']
    }},
  { id:'gwandongbyeolgok', genre:'가사', title:'관동별곡', author:'정철', era:'조선 중기',
    lines:[
      {orig:'江湖에 病이 깁퍼 竹林에 누엇더니, 關東 八百里에 方面을 맛디시니, 어와 聖恩이야 가디록 罔極ᄒᆞ다. 延秋門 드리ᄃᆞ라 慶會南門 ᄇᆞ라 보며, 下直고 믈너나니 玉節이 알ᄑᆡ 셧다. 平丘驛 ᄆᆞᆯ을 ᄀᆞ라 黑水로 도라 드니, 蟾江은 어듸메오 雉嶽은 여기로다', trans:'강호에서 병이 깊어 죽림에 누워 있었는데, 관동 팔백리 방면(관찰사)을 맡기시니, 어와 성은이야 갈수록 망극하다. 연추문 들어와 경회남문 바라보며, 하직하고 물러나니 옥절이 앞에 있다. 평구역 말을 갈아타고 흑수로 돌아 드니, 섬강은 어디인가 치악은 여기로다 (서사1, 관찰사 부임의 여정)'},
      {orig:'昭陽江 ᄂᆞ린 믈이 어드러로 든단 말고. 孤臣 去國에 白髮도 하도 할샤. 東州 밤 계오 새와 北寬亭의 올나 ᄒᆞ니, 三角山 第一峯이 ᄒᆞ마면 뵈리로다. 弓王 大闕 터희 烏鵲이 지지괴니 千古 興亡을 아ᄂᆞᆫ다 몰ᄋᆞᄂᆞᆫ다. 淮陽 녜 일홈이 마초아 ᄀᆞᄐᆞᆯ시고 汲長孺 風彩를 고텨 아니 볼 거이고', trans:'소양강 내린 물이 어디로 흘러간단 말인가. 외로운 신하가 나라를 떠나는데 백발도 많기도 많구나. 동주에서 밤을 겨우 새워 북관정에 올라가니, 삼각산 제일봉이 곧 보일 것이다. 궁예의 대궐 터에 까마귀와 까치가 지저귀니 천고의 흥망을 아는지 모르는지. 회양의 옛 이름이 마침 (한나라 회양과) 같으니 급장유의 풍채를 이곳에서 다시 보이지 않을까 (서사2, 관내를 순력하며 선정의 포부를 다짐)'},
      {orig:'營中이 無事ᄒᆞ고 時節이 삼월인 제, 花川 시내 길히 風岳으로 버더 잇다. 行裝을 다 ᄯᅥᆯ티고 石逕의 막대 디퍼, 百川洞 겨ᄐᆡ 두고 萬瀑洞 드러가니, 銀 ᄀᆞᄐᆞᆫ 무지게 玉ᄀᆞᄐᆞᆫ 용의 초리, 섯돌며 ᄲᅮᆷ는 소리 十里의 ᄌᆞ자시니, 들을 제ᄂᆞᆫ 우레러니 보니ᄂᆞᆫ 눈이로다. 金剛臺 ᄆᆡᆫ 우 層의 仙鶴이 삿기 치니, 春風 玉笛聲의 첫ᄌᆞᆷ을 ᄭᆡ돗던디, 縞衣玄裳이 半空의 소소 ᄯᅳ니, 西湖 녯 主人을 반겨셔 넘노ᄂᆞᆫ ᄃᆞᆺ', trans:'병영이 무사하고 시절이 삼월인 때, 화천 시내 길이 풍악(금강산)으로 뻗어 있다. 행장을 다 떨치고 돌길에 지팡이 짚어, 백천동을 곁에 두고 만폭동에 들어가니, 은 같은 무지개 옥 같은 용의 꼬리, 섞이며 뿜는 물소리 십 리에 자자하니, 들을 땐 우레러니 보니는 눈이로다. 금강대 맨 위층에 선학이 새끼를 치니, 봄바람에 들리는 옥피리 소리에 첫잠을 깬 것인지, 흰 옷 검은 치마 차림(학)이 반공에 솟아오르니, 서호 옛 주인(임포)을 반겨서 넘노는 듯 (본사1-1, 만폭동의 장관과 금강대의 선학)'},
      {orig:'小香爐 大香爐 눈 아래 구버보고, 正陽寺 眞歇臺 고텨 올나 안ᄌᆞᆫ마리, 廬山 眞面目이 여긔야 다 뵈ᄂᆞ다. 어와 造化翁이 헌ᄉᆞ토 헌ᄉᆞ할샤. 날거든 ᄯᅱ디 마나 셧거든 솟디 마나. 芙蓉을 고잣ᄂᆞᆫ ᄃᆞᆺ 白玉을 믓것ᄂᆞᆫ ᄃᆞᆺ, 東溟을 박차ᄂᆞᆫ ᄃᆞᆺ 北極을 괴왓ᄂᆞᆫ ᄃᆞᆺ. 놉흘시고 望高臺, 외로올샤 穴望峰이 하늘의 추미러 므ᄉᆞ 일을 ᄉᆞ로리라 千萬劫 디나ᄃᆞ록 구필 줄 모ᄅᆞᄂᆞᆫ다. 어와 너여이고 너 ᄀᆞᄐᆞ니 ᄯᅩ 잇는가\n開心臺 고텨 올나 衆香城 ᄇᆞ라보며, 萬二千峰을 歷歷히 혀여ᄒᆞ니, 峰마다 ᄆᆡᆺ쳐 잇고 긋마다 서린 긔운, ᄆᆞᆰ거든 조티 마나 조커든 ᄆᆞᆰ디 마나. 뎌 긔운 흐터 내야 人傑을 ᄆᆞᆫᄃᆞᆯ고쟈. 形容도 그지업고 體勢도 하도 할샤. 天地 삼기실 제 自然이 되연마ᄂᆞᆫ, 이제 와 보게 되니 有情도 有情ᄒᆞ샤', trans:'소향로 대향로를 눈 아래 굽어보고, 정양사 진헐대에 다시 올라 앉으니, 여산의 진면목이 여기서 다 보이는구나. 어와 조물주의 솜씨가 야단스럽기도 야단스럽구나. 날거든 뛰지 말거나 서있거든 솟지 말거나 할 것이지. 연꽃을 꽂아놓은 듯 백옥을 묶어놓은 듯, 동해를 박차는 듯 북극을 떠받치는 듯. 높구나 망고대, 외롭구나 혈망봉이 하늘에 치밀어 올라 무슨 일을 아뢰려고 천만 겁이 지나도록 굽힐 줄을 모르는가. 어와 너로구나, 너 같은 이가 또 있는가\n개심대에 다시 올라 중향성을 바라보며, 만이천봉을 역력히 헤아려보니, 봉우리마다 맺혀 있고 끝마다 서린 기운, 맑거든 좋지 말거나 좋거든 맑지 말거나 할 것을. 저 기운 흩어 내어 인걸을 만들고 싶다. 형용도 끝이 없고 형세도 하도 많구나. 천지가 생겨날 때 저절로 되었으련만, 이제 와서 보니 다 뜻이 있는 듯하구나 (본사1-2, 진헐대와 개심대에서의 금강산 조망)'},
      {orig:'毗盧峰 上上頭의 올라 보니 긔 뉘신고. 東山 泰山이 어ᄂᆞ야 놉돗던고. 魯國 조븐 줄도 우리ᄂᆞᆫ 모ᄅᆞ거든, 넙거나 넙은 天下 엇ᄯᅵᄒᆞ야 젹닷말고. 어와 뎌 디위ᄅᆞᆯ 어이ᄒᆞ면 알 거이고. 오ᄅᆞ디 못ᄒᆞ거니 ᄂᆞ려가미 고이ᄒᆞᆯ가\n圓通골 ᄀᆞᄂᆞᆫ 길 獅子峰을 ᄎᆞ자가니, 그 알ᄑᆡ 너러바회 化龍쇠 되여셰라. 千年 老龍이 구ᄇᆡ구ᄇᆡ 서려 이셔, 晝夜의 흘녀 내여 滄海예 니어시니, 風雲을 언제 어더 三日雨를 디련ᄂᆞᆫ다. 陰崖예 이온 플을 다 살와 내여ᄉᆞ라', trans:'비로봉 맨 꼭대기에 올라 본 이 그 누구인가. 동산과 태산 중 어느 것이 더 높던가. 노나라가 좁은 줄도 우리는 모르는데, 넓고도 넓은 천하를 어찌하여 작다고 말하는가. 어와 저 (공자의) 경지를 어찌하면 알 수 있을까. 오르지 못하니 내려감이 이상할 것 있으랴\n원통골 가는 길 사자봉을 찾아가니, 그 앞의 넓은 바위가 화룡소가 되었구나. 천 년 묵은 용이 굽이굽이 서려 있어, 밤낮으로 흘러 내려 동해에 이어지니, 풍운을 언제 얻어 삼 일 비를 내리려는가. 그늘진 벼랑에 시든 풀을 다 살려 내어라 (본사1-3, 비로봉과 화룡소에서의 감회)'},
      {orig:'磨訶衍 妙吉祥 雁門재 너머 디여, 외나모 ᄡᅥ근 ᄃᆞ리 佛頂臺 올라ᄒᆞ니, 千尋絶壁을 半空애 셰여 두고, 銀河水 한 구ᄇᆡᄅᆞᆯ 촌촌이 버혀 내여, 실ᄀᆞ티 플텨이셔 뵈ᄀᆞ티 거러시니, 圖經 열 두 구ᄇᆡ, 내 보매ᄂᆞᆫ 여러히라. 李謫仙 이제 이셔 고텨 의논ᄒᆞ게 되면, 廬山이 여긔도곤 낫단 말 못ᄒᆞ려니', trans:'마하연 묘길상 안문재 넘어 내려가, 외나무 썩은 다리로 불정대에 오르니, 천 길 절벽을 반공에 세워 두고, 은하수 한 굽이를 마디마디 베어 내어, 실같이 풀어헤쳐 있고 베같이 걸려 있으니, 도경(지도)에는 열두 굽이라 하나 내가 보기엔 여럿이라. 이태백이 지금 있어 다시 의논하게 되면, 여산 폭포가 여기보다 낫다는 말은 못 하리라 (본사1-4, 십이 폭포의 장관)'},
      {orig:'山中을 ᄆᆡ양 보랴, 東海로 가쟈ᄉᆞ라. 籃輿緩步ᄒᆞ야 山映樓의 올나ᄒᆞ니, 玲瓏碧溪와 數聲啼鳥ᄂᆞᆫ 離別을 怨ᄒᆞᄂᆞᆫ ᄃᆞᆺ, 旌旗를 ᄯᅥᆯ티니 五色이 넘노ᄂᆞᆫ ᄃᆞᆺ, 鼓角을 섯부니 海雲이 다 것ᄂᆞᆫ 듯. 鳴沙길 니근 ᄆᆞᆯ이 醉仙을 빗기 시러, 바다ᄒᆞᆯ 겻ᄐᆡ 두고 海棠花로 드러가니, 白鷗야 ᄂᆞ디 마라, 네 버딘 줄 엇디 아ᄂᆞᆫ', trans:'산중만 계속 보랴, 동해로 가자. 가마를 타고 천천히 산영루에 올라가니, 영롱한 푸른 시내와 여러 소리로 우는 새는 이별을 원망하는 듯, 깃발을 떨치니 오색이 넘노는 듯, 북과 나팔을 섞어 부니 바다 구름이 다 걷히는 듯. 명사길에 익숙한 말이 취한 신선(화자)을 비스듬히 실어, 바다를 곁에 두고 해당화 핀 곳으로 들어가니, 백구야 날지 마라, 내가 네 벗인 줄 어찌 아느냐 (본사2-1, 동해로 가는 감회)'},
      {orig:'金闌窟 도라드러 叢石亭 올라ᄒᆞ니, 白玉樓 남은 기동 다만 네히 셔 잇고야. 工倕의 셩녕인가, 鬼斧로 다ᄃᆞᄆᆞᆫ가. 구태야 六面은 므어슬 象톳던고\n高城을란 뎌만 두고 三日浦ᄅᆞᆯ ᄎᆞ자가니, 丹書ᄂᆞᆫ 宛然ᄒᆞ되 四仙은 어ᄃᆡ 가니. 예 사흘 머믄 後의 어ᄃᆡ 가 ᄯᅩ 머믈고. 仙遊潭 永郎湖 거긔나 가 잇ᄂᆞᆫ가. 淸澗亭 萬景臺 몃 고ᄃᆡ 안돗던고', trans:'금난굴 돌아들어 총석정에 올라가니, 백옥루의 남은 기둥이 다만 넷이 서 있구나. 공수(뛰어난 장인)의 솜씨인가, 귀신의 도끼로 다듬었는가. 구태여 육면은 무엇을 본떴는가\n고성은 저만치 두고 삼일포를 찾아가니, 붉은 글씨는 뚜렷한데 사선(네 신선)은 어디 갔는가. 여기서 사흘 머문 후에 어디 가서 또 머물렀는가. 선유담 영랑호 거기나 가 있는가. 청간정 만경대는 몇 군데 앉아있었던가 (본사2-2, 총석정의 장관과 삼일포에서의 회고)'},
      {orig:'梨花ᄂᆞᆫ ᄇᆞᆯ셔 디고 졉동새 슬피 울 제, 洛山 東畔으로 義相臺예 올라 안자, 日出을 보리라 밤듕만 니러ᄒᆞ니, 祥雲이 집픠ᄂᆞᆫ 동, 六龍이 바퇴ᄂᆞᆫ 동, 바다ᄒᆡ ᄯᅥ날 제는 萬國이 일위더니, 天中의 티ᄯᅳ니 毫髮을 혜리로다. 아마도 녈구름 근쳐의 머믈셰라. 詩仙은 어ᄃᆡ 가고 咳唾만 나맛ᄂᆞ니. 天地間 壯ᄒᆞᆫ 긔별 ᄌᆞ셔히도 ᄒᆞᆯ셔이고', trans:'배꽃은 벌써 지고 접동새 슬피 울 때, 낙산 동쪽 가로 의상대에 올라 앉아, 일출을 보리라 밤중에 일어나니, 상서로운 구름이 피어나는 듯, 여섯 용이 (해를) 떠받치는 듯, 바다에서 떠날 때는 온 세상이 흔들리더니, 하늘 가운데 치솟으니 가는 터럭까지 헤아릴 만하구나. 행여나 지나가는 구름이 근처에 머무를까 두렵다. 시선(이백)은 어디 가고 그가 남긴 시구만 남았는가. 천지간의 장한 소식을 자세히도 표현하였구나 (본사2-3, 의상대에서의 일출)'},
      {orig:'斜陽 峴山의 텩튝을 므니ᄇᆞᆯ와 羽蓋芝輪이 鏡浦로 ᄂᆞ려가니, 十里氷紈을 다리고 고텨 다려, 長松 울흔 소개 슬ᄏᆞ장 펴뎌시니, 믈결도 자도 잘샤 모래ᄅᆞᆯ 혜리로다. 孤舟解纜ᄒᆞ야 亭子 우ᄒᆡ 올나가니, 江門橋 너믄 겨ᄐᆡ 大洋이 거긔로다. 從容ᄒᆞᆫ댜 이 氣像, 闊遠ᄒᆞᆫ댜 뎌 境界, 이도곤 ᄀᆞᄌᆞᆫ ᄃᆡ ᄯᅩ 어듸 잇닷 말고. 紅粧 古事ᄅᆞᆯ 헌ᄉᆞ타 ᄒᆞ리로다\n江陵 大都護 風俗이 됴흘시고, 節孝旌門이 골골이 버러시니, 比屋可封이 이제도 잇다 ᄒᆞᆯ다', trans:'석양의 현산에서 철쭉을 짓밟으며 수레가 경포로 내려가니, 십 리에 펼친 흰 비단(호수)을 다리고 다시 다린 듯, 큰 소나무 우거진 속에 실컷 펼쳐져 있으니, 물결도 잔잔하기도 잔잔하여 모래알을 셀 수 있을 정도다. 외로운 배 닻줄을 풀어 정자 위에 올라가니, 강문교 넘은 곁에 큰 바다가 거기로다. 조용하구나 이 기상, 아득하구나 저 경계, 이보다 갖춘 데가 또 어디 있단 말인가. 홍장의 옛 이야기를 야단스럽다 하리로다\n강릉 대도호부의 풍속이 좋구나, 절효정문이 마을마다 벌여 있으니, 집집마다 정문을 세울 만하다는 말이 지금도 있다 할 것이다 (본사2-4, 경포의 장관과 강릉의 미풍양속)'},
      {orig:'眞珠館 竹西樓 五十川 ᄂᆞ린 믈이 太白山 그림재ᄅᆞᆯ 東海로 다마 가니, ᄎᆞᆯ하리 漢江의 木覓의 다히고져. 王程이 有限ᄒᆞ고 風景이 못 슬믜니, 幽懷도 하도 할샤, 客愁도 둘 듸 업다. 仙槎ᄅᆞᆯ ᄯᅴ워 내여 斗牛로 向ᄒᆞ살가, 仙人을 ᄎᆞᄌᆞ려 丹穴의 머므살가\n天根을 못내 보와 望洋亭의 올은말이, 바다 밧근 하ᄂᆞᆯ이니 하ᄂᆞᆯ 밧근 므서신고. ᄀᆞᆺ득 노ᄒᆞᆫ 고래, 뉘라셔 놀내관ᄃᆡ, 블거니 ᄲᅳᆷ거니 어즈러이 구ᄂᆞᆫ디고. 銀山을 것거 내여 六合의 ᄂᆞ리ᄂᆞᆫ ᄃᆞᆺ, 五月 長天의 白雪은 므ᄉᆞ 일고', trans:'진주관 죽서루 아래 오십천 흘러내리는 물이 태백산 그림자를 동해로 담아 가니, 차라리 한강의 남산에 닿게 하고 싶구나. 여정이 정해져 있고 풍경은 싫증나지 않으니, 마음속 회포도 많고 많아 나그네의 시름도 둘 곳이 없다. 신선의 뗏목을 띄워 내어 북두성 견우성으로 향할까, 신선을 찾으러 단혈에 머물러 살까\n하늘 끝을 못내 보고 망양정에 오르니, 바다 밖은 하늘이니 하늘 밖은 무엇인가. 잔뜩 성난 고래(파도)를 누가 놀라게 했기에, 불거니 뿜거니 어지럽게 구는 것인가. 은산을 꺾어 내어 온 세상에 내리는 듯, 오월 여름 하늘에 백설은 무슨 일인가 (본사2-5, 죽서루에서의 객수와 망양정에서의 조망)'},
      {orig:'져근덧 밤이 드러 風浪이 定ᄒᆞ거ᄂᆞᆯ, 扶桑 咫尺의 明月을 기ᄃᆞ리니, 瑞光 千丈이 뵈ᄂᆞᆫ ᄃᆞᆺ 숨ᄂᆞᆫ고야. 珠簾을 고텨 것고, 玉階ᄅᆞᆯ 다시 쓸며, 啓明星 돗도록 곳초 안자 ᄇᆞ라보니, 白蓮花 한 가지를 뉘라셔 보내신고. 일이 됴흔 世界 ᄂᆞᆷ대되 다 뵈고져. 流霞酒 ᄀᆞ득 부어 ᄃᆞᆯ다려 무론 말이, 英雄은 어ᄃᆡ 가며, 四仙은 긔 뉘러니, 아ᄆᆡ나 맛나 보아 녯 긔별 뭇쟈 ᄒᆞ니, 仙山 東海예 갈 길히 머도 멀샤', trans:'잠깐 사이 밤이 되어 풍랑이 잔잔해지거늘, 해 뜨는 곳 가까이서 밝은 달을 기다리니, 상서로운 빛 천 길이 보이는 듯 숨는구나. 주렴을 다시 걷고 옥계단을 다시 쓸며, 샛별이 돋도록 꼿꼿이 앉아 바라보니, 흰 연꽃 한 가지를 누가 보내셨는가. 이리 좋은 세상을 남에게 다 보여주고 싶다. 유하주를 가득 부어 달에게 물어본 말이, 영웅은 어디 갔으며 사선은 그 누구인가, 아무나 만나 보아 옛 소식 묻고자 하니, 신선의 산 동해에 갈 길이 멀기도 멀구나 (결사1, 망양정에서의 월출과 신선에 대한 동경)'},
      {orig:'松根을 볘여 누어 픗ᄌᆞᆷ을 얼픗 드니, ᄭᅮᆷ애 ᄒᆞᆫ 사ᄅᆞᆷ이 날ᄃᆞ려 닐온 말이, 그ᄃᆡ를 내 모ᄅᆞ랴, 上界예 眞仙이라. 黃庭經 一字ᄅᆞᆯ 엇디 그ᄅᆞᆺ 닐거 두고, 人間의 내려와셔 우리ᄅᆞᆯ ᄯᆞᆯ오ᄂᆞᆫ다. 져근덧 가디 마오, 이 술 ᄒᆞᆫ 잔 머거 보오. 北斗星 기우려 滄海水 부어 내여, 저 먹고 날 머겨ᄂᆞᆯ 서너 잔 거후로니, 和風이 習習ᄒᆞ야 兩腋을 추혀 드니, 九萬里 長空애 져기면 ᄂᆞᆯ리로다\n이 술 가져다가 四海예 고로 ᄂᆞᆫ화, 億萬蒼生을 다 醉케 ᄆᆡᆼ근 後의, 그제야 고텨 맛나 ᄯᅩ 한 잔 ᄒᆞ쟛고야. 말디쟈 鶴을 ᄐᆞ고 九空의 올나가니, 空中 玉蕭 소ᄅᆡ 어제런가 그제런가. 나도 ᄌᆞᆷ을 ᄭᆡ여 바다ᄒᆞᆯ 구버보니, 기픠ᄅᆞᆯ 모ᄅᆞ거니 ᄀᆞ인들 엇디 알리. 明月이 千山萬落의 아니 비쵠 ᄃᆡ 업다', trans:'소나무 뿌리 베고 누워 풋잠이 얼핏 드니, 꿈에 한 사람이 나에게 이르는 말이, 그대를 내 모르랴, 그대는 천상의 신선이라. 황정경 한 글자를 어찌 잘못 읽고서, 인간 세상에 내려와서 우리를 따르는가. 잠깐 가지 마오, 이 술 한 잔 먹어 보오. 북두칠성 기울여 푸른 바닷물 부어 내어, 저 먹고 나 먹이거늘 서너 잔 기울이니, 온화한 바람이 산들산들하여 두 겨드랑이를 추켜 드니, 구만리 넓은 하늘을 웬만하면 날 것 같구나\n이 술 가져다가 온 세상에 고루 나누어, 모든 백성을 다 취하게 만든 후에, 그제야 다시 만나 또 한 잔 하자꾸나. 말이 끝나자 학을 타고 하늘로 올라가니, 공중에서 들리는 옥피리 소리가 어제인가 그제인가. 나도 잠을 깨어 바다를 굽어보니, 깊이를 모르는데 끝인들 어찌 알리. 밝은 달이 온 산과 마을에 아니 비친 데가 없다 (결사2, 꿈속에서 신선을 만나며 애민의 포부를 드러냄)'}
    ],
    summary:{
      theme:'강원도 관찰사로 부임하여 금강산과 관동팔경을 유람하며 절경에 대한 감탄, 신하로서의 우국충정·연군지정, 애민 사상을 노래함',
      features:['기행 가사(여정-견문-감상 구조)의 대표작 — 서사(부임)-본사1(내금강: 만폭동·진헐대개심대·비로봉화룡소·십이폭포)-본사2(관동팔경과 동해안: 총석정삼일포·의상대일출·경포강릉·죽서루망양정)-결사(월출과 꿈)의 4단 구성','3·4조 4음보 연속체, 영탄법·대구법·생략법을 잘 활용','우리말의 아름다움을 살린 뛰어난 언어적 기교, 국문 가사문학의 전범으로 꼽힘'],
      examPoints:['내금강·관동팔경·동해안 유람으로 이어지는 전체 구조(서사-본사1 내금강-본사2 관동팔경과 동해안-결사) 정리','\'고신 거국\'(외로운 신하가 도성을 떠남)에 드러난 우국지정','궁예의 옛 대궐터(철원)를 지나며 역사의 흥망을 회고하는 대목 — 무상감의 정서 확인','결사에서 꿈속 신선과의 만남을 통해 "億萬蒼生을 다 醉케"(모든 백성을 취하게 하고 싶다)라는 애민 사상으로 마무리되는 구조 — 신선 세계에 대한 동경과 현실(목민관)로서의 책무가 한 편에 공존한다는 점을 확인해둘 것','작가 자신의 처지(개인)와 관찰사로서의 공적 임무(목민관) 사이의 내적 갈등이 도처에 드러난다는 점을 <사미인곡>류의 연군지정과는 다른 관동별곡만의 특징으로 정리해둘 것']
    }},
  { id:'yongbuga', genre:'가사', title:'용부가', author:'작자 미상', era:'조선 후기',
    lines:[
      {orig:'흉보기도 실타마는 져 부인 모양 보소 親庭의 편지ᄒᆞ여 媤집 凶도 ᄒᆞ고 만네 시집간 지 셕 달 만의 시집ᄉᆞ리 甚심ᄒᆞ다고\n게검시런 시아바니와 암특ᄒᆞᆯᄉᆞ 시어머너미 야의덕이 시뉘들과 엄슉덕이 맛동셔며 요악ᄒᆞᆫ 아오동셰와 녀호 갓튼 시앗년에 긔셰롭다 男奴女婢 들며나며 훙부덕이 여긔져긔 ᄉᆞ셜이요 구셕구셕 모함니라\n남편이라 미더든니 十伐之木 되냐셰라', trans:'흉보기도 싫다마는 저 부인 모양 보소. 친정에 편지하여 시집 흉도 많고 많네. 시집간 지 석 달 만에 시집살이 심하다고\n게걸스러운 시아버지와 암특한 시어머님이, 고자질하는 시누이들과 엄숙한 맏동서며, 요악한 아우동서와 여우 같은 시앗년(첩)에, 드세다 남녀 노비 들며나며 흉보더니 여기저기 사설이요 구석구석 모함이라\n남편이라 믿었더니 열 번 벤 나무(십벌지목) 되었구나'},
      {orig:'시집ᄉᆞ리 못ᄒᆞᄀᆡᆺ네 간슈병이 어ᄃᆡ 간노 치마 씨고 ᄂᆡ닷기와 褓보ᄶᅵᆷ ᄊᆞ고 逃亡도망질의 오락가락 못 견듸여 僧승년이나 ᄯᆞ라갈가 들구경이나 ᄒᆞ여보며 나물이나 ᄯᅳᆺ어볼가\n긴 長竹이 벗님이요 問卜문복ᄋᆞ기 消日소일이라 것트로난 셜름이요 속으로난 ᄯᅡᆫᄉᆡᆼ각의 半粉黛반분ᄯᆡ로 일을 ᄉᆞᆷ고 털ᄲᅩᆸ기가 歲月세워링요', trans:'시집살이 못하겠네, 간수병이 어디 갔는가(자살 소동). 치마 쓰고 내닫기와 봇짐 싸고 도망질에, 오락가락 못 견디어 중들이나 따라갈까, 들구경이나 해보며 나물이나 뜯어볼까\n긴 장죽(담뱃대)이 벗님이요 점보기가 소일거리라. 겉으로는 시름이요 속으로는 딴생각에, 화장으로 일을 삼고 털뽑기가 세월이요'},
      {orig:'시부모가 걱정하면 頑惡완악키 말對答이며 남편이 ᄉᆞ셜ᄒᆞ면 뒤즁그려 맛넉슈라 들고나면 쵸롱군이라 八字나 고쳐 볼가 兩班自揚양반자양 모도 ᄒᆞ며 色酒家색주가나 ᄒᆞ여 볼가', trans:'시부모가 걱정하면 완악하게 말대답이며, 남편이 사설하면 뒤받아 대꾸하고, 드나드는 초롱꾼에 팔자나 고쳐 볼까, 양반 자랑 모두 하며 색주가나 하여 볼까'},
      {orig:'남대문 박 ᄲᆡᆼ덕어미 졔 天性이 져러ᄒᆞᆫ가 ᄇᆡ와셔 글어ᄒᆞᆫ가 본ᄃᆡ업시 ᄌᆞ라구나 여긔져긔 무릅마침 싸홈질노 세월이요 나며ᄂᆞᆫ 말 傳主요 들며ᄂᆞᆫ 飮食共論\n졔 祖上은 졔쳐노코 佛供ᄒᆞ기 爲業이요 巫堂 소경 苦惑ᄒᆞ여 衣服가지 다 ᄂᆡ가고', trans:'남대문 밖 뺑덕어미 제 천성이 저러한가, 배워서 그러한가, 본데없이 자랐구나. 여기저기 무릎맞춤 싸움질로 세월이요, 나가면 이간질이요 들어오면 음식 타박이라\n제 조상은 제쳐놓고 불공하기가 위업이요, 소경 무당의 굿에 옷가지 다 내주고'},
      {orig:'남편 貌樣모양 볼작시면 ᄉᆞᆸ살ᄀᆡ의 뒤다리라 子息擧動 볼작시면 털버슨 숄ᄀᆡ미라 엿장ᄉᆞ와 ᄯᅥᆨ장ᄉᆞ는 아기 핑계 걸으치 안코 물네 압 씨야 압흔 션하품의 기지ᄀᆡ라 이야기ᄎᆡᆨ이 消日소일이요 淫談悖說음담패설 歲月이라', trans:'남편 모양 볼작시면 삽살개의 뒷다리라, 자식 거동 볼작시면 털벗은 솔개미라, 엿장사와 떡장사는 아기 핑계로 다 부르고, 물레 앞 씨아 앞은 하품에 기지개라, 이야기책이 소일이요 음담패설이 세월이라'},
      {orig:'이 집 져 집 以奸이간질로 모함 ᄌᆞᆸ고 ᄯᅩᆼ 먹기며 人物招人 ᄯᅥᆯ어ᄂᆡ며 佩패죡박니 되야구나 셰간이 ᄶᅡᆯ나가고 걱졍은 늘어가며 치마는 ᄶᅡᆯ나가고 허릿동이 기러간다', trans:'이 집 저 집 이간질로 모함 잡고 똥 먹이며, 인물 트집 떨어내며 쪽박 신세가 되었구나. 세간이 줄어가고 걱정은 늘어가며 치마는 짧아가고 허리끈은 길어간다'},
      {orig:'총 업ᄂᆞᆫ 헌 집신에 어린 子息 둘쳐 업고 婚姻葬祀 집집마다 飮食투심 일을 ᄉᆞᆷ고 ᄭᅮᆫ 냥식 거울너라 ᄒᆞᆫ 번 飽食ᄒᆞ여보ᄌᆞ 아ᄒᆡ ᄊᆞ홈 어룬 ᄊᆞ홈 家夫之罪로 ᄆᆡ 맛치고 일업시 셩을 ᄂᆡ여 어린 자식 구달고 시앗슬 무여ᄒᆞ여 中媒 怨望니라', trans:'총 없는 헌 짚신에 어린 자식 둘쳐 업고, 혼인·장례 치르는 집집마다 음식 탐내는 일을 일삼고, "꾼 양식 걷을라, 한 번 포식해보자" 아이 싸움 어른 싸움에 남편의 죄로 매 맞게 하고, 일없이 성을 내어 어린 자식 두들기며, 첩을 미워하여 중매아비를 원망한다'},
      {orig:'며나리를 ᄶᅩᆺᄎᆞ스니 아들은 홀아비요 ᄯᆞᆯ 子息을 다려오니 無禮無義 淫亂니요 두 손벽 두다리며 放聲大哭 駭怪ᄒᆞ다 무ᄉᆞᆷ ᄭᅩᆯ의 生妬忌로 머리 ᄊᆞ고 드러눕고 姦夫 달고 다라ᄂᆞ셔 官婢定屬 흐뭇지다', trans:'며느리를 내쫓으니 아들은 홀아비요, 딸자식을 도로 데려오니 무례하고 의리 없고 음란한 일이요, 두 손뼉 두드리며 대성통곡하니 해괴하다. 무슨 꼴에 생트집으로 머리 싸매고 드러눕고, 간부(姦夫)를 달고 달아나서 관비로 정속됨을 흐뭇해한다'},
      {orig:'無識무식ᄒᆞᆫ 여자들아 져 擧動을 ᄌᆞ셰 보니 글은 쥴을 아라거든 고칠 ᄀᆡᄌᆞ 심을 씨고 올흔 쥴을 알라거든 ᄒᆡᆼᄒᆡ기를 위쥬ᄒᆞ쇼', trans:'무식한 여자들아 저 거동을 자세히 보니, 그른 줄을 알았거든 고칠 개(改)자 마음에 새기고, 옳은 줄을 알았거든 행하기를 위주로 하소 (결어)'}
    ],
    summary:{
      theme:'뺑덕어미형 여인의 그릇된 행실을 조목조목 열거하며 여성들에게 올바른 행실을 깨우치는 반면교사식 풍자·교훈 가사',
      features:['<우부가>(염치없는 남성 삼인방을 풍자)와 짝을 이루는 작품 — 여성의 부정적 행실을 풍자',
   '시집살이 불평→가출·도피 충동→시부모·남편에 대한 반항→뺑덕어미의 행실(불공·굿·도둑질·이간질·자식 학대·간통)로 이어지는 점층적 구성',
   "\"삽살개의 뒷다리\", \"십벌지목\" 등 비속하고 과장된 비유로 대상을 희화화"],
      examPoints:['<계녀가>·<복선화음가> 등 "해야 할 행동"을 가르치는 정격 교훈가사와 달리, "하지 말아야 할 행동"을 열거하는 반면교사식 풍자 가사라는 점에서 교훈 전달 방식의 차이를 비교해둘 것',
   '조선 후기 서민층까지 향유층이 확대된 가사문학의 다양화를 보여주는 사례',
   '결어에서 "무식한 여자들아"로 직접 청자를 호명하며 개과천선을 촉구하는 교훈적 마무리 확인']
    }},

  { id:'doijangga', genre:'기타', title:'도이장가', author:'예종', era:'고려',

      features:['양주동 해독 기준 2절 4구(김완진 해독으로는 8구체) — 향찰로 표기된 마지막 시가','향가로 볼지 고려가요로 볼지 학계 이견 있음(표기는 향찰이나 창작 시기가 향가 전성기보다 훨씬 후대)','예종이 팔관회에서 두 공신을 기리는 가상희(假像戱)를 보고 지은 추모·송축가'],

  { id:'yongbieocheonga', genre:'기타', title:'용비어천가', author:'정인지 외', era:'조선 전기',
    lines:[
      {orig:'海東 육룡이 ᄂᆞᄅᆞ샤 일마다 천복이시니 古聖이 同符ᄒᆞ시니', trans:'우리나라에 육룡이 나시어 일마다 천복이시니, 옛 성군들이 한 일과 부절처럼 딱 맞으시니 (제1장)'},
      {orig:'불휘 기픈 남ᄀᆞᆫ ᄇᆞᄅᆞ매 아니 뮐ᄊᆡ 곶 됴코 여름 하ᄂᆞ니\nᄉᆡ미 기픈 므른 ᄀᆞᄆᆞ래 아니 그츨ᄊᆡ 내히 이러 바ᄅᆞ래 가ᄂᆞ니', trans:'뿌리 깊은 나무는 바람에 아니 흔들리므로 꽃이 좋고 열매가 많으니\n샘이 깊은 물은 가뭄에 아니 그치므로 내가 이뤄져 바다에 가니 (제2장)'},
      {orig:'周國대왕이 豳谷애 사ᄅᆞ샤 帝業을 여르시니\n우리 始祖ㅣ 慶興에 사ᄅᆞ샤 王業을 여르시니', trans:'주국대왕이 빈곡에 사시어 제업을 여시니\n우리 시조가 경흥에 사시어 왕업을 여시니 (제3장)'},
      {orig:'적인ㅅ 서리예 가샤 적인이 ᄀᆞᆯ외어늘 岐山 올ᄆᆞ샴도 하ᄂᆞᇙ ᄠᅳ디시니\n야인ㅅ 서리예 가샤 야인이 ᄀᆞᆯ외어늘 德源 올ᄆᆞ샴도 하ᄂᆞᇙ ᄠᅳ디시니', trans:'적인의 사이에 가시어 적인이 침범하거늘 기산으로 옮기심도 하늘 뜻이시니\n야인의 사이에 가시어 야인이 침범하거늘 덕원으로 옮기심도 하늘 뜻이시니 (제4장)'},
      {orig:'블근 새 그를 므러 침실 이페 안ᄌᆞ니 聖子革命에 帝祜ᄅᆞᆯ 뵈ᅀᆞᄫᆞ니\nᄇᆞ야미 가칠 므러 즘겟 가재 연ᄌᆞ니 聖孫將興에 嘉祥이 몬졔시니', trans:'붉은 새 글을 물어 침실 지겟문에 앉으니 성자의 혁명에 하늘이 내리는 복을 보인 것이니\n뱀이 까치를 물어 큰 나뭇가지에 앉으니 성손이 장차 흥할 아름다운 조짐이 먼저 나타난 것이니 (제7장)'},
      {orig:'굴허에 ᄆᆞᄅᆞᆯ 지내샤 도ᄌᆞ기 다 도라가니 반 길 노핀ᄃᆞᆯ 년기 다니리잇가\n石壁에 ᄆᆞᄅᆞᆯ 올이샤 도ᄌᆞᄀᆞᆯ 다 자ᄇᆞ시니 현 번 ᄩᅱ운ᄃᆞᆯ ᄂᆞ미 오ᄅᆞ리ᅌᅵᆺ가', trans:'구렁에 말을 지나게 하셔서 도적이 다 돌아가니 반 길 높인들 남들이 다니겠습니까\n석벽에 말을 올리셔서 도적을 다 잡으시니 몇 번 뛰운들 남이 오르겠습니까 (제8장)'},
      {orig:'四祖ㅣ 편안히 몯 겨샤 현 고ᄃᆞᆯ 올마시뇨 몃 간ㄷ 지븨 사ᄅᆞ시리ᅌᅵᆺ고\n九重에 드르샤 태평을 누리시ᇙ 제 이 ᄠᅳ들 닛디 마ᄅᆞ쇼셔', trans:'사조가 편안히 못 계셔서 몇 곳을 옮기셨습니까, 몇 칸 집에 사셨습니까\n궁궐에 들어 태평을 누리실 때 이 뜻을 잊지 마소서 (제110장)'},
      {orig:'千世 우희 미리 정ᄒᆞ샨 漢水北에 累仁開國ᄒᆞ샤 卜年이 ᄀᆞᇫ업스시니\n聖神이 니ᅀᆞ샤도 敬天勤民ᄒᆞ샤ᅀᅡ 더욱 구드리시리이다 님금하 아ᄅᆞ쇼셔', trans:'천세 전에 미리 정하신 한강 북쪽에 어진 일을 쌓고 개국하시어 나라의 운수가 끝이 없으시니\n성신이 이으셔도 하늘을 공경하고 백성을 부지런히 살펴야 나라가 더욱 굳을 것입니다, 임금이시여 아소서 (제125장)'}

/* ============ 상태 & 저장 ============ */
let state = { screen:'subject', subject:null, genre:null, work:null, lineIdx:0, revealed:false, randomWork:null, randomLineIdx:0, randomTab:'verse', randomRevealed:false };

function loadProgress(){
  try {
    const raw = localStorage.getItem('gjsg-progress');
    return raw ? JSON.parse(raw) : {};
  } catch(e){ return {}; }
}
function saveProgress(workId, completed){
  try {
    const p = loadProgress();
    p[workId] = { completed: completed, ts: Date.now() };
    localStorage.setItem('gjsg-progress', JSON.stringify(p));
  } catch(e){ /* storage unavailable — silently ignore */ }
}

/* ============ 렌더링 ============ */
const mainEl = document.getElementById('main');
const crumbEl = document.getElementById('crumb');
const backBtn = document.getElementById('backBtn');
const dotsEl = document.getElementById('progressDots');

backBtn.addEventListener('click', goBack);

function goBack(){
  if (state.screen === 'genre' || state.screen === 'placeholder') { state.screen = 'subject'; state.genre = null; state.subject = null; }
  else if (state.screen === 'work') { state.screen = 'genre'; state.genre = null; }
  else if (state.screen === 'card' || state.screen === 'summary') { state.screen = 'work'; state.work = null; }
  else if (state.screen === 'random') { state.screen = 'genre'; }
  render();
}

function render(){
  crumbEl.textContent = '';
  dotsEl.innerHTML = '';
  backBtn.classList.toggle('show', state.screen !== 'subject');

  if (state.screen === 'subject') renderSubject();
  else if (state.screen === 'placeholder') renderPlaceholder();
  else if (state.screen === 'genre') renderGenre();
  else if (state.screen === 'work') renderWorkList();
  else if (state.screen === 'card') renderCard();
  else if (state.screen === 'summary') renderSummary();
  else if (state.screen === 'random') renderRandom();
}

  { id:'literature', name:'문학', desc:`고전시가 ${WORKS.length}작품 · 원문 구절 넘기며 학습`, ready:true },

function renderSubject(){
  crumbEl.textContent = '임용 국어 공부';
  let html = '<div class="hero"><h1>임용 국어 공부</h1><p>준비하는 과목을 고르세요.</p></div>';
  html += '<div class="genre-grid">';
  SUBJECTS.forEach(s => {
    html += `<button class="genre-card ${s.ready ? '' : 'disabled'}" data-subject="${s.id}">
      <span class="gname">${s.name}</span>
      <span class="gcount">${s.desc}</span>
    </button>`;
  });
  html += '</div>';
  mainEl.innerHTML = html;
  mainEl.querySelectorAll('.genre-card').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.subject;
      const s = SUBJECTS.find(x => x.id === id);
      if (s.href) { window.location.href = s.href; return; }
      state.subject = id;
      state.screen = s.ready ? 'genre' : 'placeholder';
      render();
    });
  });
}

function renderPlaceholder(){
  const s = SUBJECTS.find(x => x.id === state.subject);
  crumbEl.textContent = s ? s.name : '';
  mainEl.innerHTML = `<div class="hero"><h1>${s ? s.name : ''}</h1>
    <p>아직 자료가 준비되지 않았습니다. 자료를 주시면 이 자리에 채워 넣겠습니다.</p></div>`;
}

  crumbEl.textContent = '문학 · 고전시가 연습';
  const progress = loadProgress();
  let html = '<div class="hero"><h1>고전시가 연습</h1><p>갈래를 고르고, 작품을 골라 원문을 한 구절씩 넘겨 보세요. 뜻이 막히면 해석 보기를 누르면 됩니다.</p></div>';
  html += '<div class="genre-grid">';
  GENRE_ORDER.forEach(g => {
    const count = WORKS.filter(w => w.genre === g).length;
    if (count === 0) return;
    const doneCount = WORKS.filter(w => w.genre === g && progress[w.id] && progress[w.id].completed).length;
    html += `<button class="genre-card" data-genre="${g}">
      <span class="gname">${g}</span>
      <span class="gcount">${count}작품${doneCount ? ' · '+doneCount+'개 완료' : ''}</span>
    </button>`;
  });
  html += '</div>';
  html += `<button class="random-entry" id="randomEntryBtn">
    <span>
      <span class="rtitle">랜덤 구절뽑기</span>
      <span class="rsub">전체 ${WORKS.reduce((n,w)=>n+w.lines.length,0)}개 구절 중 하나를 무작위로 뽑아 복습</span>
    </span>
    <span class="rdice">🎲</span>
  </button>`;
  mainEl.innerHTML = html;
  mainEl.querySelectorAll('.genre-card').forEach(btn => {
    btn.addEventListener('click', () => {
      state.genre = btn.dataset.genre;
      state.screen = 'work';
      render();
    });
  });
  document.getElementById('randomEntryBtn').addEventListener('click', () => {
    pickRandomLine();
    state.screen = 'random';
    render();
  });
}

function renderWorkList(){
  crumbEl.textContent = state.genre;
  const progress = loadProgress();
  const items = WORKS.filter(w => w.genre === state.genre);
  let html = '<div class="work-list">';
  items.forEach(w => {
    const done = progress[w.id] && progress[w.id].completed;
    html += `<button class="work-item" data-id="${w.id}">
      <span>
        <span class="wtitle">${w.title}</span>
        <span class="wauthor">${w.author} · ${w.era}</span>
      </span>
      ${done ? '<span class="wcheck">완료 ✓</span>' : ''}
    </button>`;
  });
  html += '</div>';
  mainEl.innerHTML = html;
  mainEl.querySelectorAll('.work-item').forEach(btn => {
    btn.addEventListener('click', () => {
      state.work = items.find(w => w.id === btn.dataset.id);
      state.lineIdx = 0;
      state.revealed = false;
      state.screen = 'card';
      render();
    });
  });
}

function renderCard(){
  const w = state.work;
  crumbEl.textContent = w.title;
  const n = w.lines.length;
  for (let i=0;i<n;i++){
    const d = document.createElement('span');
    if (i < state.lineIdx) d.className = 'done';
    else if (i === state.lineIdx) d.className = 'current';
    dotsEl.appendChild(d);
  }
  const line = w.lines[state.lineIdx];
  const hasTrans = !!line.trans;
  mainEl.innerHTML = hasTrans ? `
    <div class="card-wrap">
      <div class="card ${state.revealed ? 'revealed':''}" id="cardEl">
        <div class="orig">${line.orig}</div>
        <div class="trans">${line.trans}</div>
        <div class="tap-hint">탭하여 다음 구절</div>
      </div>
      <div class="card-controls">
        <button class="reveal-btn ${state.revealed?'on':''}" id="revealBtn">${state.revealed ? '해석 숨기기' : '해석 보기'}</button>
      </div>
    </div>` : `
    <div class="card-wrap">
      <div class="card revealed" id="cardEl">
        <div class="orig">${line.orig}</div>
        <div class="tap-hint">탭하여 다음 구절</div>
      </div>
    </div>`;
  document.getElementById('cardEl').addEventListener('click', nextLine);
  if (hasTrans) {
    document.getElementById('revealBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      state.revealed = !state.revealed;
      render();
    });
  }
}

function nextLine(){
  const w = state.work;
  if (state.lineIdx < w.lines.length - 1){
    state.lineIdx++;
    state.revealed = false;
    render();
  } else {
    saveProgress(w.id, true);
    state.screen = 'summary';
    render();
  }
}

function renderSummary(){
  const w = state.work;
  crumbEl.textContent = w.title;
  const s = w.summary;
  mainEl.innerHTML = `
    <div style="padding-top:8px;">
      <div class="summary-title">${w.title}</div>
      <div class="summary-author">${w.author} · ${w.genre} · ${w.era}</div>
      <div class="summary-card">
        <h2>주제</h2>
        <p>${s.theme}</p>
      </div>
      <div class="summary-card">
        <h2>표현상 특징</h2>
        <ul>${s.features.map(f => `<li>${f}</li>`).join('')}</ul>
      </div>
      <div class="summary-card">
        <h2>임용 대비 시사점</h2>
        <ul>${s.examPoints.map(f => `<li>${f}</li>`).join('')}</ul>
      </div>
      <div class="summary-actions">
        <button class="btn" id="restartBtn">다시 읽기</button>
        <button class="btn primary" id="listBtn">목록으로</button>
      </div>
    </div>`;
  document.getElementById('restartBtn').addEventListener('click', () => {
    state.lineIdx = 0; state.revealed = false; state.screen = 'card'; render();
  });
  document.getElementById('listBtn').addEventListener('click', () => {
    state.screen = 'work'; state.work = null; render();
  });
}

/* ============ 랜덤 구절뽑기 ============ */
function pickRandomLine(){
  const pool = [];
  WORKS.forEach(w => { w.lines.forEach((l, idx) => pool.push({ work:w, idx })); });
  const pick = pool[Math.floor(Math.random() * pool.length)];
  state.randomWork = pick.work;
  state.randomLineIdx = pick.idx;
  state.randomTab = 'verse';
  state.randomRevealed = false;
}

function renderRandom(){
  const w = state.randomWork;
  const line = w.lines[state.randomLineIdx];
  const hasTrans = !!line.trans;
  crumbEl.textContent = '랜덤 구절뽑기';

  const showTrans = hasTrans && state.randomRevealed;
  let html = `<div class="random-source"><b>${w.title}</b> · ${w.author} · ${w.genre}</div>`;
  html += `<div class="verse-card" id="verseCard">
      <div class="orig">${showTrans ? line.trans : line.orig}</div>
      ${hasTrans ? `<div class="tap-hint">탭하여 ${showTrans ? '원문' : '해석'} 보기</div>` : ''}
    </div>`;
  html += `<div class="tab-bar">
      <button class="tab-btn ${state.randomTab==='commentary'?'active':''}" id="tabCommentary">해설</button>
      <button class="tab-btn ${state.randomTab==='fulltext'?'active':''}" id="tabFulltext">전문보기</button>
      <button class="tab-btn next-tab" id="tabNext">다음 🎲</button>
    </div>`;

  if (state.randomTab === 'commentary') {
    const s = w.summary;
    html += `<div class="tab-content">
      <div class="summary-card">
        <h2>주제</h2>
        <p>${s.theme}</p>
      </div>
      <div class="summary-card">
        <h2>표현상 특징</h2>
        <ul>${s.features.map(f => `<li>${f}</li>`).join('')}</ul>
      </div>
      <div class="summary-card">
        <h2>임용 대비 시사점</h2>
        <ul>${s.examPoints.map(f => `<li>${f}</li>`).join('')}</ul>
      </div>
    </div>`;
  } else if (state.randomTab === 'fulltext') {
    html += `<div class="tab-content fulltext-list">`;
    w.lines.forEach((l, idx) => {
      html += `<div class="fulltext-line ${idx===state.randomLineIdx?'hit':''}">
        <div class="fo">${l.orig}</div>
        ${l.trans ? `<div class="ft">${l.trans}</div>` : ''}
      </div>`;
    });
    html += `</div>`;
  }

  mainEl.innerHTML = html;

  if (hasTrans) {
    document.getElementById('verseCard').addEventListener('click', () => {
      state.randomRevealed = !state.randomRevealed;
      render();
    });
  }
  document.getElementById('tabCommentary').addEventListener('click', () => {
    state.randomTab = state.randomTab === 'commentary' ? 'verse' : 'commentary';
    render();
  });
  document.getElementById('tabFulltext').addEventListener('click', () => {
    state.randomTab = state.randomTab === 'fulltext' ? 'verse' : 'fulltext';
    render();
  });
  document.getElementById('tabNext').addEventListener('click', () => {
    pickRandomLine();
    render();
  });
}

render();
})();
</script>
</body>
</html>
