<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>임용 국어교육론 인출 연습 (화법·작문·독서)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5F7; --panel:#FFFFFF; --ink:#17212B; --muted:#5B6B7A; --line:#D5DCE3; --soft:#E9EEF2;
  --speech:#0E7490; --writing:#9A5B13; --reading:#3F4FB0;
  --warn:#B4341F; --ok:#2E7D4F;
  --serif:'Noto Serif KR','Batang','Apple SD Gothic Neo',serif;
  --sans:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#10151B; --panel:#182028; --ink:#E6ECF1; --muted:#9AA9B7; --line:#2A3540; --soft:#1E2831;
    --speech:#4FB6CF; --writing:#E0A64F; --reading:#8F9DF0; --warn:#F08A78; --ok:#6CC28C;}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.65;-webkit-text-size-adjust:100%}
body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#wrap{max-width:640px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:8px;padding:10px 14px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;border-bottom:1px solid var(--line)}
.back{border:0;background:none;padding:8px 6px;color:var(--muted);font-size:15px;text-decoration:none}
header h1{margin:0;font-family:var(--serif);font-size:17px;flex:1;text-align:center}
header .sp{min-width:64px}
main{padding:16px 16px 40px;flex:1}
[data-d="speech"]{--dc:var(--speech)} [data-d="writing"]{--dc:var(--writing)} [data-d="reading"]{--dc:var(--reading)}

/* home */
.lead{color:var(--muted);font-size:14px;margin:4px 2px 16px}
.spine{display:flex;align-items:stretch;width:100%;text-align:left;border:0;background:var(--panel);padding:0;margin:0 0 10px;border-left:10px solid var(--dc)}
.spine .in{padding:16px 16px;flex:1}
.spine .nm{font-family:var(--serif);font-size:26px;font-weight:700;line-height:1.2}
.spine .sub{color:var(--muted);font-size:13.5px;margin-top:4px}
.spine.off{opacity:.5}
.drawbtn{width:100%;border:0;background:var(--ink);color:var(--bg);padding:20px 18px;text-align:left;margin:16px 0 0}
.drawbtn .nm{font-family:var(--serif);font-size:24px;font-weight:700}
.drawbtn .sub{font-size:13.5px;opacity:.75;margin-top:2px}
.foot{margin-top:28px;text-align:center}
.link{border:0;background:none;color:var(--muted);text-decoration:underline;font-size:13px;padding:8px}

/* domain */
.dhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px}
.dhead .t{font-family:var(--serif);font-size:24px;font-weight:700;border-left:8px solid var(--dc);padding-left:10px}
.btn{border:1px solid var(--ink);background:var(--panel);padding:9px 14px;font-size:14.5px;font-weight:500}
.btn.solid{background:var(--ink);color:var(--bg)}
.btn.dc{background:var(--dc);border-color:var(--dc);color:#fff}
details.sec{border-top:1px solid var(--line)}
details.sec>summary{list-style:none;padding:13px 2px;font-weight:700;display:flex;justify-content:space-between;gap:8px;cursor:pointer}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary .n{color:var(--muted);font-weight:400;font-size:13px;white-space:nowrap}
.crow{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;text-align:left;padding:10px 4px 10px 12px;border-left:3px solid var(--line);margin-left:2px}
.crow:hover{border-left-color:var(--dc)}
.crow .cn{flex:1}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line);flex:none}
.dot.know{background:var(--ok)} .dot.unsure{background:var(--warn)}
.tag{font-size:12px;border:1px solid var(--warn);color:var(--warn);padding:0 6px;white-space:nowrap}
.tag.ex{border-color:var(--muted);color:var(--muted)}
.secact{padding:6px 0 12px 14px}

/* card */
.cname{font-family:var(--serif);font-size:27px;font-weight:700;line-height:1.35;margin:6px 0 8px}
.meta{color:var(--muted);font-size:13px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.meta .pill{border-bottom:2px solid var(--dc);color:var(--ink)}
.blk{margin-top:20px}
.blk h3{font-size:14px;margin:0 0 6px;color:var(--muted);font-weight:700}
ul.items{margin:0;padding:0 0 0 20px} ul.items li{margin:5px 0} ul.items ul{margin:3px 0;padding-left:18px}
details.diff{margin-top:18px;border:1px solid var(--line);background:var(--panel)}
details.diff>summary{padding:11px 14px;font-weight:700;cursor:pointer}
.d{padding:8px 14px 12px;border-top:1px solid var(--line)}
.d .bk{display:inline-block;font-size:13px;font-weight:700;color:var(--dc);margin-bottom:2px}
.d p{margin:2px 0}
.explain{margin-top:18px;padding:12px 14px;background:var(--soft);border-left:4px solid var(--dc)}
.explain p{margin:4px 0}
.src{color:var(--muted);font-size:12.5px;margin-top:14px}
.hide{color:var(--muted);text-align:center;margin:26px 0;font-size:15px}

/* draw */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}
.chip{border:1px solid var(--line);background:var(--panel);padding:8px 14px;font-size:14.5px}
.chip.on{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.chip.dis{opacity:.4}
.bar{display:flex;gap:10px;margin-top:22px}
.bar .btn{flex:1;padding:14px 10px;font-size:16px}
.big{width:100%;padding:16px;font-size:17px;margin-top:26px}
.count{color:var(--muted);font-size:13.5px;margin:6px 0 16px}
.empty{color:var(--muted);padding:26px 4px;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

  <main id="main"></main>
</div>

<script id="dbdata" type="application/json">{"version": 2, "domains": [{"id": "speech", "label": "화법", "sections": [{"title": "A. 화법의 본질·유형·요소", "cards": [{"id": "s01", "name": "음성언어 의사소통의 목적 (언행적·관계적)", "warn": false, "exam": "기출: 화법의 본질(상호교섭성) 연계", "scope": "국교이 기준", "items": ["<b>언행적 목적<\/b>: 말하고 듣고 이해하는 것과 관련 — 정보 전달·설득·요청 등 의사소통 자체의 목적 달성 (이창덕 외: ‘화행 목적’)", "<b>관계적 목적<\/b>: 이미지를 관리하고 원활한 인간관계를 형성·유지하는 것 (이창덕 외: ‘관계 목적’)", "두 목적은 상황에 따라 비중이 달라지나 <b>함께 추구될 때<\/b> 바람직한 의사소통이 가능", "음성언어 의사소통은 화자가 전달하고 청자가 수용하는 일방 활동이 아니라 <b>상호 교섭적(transactional)<\/b> 의미 창조"], "diff": [{"b": "국", "t": "전은주(1999)의 두 층위입니다. 유사 개념: 임태섭(1998)은 언행적 목적 ↔ <b>상황적 목적<\/b>(화자의 정체성·가치·이념이 반영된 이미지 관리), Trudgill(1977)은 언어의 사회적 기능을 강조합니다. 교육적 시사점은 화법 교육이 메시지의 생산·전달·이해뿐 아니라 인간관계의 형성·유지까지 다뤄야 한다는 것입니다."}, {"b": "역", "t": "‘관계적 성격’을 화법의 3대 성격 중 하나로 다룹니다(‘화법의 성격 3가지’ 카드)."}], "explain": "<p>언행적/관계적 목적은 ‘대화’ 지도(3장)에서 청자 지향적 표현으로 이어집니다.<\/p>", "src": "국교이 2장-1·2"}, {"id": "s02", "name": "화법의 성격 3가지와 인간 의사소통의 일반 원리", "warn": true, "exam": "", "scope": "역락 고유", "items": ["<b>화법의 3대 성격<\/b>: ①구어적 ②관계적 ③사회문화적", "<b>구어적<\/b>: 시공간을 공유한 면대면 소통 → 상호작용 빈번, 협력·공감 강조 (읽기는 분절·명료성, 듣기는 통합 지향)", "<b>관계적<\/b>: 하나의 메시지에 내용 정보와 관계 정보가 동시에 담김 (“아침 먹었어?” = 정보 확인 + 친교), 호칭·지칭에서 잘 드러남", "<b>사회문화적<\/b>: 말 문화의 전통·연령·성별·세대·계층에 따라 소통 방식이 달라짐", "<b>일반 원리 3가지<\/b>: 전인성 / 맥락 의존 / 통일성의 원리"], "diff": [{"b": "역", "t": "<b>말하기의 두 전략<\/b>: 경제성 극대화(편하고 간단하게) vs 표현성 극대화(많은 의미를 전달) — 서로 <b>길항 관계<\/b>입니다(예: “서.”는 경제성↑·공손성 표현 불가, “잠깐 서 주시겠습니까?”는 경제성↓·공손성 표현 가능). 구어성 사례로 Ong(1982)의 실험을 들어, 문자를 익히지 못한 집단은 사물을 범주가 아닌 상황 의존적으로 분류한다고 봅니다. 우리 말 문화의 특징은 주장보다 경청, 말보다 행동 실천을 중시한다는 점입니다."}], "explain": "<p>통합인덱스: ‘화법의 성격을 설명하시오’ 유형은 역락 3대 성격 기준으로 답하세요. 국교이는 목적론(언행적/관계적) 중심입니다.<\/p>", "src": "역락 1장-1"}, {"id": "s03", "name": "화법의 유형 (대인·집단·대중) 과 담화 상황", "warn": false, "exam": "", "scope": "역락 고유 (상황 구분은 국교이)", "items": ["<b>참여자 규모 기준<\/b>: <b>대인 화법<\/b>(개인 대 개인: 대화·면담) / <b>집단 화법<\/b>(조직된 구성원의 문제 해결, 절차·규칙 존재: 토의·토론) / <b>대중 화법<\/b>(한 화자가 비조직적 다수에게: 연설·발표)", "모든 담화가 세 유형에 일률적으로 속하지는 않음 (방송 토크쇼는 대중 화법이면서 집단·대인 화법의 성격도 있음)", "전통적 유형화(대화·토의·연설)는 담화가 세분화·전문화되며 한계 — 연설의 하위였던 ‘발표’가 독자적 유형으로 발전"], "diff": [{"b": "국", "t": "담화 <b>상황<\/b>별 구분: 공식적↔비공식적 말하기(청자 수, 사무적, 정형화된 소통 방식, 대중매체 여부로 판단, 공식적 말하기는 ‘-습니다’, 조사 생략 억제 등 <b>문자언어적 특징<\/b>) / 준비된↔즉흥적 말하기(준비된 말하기도 원고를 그대로 읽지 않고 청중과 교섭하며 조절). 화법 내용은 담화 상황·유형·목적 세 축으로 구성합니다."}], "explain": "<p>통합인덱스: ‘다음 중 대중 화법에 해당하는 것은?’ 같은 상위 분류 문제는 역락 기준입니다.<\/p>", "src": "역락 1장-2 · 국교이 3장-2"}, {"id": "s04", "name": "화법의 4요소와 맥락 (상황 맥락 vs 사회문화적 맥락)", "warn": true, "exam": "", "scope": "역락 고유", "items": ["<b>화자·청자·메시지·맥락<\/b>이 유기적으로 결합해 동시에 작동", "화자·청자는 일방적 발신/수신이 아니라 의미를 함께 구성하는 <b>참여자<\/b>, 청자는 능동적 참여자", "메시지 = 언어적(내용 정보) + 관계적(참여자 간 인식·자아개념·관계 정보) 메시지가 동시에 담김", "<b>상황 맥락<\/b>: 직접 개입하는 시간·공간적 상황, 미시적·개별적·쉽게 변함 / <b>사회문화적 맥락<\/b>: 담화공동체의 규범·관습·가치, 거시적·집단적·오래 형성되어 쉽게 변하지 않음"], "diff": [{"b": "역", "t": "메시지 사례: “어디 가니?”(평서 억양, 언어 메시지 중심 → 장소 응답) vs “어디 가니?↗”(이미 가는 줄 아는 인사, 관계 메시지 중심 → “응”). 맥락 사례: “5분 남았네”의 의미가 지루한 수업/흥미로운 수업에서 달라짐(상황), 자기소개에서 미국인은 성격·취미를, 한국인은 고향·출신 학교를 앞세움(사회문화). 연설 같은 일대다 상황에서도 청자의 참여가 필요해 청자 분석이 중요합니다."}], "explain": "<p>독서·작문의 ‘맥락’ 카드와 짝지어 보세요(같은 상황/사회문화 이분 틀).<\/p>", "src": "역락 1장-3"}]}, {"title": "B. 듣기", "cards": [{"id": "s05", "name": "듣기 유형 분류 체계 대조 (국교이 5분법 vs 역락 4분법)", "warn": true, "exam": "기출: 분석적 듣기 ×1 · 타당성 판단하며 듣기 ×1 · 대화 함축·추론적 듣기 ×3", "scope": "핵심 이견 지점", "items": ["<b>국교이(전은주 1999)<\/b>: 주의집중하기 · 분석적 듣기 · 비판적 듣기 · 감상적 듣기 · 공감적 듣기", "<b>역락<\/b>: 선택적 지각 과정(소리 듣기→의미 듣기) · <b>추론적<\/b> 듣기 · 비판적 듣기 · 공감적 듣기", "<b>의사소통이론<\/b>: 공감적 듣기 중심(대화 함축은 대화의 원리에서 별도 확장)", "‘비판적 듣기’는 세 책 공통이나 판단 기준의 개수·명칭이 다름"], "diff": [{"b": "국", "t": "고유 개념: <b>분석적 듣기<\/b>(의역, 목적·요점·세부내용 구분), <b>감상적 듣기<\/b>(오락 목적). 물리적 듣기는 별도 범주가 없고(Taylor의 들리기·듣기·청해 층위는 따로 서술) 주의집중하기가 유사합니다."}, {"b": "역", "t": "고유 개념: <b>추론적 듣기<\/b>를 별도의 필수 범주로 명명, 비판적 듣기의 3기준(신뢰성·타당성·공정성)을 정식화. 소리 듣기(hearing)는 학교 교육의 대상이 아닙니다."}, {"b": "이", "t": "비판적 듣기를 독립 절로 두지 않고, 반대신문의 검증 질문(신뢰성·타당성·공정성)에서 같은 기준을 재사용합니다."}], "explain": "<p>📌 <b>제시문이 어느 책의 정의를 반영했는지 확인<\/b>하고 답하세요(통합인덱스). 개별 유형은 다음 카드들을 보세요.<\/p>", "src": "국교이 2장-2 · 역락 2장-1 · 의사소통이론 Ⅱ·Ⅹ"}, {"id": "s06", "name": "듣기의 층위(Taylor)와 효과적인 듣기 5방법 (전은주 1999)", "warn": false, "exam": "기출: 분석적 듣기 ×1", "scope": "국교이 고유", "items": ["<b>Taylor(1964) 층위<\/b>: 들리기(hearing, 물리적) → 듣기(listening, 의미 구성) → 청해(auding, 종합 이해·해석 + 정의적 반응)", "<b>주의집중하기<\/b>: 바른 자세로 응시, 잡념 차단, 발화 도중 주의 중단·자기 할 말 미리 구상 금지", "<b>분석적 듣기<\/b>: 비언어 관찰, 목적·내용 예측, <b>의역(paraphrasing)<\/b>, 목적·요점·세부내용 구분", "<b>비판적 듣기<\/b>: 진실성·신뢰성 판단 — 사실과 추론을 구분한 뒤 추론의 진위를 평가", "<b>감상적 듣기<\/b>: 즐거움·긴장 해소 / <b>공감적 듣기<\/b>: 상대 입장에서 감정 이입"], "diff": [{"b": "국", "t": "추론 진위 평가 6질문: 뒷받침 사실의 존재 / 사실의 충분성 / 정확성 / 사실-추론 간 연관성 / 추론 도출 과정의 오류 / 다른 영향 정보의 존재. 공감적 듣기의 방법은 의미 명료화(질문하기·의역하기)와 협조적 반응(감정 지지·해석·칭찬·건설적 비평)입니다."}], "explain": "<p>말하기와 듣기의 <b>상호관계성<\/b>(토론-비판적 듣기, 대화-공감적 듣기)은 교수·학습 원리 카드를 보세요.<\/p>", "src": "국교이 2장-2(1)"}, {"id": "s07", "name": "선택적 지각과 추론적 듣기", "warn": true, "exam": "기출 ×3 (대화 함축 및 추론적 듣기)", "scope": "역락 고유 (추론적 듣기)", "items": ["<b>소리 듣기(hearing)<\/b>: 물리적 소리를 해석하는 생리적 과정, 축자적 수용 → <b>학교 교육의 대상이 될 수 없음<\/b>", "<b>의미 듣기(listening)<\/b>: 주의를 기울여 배경지식과 관련지어 조직화·해석·평가 → 교육의 주요 대상", "<b>지각의 선택성<\/b>: 같은 자극도 사람마다 다르게 지각 (단기 기억 용량의 한계) — 경제적이지만 자기 방식대로만 들어 소통을 그르칠 위험도 있음", "<b>추론적 듣기<\/b>: 언어적 표현뿐 아니라 <b>준언어·비언어<\/b>를 단서로 함축된 의미를 파악하며 듣기"], "diff": [{"b": "역", "t": "요건은 온전한 집중 + 부분 정보의 구조화 + 미언급 내용의 추론 능력입니다. 참여자의 소통 방식(직접적/간접적, 협력적/대립적, 정보 중심/관계 중심, 권위적/민주적, 화자 중심/청자 중심)에 따라 의도 해석이 달라짐을 인식해야 합니다. 2022 개정 성취기준 [9국01-01](화자의 의도·관점 추론)과 연결됩니다."}, {"b": "이", "t": "추론적 듣기의 원리를 <b>대화 함축<\/b>으로 설명합니다(‘협력의 원리와 대화 함축’ 카드)."}], "explain": "<p>통합인덱스: 이 개념명 자체(추론적 듣기)가 출제 포인트일 가능성이 있습니다.<\/p>", "src": "역락 2장-1 · 의사소통이론 Ⅲ"}, {"id": "s08", "name": "비판적 듣기", "warn": true, "exam": "기출 ×1 (타당성 판단하며 듣기)", "items": ["무조건적 부정이 아니라 들은 내용의 <b>신뢰성·타당성·공정성<\/b>을 판단·평가하며 듣는 것 (역락)", "신뢰성=정보·자료 출처의 믿을 만함 / 타당성=근거에서 결론을 이끌어내는 방식의 합리성 / 공정성=내용·주장이 공평한가", "성급한 판단·왜곡된 이해를 피하고 신중하게 반응하게 함"], "diff": [{"b": "국", "t": "진실성·신뢰성 중심으로 <b>사실과 추론을 구분한 뒤 추론의 진위를 6가지 질문<\/b>으로 평가합니다(뒷받침 사실 존재·충분성·정확성·연관성·오류 여부·다른 정보 존재)."}, {"b": "역", "t": "청자 자신의 입장·관점을 견지하며 지적 재검토를 거쳐 평가·판단하는 듣기로 정의합니다. 2022 성취기준 [6국01-02]·[9국01-02]와 연결됩니다."}, {"b": "이", "t": "반대신문의 <b>검증 질문<\/b>이 같은 세 기준(신뢰성·타당성·공정성)을 사용합니다."}], "explain": "<p>통합인덱스: 판단 기준의 개수·명칭이 다르므로(국=진실성·신뢰성 6질문 / 역=3기준) 어느 책 정의가 반영됐는지 확인하세요. 독서의 ‘비판적 이해’와 기준이 같은 계열입니다.<\/p>", "src": "역락 2장-1 · 국교이 2장-2 · 의사소통이론 Ⅹ"}, {"id": "s09", "name": "공감적 듣기 (세 책 비교)", "warn": true, "exam": "기출 ×2 (공감적 듣기: 적극적 들어주기, 반영하기)", "items": ["상대 말을 분석·비판하지 않고 감정을 이입해 이해하려는 <b>‘너 중심 듣기’<\/b>, 판단 유보 (역락)", "<b>소극적 들어주기<\/b>: 주목하기(집중) + 격려하기 / <b>적극적 들어주기<\/b>: <b>요약하기<\/b>(재진술) + <b>반영하기<\/b>(감정·의미를 재구성해 피드백)", "국교이: 의미 명료화(질문하기·의역하기) + 협조적 반응(지지·해석·칭찬·건설적 비평)"], "diff": [{"b": "역", "t": "사례: “학원 안 가면 안 돼요?” → “우리 아들이 몸이 안 좋은 모양이구나”(판단 유보 + 감정 재진술). 조성 조건은 수용적 분위기와 집중입니다. 공감의 기본 태도는 <b>역지사지<\/b>, 형성 축은 인격적 신뢰와 정서적 유대감입니다."}, {"b": "이", "t": "Rogers(1975): 공감의 본질 3요소 — ①상대의 지각 세계로 들어가려는 노력 ②내면 변화 공유 ③지각한 바를 상대에게 <b>전달<\/b>(청자의 반응까지가 공감). 소극적 들어주기(집중하기·격려하기, Chaney &amp; Burk의 열린/닫힌 행위)와 적극적 들어주기(요약·반영)를 구분하는 기준은 <b>의미 있는 명시적 언어 피드백<\/b>의 유무입니다. ‘~구나/~네’ 표지는 상대 체면을 존중하는 간접 표현입니다. 정보 분석이 활발해도 공감 요소가 없으면 공감적 듣기가 아닙니다. 적극적 듣기와는 별개 개념입니다(백미숙 2006)."}, {"b": "국", "t": "5방법 중 하나로 제시하며 세부 체계가 다릅니다(위 요약)."}], "explain": "<p>⚠️ 국교이의 세부 체계(질문·의역 + 지지·해석·칭찬·건설적 비평)와 역락·이의 체계(소극/적극 들어주기)가 다릅니다. 방해 반응은 다음 카드, 감정 표현은 ‘비폭력 대화’ 카드를 보세요.<\/p>", "src": "역락 2장-1·7장 · 의사소통이론 Ⅱ-2 · 국교이 2장-2"}, {"id": "s10", "name": "공감을 방해하는 10가지 반응 (Rosenberg 2003)", "warn": false, "exam": "기출 ×2 (공감적 듣기)와 연계", "scope": "역락 고유", "items": ["<b>조언하기 · 한 술 더 뜨기 · 가르치려 들기 · 위로하기 · 다른 이야기 꺼내기 · 단정해 버리기 · 동정하기 · 심문하기 · 설명하기 · 정정하기<\/b>"], "diff": [{"b": "역", "t": "7장 ‘공감의 원리’에서 제시합니다. 관련 성취기준은 [9국01-04], [9국01-09], [10공국1-01-01]입니다."}, {"b": "이", "t": "같은 취지의 사례로, 화난 후배에게 객관적으로 분석·조언하거나 성격을 판단하면 갈등이 격화되고, 막연한 위로·말 끊기·심문하기·한술 더 뜨기도 공감적 반응이 아니라고 봅니다."}], "explain": "<p>사례 판별형(‘이 반응은 10가지 중 무엇인가’)으로 나오기 좋습니다.<\/p>", "src": "역락 7장 · 의사소통이론 Ⅱ-2"}, {"id": "s11", "name": "비폭력 대화 4단계 (Rosenberg)", "warn": false, "exam": "", "scope": "의사소통이론 고유 (국교이 나-전달법과 기능 대응)", "items": ["<b>관찰 → 느낌 → 욕구 → 부탁<\/b>", "<b>관찰<\/b>: 도덕적 판단(“게으르다”)이 아닌 객관적 사실(“회의에 세 번 늦었구나”)", "<b>느낌<\/b>: 현재 감정을 표현, <b>생각과 구별<\/b> (“투명인간처럼 느껴져”=생각 / “속상해”=느낌)", "<b>욕구<\/b>: 느낌과 연관된 충족되지 못한 기대, 느낌–욕구는 한 쌍으로 표현", "<b>부탁<\/b>: 구체적·가시적 행위를 요청, 부정문(“~하지 마”)보다 긍정문, 명령보다 의문문(“~해 줄 수 있을까?”)"], "diff": [{"b": "이", "t": "임상심리학자 Rosenberg가 1960년대 개발했고, 상처 주는 <b>자칼의 대화<\/b>와 공감을 표현하는 <b>기린의 대화<\/b>로 비유합니다. 사례: “복도에서 장난치지 마” → [관찰]때리고 장난치는 걸 보면 [느낌·욕구]다치지 않고 안전하길 원해서 걱정돼 [부탁]조용히 다니면 어떨까? 지도는 화자(4단계 표현) ↔ 청자(공감적 듣기)를 바꿔 가며 하는 쌍방향 구도(박재현 2018)입니다."}, {"b": "국", "t": "‘나-전달법’(문제를 상대에게 돌리지 않고 나의 관점·감정으로 표현)이 기능적으로 대응합니다. 직접 같은 용어는 아닙니다."}], "explain": "<p>⚠️ 통합인덱스: 나-전달법 ↔ 비폭력 대화는 <b>용어 불일치<\/b>에 주의하세요(기능은 대응).<\/p>", "src": "의사소통이론 Ⅱ-2-3 · 국교이 3장"}]}, {"title": "C. 비언어 의사소통과 문화", "cards": [{"id": "s12", "name": "비언어 의사소통의 분류 체계 (국교이 4 · 역락 4 · 이 Burgoon 7)", "warn": true, "exam": "기출: 비언어 신뢰 경향·순서 교대 신호·관습적 행위 ×2", "items": ["<b>국교이<\/b>: 형태 중심 4하위요소 — 준언어 / 몸짓언어 / 공간언어 / 침묵", "<b>역락<\/b>: 눈빛(시선) / 표정 / 제스처 / 자세 (기능은 6가지로 따로 분류)", "<b>의사소통이론<\/b>: Burgoon(1996) 7분류 — 신체적 모습 / 인공물 / 동작 / 신체 접촉 / 음성 행위(준언어) / 공간 / 시간", "준언어는 비언어의 <b>하위 범주<\/b>(3분법으로 독립시키지 않음)"], "diff": [{"b": "국", "t": "준언어(음조·강세·빠르기·크기·억양), 몸짓언어(동작학), 공간언어(좌석 배치·간격), 침묵(다른 몸짓과 결합해 동의·무시·부정 전달)."}, {"b": "역", "t": "비언어를 준언어(어조·억양·성량·속도) + 비언어적 행동(표정·시선·몸짓)으로 구분합니다. 눈빛은 감정 변화를 가장 잘 드러내고 시선 유지는 관심·호감의 표현, 자세는 신분·나이·심리를 반영합니다."}, {"b": "이", "t": "동작(kinesics, Birdwhistell, kineme)·신체 접촉(haptics)·공간(근접학 proxemics, Hall)·시간(chronemics: 지각은 ‘중요하지 않다’는 메시지)을 포함합니다. 지도의 중점은 유형을 나열하는 것이 아니라 여러 유형이 <b>복합적으로<\/b> 메시지를 구성한다는 점입니다."}], "explain": "<p>⚠️ 분류 기준이 책마다 달라(형태 4 / 형태 4 + 기능 6 / Burgoon 7 + Argyle 5기능) <b>답안에 어느 책 기준인지 명시<\/b>하라고 통합인덱스가 강조합니다. 메러비언 법칙은 국교이에만 있습니다.<\/p>", "src": "국교이 2장-2(2) · 역락 2장-3 · 의사소통이론 Ⅳ-1"}, {"id": "s13", "name": "메러비언 법칙과 준언어의 의미 (국교이)", "warn": false, "exam": "", "scope": "국교이 고유", "items": ["<b>메러비언 법칙(1971)<\/b>: 메시지 전달 비중 — 언어 <b>7%<\/b> · 목소리(음조·억양·크기) <b>38%<\/b> · 비언어적 태도 <b>55%<\/b>", "음조: 높음→기쁨·두려움·분노 / 낮음→우울·피곤·침착", "말의 빠르기: 빠름→흥분(듣는 이 긴장) / 느림→여유·둔함  ·  목소리 크기: 큼→자신감·열정·공격성 / 작음→열등감·온화·무기력", "억양: 단조→무미건조 / 변화 많음→흥분·과장  ·  강세: 강조·대조 표현", "언어와 비언어가 상충하면 <b>비언어의 전달력이 더 큼<\/b>"], "diff": [{"b": "이", "t": "메러비언 법칙은 이 책에 명시적으로 나오지 않습니다. 대신 준언어 수치를 다룹니다: 말 속도는 분당 120~180단어가 일반적이고 정보전달은 다소 빠르게, 설득은 다소 느리게 말할 때 유창하다고 평가되며(조민하 2014), 발음이 정확할 때 초당 5음절 중반이 적절(신지영 2008)합니다. 책 읽는 듯한 억양은 준비 부족 인상을 주어 공신력을 낮춥니다."}], "explain": "", "src": "국교이 2장-2(2) · 의사소통이론 Ⅳ-1"}, {"id": "s14", "name": "비언어 메시지의 기능 (역락 6기능 · 이 3유형)", "warn": true, "exam": "기출: 비언어 의사소통 (신뢰 경향·관습적 행위)", "items": ["<b>역락 6기능<\/b>(Richmond·McCroskey·Payne 1991): 보강 · 모순 · 반복 · 대체 · 강조 · 화맥 조절", "보강(간절한 눈빛+“도와주십시오”) / 모순(“차분히 얘기해봐”하며 가방을 챙김) / 반복(“나가”+문을 가리킴) / 대체(손짓으로 “이리 와”) / 강조(뜸들이기, 악수 꽉 쥐기) / <b>화맥 조절<\/b>(고개 끄덕임으로 발화 지속)", "<b>의사소통이론 3유형<\/b>: 의미 일치 여부 × 언어와 함께 쓰이는지 — <b>보완<\/b>(함께, 일치) / <b>모순<\/b>(함께, 불일치) / <b>대체<\/b>(단독)"], "diff": [{"b": "역", "t": "언어·비언어가 상충하면 사람들은 <b>비언어를 더 신뢰<\/b>합니다(무의식의 언어이므로)."}, {"b": "이", "t": "6분류의 보강·강조·반복은 변별이 어렵다는 이유로 <b>보완<\/b> 하나로 통합해 3분류로 재구성했습니다. 사례: 반가운 인사+악수(보완) / “괜찮아, 얘기해봐”하며 시계를 봄(모순) / 말없이 손가락 넷을 펴 보임(대체)."}], "explain": "<p>⚠️ 분류 체계가 6기능 vs 3유형이므로 어느 책 기준인지 밝히세요. 국교이는 몸짓이 언어를 보완·강화한다는 정도로만 서술합니다.<\/p>", "src": "역락 2장-3 · 의사소통이론 Ⅳ-1(2)"}, {"id": "s15", "name": "비언어 의사소통의 성립 — 의도 × 인식 (2×2)", "warn": false, "exam": "", "scope": "역락·이 공통 (Richmond 등 1991)", "items": ["<b>의도적 메시지 + 청자가 인식<\/b> = 비언어적 의사소통 성립", "<b>의도적 + 인식 못함<\/b> = 의사소통 불발 (예: 탁자 밑으로 다리를 건드렸으나 남편이 우연이라 여김) → <b>갈등 유발<\/b>", "<b>비의도적 + 청자가 의미 부여<\/b> = ‘우연한’ 의사소통 (예: 의도치 않게 늦은 사람을 무시로 해석) → <b>갈등 유발<\/b>", "<b>비의도적 + 인식 못함<\/b> = 의사소통 미발생"], "diff": [{"b": "이", "t": "화자 의도 × 청자 인식의 4분면으로 다루며, 갈등이 생기는 것은 화자 의도와 청자 인식이 <b>불일치<\/b>하는 경우(의도O·인식X, 의도X·인식O)라고 정리합니다. 사례: 승객이 내릴 준비하는 듯한 행동을 보고 자리를 노렸으나 안 내림. 세대 간 이모티콘 해석 차이(^^ 를 40·50대는 정중한 친절, 20·30대는 뒤가 서늘한 미소로 받아들임)도 듭니다."}], "explain": "<p>사례 판별형으로 적합합니다(역락 원문 표시).<\/p>", "src": "역락 2장-3 · 의사소통이론 Ⅳ-2"}, {"id": "s16", "name": "Argyle(1988)의 비언어 5기능과 친밀감 비언어", "warn": false, "exam": "기출 ×2 중 관습적 행위·순서 교대 신호와 연계", "scope": "의사소통이론 고유", "items": ["①<b>감정 표현<\/b>(통제 가능/불가능) ②<b>대인관계 태도 표현<\/b>(호감·반감) ③<b>상호작용 단서<\/b>(순서 교대·화제 전환·발언권 이양) ④<b>자기표현<\/b>(의상·머리 모양) ⑤<b>관습적 행위<\/b>(인사·악수·세배)", "Burgoon 외(1996) 친밀감을 드러내는 4행위: <b>간격 · 웃음 · 접촉 · 눈맞춤<\/b>", "복합 메시지가 <b>불일치<\/b>하면 청자는 진의 판단이 어렵고 신뢰가 저하, 불일치 시 비언어를 더 신뢰"], "diff": [{"b": "이", "t": "발표 시 비언어 전략: 시선(대본·스크린에 의존하면 교감 저하, 카드식 개요 활용), 표정(자신감 있되 겸손), 손동작(내용과 <b>동기화<\/b>, 문제 제기는 겸손하게·해결책 강조는 역동적으로). 감정을 과하게 드러내거나 전혀 드러내지 않는 것 모두 문제이며 핵심은 <b>자신의 감정이 여러 경로로 전달됨을 인식하고 점검·조정<\/b>하는 것입니다."}, {"b": "역", "t": "‘화맥 조절’ 기능(고개 끄덕임)과 순서 교대 신호를 연결해 볼 수 있습니다."}], "explain": "", "src": "의사소통이론 Ⅳ-2"}, {"id": "s17", "name": "공간언어와 근접학 (친밀도별 간격)", "warn": true, "exam": "", "items": ["공간의 위치·거리가 의미에 영향: 마주 앉음→경쟁·긴장 / 직각으로 앉음→협력·편안함 (국교이)", "<b>Hall의 4간격대<\/b>: 친밀한 간격 · 개인적 간격 · 사회적 간격 · 공공적 간격 (호칭만 다르고 구분은 같음)", "이 책: 공간을 <b>고정<\/b>(교실 구조) · <b>반고정<\/b>(의자·책상 배치) · <b>비형식<\/b>(대화자 간 간격) 공간으로 구분"], "diff": [{"b": "국", "t": "친밀한 간격 15~46cm(배우자·연인) / 개인적 간격 46cm~1.2m(친구) / 사회적 간격 1.2~3.6m(낯선 사람·공식 의사결정) / 공공적 간격 3.6m 이상(강의·연설)."}, {"b": "이", "t": "Hall(1966): 친밀한 간격 15~46cm / 개인적 간격 46~76cm / 사회적 간격 1.2~2.1m / 공공적 간격 3.7~7.6m로 <b>수치가 다릅니다<\/b>. 간격은 관계·문화에 의존하며(아랍·지중해·중남미는 가깝게, 북유럽은 멀게), 바둑판식 vs 모둠식 책상 배열은 소통 양식을 규정합니다."}], "explain": "<p>⚠️ 두 책의 간격 수치가 다릅니다(개인적·사회적·공공적 간격). 수치를 묻는 문제는 어느 책 기준인지 확인하세요.<\/p>", "src": "국교이 2장-2(2) · 의사소통이론 Ⅳ-1"}, {"id": "s18", "name": "몸짓·동작학과 문화적 차이 (OK 사인)", "warn": false, "exam": "", "scope": "세 책 공통 사례", "items": ["몸짓은 <b>문화 보편적<\/b> 요소(끄덕임=긍정, 기쁠 때 웃음)와 <b>문화 특수적<\/b> 요소가 공존", "OK 사인(엄지-검지 동그라미): 한국·일본=돈 / 미국=OK / 프랑스=빈털터리 / 지중해 일부=동성애 상징", "동작학(kinesics): 1960년대 이후 독립 학문, Birdwhistell은 몸짓도 음성언어처럼 단위·체계·규칙을 가진다고 봄"], "diff": [{"b": "이", "t": "인류 보편 표정 6가지: 슬픔·기쁨·두려움·화남·불쾌함·놀람. 시선은 서양에서는 눈맞춤이 소통 성립 조건이나 동양에서는 응시가 무례할 수 있습니다. 문화 민감성 사례(악수 방식 논란)를 듭니다."}], "explain": "<p>통합인덱스: OK 사인 사례는 3권 모두 동일하게 나옵니다(🔴).<\/p>", "src": "국교이 2장-2(2) · 역락 2장-3 · 의사소통이론 Ⅳ"}, {"id": "s19", "name": "고맥락·저맥락 문화와 Hofstede의 문화 차원", "warn": false, "exam": "", "scope": "의사소통이론 고유", "items": ["<b>Hall(1976)<\/b>: 저맥락 문화(직접 언어 표현, 명확한 언어 메시지: 미국·독일) ↔ 고맥락 문화(맥락 단서·눈치·조화 중시, “아니요”를 꺼림: 한국·일본·중국) — 이분법이 아니라 <b>연속체<\/b>", "<b>Hofstede(1984)<\/b> 4차원: <b>개인주의–집단주의 / 권력 격차 / 불확실성 회피 / 남성주의–여성주의<\/b> (IBM 40개국 11만 7천 명 조사)", "한국: 집단주의 강함, 권력 격차는 중간, 불확실성 회피 높음, 남성주의는 낮은 편"], "diff": [{"b": "이", "t": "집단주의 문화는 고맥락과, 개인주의 문화는 저맥락과 연관됩니다. 고맥락 사례로 「헛기침으로 백 마디 말을 한다」(통찰의 의사소통)가 나옵니다. 문화 차이는 ‘인정하고 배려하라’는 당위보다 <b>차이를 인식하는 분석틀<\/b>을 길러 주는 것이 선행되어야 한다고 봅니다."}], "explain": "<p>통합인덱스: 기출 ‘전통적 말 문화 및 정중 어법 ×1’과 부분 연계 가능한 영역입니다. 근접학 창시자와 고·저맥락 제안자가 같은 Hall입니다.<\/p>", "src": "의사소통이론 Ⅴ-1"}, {"id": "s20", "name": "언어 공동체와 담화 공동체", "warn": false, "exam": "", "scope": "의사소통이론 고유", "items": ["<b>성립 조건에 대한 학설<\/b>: 민족설(배해수, 모국어·민족정신) / 지역설(동일 지역은 필수 아님 — 사이버 공동체) / 혈통설(대부분 필수로 보지 않음) / 모어설(Lyons·배해수 vs Gumperz) / <b>담화 관습설<\/b>", "핵심은 물리적 조건이 아니라 <b>담화 관습의 공유<\/b>: Hymes(1972) 의사소통 능력, Labov(1972) 언어 사용에 대한 태도·가치관의 공유", "Saville-Troike: 동일 언어 집단은 언어공동체일 수 있으나(충분조건) 모든 언어공동체가 동일 언어를 쓰는 것은 아님(필요조건 아님)", "범위: 동심원 모형(Santa Ana &amp; Parodi) → 중복성은 설명 못 함 → <b>중복 언어공동체<\/b>와 <b>코드 스위칭<\/b>"], "diff": [{"b": "이", "t": "<b>담화 공동체<\/b>는 언어공동체보다 더 균질한 집단으로, 담화적 실행 규칙(사용역)을 공유합니다(과학자 집단·법률 공동체). 표준국어대사전은 ‘같은 언어를 사용하면서 공동생활을 하는 사회 집단’으로 정의해 실제 현상을 설명하기에 협소합니다. 학설이 서로 대립하는 구조라 종합 서술형으로 나오기 좋습니다."}], "explain": "<p>코드 스위칭·중복 언어공동체는 이 책 고유 내용입니다(통합인덱스).<\/p>", "src": "의사소통이론 Ⅴ-2"}]}, {"title": "D. 대화의 원리와 구조", "cards": [{"id": "s21", "name": "음성언어 의사소통의 원리 — 국교이 4원리 vs 그라이스", "warn": true, "exam": "기출: 대화의 원리(협력의 원리, 간접 화행) ×2", "scope": "국교이 vs 역락·이", "items": ["<b>국교이(전은주 1999)<\/b>: 공손성 · 적절성 · 순환성 · 관련성의 4원리", "<b>역락·의사소통이론<\/b>: 그라이스 협력의 원리(4격률) + 공손성(리치) + 체면 유지 + 거리 유지 + 공감의 원리", "국교이가 그라이스를 채택하지 않은 이유(전은주): ①비협력적 상황 설명력 부족 ②네 격률이 일반적 언어 사용을 포괄하지 못함 ③<b>청자 역할에 대한 원리 부재<\/b>"], "diff": [{"b": "국", "t": "‘음성언어 의사소통의 원리’를 물으면 4원리로 답합니다."}, {"b": "역", "t": "‘대화의 원리’를 물으면 협력·거리 유지·공손성·체면 유지·공감으로 답합니다(7장)."}, {"b": "이", "t": "대화의 원리를 협력의 원리와 예의의 원리(Lakoff·Leech·Brown &amp; Levinson)로 구성합니다."}], "explain": "<p>📌 통합인덱스: <b>양쪽 다 알아 두라<\/b>는 지점입니다. 개별 원리는 이어지는 카드들을 보세요.<\/p>", "src": "국교이 2장-3 · 역락 7장 · 의사소통이론 Ⅲ"}, {"id": "s22", "name": "협력의 원리와 대화 함축 (Grice 1975)", "warn": true, "exam": "기출 ×2 (대화의 원리) · ×3 (대화 함축 및 추론적 듣기)", "scope": "역락·이 (국교이는 채택 안 함)", "items": ["<b>협력의 원리<\/b>: 대화의 방향·목적에 따라 요구되는 만큼 기여하라", "<b>4격률<\/b>: <b>양<\/b>(필요한 만큼만) / <b>질<\/b>(진실·근거 있는 것만) / <b>관련성<\/b>(화제와 관련) / <b>태도<\/b>(명료성: 모호·중의 회피, 간결, 조리)", "<b>대화 함축<\/b>: 격률을 <b>의도적으로 위반<\/b>하는 것처럼 보이지만 상호 협력한다고 가정할 때 발생하는 숨겨진 의미", "협력의 원리는 반드시 지킬 규범이 아니라 함축 추론을 가능케 하는 원리"], "diff": [{"b": "이", "t": "9개 세부 격률을 제시하고, <b>관련성의 격률을 가장 중요<\/b>하다고 강조합니다(다른 격률이 다소 결여돼도 관련성이 지켜지면 대화가 진행되지만, 반대는 성립하지 않음). 사례: “튀르키예 음식점 갈래?” “나 채식주의자인 것 몰라?”(관련성 위반이나 ‘거기엔 채식 음식이 없을 것 같다’는 거절이 함축). 이성영(1994)은 대화 함축의 기능을 <b>경제성 원리<\/b>로 설명하며, 고장 난 TV 앞에서 “아무것도 필요 없다”고 하는 광고(질의 격률 위반)를 사례로 듭니다."}, {"b": "역", "t": "4격률을 양·질·관련성·태도로 정리하고 대화 함축을 격률의 의도적 위반으로 설명합니다. 협력의 원리를 문법 규칙처럼 오인하면 안 됩니다."}, {"b": "국", "t": "그라이스를 직접 채택하지 않는 대신 <b>관련성의 원리<\/b>에서 표면 의미와 의도된 의미가 다를 때 맥락과 추론으로 대화 함축을 찾는 자세를 요구합니다."}], "explain": "<p>대화 함축은 ‘추론적 듣기’와 짝입니다. 통합인덱스: 이 책이 대화 함축의 메커니즘과 사례를 가장 상세히 다룹니다.<\/p>", "src": "역락 7장 · 의사소통이론 Ⅲ-1 · 국교이 2장-3"}, {"id": "s23", "name": "국교이의 4원리 (공손성·적절성·순환성·관련성)", "warn": false, "exam": "", "scope": "국교이 고유", "items": ["<b>공손성<\/b>: 상대에게 부담을 적게 주고 존중하는 표현·태도 — 체면(Goffman), Brown &amp; Levinson, Maslow의 사회적·자존 욕구가 배경", "<b>적절성<\/b>: 상황·목적·유형에 맞는 담화 형식·내용 — 근거는 Beaugrande &amp; Dressler의 텍스트성 7요건", "<b>순환성<\/b>: 참여자 역할 교대 + <b>정보의 순환<\/b>(받으면 그에 상응하는 정보를 다시 제공) — 일방적이면 관계적 목적 성취가 어려움", "<b>관련성<\/b>: 상대 발화를 상대의 의도에 따라 재구성해 이해, 표면·의도 의미가 다르면 <b>대화 함축<\/b>을 찾으려는 적극적 자세"], "diff": [{"b": "국", "t": "공손성 유의점: 관계에 맞지 않는 과도한 공손함은 빈정거림으로 기능해 걸림돌이 됩니다. 텍스트성 7요건은 응집성·결속성·의도성·용인성·정보성·상황성·상호텍스트성입니다. <b>순환성과 관련성의 변별<\/b>은 사례 판별 포인트로 지목됩니다."}], "explain": "", "src": "국교이 2장-3"}, {"id": "s24", "name": "공손성의 원리 — 리치(Leech 1983)의 정중어법 6격률", "warn": true, "exam": "기출 ×4 (공손성의 원리: 격률, 체면 유지 전략 등)", "scope": "세 책 공통 (이가 사례 최다)", "items": ["지배 원칙: <b>자신보다 상대를 중시<\/b>한다", "<b>상대에 대한 격률<\/b>: ①<b>요령<\/b>(상대 부담 최소·이익 최대) ③<b>칭찬<\/b>(상대 비방 최소·칭찬 최대) ⑤<b>동의<\/b>(차이 최소·일치 최대)", "<b>자신에 대한 격률<\/b>: ②<b>관용<\/b>(자신 이익 최소·부담 최대) ④<b>겸양<\/b>(자기 칭찬 최소·비방 최대) ⑥<b>공감<\/b>(반감 최소·공감 최대)", "요령↔관용, 칭찬↔겸양이 <b>대칭<\/b>"], "diff": [{"b": "이", "t": "6격률을 상대/자신으로 대칭 구조화하고 사례가 가장 풍부합니다. 요령: 맞선에 늦은 상대에게 “괜찮아요, 오붓하게 얘기하다 보니 시간 가는 줄 몰랐어요” / 명령(“빌려줘”)보다 선택권을 준 표현이 예의 있음(<b>간접성↔예의 정비례<\/b>). 관용: “제가 준비해보겠습니다” vs “선생님이 먼저 구상해주셔야 제가 하죠”(부담 전가 = 요령 위반과 대칭). 겸양: 과도한 자기 비하는 부적절하며 “감사합니다, 선생님 덕분입니다”처럼 겸양+상대 칭찬을 결합. 동의: 직접 반박 대신 “취지는 좋네. 다만…”처럼 공감 후 완충 표현 + 선택권 부여. 공감: 좋은 일은 구체적으로, 불행한 일은 캐묻지 않고 안타까움만. 리치는 공손성의 원리를 <b>협력의 원리가 명백히 위반되는 경우<\/b>를 설명하려 제안했고, 대인 수사법을 협력·공손성·반어법 원리로 구분합니다."}, {"b": "역", "t": "5(6)대 격률로 소개하며 동의의 격률에서 “무조건적 동조는 바람직하지 않다”는 부연을 붙이고, 공감의 격률을 ‘추가’로 표기합니다. 겸양은 지나친 자기 비하를 지양합니다."}, {"b": "국", "t": "박스 형태로 6격률을 소개하며 사례 판별형으로 활용 가능하다고 표시합니다."}], "explain": "<p>통합인덱스: 격률명과 정의는 3권이 일치합니다(🔴). <b>격률(리치) vs 전략(브라운&amp;레빈슨)<\/b>을 구분해 두세요.<\/p>", "src": "국교이 2장-3 · 역락 7장 · 의사소통이론 Ⅲ-2"}, {"id": "s25", "name": "체면 유지 이론 (Brown &amp; Levinson 1987) — 5대 전략", "warn": true, "exam": "기출 ×4 (체면 유지 전략: 오프레코드 전략 등)", "scope": "역락·이 (국교이는 개념 소개)", "items": ["<b>체면(face)<\/b>: 공적 자아상 (Goffman 1956) — <b>적극적 체면<\/b>(수용·인정받고 싶음) vs <b>소극적 체면<\/b>(방해·강요받지 않고 싶음)", "<b>체면 위협 행위(FTA)<\/b>: 상대의 체면 욕구를 만족시키지 못하는 행위", "<b>5대 전략<\/b>(체면 위협 정도 큰 순): ①직접 말하기(bald on record) ②적극적 예의 ③소극적 예의 ④<b>암시적 말하기(off record)<\/b> ⑤FTA 하지 않기", "적극적 체면 → 적극적 예의(유대감·칭찬) / 소극적 체면 → 소극적 예의(강요 회피, 미안함 표현)"], "diff": [{"b": "이", "t": "체면 위협 정도 순으로 서열화한 것이 특징입니다. ①은 명확한 위계 관계(상관-부하)에서 쓰고, ③소극적 예의의 담화 전략(구현정 2009)은 간접 화행 요청 / 주저 표지(“저어”, “혹시”) / 부담 경감(“조금만”) / 사과 / 상대의 시혜성 강조입니다. ④는 “비가 오는데 서류 제출해야 해서 걱정이야”처럼 <b>해석 책임을 상대에게 전가<\/b>하고, ⑤는 침묵이라 손상 위험은 없으나 목적을 달성할 수 없습니다. <b>전략 선택 공식 Wx = D + P + Rx<\/b>(사회적 거리 + 상대적 힘 + 위험 부담)는 이 책만의 내용입니다."}, {"b": "역", "t": "5대 전략의 명칭·순서가 이와 일치합니다(직접 말하기 / 적극적 예의 / 소극적 예의 / 암시적 말하기 / FTA 하지 않기)."}, {"b": "국", "t": "고프만의 체면 개념과 매슬로 욕구위계를 배경으로 개념을 소개하는 수준입니다. 간접 표현이 FTA 상황에서 부담을 가장 적게 준다고 봅니다."}], "explain": "<p>통합인덱스: 공식은 이 책에만 있어 심화 문제 대비 시 확인이 필요합니다.<\/p>", "src": "역락 7장 · 의사소통이론 Ⅲ-2 · 국교이 2장-3"}, {"id": "s26", "name": "거리 유지의 원리 (Lakoff)", "warn": false, "exam": "", "scope": "역락·이 (국교이 없음)", "items": ["<b>연관성 욕구<\/b> vs <b>독립성 욕구<\/b>의 긴장 — 쇼펜하우어의 ‘고슴도치의 가시’ 비유", "<b>로빈 레이코프 3대 지침<\/b>: ①거리 유지 ②<b>상대에게 선택권 주기<\/b>(핵심) ③우호적 태도(동지애)", "<b>Be clear vs Be polite<\/b>: 정보 공유는 ‘명료하라’, 관계 형성은 ‘예의를 지키라’ — 일반적으로 <b>예의가 명료함보다 우선<\/b>"], "diff": [{"b": "이", "t": "Lakoff(1973) 예의 규칙 / (1990) 예의 전략으로 부르며, 간접성과 예의가 정비례함을 발표 준비 지시 사례로 보여 줍니다. 리치는 이를 받아 공손성의 원리로 정교화했습니다."}, {"b": "역", "t": "‘적절한 거리 유지의 원리’로 소개하며 연관성·독립성 욕구의 긴장을 강조합니다."}], "explain": "", "src": "역락 7장 · 의사소통이론 Ⅲ-2"}, {"id": "s27", "name": "순서 교대 규칙 (Sacks·Schegloff·Jefferson)과 말차례 점검", "warn": true, "exam": "기출 ×2 (순서 교대 신호)", "scope": "역락 고유 (SSJ 이론)", "items": ["<b>교체 적정 지점<\/b>: 말차례가 바뀌기에 적절한 지점 (주로 문장 끝, 억양만으로도 신호 가능)", "<b>규칙1<\/b>: (a) 현재 화자가 다음 화자를 선택 → 선택된 화자가 다음 교체 적정 지점에서 말해야 함 / (b) 선택이 없으면 먼저 나선 사람이 순서 획득 / (c) 아무도 안 나서면 현재 화자가 계속 말할 수 있음(의무 아님)", "<b>규칙2<\/b>: 규칙1(c) 적용 후에도 다음 교체 적정 지점마다 규칙1을 순환 적용", "순서 넘김은 언어뿐 아니라 시선 등 <b>비언어 신호<\/b>로도 이루어짐"], "diff": [{"b": "역", "t": "이상적 대화 구조는 겹침·끊어짐 없이 말차례를 교환하는 것이며, 화자의 전환 의도와 청자의 예측이 일치해야 합니다. 관련 성취기준은 [2국01-03]입니다. 4장 ‘담화 전개 과정 점검’과 7장 ‘대화의 본성’ 양쪽에 나옵니다."}, {"b": "이", "t": "SSJ 이론은 소개하지 않고, 순서 교대를 비언어의 <b>화맥 조절<\/b> 기능 중 하나로 언급합니다(눈맞춤으로 시작을 알리기, 휴지로 순서 교대 신호)."}], "explain": "<p>통합인덱스: 이 개념은 <b>역락만<\/b> 정식으로 다루므로 기출(순서 교대 신호 ×2)은 역락 우선입니다.<\/p>", "src": "역락 4장·7장 · 의사소통이론 Ⅳ-2"}, {"id": "s28", "name": "대화의 구조 (거시구조·미시구조·3부분)", "warn": false, "exam": "", "scope": "역락 고유", "items": ["<b>거시구조<\/b>: 시작 – 중간(핵심 단계) – 종료 (담화 유형에 따라 시작·종료 생략 가능)", "<b>미시구조<\/b>: 개별 발화행위와 행위연속체 — 발화행위는 시작-반응-피드백의 기본 연속체", "<b>대화 3부분<\/b>(구현정·전영옥 2005): <b>시작부<\/b>(호출-응답-연결) / <b>중심부<\/b>(화제 관련성 제약, 맞장구, 화제 전환 표지) / <b>종결부<\/b>(종결 의사 상호 확인, 내용 정리·인사)", "발화행위: <b>명시적<\/b>(표면·일차적) vs <b>묵시적<\/b>(이면·이차적)"], "diff": [{"b": "역", "t": "발화의 실제 의미는 명제 내용보다 전제·함축 때문에 오해가 생기는 경우가 많고, 적절성은 시간·장소·참여자·맥락에 따라 결정됩니다(예: “우리 집에 진돗개 두 마리 있다”는 자랑 또는 위협으로 해석됨). 대화 유형은 기능 기준(박용익 1998)으로 관계 중심적 / 행위 동반적 / 과제 중심적(상보적·협력적·경쟁적)으로 나눕니다."}], "explain": "", "src": "역락 4장·7장"}, {"id": "s29", "name": "메타언어 행위와 메타 커뮤니케이션", "warn": false, "exam": "", "scope": "역락 고유", "items": ["<b>메타언어 행위<\/b>: 언어 자체를 언급하는 행위 = ‘언어에 대한 언어’", "<b>메타 커뮤니케이션<\/b>(Stubbs 1993): 발화를 조정·통제하기 위한 상위 커뮤니케이션", "기능: 전달 과정 점검, 발화 내용·태도·동기 언급으로 소통 문제 예방, 말차례 신호, 메시지 조정, 수신·이해 확인", "새 내용을 전달하지는 않으나 소통 과정의 원활함에 기여 (과도하면 효율성 저하)"], "diff": [{"b": "이", "t": "‘내용 연결 표현’을 넓은 의미의 메타의사소통 행위로 봅니다. 구어에는 들여쓰기·소제목 같은 시각적 안내 장치가 없어 화자가 메타의사소통으로 청자를 담화에 참여시켜야 합니다."}], "explain": "<p>‘내용 연결 표현’ 카드와 연결됩니다.<\/p>", "src": "역락 4장 · 의사소통이론 Ⅵ-2"}]}, {"title": "E. 자아·자기 노출·불안·태도", "cards": [{"id": "s30", "name": "자아 개념과 의사소통 방식", "warn": true, "exam": "기출 ×1 (자아개념·자기표현)", "scope": "세 책 공통", "items": ["자아 개념: 자기 자신에 대한 스스로의 이해·주관적 견해 — 타인(부모·교사·친구)의 메시지로 형성", "<b>긍정적 자아 개념<\/b>: 자기 개방적, 자신감, 대화에 적극 참여, 실수·실패에 집착하지 않음 / <b>부정적<\/b>: 자기방어(회피·공격), 상투적 표현, 자기 비하, 칭찬을 피상적으로 부인, 목소리가 작고 더듬거림 (Myers &amp; Myers)", "<b>순환 구조·악순환<\/b>: 부정적 메시지 → 부정적 자아 개념 → 소극적 의사소통 → 상대의 부정적 규정 → 재차 부정적 메시지", "지도: 기대치를 현실적으로 조정, 교사·동료의 긍정적 피드백, 자아 개념을 규정하는 발화 지양"], "diff": [{"b": "국", "t": "Olson &amp; Forrest(1996) 정의로 개념·언행 대비·지도법을 정리합니다."}, {"b": "역", "t": "타인 메시지 → 자아 개념 → 의사소통 방식 → 재순환의 <b>순환적 구조<\/b>를 명시하고, 화법 교육이 악순환을 선순환으로 전환한다고 봅니다. 오류 지적은 필요하나 자아 개념 자체를 규정하는 발언은 피하고 긍정적 피드백을 병행합니다([12화언01-08])."}, {"b": "이", "t": "긍정/부정을 이분법이 아니라 <b>연속체<\/b>로 봅니다. 중요한 타인의 “너는 ~하다”는 발화가 성장기에 큰 영향을 주며, 표면적 모습보다 성장 경험·가정환경까지 고려해 피드백을 조절해야 합니다. 이론 기원(거울자아, 자기실현적 예언)을 제시하는 것이 특징입니다."}], "explain": "<p>통합인덱스: 3권 모두 ‘악순환’ 구조를 공유합니다. 심화 서술형은 이 책 우선(다음 카드).<\/p>", "src": "국교이 3장 · 역락 3장-5 · 의사소통이론 Ⅰ-1"}, {"id": "s31", "name": "거울에 비친 자아와 자기실현적 예언", "warn": false, "exam": "", "scope": "의사소통이론 고유", "items": ["<b>거울에 비친 자아<\/b>(Cooley 1902): “나는 내가 누구라는 너의 생각에 대한 나의 생각이다”", "<b>3단계<\/b>: ①타인에게 보이는 내 모습을 상상 ②그 모습에 대한 타인의 판단을 상상 ③그로 인한 자부심·굴욕감 등 자기감정으로 자아가 성장", "<b>자기실현적 예언<\/b>(Merton): 타인(특히 중요한 타인)의 기대가 실제 수행 능력에 영향 — 피그말리온 효과·플라시보와 같은 의미로 쓰임", "<b>로젠탈-제이콥슨 실험(1964)<\/b>: 지능검사와 무관하게 무작위 20%를 ‘성적 향상 가능성이 높은 학생’이라고 교사에게 통보 → 실제로 성적이 향상"], "diff": [{"b": "이", "t": "자기실현적 예언은 불안 대처의 <b>이미지 트레이닝<\/b>(성공 장면 상상)의 원리로도 설명됩니다(Rosenthal 1967). 국교이의 내재적 수행법도 covert behavior rehearsal의 효과를 자기충족적 예언으로 설명합니다."}, {"b": "역", "t": "말하기 불안의 인식 대처에서 <b>자기 실현적 예언<\/b>을 활용합니다."}], "explain": "<p>말하기 불안·화법 지도 방법 카드와 연결됩니다.<\/p>", "src": "의사소통이론 Ⅰ-1 · 역락 4장-7 · 국교이 4장"}, {"id": "s32", "name": "자기 노출 (개념·상호성의 규범)", "warn": true, "exam": "기출 ×2 (자아 노출)", "items": ["<b>자기 노출<\/b>: 자신의 생각·느낌·경험을 다른 사람에게 <b>언어적으로<\/b> 나타내는 것 (Derlega 외)", "<b>4속성<\/b>: ①대상이 ‘자신’ ②청자가 실재 ③화자의 의도 ④언어로 전달", "<b>상호성의 규범<\/b>(Jourard 1971; Dindia 1982): 상대의 이전 의사소통에 상응하는 수준으로 반응 — 노출의 균형은 실제 정도가 아니라 <b>서로에게 지각되는<\/b> 균형", "핵심은 ‘자주’, ‘많이’가 아니라 ‘함께’ 적절히 노출하는 것 — 일방적·과도한 초기 노출은 관계 발전을 저해"], "diff": [{"b": "역", "t": "인간관계 발전은 자기 노출 정도에 비례하며 관계의 깊이를 결정하는 것은 만남의 빈도가 아니라 노출 수위입니다. 초기엔 사회적 차원(학교·직장), 친해질수록 개인적 차원(의견·느낌)으로 이동하며 상호작용적으로 진행됩니다(1만큼 하면 상대도 1만큼). 상호성의 규범은 박재현(2023)으로 인용합니다."}, {"b": "이", "t": "상호성의 규범을 인지하는 나이는 초등 6학년 무렵이라 중등부터 점진적 지도가 가능합니다(Rosenberg &amp; Mann 1986). <b>불확실성 감소 이론<\/b>(Berger 1975)으로도 설명합니다. 이 책에서만 사회적 침투·조하리의 창·경계 관리 이론을 다룹니다."}, {"b": "국", "t": "자기 노출 이론은 없고 청자 지향적 표현(권순희)의 맥락에서 간접적으로 다룹니다."}], "explain": "<p>통합인덱스: 자기 노출 문제는 이 책 중심으로 대비하세요. 다음 두 카드를 보세요.<\/p>", "src": "역락 3장-5 · 의사소통이론 Ⅱ-1"}, {"id": "s33", "name": "사회적 침투 이론과 조하리의 창", "warn": false, "exam": "기출: 자아 노출 ×2와 연계", "scope": "의사소통이론 고유", "items": ["<b>사회적 침투 이론<\/b>(Altman &amp; Taylor 1973): <b>깊이 × 폭<\/b>, 양파 비유 — 보상 &gt; 비용이면 친밀해지려는 노력이 지속(사회적 교환 이론의 영향)", "<b>4개 층위<\/b>: 표면(신장·성별 등) / 외면(이름·직업·주소) / 내면(성격·가치관·감정) / 중심(깊은 두려움·욕망)", "<b>조하리의 창<\/b>(Luft &amp; Ingham 1955): <b>공개<\/b>(나도 알고 남도 앎) / <b>보이지 않는<\/b>(남만 앎) / <b>숨겨진<\/b>(나만 앎) / <b>미지<\/b>(둘 다 모름)", "가장 중요한 영역은 <b>숨겨진 영역<\/b>: 자기 노출로 줄고 공개된 영역이 넓어질수록 친밀"], "diff": [{"b": "이", "t": "결합: 공개된 영역 = 표면, 숨겨진 영역의 외면·내면·중심이 의도적 자기 노출을 통해 공개 영역으로 전환됩니다. 미지의 영역은 무의식적으로 표출되어 타인의 반응 해석으로 점차 지각됩니다(개인의 성장과 연결). 사례: 같은 사람이라도 대상과 화제(폭)에 따라 침투 허용 깊이가 다릅니다. 이론가들은 중심까지 모두 투명하게 공개하는 것이 최선이라 보지 않습니다(적절한 경계 설정)."}], "explain": "<p>‘창 이름 4개’와 ‘층위 이름 4개’를 혼동하지 마세요.<\/p>", "src": "의사소통이론 Ⅱ-1-3"}, {"id": "s34", "name": "경계 관리 이론과 자기 노출의 딜레마", "warn": false, "exam": "", "scope": "의사소통이론 고유", "items": ["<b>경계 관리 이론<\/b>(Petronio 1991): 공유하려는 것과 공유하지 않으려는 것 사이의 경계를 계속 조정·관리", "경계 개방 → 친밀감·공유 촉진 / 경계 폐쇄 → 자율·안전 보장, 둘 사이의 갈등은 상시적", "Cozby(1973): 노출을 확대하려는 힘과 감소하려는 힘의 경쟁 / Rawlins(1983): 표현성과 보호성의 <b>변증법적 균형<\/b>"], "diff": [{"b": "이", "t": "화법 교육 방향: “이럴 때 이런 표현” 식의 규범적 처방보다 자기 노출의 필요성을 이해시킨 뒤 <b>경계를 스스로 관리·조정하는 자기 점검 전략<\/b>에 주안점을 둡니다. 사례로 상처가 두려워 마음을 닫으면 친구가 다가오지 않고, 열면 상대가 부담스러워 멀어지는 딜레마가 나옵니다."}], "explain": "", "src": "의사소통이론 Ⅱ-1-4"}, {"id": "s35", "name": "말하기(의사소통) 불안의 정의와 유형", "warn": true, "exam": "기출 ×2 (말하기 불안: 체계적 둔감화, 인식적 측면)", "items": ["<b>국교이 4유형<\/b>: 성격적 불안 / 상황적 불안 / 특정인 접촉 불안 / 특정 상황에서의 특정인에 대한 불안 — 가장 세분화", "<b>역락·의사소통이론 2유형<\/b>: 성격적(성향적) 불안 vs 상황적 불안", "<b>성격적 불안<\/b>: 거의 모든 상황에서, 부정적 자아개념 / <b>상황적 불안<\/b>: 발표·면접 등 특수 상황, 누구나 겪는 보편적 현상"], "diff": [{"b": "국", "t": "특정인 접촉 불안은 화자에게 중요한 특정 상대 앞에서 과거 실패·거절 예상에서 생기고, 네 번째 유형은 상황적 압박감과 특정인에 대한 과거 부정적 경험이 결합합니다."}, {"b": "역", "t": "정의: ‘말하기 상황을 예측·직면·수행 중에 느끼는 심리적 불안감으로 원활한 의사소통을 방해하는 인지적·생리적·행동적 상태’(서영진·전은주 2010). 유형은 박재현(2023)입니다."}, {"b": "이", "t": "‘말하기 불안’보다 <b>‘의사소통 불안’<\/b>이 적합하다고 봅니다(듣기를 포함해 소통 자체를 꺼리는 현상, McCroskey 1977). 성향적 불안은 상황적 불안이 지속·악화되어 고착된 것이며 모든 학생이 불안을 경험하고 약 20%는 성향적 수준입니다(McCroskey 1984). 상황적 불안은 ‘누구나 겪는다’는 인식만으로 완화될 수 있으나 성향적 불안은 부정적 자아개념을 다루는 내면적 접근이 필요합니다."}], "explain": "<p>⚠️ <b>2유형 vs 4유형<\/b> 불일치 — 어느 책 기준인지 확인하세요(통합인덱스).<\/p>", "src": "국교이 3장 box · 역락 4장-7 · 의사소통이론 Ⅰ-2"}, {"id": "s36", "name": "불안의 원인과 대처 (체계적 둔감화·실제 상황 노출법)", "warn": true, "exam": "기출 ×2 (말하기 불안: 체계적 둔감화, 인식적 측면)", "items": ["<b>원인<\/b>: 역락 3범주(인지적·생리적·행동적, Ayres &amp; Hopf) vs 이 책 2범주(생리적·인지적)", "<b>체계적 둔감화<\/b>: <b>상호 억제 원리<\/b> — 불안과 상반되는 이완 반응이 불안 반응을 대신하도록 조건화. 심부근육 이완 훈련 → 긴장도가 낮은 말하기 장면부터 순차적으로 이완 연습", "<b>실제 상황 노출법(flooding)<\/b>: 두려운 상황에 곧바로 직면 — ‘부딪혀도 끔찍한 결과는 일어나지 않는다’", "<b>인식 대처<\/b>: 상황·자신·불안 감정에 대한 인식 전환 (자기실현적 예언 활용)"], "diff": [{"b": "이", "t": "체계적 둔감화는 1950년대 공포증 치료에서 개발되어 1960년대 중반 대중연설 공포에 도입되었습니다(절차: 이론 설명 → 부위별 긴장·이완 → 장면 위계 연습). 불안증 극복 체조(Bertram-Cox 1965)를 사례로 듭니다. 자율신경(교감신경) 활성화는 누구에게나 일어나며 화자가 <b>인지적으로 불안하다고 지각<\/b>해야 의사소통 불안입니다(Beatty). 인식 전환: 불안은 예감→직면→적응→해방의 일시적 현상이고, 자신감 있는 화자는 심장 박동 증가를 ‘흥분’으로 재해석합니다. 생리적 반응에 “떨지 마”라고 하는 피드백은 바람직하지 않습니다."}, {"b": "역", "t": "행동 대처는 준비·실행 단계의 말하기 기능 훈련입니다."}, {"b": "국", "t": "내재적 수행법, 체계적 둔감화, 긴장 이완 훈련, 자아개념 개선으로 점진적으로 개선합니다."}], "explain": "<p>통합인덱스: 체계적 둔감화는 3권 모두 나오며 이 책이 이론적 기원과 절차를 가장 상세히 다룹니다.<\/p>", "src": "의사소통이론 Ⅰ-2 · 역락 4장-7 · 국교이 3장 box"}, {"id": "s37", "name": "말하기 효능감 (Bandura)", "warn": false, "exam": "", "scope": "역락 고유", "items": ["<b>자기 효능감<\/b>: 특정 행동을 성공적으로 수행할 수 있다는 신념 (Bandura 1977)", "<b>4가지 정보원<\/b>: <b>성공 경험<\/b>(직접, 가장 강력) / <b>대리 경험<\/b> / <b>사회적 설득<\/b> / <b>생리적 상태<\/b>", "<b>측정 3차원<\/b>(박인영·김아영 2001): <b>수준 · 강도 · 일반성<\/b>", "신장 방법: 공식적·격식적 말하기(토론·발표) 능력 함양 + 청자와의 적극적 상호작용 능력"], "diff": [{"b": "역", "t": "Bandura 이론을 화법에 명시적으로 적용한 유일한 책입니다(통합인덱스). 국교이·이에는 별도 개념이 없고 긍정적 자아개념과 연결됩니다. 작문의 ‘쓰기 효능감’과 같은 정보원 틀입니다."}], "explain": "", "src": "역락 4장-6"}, {"id": "s38", "name": "정의적 요인과 듣기·말하기 태도", "warn": false, "exam": "", "scope": "역락 고유", "items": ["<b>정의(affectivity)<\/b>: 인지의 상대 개념, 심리·감정을 수용/거부하게 하는 의식적 작용 (정서와 구분)", "<b>태도 · 흥미 · 동기 · 가치<\/b>: 태도=인식+정서가 통합된 지속적 행동 경향(3차원: 정서+인지+행동) / 흥미=끌리는 정서, 태도보다 역동적·불안정 / 동기=목표 달성 노력 경향 / 가치=태도의 묶음, 보편적 대상에 대한 규범적 평가", "<b>듣기·말하기 태도<\/b>: 활동에 대한 좋고 싫음의 평가에 따라 참여/회피 반응을 일관되게 산출하는 심리적 경향성 — 장기간 경험·학습으로 형성되므로 교육 가능"], "diff": [{"b": "역", "t": "학자별 태도 정의(Allport, Eagly &amp; Chaiken, Ajzen &amp; Fishbein, Gardner)의 공통 요소는 대상·평가·심리(반응)·경향성입니다. 작문의 정의적 요인(동기·효능감·불안·윤리)과 같은 틀입니다."}], "explain": "<p>화법 태도 교수·학습 모형 카드와 연결됩니다.<\/p>", "src": "역락 4장-5"}, {"id": "s39", "name": "대화 성찰 태도와 의사소통 윤리", "warn": false, "exam": "기출: 언어 예절 ×1과 연계", "scope": "역락 고유", "items": ["<b>대화 성찰 태도<\/b>(민병곤·박성석 2017): 대화 중·후 발화 내용·방식·전제를 점검하는 태도 — <b>3구인<\/b>: 사려 깊은 행동 / 내용·과정 성찰 / <b>전제 성찰<\/b>", "성찰 개념: Dewey(문제 상황 → 가설 → 증거 검토), Mezirow(비성찰적 행동 vs 성찰적 행동 — 내용·과정·전제 성찰)", "<b>의사소통 윤리<\/b>: Spitzberg &amp; Cupach 윤리성 × 적절성 4유형(‘bright side message’ 지향), Verderber: 정직·성실·공정·배려·책임, NCA 윤리적 의사소통 신조", "<b>3가지 특별 관심 요소<\/b>: ①자신의 말에 대한 책임감 ②<b>청자의 윤리<\/b>(구어는 발신·수신 구분이 엄격하지 않아 청자도 책임 공유) ③문화 간 의사소통 윤리(<b>언어 관용성<\/b>)"], "diff": [{"b": "역", "t": "발달 활동은 성찰 일지·에세이(Boud 2001)와 성찰적 대화 활동입니다. 관련 성취기준 [9국01-11](듣기·말하기 과정 점검·조정, 상위인지)은 국교이의 상위인지 전략과 공유하나 이론틀이 다릅니다."}], "explain": "", "src": "역락 4장-8·9"}, {"id": "s40", "name": "청자 지향적 표현 방법 (권순희 2001) — 나-전달법·우리-전달법", "warn": false, "exam": "기출 ×1 (나-전달법/우리-전달법)", "scope": "국교이 고유", "items": ["<b>구조적 표현 방법<\/b>: 열린 질문 / 청자 지향 어휘 선택 / <b>나-전달법<\/b>(문제를 상대에게 돌리지 않고 나의 관점·감정으로) / 공감적 응대 / ‘동의, 그러나’ / <b>우리-전달법<\/b>(명령 상황에서 강압감 완화) / 되묻기(거절 상황에서 청자 스스로 답하게 함) / 간접 표현", "<b>비구조적 표현 방법<\/b>: 입장 바꾸기 / 화자의 판단 유보하기 / 청자 지식 공유화", "궁극적으로 <b>상대의 체면을 존중<\/b>하는 방법으로 수렴 → 공손성의 원리와 연결"], "diff": [{"b": "국", "t": "대화 지도의 핵심 출제 요소로 표시된 부분입니다. 대화 교육 요목: 언행적/관계적 목적 이해, 상대 인정하기, 체면 존중, 유대 이동, 자기 개방·자기표현, 공감적 경청."}, {"b": "이", "t": "직접 같은 용어는 없고 기능적으로 대응하는 것이 <b>비폭력 대화 4단계<\/b>입니다."}], "explain": "<p>⚠️ 나-전달법 ↔ 비폭력 대화 용어 불일치 (통합인덱스).<\/p>", "src": "국교이 3장-2(2)①"}, {"id": "s41", "name": "화자·청자 관계 유형 (Kelly &amp; Watson 1986)", "warn": false, "exam": "", "scope": "역락 고유", "items": ["<b>친밀함 × 평등함<\/b> 2차원의 4유형", "<b>친밀+평등<\/b>: 절친한 친구 — 개인화된 규칙 중심", "<b>친밀+불평등<\/b>: 의사-환자 — 개인화된 규칙과 일반 규칙 동시 고려, 상급자 주도 존중", "<b>불친밀+평등<\/b>: 대부분의 동료 — 상황별 일반적 방식", "<b>불친밀+불평등<\/b>: 고용자-피고용자 — 일반적 규칙, 상급자 주도 인정, 격식 있는 언어, 화제 제한"], "diff": [{"b": "역", "t": "관계 유형에 대한 서로의 <b>인식 불일치<\/b>가 갈등의 원인이므로 친밀·평등에 대한 인식을 공유·조정해야 합니다. 참여자 인식은 청자·화자·관계 세 층위이고, 화자 인식이 소홀히 다뤄지는 경향이 있으며 말하기 불안의 근본 원인은 화자의 자아 정체성 인식과 관련됩니다."}], "explain": "<p>사례 판별형으로 나오기 좋습니다.<\/p>", "src": "역락 3장-4"}, {"id": "s42", "name": "친교·정서 표현 (칭찬·질책)", "warn": false, "exam": "", "scope": "국교이 고유", "items": ["<b>친교 및 정서 표현<\/b>: 칭찬·질책·부탁·거절·사과·감사·충고·위로·격려·축하 — 생각·감정을 나누며 긍정적 관계를 형성", "<b>칭찬<\/b>: 구체적으로, 성격·인성이 아닌 <b>행동<\/b>에 대해, 그 행동에 대한 나의 생각·느낌 표현, 긍정적 표현, 적절한 시기 (과장·부적절한 칭찬은 불쾌감)", "<b>질책<\/b>: 목적은 재발 방지 — 상대 체면 존중 / 해당 문제에 대해서만(확대 금지) / 개선 방법 함께 제시 / 일정 시간 후 위로·격려", "질책을 받았을 때: 잘못 인정 · 감정 표현 · 미안함 표현 · 향후 행동 방향 표현 (정당화하는 변명·반격은 관계 악화)"], "diff": [{"b": "국", "t": "담화 목적별 교육 내용(설득·설명·친교) 중 하나입니다. 설명 방법은 예시·비교와 대조·분류·정의·분석이며, 음성언어 설명은 명확·구체적 표현, 청자 흥미 유발, 시청각 자료, 자신감 있는 비언어 표현이 문자언어와 다릅니다."}], "explain": "", "src": "국교이 3장-2(3)"}]}, {"title": "F. 설득·연설·발표", "cards": [{"id": "s43", "name": "아리스토텔레스의 3대 설득 요건 (에토스·파토스·로고스)", "warn": true, "exam": "기출 최핵심: 감성적 설득 전략 · 화자의 공신력(강연) ×2", "scope": "세 책 공통 (이가 압도적)", "items": ["<b>에토스(ethos)<\/b>: 인격적 설득 — 화자의 지식·경험·태도에 대한 신뢰 = 화자의 공신력", "<b>파토스(pathos)<\/b>: 감성적 설득 — 청중의 정서에 호소해 공감을 얻음", "<b>로고스(logos)<\/b>: 논리적 설득 — 논증(연역·귀납·유추·인과)을 통한 설득", "세 요건은 별개가 아니라 <b>상호보완적<\/b>"], "diff": [{"b": "국", "t": "설득의 구체적 목적(신념 변화 / 태도 변화 / 행동 변화)에 따라 방법이 달라짐을 먼저 이해시켜야 합니다. ‘점성술은 비과학적이다’를 세 방식으로 표현한 사례(박경현 2001)를 듭니다."}, {"b": "역", "t": "13장 연설 교육에서 설득 연설의 핵심 개념으로 다룹니다(연설의 유형: 정보 전달 / 설득 / 환담). 설득 연설은 청중 태도(우호적/중립적/적대적)별로 차별화합니다."}, {"b": "이", "t": "에토스는 Ⅷ-1(공신력), 파토스는 Ⅷ-2(감성적 소구), 로고스는 Ⅸ(논증)로 각각 독립 장으로 이론화합니다. 아리스토텔레스는 서론·결론에서는 감성적 소구, 문제 진술·논증에서는 이성적 소구를 쓰는 <b>기능적 안배<\/b>를 강조했고, Hollingworth(1935)는 메시지 전체가 논리적일 때는 감성적 호소가 더 효과적일 수 있다고 봅니다(Festinger의 인지부조화로 뒷받침)."}], "explain": "<p>통합인덱스: 용어는 공유하나 <b>이 책만 각 요건을 독립 장으로 심화<\/b>합니다. 설득 문제(감성적 설득 전략, 화자의 공신력)는 이 책 중심으로 학습하세요.<\/p>", "src": "국교이 3장-2(3) · 역락 13장 · 의사소통이론 Ⅷ·Ⅸ"}, {"id": "s44", "name": "화자의 공신력 (McCroskey &amp; Jensen 5차원)", "warn": true, "exam": "기출 ×2 (강연: 화자의 공신력)", "scope": "의사소통이론 고유", "items": ["<b>공신력<\/b>: 화자의 신뢰와 관련된 <b>수신자의 판단<\/b>(O’Keefe) — 화자 속의 절대 속성이 아니라 청자가 <b>지각<\/b>한 것", "<b>5차원<\/b>: <b>전문성<\/b>(competence) · <b>신뢰성<\/b>(trustworthiness) · <b>사회성<\/b>(sociability) · <b>침착성<\/b>(composure) · <b>외향성<\/b>(extroversion)", "전문성·신뢰성이 1차적 핵심 차원 / 외향성은 문화적 차이 있음", "에토스의 3차원(지능 · 도덕적 성격 · 선의)에서 출발, Hovland &amp; Weiss(1951)가 ‘source credibility’로 용어 통일"], "diff": [{"b": "이", "t": "특징 4가지(차배근 1989): 특정 화제와 무관하게 형성되는 일반적 신뢰 / 커뮤니케이션 효과에 정적·부적 영향 / 여러 차원의 집합 / 청자의 지각으로 평가. 다른 분야까지 전문성을 인정받는 현상이 <b>후광 효과<\/b>이며 공신력은 시간에 따라 변합니다. <b>신장 6방안<\/b>: ①타인의 소개(스스로 소개하면 겸양의 격률 위반) ②철저한 준비(유창성은 전문성에 큼, 또래에게는 신뢰할 자료 인용) ③공감대 형성 ④간결·명료한 언어 표현 ⑤비언어적 전달(눈맞춤=신뢰성·사회성, 안정된 자세=신뢰성·침착성, 복장=전문성, 거리=사회성·외향성) ⑥<b>무지의 인정<\/b>(근거 없는 답변은 전문성·신뢰성 모두 저하). 사례: 학위·경력 소개(전문성) / 학생 성장에 대한 진심(신뢰성) / 친근한 소통(사회성) / 돌발 질문에 평정심(침착성) / 신념에 찬 어조(외향성)."}], "explain": "<p>통합인덱스: 5차원 분류는 이 책만 다루며 국교이·역락은 에토스를 간략히 소개하는 수준입니다.<\/p>", "src": "의사소통이론 Ⅷ-1"}, {"id": "s45", "name": "감성적 설득 전략 (소구 4유형)", "warn": true, "exam": "기출: 감성적 설득 전략 (연설 ×4 중)", "scope": "의사소통이론 고유", "items": ["<b>감성적 소구<\/b>: 청자의 특정 감정을 유발하는 설득 방법 (Lucas 1995) = 파토스", "<b>공포 소구<\/b>: 3단계(변화가 없을 때의 심각한 결과 → 발생 가능성 → 모면·최소화 방안) / Janis &amp; Feshbach(1953): 공포 정도와 효과는 <b>역U자형<\/b> (너무 약하면 무효, 너무 강하면 메시지 거부)", "<b>유머 소구<\/b>: 사회성에는 긍정적이나 전문성에는 도움이 안 됨(자기비하 유머는 부정적), 화제와 무관하면 <b>주변 경로<\/b> 처리를 유발해 부적합", "<b>성적 소구<\/b>: 암시적 전달, 지나치면 역효과·주의 분산", "<b>온정 소구<\/b>: 가족·연인·친구 관계 설정 — <b>대조 효과<\/b>(다른 장면 이후 배치될 때 효과 큼)"], "diff": [{"b": "이", "t": "<b>사용 전략 5가지<\/b>: ①감성–이성의 균형 ②청자 요구에 주목한 개인화(<b>Maslow 욕구 5단계<\/b> 활용) ③감성적 어휘·표현(킹 목사의 “나에게는 꿈이 있습니다”) ④진정성 ⑤윤리적 유의(양날의 검). 박경현(1993): 청자는 생각만이 아니라 느끼기도 하므로 이성·감성 모두 필요하며, 논리적 설득에도 공감성이, 정서적 설득에도 합당한 논리·증거가 필요합니다."}], "explain": "<p>정교화 가능성 모형(유머=주변 경로)과 연결되는 지점입니다.<\/p>", "src": "의사소통이론 Ⅷ-2"}, {"id": "s46", "name": "설득의 5단계와 동기화 단계 조직", "warn": true, "exam": "기출: 연설 계획과 반응 대조, 청중 분석 (연설 ×4 중)", "scope": "국교이 ↔ 의사소통이론 (번역어 차이)", "items": ["<b>국교이 설득의 5단계<\/b>(박경현 2001): 주의 환기 → 필요 → 만족 → 구체화 → 행동 촉구", "<b>동기화 단계<\/b>(Monroe, 1930년대): 주의 끌기 → 요구 → 만족 → 시각화 → 행동", "대응: 주의환기=주의끌기 / 필요=요구 / 만족=만족 / 구체화=시각화 / 행동촉구=행동 — <b>동일 이론의 번역어 차이<\/b>"], "diff": [{"b": "국", "t": "주의 환기에는 대담한 표현·유머·놀라운 사실·질문·경험담·실물 활용이, 필요 단계는 해결할 문제를 인식시키고 흥미를 유발하며, 구체화 단계는 해결책의 구체적 이익/손해를 제시합니다."}, {"b": "이", "t": "이론적 기원까지 제시합니다: Ross(1974)는 모체를 <b>아리스토텔레스<\/b>(서론·해설·논증·결론)와 <b>Dewey<\/b>(반성적 사고 5단계)에서 찾습니다. 동기화 단계의 뼈대는 ‘문제-해결’이며 요구=문제, 만족=해결에 대응합니다. 국내에는 1958년 정태시 『새 시대의 연설』로 처음 소개되었습니다."}, {"b": "역", "t": "도입-전개(문제해결구성)-결론의 3단 구성을 설명하고 20~30분 집중력 저하 구간을 언급합니다."}], "explain": "<p>통합인덱스: 가장 심화된 자료는 이 책입니다. 세부는 다음 카드를 보세요.<\/p>", "src": "국교이 3장-3 · 의사소통이론 Ⅵ-1 · 역락 13장"}, {"id": "s47", "name": "동기화 단계 조직의 세부 단계와 특성", "warn": false, "exam": "", "scope": "의사소통이론 고유", "items": ["<b>설득 메시지 조직 유형<\/b>(Lucas): 사실 규명·가치 판단(화제별) / 정책 제안 — <b>문제-해결<\/b> / <b>문제-원인-해결<\/b> / 해결방안 장단점 분석 / 동기화 단계", "①<b>주의 끌기<\/b>: 호기심·긴장감 유발. <b>설득 목적 진술·내용 개관을 하지 않음<\/b> (저항감 유발)", "②<b>요구<\/b>: 문제 심각성을 통계·증언으로 입증, 청자 <b>내부의 심리적 요구<\/b>에 초점 / ③<b>만족<\/b>: 해결방안 + 실현가능성, 이성적 측면 강함, 일면/양면 메시지", "④<b>시각화<\/b>: 해결방안의 이익을 생동감 있게 묘사(‘언어 그림’) / ⑤<b>행동<\/b>: 구체적·명확한 행동 요구, 고무적 호소로 마무리"], "diff": [{"b": "이", "t": "특성: 텍스트 중심이 아니라 <b>청자의 심리에 흘러드는 인간 중심 조직<\/b>이며, 메시지는 청자의 필터 체계(경험·태도·동기·편견)를 통과합니다(Brembeck &amp; Howell). 신념·태도 변화뿐 아니라 <b>행동 유발<\/b>까지 다루고, 정책 변화 촉구에 가장 효과적입니다(Monroe 1962). 사례: 오토바이 헬멧 착용 촉구(친구의 사고 실화 → 통계 → 헬멧 착용·양면 메시지 → 피해 감소 묘사 → 구매처 안내). 발표에서는 이를 슬라이드 배열에 그대로 적용합니다(ⅩⅡ장)."}], "explain": "<p>‘일면/양면 메시지’ 카드와 함께 보세요.<\/p>", "src": "의사소통이론 Ⅵ-1 · ⅩⅡ-2"}, {"id": "s48", "name": "일면 메시지 vs 양면 메시지와 청자 입장별 전략", "warn": true, "exam": "기출: 청중 분석·연설 계획과 반응 대조와 연계", "scope": "의사소통이론 고유", "items": ["<b>일면 메시지<\/b>(반론 없이 주장만) vs <b>양면 메시지<\/b>(반박할 이의를 함께 제시)", "기존 입장이 <b>찬성<\/b>이거나 지적 수준이 낮은 청자 → 일면 (Lumsdaine &amp; Janis 1953; Hovland 외 1949)", "기존 입장이 <b>반대<\/b>이거나 지적 수준이 높은 청자 → 양면 (교육수준 높은 청자는 양면 메시지를 제시한 화자의 공신력도 더 높게 평가)", "<b>반대 입장 + 사전지식 많음<\/b> → 일면 메시지를 쓰면 안 됨", "양면 메시지 제시 순서(Jackson &amp; Allen 1987): <b>화자 입장을 먼저<\/b> 제시하거나 상호 교차가 반대 입장을 먼저 제시하는 것보다 효과적"], "diff": [{"b": "이", "t": "청자 입장별 동기화 단계: 찬성=일면 / 반대(Monroe &amp; Ehninger)=공감대 확보 → 일반원칙 동의 후 적용 → 계획이 최선임을 주장 → 결과 제시 → 행동보다 <b>태도 변화<\/b>에 초점 / 미정(문제는 인식하나 해결책 없음)=3단계 ‘만족’에 초점 / 무관심=주의 끌기 → 배경 설명 → 태도·신념 제시 → 근거 제시. 반대 입장 청자에게는 초기에 공감대를 확보하고 기대 목표를 낮춰야 하며, 도입부에서 편 가르기를 하면 방어 태세를 부릅니다. <b>심리적 저항 이론<\/b>(Brehm 1966): 설득 시도가 자유를 위협한다고 느끼면 강하게 저항합니다."}], "explain": "<p>통합인덱스: 선택 기준이 기존입장·지적수준·사전지식 세 변인에서 반복 등장하므로 종합 정리가 중요합니다.<\/p>", "src": "의사소통이론 Ⅵ-1·Ⅶ-2"}, {"id": "s49", "name": "청자 분석의 5요인과 정교화 가능성 모형의 4변인", "warn": true, "exam": "기출 ×4 (청중 분석: 개인적 관련성, 연설 계획과 반응 대조)", "scope": "역락 ↔ 의사소통이론 (이론 배경이 다름)", "items": ["<b>역락 5요인<\/b>(박재현 2006): 요구 · 지적 수준 · 사전 지식 · 기존 입장 · <b>개인적 관련성<\/b>", "<b>의사소통이론 4변인<\/b>(정교화 가능성 모형): 기존 입장 · 지적 수준 · 사전 지식 · 개인적 관련성 (‘요구’ 없음)", "역락: 요구=청자가 원하는 것 예측 / 지적 수준=난도 결정 / 사전 지식=도입부 구성 / 기존 입장=설득에서 특히 중요 / 개인적 관련성=낮으면 도입부에서 흥미·관련성 설명"], "diff": [{"b": "역", "t": "청자 분석은 의례적 준비 단계가 아니라 <b>화법 능력 그 자체<\/b>이며 분석 정보를 수행에 적용하는 것이 목표입니다. 개인적 관련성이 높고 입장이 반대인 조합이 가장 어려워 공공의 선을 강조하는 대의 기반 논의가 필요합니다. 기존 입장이 호의적이면 시종일관 선명하게, 반감이 크면 도입부에서 공감대를 형성하고 점진적으로 논의합니다."}, {"b": "이", "t": "인구통계학적 정보는 표현 차원에만 영향을 주므로 <b>인지적·심리적 특성<\/b> 분석이 더 중요하며, 가장 중요한 항목은 <b>기존 입장<\/b>(Kearney &amp; Plax)입니다. 네 변인은 서로 상호작용하며 특히 기존 입장이 다른 변인의 영향을 매개합니다(사전지식 많고 찬성이면 더 지지, 반대면 더 거부)."}], "explain": "<p>⚠️ 통합인덱스: 변인명은 거의 같으나 <b>이론적 배경이 다릅니다<\/b> — 역락은 박재현(2006)의 종합, 이 책은 Petty &amp; Cacioppo의 중심/주변 경로. 답안에는 어느 틀인지 구분해 쓰세요.<\/p>", "src": "역락 3장-2 · 의사소통이론 Ⅶ"}, {"id": "s50", "name": "정교화 가능성 모형 (Petty &amp; Cacioppo 1986)", "warn": true, "exam": "기출: 청중 분석·연설 계획과 반응 대조의 이론적 근거 가능", "scope": "의사소통이론 고유", "items": ["설득 메시지 수용자를 능동적 <b>정보 처리자<\/b>로 봄. <b>정교화<\/b> = 메시지 처리에 기울이는 공들임의 정도(연속체)", "<b>중심 경로<\/b>: 정교화 高, 비판적 사고로 핵심을 평가 → 태도 변화가 <b>지속적<\/b>이고 행동으로 이어질 가능성 높음, 역설득 저항력 증가", "<b>주변 경로<\/b>: 정교화 低, 주변 단서(화자의 첫인상·호감도, 주장의 수, 청자의 기분, 배경음악 등)로 단순 추론 → 일시적 태도 변화", "<b>경로 선택 변인<\/b>: <b>능력<\/b>(할 수 있는가: 시간 압박·사전지식·교육수준) × <b>동기<\/b>(하고자 하는가: 개인적 관련성, 인지 욕구)"], "diff": [{"b": "이", "t": "실제로는 두 경로가 혼합됩니다. <b>능력 고려<\/b>: 어려운 주제는 쉬운 어휘·간결한 문장·비유, 논증 수를 줄이고 일면 메시지, 결론 명시. <b>동기 고려<\/b>: 개인적 관련성을 부각, 특히 <b>도입부<\/b>에서 동기를 형성해야 합니다(‘나와 상관없다’고 느끼면 주변 경로로 흐름). Petty 외(1986): 10~14일 후 재측정에서 중심 경로 집단의 태도가 더 지속되고 저항력이 컸습니다. 사례: ‘등록금 인상’(관련성 높음, 중심 경로) vs ‘지하 주차장 건설’(낮음), ‘아침 식단’(쉬움) vs ‘외국환평형기금 확대’(어려움)."}], "explain": "<p>통합인덱스: 국교이·역락의 청자 분석은 이 이론적 근거 없이 실무적 나열에 그칩니다. 이론적 근거를 요구하는 서술형은 이 책이 필수입니다.<\/p>", "src": "의사소통이론 Ⅶ-1"}, {"id": "s51", "name": "개인적 관련성과 결론 제시 방식", "warn": false, "exam": "기출 ×4 (청중 분석: 개인적 관련성)", "scope": "의사소통이론 고유", "items": ["<b>개인적 관련성<\/b>: 화자의 주장에 대해 청자가 지각하는 관련의 정도 — 자신의 삶에 중요한 결과를 낳을수록 커짐 (Petty &amp; Cacioppo의 번역어로 통일)", "관련성이 높을수록 찬성/반대의 입장 차이가 극명해지고 청자는 더 정교하게(중심 경로) 처리하려는 동기가 강해짐", "<b>개인화는 화자가 주장하는 입장 쪽으로<\/b> 유도해야 함 (예: 님비 해결 연설 — 일반적 진술 후 청자 가족이 수용시설이 필요한 처지가 될 경우로 전환)", "관련성이 지나치게 강하면 자기중심적·편향 처리 → 개인화를 <b>약화<\/b>시키고 공공의 이익으로 초점 전환"], "diff": [{"b": "이", "t": "<b>결론 제시 방식<\/b>: 관련성 낮음 → <b>명시적<\/b> 결론(O’Keefe 1990, 오해 감소) / 관련성 높음(예민한 사안) → <b>암시적<\/b> 결론으로 청자가 스스로 결론을 내리게 함(Hovland 외 1953). <b>사전지식<\/b>: 충분하면 배경 설명 불필요, 불충분하면 도입부에서 충분히 설명. <b>지적 수준<\/b>과 사전지식은 별개(지적 수준은 높아도 사전지식은 적을 수 있음)."}], "explain": "", "src": "의사소통이론 Ⅶ-2"}, {"id": "s52", "name": "내용 연결 표현 (10유형)", "warn": true, "exam": "기출 ×4 (내용 연결 표현) · 화자 공신력과 연계", "scope": "세 책 (이가 10유형)", "items": ["<b>정의<\/b>: 넓은 의미의 메타의사소통 중 담화 구조를 논리적으로 드러내는 표현 — 단락 내용을 연결하며 앞 내용 정리 또는 뒤 내용 안내", "<b>10유형<\/b>: ①요약 ②도입 ③개관 ④전환 ⑤강조 ⑥보충 ⑦부연 ⑧예증 ⑨한정 ⑩분류", "‘요약’은 선행 내용을 지시하고 나머지는 대부분 <b>후행 내용을 예고<\/b>", "필요한 이유: 구어에는 문어의 시각적 구조 파악 장치가 없기 때문"], "diff": [{"b": "이", "t": "기존 ‘논의전환사’(임태섭 2003)가 전환 기능만 강조해 협소하다고 보고 <b>‘내용 연결 표현’<\/b>을 채택합니다. 담화 표지(이기갑, 김영철)·텍스트 구조 표지(김봉순)와의 관계도 정리합니다. 기능 3가지: ①담화 구조 묘사(청각 신호로 시각적 단서 대체) ②메시지와 청자의 <b>심리적 결속<\/b> (“어떤 분들은 의문이 생기실 수 있습니다”) ③<b>쌍방향 대화 효과<\/b>(의문형 연결이 평서형보다 청자를 끌어들임). 표현하기 단계에서 임의적으로 행해져 소홀히 다뤄졌지만 능숙한 화자와 미숙한 화자를 가르는 요인입니다."}, {"b": "역", "t": "4장(담화 전개 과정 점검)과 12장(발표 교육) 양쪽에 반복 등장합니다(박재현 2006·2023). 도입부 요약 후 전개부로 이행하거나 전개부를 개관·예고하는 표현 두 가지를 듭니다."}], "explain": "<p>통합인덱스: 이 책의 10유형이 가장 세밀하고 실전적, 역락은 메타의사소통 이론 배경이 강점입니다. 4장·12장에 반복되는 <b>초빈출 개념<\/b>입니다.<\/p>", "src": "역락 4장·12장 · 의사소통이론 Ⅵ-2"}, {"id": "s53", "name": "연설의 준비 과정 (국교이 3단계 vs 역락 6단계)", "warn": true, "exam": "기출: 연설 계획과 반응 대조 · 청중 분석 (연설 ×4)", "items": ["<b>국교이 3단계<\/b>: <b>준비 개요서<\/b> 작성 → <b>실행 개요서<\/b> 작성 → 연습하기", "<b>역락 6단계<\/b>: 주제 설정 → 상황·청자 분석 → 자료 수집 → 내용 조직 → 연설문 작성 → 예행 연습", "국교이 ‘준비 개요서/실행 개요서’는 고유 용어, 역락의 ‘전문 원고 vs 표제어 원고’와 개념적으로 대응"], "diff": [{"b": "국", "t": "준비 개요서: 주제·세부 목적·핵심 명제를 명시하고 서론/본론/결론을 목차 형식으로 구성하며, 연결사·부연·반복·상세 설명은 제외하고 주요 아이디어·서두·결언은 <b>완전한 문장<\/b>으로 씁니다. 실행 개요서: 체계를 유지하며 기억에 도움 되는 <b>핵심 단어·구<\/b> 중심입니다. 연습하기: 개요서를 보지 않고 언어·비언어 표현을 조절하며 시간 내 완결. 매번 표현이 조금씩 달라지는 점이 암기식 연설(중간에 기억이 끊기는 문제)을 극복하게 합니다."}, {"b": "역", "t": "주제는 직접 경험·확고한 관심에서, 핵심 메시지를 나침반처럼 씁니다. 자료는 생생하고 이해·기억하기 쉬우며 지적 수준에 맞고 흥미로워야 합니다. 개요(설계도면 비유)는 서론부(주의집중+핵심 메시지) → 본론부(요점+뒷받침 자료) → 결론부(요약+강조+실천 촉구)이며, 표제어 원고는 능숙한 화자가 선호합니다(눈맞춤·유연한 보충 가능). 예행 연습은 실제 장소 리허설과 촬영 자기점검입니다."}], "explain": "<p>⚠️ 준비 단계 수(3 vs 6)가 다릅니다(통합인덱스). 국교이의 개요서는 포트폴리오 평가 자료로도 쓰입니다.<\/p>", "src": "국교이 3장-2(2)② · 역락 13장-2"}, {"id": "s54", "name": "연설의 도입·전개·결언과 유형", "warn": false, "exam": "기출: 결언 방법 (연설 ×4 중)", "scope": "국교이·역락", "items": ["<b>국교이 서론 기법<\/b>: 관심 끌기 / 인용하기 / 주변 상황 언급 / 청중 동원 / 신변 잡담 언급", "<b>결론 구조<\/b>: ‘종료 신호 – 요점 재강조 – 결언’ / <b>결언 방법<\/b>: 명언·격언·속담 인용 / 미래지향적 결언 / 청중 중심의 결언", "<b>역락<\/b>: 도입부에서 <b>변명으로 시작 금지<\/b>(유머·일화·도발적 질문·인용) / 전개부 20~30분 구간에서 집중력 급격 저하(한정선 2002) → 흐름 전환·흥미 사례 / 결론부는 종료 알림·요약 재강조·긍정적 전망·실천 독려·청중 삶에 대한 의미 환기"], "diff": [{"b": "국", "t": "연설 유형: 설명·설득(비교적 긴 준비된 말하기) / 소개·수여·수령·기념·졸업 축하·헌납·홍보 연설(30초~3분의 짧은 시간, 공식 행사 절차 내 기능)."}, {"b": "역", "t": "연설은 정보 전달 / 설득 / 환담(긴장 완화, 시의성 고려) 3분류이며 3대 구성요소는 연사·청중·메시지입니다. 표현: 발음(표준 발음), 변화 있는 목소리, 표정·시선(개개인 응시)·제스처·자세·복장(첫인상)."}, {"b": "이", "t": "발표 도입 관심 유발: ①경험 소개(스토리텔링) ②질문(쌍방향 효과) ③인용구. 도입부에서 장황한 인사말은 지양합니다."}], "explain": "", "src": "국교이 3장-2(2)② · 역락 13장"}, {"id": "s55", "name": "담화의 시작·종료 점검 (도입 방식·흔한 실수)", "warn": false, "exam": "", "scope": "역락 고유", "items": ["<b>도입 방식 9가지<\/b>: 청자와의 관계 강조 / 주제 요약 제시 / 주제 관련 내용 구분 / 개념 정의 / 문제 제기(질문) / 명언·글 인용 / 일화·사건 소개 / 보조물 활용 설명 / 최근 이슈·뉴스", "<b>흔한 실수 4가지<\/b>: 자신감 없는 변명으로 시작 / 상황에 안 맞는 유머 / 주제와 무관한 장황한 내용 / 청자가 싫어하는 민감 내용을 공격적 어조로 전달", "<b>종료 단계<\/b>: 분명·명쾌·간결하게(청자 기대보다 빨리), 전체 주제·어조의 통일성 유지(진지↔농담 급전환 지양), 새로운 내용 첨가 금지, 목적별 결론(정보=핵심 재정리, 설득=신념 강화·행동 촉구, 친교·오락=즐거움·아쉬움)"], "diff": [{"b": "역", "t": "준비 단계 점검: 화자 자신(건강·심리적 안정·공신력 파악, 잘 아는 주제 선정) / 청자 / 주제(육하원칙 접근법 vs 문제 발견과 대안 탐색법) / 상황 맥락. 주제 점검의 두 접근법과 4장의 ‘도입-전개 연결 점검’(내용 연결 표현)이 함께 나옵니다."}], "explain": "", "src": "역락 4장-3"}, {"id": "s56", "name": "발표의 본질과 3P 분석·복합양식성", "warn": false, "exam": "기출: 화법의 본질(상호교섭성) · 개요서 작성 (발표)", "scope": "국교이·역락·이", "items": ["<b>발표<\/b>: 여러 사람 앞에서 사실·의견을 알리는 말하기, 연설의 일종 — 2007 개정에서 독립된 교육 담화 유형(국교이)", "<b>프레젠테이션<\/b>: 국내에서는 시청각 자료를 활용한 발표를 뜻함. 시청각 자료는 <b>보조<\/b> 자료일 뿐(자료 준비에 과도한 시간을 쓰면 오히려 부정적)", "<b>3P 분석<\/b>(이): <b>Purpose<\/b>(목적: 설명 vs 설득, 실제로는 혼재) · <b>People<\/b>(청중: 관심사·배경지식·태도·지적 수준) · <b>Place<\/b>(장소: 시설·장비 점검, 사전 답사로 불안 감소)", "<b>복합양식성(multimodality)<\/b>: ①매체 자료 자체의 복합양식성 ②<b>화면 매체 자료와 발표자<\/b>의 복합양식성이 상호작용하며 의미를 구성"], "diff": [{"b": "역", "t": "발표 3단계 구성: 도입부(화제·주제·목적·배경) → 전개부(예시를 곁들인 핵심 내용) → 정리부(핵심 강조, 당부). 도입부는 <b>개인적 관련성<\/b> 정도에 따라 다르게 구성합니다(관련성 높음: 형식적 인사 지양·목적·개관만 / 낮음: 관련성을 높이는 내용 / 배경지식이 풍부하면 <b>결론부터<\/b> 제시). 전개부는 설명형(시간·공간·비교대조·원인결과)과 설득형(문제-해결, 2~3개 대안 장단점 분석)입니다."}, {"b": "이", "t": "발표 내용 구성: 설명형(절차=시간순, 사건=인과, 개념=정의+구성요소+사례) / 설득형은 문제-해결이나 <b>동기화 단계<\/b>를 슬라이드 배열에 적용(주의끌기에는 목적진술·개관을 하지 않음). 스토리텔링 구성은 도입부의 배경+등장인물을 전체 동기화 단계에 일관되게 연결합니다."}], "explain": "<p>3P와 복합양식성은 이 책 고유 프레임입니다(‘발표 준비 시 분석해야 할 3요소’는 이 기준).<\/p>", "src": "국교이 3장-2(2)⑦ · 역락 12장 · 의사소통이론 ⅩⅡ-2"}, {"id": "s57", "name": "발표의 표현 전략 (언어적·비언어적)", "warn": false, "exam": "", "items": ["<b>언어적 표현(역락)<\/b>: ①구체성 ②간명성(단문의 유기적 연결)", "<b>객관적 언어 표현(이)<\/b>: 주관적 판단(“~라고 생각된다”, “~인 것 같다”)·극단적 과장(“완전히”, “절대로”) 지양, 구체적 수치", "<b>간명한 표현(이)<\/b>: 한 문장에 한 내용, 상투적 무의미 표현·의미 중복 제거", "<b>비언어(역락)<\/b>: 첫인상은 <b>7초<\/b>·발표 성공은 초반 2분에 결정(맥락 효과), 시선은 원고·슬라이드가 아닌 청자를 향해야 하고 손동작은 역동적이되 과하지 않게"], "diff": [{"b": "이", "t": "<b>매체 자료 설명 표현<\/b>: 매체에 제시된 정보를 일일이 <b>나열하지 않고<\/b> 정보 간 관계를 해석해 의미 있는 정보로 도출·추론해 전달합니다(예: 유소년/노인 인구 그래프에서 개별 수치 나열이 아니라 ‘역전 교차점’의 의미·원인·전망)."}, {"b": "역", "t": "‘내용 연결 표현’은 슬라이드로 분절되는 발표의 응집성을 보강합니다."}], "explain": "<p>기출 항목 ‘매체 활용(정보 선별/연결/해석)’과 직결되는 부분입니다.<\/p>", "src": "역락 12장-2 · 의사소통이론 ⅩⅡ-2"}, {"id": "s58", "name": "발표의 매체 자료 활용 (유형·기능·제작·유의점)", "warn": true, "exam": "기출 ×2 (매체 활용: 정보 선별/연결/해석)", "scope": "역락(수치) + 이(원리)", "items": ["<b>효과<\/b>: 매체 활용 시 이해도 <b>67%<\/b> vs 미활용 <b>38%<\/b>(한정선), 청중의 <b>75%<\/b>가 청각보다 시각 자극에 강하게 반응", "<b>유형<\/b>: 도표(정확한 수치) / 그래프(막대=항목 비교, 꺾은선=시간 추이, 원=비중, 방사형=세부항목 차이) / 순서도(절차) / 그림·사진(감성) / 소리·영상 / 모형·실물", "<b>구성(역락)<\/b>: 압축된 핵심 문장, <b>슬라이드 1분당 2장<\/b>(15분이면 30개 이내), 슬라이드당 요점 <b>7개 이하<\/b>", "<b>오남용 3위험<\/b>(Sprague &amp; Stuart): ①발표자 위상 격하 ②생각 흐름 방해 ③준비 시간 과다 소모"], "diff": [{"b": "이", "t": "<b>매체 자료의 3대 기능<\/b>: ①대상의 논리 구조 표상(다이어그램·도해조직자) ②대상의 상태·정도 표상(위치·색 진하기·점선으로 확정/추정 표현) ③<b>행동유도성(affordance) 시각화<\/b>(Knaflic: 초범주로 시선 집중, 핵심 메시지를 능동적으로 전달하는 그래프 선택). <b>제작<\/b>: 헤드라인을 <b>완결된 문장<\/b>으로 먼저 작성 / 배경-글자 대비, 적색-청색·적색-녹색 인접 금지, 글자는 배경보다 <b>따뜻한 계열<\/b>(왜곡된 입체시 효과로 돌출), 진한 파란색 텍스트 지양 / 글자체 일관, 강조는 글자체 변경보다 <b>색상 변경<\/b>이 효과적. <b>유의<\/b>: 매체가 발표자의 주체성을 압도하지 않게 발화 뒤에 매체가 따라 나오게, 주제와 무관한 자극적 자료 지양."}], "explain": "<p>통합인덱스: 역락의 수치 기준 + 이 책의 원리(행동유도성·색채심리)를 결합해 학습하세요. 작문의 ‘복합양식 텍스트/행동유도성’ 카드와 같은 개념입니다.<\/p>", "src": "역락 12장-3 · 의사소통이론 ⅩⅡ-2-3"}, {"id": "s59", "name": "청중과의 상호작용·질의응답", "warn": false, "exam": "", "scope": "역락·이", "items": ["<b>흥미 유발<\/b>은 본론 내용과의 부합성이 중요", "<b>청중 유형별 대처(역)<\/b>: 발표자보다 많이 아는 청중 → 참여 유도 / 의욕 없는 청중 → 관심 직결 질문·놀라운 사실 / 비우호적 청중 → 감사 표현 + 공통점 만들기 + 적절한 비언어", "<b>질의응답(역)<\/b>: ①본궤도 조정 ②직접적·명료한 답변 ③모르면 솔직히 인정 ④좋지 않은 질문도 긍정 전환"], "diff": [{"b": "이", "t": "청중의 실시간 반응(지루함·호기심) 관찰·대응은 초보 발표자가 취약한 영역입니다(김태경 2013). 질의응답 시간을 확보하고(예: 30분 중 20분 발표 + 10분 질의) 답변 전략은 ①논점을 벗어난 질문도 일단 존중 ②무례한 질문은 부분 인정 + 관점 강조 ③모르는 질문은 솔직히 인정하고 추후 답변을 약속하거나 청중과 협력하는 것입니다. 청중의 역할: 적극적 듣기, 메모, 보편적으로 유용한 질문(과시성 질문 지양)."}], "explain": "", "src": "역락 12장-4 · 의사소통이론 ⅩⅡ-2-5"}, {"id": "s60", "name": "스토리텔링 교육", "warn": false, "exam": "", "scope": "역락 고유", "items": ["<b>스토리텔링<\/b>: 화자가 구체적 상황에서 특정 대상에게 이야기를 구어로 실현하는 행위 — 이야기 방식은 의도 전달과 이해가 효과적, 상대를 움직이는 최선의 방법은 ‘진솔한 이야기’", "<b>6가지 이야기 유형<\/b>: ①‘나는 누구인가’(정체성·신뢰) ②‘나는 왜 여기 있는가’(동기·목표) ③‘나의 비전은 무엇인가’ ④감동적인 교훈 ⑤실천할 수 있는 가치 ⑥‘당신의 마음을 읽고 있다’(상대 반박을 예견해 무장해제)", "<b>유의<\/b>: 상황·청중 파악, 미리 요약, 설명을 길게 안 하기, <b>화자가 먼저 웃거나 울지 않기<\/b>"], "diff": [{"b": "역", "t": "뛰어난 이야기꾼의 조건은 분위기 만들기·타이밍·진실에 감정 싣기·반대에서 출발하기이며, 윤리적으로 약자·타인의 실수를 희화화하지 말고 자신의 실수는 거리낌 없이 다룹니다. 학교에서는 문학교육과 통합해, 이야기 다시 말하기를 새로운 이야기의 창조 활동으로 봅니다(패러디 효과적). 놀이·게임의 공유 경험이 <b>구술력(oracy)<\/b> 발달에 기여합니다."}], "explain": "<p>통합인덱스: 기출 빈도는 낮으나 발표·연설 도입부 전략과 연계해 사례 판별형으로 응용될 수 있습니다.<\/p>", "src": "역락 14장"}]}, {"title": "G. 논증 (이성적 설득)", "cards": [{"id": "s61", "name": "논증의 개념·조건·5요소", "warn": true, "exam": "독서 기출(논증 구성 요소)과 직접 연계", "scope": "의사소통이론 고유", "items": ["<b>논증<\/b>: 주장이 정당함을 이유와 근거를 들어 입증하는 방식 — 이유·근거 없는 주장은 <b>단언(assertion)<\/b>", "<b>4조건<\/b>: ①주장이 명확(논쟁의 여지) ②주장-이유-근거가 연관 ③근거가 충분·객관 ④예상 반론을 충분히 고려", "<b>5요소<\/b>: <b>주장 · 이유 · 근거 · 예상 반론 · 반박<\/b>", "이유 = 주장을 뒷받침하려고 <b>내적으로 생각해낸<\/b> 진술(주관적) / 근거 = 이유를 뒷받침하는 <b>객관적<\/b> 정보·자료(대표성·명확한 출처·신뢰할 만한 생성 과정)"], "diff": [{"b": "이", "t": "형식 예: 주장(“~해야 합니다”) / 이유(“왜냐하면 ~이기 때문입니다”) / 근거(“통계에 의하면 ~”) / 예상 반론(“물론 ~한 면이 있습니다”) / 반박(“하지만 그것은 ~”). 반박은 반론을 제기한 <b>사람이 아니라 반론 자체<\/b>를 대상으로 해야 합니다. 이유는 ‘왜?’에 대한 답, 근거는 외부에서 가져와 보고한 것이라 보고에 주관성이 개입할 여지에 유의합니다."}, {"b": "역", "t": "작문 영역의 ‘논증의 5구성요소’(주장·이유·근거·전제·반론과 대응)와 구성이 다르니 비교해 보세요(작문 카드)."}], "explain": "<p>통합인덱스: 국교이·역락 화법에는 논증 이론이 없고 이 책만 다룹니다. 독서 ‘논증 분석’과 통합 학습이 가능한 지점입니다.<\/p>", "src": "의사소통이론 Ⅸ-1"}, {"id": "s62", "name": "근거의 종류와 통계의 오용", "warn": false, "exam": "", "scope": "의사소통이론 고유", "items": ["<b>사실·사건<\/b>: 주관적 해석(의견)과 혼동 금지, 판단 기준 명확", "<b>증언<\/b>: 전문가 증언(2차 인용 여부·해당 분야 전문가인지 확인, 아니면 <b>권위에 호소하는 오류<\/b>) / 당사자 경험 증언(기억 왜곡 유의) / 일반인 여론", "<b>통계 수치<\/b>: 최신 자료 사용, <b>평균의 신화<\/b>(평균이 현실을 은폐: 강의 평균 수심 1m) / <b>비교할 수 없는 퍼센트<\/b>(모수가 다른데 퍼센트만 단순 비교)"], "diff": [{"b": "이", "t": "개인적 관련성이 높은 사안에서는 통계보다 신뢰하는 사람의 <b>경험 증언<\/b>이 더 설득력을 가질 수 있습니다(아토피 아기 엄마에게 신문기사의 70% 효과율보다 친구의 경험담, Hamilton 1996). 청중의 경험과 결부하면(“여러분도 경험해보셨겠지만”) 더 효과적입니다(임태섭 1997). 상대의 저항이 강할수록 근거는 양적으로 충분하고 구체적이어야 합니다."}], "explain": "", "src": "의사소통이론 Ⅸ-1-3"}, {"id": "s63", "name": "Toulmin의 논증 모형 (6요소)", "warn": true, "exam": "", "scope": "의사소통이론 고유", "items": ["실용적 논증을 추구한 모형(『논증의 사용』 1958) — <b>근거 → 주장<\/b> 방향 (사례: “해리는 버뮤다에서 태어났다”(근거) → “그러므로 영국 국민이다”(주장))", "<b>기본 요소<\/b>: <b>주장<\/b>(결론) · <b>근거(data)<\/b> · <b>보장(warrant)<\/b>(근거→주장의 연결고리)", "<b>부가 요소<\/b>: <b>보강(backing)<\/b>(보장의 가정을 확인해 주는 원리·법칙·법률) · <b>반박(rebuttal)<\/b>(주장의 예외·한계) · <b>한정어(qualifier)<\/b>(“아마도”, “주된 원인”, 확실성·강도)", "Toulmin은 근거의 보강보다 <b>보장의 연결 강도<\/b>가 논증의 핵심이라고 봄"], "diff": [{"b": "이", "t": "장점: 서로 다른 유형의 논증을 분석하는 표준틀을 주고, 상대의 가설적 보장에 입증 자료(보강)를 요구할 수 있어 반박에 유용합니다. <b>한계<\/b>: ①보장을 명시하지 않으면 근거와 구분이 어려움 ②<b>문장 단위에만 적용<\/b>되어 여러 문단의 텍스트(사설 등)에는 무리(Brinker). 새 논증을 생성하기보다 <b>기존 논증을 비교·분석하는 틀<\/b>로 쓰기에 적합합니다."}, {"b": "역", "t": "작문 영역의 ‘수사학과 작문 이론’ 카드에서 Toulmin(1958)을 신수사학의 비형식 논리로 언급합니다."}], "explain": "<p>요소 이름과 기능(보강=보장의 근거, 반박=예외, 한정어=강도)을 짝지어 외우세요.<\/p>", "src": "의사소통이론 Ⅸ-1-4"}, {"id": "s64", "name": "4대 논증 방식과 오류 (연역·귀납·인과·유추)", "warn": true, "exam": "", "scope": "의사소통이론 고유", "items": ["<b>연역<\/b>: 일반 원칙 → 특정 사례(삼단논법), 반대하는 청중과 공동의 기반 확립에 유용 → 오류: <b>우연의 오류(원칙 혼동)<\/b> — 예외를 무시하고 원칙 고수 (“거짓말은 옳지 않다 → 의사의 선의의 거짓말도 죄악”)", "<b>귀납<\/b>: 구체적 사례들 → 일반적 사실(예외 가능성으로 완벽한 증명 어려움) → 오류: <b>성급한 일반화<\/b> — 표본 불충분·대표성 결여", "<b>인과<\/b>: 원인=근거, 결과=주장 → 오류: <b>거짓 원인(오비이락)<\/b> — 동시/순차 발생을 인과로 오판, 원인이 하나뿐이라고 단정", "<b>유추<\/b>: 유사한 속성을 근거로 적용 → 오류: 차이점이 더 많거나 유사점이 <b>비본질적<\/b> (“교복 색깔이 비슷하니 품성도 비슷할 것”)"], "diff": [{"b": "이", "t": "관련 점검 질문: 연역은 일반 원칙이 통념이 아니라 입증된 사실인가, 이 사례에 적용할 수 있는가, 예외를 고려했는가 / 귀납은 주장과 근거가 연관되는가 / 인과는 원인·결과를 구분할 수 있는가, 원인이 결과를 유발할 만큼 강력한가 / 유추는 차이점보다 유사점이 많은가, 본질적인가. <b>비유적 유추<\/b>(“대통령은 배의 선장”)는 일반 소통에는 효과적이나 사실성을 전제하는 법정 등에서는 쓸 수 없습니다. 사례: 총기 규제 논제에서 찬성은 영국·일본, 반대는 스위스를 유추 사례로 듭니다."}], "explain": "<p>독서 ‘논증 분석: 논증 구성 요소, 유추 등 논증 방법’ 기출과 직접 연계됩니다(통합인덱스).<\/p>", "src": "의사소통이론 Ⅸ-2"}, {"id": "s65", "name": "기타 논증 오류", "warn": false, "exam": "", "scope": "의사소통이론 고유", "items": ["<b>무지의 오류<\/b>: 거짓/참이 입증되지 않았음을 근거로 반대로 추론 (“UFO가 없다는 게 입증 안 됐으니 존재한다”) — <b>입증 책임<\/b>과 관련", "<b>논점 일탈의 오류<\/b>: 핵심을 논증하지 않고 무관한 문제를 다룸 (무자각적이거나 불리할 때의 의도적 회피)", "<b>순환 논증<\/b>: 이유·근거가 주장을 다른 말로 바꾼 것에 불과(동어반복)", "<b>흑백 사고<\/b>: 중간 개념을 인정하지 않고 양극단만 가능하다고 판단 (“민주주의자가 아니면 공산주의자다”)", "<b>복합 질문<\/b>: 두 질문을 하나로 묶어 답을 요구 (“회사 자금을 도박으로 탕진한 게 사실입니까?”)"], "diff": [{"b": "이", "t": "의료사고에서 “실수했다는 증거가 없으니 잘못이 아니다”와 “실수 안 했다는 증거가 없으니 잘못이다”는 모두 무지의 오류입니다. 순환 논증 사례: “표현의 자유가 국가에 유익하다, 왜냐하면 개인의 표현이 공동체 이익을 증진하기 때문.”"}], "explain": "<p>반대신문의 ‘복합 질문’·‘논점 일탈’ 지적과 연결해 보세요.<\/p>", "src": "의사소통이론 Ⅸ-2-5"}]}, {"title": "H. 토론", "cards": [{"id": "s66", "name": "토론의 개념·목적과 토의와의 구분", "warn": true, "exam": "기출 최빈출 영역 ×6 (토론)", "scope": "역락 비교표 기준", "items": ["토론 = 논제에 대해 찬성/반대 측이 근거를 들어 자신의 주장을 내세우고 상대의 부당함을 밝히는 화법 — 어원 debate = de(나누다) + battuere(겨루다) = <b>나누어 겨룸<\/b>", "토의와의 차이는 <b>대립성<\/b>: 토의는 결론 도출을 위한 협동, 토론은 이미 나뉜 두 입장 중 어느 쪽이 옳은지 가림", "<b>박경현(2001) 비교표<\/b>: 목적(협력해 해답을 얻음 vs 이미 가진 해답을 납득시킴) / 사고 유형(집단 사고 vs 의견 대립을 전제한 변증법적 사고) / 진행 방식(자유로운 논의 vs 규칙에 따른 논쟁) / 융통성(융통을 트지 않으면 진정한 합의가 어려움 vs 오직 사실과 논리로만 통함)", "목적은 승패 결정만이 아니라 <b>상호 이해의 폭 확장과 공감대 확보<\/b>"], "diff": [{"b": "역", "t": "토의-토론 비교표(목적/사고 유형/진행 방식/융통성)를 정식 제시하는 것이 특징입니다. 토론 구성원은 사회자·토론자·판정단·청중입니다."}, {"b": "이", "t": "‘토의=결론 도출 여부’로 단순 설명하고 박경현 표는 없습니다. 토론의 목적은 상대를 제압하는 것이 아니라 공동체의 문제와 해결방안을 찬반으로 나누어 면밀히 검토하는 것이며, 판정은 제3자가 규칙에 따라 내립니다. 발언은 <b>찬성 측이 먼저 시작하고 마지막도 찬성 측<\/b>(첫 발언의 불리함 상쇄)입니다."}, {"b": "국", "t": "토론을 경쟁적 의사소통으로 정의하고 토론 단계별 필요 기능(준비-토론-판정)을 표로 제시합니다(전은주 2004)."}], "explain": "<p>통합인덱스: 개념 변별 문제는 역락 비교표 기준이 가장 체계적입니다. 토의 쪽 카드도 함께 보세요.<\/p>", "src": "역락 10장-1 · 의사소통이론 Ⅹ-1 · 국교이 3장-2(2)③"}, {"id": "s67", "name": "토론의 논제 (유형·진술·표현·용어)", "warn": true, "exam": "기출: 쟁점 분석(필수 쟁점) 연계", "scope": "역락·이 공통 (이가 사례 풍부)", "items": ["<b>논제 유형<\/b>: 사실 논제(참/거짓) / 가치 논제(옳고 그름, 사실에 입각해야 함) / <b>정책 논제<\/b>(“~해야 한다”, 교육 토론에서 가장 많이 씀) — 가치 논제는 주로 링컨 더글러스, 정책 논제는 CEDA", "<b>진술<\/b>: 개방형 질문이 아니라 <b>진술문<\/b>(“~해야 한다”/“~이다”), <b>단 하나의 쟁점<\/b>, 현재 상태를 <b>바꾸는 방향<\/b>으로 진술 (반대로 진술하면 찬반 역할이 뒤바뀜)", "<b>표현<\/b>: 감정적·편향적 표현 배제(중립적 단어) — “백해무익한 흡연”, “반인륜적 사형제도”는 반대측에 불리", "<b>용어<\/b>: 핵심 용어는 <b>찬성 측이 입론에서 정의<\/b>, 반대 측은 필요 시 <b>대체 정의<\/b>로 유리하게 유도"], "diff": [{"b": "이", "t": "대체 정의 사례: ‘남교사 할당제’(반대 측 유리 어감) vs ‘양성평등 임용제’(찬성 측 유리 어감), 임신중절/낙태, 기여입학제/기부금입학제. 정의 방법은 사전적·사례·권위 인용·조작적 정의이며, 가치가 내포된 정책 논제에서는 용어 정의가 해결방안이나 실효성보다 중요할 수 있습니다. 논제는 대부분 사전 공개되나 <b>의회식 토론만 대회 직전<\/b> 공개(15분 준비)합니다."}, {"b": "역", "t": "논제 성격 5가지: 입증 책임 원리 / 개방형 질문 금지·진술문 / 현상 변화 방향 진술 / 감정 표현 금지 / 정책·가치·사실 유형. 논제는 학생 관련도가 높을수록 비판적 청취와 적극적 주장을 촉진합니다."}, {"b": "국", "t": "논제에 따라 논의해야 할 <b>필수 쟁점<\/b>이 다르다고만 서술합니다."}], "explain": "<p>통합인덱스: 대체 정의 사례는 이 책이 가장 풍부해 사례 판별형에 활용도가 높습니다.<\/p>", "src": "역락 10장-2 · 의사소통이론 Ⅹ-1-3 · 국교이 3장"}, {"id": "s68", "name": "토론 유형 5종 (CEDA·칼 포퍼·의회식·링컨 더글러스·퍼블릭 포럼)", "warn": true, "exam": "기출 최빈출 ×6 (직파식 토론 등 토론 형식)", "scope": "의사소통이론이 압도적", "items": ["<b>CEDA(반대신문식/정책 토론)<\/b>: 2:2, 입론(8분)·반대신문(3분)·반박(5분) 개인별 1회 — 반박은 좁은 의미의 반론이 아니라 <b>최종 발언<\/b>, 반대신문이 활성화됨", "<b>칼 포퍼식<\/b>: 비판적 합리주의(1994 설립), 3인 1팀, 찬반 <b>입증 책임이 균등<\/b>(반박하지 않으면 인정으로 간주), 입론 1회(6분) + 반대신문 2회 + 반박 2회(반박 시간에도 반대신문 허용)", "<b>의회식<\/b>: 정책 논제, <b>논제가 직전 공개<\/b>(15분 준비), 발언권 요청 “On that point!”, 입론의 첫·마지막 1분은 <b>보호시간(protected time)<\/b>", "<b>링컨 더글러스(LD)<\/b>: 1:1 토론, <b>주로 가치 논제<\/b>(“자유가 평등보다 가치 있다”), 반대신문 비중 높고 반대측 반박이 1회 적음", "<b>퍼블릭 포럼<\/b>: 2002년 시작, 동전 던지기로 입장·순서 결정, 반대신문을 <b>crossfire<\/b>(양측 모두 발언권)로 부르며 마지막 <b>grand crossfire<\/b>에 4명 전원 참여, 일반인 설득력 중시"], "diff": [{"b": "이", "t": "논제 변경 주기: CEDA 1년 / 링컨 더글러스 2달 / 퍼블릭 포럼 1달 / 의회식 매회. 입증 책임: LD는 원칙 미적용, CEDA는 찬성에 온전히 부과, 칼 포퍼는 균등입니다."}, {"b": "역", "t": "반대신문식 토론(CEDA)의 12단계를 도식화하고 나머지는 간략히 소개합니다(‘반대신문식 토론 12단계’ 카드)."}, {"b": "국", "t": "고전적(표준) 토론, 반대신문식(CEDA·정책), 칼 포퍼식, 의회식, 링컨-더글라스식, 공적 포럼 토론을 <b>나열<\/b>하는 수준입니다."}], "explain": "<p>통합인덱스: 유형별 세부 절차·시간은 이 책 우선, 역락은 CEDA 도식이 보조 자료로 유용합니다. CEDA vs 칼 포퍼의 입증 책임 차이가 핵심 변별점입니다.<\/p>", "src": "의사소통이론 Ⅹ-1-5 · 역락 10장-1 · 국교이 3장"}, {"id": "s69", "name": "반대신문식 토론의 절차 (12단계)", "warn": true, "exam": "기출 ×6 (반대신문/교차질문)", "scope": "역락 고유 (도식)", "items": ["각 팀 2인, 개인당 <b>입론·반대신문·반박<\/b> 3회 발언, 숙의 시간 사용 가능", "<b>순서<\/b>: 찬성1 입론 → 반대2 반대신문 → 반대1 입론 → 찬성2 반대신문 → 찬성2 입론 → 반대1 반대신문 → 반대2 입론 → 찬성1 반대신문 → 반대2 반박 → 찬성1 반박 → 반대1 반박 → 찬성2 반박", "<b>찬성이 시작하고 마무리<\/b> — 첫 발언의 불리함을 상쇄", "단계별 발언 성격: 입론=주장 제시 / 반대신문=오류 지적 / 반박=유리한 쟁점 선택"], "diff": [{"b": "역", "t": "이두원(2006) 비유: 입론=아성 쌓기, 반대신문=치열한 공방전, 반박=최후의 폭격. 관련 성취기준 [6국01-07], [9국01-08], [10공국1-01-02], [12화언01-12]입니다."}], "explain": "<p>통합인덱스: 이 12단계 순서는 역락 기준으로 학습하세요.<\/p>", "src": "역락 10장-1"}, {"id": "s70", "name": "입증 책임 (the burden of proof)", "warn": true, "exam": "기출 ×6 (입증 책임)", "scope": "역락·이 공통 (이가 유형별 대비)", "items": ["<b>입증 책임<\/b>: 주장이 수용되도록 증명해야 하는 책임 — “주장하는 자는 증명해야 한다”(법률 용어에서 유래, 형사=검사·민사=원고)", "토론에서는 <b>찬성 측(현상 변화를 주장)<\/b>이 입증 책임을 짐 (무죄추정 원칙과 유사)", "<b>반박 책임<\/b>은 반대 측 — 전체가 아닌 <b>일부만 논파<\/b>해도 효과적", "기능: 문제 해결방안이 충분한지, 예상 못한 비용·부작용은 없는지 꼼꼼히 검토하게 하는 토론의 기초 원리"], "diff": [{"b": "이", "t": "<b>유형별 균형성<\/b>: 링컨 더글러스(가치가 동등하다고 보아 원칙 미적용) / <b>CEDA<\/b>(찬성에 온전히 부과, <b>선결요건 prima facie<\/b> — 첫 입론에서 필수 쟁점을 완벽히 다뤄야 함) / <b>칼 포퍼식<\/b>(양측 균등, 반박하지 않으면 인정으로 간주). 무지의 오류(입증 안 됐다고 반대를 추론)와 연결됩니다."}, {"b": "역", "t": "첫 입론에서 반드시 다루어야 할 쟁점이 필수 쟁점(stock issue)이라고 연결합니다."}, {"b": "국", "t": "입증 책임에 대한 언급이 없습니다(토론 규칙 소개 수준)."}], "explain": "<p>통합인덱스: ‘왜 CEDA와 칼 포퍼식의 전략이 다른가’는 이 책 참고가 필수입니다.<\/p>", "src": "역락 10장-2 · 의사소통이론 Ⅹ-2-1"}, {"id": "s71", "name": "필수 쟁점과 입론 모형 (필요-방안 vs 비교우위)", "warn": true, "exam": "기출 ×6 (쟁점 분석: 비교우위/필수 쟁점)", "scope": "역락(3단계) · 이(표·모형)", "items": ["<b>필수 쟁점(stock issue)<\/b>: <b>문제 → 해결 방안 → 이익/비용<\/b>의 3단계 구조", "찬성 입증 vs 반대 반박: 문제 쟁점(심각·중대·시급 vs 심각하지 않다) / 해결방안 쟁점(해결·실행 가능 vs 보장 없다·불가능) / 이익·비용 쟁점(이익 &gt; 비용 vs 비용 &gt; 이익)", "<b>필요-방안 모형<\/b>: 문제 → 원인(내재성) → 해결방안 → 이익/비용", "<b>비교우위 모형<\/b>: 방안 → 이익1·2·3 (각각 문제-원인-해결 구조 반복) — 기존 정책 대비 <b>상대적 이익<\/b> 강조"], "diff": [{"b": "이", "t": "<b>논제 유형별 선택 기준<\/b>(박재현 2014): 비교할 정책이 없는 <b>도입형·폐지형<\/b> → 필요-방안 모형 / 비교할 정책이 있는 <b>조정형·대체형<\/b> → 비교우위 모형. 문제 쟁점에서는 용어 정의, 심각성 입증, 문제가 자연 해결되지 않고 지속됨을 보이는 <b>내재성<\/b>이 중요하고, 찬성 측은 첫 입론에서 비용을 구체적으로 언급하면 반론 여지를 주므로 반대 측이 문제 제기할 때 역공하는 전략이 유용합니다. 비교우위 모형은 정책이 이미 수립된 경우가 많아진 현대에 등장했습니다."}, {"b": "역", "t": "입증 책임과 필수 쟁점의 관계, 정책 논제의 문제-해결방안-이익/비용 3단계 거시구조를 간결히 제시합니다."}], "explain": "<p>통합인덱스: ‘비교우위’라는 기출 키워드는 이 책의 비교우위 모형을 직접 겨냥할 가능성이 높습니다.<\/p>", "src": "역락 10장-2 · 의사소통이론 Ⅹ-2-2·3"}, {"id": "s72", "name": "반대 신문 (내용 3단계·질문·답변 전략)", "warn": true, "exam": "기출 ×6 (반대신문/교차질문)", "scope": "역락·이", "items": ["<b>반대 신문 내용 3단계<\/b>(이): ①내용 <b>확인<\/b>(확인 질문) → ②오류 지적(<b>검증 질문<\/b>: 신뢰성·타당성·공정성) → ③<b>인정 요구<\/b>", "<b>질문 전략<\/b>: 우선순위 안배, <b>허약한 부분<\/b> 공략(강한 부분 공략은 상대를 견고하게 함), 예견 가능한 계산된 질문, 간결한 <b>폐쇄형 질문<\/b>, 답변이 길어지면 단호히 중단, 새 논증 금지", "<b>답변 전략<\/b>: 의도·함정 파악, 오류는 즉시 시인, 모르면 솔직히 인정, 시간 끌기 지양, 역질문은 신중히, 감정 조절", "<b>태도<\/b>: 인신공격 금지(상대의 <b>주장<\/b>이 대상), 예의 유지"], "diff": [{"b": "이", "t": "확인 질문–검증 질문의 <b>연쇄 구조<\/b>(박재현 2017)로 진행합니다. 교육적 가치: 질문자는 듣기 능력 극대화, 답변자는 논증 능력 강화, 질문 형식으로 검증하는 상대 존중 태도(소크라테스 문답법·헤겔 변증법과 유사). 반대신문은 1926년 Stanley Gray의 오레곤 형식에서 유래하며 의회식은 대신 발언권 요청을 씁니다."}, {"b": "역", "t": "반대 신문 단계는 상대 입론의 신뢰성·타당성·공정성을 판단해 오류를 부각하며, 전략적 기능으로 개념정의 재정의와 자료 출처 오류 부각을 듭니다. 질문 전략은 전제·권위·사실·인용의 허점 지적입니다."}], "explain": "<p>통합인덱스: 서술형(“반대신문의 기능을 단계별로 설명하시오”)은 이 책의 3단계 구조로 답안을 구성하세요. 검증 기준은 ‘비판적 듣기’와 같은 세 기준입니다.<\/p>", "src": "역락 10장-3 · 의사소통이론 Ⅹ-2-4"}, {"id": "s73", "name": "토론 단계별 전략 (입론·반박, 개념 정의)", "warn": false, "exam": "기출 ×6 (찬성/반대 입론 및 반박)", "scope": "역락 고유", "items": ["<b>찬성 입론<\/b>: ①개념 정의 ②문제 쟁점(중요성·심각성·즉시성·지속성) ③해결방안 쟁점(실행 가능성, <b>양면 메시지 전략<\/b>) ④이익/비용 쟁점", "<b>반대 입론<\/b>: ①개념 정의(<b>대체 정의<\/b>로 유리하게 유도) ②문제제기 쟁점(반론+근거) ③해결방안 쟁점(실행상 어려움 강조) ④이익/비용 쟁점(부작용 강조)", "<b>반박 단계<\/b>: 최종 발언 — 유리한 쟁점을 선별, <b>비교 우위 쟁점<\/b>의 선택과 공략이 핵심, 원칙적으로 <b>새로운 주장 금지<\/b>"], "diff": [{"b": "국", "t": "토론 단계별 필요 기능(전은주 2004): 준비 단계(논제 정하기·주장 정하기·논거 마련하기·반박 논거 마련하기) / 토론 단계(입론·반대신문·변론 ← 입론·변론 구축, 논박, 오류 분석, 분석적/비판적 듣기) / 판정 단계(판정·평가 ← 평가 항목과 기준). 반복 수행만으로는 길러지지 않고 <b>방법에 대한 이해 → 적용 → 반복<\/b>이 필요합니다."}], "explain": "", "src": "역락 10장-3 · 국교이 3장"}]}, {"title": "I. 토의·회의", "cards": [{"id": "s74", "name": "토의의 개념과 4대 유형 (변별)", "warn": true, "exam": "기출 ×2 (심포지엄: 사회자 역할, 타당성 판단)", "scope": "역락 7기준 표 기준", "items": ["<b>패널 토의(배심토의)<\/b>: 입장이 다른 대표자(4~8명)가 청중 앞에서 상호 직접 토의 — <b>이견 조정<\/b>, 청중은 소극적", "<b>심포지엄<\/b>: 3~5명 발표자가 사전 배당된 주제를 강연식 발표 후 청중 질의응답 — <b>여러 각도의 의견 발표<\/b>·문제 이해가 목적(찬반·결론 없음), 청중 가장 소극적, 발표 시간 고정 + 자료집", "<b>포럼<\/b>: 원래 재판·공적 문제 공개 토의 장소 — <b>처음부터 청중이 참여<\/b>하는 유일한 유형(‘시민의 광장’), 정책·개발안 의사결정", "<b>회의<\/b>(일반): 두 사람 이상이 협의해 의제 채택·결정 — 토의의 가장 흔한 형태 / <b>원탁 토의<\/b>(이): 지위 무관 대등하게 순서 없이 자유롭게, 특별한 사회자 없음"], "diff": [{"b": "역", "t": "4대 유형(패널토의/심포지엄/포럼/회의)을 주제 성격·발언권자·진행 방식·목적·사회자 역할·청중 역할의 <b>7기준 변별표<\/b>로 상세 대비합니다(패널=시사문제·이견조정·청중 소극적 / 심포지엄=학술 담론·문제 이해·가장 소극적 / 포럼=정책·개발안·의사결정·매우 적극적 / 회의=복지·규칙·친목·해결안 채택·적극적)."}, {"b": "이", "t": "4대 유형을 심포지엄/패널/포럼/<b>원탁<\/b>으로 잡고 <b>청중 참여 시점<\/b>을 변별 기준으로 명확히 서술합니다(포럼만 초반부터). 심포지엄은 전문 식견 발표·공유, 사회자는 요약·의의 설명·질의응답 진행, 패널은 사회자가 논의 맥을 파악해 흐름 조절·논점 일탈 조정·발언 시간 공평 배분."}, {"b": "국", "t": "문제해결식·포럼·원탁·패널·심포지엄·분임·세미나(질의식 토의)를 나열합니다(원문 설명에는 ‘6유형’이라 적혔으나 실제 항목은 7개입니다)."}], "explain": "<p>통합인덱스: 심포지엄과 포럼의 <b>청중 참여 시점 차이<\/b>가 혼동 포인트로 우선순위가 높습니다. ⚠️ 역락은 회의를 4유형에 넣고 이는 원탁을 넣어 4번째 유형이 다릅니다.<\/p>", "src": "역락 9장-2 · 의사소통이론 ⅩⅠ-1 · 국교이 3장"}, {"id": "s75", "name": "토의의 절차 (역락 5단계 vs 이 4기능)", "warn": true, "exam": "기출: 토의 ‘최선의 해결안 도출 단계’ (근거 누락·검토 오류) ×2", "items": ["<b>역락 5단계<\/b>: ①토의 문제 제시 → ②문제 분석 → ③해결안 제시(근거·이유 갖춘 구체안) → ④<b>최선의 해결안 선택<\/b>(장단점·실현 가능성 검토) → ⑤실행 방안 모색 = <b>반성적 사고하기<\/b>", "<b>의사소통이론 4대 기능<\/b>(Gouran &amp; Hirokawa 1983): 문제 분석 → 목표 설정 → 대안 탐색 → 장단점 평가 (Dewey 1910 반성적 사고 반영)", "국교이는 절차 자체보다 사회자·참여자의 표현 기법(통제·의견 표현·비판 기법) 중심"], "diff": [{"b": "이", "t": "① 문제 분석의 오류는 대안 선택 오류로 이어집니다 ② 목표 설정 시 평가 기준(실효성·실현 가능성·예상 부작용 등 + 규정·예산·인력)을 함께 고려 ③ 대안 탐색은 <b>브레인스토밍으로 최대한 도출<\/b>하고 즉시 평가·기각하지 않음 ④ 대안 × 평가 기준의 <b>매트릭스<\/b>로 체계 평가 — 자기 대안의 장점만 주장하기보다 다른 대안도 다각도로 평가하는 것이 집단지성을 발휘합니다. 네 기능은 조화를 이루어야 하며 어느 하나가 본질적으로 더 중심적이지 않습니다."}, {"b": "역", "t": "토의 문제 서술 원칙: 단어 형태(‘환경 문제’)와 결론 기정형(‘~해야 한다’)을 금지하고 <b>해결 과제를 내포한 의문형<\/b>으로 서술합니다. ‘예/아니요’로만 답이 나오는 것은 토론의 문제입니다. 조사 연구는 참가자뿐 아니라 청중도 사전에 해야 합니다."}, {"b": "국", "t": "토의 단계별 필요 기능(준비-시작-중간-끝)을 표로 제시하고 비판 기법(부분적·구체적 비판, 장점 언급 후 단점 지적, 개선 방안 제시)을 정리합니다."}], "explain": "<p>⚠️ 통합인덱스: 두 책의 단계 수와 명칭이 다릅니다. 기출 요소 ‘근거 누락/검토 오류’를 보면 <b>해결안 제시·선택 단계<\/b>의 요건이 자주 겨냥됩니다.<\/p>", "src": "역락 9장-2 · 의사소통이론 ⅩⅠ-1-3 · 국교이 3장"}, {"id": "s76", "name": "토의 사회자·참여자의 역할", "warn": false, "exam": "기출 ×2 (사회자 역할)", "items": ["<b>사회자 3대 임무(역락)<\/b>: 계획·준비 / <b>실제적 진행<\/b>(핵심) / 정리·보고", "진행 임무는 <b>문제 해결 임무<\/b>(문제 규정·순서 제시·요약 종합)와 <b>분위기 조성·유지 임무<\/b>(발언 기회 균등 배분·갈등 조정)의 균형 — 전자에만 치중하면 <b>독재적·권위적 사회자<\/b>", "<b>참여자<\/b>: 사전 지식·해결방안 준비, 적극적·협동적 참여, 절차 준수, 경청 — 핵심 자질은 <b>훌륭한 듣는 이<\/b>"], "diff": [{"b": "국", "t": "사회자 역할: 발언 편중자 통제, 침묵자 유도, 갈등 참여자 중재, 의견 명료화 요청(통제 기법 예시 대화문 포함). 의견 표현 기법은 “저는 ~라고 생각합니다. 왜냐하면 ~기 때문입니다”입니다."}, {"b": "이", "t": "사회자: 목표·주제 명확화, 규칙 준수 점검·제재(인신공격·끼어들기), 발언 기회 공평 배분, 의견 수렴·매듭짓기. 참여자는 간결·명료한 발언, 개방적 태도(자기 오류 인정), 대안 결정 후 <b>승복·존중<\/b>을 요구받습니다."}], "explain": "", "src": "역락 9장-3 · 의사소통이론 ⅩⅠ-1-2 · 국교이 3장"}, {"id": "s77", "name": "토의의 소통 방법 (Mercer 3유형·협력적 의사소통 행위)", "warn": false, "exam": "", "scope": "의사소통이론 고유", "items": ["<b>Mercer(1995) 3대 대화 유형<\/b>: <b>논쟁 대화<\/b>(건설적 비판 없이 의견 충돌 반복) / <b>누적 대화<\/b>(무비판적으로 정보만 누적) / <b>탐구 대화<\/b>(건설적 의견 제시 + 비판적 검증, 가장 바람직)", "<b>협력적 의사소통 행위<\/b>(박재현 외 2019): ①<b>의견 구성하기<\/b>(제시 → 연계 → 통합) ②<b>의견 공유하기<\/b>(상대 이해 확인 + 자기 이해 점검) ③<b>의견 검증하기<\/b>(검증 질문 → 응대 → 논박 → 자기 의견 수정)", "<b>문제 상황 대처<\/b>: 대립(일치·불일치 지점 확인 → 일치 지점 동의 표현 → 상대 관점 수용) / 답보(논의 전개 촉구, 소강 시 새 관점 제시) / 일탈(논의 복귀 유도, 비협조에게 참여 요구)"], "diff": [{"b": "이", "t": "의견 검증하기의 목표는 시비를 가리는 것이 아니라 <b>의견 조율<\/b>이며, 정당하면 자기 관점을 수정하는 열린 태도가 필요합니다. 의견 공유 과정이 없으면 참여자별로 그리는 그림이 달라져 논의가 진행될수록 간극이 커집니다."}], "explain": "", "src": "의사소통이론 ⅩⅠ-1-4·5"}, {"id": "s78", "name": "집단사고 (Janis)", "warn": true, "exam": "", "scope": "의사소통이론 고유", "items": ["<b>집단사고(groupthink)<\/b>: 만장일치를 위해 노력하는 응집력 있는 집단이 대안을 현실적으로 평가하려는 동기를 무시하는 사고방식 — 챌린저호 사고, 진주만 침공", "<b>선행 조건<\/b>: ①집단 응집력이 강함 ②집단의 구조적 결함(고립·폐쇄) ③상황 요인(시간 압박)", "<b>증상<\/b>: ①무오류의 환상 ②폐쇄적 사고 ③통일성에 대한 압력(자기검열, <b>정신 경비원 mind guard<\/b>)", "<b>불완전한 의사결정<\/b>: 목표·대안 검토 부실, <b>확증편향<\/b>, 미채택 대안 재평가 안 함, 우발계획 부재", "<b>예방책<\/b>: 비판적 평가자 역할(리더가 먼저 의견 밝히지 않기), <b>악마의 대변인<\/b> / 하위 집단 구분·외부 전문가 검토 / 체계적 정보 수집·복수 대안·우발계획"], "diff": [{"b": "이", "t": "집단사고는 <b>집단지성과 완전히 다른 개념<\/b>입니다(집단지성=협력으로 쌓은 지적 능력의 결과, 집단사고=반대·검증이 봉쇄된 비합리적 사고). 한국처럼 수직적·조화 중시 문화에서 자주 발생하므로 학교·직장 의사결정에서 점검이 필요합니다."}], "explain": "<p>선행조건 → 증상 → 불완전한 의사결정 → 예방책의 4단 구조를 순서대로 외우세요.<\/p>", "src": "의사소통이론 ⅩⅠ-1-6"}, {"id": "s79", "name": "회의의 원칙과 절차", "warn": true, "exam": "기출 ×2 (회의 의사표시 단계 누락, 의장의 역할, 회의 절차)", "scope": "의사소통이론 고유", "items": ["<b>4대 원칙<\/b>: ①<b>정족수<\/b>(의사 정족수 / 의결 정족수: 재적 과반 출석 + 출석 과반 찬성, 가부동수는 부결) ②<b>다수결<\/b> ③<b>일의제<\/b>(한 번에 하나의 의제) ④<b>일사부재의<\/b>(부결된 안건은 같은 회기 중 재상정 불가)", "<b>다수결 3유형<\/b>: 단순 다수결 / 절대 다수결(전체 과반) / 가중 다수결(2/3, 3/4 등, 헌법 제정·제명·탄핵소추 등 중대 사안)", "다수결의 한계: 다수의 횡포 → 충분한 토론 보장, 소수 의견 참고", "<b>회의 5단계<\/b>: 개회 → 정보 교환(원동의·재청·의안 상정·설명/질의) → <b>의사 표시<\/b>(토의 개시/종결) → 표결/결론 → 정리(폐회)"], "diff": [{"b": "이", "t": "일의제 원칙에서는 다른 의제 상정이나 개인적 논평 시 <b>의장<\/b>이 발언을 제재합니다."}, {"b": "역", "t": "회의는 토의의 가장 흔한 형태로 언급하는 수준이며 별도 원칙 상세화는 없습니다. 국교이도 회의를 넓은 의미의 토의로 봅니다(공식적 결정을 내린다는 점에서 토의와 다름)."}], "explain": "<p>통합인덱스: 회의 관련 기출은 사실상 <b>이 책만<\/b> 충족합니다 — 의장의 역할·회의 절차를 정확히 다루는 유일한 책이므로 최우선 학습.<\/p>", "src": "의사소통이론 ⅩⅠ-1-7 · 국교이 3장 · 역락 9장"}]}, {"title": "J. 협상", "cards": [{"id": "s80", "name": "협상의 개념·유형과 근원적 이해", "warn": true, "exam": "기출 ×2 (협상 전략 및 장점, 방법의 문제점, 결렬 이유)", "items": ["<b>협상<\/b>: 갈등 상황에서 결정을 위해 이루어지는 의사소통 — 국교이: 토의의 일종 / 2007 개정부터 토의와 별개 유형 / 역락: <b>근원적 이해를 증진시키려는 의사소통 행위<\/b>", "<b>의제 · 입장 · 근원적 이해<\/b>: 의제=상정된 사안(연봉) / 입장=태도(연봉 3천만 원 요구) / <b>근원적 이해(real interests)<\/b>=배후의 진짜 관심사(구매력·장래성·평판) — 협상의 문제는 상충하는 입장이 아니라 근원적 이해의 차이(Fisher, Ury &amp; Patton)", "<b>분배적 협상<\/b>(고정된 이익을 단일 쟁점으로 경쟁, 제로섬) vs <b>통합적 협상<\/b>(복수 의제와 의제별 가치 평가 차이를 활용해 새 가치 창출)", "<b>상호 의존성<\/b>: 협상 참여자는 ‘협력적 경쟁자’보다 <b>‘경쟁적 협력자’<\/b>"], "diff": [{"b": "역", "t": "상호의존성 3요소(Johnson &amp; Johnson): 참가자(<b>욕구 딜레마<\/b>: 협력적 vs 경쟁적) / 정보(<b>신뢰 딜레마<\/b>: 어떤 정보를 노출하느냐가 핵심, 점진적 노출) / 결과(<b>목표 딜레마<\/b>: 타결 vs 결렬, 실리적 + 명분적 목표). 한자 어원 協(힘을 모음) + 商(내실 탐색), 영어 bargaining(상업 거래) vs negotiation(복잡한 사회 문제). 협상 유형은 참여자 수(양자/다자) · 의제 수(단일=고정 파이·다수=윈윈 창출) · 의사 결정권(단층/복층)으로 나눕니다."}, {"b": "이", "t": "분배적/통합적 협상의 이분법은 이 책 고유이며(국교이·역락에는 없음) 관점에 따라 같은 상황도 통합적으로 접근할 수 있습니다. 원리는 <b>호혜성<\/b>(내재된 동기를 충족하는 방향)과 상호 의존성(Lewicki 외)입니다."}, {"b": "국", "t": "갈등을 문제 자체가 아니라 해결 가능한 상황으로 보고, 시간·노력이 더 들지만 상호 해결책을 찾고 이해·신뢰·존중이 증진되는 것이 장점이라고 봅니다."}], "explain": "", "src": "역락 11장 · 의사소통이론 ⅩⅠ-2 · 국교이 3장"}, {"id": "s81", "name": "협상의 절차 (국교이 7단계 · 역락 5단계 · 이 4단계)", "warn": true, "exam": "기출 ×2 (협상 전략 및 장점, 결렬 이유)", "scope": "세 책 모두 다름", "items": ["<b>국교이 7단계<\/b>(임칠성 역 1995): 욕구 규정 → 권한 범위 → 타결 영역 설정 → 논지 결정 → 진행 목록 작성 → 태도 형성 → 사후 계획", "<b>역락 5단계<\/b>(Thomson 통합적 합의): 의제·대안 확인 → 근원적 이해의 차이 분석 → 제안과 맞교환 추진 → 최선의 해결책 수락/거부 → 합의 이행·재협상·결렬", "<b>의사소통이론 4단계<\/b>(Spangle &amp; Isenhart): <b>사전 협상 → 시작 → 조정 → 해결<\/b>"], "diff": [{"b": "국", "t": "7단계: ①자신과 상대의 욕구를 구체적으로 규정 ②권한 범위를 분명히 ③타결 가능한 최대·최소 영역 설정 ④논지·반대논리·스타일·접근기술 결정 ⑤논의 대상·순서·역할·진행 목록 작성 ⑥긍정적이고 서로 가치 있는 결과를 위한 태도 형성 ⑦합의 후의 계획 수립."}, {"b": "역", "t": "3단계 ‘제안과 맞교환’의 <b>4대 유의점<\/b>: 선제안이 유리 / ZOPA를 벗어나지 않는 제안 / 동시 복수 제안(순차 교환보다 윈윈 유리) / 객관적 기준 제시(중고차 시세표 등). 5단계에서 합의 계약서는 누가·무엇을·언제·어디서·어떻게와 불이행 시 조치를 명시합니다."}, {"b": "이", "t": "①<b>사전 협상<\/b>: 입장·요구·동기 구분, 협상 의제 확인(다중 의제일수록 유리), 우선순위, <b>ZOPA·BATNA<\/b> 예측 ②<b>시작<\/b>: 협상 내용 제시(상대 발언 중 끼어들지 않기), 요구가 ZOPA를 벗어나지 않게 ③<b>조정<\/b>: 정보 공유(유용한 개방형 질문 vs 바람직하지 않은 양자택일·압박형), 대안 조정(양보·수용 조건, 객관적 기준) ④<b>해결<\/b>: 합의안 구성(우선순위 차이를 활용한 맞교환·묶음), 확정(구두가 아닌 문서화·서명)."}], "explain": "<p>⚠️ <b>3권의 절차 모델이 전부 다르니 암기할 때 반드시 어느 책 모델인지 명시<\/b>하세요(통합인덱스).<\/p>", "src": "국교이 3장-2(2)⑤ · 역락 11장-3 · 의사소통이론 ⅩⅠ-2-3"}, {"id": "s82", "name": "BATNA(복안)와 ZOPA(합의 가능 영역)", "warn": true, "exam": "", "scope": "역락·이 (국교이 없음)", "items": ["<b>BATNA<\/b>(Best Alternative To a Negotiated Agreement, <b>복안·배트나<\/b>): 협상 결렬 시 선택할 수 있는 <b>최선의 대안<\/b> — 매우 불리한 조건을 수락하거나 유리한 조건을 거절하는 실수를 막는 <b>유일한 기준<\/b>", "<b>ZOPA<\/b>(zone of possible agreement): 양측의 선호 지점~양보 불가 지점이 <b>중첩되는 영역<\/b> — 측정 가능한 수치로 설정", "대안이 적을수록 불리한 입장 — 상대의 배트나도 함께 예측", "BATNA를 알면 <b>양보점<\/b>을 정할 수 있음(조건 계량화 비교)"], "diff": [{"b": "역", "t": "BATNA 개발 절차 3단계: ①행동 목록 작성 ②실용적 개선 ③최고 대안 선택. ZOPA는 3단계 ‘제안’의 유의점에 나옵니다."}, {"b": "이", "t": "사전 협상 단계에서 ZOPA(범위 예측)와 BATNA(복안)를 함께 예측하도록 합니다. ‘복안(배트나)’로 병기합니다."}], "explain": "<p>⚠️ 통합인덱스는 개발 절차 3단계를 [이] 서술로 적었으나, 이번에 대조한 원문에서는 <b>역락 DB에서만<\/b> 확인됩니다(이 책 DB에는 개념만 있음). 원문 확인을 권합니다.<\/p>", "src": "역락 11장-3 · 의사소통이론 ⅩⅠ-2-3"}, {"id": "s83", "name": "협상 전략 (4대 전략)과 윈-윈 협상", "warn": true, "exam": "기출 ×2 (협상 전략 및 장점, 방법의 문제점)", "scope": "의사소통이론 고유 (4전략)", "items": ["<b>①자원 확대(파이 키우기)<\/b>: 가용 자원 자체를 확대 — “요구를 충족할 대안을 어떻게 늘릴 수 있는가?”", "<b>②동기 접목<\/b>: 표면적 요구 뒤 <b>근원적 이해의 교집합<\/b>을 찾아 접목 — “나와 상대가 원하는 것은/왜 원하는가/공통점과 차이점은?”", "<b>③상호 양보<\/b>: 우선순위·차선순위를 고려해 상대에게 가치 있는 것을 양보하고 <b>구체적 보상을 요구<\/b>하며 맞교환", "<b>④의제 결합<\/b>: 여러 의제를 묶음으로 결합해 상호이익 확대 — 개별 합의보다 <b>해결 단계에서 일괄 결합<\/b>이 유연", "<b>윈-윈 협상<\/b>: 타협·균등 분할·좋은 관계 유지는 윈윈이 <b>아님<\/b> — 모든 창조적 기회를 활용한 통합적 합의 (Thomson)"], "diff": [{"b": "이", "t": "사례: 학생회–학교 측 자습실 개선 협상 — 조명·책상 교체(학교 양보) ↔ 자율 청소(학생회 양보) → 절감된 청소비로 정수기·테이블 추가(의제결합 + 상호양보 + 자원확대가 종합 작동). 화법 교육에서는 자기이익 극대화보다 <b>호혜적 접근<\/b>에 방점을 둡니다."}, {"b": "역", "t": "윈-윈 오해 교정에 방점: 5단계의 ‘파이 키우기’ 유의점 외에 <b>선호도 차이<\/b>를 활용한 맞교환이 개별 타협보다 유리하고, <b>불확실성 사고방식 차이<\/b>를 조건부 계약으로 활용할 수 있다고 봅니다."}], "explain": "<p>통합인덱스: 역락은 오해 교정, 이는 실행 전략에 방점을 두므로 두 관점을 결합해 학습하세요.<\/p>", "src": "의사소통이론 ⅩⅠ-2-4 · 역락 11장"}]}, {"title": "K. 면담·면접", "cards": [{"id": "s84", "name": "면담과 면접의 개념·특성", "warn": true, "exam": "기출 ×2 (면담 교수·학습 방법)", "scope": "세 책 각각 다른 틀", "items": ["<b>면담<\/b>: 정보 획득 목적의 질의응답 / <b>면접<\/b>: 면담의 일종, 면접자가 피면접자의 성격·능력을 <b>판단·선발<\/b>할 목적 (영어로는 둘 다 interview)", "<b>의사소통이론 4대 특성<\/b>: <b>목적성<\/b>(경험의 의미 탐색) · <b>공개성<\/b>(이중 의사소통 구도) · <b>상호성<\/b>(질문-응답이 하나의 의미 덩어리) · <b>관계성<\/b>(공적 친밀감)", "<b>재현 방식 3유형<\/b>(이): 대화 방식 / 일인칭 서술(응답자 목소리 부각, 상호작용 맥락 소거) / 삼인칭 서술(객관화, 다큐)", "면접 형식: 단독/집단 면접, 사전에 일정·목적이 정해져 준비된 대화"], "diff": [{"b": "국", "t": "면담·면접의 공통점은 특별한 목적을 가진 공식적 질의응답 대화이며, 교사가 피면담자를 맡고 학습자가 면담자가 되는 <b>모의 수행법<\/b>을 통합 수업으로 활용할 수 있다고 제시합니다."}, {"b": "역", "t": "면접을 수사학의 범주로 보고 <b>4대 관점<\/b>(인상학적/기능적/스토리텔링/성찰적)을 제시합니다(‘면접 4대 관점’ 카드)."}, {"b": "이", "t": "관계성: 초기 유대감(라포르)이 과도해지면 관계가 모호해지므로 <b>사적이 아닌 공적 친밀감<\/b>을 형성합니다(호칭에 유의). 공개성: 1차(면대면) → 2차(제3의 청자·독자 대상, 기사화·구두발표·방송). 면담 방식: 구조화(정보 획득 용이·융통성 부족) / 비구조화(심도 있으나 주제 이탈 위험) / <b>반구조화<\/b>(절충). 심층 면담은 약 90분이 적당하고 인물의 내면 탐구는 2시간씩 2회로 나눕니다."}], "explain": "<p>⚠️ 통합인덱스: 3권이 다른 독자적 프레임(역 4관점 / 이 4특성)을 쓰므로 <b>혼동하지 말고 별개로 암기<\/b>하세요.<\/p>", "src": "국교이 3장-2(2)⑥ · 역락 8장 · 의사소통이론 ⅩⅡ-1"}, {"id": "s85", "name": "면접에 대한 4대 관점 (역락)", "warn": false, "exam": "기출: 면접 질문 의도 파악 등 (면접 ×2)", "scope": "역락 고유", "items": ["<b>인상학적 관점<\/b>: 혈액형·인상 등 선천적·불변적 요소, <b>면접자(면접관) 중심<\/b>", "<b>기능적 관점<\/b>: <b>질문<\/b>이 핵심(‘면접의 꽃’), 원리 중심 — 가장 <b>객관적<\/b>인 관점", "<b>스토리텔링 관점<\/b>: 지원자의 <b>경험담<\/b>이 핵심, 공감적 소통(감성)", "<b>성찰적 관점<\/b>: <b>개성<\/b>이 핵심, 지원자 자신의 내면적 가치를 최우선"], "diff": [{"b": "역", "t": "면접은 서류로 평가하기 어려운 인간적 매력·자질을 새롭게 중시하는 흐름(서형준 2008)이며, 설득의 화법 기술과 실용성을 추구하므로 <b>수사학의 범주<\/b>에 속합니다. 질문 유형: 지원자 질문(인성 질문은 사적·공적 이익 충돌 상황에서의 선택, 업무 능력 질문은 <b>문제-해결책-결
