과<\/b> 구조로 90초 이내) / 상식 질문(집단 정체성과의 부합 여부 확인)."}], "explain": "", "src": "역락 8장-2·3"}, {"id": "s86", "name": "면담·면접의 질문 기법", "warn": false, "exam": "", "scope": "책마다 테마가 다름", "items": ["<b>국교이<\/b>: <b>주안적 질문<\/b>(핵심) / <b>부차적 질문<\/b>(주안적 질문의 보충, 불충분·불명확한 응답 재확인용) — 간단명료한 완전한 문장, 일반적 내용 → 본격 질문 순서 / 당황스러운 상황 대처(재확인 요청, 냉정하게 의도 파악, 대답이 막히면 생각할 기회로 삼겠다고 표현, 침묵은 전달 기회로 전환)", "<b>역락 오리엔티어링 전략<\/b>: 불리한 사실 답변(솔직 인정·대안적 가치 부각·진솔한 사건 설명·현재 삶에 영향 없거나 선순환 제시) / <b>최후 변론<\/b>(“잠깐, 한 말씀 드려도 될까요?”) / <b>어법 바꾸기<\/b>(뒤집기 어법 — 부정적 단어 반복 지양, 긍정적·미래지향적 재구성)", "<b>의사소통이론 내면 탐구 질문 5단계<\/b>(Seidman): 삶의 맥락에서 바라보기 → 일상의 경험에 주목 → 내면의 목소리 끌어내기(<b>역할 수행 질문<\/b>) → 경험을 비유로 표현(<b>개념적 은유<\/b>, “교사는 OO이다”) → 경험의 의미 구성"], "diff": [{"b": "이", "t": "‘어떻게 ~하게 되셨나요?’가 ‘언제/무엇을’보다 구체적 답변을 유도합니다. 면담 의사소통: 내면의 소리 경청(충분히 기다림, 침묵·무응답·웃음도 의미), 반응의 영향 점검(무의식적 비언어로 위축시키거나 과도한 긍정 반응으로 내용을 부풀리지 않기, 동의를 강요하는 질문 지양), 민감한 질문은 동의 구하기."}], "explain": "<p>⚠️ 통합인덱스: 3권이 <b>테마가 완전히 달라<\/b>(국=대처법 / 역=전략적 답변 / 이=심층 인터뷰 이론) 상호 보완적으로 학습합니다.<\/p>", "src": "국교이 3장 · 역락 8장-4 · 의사소통이론 ⅩⅡ-1-3"}, {"id": "s87", "name": "면접의 구성 방식과 답변 전략", "warn": false, "exam": "", "scope": "의사소통이론 고유", "items": ["<b>구조적 면접<\/b>: 사전 확정 질문(타당도·공정성·신뢰도 높음, 준비 비용 큼) / <b>비구조적<\/b>: 자유로운 질의응답 — <b>후광 효과<\/b>가 구조적보다 큼 / <b>반구조적<\/b>: 절충", "<b>답변 전략<\/b>: 간결·솔직(30초 내외, 2분 초과 지양) / 정형화된 질문에 답변 차별화 / 질문자의 의도 파악(불명확하면 명료화 요청)", "<b>행동 경험형 질문<\/b>: 과거 행동으로 미래 행동 예측 — 결과뿐 아니라 경험을 어떻게 <b>내면화<\/b>했는지 언급", "<b>딜레마성 질문<\/b>: 양자택일이 아니라 두 가치를 종합 고려 / <b>장단점 질문<\/b>: 단점은 독립 부각하지 않고 장점의 맥락 안에서 + 개선 의지"], "diff": [{"b": "이", "t": "압박 면접은 의도를 인식하고 평정심을 유지하며 합리적으로 답하고, 집단 면접은 앞선 지원자와 내용이 중첩되지 않게 차별화합니다(모의면접으로 긴장 완화). 발언권 독점은 금지입니다."}], "explain": "", "src": "의사소통이론 ⅩⅡ-1-4"}, {"id": "s88", "name": "AI 면접", "warn": false, "exam": "", "scope": "의사소통이론 고유", "items": ["<b>분석 항목<\/b>: 표정 감정 분석(호감도) / 음성 준언어 분석(성량·속도·어조) / 어휘 분석(긍정·부정·중립·복합, 워드클라우드)", "<b>장점<\/b>: 인력·비용·시간 절감, 면접자 주관성·선입견 배제", "<b>단점<\/b>: 기술적 안정성 + <b>윤리적 문제<\/b>(사생활 보호·자료 보존 불투명, 알고리즘 투명성 부족, 책임 소재 불분명, 성별·인종 차별 소지)", "<b>구성<\/b>: 기본 면접 → 성향 분석 → 상황 대처(60초 준비 + 60초 답변) → 보상 선호 → AI 게임 → 심층 면접"], "diff": [{"b": "이", "t": "답변 전략: 두괄식 간결, 시간 제한을 고려한 순발력, 질문을 정확히 이해(재질문 불가), 지원 기관의 인재상에 맞춘 예상 질문 준비(신나민·한정규 2022)."}], "explain": "<p>통합인덱스: 국교이·역락에는 AI 면접이 없어 최신 출제 경향 반영 시 <b>유일한 자료<\/b>입니다.<\/p>", "src": "의사소통이론 ⅩⅡ-1-5"}]}, {"title": "L. 화법 교수·학습과 평가", "cards": [{"id": "s89", "name": "화법 교수·학습의 원리 (전은주 1999)", "warn": false, "exam": "", "scope": "국교이 고유", "items": ["<b>상호관계성<\/b>: 말하기와 듣기는 동시에 이루어지므로 함께 관계적으로 지도 (토론-비판적 듣기, 대화-공감적 듣기, 연설-비판적 듣기) — 분리해 학습하면 청자 역할을 제대로 수행하지 못함", "<b>이해와 적용<\/b>: ‘이해’만으로는 능력과 무관한 지식, ‘이해’ 없는 수행은 맹목적 수행 — 조화는 양적 균형이 아니라 <b>이해한 지식이 적용에서 실제로 필요한 지식이 되는 것<\/b>", "<b>실제성<\/b>: 활동 과제가 실세계에서 겪을 수 있는 것(<b>authentic tasks<\/b>)이고 수행 환경도 실세계와 같아야 함"], "diff": [{"b": "국", "t": "화법 교육은 수행 경험 없이는 성취할 수 없으므로, 수행 중심 교육에서 모든 학습자가 유의미한 수행 경험을 하도록 사전에 구상해야 합니다. 활동은 상황적 특성을 고려해 목표·담화 환경 정보·실행 방법을 상세히 기술해야 합니다."}, {"b": "역", "t": "구어 의사소통 능력은 일상생활을 통해서도 자연스럽게 어느 정도 습득되므로, <b>백지 상태에서 시작하는 교육이 아니라<\/b> 학습자의 기존 능력 중 미숙한 부분을 능숙하게 하는 교육이라는 전제를 둡니다."}], "explain": "<p>작문·독서의 교수·학습 원리(생태학적·실제성)와 같은 계열의 원리입니다.<\/p>", "src": "국교이 4장-1 · 역락 6장-1"}, {"id": "s90", "name": "화법 지도 방법 4유형 (전은주 2002)", "warn": true, "exam": "기출 ×2 (모의 수행법)", "scope": "국교이 고유", "items": ["<b>대화 분석적 방법<\/b>(=담화 분석법, 메타 말하기): 자신·타인의 말하기·듣기의 내용·방법·태도를 <b>분석<\/b>해 화법 지식을 이해 (영상·음성·전사 자료)", "<b>내재적 수행법<\/b>: 성공적으로 수행하는 자신의 모습을 <b>연상<\/b>하게 함 — 실제 수행 전 단계, 교실에서 하기 힘든 상황 연습, <b>말하기 불안 완화<\/b> (Adler 1976: covert behavior rehearsal이 overt만큼 효과적, 자기충족적 예언)", "<b>실제적 수행법<\/b>: 학습자가 <b>자신의 입장<\/b>에서 실제(또는 조정된 교실) 담화 환경에서 수행 — 수행 후 자기 평가, 담화 형식은 고정하고 화제를 바꿔 반복 생산", "<b>모의 수행법(역할극)<\/b>: 교육 연극 기법으로 <b>허구적 역할<\/b>(다른 사람의 입장)을 수행한 뒤 현실적 자아로 돌아와 참여자 관점별 문제를 이해"], "diff": [{"b": "국", "t": "혼동 주의 포인트: <b>실제적 수행법 vs 모의 수행법<\/b>은 자신의 입장이냐 다른 사람의 입장이냐의 차이이고, 내재적 수행법-말하기 불안 완화의 연결도 함께 지목됩니다. 핵심 조건: 대화 분석적 방법은 지식 이해에 그치지 않고 수행으로 연계, 내재적 수행법은 수행 과정을 명확히 영상화하도록 내·외적 환경 마련(활동 예: 눈을 감고 편히 → 눈을 뜨고 주의 집중 후 상세히 그리기), 실제적 수행법은 자기 평가 기회 제공, 모의 수행법은 허구적 인물을 이해할 자료를 충분히 제시."}], "explain": "<p>통합인덱스: 이 4유형과 역락의 기능/태도 이원 모형은 서로 다른 틀이며 결합 가능합니다(예: 국교이 모의 수행법 ≈ 역락 DIE).<\/p>", "src": "국교이 4장-2"}, {"id": "s91", "name": "화법 기능의 교수·학습 모형 (역락)", "warn": true, "exam": "기출 ×1 (직접 교수법)", "scope": "역락 고유", "items": ["<b>원리 이해하기 → 기능 연습하기 → 모의 실행하기 → 조정하기<\/b>", "①원리 이해: 담화 유형의 방법·규칙 이해(예: 협상의 개념·방법·전략)", "②<b>기능 연습<\/b>: 이미 가진 기능 중 교육이 필요한 부분 집중 — <b>직접교수법<\/b>(설명하기-시범보이기-질문하기-활동하기), 시범은 실제 담화 영상, <b>소통 행위뿐 아니라 소통 내용도 함께 연습<\/b>(공감적 듣기 = 공감하기 내용 + 표현 행위)", "③<b>모의 실행<\/b>: 교육 연극, <b>DIE(Drama-in-Education)<\/b> — 공동 작업을 통한 문제 해결과 이면의 의미 고찰, 허구 세계 경험", "④<b>조정하기<\/b>: 담화 수행 과정을 메타적으로 점검·분석하여 부족한 부분 강화"], "diff": [{"b": "역", "t": "심상교(2004) 교육 연극 교수·학습 모형은 <b>대상 인지 → 인지 투사 → 구성하기 → 구체화하기 → 거리두기<\/b> 5단계입니다(협상하기 수업: 모둠 편성·과제 분석 → 역할 나누기 → 팀별 전략 모색 → 전략 사용해 협상 → 문제점 파악·피드백). 기능의 탈맥락적 속성 때문에 실제 상황을 제공해야 합니다."}], "explain": "<p>작문의 ‘직접교수법·현시적 교수법’, 독서의 직접교수법과 단계 수·구성을 비교해 보세요.<\/p>", "src": "역락 6장-1"}, {"id": "s92", "name": "화법 태도의 교수·학습 모형 (이주행 외 2004)", "warn": false, "exam": "", "scope": "역락 고유", "items": ["<b>태도 인식하기 → 태도 발견하기 → 태도 분석하기 → 태도 행동하기 → 태도 내면화하기<\/b>", "<b>인식<\/b>: 목표 태도 개념의 긍정적 가치 확인과 원리 이해 / <b>발견<\/b>: 구체적 담화 상황에서 학습자가 목표 태도를 스스로 발견 (예: 협상 동영상에서 자기주장만 되풀이하는 행동) / <b>분석<\/b>: 문제점 분석과 해결 태도의 행동 모형화", "<b>행동<\/b>: 결정된 태도 행동을 반복 연습해 체화 / <b>내면화<\/b>: 반복으로 습관화해 실제 상황에 적용", "태도는 긍정적 가치 인식만으로는 내면화되지 않고 <b>반복된 행동<\/b>을 통해서만 내면화됨"], "diff": [{"b": "역", "t": "분석 단계의 유의점은 구체적 태도 행동을 <b>학습자 스스로 결정<\/b>하게 해야 한다는 것입니다(그렇지 않으면 태도 교육이 구시대 질서를 강요할 위험). 화법 태도는 문제 해결·인간관계 형성·공동체적 가치 함양의 핵심이며, 대화 갈등의 실질적 원인은 내용보다 태도인 경우가 많고 언어 예절·윤리도 결국 화법 태도가 핵심입니다."}], "explain": "<p>기능 모형(원리 이해-기능 연습-모의 실행-조정)과 <b>교육 대상이 다르다<\/b>(기능 vs 태도)는 점을 구분하세요.<\/p>", "src": "역락 6장-1"}, {"id": "s93", "name": "화법 평가의 유형과 도구 (분석적·포트폴리오·녹화·자기·동료)", "warn": true, "exam": "기출 ×3 (포트폴리오) · ×1 (평가 주체 다양화)", "scope": "국교이 기준", "items": ["<b>분석적 평가<\/b>: 평가 내용을 구성하는 하위 요소를 각각 평가한 뒤 종합 — 총체적 평가보다 객관성 확보가 쉽고 구체적 정보를 제공해 <b>피드백 측면에서 유용<\/b> (총체적 평가는 주관적·인상적이 되기 쉬움)", "<b>포트폴리오 평가<\/b>: 학습자의 <b>발달 과정<\/b>을 보여 주는 다양한 자료를 모아 총체적으로 평가 — 담화 수행 직접 평가로는 알기 어려운 학습 과정 평가 가능 (준비 개요서·실행 개요서·수행 연습 일지·자기 평가지·관찰 평가지·녹화 자료)", "<b>녹화 기록법<\/b>: 말하기 수행이 결과물이 남지 않는 <b>일과적<\/b> 성격이라 녹화 후 재생하며 평가 — 반복 재생·구체적 피드백·교수·학습 자료로도 활용", "<b>자기 평가법 vs 동료 평가법<\/b>: 구분 기준은 평가의 <b>주체<\/b>. 동료 평가는 청중의 반응으로서의 의미, 평가하는 학습자도 자신의 말하기·듣기를 반성"], "diff": [{"b": "국", "t": "전제: 평가 대상이 지식·기능·전략인지, 실제 담화 수행 능력인지를 먼저 결정해야 하며, 실제 수행 능력을 직접 평가하는 것이 가장 바람직합니다. 분석적 평가의 절차는 평가하려는 담화 능력을 구성 요소(예: 발표=화제 선택·언어적/비언어적 표현·태도)로 범주화하는 것입니다. 자기 평가는 교사가 평가 항목을 미리 제시하는 것이 바람직합니다."}, {"b": "역", "t": "포트폴리오를 학생이 수행한 <b>대표 과제를 의도적으로 선정<\/b>해 평가받는 방식(예: 듣기 기록장)으로 소개합니다. 총괄평가에는 통합 점검표가 쓰입니다."}], "explain": "<p>통합인덱스: 자기 평가 vs 동료 평가의 ‘주체’ 기준 구분은 명확히 암기하세요. 작문의 ‘평가 주체(교수자·동료·자기)’와 같은 틀입니다.<\/p>", "src": "국교이 5장 · 역락 6장-2"}, {"id": "s94", "name": "화법 평가의 관찰법 (4가지 도구)와 평가 영역", "warn": true, "exam": "기출 ×2 (관찰법)", "scope": "역락 고유", "items": ["<b>평가 3기능<\/b>: 형성적 · 총괄적 · <b>전략적<\/b>(학습 동기 유발, 학부모 홍보) / <b>평가 영역<\/b>: 인지적(소통의 사고) · 정의적(관계 목적·태도) · 심동적(비언어적 소통)", "<b>관찰법<\/b> — 정의적·심동적 영역·수행 평가에 활용, 유형은 통제 여부(자연적/통제적) × 참여 여부(참여/비참여)", "<b>일화 기록<\/b>(anecdotal record): 자연스러운 장면의 의미 있는 행동을 구체적으로 기록(1기록=1사건, 즉시)", "<b>평정 표시<\/b>(rating): 평정 척도 문항의 관찰 기록 용지에 빈도·강도를 평정", "<b>목록 검색<\/b>(checklist): 행동·조건·상황의 존재/출현 여부를 열거된 목록에 체크", "<b>자기 보고법<\/b>(self-report): 자기 관찰 보고 — 질문지법·척도법·검사, ‘의사소통 점검과 조정’에서 주로 활용"], "diff": [{"b": "역", "t": "<b>간접 평가<\/b>(지필: 선택형 진위형·배합형·선다형, 서답형 단답형·완성형·서술형)는 화법 능력을 직접 평가할 수 없다는 한계가 있고, <b>직접 평가<\/b>는 관찰법과 포트폴리오입니다. 화법 전체 평가용 <b>통합 점검표<\/b>(교육과학기술부 2008)는 내용·조직·표현(언어적·준언어적·비언어적)·매체·태도로 구성되어 총괄평가에 적합하며, 수업 시간에는 필수 학습 요소만 구체화한 점검표가 더 효과적입니다. <b>듣기 평가<\/b> 자료는 교사 제작 / 학생 제작 / 현장 자료(목표·기준이 명확할 때만)이며 평가자는 교사·동료·자기 모두 가능합니다. <b>말하기 평가의 3대 문제<\/b>: 시간 부족 · 신뢰성 부족(평가자 주관) · 효과적 평가 방법의 부재 → 대안은 녹음·녹화 활용입니다."}], "explain": "<p>통합인덱스: 이 4가지 관찰 도구 분류가 국교이보다 세분화되어 있어 ‘관찰법의 유형을 나열하시오’는 역락 기준입니다. 관찰법의 <b>3가지 도구<\/b>(일화·평정·목록)에 자기 보고법을 더해 4가지로 셉니다.<\/p>", "src": "역락 6장-2"}]}]}, {"id": "writing", "label": "작문", "sections": [{"title": "A. 작문 이론", "cards": [{"id": "w01", "name": "작문 이론의 시대 구분 (니스트랜드 외 1993)", "warn": true, "exam": "", "scope": "사회평론 기준", "items": ["형식주의(1940~60년대 중반) → 구성주의=<b>인지주의<\/b>(1960년대 후반~80년대 초) → <b>사회적 구성주의<\/b>(1980년대) → <b>대화주의<\/b>(1980년대 후반)", "국내에서는 박영목(1994)이 소개해 정설이 됨 — ‘구성주의’를 ‘인지주의’로 부르는 것이 국내 관행", "1990년대는 ‘포스트모던’의 시기: 대화주의·후기 과정주의가 기존 이론의 한계를 보완·절충"], "diff": [{"b": "사", "t": "4시기 구분을 가장 명시적으로 제시합니다. 본서 구성도 결과중심(수사학+형식주의) → 과정중심(인지주의+사회구성주의) → 대안적 이론(대화주의+장르중심+후기 과정)입니다."}, {"b": "역", "t": "니스트랜드 외가 바흐친의 인식론에 주목한 것이 대화주의의 계기입니다. 철학적 방법론(인식론)으로 나누면 형식주의=경험주의 / 인지주의·사회구성주의=구조주의 / 대화주의=대화주의(탈구조주의 인식론에 가까움)입니다."}, {"b": "국", "t": "쓰기를 보는 관점을 형식주의·인지주의·사회구성주의·<b>장르중심<\/b> 4가지로 잡습니다(대화주의 없음). 분류축은 결과 중시(형식주의) ↔ 과정 중시(나머지)입니다."}], "explain": "<p>통합인덱스: 4시기 틀은 사평이 가장 명시적이고, 역락·국교이는 틀을 전제하되 시대구분표가 없습니다. <b>‘네 번째 이론’이 대화주의냐 장르중심이냐<\/b>가 책마다 다릅니다.<\/p>", "src": "사회평론 2장 · 역락 2장 · 국교이 I-4"}, {"id": "w02", "name": "형식주의 작문 이론", "warn": true, "exam": "기출 ×4 (모범문 모방, 맥락)", "items": ["쓰기를 객관화된 작문 절차·장르 규범·규칙에 따라 지식을 글로 실현하는 것으로 봄 — <b>결과(텍스트) 중심<\/b>", "배경: 신비평·(구조)언어학·행동주의 심리학, 규범 문법 준수와 어법 정확성 강조", "선조적·단계적 쓰기 과정관 (단어 → 문장 → 문단 → 글)", "교사: 모범 텍스트 제시·모방 유도·완성작 오류 교정 / 학생: 규칙 학습 + 모범문 모방"], "diff": [{"b": "역", "t": "고유한 작문 이론이라기보다 문학·언어학적 관점에서 작문을 설명한 경향입니다. <b>의의<\/b>: 작문 이론이라 부를 수 있는 최초의 사조로, 독서 중심이던 언어교육에서 작문 교육의 필요성을 부각했습니다. <b>한계<\/b>: 완성된 텍스트의 정확성만 강조해 필자의 능동적 의미 구성과 사회적 맥락을 보지 못했습니다."}, {"b": "사", "t": "신비평의 영향으로 텍스트를 ‘자율적인 의미의 구현체’로 봅니다(리처즈의 작가·제목 가림 실험). 대표 저서는 Warriner &amp; Griffith(1969)와 Strunk &amp; White(1959, 18개 규칙)입니다. 고유 교수법: <b>5단락 쓰기<\/b>(도입 1 + 본문 3 + 결론 1)와 <b>문장 중심 교수법<\/b>(문장 확장 Christensen / 문장 결합 Mellon·O’Hare — 변형생성문법의 영향, 인지주의 대두 후 쇠퇴)."}, {"b": "국", "t": "결과 중심 지도의 맞춤법·띄어쓰기·문장·단락 구성 지도는 좋은 글의 밑바탕이라 반드시 필요하다고 봅니다."}], "explain": "<p>쓰기 본질 규정: 규칙 학습과 반복 연습으로 형성되는 <b>결과적인 것<\/b>(국교이). 수업 장면(모범문 모방 지도)을 보고 이론을 판별하는 문제가 나옵니다.<\/p>", "src": "역락 2장 · 사회평론 2장 · 국교이 I-4"}, {"id": "w03", "name": "수사학과 작문 이론", "warn": true, "exam": "", "scope": "역락·사회평론 (강조점이 다름)", "items": ["수사학: 그리스·로마에서 연설·변론의 효과를 높이려는 연구로 출발 → 아리스토텔레스가 체계화(『수사학』)", "두 갈래: <b>설득 중심<\/b> 수사학(설득하는 글쓰기·논증) vs <b>표현 중심<\/b> 수사학(문종 분류·표현 기교 → 형식주의와 직결)", "핵심 개념은 <b>수사적 상황<\/b>(필자·독자·주제/목적·상황)"], "diff": [{"b": "역", "t": "소피스트(상대주의, 연설 분석·모방)와 아리스토텔레스(‘능력에 관한 학문’, 장르별 담화 구성을 매뉴얼화)를 다룹니다. 전통 수사학은 필자·독자에 관심이 없고, 언어 법칙을 따르면 진실이 전달된다고 봅니다. 한국 도입은 이태준 『문장강화』(1949)이며, 4차 교육과정에서 국문학·국어학·수사학이 지식의 원천이 됩니다."}, {"b": "사", "t": "로마 시대에 목표가 ‘말하기’에서 ‘글쓰기’(모범 글 모방)로 전환되고 19세기에 쇠퇴했다가, 20세기에 <b>신수사학<\/b>(Perelman &amp; Olbrechts-Tyteca, Toulmin 1958)으로 재발전합니다. 4차 교육과정기에 통일성·일관성·강조성, 두괄식·미괄식·양괄식, 진술방식이 교육내용화되었고(표현 중심), 설득 중심 수사학은 2015 개정의 ‘설득 전략’·‘논증 방법’의 이론적 기반입니다."}], "explain": "<p>역락은 역사·특징, 사평은 독자 개념·교육과정 영향에 강조점을 둡니다(통합인덱스).<\/p>", "src": "역락 2장 · 사회평론 2장"}, {"id": "w04", "name": "독자 개념의 두 계보 (신수사학 vs 바흐친)", "warn": true, "exam": "", "items": ["아리스토텔레스: 청중 = 논리·정서로 설득할 <b>수동적<\/b> 대상 → 신수사학: 독자 = 논증의 방향을 결정하는 필자와 동등한 주체", "페렐만 &amp; 올브레히트-티테카의 3독자: <b>특정 독자<\/b>(실제 독자) / <b>보편 독자<\/b>(합리적 성인으로 가정된 허구적 독자) / <b>독자로서의 자아<\/b>(보편 독자를 내면화해 필자가 스스로 독자가 됨)"], "diff": [{"b": "사", "t": "정혜승(2013): 수사학의 역사는 독자를 수동적 수신자에서 능동적 참여자·논증의 평가자로 재발견하는 과정이라고 봅니다."}, {"b": "역", "t": "대화주의 장에서 <b>다른 계보<\/b>의 독자 개념을 소개합니다: 정신적 구조물(Berkenkotter 1981) / 호출된 독자(Ede &amp; Lunsford 1984) / 모델 독자(Eco 1979) / <b>내재적 청중<\/b>(바흐친 1976: 필자가 속한 사회집단의 ‘권위 있는 대표자’의 신념·가치·지식의 구현체). 보편 청중은 Perelman의 유사 개념이라고 덧붙입니다."}], "explain": "<p>⚠️ 같은 주제(독자 개념)를 사평은 신수사학 계보, 역락은 바흐친 계보로 서술합니다. 용어가 다르니 책 이름과 함께 기억하세요.<\/p>", "src": "사회평론 2장 · 역락 2장"}, {"id": "w05", "name": "인지주의 작문 이론", "warn": true, "exam": "기출 ×7 최빈출 (과정중심, 회귀성, 상위인지기능, 생성적 과정 모형)", "items": ["형식주의 비판에서 출발, 쓰기를 개인 필자의 <b>목표 지향적 문제 해결(사고) 과정<\/b>으로 봄 → 과정 중심 쓰기 교육", "연구방법: <b>사고구술법<\/b>·프로토콜 분석 / Emig(1971)의 회귀적 관점, Flower &amp; Hayes(1981)의 문제해결 모형", "교육 내용: 쓰기 과정을 조절·통제하는 기능·전략. 교사는 오류 점검자 → 쓰기 과정에 적극 개입하는 조력자", "한계: 개인에 한정해 사회·문화적 맥락을 간과, 인지적 의미 구성에만 초점을 두어 결과물(텍스트)을 소홀히 함"], "diff": [{"b": "역", "t": "Emig(1971) 『12학년의 작문 과정』: 능숙한 학생 필자는 어법 정확성보다 <b>회귀적 과정<\/b>을 거치며 의미 구성에 집중함을 발견했습니다. 선조적 관점(Rohman &amp; Wlecke)을 회귀적 관점으로 바꾸고 사고구술법을 작문 연구에 도입한 것이 의의입니다. 문제해결모형은 복잡한 문제를 하위 문제로 쪼개 인지 부담을 줄이고, 필자가 위계적인 여러 목표를 만들어 하나씩 해결한다고 봅니다. 비판: 사회구성주의(개인적 행위로만 가르침), 포스트모더니스트(과정을 또 다른 고정 지식으로 만듦), 사고구술법의 인위성."}, {"b": "사", "t": "Flower &amp; Hayes(1981) 4대 요지: ①쓰기 과정은 필자가 조율·조직하는 독특한 사고 과정 ②계층적·내장적 조직 ③목표지향적 사고 과정 ④목표 생성 2방법(상위목표 + 하위목표 설정 / 작문 중 목표를 바꾸거나 새로 만듦). Flower(1981) 『글쓰기의 문제 해결 전략』은 쓰기 9단계마다 2~5개 전략을 제시합니다."}], "explain": "<p>회귀성은 ‘작문 과정의 성격’ 카드, 생성적 과정 모형은 ‘Flower &amp; Hayes(1981)’ 카드, 상위인지는 ‘상위인지 전략’ 카드를 함께 보세요. 본질 규정: 개인의 인지 과정에 기반한 <b>과정적인 것<\/b>(국교이).<\/p>", "src": "국교이 I-4 · 역락 2장 · 사회평론 2장"}, {"id": "w06", "name": "사회구성주의 작문 이론", "warn": true, "exam": "기출 ×2 (담화공동체)", "items": ["쓰기 = 객관 지식의 실현도, 순수 개인적 의미 구성도 아닌 <b>담화공동체 구성원과의 상호작용을 통한 의미 구성<\/b>", "이론 기반: 비고츠키 — 사고는 공동체의 언어적 대화가 내면화된 것, <b>근접발달영역(ZPD)<\/b>", "텍스트 = 담화 관습·규칙의 집합 / 필자 = 담화공동체의 사회화된 구성원 / 독자 = 해석공동체의 구성원", "지도: 대화·의미 협상, 소집단 협동 작문, 교사(전문가)–학습자(초보자)의 <b>인지적 도제<\/b>와 책임 이양"], "diff": [{"b": "국", "t": "학습은 사회적 맥락 속 전문가–초보자의 인지적 도제 관계의 전수 과정이며, 책임 이양 속에서 사회적 수준의 학습이 개인적 수준으로 내면화되어 자기주도성을 얻는다고 봅니다."}, {"b": "역", "t": "Shaughnessy(1977)는 비원어민 학생 글의 오류를 개인 문제가 아니라 담화공동체의 형식·관습에 대한 미숙으로 봅니다(Faigley도 유사). <b>인지주의와의 쟁점<\/b>은 의미 구성의 주체가 개인이냐 담화공동체냐이며, 둘 다 과정을 중시하는 구성주의 인식론이라는 점은 같습니다. 두 관점을 통합한 것이 Flower(1994)의 사회-인지적 관점입니다."}, {"b": "사", "t": "언어학 배경으로 화행 이론(Austin·Searle)과 사회언어학(Labov, Hymes의 의사소통의 민족지학)을 듭니다. Bruffee: “언어는 사회적 구조물”이라는 핵심어로 쓰기를 <b>사회적 행위<\/b>로 봅니다. 핵심 원리는 <b>합의<\/b>(Myers의 논문 게재 과정 사례)이며, Schryer는 담화 관습이 경쟁할 수 있고 합의가 권력 쪽으로 기울 수 있다고 지적합니다. 관습 답습을 넘어 ‘왜 그렇게 써야 하는가’를 묻는 비판적 지향도 이 이론의 한 축입니다."}], "explain": "<p>비고츠키의 <b>내적인 말<\/b>(사평): 사회적 말 → 자아중심적 말 → 내적인 말로 발달하며, 대화가 내면화되어 문제해결·자기조절 기능을 얻습니다.<\/p>", "src": "국교이 I-4 · 역락 2장 · 사회평론 2장"}, {"id": "w07", "name": "대화주의 작문 이론", "warn": true, "exam": "기출 ×2 (독자의 역할, 상호작용)", "scope": "역락·사회평론 공통", "items": ["의미 구성 = 필자–독자 간 <b>사회적 상호작용(협상)<\/b> — 바흐친, 쓰기는 다성적 활동", "사회구성주의(의미는 공동체의 <b>합의<\/b>) vs 대화주의(의미는 <b>협상<\/b>, 역동적·한시적)", "의미는 텍스트나 개인 한쪽이 아니라 상호작용 속에 있음 → 미결정성·종결 불가능성"], "diff": [{"b": "역", "t": "필자를 <b>담화자(conversant)<\/b>로 봅니다(Nystrand 외 1993, 바흐친의 <b>응답성<\/b>). 필자는 선행·후행 텍스트에 동의·반박·인용·보충 등으로 반응하며, 그 반응 과정이 쓰기이고 결과가 텍스트입니다. 독자도 담화자로서 ‘적극적으로 반응하고 창조적으로 이해’합니다. 텍스트는 열린 채 끝나는 대화(open-ended dialogue)입니다."}, {"b": "사", "t": "대화주의 3대 핵심(박영목 1994): ①의미 구성은 사회문화적 맥락에서 필자–독자 간 역동적·한시적 협상 ②의미는 사용자 간 상호작용 현상 속에 내재 ③텍스트는 필자자신–타인, 인지작용–언어맥락, 개인–사회를 잇는 기능. Bruffee의 <b>동료 비평<\/b> 3단계는 객관적 기술(기술적 개요) → 기법 평가 → 내용 의견 교환입니다. 대화주의는 Bruffee 협동학습이 공동체 규범에 의문을 제기하는 방법이 없다고 비판하고, 교실 밖 실제 독자를 대상으로 한 실제적 과제를 강조합니다."}], "explain": "<p>국교이에는 대화주의가 없습니다. 필자 개념: 형식주의=의미 전달자 / 인지주의=문제해결자 / 사회구성주의=사회화된 구성원 / 대화주의=<b>담화자(대화 참여자)<\/b>.<\/p>", "src": "역락 2장-5 · 사회평론 2장-5"}, {"id": "w08", "name": "응답 감수성과 대화주의의 작문 교육", "warn": false, "exam": "", "scope": "역락 고유", "items": ["대화주의는 작문 교육 내용·방법을 명시적으로 제안하지 않음 → 산발적 목표는 <b>응답 감수성<\/b> 함양", "응답 감수성: 필자가 독자의 응답을 예견하는 능력과 태도 (문어에서는 독자 반응이 현존하지 않아 필자의 적극성·감수성 문제)", "함양 경로 3: ①실제 독자와의 상호작용 확대(동료평가·합평회) ②독자로서 긍정적 응답 경험을 쌓는 읽기 ③필자·대상·독자 삼자 관계를 고려한 독자 분석"], "diff": [{"b": "역", "t": "<b>사회구성주의와의 차이<\/b>: 사회구성주의는 기존 담화 관습 획득이 목표이나, 대화주의는 타자의 반응으로 자기 글쓰기를 성찰하고 새 방향(새 관습·관점)을 모색하는 것이 목표입니다. 읽기 경험에서 모방할 것은 텍스트의 형식적 자질이 아니라 필자가 맥락을 대하는 자세이며(형식주의의 모범문 모방과 구별), 삼자 관계 이해는 대상 이해 → 독자와 대상의 관계 이해 → 독자 응답 예견의 순입니다."}], "explain": "<p>둘 다 협동작문·동료평가를 활용하지만 <b>지향점<\/b>이 다르다는 점이 판별 포인트입니다.<\/p>", "src": "역락 2장-5"}, {"id": "w09", "name": "표현주의 작문 이론", "warn": false, "exam": "", "scope": "역락 고유", "items": ["글쓰기를 오로지 필자의 개인적 표현으로 봄 — 객관적 지식을 중시한 전통 수사학·형식주의에 대한 저항(‘주관주의 담론’)", "진실은 개인의 정신·개인적 글쓰기와 탐구 과정에서 발견 → 필자의 <b>목소리<\/b> 중시, 쓰기의 목적은 자아 성숙", "교사는 학습자가 쓰고 싶은 것을 깨닫도록 돕는 최소한의 역할"], "diff": [{"b": "역", "t": "주요 학자(Couture 1999): Macrorie는 ‘살아있는 글’을 위해 <b>자유쓰기<\/b>와 협의하기를, Murray는 진실한 자기표현을 위한 대화 집단을, Elbow(『Writing without teachers』)는 교사 없는 쓰기 수업과 <b>기준 중심 vs 독자 중심 피드백<\/b>을 제시합니다. 국내에서는 이오덕·이호철, 글쓰기교육연구회가 학생의 생활 경험을 솔직히 쓰게 하는 것을 강조했습니다. <b>한계<\/b>: 교사가 예상 독자로 존재해 순수한 학생 주도 글쓰기가 어렵고, 협의하기의 실제 효과에 회의가 있습니다. 표현적 쓰기(경험·정서 표현, 자아정체성 탐구)에서 특히 유용합니다."}], "explain": "<p>통합인덱스에서 역락에만 있는 이론(🟢)입니다. 문제 유형: 자유쓰기·독자 중심 피드백 사례에서 표현주의를 판별.<\/p>", "src": "역락 2장-4"}, {"id": "w10", "name": "장르 중심 작문 이론", "warn": true, "exam": "", "scope": "국교이·사회평론 공통", "items": ["과정 중심 이론이 텍스트 자체를 소홀히 했다는 비판에서 부상 → 과정과 결과의 균형", "<b>Miller(1984)<\/b>: 장르 = 반복되는 상황에서 나타나는 <b>유형화된 수사적 행위<\/b> (고정 틀이 아니라 생성·변형·소멸하는 동적 개념)", "담화공동체가 공유하지 않는 장르는 용인되지 않음"], "diff": [{"b": "국", "t": "Swales는 장르를 담화공동체의 의사소통 도구로 규정하고, <b>시드니 학파<\/b>(Halliday, 체계기능언어학)는 언어 구조가 사회적 맥락·기능에 통합되어 있으므로 장르에 맞는 문법·어휘를 명시적으로 교육할 수 있다고 봅니다. 의의는 맥락과 텍스트를 통합할 가능성입니다. 한계는 장르를 ‘의미를 채워 넣는 도식적 틀’로 오인할 때 창의성이 저해된다는 점입니다."}, {"b": "사", "t": "<b>장르 이론의 사적 변화 3단계<\/b>(Dean 2007): 텍스트로서의 장르(형식적 특성) → 수사학으로서의 장르(상황에 대한 반응) → 실천으로서의 장르(장르가 만들어지고 변화하는 과정). 장르의 사회문화적 의미·이데올로기를 비판할 수 있어야 한다고 보며(반성문식·성공담식 자서전 사례), 패턴을 활용하거나 변형하는 글쓰기 모두 사회적 행위로 봅니다."}], "explain": "<p>⚠️ 통합인덱스는 Miller 정의를 3권 공통으로 적지만 표에서는 역락이 ‘—’입니다. 역락 DB에는 장르중심 ‘이론’ 절이 없고 <b>교수법(9장)<\/b>으로만 나옵니다.<\/p>", "src": "국교이 I-4(4) · 사회평론 2장-5(2)"}, {"id": "w11", "name": "후기 과정 쓰기 이론", "warn": false, "exam": "", "scope": "사회평론 고유", "items": ["1990년대 포스트모더니즘 속에서 ‘쓰기 과정은 본질적으로 설명할 수 없다’는 회의가 대두 → <b>후기 과정(post-process)<\/b>", "쓰기 = 사회적 상호작용이자 타인·상황·세계에 대한 해석 행위, 이데올로기를 반영 → 지배적 담론(푸코)에 대한 비판적 인식 → <b>비판주의 쓰기 이론<\/b>", "<b>McComiskey의 ‘사회 과정’ 작문교육<\/b>: 인지주의(사회적 내용 배제)와 사회구성주의(학술 담화공동체 진입에 그침)를 모두 비판"], "diff": [{"b": "사", "t": "<b>대학 안내 책자 프로젝트<\/b>: [과제1] 안내 책자의 문화적·사회적 가치 비판(이상적 학생상 분석 → 배제된 대안적 정체성 → 비판적 에세이) → [과제2] 대안적 담론 생산(원하는 대학의 안내 책자 제작: 브레인스토밍 → 설계 → 초고 → 상호평가 → 완성). 비판이 비판에 그치면 무의미하며, 비판적 담론 분석 → 대안적 담론 생산으로 이어져야 합니다. 두 번째 과제는 전형적인 과정중심 절차를 따르므로, 과정중심을 전면 부정하지 않고 담론적 접근을 결합해 확장한 것입니다."}], "explain": "", "src": "사회평론 2장-5(3)"}, {"id": "w12", "name": "작문 4이론 비교 (니스트랜드 1993 표)", "warn": false, "exam": "", "scope": "사회평론 표 기준", "items": ["<b>분석 단위<\/b>: 객체로서의 텍스트(형식) / 개인의 행동(인지) / 정전·공동체(사구) / 담론으로서의 텍스트(대화)", "<b>텍스트 개념<\/b>: 자율적 의미 단위 / 사고를 언어로 바꾼 것 / 담화관습·규칙의 집합 / 기호론적 중재", "<b>필자 개념<\/b>: 의미의 전달자 / 문제해결자 / 사회화된 구성원 / 대화 참여자", "<b>독자 개념<\/b>: 의미의 수용자 / 능동적·목적적 해석자 / 해석공동체의 구성원 / 대화 참여자", "<b>핵심 원리<\/b>: 모방 / 합리성·개인의도 / 합의 / 상호작용·협상", "<b>의미의 위치<\/b>: 텍스트 / 개인(필자·독자) / 해석공동체 / 필자–독자의 상호작용", "<b>분석 방향<\/b>: 형식적 언어단위 → 글 전체 / 생각 → 언어 / 집단 → 개인 / 변증적"], "diff": [{"b": "국", "t": "장르중심을 넣은 4관점 비교: 형식주의=규칙 학습·반복 연습으로 형성되는 결과적인 것 / 인지주의=개인 인지 과정에 기반한 과정적인 것 / 사회구성주의=담화공동체 상호작용에 기반한 사회적 행위 / 장르중심=장르(사회·문화적 맥락 속 의사소통 도구)로 구현되는 사회적 행위. 네 관점은 상호 배타적이지 않고 균형 있게 추구할 방향입니다."}, {"b": "역", "t": "표 대신 서술식으로 필자 개념(의미 전달자 / 수사적 문제 해결자 / 사회화된 구성원 / 담화자)과 의미의 위치를 비교합니다."}], "explain": "<p>표 형태 문제는 사평 계열, 수업 장면 판별 문제는 국교이 계열일 가능성이 높습니다(통합인덱스).<\/p>", "src": "사회평론 2장-5 · 국교이 I-4 · 역락 2장"}]}, {"title": "B. 작문 능력의 구성 (필자·지식·전략·상위인지)", "cards": [{"id": "w88", "name": "쓰기의 개념과 쓰기의 어려움", "warn": false, "exam": "", "scope": "국교이 고유", "items": ["쓰기 = 문자 기호를 조합해 형식적 <b>응집성(cohesion)<\/b>과 내용적 <b>결속성(coherence)<\/b>을 갖춘 글을 산출하는 행위", "필자–독자–글의 삼각구도 속 의사소통 행위(수사적 상황) + 사회적 상황 맥락 안의 인지적 문제해결 과정", "<b>회귀성<\/b>(선조적이지 않고 반복·순환) + <b>상위인지<\/b>(쓰기 과정을 점검·평가·조정, 회귀성을 가능케 하는 기제)", "쓰기가 말하기·듣기·읽기보다 어려운 이유: 내용을 스스로 생성·조직해야 하고, 독자가 비대면이라 즉각적 반응이 없어 의도 전달 실패 가능성이 큼"], "diff": [{"b": "국", "t": "어려움을 ‘<b>무엇을 쓸지<\/b>(내용 생성)’와 ‘<b>어떻게 쓸지<\/b>(표현 방법)’로 요약합니다. 억양·표정 같은 즉각적 수단이 없어 시간적 압력은 덜하지만 인지적 정보처리 부담이 큽니다. 종합 정의: 고도로 복잡한 인지적 사고 과정과 목표 지향적 문제 해결 과정에 기반한 의사소통 행위."}], "explain": "", "src": "국교이 I-1·2"}, {"id": "w13", "name": "능숙한 필자 vs 미숙한 필자", "warn": true, "exam": "기출 ×3 (전략 활용, 작문 과정 비교)", "items": ["<b>계획하기<\/b>: 미숙=시간을 거의 안 쓰고 좋은 생각을 막연히 기다림 / 능숙=충분한 시간, 자료 탐색·메모", "<b>수사적 상황<\/b>: 미숙=고려하지 않고 자기중심적으로 쏟아냄 / 능숙=독자·목적·과제 의도를 철저히 고려", "<b>초고<\/b>: 미숙=처음부터 완벽한 초고에 대한 강박, 시행착오 / 능숙=브레인스토밍·마인드맵 후 개요, 초고는 고칠 것을 전제", "<b>진행<\/b>: 미숙=개요 없이 곁길 이탈, 분량 채우기 / 능숙=개요·메모에 의지, 내용 흐름에 집중(표현은 뒤로)", "<b>고쳐쓰기<\/b>: 미숙=거의 안 함 / 능숙=계획하기 못지않은 시간", "<b>독자 의식<\/b>: 미숙=자기중심성 / 능숙=사회인지에 기반한 독자 중심"], "diff": [{"b": "국", "t": "표로 정리하고, 교육적 시사점으로 능숙한 필자의 전략을 명시적으로 전략화해 가르쳐야 한다고 봅니다(문제해결과정으로서 작문 지도)."}, {"b": "사", "t": "Flower(1998) 표(계획하기·자료수집·개요·초고·고쳐쓰기)를 실었고, <b>김혜연(2005)<\/b>의 중1 미숙한 필자 해결 전략 3가지를 더합니다: 상위인지 활동의 어려움 → <b>계획 내용의 의도 밝히기<\/b> / 예상독자 인식 부재 → <b>거리두기<\/b>(자기 글과 잘 쓴 글 비교) / 계획하기 인지과정 결여 → <b>자동화 과정에 대한 간섭<\/b>(전체 목표문장을 미리 제시)."}, {"b": "역", "t": "독립 절은 없고 3장에서 간접적으로 다룹니다. 능숙한 필자(Flower 1981)는 충분한 지식과 다양한 기능·전략을 갖고 목표의식으로 일반 전략을 상황에 맞게 선택·변형합니다. 박영목(1994) 성숙한 필자 3조건: 하위 과정의 자동 처리 / 시간 배분의 숙련 / 충분한 정보처리 용량."}], "explain": "<p>미숙한 필자의 <b>자기중심성<\/b>은 ‘돌려 읽기’ 카드로 이어집니다.<\/p>", "src": "국교이 I-3 · 사회평론 2장-3 · 역락 3장"}, {"id": "w14", "name": "작문 능력의 구성과 작문 지식의 유형", "warn": true, "exam": "기출 ×1 (쓰기 지식 및 담화 관습)", "scope": "역락 기준", "items": ["작문 능력 = 지식 + 기능·전략 + <b>상위인지<\/b> (셋을 메타적으로 조정·통제하는 능력을 길러 주는 것이 지향점)", "지식 분류 4가지: Hillocks(1986) / Tribble(2003) / Alexander 외(1991) / Fitzgerald &amp; Shanahan(2000)", "Alexander 체계: <b>사회·문화적 지식<\/b> / <b>개념적 지식<\/b>(내용 지식 + 담화 지식[언어 지식·과제 지식]) / <b>메타인지 지식<\/b>"], "diff": [{"b": "역", "t": "Hillocks: 글의 내용 지식 / 내용을 조직하는 절차적 지식 / 담화 구조·구문·쓰기 관습 지식 / 이 셋을 통합 적용하는 상위 절차적 지식. Tribble: 내용 / 맥락 / 언어 체계 / 글쓰기 과정 지식. Fitzgerald &amp; Shanahan: 메타 지식 / 내용 / 보편적 텍스트 특징 / 절차적 지식. 메타인지 지식은 필자 자신에 대한 인식 + 과제·전략에 대한 인식 + 문제해결 과정 조정 지식입니다. 지식이 풍부해도 이를 활용하는 능력이 따로 필요하며, 그것이 기능·전략의 문제로 이어집니다."}], "explain": "<p>국교이·사평에는 이 절이 없고(간접 언급) 역락 단독 근거입니다.<\/p>", "src": "역락 3장-1"}, {"id": "w15", "name": "장르 지식 (최종윤 2014)", "warn": false, "exam": "", "scope": "역락 고유", "items": ["특정 장르의 관습·규칙에 맞는 글을 쓰기 위해 필요한 지식 (사회·문화적 지식의 하위 범주)", "<b>6분류<\/b>: 의사소통 목적 / 형식(글 구조) / 과정 / 수사적 / 주제 / 담화공동체 지식", "문법·수사학처럼 명제적 지식으로 가르치지 말고 <b>실제 글쓰기 속(맥락 안)<\/b>에서 가르쳐야 함"], "diff": [{"b": "역", "t": "사례 ‘초대장 쓰기’: 문장 유형(평서·의문·명령·청유·감탄) 지식만으로는 명령문을 떠올리기 쉽지만 실제 초대장은 “~오시면 고맙겠습니다”(평서), “~올 수 있습니까”(의문) 같은 간접 표현을 씁니다. 목적·기능·필자와 독자의 관계를 고려해야 적절한 표현을 고를 수 있습니다."}], "explain": "<p>통합인덱스가 「쓰기 지식 및 담화 관습」 기출과 관련 가능하다고 표시한 부분입니다.<\/p>", "src": "역락 3장-1"}, {"id": "w16", "name": "작문 전략 vs 기능", "warn": false, "exam": "", "items": ["<b>전략(strategy)<\/b>: 복합적 사고를 수반하는 의식적 활동, 핵심은 절차적 지식", "<b>기능(skill)<\/b>: 훈련으로 숙달되는 능력, 자동화 지향, 전략보다 미세하고 시간이 덜 드는 조작", "경계가 모호함 — 맞춤법은 초등 필자에게는 의식적 전략, 성인에게는 자동화된 기능", "작문 발달의 과업 = 하위 전략을 충분히 숙달해 <b>자동화된 기능<\/b>으로 전환"], "diff": [{"b": "역", "t": "최현섭 외(2005) 전략 9가지: 생성하기·조직하기·초고 작문·감각적 표현·정교화·점검하기·교정하기·평가하기·활용하기. 기능 5가지: 글자 쓰기·맞춤법·구조화·표현·자료 활용. 능숙한 필자가 여러 문제를 동시에 푸는 듯 보이는 것은 하위 기능이 자동화되었기 때문입니다."}, {"b": "사", "t": "전략(의식적·선택적) ↔ 기능(자동화된 수행)의 구분을 역락과 동일하게 씁니다(4장 도입에서 간략)."}], "explain": "<p>독서 영역의 ‘독서 기능 vs 독서 전략’ 카드와 같은 구분틀입니다.<\/p>", "src": "역락 3장-2 · 사회평론 4장"}, {"id": "w17", "name": "상위인지 전략 (자기 점검·자기 조절)", "warn": true, "exam": "", "items": ["<b>자기 조정(self-regulation)<\/b> = <b>자기 점검<\/b>(자기 기록·자기 질문·자기 평가) + <b>자기 조절<\/b>(자기 교수·자기 강화)", "인지 전략(브레인스토밍·개요·다발짓기·돌려읽기 등) vs 상위인지 전략 = 전략에 대한 전략, 다양한 상황에 범용적", "Flower &amp; Hayes(1980): 문제해결 과정에서 ‘조정하기’를 상위인지 능력으로 강조"], "diff": [{"b": "역", "t": "이재승(2002)·가은아(2011) 체계입니다. 자기 점검은 상위인지 지식으로 자기 인지 과정을 진단하는 것, 자기 조절은 점검 정보로 새 대안을 내놓는 것이며, <b>자기 강화<\/b>는 기준에 도달했을 때 스스로 보상하는 것으로 능숙한 필자가 즐겨 씁니다. 상위인지 전략과 작문 능력 간 밀접한 상관이 여러 연구로 확인됩니다."}, {"b": "사", "t": "독립 장 없이 용어설명 박스로 간략히 다룹니다(자기점검·자기질문·자기평가를 포함한 ‘자기조정’)."}, {"b": "국", "t": "상위인지를 쓰기 과정을 점검·평가·조정하는 기능으로 정의하고, <b>회귀성을 가능케 하는 기제<\/b>라고 설명합니다."}], "explain": "<p>통합인덱스: 역락이 더 세분화된 위계를 제시합니다. 인지주의 기출(×7)의 ‘상위인지 기능’ 항목과 연계 출제될 수 있습니다.<\/p>", "src": "역락 3장-3 · 사회평론 3장 · 국교이 I-1"}]}, {"title": "C. 작문의 정의적 요인", "cards": [{"id": "w18", "name": "정의적 요인 총론 (차가운 인지 vs 뜨거운 인지)", "warn": true, "exam": "", "scope": "역락 기준", "items": ["작문은 연습으로만 학습되므로 자발적 참여를 이끄는 정서 요인이 ‘작문 교육의 첫 관문’, <b>평생 필자<\/b>로의 성장에는 인지 요인(기능·전략)보다 정서 요인(태도·동기·습관)이 더 중요", "<b>차가운 인지<\/b>: 정서·동기·신념을 배제하고 인지만 연구해 온 전통(데카르트적 이성 중심) / <b>뜨거운 인지<\/b>: 정의 요인을 수용하는 대안(박영민 2008a; Hayes 1996) — 대체가 아니라 보완 / <b>통합 인지<\/b>: 둘을 함께 고려", "<b>인지적 무의식<\/b>: 인식되지 않는 인지 과정이 있다는 개념 — 사고구술법으로 포착 못 하는 과정이 있어 기존 모형(차가운 인지 기반)의 한계를 시사"], "diff": [{"b": "역", "t": "정의 요인이 소외된 이유는 관찰·측정·분류가 어렵기 때문입니다. 동기·효능감·불안·윤리를 <b>개별 독립 요인<\/b>으로 나눠 각각 상세히 이론화합니다."}, {"b": "사", "t": "이 모두를 <b>‘작문 태도’라는 상위 개념<\/b>으로 통합해 평가론(9장)에서 다룹니다('작문 태도' 카드)."}], "explain": "<p>⚠️ 정의적 요인은 <b>개별 요인 프레임(역락)<\/b>과 <b>통합 태도 프레임(사평)<\/b>으로 각각 출제될 수 있습니다(통합인덱스).<\/p>", "src": "역락 4장-0 · 사회평론 9장"}, {"id": "w19", "name": "쓰기 동기", "warn": true, "exam": "기출 ×2 (쓰기 윤리 지도 및 쓰기 동기 부여, 윤리와 묶여 출제)", "items": ["쓰기 행동을 <b>시작·유지·방향 결정<\/b>하게 해 주는 심리적 요인", "<b>영역 특수적<\/b>: 독서 동기·학습 동기와 독립적으로 작용(쓰기 동기가 높다고 독서 동기도 높은 것은 아님)", "복합적 구성 개념 — 내적(내재적) 동기 vs 외적(외재적) 동기로 나누지만 경계가 불명확"], "diff": [{"b": "역", "t": "학년별: 작문 능력은 학년이 오를수록 발달하나 쓰기 동기는 비례하지 않고 초등이 오히려 높은 경향입니다(그래서 능력과의 상관은 낮게 나타남). 성별: 여학생이 전 학년에서 유의하게 높습니다. 새 구인 연구: 초등 10요인(이재승 외 2006), 중학생 4요인(박영민 2006: <b>쓰기 효능감·협력적 상호작용·경쟁적 노력·도전심<\/b>). 모형과의 관계: Hayes(1996)에서 쓰기 동기가 인지적 과정 모형의 주요 지위를 처음 얻었습니다(Flower &amp; Hayes 1981에서는 ‘동기화 단서’가 ‘요구사항’으로 바뀌며 사실상 삭제)."}, {"b": "사", "t": "독립 요인이 아니라 작문 태도의 하위 개념으로 흡수해 다룹니다."}], "explain": "", "src": "역락 4장-1 · 사회평론 9장"}, {"id": "w20", "name": "쓰기 효능감", "warn": true, "exam": "", "items": ["Bandura(1986)의 자기효능감을 작문에 적용 — 쓰기를 수행하는 자기 능력에 대한 판단과 성공적으로 수행할 수 있다는 신념", "효과: 관심·흥미 증가, 어려움을 극복하려는 노력 지속, 쓰기 능력을 예언·설명하는 지표", "영향 요인 3가지: <b>성공 경험<\/b>(가장 큼) / <b>대리 경험<\/b>(비슷한 동료의 성취 관찰) / <b>언어적 설득<\/b>(격려·칭찬)"], "diff": [{"b": "역", "t": "자기 평가에 기반하므로 <b>상위인지적 성격<\/b>을 띠고, 자기평가 능력이 부족한 <b>쓰기 부진 학생·남학생<\/b>에게서 <b>과대 추정<\/b>이 나타납니다. 쓰기 동기의 하위 요인으로 보기도, 독립 구성 개념으로 보기도 합니다. 첨삭 지도는 문제점 지적 위주여서 실패 경험만 쌓게 할 수 있고, 효능감이 성취를 직접 높이는 것은 아니며 기능·전략 학습과 노력·몰입을 촉진하는 <b>매개<\/b> 역할을 합니다."}, {"b": "사", "t": "독립 절 없이 동료 평가가 효능감·긍정적 인식 형성에 효과적이라는 정도로 간접 언급합니다(Bandura 1997)."}], "explain": "", "src": "역락 4장-2 · 사회평론 9장"}, {"id": "w21", "name": "쓰기 불안", "warn": false, "exam": "", "scope": "역락 고유", "items": ["평가가 동반된 쓰기 상황을 회피하려는 부정적 감정 상태 (글을 못 쓸 것이고 좋은 평가를 못 받을 것이라는 믿음)", "원인 3가지: <b>쓰기에 대한 잘못된 인식<\/b>(글은 한 번에 완벽히 써야 한다) / <b>자신감 부족<\/b>(효능감과 직결) / <b>쓰기 학습 부족<\/b>", "쓰기 효능감과 대립하는 경향이지만 <b>일대일로 대응하지는 않음<\/b> (효능감이 높아도 상황이 급변하면 불안이 높아질 수 있음)"], "diff": [{"b": "역", "t": "원인은 주로 <b>평가<\/b> 상황이며 초·중·고에 걸쳐 지속되고 학년이 오를수록 증가하는 경향이 있어 방치하지 말고 원인을 진단해야 합니다. ‘한 번에 완벽하게’라는 믿음은 작문의 본질이 과정을 통한 의미 구성이라는 인지주의 관점과 연결됩니다. 극복: 효능감 증진 방안(성공·대리 경험, 언어적 설득), 지식·기능·전략·태도의 충실한 학습."}], "explain": "", "src": "역락 4장-3"}, {"id": "w22", "name": "쓰기 윤리", "warn": true, "exam": "기출 ×2 (쓰기 윤리 지도 및 쓰기 동기 부여)", "scope": "역락·사회평론 공통", "items": ["글을 쓰는 개인·공동체가 쓰기 과정에서 지켜야 할 윤리적 규범", "<b>개인적 차원<\/b>: 아는 내용을 허위로 쓰거나 과장·축소·왜곡하지 않기(<b>진실성<\/b>, 수필·자서전 등) / <b>사회적 차원<\/b>: 타인의 글·자료를 무단 사용하지 않고 허락·출처 명시", "<b>가은아(2009) 4범주<\/b>: 정직하게 쓰기 / 진실하게 쓰기 / 사실대로 쓰기 / 배려하며 쓰기", "특성 3가지: 사회적 관계 속에서 실현 / <b>영역 특수성<\/b>(다른 윤리 수준을 보장하지 않음) / 교육으로 신장 가능"], "diff": [{"b": "역", "t": "전통적으로 표절 위주로 인식되었으나 그것만으로는 불충분합니다(자기표절, 이전 글을 새 글처럼 내보이는 것도 위반). 생성형 AI 확산으로 개념 확장이 필요합니다. 4범주는 정보전달 글쓰기 장에서도 적용되어, 정직하게 쓰기는 표절 방지, <b>사실대로 쓰기<\/b>는 데이터 조작·불리한 결과의 의도적 누락 방지로 특히 중요합니다."}, {"b": "사", "t": "쓰기 윤리를 정보전달 글쓰기 장(10장)에 배치하고 가은아의 4범주를 공유합니다."}], "explain": "<p>4범주는 통합인덱스가 두 책 공통 핵심(🔴)으로 표시했습니다. 지도 방안은 다음 카드를 보세요.<\/p>", "src": "역락 4장-4·11장 · 사회평론 10장"}, {"id": "w23", "name": "쓰기 윤리 지도 방안 (직접적·간접적)", "warn": false, "exam": "", "scope": "역락 고유", "items": ["<b>직접적<\/b>: 가치 탐구 모형(갈등 인식·명료화 → 다양한 관점 → 대안 탐색 → 결과 예측 → 선택·평가 → 가치 판단) / 쓰기 윤리 딜레마(Kohlberg 응용, 토의·논술로 표현) / 쓰기 윤리 제정 활동(학급·학교 단위 규정 제정)", "<b>간접적<\/b>: 반성적 쓰기(참조·인용 자료를 되살려 명시) / 자기 평가(가은아 4범주 체크리스트를 반복 활용) / <b>거울 효과<\/b>(Diener &amp; Wallbom 1976)·상징물(책갈피·배지) 활용"], "diff": [{"b": "역", "t": "거울을 설치하면 부정행위가 줄어드는 것이 거울 효과이며(양심 자극), 상징물은 저학년·쓰기 부진 학생에게 특히 효과적이라고 봅니다."}], "explain": "<p>직접/간접 판별 문제가 나올 수 있습니다: 딜레마·제정 활동=직접, 반성적 쓰기·체크리스트·거울 효과=간접.<\/p>", "src": "역락 4장-4"}, {"id": "w24", "name": "작문 태도 (정의적 영역 평가)", "warn": false, "exam": "", "scope": "사회평론 고유", "items": ["태도의 정의: Fishbein &amp; Ajzen(1975, 일관되게 호의적/비호의적으로 반응하려는 학습된 성향) / Petty &amp; Cacioppo(1981, 지속적인 긍정·부정적 느낌) / Eagly &amp; Chaiken(1993, 평가를 통해 드러나는 심리적 경향)", "<b>윤준채(2009)<\/b>: 작문과 관련해 일관되게 호의적/비호의적 감정 반응을 일으키게 하는 학습된 성향", "측정은 수행·결과물로 불가 → <b>설문조사<\/b>(리커트 척도)"], "diff": [{"b": "사", "t": "McKenna 외(2000)는 초1~고3 대상 표준화 도구(저학년은 그림으로 반응)를, 오택환(2009)은 국내 25문항 설문(필요성 인식·흥미·어려움·습관 등)을 제시합니다. 설문 결과는 ‘현재’ 상태일 뿐이며 학습된 성향이라 교육적 처치로 개선될 수 있습니다. 다만 태도 향상이 실제 작문 능력 향상으로 이어지는지에 대해서는 신뢰할 연구가 부재합니다."}], "explain": "<p>국어과 교육과정 정의: ‘언어적 실체·행위·현상에 대한 개인의 선택에 영향을 미치는 학습된 성향’(사평 인용).<\/p>", "src": "사회평론 9장-3(2)"}]}, {"title": "D. 작문 능력의 발달", "cards": [{"id": "w25", "name": "Bereiter(1980) 작문 능력 발달 5단계", "warn": true, "exam": "기출 ×1 (베레이터의 쓰기 능력 발달 단계: 수행적 쓰기)", "scope": "역락 고유", "items": ["1 <b>단순 연상적<\/b>: 머릿속 생각을 그대로 문자로 옮김, 미숙한 필자의 수준 (가장 어려운 것은 쓸거리 찾기)", "2 <b>언어 수행적<\/b>: 어법·문체·규칙·관습에 익숙해짐 (지속 연습 필요)", "3 <b>의사소통적<\/b>: 독자를 고려해 씀 (사회인지 기능, 예상 독자에게 영향을 미칠 장치 마련)", "4 <b>통합적<\/b>: 필자 스스로 독자가 되어 자기 글을 감상·비판, 자신을 확신시키기 위한 논증 가능 (논술문·논설문)", "5 <b>인식적<\/b>: 정보 저장·인출·처리·재고·교정 등을 통합, 확산적·수렴적 사고로 창조적 사고가 가능한 최고 수준"], "diff": [{"b": "역", "t": "<b>유의점<\/b>: 엄격한 위계가 아니라 개인별로 정체·건너뜀·중첩·퇴행이 가능하고, 장르(서사 vs 설명)에 따라 같은 필자도 다른 단계에 놓일 수 있습니다. 국내 대응 연구로 이성영(2000)이 1학년 단순연상적 / 2~3학년 언어수행적 / 4~5학년 의사소통적 / 6학년 통합적 글쓰기를 제시합니다. 생성형 AI 활용 교육(14장)에서 하위 단계의 무분별한 AI 허용이 발달을 저해할 수 있다는 근거로도 재인용됩니다."}], "explain": "<p>통합인덱스: 발달단계는 국교이·사평이 체계화하지 않아 <b>역락 단독 출제 근거<\/b>이나, 기출 실적(×1)이 있습니다. 단계의 특성과 순서가 출제 대상입니다.<\/p>", "src": "역락 5장-2 · 14장"}, {"id": "w26", "name": "기초 문해력의 발달 (발생적 문해력·글자 쓰기 단계)", "warn": false, "exam": "", "scope": "역락 고유", "items": ["<b>발생적 문해력<\/b>: 유아가 문자 경험 속에서 문해력의 기초 조건(책에는 의미가 있다, 왼쪽에서 오른쪽으로 읽는다 등)을 자연스럽게 인식하며 갖춰 가는 과정 — 형식적 철자 훈련 중심에서 자연적 습득 관점으로 전환", "<b>창안적 글자 쓰기<\/b>: 관습적 철자를 알기 전 스스로 만든 글자를 쓰는 것, 초기 쓰기 발달의 출발점", "Gentry(1981, 영어권) 5단계: 문자 이전 → 준음성적 → 음성적 → 전이적 → 정확한 단계", "조선하·우남희(2004, 한국어) 6단계: 창안적 철자 출현 전 → 문자 형태 출현 → 미완성적 문자 출현 → 음절 수 인식(4-1)·음에 따른 철자 인식(4-2) → 불완전한 표준 글자 쓰기 → 표준 철자"], "diff": [{"b": "역", "t": "이영자·이종숙(1990) 기초 쓰기 6단계는 긁적거리기 → 자형이 우연히 출현 → 자형이 의도적 출현 → 글자 형태는 있으나 자모 방향 오류 → 단어 쓰기 → 문장 쓰기입니다. 단계 구분은 절대적이지 않으며 가정·학교의 문해 환경과 성인과의 상호작용이 결정적입니다. 기초 기능(소리-문자 단순 대응)만 보는 탈맥락적 입문기 교육은 고등 문해력의 밑거름이 되지 못하므로 유아기부터 이름 쓰기·쪽지·저널 같은 실제적 기회가 필요합니다."}], "explain": "<p>한국어 특유 단계는 조선하·우남희의 ‘음절의 수 인식’ 단계(음절 수와 글자 수가 일치하기 시작)입니다.<\/p>", "src": "역락 5장-1"}, {"id": "w27", "name": "초등학생 필자의 작문 발달 수준", "warn": false, "exam": "", "scope": "역락 고유", "items": ["Lesley &amp; Paul(2007) <b>쓰기 발달 연속체<\/b>: 학령기 전 → 실험적/초기 쓰기(저학년) → 발전되어 가는 필자(중학년) → 능숙한 필자(고학년)", "이성영(2000): 1학년 단순연상적 / 2~3학년 언어수행적 / 4~5학년 의사소통적 / 6학년 통합적 글쓰기 (Bereiter 대응)", "이순영·유승아(2023, 종단연구): 1~3학년 <b>급격한 발달기<\/b> → 4·5학년 <b>완화된 발달기<\/b> → 6학년 <b>발달 정체기<\/b> (4학년이 질적 변화의 분기점)"], "diff": [{"b": "역", "t": "임천택(2005): 저학년일수록 발달이 가파르고 고학년은 더디며, 내용 요소의 발달폭이 가장 크고 목적 요소가 가장 작습니다(목적·내용·조직·표현이 같은 양상으로 발달하지 않음). 가은아(2011): 3·4학년(정보 나열, 문단 구분 미흡) → 5·6학년(글 양 증가, 독자 인식 뚜렷, 내용 구체화). Lesley &amp; Paul 세부: 초기 쓰기는 일상 경험을 자기중심적 반복 문장으로, 발전 단계는 다양한 글 형태와 복문·타인 감정 인식, 능숙 단계는 상호텍스트성·비유·복잡한 문장·자기교정."}], "explain": "<p>개별 연구자명보다 <b>단계의 특성과 순서<\/b>가 출제 대상입니다(역락 원문 표시).<\/p>", "src": "역락 5장-1"}, {"id": "w28", "name": "고등 사고력과 작문 발달", "warn": false, "exam": "", "scope": "역락 고유", "items": ["고등 사고력 5대 하위 능력(이미숙 외 2019): <b>비판적·창의적 사고, 문제 해결 능력, 논리적·분석적 사고<\/b>", "작문이 고등 사고력에 기여하는 경로: ①생각의 명료화·구조화 ②창의적 사고 촉진 ③비판적 사고 강화(주장-이유-근거, 반론 예상) ④의사소통 능력 발달 ⑤사회인지적 상호작용 촉진", "작문 능력 발달의 두 국면: 기초 문해력(유아기~초등 저학년) + 고등 사고력(초등 중학년~성인기), 절대적 구분은 아님"], "diff": [{"b": "역", "t": "발달은 하위 체계 기능을 자동화한 뒤 더 높은 수준 체계의 기능을 통합·자동화하는 방식으로 점진적으로 이루어집니다(박영목 1994). Bloom은 고등 사고를 분석·종합·평가의 상위 수준으로 분류합니다."}], "explain": "", "src": "역락 5장-2"}]}, {"title": "E. 작문 과정과 과정 모형", "cards": [{"id": "w29", "name": "작문 과정의 구분 (연구자별·용어 변이)", "warn": true, "exam": "", "scope": "사회평론 기준 (표 체계)", "items": ["일반적 5단계: 계획하기 → 내용 생성하기 → 내용 조직하기 → 표현하기 → 고쳐쓰기, 이 전체를 <b>조정하기<\/b>(상위인지)가 점검·통제", "구분 방식의 두 축: ①초고 작성 <b>전<\/b> 활동을 세분(인지적 사고과정 강조: 이재승·박영목·정혜승) ②초고 작성 <b>후<\/b> 활동을 세분(사회문화적 과정 강조: Tompkins의 편집하기·출판하기)", "<b>조정하기<\/b>는 ‘쓰는 글’이 아니라 ‘쓰기 과정 자체’를 점검·통제하는 상위인지 과정"], "diff": [{"b": "사", "t": "연구자별 비교표: Rohman &amp; Wlecke(1964, 쓰기 전-쓰기-쓰기 후) / 박영목 외(1996, 아이디어 생산-텍스트 생산-고쳐쓰기) / Flower &amp; Hayes(1981, 계획하기-작성하기-평가하기·고쳐쓰기[+조정하기]) / 이재승(2002)·박영목(2013, 계획-생성-조직-표현-수정) / 정혜승(2013, 과제해석-계획-작성-수정·편집[+조정하기]) / Tompkins(2012, 쓰기 전-초고-고쳐쓰기-편집하기-출판하기) / 박영민 외(2016, …-수정-<b>작품화하기<\/b>) / 2022 개정(계획-생성-조직-표현-고쳐쓰기-<b>공유하기<\/b>[+점검과 조정]). ‘작품화하기’는 형태화 활동을, ‘공유하기’는 상호작용을 부각합니다. 상황 요인(필자의 수준·과제)으로 구분한 것이 Bereiter &amp; Scardamalia(1987)의 지식 나열/변형 모형입니다."}, {"b": "역", "t": "5단계 + 조정하기를 일반적 과정으로 정립하고, ‘공유하기’를 작문 수업 상황으로 확장된 단계로 덧붙입니다."}, {"b": "국", "t": "쓰기 과정을 계획하기→생성하기→조직하기→표현하기→고쳐쓰기로 보되 비선조적으로 순환·반복된다고 설명합니다."}], "explain": "<p>통합인덱스: 국교이·역락은 5(+1)단계 공통이고, 사평이 용어 변이를 표로 병기하는 등 <b>메타적 정리가 가장 상세<\/b>합니다.<\/p>", "src": "사회평론 3장-1 · 역락 6장 · 국교이 I-1"}, {"id": "w30", "name": "작문 과정의 성격 (회귀성·상호작용성·동시성)", "warn": true, "exam": "인지주의 기출 ×7 중 ‘회귀성’ 항목과 연계", "items": ["<b>회귀성<\/b>: 이후 과정으로 나아가다가도 언제든 이전 과정으로 되돌아감 — 상위인지의 점검·조정 결과, 능숙한 필자의 특성", "<b>상호작용성·동시성<\/b>: 각 과정이 독립적이지 않고 서로 영향을 주고받으며 동시·병행적으로 작동", "비유(사평): 컨베이어벨트식 일직선 조립이 아니라, 거시적으로는 순차적이나 미시적으로는 경계를 넘나드는 과정"], "diff": [{"b": "역", "t": "<b>Flower(1993)<\/b>: 일반 모형에서는 초기엔 계획→생성→작성→편집이 단선적으로 진행되다가 일정 시간 후 이전 단계로 회귀합니다(예: 고쳐쓰기 중 계획하기로 돌아가 세부 목표 수정). 상호작용 예: 조직 중 새 내용 생성, 생성된 내용에 따라 조직 변경. <b>De Beaugrande(1984) 단계 병행적 상호작용 모형<\/b>은 요소들이 기본적으로 동시에 작용한다고 보아 ‘단계’ 자체가 성립할 수 없다는 가장 급진적인 입장입니다."}, {"b": "사", "t": "동시성은 De Beaugrande(1984)의 단계 병행적 상호작용 모형으로, 회귀성은 상위인지(조정하기)의 작동으로 설명합니다(역락과 동일)."}, {"b": "국", "t": "회귀성(recursiveness): 계획→생성→조직→표현→고쳐쓰기가 선조적이지 않고 반복·순환하며, 이를 가능케 하는 기제가 상위인지라고 봅니다."}], "explain": "<p>회귀성은 형식주의의 선조적 관점과 대비되는 인지주의의 핵심 개념입니다.<\/p>", "src": "역락 6장-2 · 사회평론 3장-2 · 국교이 I-1"}, {"id": "w31", "name": "Rohman &amp; Wlecke(1964) 단계적 작문 모형", "warn": false, "exam": "", "scope": "역락·사회평론 공통", "items": ["작문을 결과물이 아닌 <b>과정<\/b>으로 보기 시작한 최초의 시도 — 쓰기 전(prewriting) → 쓰기(writing) → 쓰기 후(postwriting)의 시간 순 3단계", "특히 ‘쓰기 전’ 단계(의미 발견·개념 형성, 배경경험 활성화)를 핵심으로 처음 강조", "한계: 선조적·일방향적 → 회귀적·상호작용적인 작문 과정의 본질을 못 보여줌"], "diff": [{"b": "사", "t": "‘본격적인 쓰기 과정 모형으로 보기에는 무리’라고 재평가합니다(동시성·회귀성·영향요인 미반영). 그러나 결과중심 교육이 만연하던 1960년대에 과정에 대한 관심을 환기해 <b>과정중심 쓰기교육의 토대<\/b>를 마련한 의의는 인정합니다."}, {"b": "역", "t": "엄밀한 의미의 과정모형은 아니나 과정에 대한 관심을 촉발했다고 평가하고, 이후 Emig(1971, 회귀성 규명)·Flower &amp; Hayes(1980)로 이어진다고 서술합니다."}], "explain": "<p>사평의 ‘과제 제시-오류 점검형’ 결과중심 모형(이성영 1996)은 이 단계적 모형에 기반합니다.<\/p>", "src": "역락 6장-1 · 사회평론 3장-4"}, {"id": "w32", "name": "Flower &amp; Hayes(1981) 인지적 작문 과정 모형", "warn": true, "exam": "인지주의 기출 ×7 중 ‘생성적 과정 모형’과 연계", "scope": "역락·사회평론 공통", "items": ["능숙한 필자의 사고구술 자료를 분석해 개발 — 과정 중심 작문 교육 태동에 결정적", "<b>3대 구성 요인<\/b>: 과제 환경(수사적 문제[화제·독자·요구사항] + 지금까지 작성한 텍스트) / 필자의 장기 기억(화제·독자·쓰기 계획에 대한 지식) / 작문 과정", "<b>작문 과정<\/b>: 계획하기(생성하기·조직하기·목표 설정하기) → 작성하기(translating) → 검토하기(평가하기·수정하기), 전체를 <b>조정하기<\/b>가 점검·통제"], "diff": [{"b": "역", "t": "1980년 모형의 ‘동기화 단서(motivating cues)’가 1981년 모형에서 ‘요구사항(exigency)’으로 대체되었고(필자의 동기와 구분), 화살표 수정으로 회귀성·상호작용성이 더 명료해졌습니다. 1980년 검토하기가 초고를 읽고 편집하는 데 초점을 둔 반면 1981년 모형은 계획·작성 중에도 평가·수정이 동시에 일어남을 보여 줍니다. 모형 전개: Hayes &amp; Flower(1980) → Flower &amp; Hayes(1981) → Hayes(1996) → Chenoweth &amp; Hayes(2001) → Hayes(2012). <b>한계<\/b>: 과정의 지나친 단순화, 사회·문화·역사적 맥락과 정의적 요인 경시, 결과물 텍스트 경시."}, {"b": "사", "t": "역락과 대체로 동일합니다. 계획하기를 필자가 쓸 글에 대한 <b>내적 표상(internal representation)<\/b>을 구성하는 행위로 명시하고(추상적 이미지 형태도 가능, 쓰기 내내 변화), 작성하기는 그 표상을 문자언어로 옮기는 행위로 정의합니다."}], "explain": "<p>‘생성적 과정 모형’ 표현은 통합인덱스의 기출 항목명이며, 내용상 이 모형(과정의 생성·계획·작성)과 연결된다고 표시되어 있습니다.<\/p>", "src": "역락 6장-3 · 사회평론 3장-4"}, {"id": "w33", "name": "Hayes(1996) 개인-환경 상호작용 모형", "warn": true, "exam": "", "scope": "역락·사회평론 (국교이는 개념만 간접 공유)", "items": ["Flower &amp; Hayes(1981)를 대폭 수정 — 인지심리학 성과 + 사회구성주의 관점 수용, <b>개인과 과제 환경의 상호작용<\/b>으로 설명", "<b>과제 환경 세분화<\/b>: 사회적 환경(독자 + <b>협력자<\/b>) / 물리적 환경(작성한 텍스트 + <b>작문 매체<\/b>)", "<b>개인<\/b>: 동기/정서(신설) · 장기 기억(과제 스키마·언어 지식·장르 지식 등) · <b>작업 기억<\/b>(신설, Baddeley 이론, 모형 중앙) · 인지 과정(텍스트 해석 / 반성 / 텍스트 생산)"], "diff": [{"b": "역", "t": "동기/정서에는 목표·성향·신념과 태도·비용/편익 판단이 들어가 정의적 요인이 작문 과정에 중요함을 처음 명시했습니다. 작업 기억은 음운론적 기억·시공간 잡기장·의미론적 기억으로 구성됩니다. 인지 과정은 텍스트 해석(읽어 내기·심적 표상) / <b>반성<\/b>(문제해결·의사결정·추론) / 텍스트 생산으로 간략화하며, ‘수정하기’는 세 하위 요소 모두에서 다른 방식으로 일어납니다. 여전히 능숙한 필자 중심이라 미숙한 필자 고려는 부족합니다."}, {"b": "사", "t": "용어가 다릅니다: 인지과정을 <b>텍스트 해석<\/b>(읽기 활동 전반) / <b>숙고<\/b>(계획하기에 대응, 문제해결적 사고 전반) / <b>텍스트 생산<\/b>으로 재구성하고, 고쳐쓰기는 세 과정 모두에서 일어나므로 별도 항목을 두지 않습니다. 장기기억을 과제스키마·화제지식·독자지식·언어지식·장르지식으로 세분화하고 쓰기계획 지식은 삭제합니다. 헤이즈 스스로 이 모형이 사회구성주의가 아닌 <b>인지주의 관점의 개인적 환경모형<\/b>임을 밝힙니다(사회문화적·상호텍스트적·상황 맥락 고려 부족을 인정)."}], "explain": "<p>⚠️ ‘반성’(역락) = ‘숙고’(사평)로 같은 자리의 용어 차이입니다. 통합인덱스는 개념은 3권 공통(🔴), 모형 자체는 역락·사평이라고 표시합니다.<\/p>", "src": "역락 6장-3 · 사회평론 3장-4"}, {"id": "w34", "name": "지식 서술(나열) 모형 vs 지식 변형 모형", "warn": true, "exam": "기출 ×1 (지식 나열 모형)", "scope": "역락·사회평론 공통", "items": ["Bereiter &amp; Scardamalia(1987): 미숙한/능숙한 필자의 차이를 설명하려고 제시 (미숙한 필자는 F&amp;H의 ‘생성하기’가 활발히 작동하지 않음)", "<b>지식 서술(나열) 모형<\/b>: 과제 표상 → 화제·장르 식별자 → 기억 탐색자 구성 → 내용·담화 지식 검색 → 적절성 검토 → 작성. 지식이 바닥나면 쓰기를 그만둠", "<b>지식 변형 모형<\/b>: ‘문제 분석 및 목표 설정’ 추가, <b>내용 문제 공간<\/b>과 <b>수사적 문제 공간<\/b>을 오가며 지식을 계속 변형·교환"], "diff": [{"b": "역", "t": "지식 서술 모형은 전사하기(손글씨·철자)가 미숙해 인지 자원을 대부분 전사에 쓰는 필자의 특성도 설명합니다. <b>유의점<\/b>: 미숙한/능숙한 필자와 일대일 대응이 아니며(능숙한 필자도 쉬운 과제에서는 지식 서술 방식), 두 모형은 발달적 대체 관계가 아니라 <b>수행 능력의 두 극단<\/b>이며 지식 서술은 지식 변형에 포함되는 관계입니다."}, {"b": "사", "t": "동일하게 서술하되 이견을 붙입니다: 지식변형은 창의적 내용 생성이 필요한 과제를 하는 능숙한 필자의 과정, 지식나열은 미숙한 필자의 모든 과제와 능숙한 필자의 간단한 과제(예: 전화 메모)에서 쓰입니다. 필자의 쓰기 수준·과제에 따라 과정을 나눈 ‘상황 요인 기준’ 구분의 대표입니다."}], "explain": "<p>빈도(×1)는 낮지만 개념이 역락·사평 2권에 걸쳐 있으니 소홀히 하지 마세요(통합인덱스 혼동 주의 5).<\/p>", "src": "역락 6장-3 · 사회평론 3장-4"}, {"id": "w35", "name": "수사적 상황 (필자·독자·주제/목적·상황)", "warn": true, "exam": "기출 ×3 (수사적 상황 및 맥락: 상황 맥락, 독자 분석, 필자 입장, 독자 위치 부여)", "scope": "역락·사회평론 (수사학 절)", "items": ["필자가 글을 쓸 때 고려해야 할 상황: 필자·독자·주제·목적·상황(시공간적 배경, 매체)", "Flower(인지주의 대표)는 <b>수사적 상황의 이해를 글쓰기의 첫 번째 전략<\/b>으로 꼽음", "능숙한 필자는 독자·목적·과제 의도를 철저히 고려, 미숙한 필자는 자기중심적", "Flower &amp; Hayes 모형의 과제 환경 = 수사적 문제(화제·독자·요구사항) + 작성한 텍스트"], "diff": [{"b": "사", "t": "독자는 아리스토텔레스의 수동적 청중에서 신수사학의 논증 방향을 결정하는 동등한 주체로 격상됩니다(‘독자 개념의 두 계보’ 카드). 수사적 상황 분석은 장르중심 이론(수사적 상황에 대한 반응으로서의 텍스트 언어 특징)으로도 이어집니다."}, {"b": "역", "t": "수사학 절에서 필자·독자를 다루고, 정보전달 글에서는 필자가 수사적 상황(무엇이 중요한지, 독자가 무엇을 궁금해할지, 정보를 어떻게 조직할지)을 분석·결정한 결과가 좋은 설명문이라고 봅니다(Blasingame &amp; Bushman 2005)."}], "explain": "<p>국교이는 간접 반영입니다. 기출 요소(독자 분석·독자 위치 부여)를 보면 <b>필자가 독자를 어떻게 상정하는가<\/b>가 핵심입니다.<\/p>", "src": "역락 2장-1 · 사회평론 2장-1"}, {"id": "w36", "name": "쓰기 과정의 영향 요인 — 3층위 맥락 (정혜승 2013)", "warn": false, "exam": "「수사적 상황 및 맥락」 기출 ×3과 연계", "scope": "사회평론 고유", "items": ["<b>거시적 맥락<\/b>(사회문화적 맥락): 쓰기 과정 외부에서 전체를 통어·조정하는 기반(역사·사회·문화적 상황, 공동체의 신념·가치·지식체계, 언어·장르 관습)", "<b>텍스트 간 맥락<\/b>(상호텍스트적 맥락): 필자가 읽어 온 모든 텍스트~쓰려는 텍스트와 주제·장르로 연결된 선행 텍스트의 영향", "<b>과제 특수적 맥락<\/b>(상황 맥락): 쓰기 과정에 직접 관여하는 국지적·미시적 요인 — 독자, 텍스트 유형, 시공간, 매체, 시간·분량"], "diff": [{"b": "사", "t": "거시적 맥락 사례: 한일전 사설을 쓰는 논설위원의 쓰기에 한일 역사관계·국민정서가 필연적으로 영향을 줍니다. 텍스트 간 맥락 사례: 연구논문의 ‘선행연구 검토’(필자의 정체성·지식체계·작문 목적·화제 특성과 입장 포함)."}], "explain": "<p>독서 영역의 ‘맥락(상황 맥락 vs 사회문화적 맥락)’ 카드와 짝지어 보세요.<\/p>", "src": "사회평론 3장-3"}]}, {"title": "F. 작문 과정별 전략", "cards": [{"id": "w37", "name": "계획하기 전략 (과제 점검·맥락 묻고 답하기·협력적 계획)", "warn": false, "exam": "", "scope": "역락 기준 (사평도 2가지)", "items": ["<b>작문 과제 점검하기<\/b>: 목적·화제·독자·글의 유형·분량/시간 등을 점검표로 스스로 점검(쓰기 전·중·후 모두 가능)", "<b>작문 맥락 묻고 답하기<\/b>: 과제·필자 특성(방해 요인과 해결책)·독자 특성(기대 반영)·소통 맥락(매체)을 스스로 또는 친구와 묻고 답함", "<b>협력적 계획하기<\/b>: 협력자(친구·교사)와 목적·핵심 내용·독자 반응·형식을 이야기하며 계획 발전"], "diff": [{"b": "사", "t": "계획하기 전략을 <b>과제 맥락 분석하기<\/b>(질문목록형: 형식·분량·기한·독자·주제)와 <b>세부 계획 수립하기<\/b>(화제·목적·독자·역할을 스스로 묻고 답함) 2가지로 정리하며, 각각 역락의 ‘작문 과제 점검하기’, ‘작문 맥락 묻고 답하기’와 유사하다고 봅니다."}, {"b": "역", "t": "능숙한 필자는 충분한 시간을 들여 계획하고 탄력적으로 수정하는 반면, 미숙한 필자는 계획 없이 시작하고 한번 세운 계획을 잘 바꾸지 않습니다."}], "explain": "<p>명칭만 다르고 같은 전략인 경우가 많으니 사평↔역락 대응을 익혀 두세요.<\/p>", "src": "역락 6장-4 · 사회평론 4장"}, {"id": "w38", "name": "내용 생성하기 전략", "warn": false, "exam": "기출 ×2 (내용 생성 전략: 스키마 활용, 낯선 주제 대처)", "items": ["<b>브레인스토밍<\/b>: 거리낌 없이 생각을 떠올려 모음, 사고의 양이 질을 결정, 모둠에서는 비판·평가 금지(Osborn)", "<b>생각 그물 만들기<\/b>: 도형·선·화살표로 중심 개념에서 아이디어를 확장, 관계를 고려해 체계적으로 생성(Buzan)", "<b>이야기 나누기(대화하기)<\/b>: 타인과의 언어적 상호작용으로 생성 — 자유 대화~토의·토론·면담·협상, 가상 면담도 가능", "<b>관련 자료 읽기(다양한 관점에서 읽기)<\/b>: 글·그림·영상·표 등 복합양식 자료로 정보 마련, 신뢰할 근거 마련에 필수"], "diff": [{"b": "역", "t": "내용 생성은 필자 내부(경험·배경지식)와 외부(문헌·면담·담화공동체와의 대화) 양쪽에서 일어나고, 이야기 나누기는 동료·교사가 독자 역할을 겸하므로 과정 요인과 맥락 요인을 함께 고려합니다. 최현섭 외(2005) 생성하기 전략: 브레인스토밍·그림 그리기·조사·관찰·인터뷰·토의·관련 텍스트 읽기·자유연상."}, {"b": "사", "t": "대화하기(=역락 이야기 나누기)와 <b>다양한 관점에서 읽기<\/b>를 부제로 강조합니다. 편향 없는 자료 수집을 위해 상반된 입장의 자료를 함께 읽도록 하는 취지로 보입니다(원문 추정 표기)."}], "explain": "<p>스키마 활용(내용 지식), 낯선 주제 대처(관련 자료 읽기·이야기 나누기)가 기출 항목입니다.<\/p>", "src": "역락 6장-4 · 사회평론 4장-3"}, {"id": "w39", "name": "생각 그물 vs 다발 짓기 (구분)", "warn": false, "exam": "", "scope": "역락·사회평론 일치", "items": ["<b>생각 그물<\/b>(마인드맵): 아이디어 <b>생성<\/b> 단계 — 중심 개념에서 뻗어 나가는 나열적·확장적 활동", "<b>다발 짓기<\/b>(클러스터링): 아이디어 <b>조직<\/b> 단계 — 생성한 아이디어를 기준으로 묶어 관계·구조를 시각화", "브레인스토밍은 나열적 / 생각 그물은 관계적·위계적 (역락)"], "diff": [{"b": "역", "t": "생각 그물은 브레인스토밍과 달리 아이디어 간 관계를 고려해 체계적으로 생성하는 점이 특징이며, 좌뇌(논리·분석)와 우뇌(직관·이미지)를 통합하는 활동이라는 근거가 제시됩니다. 다발 짓기는 형식이 고정되지 않고 유연합니다."}], "explain": "<p>통합인덱스: 두 책이 동일하게 구분하며(🔴), 이 구분 자체가 빈출 가능합니다. 내용 생성 기출(×2)·조직하기 기출(×2)과 걸칩니다.<\/p>", "src": "역락 6장-4 · 사회평론 4장-3·4"}, {"id": "w40", "name": "내용 조직하기 전략 (개요 짜기·다발 짓기)", "warn": false, "exam": "기출 ×2 (조직하기 전략: 의미지도, 내용 조직, 개요 작성)", "items": ["<b>다발 짓기<\/b>: 생성한 아이디어를 기준으로 묶어 도형·선·화살표로 시각화 — 나열 / 시간·공간 순서 / 비교·대조 / 원인과 결과 / 문제와 해결 구조를 활용", "<b>개요 짜기<\/b>: <b>화제 개요<\/b>(단어·어구, 작성 쉽고 구조 파악 용이하나 쓸 때 보강 필요) vs <b>문장 개요<\/b>(완결된 문장, 작성은 어렵지만 바로 가져다 쓸 수 있음)", "개요를 한번 짜면 수정 못 한다는 경직된 적용은 창조적 사고 흐름을 방해 — 필요 시 수정 가능함을 안내"], "diff": [{"b": "역", "t": "조직하기는 확산된 아이디어를 범주화·명칭 부여하여 모으는 것이 핵심이며 글 구조 지식·담화 지식이 작용합니다. 다발 짓기에 쓰는 구조 5가지는 정보전달 글의 내용 조직 5구조와 같습니다."}, {"b": "사", "t": "‘다발 짓기’와 ‘개요 짜기’를 동일 명칭으로 다룹니다(역락과 동일)."}, {"b": "국", "t": "쓰기 전 단계에서 브레인스토밍·마인드맵으로 아이디어를 생성하고 다발 짓기 등으로 조직화하며, 교사는 미니레슨·시범으로 비계를 제공합니다."}], "explain": "", "src": "역락 6장-4 · 사회평론 4장-4 · 국교이 II-2(2)"}, {"id": "w41", "name": "표현하기 전략 (말로 쓰기·내리 쓰기)", "warn": false, "exam": "기출 ×1 (표현하기 단계 전략)", "scope": "역락·사회평론 (명칭 동일)", "items": ["<b>내리 쓰기<\/b>(=자유 쓰기·얼른 쓰기): 화제 관련 내용을 10~15분간 멈춤 없이 빠르게 씀 — 맞춤법·문단·목적·독자에 얽매이지 않음", "<b>말로 쓰기<\/b>(=구두 작문): 초고를 글이 아닌 말로 표현 — 다발 짓기·개요를 단서로 이야기하듯 말함", "공통 핵심: 문자언어화 과정에서 의미 구성을 방해하는 제약을 제거해 인지 부담을 줄임 → 미숙한 필자에게 특히 유용"], "diff": [{"b": "역", "t": "내리 쓰기는 완벽한 초고에 대한 부담으로 시작을 못하는 학생에게 성취감·자신감을 줍니다(Elbow: 막히면 막힌 느낌 자체를 쓰거나 직전 단어를 반복). 구두 작문은 망각·왜곡이 줄고 문법·형식의 인지부담을 의미 구성에 재할당할 수 있으며, 특정 독자를 설정해 말하면 반응을 즉각 확인할 수 있습니다(녹음 권장). 지도 유의점: 완벽한 초고 부담 제거, 형식보다 의미 구성 우선, 초고 이후 수정 가능함 안내."}, {"b": "사", "t": "‘말로 쓰기’(=구두 작문), ‘내리 쓰기’(=자유 쓰기)로 부릅니다."}, {"b": "국", "t": "초고는 고쳐 쓸 것을 전제로 쓰는 글이며, 띄어쓰기·맞춤법 등 형식은 신경 쓰지 않고 내용에만 집중해 빠른 속도로 작성한다고 설명합니다(초고 쓰기 단계)."}], "explain": "", "src": "역락 6장-4 · 사회평론 4장-5 · 국교이 II-2(2)"}, {"id": "w42", "name": "고쳐쓰기 전략 (훑어 읽기·돌려 읽기·점검하기)", "warn": true, "exam": "기출 ×5 최빈출 (훑어읽기·돌려읽기·독자/상위인지 고려·내용/조직/표현 수정)", "items": ["<b>훑어 읽기<\/b>: 초고를 처음부터 끝까지 한 번에 훑으며 문제점 발견 — 지엽적(맞춤법)보다 <b>전체<\/b>(주제 명확성·내용 통일성·구조 적절성) 먼저, 일정 시간이 지난 뒤 사용하면 효과적(객관화)", "<b>돌려 읽기<\/b>: 초고를 다른 사람과 돌려 읽으며 보완·수정점 찾기 — 필자 중심 → <b>독자 중심<\/b> 글쓰기 경험, 건설적·구체적 피드백", "<b>점검하기<\/b>: 점검 질문으로 꼼꼼히 평가, <b>거시(글 전체) → 미시(문단→문장→단어)<\/b> 순으로 진행", "고쳐쓰기는 맞춤법 등 기계적 오류보다 <b>내용적 측면<\/b>(독자의 이해, 필자 의도 전달)에 우선 초점"], "diff": [{"b": "역", "t": "훑어읽기·돌려읽기·점검하기를 <b>3개의 병렬 전략<\/b>으로 제시합니다. 점검하기는 자기 글·타인 글 모두에, 개별로도 협의로도 사용할 수 있습니다."}, {"b": "사", "t": "훑어읽기·돌려읽기 <b>2종<\/b>만 다루고(점검하기는 목차에 없음), 훑어읽기의 <b>하위 전략<\/b>으로 CDO 전략과 ‘점검 질문 사용하기’(박영목 2013: 글 전체 → 문단·문장 → 어휘·표기 순)를 둡니다."}, {"b": "국", "t": "고쳐쓰기 단계에서 수정 전에 소집단에서 동료와 공유하고 <b>작가석<\/b>에서 발표·피드백을 받는 경험으로 글쓰기가 독자를 전제로 하는 활동임을 인식시킵니다. 형식적 오류 교정은 별도의 <b>편집하기<\/b> 단계입니다."}], "explain": "<p>⚠️ <b>전략의 개수·위계<\/b>가 다릅니다: 역락 3병렬 vs 사평 2종(점검은 훑어읽기 하위). 개수를 묻는 문제는 책에 유의하세요. 국교이는 ‘고쳐쓰기’와 ‘편집하기’를 구분합니다.<\/p>", "src": "역락 6장-4 · 사회평론 4장-6 · 국교이 II-2(2)"}, {"id": "w43", "name": "CDO 전략 (비교-진단-실행)", "warn": false, "exam": "고쳐쓰기 전략 기출 ×5의 세부 유형 가능성 (미확인)", "scope": "사회평론 고유", "items": ["능숙한 필자가 훑어 읽기 때 자동으로 쓰는 전략을 미숙한 필자에게 <b>명시적으로 훈련<\/b>시키는 도구 (전략 카드 활용, 점차 자동화)", "<b>C<\/b>ompare(비교): 작성한 글을 의도했던 글과 비교", "<b>D<\/b>iagnose(진단): 문제가 있다면 해당 진단 카드 선택 (예: “주제에서 벗어남”)", "<b>O<\/b>perate(실행): 진단에 맞는 실행 카드 선택 (예: “삭제하기”)하여 수정"], "diff": [{"b": "사", "t": "훑어 읽기의 세부 전략으로 소개합니다. 역락에는 없는 전략이므로 통합인덱스는 사평 고유(🟢)로 분류하고, 고쳐쓰기 전략 기출에서 세부 유형으로 출제될 가능성은 있으나 확인되지 않았다고 적습니다."}], "explain": "", "src": "사회평론 4장-6"}, {"id": "w44", "name": "돌려 읽기와 필자의 자기중심성", "warn": false, "exam": "기출 ×1 (필자의 자기중심성 — 돌려읽기)", "items": ["돌려 읽기는 <b>필자의 자기중심성<\/b>을 넘어 독자의 관점으로 자기 글을 보게 하는 전략 (미숙한 필자의 자기중심성 ↔ 능숙한 필자의 사회인지 기반 독자 중심)", "이재승(2005) ‘친구 글을 읽을 때 지킬 원칙’: 최대한 많은 의견, 성실한 반응, 부정적 면보다 <b>긍정적 면에 초점<\/b>, 감정에 치우치지 않기, ‘비판’보다 ‘제언’(대안 제시), 정직하되 과도히 직선적이지 않게"], "diff": [{"b": "역", "t": "돌려 읽기는 잘못을 지적하는 것보다 <b>건설적·구체적 피드백<\/b>을 강조하며 협력적 소통 과정임을 알려 줍니다."}, {"b": "사", "t": "역락과 대체로 동일하며 이재승(2005)의 원칙을 덧붙입니다."}], "explain": "<p>독자 의식은 Bereiter 발달 단계 3(의사소통적) 이상과도 연결됩니다.<\/p>", "src": "역락 6장-4 · 사회평론 4장-6"}, {"id": "w45", "name": "공유하기 전략 (작가의 의자·갤러리 워크)", "warn": false, "exam": "", "scope": "역락 고유", "items": ["완성한 글을 공개하고 감상을 나누는 과정(발표·게시·문집 등) — 필자–독자 상호작용 강조", "<b>작가의 의자<\/b>: 발표 공간을 마련해 필자가 자기 글을 낭독·감상 공유 → 필자로서 자신감·정체성·사회적 책임감", "<b>갤러리 워크<\/b>: 완성한 글을 게시하고 돌아다니며 감상(포스트잇 감상평, 작가 설명 병행 가능)", "의의: 교실 글쓰기가 즐겁지 않은 이유 중 하나는 유일한 독자가 평가자인 교사이기 때문 → 실제 독자 반응이 자부심·효능감·필자 정체성을 형성"], "diff": [{"b": "역", "t": "작가의 의자에서는 부정적 평가·비판이 아니라 궁금한 점·인상 깊은 점 위주의 반응을 유도합니다. 다른 과정의 전략이 인지적 성격이 강한 데 비해 공유하기는 실제적 활동의 성격이 강합니다."}, {"b": "국", "t": "‘작가석(author’s chair)’은 고쳐쓰기 단계의 동료 피드백 활동으로 나오며, 출판하기 단계에서는 학급 문집·게시판·학교 신문으로 실제 독자와 공유합니다."}], "explain": "<p>통합인덱스에서 역락 고유(🟢)로 분류되나 국교이의 작가석 서술과 겹칩니다.<\/p>", "src": "역락 6장-4 · 국교이 II-2(2)"}]}, {"title": "G. 작문 교수·학습", "cards": [{"id": "w46", "name": "작문 교수·학습의 5원리 (원진숙 계열)", "warn": true, "exam": "", "scope": "국교이·사회평론 (저자 표기가 다름)", "items": ["<b>생태학적 교수·학습 환경의 구성 원리<\/b>: 교실을 학교 밖 실제 세계처럼 만들어 실제 자료를 읽고 쓰며 의미 있는 과제에 능동 참여", "<b>다양한 접점에서의 글쓰기 경험 원리<\/b>: 의사소통적 글쓰기~개인적 글쓰기, 다양한 독자(교사·부모·친구·자신)의 반응 경험", "<b>과정과 결과의 균형성 원리<\/b>: 과정만 강조하면 한 편의 글 완성 경험으로 이어지지 못할 위험 → 결과물도 함께 강조", "<b>단계적 책임 이양 원리<\/b>: 교사 주도 <b>직접교수법<\/b>(설명+시범) → 학습자 모방·내면화, 점진적으로 학습자에게 주도권 이양", "<b>다면적 피드백 원리<\/b>: 교사·동료로부터 적극적 <b>비계<\/b> 지원, 협의·공유·피드백으로 문제해결력과 사회인지 함양"], "diff": [{"b": "국", "t": "‘쓰기 교수·학습 원리 5가지’로 소개합니다. 직접교수법이 학습자의 다양한 목소리를 억압·편향시킬 위험이 있으므로 <b>미니레슨<\/b>으로 간단히 설명한 뒤 곧바로 학습자가 스스로 쓰기 과정을 수행하도록 하는 것이 유의점입니다."}, {"b": "사", "t": "<b>최미숙 외(2008)<\/b>의 5원리로 인용하며 국교이와 원리명이 완전히 같다고 봅니다. 박영목(2008)은 교실 수업·작문 과정 모형화에 집중하고, 최미숙 외는 생태계 은유(다양성·균형성)로 실제 세상과의 연계를 강조한다고 대비합니다."}, {"b": "역", "t": "작문 워크숍의 생태학적 환경 절에서 <b>원진숙(2001)<\/b>의 워크숍 운영 5원리로 인용합니다. 다만 원리 목록의 뒤쪽을 ‘책임 이양 원리, 상호작용성의 원리’로 적어 국교이·사평의 표기와 미세하게 다릅니다."}], "explain": "<p>⚠️ 통합인덱스는 3권의 5원리가 ‘완전히 일치’한다고 하지만, 역락 DB 원문은 마지막 원리를 ‘다면적 피드백’이 아니라 <b>‘상호작용성’<\/b>으로 적고 있어 표기 차이가 있습니다(원문 확인 권장). 저자명(원진숙/최미숙 외/박영목)이 달라도 <b>내용 자체<\/b>를 익히세요.<\/p>", "src": "국교이 II-1 · 사회평론 8장-1 · 역락 9장-2(1)"}, {"id": "w47", "name": "박영목(2008)의 작문 지도 방향 6가지", "warn": false, "exam": "", "scope": "사회평론 고유", "items": ["①구체적 작문 <b>전략<\/b> 중심 지도 ②실제적 사회문화적 상황에 기초한 활동 중심 지도 ③문제해결을 위한 의미협상과 협동 중시", "④작문능력 <b>발달단계<\/b>에 적합한 지도 ⑤기능적·비판적 문식성 신장을 위한 범교과적 지도 ⑥새로운 정보기술을 활용한 지도", "인지주의적 입장(학생의 인지적 특성에 주의)"], "diff": [{"b": "사", "t": "교실 수업과 작문 과정의 모형화에 집중한다는 점이 최미숙 외(2008)의 생태학적 5원리와 대비됩니다."}], "explain": "", "src": "사회평론 8장-1"}, {"id": "w48", "name": "결과 중심 작문 교수·학습", "warn": true, "exam": "", "scope": "국교이·사회평론", "items": ["일련의 작문 과정(구상 → 집필 → 수정)을 성공적으로 밟으면 좋은 글이 나온다고 봄 — <b>분절적·연속적·선조적<\/b>", "‘<b>모범 글<\/b>’의 확정이 핵심: 언어규범 준수, 논리적·안정적 구조 → 학생은 오류 교정·논리적 개요 작성 능력을 학습", "교사 역할: 평가자·오류 교정자", "한계: 모범글 모방 강조가 작문에 대한 부담·오해 유발, 독창적 글쓰기로 이어지지 못할 수 있음"], "diff": [{"b": "국", "t": "결과 중심 지도를 맞춤법·띄어쓰기(화석화된 오류 → 용례 제시 + 학습자 직접 교정 + 교사의 명시적 설명)와 문장·단락 구성 지도로 정의합니다. 문장은 오류 유형을 제시하고 학습자가 직접 교정하게 해 문법 지식을 <b>귀납적으로 원리화<\/b>합니다(예: “안 될 말씀은 다름이 아니오라 주주총회가 이번 주말에 있습니다” → 주어-서술어 호응 확인)."}, {"b": "사", "t": "고유 모형: <b>과제 제시-오류 점검형<\/b>(이성영 1996): 주제 제시 → 글쓰기 → 고쳐쓰기 → 평가와 점검(교사가 등급·오류 표시), Rohman &amp; Wlecke의 단계적 모형에 기반합니다. <b>정동화 외(1984) 5단계<\/b>: 주제 설정 - 제재 선택 - 개요 작성 - 집필 - 퇴고. 수업 지도안은 모범 글 제시(구조·문체·내용) → 내용 생각하기 → 모방하여 쓰기 → 오류 고치기입니다."}], "explain": "<p>역락은 결과 중심 방법(글의 구조·문법·맞춤법·내용 타당성)과 과정 중심 방법이 각각 역할이 있으며 상호 배타적이지 않다고 봅니다.<\/p>", "src": "국교이 II-2(1) · 사회평론 8장-2 · 역락 9장"}, {"id": "w49", "name": "과정 중심 작문 교수·학습", "warn": true, "exam": "기출 ×3 (과정 중심 작문 지도 및 과정 평가, 포트폴리오 평가 포함)", "items": ["작문 = 문제해결 행위. 필자가 담화공동체라는 사회·수사적 맥락과 교섭하며 목표지향적 사고로 의미를 구성해 가는 과정", "‘모범 글’이 아니라 <b>사고력 발달<\/b>과 범교과적 작문을 지향, 회귀성을 강조(상위인지로 점검·수정하며 자기주도적 필자로 성장)", "교사 역할: 평가자 → 작문 과정에 개입하는 <b>참여자<\/b>", "대표 방법: <b>워크숍 중심<\/b> 쓰기 교육"], "diff": [{"b": "국", "t": "워크숍 단계: <b>도입<\/b>(교사 주도, 생태학적 환경 조성, 목표·과제 인식) → <b>전개<\/b>(쓰기 전[브레인스토밍·마인드맵·자료 수집·다발 짓기] → 초고 쓰기[내용에 집중, 빠르게] → 고쳐쓰기[동료 공유, 작가석] → 편집하기[형식 오류 교정]) → <b>정리<\/b>(출판하기: 문집·게시판·학교 신문, 평가는 포트폴리오·동료·자기평가). 책임 이양은 미니레슨에서 학습자 주도로 이어집니다."}, {"b": "사", "t": "<b>박영목(2008) 일반 모형<\/b>: 준비 과정(상황 분석 → 과제 결정·제시) → 활동 과정(직접교수법 원리로 교사 설명·시범) → 정리 과정(발표·평가). <b>경인초등국어교육학회(1995) 순환 모형<\/b>: 쓰기 전(생각 꺼내기·생각 묶기) - 쓰는 중(초고쓰기·다듬기) - 쓴 후(평가하기·작품화하기) 6세부 단계. 장점은 부담 감소·자신감이고, 단점은 단계 수행이 글 향상과 무관할 수 있고 협동 강조로 개인 능력 향상이 제한적이며 시간이 많이 든다는 점입니다."}, {"b": "역", "t": "과정 중심 방법을 아이디어 생성~수정에 이르는 전체 과정을 중시하는 방법으로 정의하며 워크숍(9장)으로 구현합니다."}], "explain": "<p>결과 중심의 ‘분절·선조’ vs 과정 중심의 ‘회귀’, 교사의 ‘평가자’ vs ‘참여자’가 판별 축입니다.<\/p>", "src": "국교이 II-2(2) · 사회평론 8장-2 · 역락 9장-2(1)"}, {"id": "w50", "name": "작문 워크숍 (진정한 쓰기·미니 레슨)", "warn": true, "exam": "기출: 건의문 ×3의 ‘쓰기 워크숍’, 보고서 ×2의 ‘작문 워크숍’과 연계", "items": ["전문가의 조언을 바탕으로 협의를 통해 문제를 해결해 가는 워크숍을 작문 교육에 적용 — 교사의 안내 하에 동료와 지속적으로 협의하며 한 편의 글을 완성", "<b>진정한 쓰기(authentic writing)<\/b>: 실제적 목적·삶과 밀접한 주제·실제적 맥락·구체적 독자를 전제한 의미 있는 쓰기", "<b>3단계<\/b>: 간이 수업(미니 레슨) → 쓰기 수행(계획~공유) → 과제 성찰", "과정과 결과를 모두 중시하고 개인적 행위이면서 공동체적 소통 행위"], "diff": [{"b": "역", "t": "<b>일반 수업과의 차이<\/b>: 일반적으로는 초고 후에만 동료 피드백(돌려읽기)을 하지만, 워크숍은 과제 분석·계획·생성·조직·초고·완성 <b>전 과정에서 지속적으로<\/b> 협의합니다. 생태학적 교수·학습 환경(원진숙 2001)이 전제입니다."}, {"b": "사", "t": "원진숙(2001)의 워크숍 중심 모형 — 교사의 4대 역할: <b>학습 환경 조성자 / 명시적 교수자 / 촉진자 / 평가자<\/b>."}, {"b": "국", "t": "워크숍 중심 쓰기 교육은 도입부 교사 설명·시범 후 쓰기 전/초고 쓰기/고쳐쓰기/편집하기/출판하기 단계를 거쳐 실제 쓰기를 경험하는 방법입니다."}], "explain": "<p>통합인덱스: 3권 공통(🔴)이며 5원리와 같은 이론틀에 서 있습니다.<\/p>", "src": "역락 9장-2(1) · 사회평론 8장-2 · 국교이 II-2(2)"}, {"id": "w51", "name": "협동 작문", "warn": false, "exam": "기출 ×1 (협동 작문)", "scope": "역락 고유", "items": ["동료와 협력해 글을 쓰며 학습 목표를 달성하는 교수·학습 — 작문을 개인의 인지 작용이자 담화공동체 구성원과 함께 하는 사회적 작용으로 봄", "<b>협동적 쓰기<\/b>: 역할을 분담해 단락·장을 나눠 맡아 한 편의 글을 공동 완성 / <b>작문에 대한 협동적 학습<\/b>: 전 과정의 협의 활동 + 초고·완성작에 대한 동료 반응(Harris 1992; 이재기 1997)", "협의·피드백이 어느 한 단계에서라도 있으면 협동 작문으로 인정(개인별로 써도 해당)"], "diff": [{"b": "역", "t": "성숙자(2003)의 11유형은 쓰기 전·쓰기·고치기 3단계 각각의 협동(O)/개별(X)을 조합하며, <b>모든 단계에서 협동학습<\/b>이 일어나는 유형이 가장 완전한 협동 작문입니다. <b>유의점<\/b>: 학습 목표·학생 특성에 따라 협동 범위 조절, 대표 1인이 쓰는 경우 개인별 쓰기를 병행(직접 쓰기 경험이 성장에 중요), 의미 협상의 공정성·민주성(역할 공평 배분, 의견 독점 방지), 개별 학생의 과정·결과 평가."}], "explain": "<p>사회구성주의·대화주의와 연결되는 지도 방법입니다(둘 다 협동작문을 활용하되 지향점이 다름).<\/p>", "src": "역락 9장-2(2)"}, {"id": "w52", "name": "장르 중심 작문 교수·학습", "warn": true, "exam": "기출 ×1 (장르 중심 작문 교수·학습 방법)", "items": ["특정 장르의 사회문화적 요구(관습화된 형식 + 맥락)를 이해하고 그에 맞는 내용·형식으로 쓰게 지도 — 사회구성주의와 맥을 같이 함", "결과 중심 접근과 유사(텍스트·문법요소·글구조 강조)하나 쓰기를 둘러싼 <b>사회적 상황 맥락<\/b>을 더 강조", "한계: 장르를 도식적 틀로 오인하면 창의성 저해·단순 재생산 위험, 한 장르의 모든 요소를 다룰 수 없음, 저학년에는 부적합할 수 있음"], "diff": [{"b": "국", "t": "<b>3단계<\/b>: 예시글 제시하기(modeling, 원형적 구성요소·수사적 구조·표현 지도) → 협력하여 글쓰기(교사–학생이 장르 지식을 공유·협상) → 독립적으로 쓰기. 한계 극복은 학습자가 유의미한 맥락에서 장르 지식을 스스로 탐구·발견하는 기회를 주는 것입니다."}, {"b": "역", "t": "<b>4단계<\/b>: 시범 보이기 → 명시적 지시 → 실습과 피드백 → 비교와 대조(경우에 따라 실생활 적용 추가). 장점: 실제 맥락에서 의사소통 능력 함양, 장르 규칙의 이해·변형 과정에서 비판적 사고·창의성 함양, 읽기-쓰기 연계."}, {"b": "사", "t": "과정중심 이론의 ‘목표 모호성’ 문제에 대한 대응으로 봅니다. <b>박태호(2000) 모형<\/b>: 거시 장르(설명문·논설문) vs 미시 장르(도로안내문·사용설명서)를 맥락으로 설정, 생각 꺼내기 → 텍스트 구조 탐구하기(협의) → 텍스트 구성(<b>교사 주도 → 협동적 → 독자적<\/b> 3단계 이양). <b>원진숙 외(2011) 장르 기반 환경적 쓰기 모형<\/b>: 장르중심 지도의 한계(예시글 모방 강조, 교사 역할 과잉)를 환경적 교수법으로 보완, 초등학생 대상 근접발달영역 내 비계."}], "explain": "<p>⚠️ 단계 수가 다릅니다: 국교이 3단계 / 역락 4단계 / 사평 박태호 3단계 이양. 통합인덱스: 박태호(2000)와 원진숙 외(2011) 두 모형은 역락·사평이 동일하게 인용합니다(🔴).<\/p>", "src": "국교이 II-2(3) · 역락 9장-2(3) · 사회평론 8장-2"}, {"id": "w53", "name": "직접교수법·현시적 교수법·상보적 교수법", "warn": true, "exam": "기출 ×1 (직접교수법)", "scope": "사회평론이 가장 상세 (국교이는 직접교수법만 언급)", "items": ["<b>직접교수법<\/b>: 원리·방법·절차를 명시적으로 설명하고 시범 → 학생이 직접 해 봄", "<b>현시적 교수법<\/b>: 시범을 강조하되 <b>왜<\/b> 그 전략을 쓰는지·어떻게 적용·변형할지까지 설명 — 보이지 않는 사고 과정까지 드러냄(사고구술)", "<b>상보적 교수법<\/b>: 교사–학생이 과제를 함께 해결하다 점차 학생이 독립 — 일방적 이양이 아닌 <b>상호작용적 피드백<\/b> 강조"], "diff": [{"b": "사", "t": "<b>박영목(2008) 현시적 교수 모형 4단계<\/b>: ①교사의 설명과 시범(전략 설명 + 시범 + 사고구술) ②교사 안내 중심 작문 활동(책임의 점진적 증대) ③개별 학생 중심 독립적 작문 활동(주기적 피드백) ④실제 작문 상황에서의 전략 적용(새로운 장르·어려운 글에 적용, 발표)."}, {"b": "국", "t": "직접교수법을 <b>단계적 책임 이양 원리<\/b>의 초기 단계(교사 주도)로 설명하며, 다양한 목소리를 억압할 위험이 있어 미니레슨을 권합니다."}], "explain": "<p>독서 영역의 ‘직접교수법’·‘현시적 교수법’ 카드와 단계 수·사고구술의 위치가 책마다 다르니 비교해 보세요.<\/p>", "src": "사회평론 8장-2 · 국교이 II-1"}, {"id": "w54", "name": "동료 평가를 활용한 교수·학습과 타 영역 통합", "warn": false, "exam": "", "scope": "역락 고유", "items": ["<b>동료 평가<\/b> 목적 3가지: 비판적 사고 능력 함양 / 자기반성 능력 함양 / 협력적 학습 환경 조성", "평가 주안점: 형식·구조 / 내용 / 언어 — 교사가 목적에 맞게 안내. 운영 원칙: 명확한 기준, 평가 연습, 구체적·건설적 피드백, 신뢰·존중 환경, 활동 후 성찰", "<b>타 영역 통합<\/b>: 듣기·말하기(토론 → 논설문), 읽기(요약 후 논설문), 문법, 문학(감상문·창작), 매체언어 / 방법: 주제 중심 통합, 프로젝트 기반 학습, 매체 활용"], "diff": [{"b": "역", "t": "쓰기 교수·학습 방법은 쓰기 교육기법(시범·피드백·동료 평가 등 실천 행위)과 쓰기 교육 장치(쓰기 가이드·템플릿·디지털 도구 등)를 포괄합니다. 전략은 <b>의식적<\/b>, 기능은 <b>무의식적<\/b> 정보처리 기법으로 구별합니다."}], "explain": "", "src": "역락 9장-2(4)(5)"}]}, {"title": "H. 작문 평가", "cards": [{"id": "w55", "name": "작문 평가의 개념·패러다임·구성 요소", "warn": true, "exam": "", "items": ["<b>3패러다임<\/b>(역락): 학습 결과에 대한 평가(assessment <b>of<\/b> learning, 총괄) → 학습 개선을 위한 평가(<b>for<\/b> learning, 형성) → 학습 과정으로서의 평가(<b>as<\/b> learning, 학생이 주체적으로 점검·조정) — 어느 하나에 치우치지 말고 맥락에 맞게 활용", "<b>구성 요소 4단계<\/b>: ①평가 목적 선정 → ②측정 방법 설계(측정=수로 표현 / 채점=채점척도로 주관적 판단을 점수·등급화) → ③정보 해석 → ④교육적 활용", "학교 교실의 작문 평가는 자격 부여·분류·배치가 아니라 <b>학습 지원·능력 신장<\/b>에 초점"], "diff": [{"b": "사", "t": "정의: 작문 교육 전반에 유의미한 정보를 수집하고 교육적 진단·처방을 하는 체계적 과정이며 서열화가 아니라 개인의 의사소통능력 향상이 목적입니다. 지향점은 과정+결과 평가, 지속적 평가, 평가 주체의 다양화(교사·동료·자기)입니다. <b>Behizadeh &amp; Engelhard(2011)<\/b>: 작문평가는 작문이론 + 측정이론 + 맥락 요소(교육과정·교과서·학습자·교수자)의 영향을 받습니다."}, {"b": "역", "t": "평가(assessment)=도구 개발 + 측정 + 해석 + 피드백의 전 과정, 채점(scoring)=점수 부여라는 하위 과정으로 구분합니다."}], "explain": "", "src": "역락 10장-1 · 사회평론 9장-1·2"}, {"id": "w56", "name": "쓰기 평가 원리 6가지", "warn": false, "exam": "", "scope": "국교이 고유", "items": ["<b>실제성<\/b>: 맥락화된 실제적 쓰기 과제 / <b>지속성<\/b>: 다양한 상황·목적·형식의 여러 편을 지속 평가", "<b>전인성<\/b>: 지식·기능뿐 아니라 태도(정의적 영역)까지 종합 / <b>과정 중심<\/b>: 결과물뿐 아니라 과정의 전략 적용도 평가", "<b>통합성<\/b>: 교수·학습과 평가가 분리되지 않고 역동적·순환적으로 통합 / <b>개별화<\/b>: 쓰기 발달 연속체 안에서 개인의 발달·성장 정도를 평가(상대 우열이 아님)"], "diff": [{"b": "국", "t": "수업 장면에서 해당 평가 원리를 판별하는 문제가 다수 출제될 수 있다고 정리합니다. 좋은 평가 기준의 요건은 교수·학습 목표와 부합, 교사·학생·학부모 모두에게 신뢰·유의미, 명확한 전달, 발달 단계 반영입니다."}], "explain": "", "src": "국교이 III-1"}, {"id": "w57", "name": "작문 평가의 타당도와 신뢰도", "warn": true, "exam": "기출 ×2 (작문 평가의 주체 — 채점자 간 신뢰도 명시)", "scope": "역락·사회평론", "items": ["<b>타당도<\/b>: 평가 결과에 근거한 판단·의사결정의 적절성 — 내용 타당도(성취기준·수업 내용과의 연계) / 준거 타당도(두 평가 결과의 상관) / <b>결과 타당도<\/b>(학습·동기 향상으로 이어졌는가)", "<b>신뢰도<\/b>: 관찰 점수 = 진점수 + 오차(컨디션·평가도구 모호성·채점자 주관성)", "<b>채점자 내 신뢰도<\/b>(동일 채점자의 일관성) vs <b>채점자 간 신뢰도<\/b>(두 명 이상 점수의 일치도) — 내적 일관성은 채점자 간 신뢰도의 <b>전제 조건<\/b>이나, 내적으로 일관돼도 엄격성 수준이 다르면 채점자 간 신뢰도는 낮을 수 있음"], "diff": [{"b": "사", "t": "<b>Diederich(1974) 실험<\/b>: 60명의 평가자(영문학·사회학·자연과학·언론·법률 등 여러 분야 전문가 각 10명)가 대학 1학년 글 300여 편을 9등급으로 평가했더니 <b>282편이 7개 등급<\/b>에 걸쳐 서로 다른 등급을 받았고 평가자 간 신뢰도는 <b>.31<\/b>이었습니다. 신뢰도 제고 3방안(박영목 2008): ①사회·문화적으로 공인된 평가 기준 ②복수 평가자의 사전 연수 ③복수 평가자 점수의 합산."}, {"b": "역", "t": "결과 타당도 사례: 선다형으로만 작문 지식을 평가하면 학생이 암기가 중요하다고 오해해 흥미·동기가 저하될 수 있습니다."}], "explain": "<p>통합인덱스: 이 기출 항목은 ‘작문 평가의 주체’에 묶여 있고 채점자 간 신뢰도가 명시되어 있습니다.<\/p>", "src": "역락 10장-2 · 사회평론 9장-2"}, {"id": "w58", "name": "총체적 채점 vs 분석적 채점", "warn": true, "exam": "기출 ×5 최빈출 (작문 평가 방식: 총체적·분석적·주요 특질·간접평가의 문제점·관찰법·프로토콜/사고구술법)", "items": ["<b>총체적(holistic)<\/b>: 글 전체를 하나의 단위로 보고 전체적 <b>인상<\/b>으로 평가. 절차: 평가목표 → 채점기준표(rubric) → 기준답안(anchor paper) 선정 → 인상적 채점(이견 협의). 경제적·신속, 대규모 평가·발달 연속체 구성에 유리", "<b>분석적(analytic)<\/b>: 내용·조직·표현·표기 및 어법 등 범주별로 점수를 부여해 총점 산출. 절차: 목표 → 평가항목·척도 → 항목별 기준 → 개별 평가 후 합산. 형성평가·즉각적 피드백에 유리", "비교: 단위(전체 vs 세부), 경제성(높음 vs 낮음), 적합 국면(대규모·연속체 vs 형성평가)"], "diff": [{"b": "역", "t": "총체적 평가는 ‘부분의 합이 전체가 될 수 없다’는 관점으로 멈추지 않고 전체를 읽어 <b>단일 점수<\/b>를 줍니다(Cooper &amp; Odell 1977). 다만 총체적 평가라도 분석적 채점기준을 판단 근거로 활용할 수 있습니다. 단점: 구체적 개선점 파악이 어렵습니다. 분석적 평가는 요소마다 다시 읽기를 권장해 시간이 더 들고, 장점은 강점·약점 파악, 단점은 평가자가 각 기준의 의미를 명확히 파악해야 하고 요소 분리 채점이 쉽지 않다는 점입니다."}, {"b": "사", "t": "<b>배향란(1995) 총체적 평가 5대 장점<\/b>: ①교육과정 중심의 높은 타당도 ②시간·노력 절감 ③핵심요소(구조·통일성)에 집중 지도 ④신뢰도가 분석적 평가와 유사(NAEP·ETS 연구 .80 이상) ⑤기준 글·기준 자체가 피드백 자료. 분석적 평가의 시초는 <b>아이오와 작문평가<\/b>(아이디어/내용·조직·어조·담화관습 4요소)이며, 김라연(2007) 논설문 사례처럼 글의 목적에 따라 항목 비중을 달리합니다. <b>분석적이라고 항상 객관적인 것은 아니며<\/b>(‘주장이 참신한가’ 같은 항목은 평가자 안목에 좌우) 어느 쪽이 더 타당·신뢰롭다는지는 연구자마다 견해가 다릅니다."}, {"b": "국", "t": "총체적 채점의 절차·장단점, 분석적 채점의 절차·장단점을 비교표로 정리합니다."}], "explain": "<p>통합인덱스: 총체적 채점 기준표의 진술문이 국교이·역락에서 문구 수준까지 거의 같고(박영목 계열), 사평은 논설문 특화 사례(김라연 2007)를 추가합니다. 분석적 채점 요소는 3권 모두 내용/조직/표현(+어법) 체계입니다.<\/p>", "src": "국교이 III-2 · 역락 10장-3 · 사회평론 9장-3"}, {"id": "w59", "name": "주요 특질 채점과 총체적 평가 7유형 (Cooper &amp; Odell 1977)", "warn": true, "exam": "작문 평가 방식 기출 ×5의 세부 유형으로 출제 가능", "scope": "사회평론 고유 (7유형)", "items": ["①<b>에세이 비교 평가<\/b>(essay scale): 수준별 기준 사례(anchor)와 비교", "②<b>분석적 척도<\/b>: 하위요소별 상·중·하 (순수 분석적 평가보다 항목이 크고 3단계로 단순)", "③<b>이분법 척도<\/b>: 각 등급을 ‘예/아니오’로 판정해 총점", "④<b>특질 분석<\/b>(feature analysis): 핵심 평가요소 <b>1개<\/b>만 선정 ⑤<b>주요 특질<\/b>(primary trait): 핵심 요소 <b>2개 이상<\/b>", "⑥<b>보편적 인상 평가<\/b>: 평가자의 전문가적 직관(가장 전통적) ⑦<b>반응 중심 평가<\/b>(center of gravity): 평가자가 질문하고 학습자가 답하는 상호작용"], "diff": [{"b": "사", "t": "이 유형들은 세부 절차는 다르지만 모두 <b>평가자의 안목·식견<\/b>에 기반한다는 점이 총체적 평가의 본질입니다. 최근에는 도달 수준을 구체적으로 명시한 채점기준표(박영민 외 2016)로 종합 판단하는 방식으로 정교화되고 있습니다."}, {"b": "역", "t": "주요 특질 채점을 <b>과제가 요구하는 특정 수행 요소 1~2개<\/b> 중심의 평가로 소개합니다(설명문=정보의 정확성·구조화, 주장하는 글=입장의 명확성·근거의 타당성). 장점은 초점이 명확하고 과제 핵심을 안내하는 것, 단점은 다른 요소가 배제되어 편향될 수 있다는 것입니다."}], "explain": "<p>⚠️ ‘주요 특질’의 핵심 요소 수가 다릅니다: 사평 7유형에서는 특질 분석(1개)과 구분되어 <b>2개 이상<\/b>, 역락은 <b>1~2개<\/b>. 통합인덱스는 사평이 주요 특질을 7유형 중 하나로 재배치했다고 적습니다.<\/p>", "src": "사회평론 9장-3(3) · 역락 10장-3"}, {"id": "w60", "name": "직접 평가 vs 간접 평가", "warn": false, "exam": "기출 ×5 (작문 평가 방식 중 간접 평가의 문제점)", "items": ["<b>직접 평가<\/b>: 실제로 글을 쓰게 해 산출물을 평가 — 타당도 높음, 필요한 교육적 처치 파악 용이 / 단점: 시간·비용·평가자 부담", "<b>간접 평가<\/b>: 지필 형식의 문항(선다형·단답형)으로 작문 능력을 간접 측정 — 대규모·고신뢰도에 용이 / 한계: 문항을 맞혔다고 실제 통일성 있는 글을 쓸 능력이 있다고 단정할 수 없음", "가급적 직접평가에 중점을 둠(국교이)"], "diff": [{"b": "사", "t": "간접 평가의 대표로 수능 국어 화법과 작문 영역(초고를 읽고 고쳐쓰기 방향 고르기 등)을 듭니다."}, {"b": "역", "t": "우리나라 대단위 평가(학업성취도평가·수능 등)에서 주로 쓰이며, 사례로 건의문 작성 시 유의점을 묻거나 부적절한 수정을 찾게 하는 문항을 듭니다."}], "explain": "", "src": "국교이 III-2 · 역락 10장-3 · 사회평론 9장-3"}, {"id": "w61", "name": "작문 과정 평가 방법 (프로토콜·반성적 쓰기 등)", "warn": false, "exam": "작문 평가 방식 기출 ×5 (관찰법, 프로토콜/사고구술법 포함)", "items": ["<b>단계별 관찰 기록·산출물 분석<\/b>: 특정 단계의 어려움을 진단 — 과정이 능력을 대표해서가 아니라 능력 신장에 필요한 정보를 얻기 위한 목적", "<b>반성적 쓰기<\/b>: 작문 과정을 되돌아보며 쓴 글 — 인지적(중심내용·독자 설정·어려움과 해결 전략)·정의적(동기·흥미·습관·가치) 측면을 통합 평가, 한계는 기억 망각·왜곡", "<b>사고구술 프로토콜 분석<\/b>: 쓰면서 생각을 소리 내어 말하게 하고 기록(프로토콜)을 분석 — 어린 학생에게는 인지 부담, 사전 연습이나 <b>회상적 사고구술<\/b>로 대체 가능"], "diff": [{"b": "사", "t": "<b>6가지 프로토콜 방법<\/b>(김평원 2011, 생성 주체 × 시기): 학습자-실시간 = 실시간 자기기록법·사고구술법 / 학습자-사후 = 직후 자기기록법·자기회상법 / 교수자-실시간 = 실시간 질문법 / 교수자-사후 = 직후 면담법. 유의점: 쉬운 과제로 사전 연습, 평가받는다는 인식을 주지 않기, 신뢰 분위기, 어려워하면 단서·질문으로 회상 지원."}, {"b": "역", "t": "자기·동료 평가는 성적 산출이 아니라 능력 향상이 목적일 때 효과적이며, 자기평가는 피상적이 되지 않도록 질문지·체크리스트·목표 달성도 기록을 활용합니다."}], "explain": "<p>역락은 사고구술법만, 사평이 프로토콜을 가장 세분화(통합인덱스)합니다.<\/p>", "src": "역락 10장-3 · 사회평론 9장-4"}, {"id": "w62", "name": "포트폴리오 평가", "warn": true, "exam": "기출 ×3 (과정 중심 작문 지도 및 과정 평가 — 포트폴리오 평가 포함)", "scope": "국교이가 가장 상세", "items": ["학습자가 일정 기간 쓴 여러 편의 글을 모은 작품집을 평가 — 생태학적 평가관, 특정 글 한 편이 다른 주제·장르 능력을 보장하지 않으므로 여러 편이 타당도의 근거", "<b>핵심 특성 5가지<\/b>: ①충분한 시간·여러 편 ②다양한 목적·유형 ③과정 중시(고쳐쓰기·편집·다시쓰기) ④필자로서의 변화 관찰 ⑤작품 선택·조직 과정에서 자기평가적 반성", "<b>포트폴리오 vs 단순 작품철(folder)<\/b>의 구별점 = <b>반성(reflection)<\/b>", "최우선 가치는 일회적 결과가 아닌 <b>발달적 수행<\/b>"], "diff": [{"b": "국", "t": "평가 범주 5가지(상/중/하 3단계 평정): 시간 경과에 따른 <b>변화<\/b> / <b>다양성<\/b> / <b>문제 해결력<\/b> / 조직·형식·구조 / <b>자기 반성<\/b>(상위인지)."}, {"b": "사", "t": "포트폴리오 평가를 과정 평가의 대표로 봅니다. Elbow &amp; Belanoff(1986)의 평가 시스템 모델(자유쓰기·계획하기, 교사·동료와 토의, 고쳐쓰기·편집하기 포함)을 제시하고, 자기·동료 평가나 복수 평가자 협의와 결합할 수 있다고 봅니다."}, {"b": "역", "t": "독립 절은 없고 간접적으로 다룹니다."}], "explain": "", "src": "국교이 III-2(3) · 사회평론 9장-4 · 역락 10장"}, {"id": "w63", "name": "작문 평가의 주체 (교수자·동료·자기)", "warn": true, "exam": "기출 ×2 (자기평가, 동료평가, 채점자 간 신뢰도)", "scope": "사회평론이 체계적 (3주체)", "items": ["<b>교수자 평가<\/b>: 대표는 첨삭 지도 — 1인 평가로 인한 신뢰도 문제", "<b>동료 평가<\/b>: 필자·독자 입장을 모두 경험, 비판적 사고·반성적 성찰 (Bandura 1997: 긍정적 인식·효능감에 효과적 / 임택균 2014: 문법 기능 효과 미미)", "<b>자기 평가<\/b>: 표준화된 일괄 평가의 대안 — 자기반성·상위인지·자기주도성 강화 (김종백·우은실 2005: 초4·6 자기평가 집단의 능력 향상 더 큼)"], "diff": [{"b": "사", "t": "<b>정희모·이재성(2009)<\/b>: 특정 평가 방법이 항상 우월하다고 볼 수 없고 과제 종류·수업 상황·학생 태도에 따라 효과가 다릅니다. <b>협력적 평가 모형<\/b>(이은자 2010): 1단계 자기첨삭(<b>글 중심<\/b> 고쳐쓰기) → 2단계 동료 협력첨삭(<b>독자 중심<\/b>) → 3단계 교수 첨삭·평가(<b>종합적<\/b>), 각 단계에서 SQ2R 독법(Survey-Question-Read-Revision)을 씁니다."}, {"b": "국", "t": "평가 주체를 교사 한정이 아닌 동료평가·자기평가 병행으로 정리합니다."}, {"b": "역", "t": "동료 평가만 다루며(자기 평가는 과정 평가 부분) 체계적 3주체 분류는 없습니다."}], "explain": "<p>통합인덱스: 국교이·역락은 산발적 언급, 사평이 3주체를 체계화했습니다.<\/p>", "src": "사회평론 9장-3(1) · 국교이 II · 역락 10장"}, {"id": "w64", "name": "작문 평가 기준 (내용·조직·표현, 신타공)", "warn": false, "exam": "기출 ×2 (평가 기준: 통일성 개념, 신타공, 풍부성)", "items": ["전통적 평가 기준의 3대 범주: <b>내용, 조직, 표현<\/b> (분석적 채점 요소는 3권 공통으로 내용/조직/표현+어법 3~4범주)", "<b>신타공<\/b> = 신뢰성·타당성·공정성 — 좋은 평가 기준은 교수·학습·평가 목표와 부합하고 교사·학생·학부모 모두에게 신뢰·유의미해야 함", "사평: 통일성(내용·구성의 일관성)·풍부성(정보의 풍부성) 등이 세부 항목에 등장"], "diff": [{"b": "사", "t": "<b>Purves(1984)<\/b>: 내용과 사고(정보의 풍부성·정확성·관련성, 추론·종합·비판적 사고) + 조직(구조·일관성·통일성) + 표현과 문체(객관성·공정성·유창성) — 내용과 형식이 비슷한 비중. <b>IEA(1988)<\/b>: 텍스트 구조화 기능(인지적 + 사회적) + 텍스트 산출 기능(문법적 + 심동적). <b>박영목(1999)<\/b>: 위 둘을 종합해 내용창안(풍부성·정확성·연관성·명료성·타당성·참신성) / 조직(글구조·문단구조·통일성·일관성·전개적절성) / 표현(어휘·문장구조·효과적·개성적 표현·맞춤법)을 1~3점 척도로 채점합니다."}, {"b": "국", "t": "전통적 평가 기준의 3대 범주(내용·조직·표현)와 좋은 기준의 요건을 제시합니다."}], "explain": "<p>통합인덱스: 3권 모두 공유(🔴)하는 항목입니다.<\/p>", "src": "국교이 III-2(1) · 역락 10장 · 사회평론 9장-3(2)"}, {"id": "w65", "name": "채점자 특성·신뢰도 개선 방안·피드백 4수준", "warn": false, "exam": "", "scope": "역락 고유", "items": ["<b>채점자 특성 3가지<\/b>: 엄격성(관대/엄격, 복수 채점자 평균·기준·예시문으로 완화) / 일관성(=채점자 내 신뢰도) / 편향성", "<b>신뢰도 개선 3방안<\/b>: ①채점 기준의 상세화(요목화 + 구체화) ②채점자 연수·훈련 ③평가 예시문 활용(모호한 기준은 예시 글로 보완)", "<b>피드백 4수준<\/b>: 작문 과제 수준(산출물 분석) / 작문 과정 수준(과정 관찰·반성적 쓰기·면담) / 자기조절 수준(자기점검·목표설정, 상위인지 검사지) / 자기평가 수준(학생 자신의 느낌·반성)"], "diff": [{"b": "역", "t": "채점 절차는 기준 개발 → 표본 가채점 → 기준 확정 → 전체 채점 → 이의신청 처리입니다. 신뢰도를 위한 5대 유의점: 범주·기준 의미 파악 및 변별 / 글의 특성과 평가요소 연결 / 연속 척도 간 미세한 차이 변별 / 채점 근거 확보 / 채점자 간·내 신뢰도 모두 유의. 결과 평가 피드백뿐 아니라 과정 평가 피드백도 함께 제공하는 것이 중요합니다."}], "explain": "<p>사평의 신뢰도 제고 3방안(공인 기준·연수·합산)과 비교해 보세요.<\/p>", "src": "역락 10장-5"}, {"id": "w66", "name": "작문 과제의 개발 (진정한 평가)", "warn": false, "exam": "「건의문」 기출 ×3의 ‘실제적 쓰기 과제’와 연계", "scope": "역락 고유", "items": ["<b>진정한 평가(authentic assessment)<\/b>: 평가 상황이 실제 작문 상황과 유사해야 함 (예: 가상의 목적이 아닌 학교에 실제 건의할 사항으로 건의문 쓰기)", "<b>Ruth &amp; Murphy(1988) 2대 요소<\/b>: 주제(subject, 무엇에 대해) + 지시/설명(instruction, 어떻게 쓸지의 제한·구체화)", "‘지시’가 부족한 과제(“지난 방학 경험을 쓰시오”)는 초점·방향을 잡기 어려워 충분한 수행을 이끌지 못함 → 자세하고 친절한 제시"], "diff": [{"b": "역", "t": "과제 구성 요소 연구: Emig(1971) / Odell(1981: 담화목적·예상독자·담화유형) / Breland(1983) / Purves 외(1984) / Park(1987: 내용정보 + 수사적정보 2대 범주). 공통적으로 <b>수사적 요소<\/b>(목적·독자·상황), <b>과정적 요소<\/b>, <b>제한조건 요소<\/b>(시간·길이·참고자료·평가준거)가 반복됩니다."}], "explain": "", "src": "역락 10장-4"}, {"id": "w67", "name": "작문 자동 채점 기술 (AES)", "warn": false, "exam": "", "scope": "사회평론 고유", "items": ["AES(자동 채점) / AWE(자동 글쓰기 평가) / AEF(자동 에세이 피드백) — 기계학습 기반", "<b>유형 1 채점 자질 + 가중치<\/b>: PEG(Page 1966, 최초, 단어 비율·평균 문장 길이 등, 인간 채점 상관 0.81~0.89, 피드백 없음), e-rater, IntelliMetric, BETSY", "<b>유형 2 딥러닝<\/b>: 방대한 작문 데이터에서 특성을 스스로 추출(가중치 미리 설정 안 함)"], "diff": [{"b": "사", "t": "Shin &amp; Gierl(2021)은 딥러닝이 더 효과적이라 하나, Mayfield &amp; Black(2020, BERT 비교)은 <b>단순한 영역<\/b>(철자·주어-서술어 불일치)은 기존 방식, <b>복잡한 영역<\/b>(문체·어조)은 딥러닝이 더 효과적이라고 봅니다. 박종임 외(2022) 비교: PEG(다중선형회귀, 문맥 특성 미반영) / Intelligent Essay Assessor(잠재의미분석, 피드백 없음) / e-rater(NLP+통계, 정확도 87%, 문법·구조·스타일 피드백) / IntelliMetric(미학습 유형 채점 못함). 가중치 방식은 상용화됐으나 세부 비공개, 딥러닝은 연구 초기입니다."}], "explain": "<p>기출 이력이 없는 영역(통합인덱스)입니다.<\/p>", "src": "사회평론 9장-5"}]}, {"title": "I. 장르별 글쓰기 (정보전달·설득·정서표현)", "cards": [{"id": "w68", "name": "정보전달 글의 내용 조직 5구조", "warn": true, "exam": "「조직하기 전략」 기출 ×2의 ‘내용 조직’과 연계", "scope": "역락·사회평론 (동일 5구조)", "items": ["<b>나열<\/b>(병렬) — 대등한 정보, ‘첫째·둘째’ / <b>순서<\/b> — 시간·공간의 흐름(자연적 구성) / <b>인과<\/b> — 원인-결과 / <b>비교·대조<\/b> — 공통점·차이점 / <b>문제 해결<\/b> — 문제점(현황+원인) → 해결 방안", "<b>인과 vs 문제해결<\/b>: 문제해결 구조는 반드시 ‘해결’이라는 의미 단위를 포함, 인과 구조는 해결을 포함하지 않을 수 있음", "표지: 비교·대조=유사한/반면, 인과=원인/결과/왜냐하면"], "diff": [{"b": "역", "t": "<b>설명 방법 vs 내용 전개 방식 vs 내용 조직 방식<\/b>: 설명 방법(정의·비교·대조·분류·분석·예시)은 진술 행위 자체에 초점, 문장·문단 수준에서 쓰이면 내용 전개 방식(정의·예시가 대표), 글 전체 거시구조 수준이면 내용 조직 방식(비교·대조가 대표)이라 부릅니다. 순서 구조는 순행적/역순행적, 공간순은 가까운 곳→먼 곳 등으로 나뉩니다."}, {"b": "사", "t": "4장 전략 장에서 다발 짓기와 연계해 같은 5구조를 사용합니다."}], "explain": "<p>독서 영역의 ‘설명문 텍스트 구조’ 카드(수집·인과·문제해결·비교대조)와 비교해 보세요.<\/p>", "src": "역락 11장 · 사회평론 4장"}, {"id": "w69", "name": "설명문", "warn": false, "exam": "기출 ×2 (설명하는 글/소개하는 글: 상황 분석, 제목·도입/마무리 지도, 표현·고쳐쓰기)", "scope": "역락·사회평론 (개념·구조 대체로 일치)", "items": ["독자에게 개념·대상·원리·사실을 정확하고 알기 쉽게 전달하는 글", "특징: <b>객관성·정확성·조직성·명료성<\/b>", "구조: 처음(목적 제시, 정의·문제제기·사례로 출발) → 중간(설명 방법으로 상세화) → 끝(요약, 의의·활용 가능성)"], "diff": [{"b": "역", "t": "Meyer(1975)는 비문학 텍스트 전반을 ‘설명적인 글’로 보지만 이 책은 정보 전달이 지배적 기능인 글로 한정합니다. 좋은 설명문은 육하원칙 나열이 아니라 필자가 수사적 상황을 분석·결정한 결과입니다(Blasingame &amp; Bushman 2005). <b>기저 구조 분류<\/b>(권태현 2021, Kintsch 1998): 일반-특수 관계(부연·예시·요약·환언) / 대상-대상 관계(나열·비교·인과·문제해결) / 전체-부분 관계(분류·분석). 2022 교육과정은 텍스트 수준·범위를 구체적으로 명시하는 방식입니다(예: “대상의 특성이 나타나게 설명하는 글”)."}, {"b": "사", "t": "설명문·기사문·보고서의 개념·구조는 역락과 대폭 중복되어 세부 사례만 다르게 다룹니다."}], "explain": "", "src": "역락 11장 · 사회평론 10장"}, {"id": "w70", "name": "보고서", "warn": true, "exam": "기출 ×2 (보고서/보고하는 글: 학습 작문의 의의, 실험 보고서 특성, 작문 워크숍)", "scope": "역락 기준 + 사회평론 13장(심화)", "items": ["주제·대상을 조사·관찰·실험하고 그 과정과 결과를 알리는 글 — 자료 기반 분석·서술, <b>형식성<\/b>이 강함, 출처 제시·구체적 수치 중요", "예상독자는 특정 담화공동체(주로 과제 부과자) → 과제 부과 의도 파악이 중요", "구성: 필요성과 목적 → 절차·방법(재현 가능한 정도로) → 결과(항목화·근거·출처) → 결론(요약+의견) → 참고문헌"], "diff": [{"b": "역", "t": "2022 교육과정 유형: 체험학습 보고서·과학실험 보고서·조사 보고서 + (선택과목) 공동 보고서. 보고서는 학생의 쓰기발달이론보다 교과학습의 실제적 요구를 반영해 초등 3~4학년부터 배치되었습니다. 쓰기 윤리로 출처 명시, 과장·축소·왜곡 금지, 결과를 <b>사실대로 기술<\/b>(의도와 다르게 나와도)을 강조합니다."}, {"b": "사", "t": "조사·실험 보고서를 13장(학습을 위한 글쓰기)에서 심화해 다룹니다(‘조사 보고서’, ‘실험 보고서’ 카드)."}], "explain": "<p>통합인덱스: 보고서·실험보고서 문제 대비 시 <b>사회평론 13장을 우선 확인<\/b>하라고 안내합니다.<\/p>", "src": "역락 11장 · 사회평론 10장·13장"}, {"id": "w71", "name": "기사문", "warn": false, "exam": "", "scope": "역락 고유", "items": ["보도할 가치가 있는 사안을 신속히 전달하는 글 — 설명문·보고서와 달리 <b>보도<\/b> 기능 + 의제설정·여론형성·사회참여 유도의 공공적 기능", "핵심 특징: 보도성 / 객관성·중립성 / <b>역피라미드 구조<\/b>(중요 정보부터) / 시의성·공공성", "신문 기사 3유형(서정우 외 2001): <b>보도<\/b> 기사 / <b>의견<\/b> 기사(논설·칼럼) / <b>특집<\/b> 기사(중간, 맥락을 깊이 조명)"], "diff": [{"b": "역", "t": "외적 구조: 표제 → 전문(육하원칙 요약) → 본문 → 해설(선택). 내적 구조: 육하원칙에 따른 내용 기술. 매체별로 방송기사(구어체, 짧음) / 신문기사(텍스트 중심, 헤드라인) / 인터넷기사(쌍방향 피드백)가 다릅니다. 표현은 공정한 시각·쉬운 표현·단문·한 문단 한 내용이며, <b>인포그래픽<\/b>(정보 + 그래픽)이 그래픽 기사에서 늘고 있습니다."}], "explain": "", "src": "역락 11장"}, {"id": "w72", "name": "담화 종합 (discourse synthesis, Spivey 1984)", "warn": false, "exam": "", "scope": "역락 고유", "items": ["필자가 여러 텍스트에서 정보를 선택·결합해 새롭고 독창적인 텍스트를 생산하는 과정 — 2022 성취기준(복수 자료 활용)과 직결", "<b>텍스트 변형 3유형<\/b>: <b>조직적 변형<\/b>(정보를 재구조화, 예: 시간순 → 주제별) / <b>선택적 변형<\/b>(여러 텍스트에 반복되는 내용을 선택) / <b>연결적 변형<\/b>(여러 출처 정보를 연결하거나 필자의 추론·배경지식으로 내용 추가)"], "diff": [{"b": "역", "t": "정보 수집은 간접적 방법(인쇄·전자매체: 빠르고 많으나 매체 특성·신뢰성 검토 필요)과 직접적 방법(면담·기관 방문: 구체적이나 시간 소요)이 있고, 선별 기준은 목적·주제 적합성, 객관성·신뢰성(전문가·공신력·최신성), 독자 수준에 맞는 유용성입니다. 담화 종합 과정에서 인용·표절 문제가 특히 발생하기 쉽습니다."}], "explain": "<p>독서 영역의 ‘주제 통합적 독서’와 짝이 되는 쓰기 활동입니다.<\/p>", "src": "역락 11장"}, {"id": "w73", "name": "설득하는 글쓰기와 논증의 구성 요소", "warn": true, "exam": "「설득하는 글/주장하는 글/논설문」 기출 ×3 (근거 요건: 타당성·신뢰성)와 연계", "scope": "역락 기준 (사평 11장 공통)", "items": ["설득하는 글: 필자의 의견·주장을 드러내 독자의 <b>태도나 행동<\/b>에 영향을 주려는 글 — 4특징: 의도성 / 도구적 성격 / 독자의 특정성 / <b>독자 중심의 효과성<\/b>", "<b>논증의 5구성요소<\/b>: 주장 · 이유 · 근거 · 전제(warrant) · 반론과 대응", "<b>주장의 명제 3유형<\/b>: 사실 명제 / 정책 명제 / 가치 명제 — 좋은 주장은 논쟁의 여지·반론 가능성이 있되 타당한 근거로 뒷받침 가능", "<b>근거<\/b>: 사실 근거(통계·설문·실험·역사적 사실, 왜곡 금지) vs 의견 근거(권위자 인용, 출처·전문성 명시)"], "diff": [{"b": "역", "t": "<b>설득 vs 논증<\/b>: 설득하는 글(논설문·광고문·연설문 등)은 감정적·윤리적 호소도 효과적일 수 있으나, 논증하는 글(학술논문·연구보고서 등)은 논리적·객관적 근거가 핵심입니다. 이유는 주장-근거를 잇는 연결고리이고, 주장과 이유만으로도 가장 단순한 논증이 성립합니다. <b>반론 수용과 반박<\/b>: 반론을 인정한 뒤 타당한 이유·근거로 논리적으로 대응하면 오히려 주장이 강화됩니다. 교육과정상 초등(이유를 들어 의견 제시) → 중학(타당한 근거로 주장) → 고등(사회적 쟁점 논증)으로 심화합니다."}, {"b": "사", "t": "논증 이론의 배경으로 Toulmin(1958)·Perelman의 신수사학을 다루며(‘수사학과 작문 이론’ 카드), 건의문의 근거 2유형 등 세부 사례를 추가합니다."}], "explain": "", "src": "역락 12장 · 사회평론 11장"}, {"id": "w74", "name": "논설문", "warn": false, "exam": "기출 ×3 (설득하는 글/주장하는 글/논설문 — 근거 요건: 타당성·신뢰성)", "items": ["필자의 의견·주장으로 독자의 이해·설득을 의도하는 글 — 좁은 의미: 서론-본론-결론 삼단 구성 + 주장과 근거", "구조: 서론(문제 상황 → 심각성·필요성 → 주장) → 본론(주장-이유-근거-반론 수용과 반박) → 결론(요약 → 주장 재강조 → 전망)", "특징: ①주장·근거의 합리적 제시(감정 절제, 지나친 자신감·결여 모두 부정적) ②<b>주체적 목소리<\/b> ③<b>일관성<\/b> ④논리적 전개(연역·귀납·유추) ⑤가치 관점의 명확성 ⑥명확한 개념어 사용"], "diff": [{"b": "역", "t": "주장=논제, 근거=논거이며, 불분명한 단어나 과도한 비유는 의도치 않은 설득 방향을 낳을 위험이 있습니다. 넓은 의미로는 평문·사설도 포함합니다."}, {"b": "사", "t": "<b>김라연(2007) 논설문 분석적 평가 기준<\/b>: 주장의 성격 30점(명확성·타당성·신뢰성·참신성·일관성) / 근거의 신뢰성 25점 / 내용의 구성 15점 / 독자에 대한 고려 20점 / 표현 방식 10점 — 글의 목적에 따라 비중을 달리한 사례입니다."}], "explain": "<p>기출 요건: 근거는 <b>타당성<\/b>(주장을 뒷받침하는가)과 <b>신뢰성<\/b>(믿을 만한가)을 갖춰야 합니다.<\/p>", "src": "역락 12장 · 사회평론 9장·11장"}, {"id": "w75", "name": "비평문", "warn": false, "exam": "기출 ×2 (기타 장르: 비평하는 글쓰기)", "scope": "역락 고유", "items": ["대상(예술작품·문학·영화 등)에 대한 해석·가치평가를 담은 분석적 글 — 대상을 더 잘 향유하도록 돕는 목적, 단순 감상문과 달리 주관적 견해 + 객관적 근거·논리의 결합", "5특징: ①결론보다 <b>분석·해석 과정<\/b>이 중요 ②주관+객관의 결합 ③논리적 전개 ④<b>독창적 시각<\/b> ⑤필자의 가치관·문화적 배경 반영", "구조: 서론(대상 소개 + 비평 목적·기준) → 본론(<b>분석<\/b> → <b>해석<\/b> → <b>평가<\/b> → 반론 수용과 반박) → 결론(요약·비평적 의의·제언)"], "diff": [{"b": "역", "t": "자주 쓰는 방식은 인용·해설·예증입니다. 논설문(주장-이유-근거-반박)·비평문(분석-해석-평가-반박)·건의문(해결방안-실현가능성)은 서론-본론-결론은 공통이나 <b>본론의 초점<\/b>이 다릅니다."}], "explain": "<p>통합인덱스: 사평에는 비평문 절이 없습니다(🟢 역락).<\/p>", "src": "역락 12장"}, {"id": "w76", "name": "건의문", "warn": true, "exam": "기출 ×3 최빈출 갈래 (쟁점 파악, 쓰기 워크숍, 실제적 쓰기 과제, 수업 계획)", "scope": "역락·사회평론 공통", "items": ["개인·단체가 문제에 대해 의견과 해결 방안을 제시하는 글 — 건의 주체(생략돼도 존재) + 건의 대상 + 건의 내용·목적", "4대 특징: ①<b>문제의 명확한 제시<\/b>(심각성·시급성) ②<b>실현 가능한 해결 방안<\/b>(타당성 + 근거) ③<b>독자(건의 대상)에 대한 고려<\/b>(권한 여부에 따라 전략이 다름) ④설득력 있는 표현(정중하고 명확한 어조, 협조를 구하는 글)", "구조: 서론(문제 제기·배경 + 건의 대상 명시) → 본론(해결 방안 + 실현가능성·효과) → 결론(요약·강조 + 협조 요청)"], "diff": [{"b": "역", "t": "건의 대상이 문제해결의 직접 권한자면 구체적 방안을 제시하고, 권한이 제한적이면 상위기관에 전달을 요청하는 형태로 표현합니다."}, {"b": "사", "t": "<b>근거 2유형<\/b>: 문제가 중요·심각하다는 근거(손실 설명) / 요구사항이 문제 해결에 효과적이라는 근거. <b>요구 사항의 요건<\/b>: 공익성·공정성·합리성·실현가능성 + 독자가 공감할 내용. <b>최지은·전은주(2012)<\/b> 고등학생 실증: 요구사항은 쓰지만 <b>타당한 근거를 못 쓰고<\/b> 감정적 호소에 그치며, 끝인사·서명 등 격식 요소를 누락(처음·끝의 격식은 우호적 관계 맺기 전략). 맥락 민감성 부족은 실제적 글쓰기 경험 부족에서 기인할 수 있습니다."}], "explain": "<p>통합인덱스: 사평이 실증 연구·사례가 더 풍부합니다. 기출 요소(쟁점 파악·실제적 쓰기 과제·수업 계획)를 보면 건의문은 <b>수업 설계 문제<\/b>와 자주 묶입니다(워크숍·진정한 쓰기).<\/p>", "src": "역락 12장 · 사회평론 11장"}, {"id": "w77", "name": "연설문", "warn": false, "exam": "", "scope": "사회평론 고유", "items": ["화자 1인이 청중을 상대로 지식·정보 전달, 설득, 즐거움 제공을 목적으로 하는 말하기의 원고 (일대다, 공식적)", "<b>아리스토텔레스 3분류<\/b>: 정치적(deliberative, 미래 정책) / 사법적(judicial, 과거 행위의 잘잘못) / <b>제의적<\/b>(epideictic, 미덕 칭찬·공동체 통합)", "작성 원칙: 구어체 + 격식체(합니다체), 간결·명료, 수사적 표현(비유·설의·도치·대구), 시간·분량 조절"], "diff": [{"b": "사", "t": "이창덕 외(2010) 재분류: 정치·사법적=설득 연설, 제의적 중 만찬 등=환담 연설, 강의·강연=정보전달 연설. 구조(설득 중심, 임칠성 외 2004): 서론(주의집중+핵심 메시지) → 본론(핵심 요점 1~3) → 결론(요약·강조·실천 촉구). <b>키케로 7단계<\/b>: 도입 → 서술 → 제안 → 구분 → 확인 → 반증 → 결론. 도입부 전략은 청중이 귀히 여기는 가치 언급·겸손의 표현·‘누구를 대신해 섰다’ 표현이고, 결론부는 접속사 생략법 등으로 감정을 고조하고 ‘이상적 미래’를 제시합니다(킹 목사 사례). 연설문만의 특징은 연설자가 청중 앞에 직접 노출되어 <b>에토스<\/b>가 텍스트뿐 아니라 실제 모습으로도 전달된다는 점입니다."}], "explain": "<p>기출 이력이 없는 영역(통합인덱스)입니다.<\/p>", "src": "사회평론 11장"}, {"id": "w78", "name": "정서 표현·자기 성찰 글쓰기 (수필·기행문·자서전)", "warn": true, "exam": "기출 ×2 (기타 장르: 성찰하는 글)", "scope": "역락 기준 (사평은 ‘표현적 글쓰기’)", "items": ["개인이 자신의 감정·생각·경험을 깊이 탐색해 표현하는 글 — 일기·수필·자서전. 목적은 내면 탐구 + 타인의 공감", "<b>수필<\/b>: 일상 경험·감정을 솔직히 표현, 단계: 경험 선정 → 사건과 감정 연결(오감 묘사) → 성찰·의미 부여 → 표현 다듬기 → 검토(사생활 보호)", "<b>기행문<\/b>: 주요 목적은 <b>정서 표현<\/b>, 정보 전달은 부가(견학 기록·답사기와 구별)", "<b>자서전<\/b>: 생애의 의미 있는 사건·감정·교훈, 구성은 <b>연대기순<\/b> 또는 <b>주제별<\/b>"], "diff": [{"b": "역", "t": "‘슬펐다’ 식의 표면적 감정 나열이 아니라 맥락·인물·장소와 그 경험이 남긴 의미를 구체적으로 서술해야 합니다(감정의 재구성·의미화). 개인적 내용을 다루므로 타인의 사생활 존중(비식별·동의)이 쓰기 윤리상 중요합니다."}, {"b": "사", "t": "‘표현적 글쓰기’(12장)로 부르며 Britton의 3유형·야콥슨의 6기능을 배경으로 깔고, 자기소개서를 추가합니다. 자서전·수필의 개념·구조는 역락과 대체로 공통이라 생략합니다."}], "explain": "<p>⚠️ 명칭은 다르지만 대상 갈래는 겹칩니다. 하위 갈래 구성이 다릅니다: 역락=<b>기행문<\/b> 포함, 사평=<b>자기소개서<\/b> 포함(통합인덱스).<\/p>", "src": "역락 13장 · 사회평론 12장"}, {"id": "w79", "name": "브리튼의 3유형론과 야콥슨의 언어 6기능", "warn": false, "exam": "", "scope": "사회평론 고유", "items": ["<b>Britton 외<\/b>(1966~71, 영국 11~18세): <b>업무적<\/b> 쓰기(transactional: 정보전달·조언·설득) / <b>문예적<\/b> 쓰기(poetic: 언어 자체를 재료로 한 자족적 구조물) / <b>표현적<\/b> 쓰기(expressive: 자아와 밀접, 독자를 크게 의식하지 않음 — 일기·사적 편지·자서전)", "<b>야콥슨 6기능<\/b>: 발신자 → 감정표시적 / 수신자 → 능동적(conative) / 관련상황 → 지시적 / 메시지 → 시적 / 접촉 → 친교적 / 약호체계 → 메타언어적. 표현적 글쓰기는 <b>감정표시적 기능<\/b>과 직결"], "diff": [{"b": "사", "t": "교육과정 대응: 업무적=정보전달·설득 / 문예적=문학 창작·정서표현 일부 / 표현적=정서표현·친교의 글. 브리튼은 인간이 미분화된 <b>표현적 쓰기에서 출발<\/b>해 업무적·문예적 쓰기로 분화한다고 봅니다: 필자의 역할이 <b>참여자(participant)<\/b>면 업무적, <b>관객(spectator)<\/b>이면 문예적으로 발달하고 표현적 쓰기는 두 역할이 미분화된 모체입니다."}], "explain": "", "src": "사회평론 12장"}, {"id": "w80", "name": "자기소개서", "warn": false, "exam": "", "scope": "사회평론 고유", "items": ["‘나에 대한 글쓰기’ — 자서전과 달리 <b>외부 요청에 의한 비자발적 글<\/b>, 예상독자를 적극 의식하는 목적성 강한 실용적 글", "목적별 유형: 자기 성찰 / 친교 / <b>설득<\/b>(입시·취업, 가장 대표적)", "작성 전략: 추상적 가치(성실·배려)를 <b>구체적 사건·이야기<\/b>로 서술, 지정 양식·분량 준수, 작문 맥락(목적·예상독자) 분석이 정확해야 함"], "diff": [{"b": "사", "t": "<b>설득 커뮤니케이션 전략 활용 내용 생성<\/b>(김윤정 2014): 목표 수립 → 속성 분석(MBTI 등) → 문제·기회 정립(<b>SWOT 분석<\/b>) → 세부 전략 → 이미지 설정. 진실성이 중요해 실패 경험도 솔직히 인정하고 배운 점을 쓰는 편이 오히려 좋은 평가를 받을 수 있습니다."}], "explain": "<p>기출 이력이 없는 영역(통합인덱스)입니다.<\/p>", "src": "사회평론 12장"}]}, {"title": "J. 학습을 위한 글쓰기 (사회평론 13장)", "cards": [{"id": "w81", "name": "학습을 위한 글쓰기의 위상과 효과 연구", "warn": false, "exam": "", "scope": "사회평론 고유", "items": ["교육과정: 2007 개정에서 부각 → 2009(요약문·보고서 성취기준, 쓰기윤리) → 2015 심화국어(학문 목적 글쓰기 3단계) → 2022 <b>독서와 작문<\/b>(주제 통합적 읽기를 통한 학습 글쓰기)", "쓰기는 <b>학습의 도구<\/b>(심화 탐구에는 쓰기 필요), <b>고차적 사고력 발달의 매개체<\/b>, 학습자를 <b>지식 수용자에서 담론 생산자로 전환<\/b>", "핵심 연구: Langer &amp; Applebee(1987) — 에세이 쓰기가 사고구술량 2배, 그러나 목적에 따라 최적 유형이 다름(복습=요약, 통합·재구조화=분석적 쓰기)"], "diff": [{"b": "사", "t": "Britton 외(1975): 표현적 쓰기를 기초로 업무적·문예적 쓰기로 발달하며 중등학교는 업무적 쓰기가 중심. Nystrand·Applebee(1981): 교과 쓰기의 대부분이 정보 재생에 그침. Marshall(1984, 11학년 문학수업): 개인적·공식적 쓰기 같은 <b>확장적 쓰기<\/b>가 더 높은 성과. 학문 영역별 쓰기: 자연과학=데이터 정리·실험보고서 / 사회과학=설문·인터뷰 경향분석·조사보고서 / 인문과학=독창적 관점·추론. <b>국어 교과의 3대 역할<\/b>: ①국어 교과 내 학습 심화 ②타 교과 학습을 돕는 <b>쓰기 수행 자체<\/b>의 향상(타 교과 내용은 소재) ③교과 통합적 방향(예: 『허생전』을 역사와 결합)."}], "explain": "<p>요약문·논술문은 통합인덱스가 ‘기출 목록에 명시 항목 없음, 2022 개정 비중 확대로 신출제 가능성 유의’라고 표시한 영역입니다.<\/p>", "src": "사회평론 13장-1~4"}, {"id": "w82", "name": "요약문 (Van Dijk 4규칙·Brown &amp; Day 6규칙)", "warn": false, "exam": "", "scope": "사회평론 고유", "items": ["글의 핵심 내용을 찾아 주제가 드러나게 압축적으로 재구성한 글 — 요약문=자료 이해 중심", "<b>Van Dijk(2001) 4규칙<\/b>: <b>삭제<\/b>(잉여 정보 제거) · <b>선택<\/b>(가치 있는 정보 선정) — 원문 정보를 그대로 제시 / <b>일반화<\/b>(상위개념으로 묶음) · <b>재구성<\/b>(직접 언급되지 않은 필요한 정보를 창출) — 정보를 새롭게 대체", "요건: 완결성 / 담화 표지 활용 / 분량은 목적·맥락에 따라 조정 / <b>자신의 언어<\/b>로 표현"], "diff": [{"b": "사", "t": "<b>난이도 위계<\/b>: 삭제·선택(상대적으로 쉬움) → 일반화·재구성(어려움). Brown &amp; Day(1983): 저학년은 주로 삭제·선택, 고학년은 일반화·재구성을 활용해 더 우수한 요약문을 씁니다. <b>Brown &amp; Day 6대 규칙<\/b>: ①사소한 내용 삭제 ②반복·잉여적인 중요 내용도 삭제 ③항목 목록은 상위어로 대체 ④행동의 하위요소는 포괄적 행동으로 대체 ⑤주제문이 있으면 선택 ⑥없으면 스스로 창출. 송지언(2015) 평가기준: 내용(충실성·정확성) + 조직(체계성·완결성) + 표현(응집성·유창성)."}], "explain": "<p>독서 영역의 ‘정보 텍스트 독서 방법 7단계(요약의 거시규칙)’ 카드와 같은 계열의 규칙입니다(삭제·선택·일반화·구성).<\/p>", "src": "사회평론 13장-5"}, {"id": "w83", "name": "조사 보고서 (4대 조사 방법·설문조사)", "warn": false, "exam": "「보고서/보고하는 글」 기출 ×2와 개념적으로 연계", "scope": "사회평론 고유", "items": ["구조: 서론(문제제기·목적·조사방법) → 본론(조사내용 제시 + 분석·해석 + 필자의 평가적 안목) → 결론(핵심 정리 + 제안·전망)", "<b>4대 조사 방법<\/b>: <b>문헌 조사<\/b>(가장 기본) / <b>관찰 조사<\/b>(외부관찰 vs <b>참여관찰<\/b>=문화기술지·민족지학적 방법) / <b>인터뷰<\/b>(심층 정보) / <b>설문 조사<\/b>(통계적 계량화, 폭넓은 정보)", "설문 절차: 조사 기획 → <b>문항 작성·척도 개발<\/b>(핵심) → 설문지 설계 → 자료 수집 → 분석 → 해석·보고"], "diff": [{"b": "사", "t": "설문 문항은 구조화된 질문(선택형: 이해·분석 용이) vs 비구조화된 질문(자유기술형: 다양하나 해석 어려움)으로 나뉘고, 척도 예시는 <b>리커트 척도<\/b>(동의 정도 5단계) / <b>강제 순위 척도<\/b> / <b>형용사 체크리스트<\/b>입니다. 설문은 문헌조사의 간접성과 관찰·인터뷰의 양적 한계를 보완합니다."}], "explain": "", "src": "사회평론 13장-5"}, {"id": "w84", "name": "실험 보고서 (IMRAD 방식)", "warn": false, "exam": "「보고서/보고하는 글」 기출 ×2 (실험 보고서 특성)", "scope": "사회평론 고유", "items": ["가설을 실험으로 증명하는 과정과 결과를 기술 — 엄정한 절차·정확성 필요", "<b>IMRAD<\/b>: <b>I<\/b>ntroduction(배경·목적·기존연구) → <b>M<\/b>aterial and methods(재현 가능하도록 객관적·구체적) → <b>R<\/b>esults(시각자료·정직한 서술) → <b>D<\/b>iscussion(해석·의미·향후 과제, 예상과 다르면 원인 분석) → (참고문헌)", "문장 표현 3요건: <b>명확성<\/b>(생략 없이, 수식어는 피수식어 앞에) / <b>간결성<\/b>(짧게, 담화표지로 관계 명시) / <b>객관성<\/b>(단정·과장 지양, 일반화 가능 범위 신중히)"], "diff": [{"b": "사", "t": "통합인덱스가 ‘보고서 기출의 실험보고서 특성은 사실상 이 장과 가장 직접 대응’한다고 표시한 부분입니다. 역락의 쓰기 윤리(‘사실대로 쓰기’: 의도와 다른 결과도 그대로 기술)와 함께 보세요."}], "explain": "", "src": "사회평론 13장-5"}, {"id": "w85", "name": "논술문 (단독과제형·자료제시형)", "warn": false, "exam": "", "scope": "사회평론 고유", "items": ["역사: 1981 학력고사(선다형) 도입 → 1986 논술고사 도입(논리적 진술 요구). 입시 왜곡 비판 → <b>‘논술=문제해결 글쓰기’<\/b>로 개념 재정립(서울대 국어교육연구소 1996; 김대행 외 2008; 김영정 2006)", "<b>단독과제형<\/b>: 읽기자료 없이 논제만 — 자유로운 사고 전개, 자료 탐색·적용이 부족하면 피상적 / <b>자료제시형<\/b>: 읽기자료 + 논제 — 분석적 이해·합리적 추론, 읽기-쓰기 연계이나 필자 능동성 제한", "개선 방향 3가지(‘논술 시험은 있지만 논술 교육은 없다’): ①학습자의 능동적 의미구성을 위한 환경 ②읽기-쓰기 긴밀한 연계 ③협력 학습 활성화"], "diff": [{"b": "사", "t": "협력 학습 효과(이영호 2012): 토론하면 내용이 구조화·풍부해지고, 동료평가 시 독자를 고려한 명확한 표현이 늘어납니다. 해외 사례: <b>프랑스 바칼로레아<\/b>(철학 공통필수, 입장 정당화), <b>미국 SAT<\/b> 작문 영역, <b>IB<\/b>(고등 과정 <b>확장형 에세이 Extended Essay<\/b> 필수, 교사와 3회 이상 면담, 국내 8개 교육청 220여 개 학교 도입 — 2023년 기준)."}], "explain": "", "src": "사회평론 13장-5"}]}, {"title": "K. 디지털 글쓰기와 생성형 AI", "cards": [{"id": "w86", "name": "디지털 글쓰기 (생비자·복합양식·행동유도성·컨버전스)", "warn": false, "exam": "", "scope": "역락 고유", "items": ["<b>생비자(prosumer)<\/b>: 생산자 + 소비자(토플러) — 필자와 독자의 역할이 고정되지 않고 상호 전환", "대화의 성격 변화: 인쇄매체의 <b>내적 대화<\/b>(비유적) vs 디지털의 <b>외적 대화<\/b>(댓글·엮인글·하이퍼링크로 즉각 반응)", "<b>복합양식 텍스트(multimodal)<\/b>: 문자·음성·이미지·동영상의 결합(↔ 단일양식). 복합양식 구성은 <b>디자인<\/b>(Kress 2000) 개념으로 설명", "디지털 글쓰기 4특성: 다문서 읽기 기반 / 복합양식 구현 / 디지털 저작 기술의 개입 / 협력과 공유"], "diff": [{"b": "역", "t": "<b>행동유도성(affordance, Gibson)<\/b>: 대상의 속성이 특정 행동을 유도·용이하게 하는 성질 — 복합양식 텍스트에서는 언어·시각·청각·공간 요소가 독자의 행동을 유도합니다. <b>컨버전스 문화<\/b>(Jenkins 2004): 이용자가 적극적으로 미디어를 변형·공유하는 참여 문화. 플랫폼마다 담화 관습이 다르며(블로그=긴 글, SNS=압축적 정보), 디지털 환경에서는 ‘쉐어(share)’ 개념 때문에 외부 자료와 자신의 아이디어 경계가 모호해져 쓰기 윤리 지도가 필요합니다. 2022 교육과정: 복합양식 자료 활용 내용 생성 등이 성취기준에 반영됩니다."}], "explain": "<p>통합인덱스: 사평 5장 ‘변화된 문식환경과 작문교육의 역할’은 원문에 결락되어 <b>역락 단독 출제 근거<\/b>이고 기출 이력은 없습니다. 독서 영역의 ‘디지털 텍스트 독해’·‘복합양식 텍스트’ 카드와 짝지어 보세요.<\/p>", "src": "역락 14장-1·2"}, {"id": "w87", "name": "생성형 AI와 글쓰기 (특성·요구 역량·발달을 고려한 활용)", "warn": false, "exam": "", "scope": "역락 고유", "items": ["<b>파운데이션 모델<\/b>: 방대한 데이터로 자기지도학습 후 미세조정 / <b>환각(hallucination)<\/b>: 논리적으로 보이나 존재하지 않는 정보를 생성 → 인간의 검증 필요", "AI 글쓰기 4특성: 방대한 지식 기반 / 효율성 / 높은 통일성·일관성(개성·창의성은 상대적으로 낮을 수 있음) / 오류 가능성(환각, 복잡한 문맥 한계)", "<b>요구 역량 3가지<\/b>: ①문제해결 능력의 재개념화(AI 산출물을 점검·조정하는 자기조절적 학습 + <b>프롬프트 엔지니어링<\/b>) ②<b>비판적 읽기<\/b>(타당성·공정성·신뢰성 판단, 복수 자료로 검증) ③<b>쓰기 윤리<\/b>(학문적 정직성·저작권·편향)"], "diff": [{"b": "역", "t": "<b>Bereiter 발달 단계를 고려한 활용<\/b>: 기초 문식성이 형성되기 전 하위 단계에서 AI를 무분별하게 허용하면 독립적 글쓰기 경험 부족과 산출물의 수동적 수용을 강화할 위험이 있습니다. 지도 방향은 학년(발달 단계)에 따른 차별적 활용 — 초기에는 제한적 활용으로 주도적 글쓰기 경험을 보장하고, 이후 AI 텍스트의 비판적 분석·재구성 훈련으로 확장합니다. AI는 인간의 담화 종합처럼 고등정신능력이 아닌 기계적 알고리즘으로 구현되므로 필자의 지식 변형 과정이 약화될 우려가 있습니다."}], "explain": "<p>통합인덱스: 2022 개정 이후 신설 영역으로 기출 이력이 없으나 신출제 가능성이 있다고 표시했습니다.<\/p>", "src": "역락 14장-3"}]}]
