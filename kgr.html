}, {"id": "reading", "label": "독서", "sections": [{"title": "A. 독서의 본질·개념", "cards": [{"id": "r01", "name": "독서의 정의 — 의미 구성", "warn": true, "exam": "", "items": ["독서 = 독자가 텍스트를 읽고 <b>의미를 구성<\/b>하는 능동적 사고 활동 (글자를 눈으로 좇는 것만으로는 독서가 아님)", "의미는 필자가 건네주는 것이 아니라 독자가 배경지식·경험을 텍스트와 연결해 만들어 냄"], "diff": [{"b": "역", "t": "최소 정의는 \"독자가 텍스트를 읽는 것\"이고, 텍스트는 서책에 한정되지 않고 자료·기호·영화·디지털 매체까지 포괄합니다. 의미 구성은 독자 머릿속에서 일어나며 원동력은 배경지식이고, 심리학에서는 독자의 심리적 표상(mental representation)이라 부릅니다. 독자 반응에는 인지·정의·사회적 반응이 모두 포함됩니다."}, {"b": "사", "t": "독서의 4대 요인은 목적/과제·텍스트·독자·상황/맥락입니다. 독서를 \"텍스트와 독자가 상호작용하여 의미를 구성하는 정신작용\"으로 재정의하되, 텍스트 우위를 부정하는 것이 아니라 독자를 텍스트와 <b>동등한 지위<\/b>로 격상시킨 것이라고 설명합니다."}, {"b": "국", "t": "의미 구성(이해)을 <b>내용 확인 → 추론 → 평가 → 창의<\/b>의 4단계로 풀어 설명합니다. 명시적 의미를 파악할 때도 문맥 파악·생략 복원 같은 추론이 필요하므로 '만들어 낸다'고 표현합니다."}], "explain": "<p>국교이는 4범주(내용 확인·추론·평가·창의), 역락은 국어과 교육과정의 5범주(사실·추론·비판·감상·창의)로 정리해 <b>범주 수가 다릅니다<\/b>(통합인덱스 표기). '5대 독해 전략' 카드와 함께 보세요.<\/p>", "src": "역락 1장 · 사회평론 2장 · 국교이 1절"}, {"id": "r02", "name": "독서관의 역사적 변화", "warn": true, "exam": "기출 ×2", "scope": "역락·사회평론 공통", "items": ["의미의 소재가 저자·텍스트 → 독자로 이동 (텍스트 중심 → 독자 중심)", "과거 독서관: 의미는 텍스트 속에 있고 독자는 그것을 찾아내는 존재 (정확한 파악·기억 강조)", "오늘날 독서관: 독자가 배경지식·경험을 텍스트와 상호작용시켜 의미를 구성 (추론·평가·감상 강조)"], "diff": [{"b": "역", "t": "Straw &amp; Sadowy(1990)가 200년을 3단계로 봅니다. <b>전달<\/b>(1800~1890, 저자 권위·컵의 물 옮기기) → <b>번역<\/b>(1890~1970년대 말, 의미는 텍스트에 있고 독자는 번역가·퍼즐 맞추기, 행동주의) → <b>상호작용<\/b>(1980~90, 인지심리학·스키마로 독자가 의미 구성). 1990년 이후 사회적 상호작용·<b>교섭<\/b>이 추가되어 4단계로 종합합니다. 강조점은 저자 → 텍스트 → 독자로 이동하며, 윤준채는 이를 항아리·보물찾기·흥정에 비유했습니다."}, {"b": "사", "t": "\"텍스트 중심(1970~80년대 초기 연구) → 독자 재조명\"이라는 큰 구조로 서술합니다. 역락의 4단계와 같은 흐름을 다른 각도에서 쓴 것입니다. 과거 독서관은 필자 중심 지도, 오늘날 독서관은 독자 중심 지도로 이어진다고 설명하고, 기능을 분리해 지도하는 방식의 한계를 자전거 비유로 제기합니다."}], "explain": "<p>단계 이름(전달·번역·상호작용·교섭)은 역락에만 있습니다. 사회평론 표현으로 물으면 '텍스트 중심 vs 독자 중심'으로 답해야 합니다.<\/p>", "src": "역락 1장 · 사회평론 2장·3장"}, {"id": "r03", "name": "해독과 해석(독해)", "warn": true, "exam": "기출 ×1 (읽기 유창성)", "items": ["<b>해독(decoding)<\/b>: 문자(부호)를 소리로 바꾸는 것, 기호의 규약을 앎 (의미와 무관)", "<b>해석·독해<\/b>: 기호의 규약적 의미를 알고 의미를 구성하는 것", "해독은 독해의 선행 조건이며, 자동화 수준까지 도달해야 독해에 인지 자원을 쓸 수 있음"], "diff": [{"b": "국", "t": "\"냉면\" 간판을 [냉면]이라 읽지만 무슨 음식인지 모르면 해독 O, 해석 X입니다. 일본어를 소리 내어 읽을 수 있어도 뜻을 모르면 해독만 한 것입니다."}, {"b": "역", "t": "해독 기능을 음운 인식 / 단어 재인 / 읽기(낭독) 유창성으로 나눕니다. 발달 순서를 '해독 → 단어 이해 → 글의 의미 이해'로 가정하는 것은 상향식 모형의 관점입니다."}, {"b": "사", "t": "독서 능력을 해독+독해의 <b>통합 관계<\/b>로 정의합니다(Alderson 2000). 앞서 Oller(1970년대)의 단일 능력 가설이 있었으나 본인이 입장을 번복했습니다. 해독을 숙달해야 독해로 나아갈 수 있는 순차적 필요조건이라고 봅니다. 해독의 3대 하위요소는 음운 인식·단어 재인·읽기 유창성입니다."}], "explain": "<p>유창성이 낮으면 단어 읽기에만 주의가 쏠려 내용 기억과 배경지식 연결에 실패합니다(사평). '읽기 유창성' 카드와 연결됩니다.<\/p>", "src": "국교이 1절 · 역락 2장 · 사회평론 3장"}, {"id": "r04", "name": "독서의 3영역 (인지·정의·사회)", "warn": false, "exam": "", "scope": "사회평론 고유", "items": ["<b>인지적 영역<\/b>: 텍스트 의미를 파악하는 지적 작용 (독해능력·독해수준·기능과 전략)", "<b>정의적 영역<\/b>: 독자의 감정 관련 부분 (독서 동기·흥미·태도·효능감 등)", "<b>사회적 영역<\/b>: 최근 강조되는 영역 (인지 → 정의 → 사회 순으로 관심 확장)"], "diff": [{"b": "사", "t": "독서교육의 양대 목표는 \"독해를 잘하도록(인지) + 즐겨 읽도록(정의)\"입니다. 사회적 영역의 근거는 정의적 요인 자체가 태생적 속성이 아니라 사회문화적으로 형성된다는 점입니다. 같은 텍스트라도 사회문화적 집단에 따라 해석이 달라집니다(심청의 효행을 보는 조선시대 vs 현대). 20세기 후반 기호학·비판 이론이 독서의 사회적 성격을 규명했습니다."}], "explain": "<p>3영역 통합 지도 사례: 책맹 청소년은 정의적 영역(동기 자극)을 직접 강화하거나, 사회적 영역(독서토론 등)을 강화해 우회할 수 있습니다. 원인 진단(개인차)이 먼저입니다.<\/p>", "src": "사회평론 2장"}, {"id": "r34", "name": "독서의 목적과 자세 (정보수집적 독서 vs 심미적 독서)", "warn": true, "exam": "", "items": ["<b>정보수집적(원심적) 독서<\/b>: 텍스트에서 사실적 정보나 주장을 파악·추출하는 독서 (논리적·분석적 태도)", "<b>심미적 독서<\/b>: 즐거움·미적 경험이 목적, 텍스트(시)의 아름다움을 최대한 경험하는 독서", "두 입장은 이분법이 아니라 <b>연속선(정도성 차이)<\/b> — 독자는 둘을 넘나들며 교섭함"], "diff": [{"b": "역", "t": "Rosenblatt(2004)의 정보수집적(efferent)/심미적(aesthetic) 구분입니다(사용자에 따라 기능적/심미적, 구심적/원심적으로도 명명). 자세(stance)란 독자가 텍스트를 대하는 기본 태도이며, 문예문은 심미적 자세, 정보텍스트는 정보수집적 자세를 주로 취하지만 같은 텍스트도 독자에 따라 달라집니다. 사례: 설명문에서 필자의 어휘 선택에 감탄(심미적 부수), 홍길동전에서 당대 사회 정보를 얻음(정보수집적 부수). 한계: 두 자세가 모두 개인적 목적에 국한되므로 사회적 목적으로서 <b>비판적 자세(critical stance)<\/b>가 필요하다는 주장이 있습니다(천경록 2014)."}, {"b": "사", "t": "'원심적'이라 부르며 어원은 라틴어 efferre(운반하다), 텍스트에서 의미를 추출하는 것이 주목적입니다. 두 입장은 동일 선상의 정도성 차이라는 점을 강조합니다. 이 구분이 문학 감상 수업(심미적)과 정보 텍스트 학습(원심적) 지도법을 차별화하는 근거라고 정리합니다."}], "explain": "<p><b>용어 차이<\/b>: 역락의 '정보수집적' = 사평의 '원심적'(동일 개념, 번역어만 다름)입니다. 천경록 8단계의 '공감적 독서기'는 심미적 읽기와 연결됩니다(카드 '독서 발달 8단계').<\/p>", "src": "역락 1장 · 사회평론 2장"}, {"id": "r35", "name": "로젠블랫의 독자 반응 이론 (상호교섭이론)", "warn": true, "exam": "", "scope": "사회평론 기준 (역락 교섭 모형과 연결)", "items": ["독서 = 특정 시공간·배경지식·신념을 가진 개별 독자와 텍스트가 만나는 <b>사건(교섭, transaction)<\/b>", "원심적 독서와 심미적 독서를 연속선으로 봄", "텍스트를 '시(poem)'로 표현 — 해석의 대상이며 모든 독자에게 동일한 의미를 갖지 않음"], "diff": [{"b": "사", "t": "저서는 『탐구로서의 문학』(1938)과 『독자, 텍스트, 시』(1978)입니다. 이론의 변화: 1938 초기 이론(개념 모호·평가·지도방법 비판) → 2차대전을 거치며 순수문학비평에서 현장 독서교육으로 이동(1948 뉴욕대) → 1978 재정립 → 1980년대 문학중심 교수학습 운동과 결합해 학교 현장에 정착. 독자 반응 이론 계보는 Stanley Fish(해석공동체) / Norman Holland(독자의 심리·정체성) / Jonathan Culler(독서 관습) / Rosenblatt(독서교육에 가장 큰 영향)입니다. 1990년대 이후 Galda·Beach·Lewis가 개인적·심미적 영역에서 <b>사회문화적·비판적 영역<\/b>으로 확장했습니다(갈다&amp;비치 2001 '문화적 활동으로서의 문학반응', 루이스 2000 비판적 문식성)."}, {"b": "역", "t": "교섭 과정 모형의 이론가로 Rosenblatt를 소개합니다. 'transaction'은 Rosenblatt(2004)이 사용한 용어로 교섭·거래·타협·협상·흥정·중재 등으로 번역됩니다. 교섭은 독자-글뿐 아니라 독자-다른 독자, 독자-교사, 독자-맥락·과제 사이에서도 일어납니다."}], "explain": "<p>'독서 과정 모형' 카드(교섭)와 '독서의 목적과 자세' 카드와 함께 보세요. 인덱스가 중복 표시 대상으로 분류한 개념입니다.<\/p>", "src": "사회평론 2장 · 역락 1장"}, {"id": "r36", "name": "독자 반응의 유형 분류", "warn": false, "exam": "", "scope": "사회평론 고유", "items": ["학생 독서 반응 연구는 주로 <b>문학 텍스트(이야기)<\/b> 대상 (정보 텍스트 반응 유형화는 향후 과제)", "독자 반응에 영향을 주는 4요인: 독서 목적·과제 / 텍스트 요인 / 상황 요인 / 독자 요인"], "diff": [{"b": "사", "t": "[표 2-3] 연구자별 분류. <b>Squire(1964, 청소년)<\/b>: 문학적 판단 / 해석적 반응 / 서사적 반응 / 연합적 반응 / 자기연관 / 규범적 판단 / 기타. <b>Newell(1996, 10학년)<\/b>: 서술적·연합적·해석적·평가적 진술 / 기타. <b>Sipe(1998, 초1~2 그림책)<\/b>: 분석적(텍스트와 함께) / 상호텍스트적(텍스트를 넘나들며) / 개인적(텍스트로부터) / 투영적(텍스트를 통해서) / 수행적(텍스트 위에서) 이해. <b>이지영(2011, 초4)<\/b>: 독서과정별 / 독서후반응 / 표현시기 / 개방성 / 표현방식. 교사는 반응을 통해 독해 수준(사실·추론·비판·창조)을 확인할 수 있습니다."}], "explain": "", "src": "사회평론 2장"}, {"id": "r40", "name": "독서의 종류 40가지 (한자어 독서 용어)", "warn": false, "exam": "", "scope": "역락 고유", "items": ["<b>강독(講讀)<\/b>: 책·글을 읽고 그 뜻을 밝힘", "<b>경독(耕讀)<\/b>: 농사지으면서 책·글을 봄", "<b>경독(經讀)<\/b>: 경문(經文)을 읽음", "<b>교독(交讀)<\/b>: 예배 시 목사와 신도가 번갈아 읽음(십계명 등)", "<b>구독(購讀)<\/b>: 책·신문·잡지 등을 사서 읽음", "<b>남독(濫讀)<\/b>: 서적을 닥치는 대로 마구 읽음", "<b>낭독(朗讀)<\/b>: 책·글을 맑은 소리로 읽음", "<b>다독(多讀)<\/b>: 책·글을 많이 읽음", "<b>대독(代讀)<\/b>: 축사·식사 등을 대신 읽어줌", "<b>도독(盜讀)<\/b>: 남의 것을 몰래 훔쳐 읽음", "<b>묵독(默讀)<\/b>: 소리 내지 않고 읽음", "<b>미독(味讀)<\/b>: 내용을 충분히 음미하며 읽음", "<b>배독(拜讀)<\/b>: 남의 글을 공손히 읽음", "<b>범독(泛讀)<\/b>: 정신을 기울이지 않고 데면데면하게, 혹은 이것저것 여러 가지를 읽음", "<b>복독(復讀)<\/b>: 되풀이하여 읽음", "<b>봉독(奉讀)<\/b>: 남의 글을 받들어 읽음", "<b>비독(飛讀)<\/b>: 띄엄띄엄, 여기저기 빼놓고 읽음", "<b>세독(細讀)<\/b>: 자세히 읽음", "<b>속독(速讀)<\/b>: 빨리 읽음", "<b>심독(心讀)<\/b>: 마음속으로 읽음", "<b>애독(愛讀)<\/b>: 즐겨 읽음", "<b>역독(譯讀)<\/b>: 번역하여 읽음", "<b>숙독(熟讀)<\/b>: 익숙하도록, 뜻을 생각하며 자세히 읽음", "<b>열독(閱讀)<\/b>: 쭉 훑어 읽음", "<b>염독(念讀)<\/b>: 정신 차려 읽음", "<b>오독(誤讀)<\/b>: 잘못 읽음", "<b>음독(音讀)<\/b>: 소리 내어 읽음", "<b>일독(一讀)<\/b>: 한 번 읽음", "<b>재독(再讀)<\/b>: 한 번 읽은 것을 다시 읽음", "<b>정독(精讀)<\/b>: 자세히 살피어 정밀히 읽음", "<b>주독(走讀)<\/b>: 빨리빨리 건성으로 읽음", "<b>탐독(耽讀)<\/b>: 다른 일을 잊을 정도로 열중하여 읽음", "<b>통독(通讀)<\/b>: 처음부터 끝까지 내리 읽음", "<b>판독(判讀)<\/b>: 어려운 문장·암호·고문서 등의 뜻을 헤아려 읽음", "<b>편독(偏讀)<\/b>: 한 방면에만 치우쳐 읽음", "<b>풍독(諷讀)<\/b>: 외어서 읽음", "<b>해독(解讀)<\/b>: 글의 뜻을 풀어 읽음/읽어서 뜻을 알아냄. 자구를 소리 내어 읽고 축자적 읽기(literal reading)에 주력", "<b>회독(回讀)<\/b>: 여러 사람이 차례로 돌려가며 읽음", "<b>회독(會讀)<\/b>: 여럿이 모여 읽고 연구·토론함", "<b>훈독(訓讀)<\/b>: 한자의 뜻을 새겨 읽음"], "diff": [], "explain": "<p>원문에서 '한자와 의미를 짝짓는 형태로 자주 활용되어 임용 출제 가능성이 높다'고 표시한 부분입니다(천경록 등 2006 정리, 가나다순). 원문 자체가 '한자 표기 중 OCR 오인식 가능성이 있는 항목(교독, 범독, 숙독, 풍독 등)은 원문 한자 재확인 권장'이라고 밝히고 있습니다. 같은 발음이 겹치는 항목(경독 2개, 회독 2개)에 유의하세요.<\/p>", "src": "역락 1장 (40개 항목)"}]}, {"title": "B. 독서 과정 모형", "cards": [{"id": "r05", "name": "독서 과정 모형 (상향식·하향식·상호작용·교섭)", "warn": true, "exam": "", "items": [{"t": "<b>상향식<\/b>: 글(문자)에서 출발, 의미는 글에 있음. 이론가 Gough (행동주의·해독 강조)", "c": []}, "<b>하향식<\/b>: 독자의 배경지식·스키마·예측이 이끎, 의미는 독자에 있음. 이론가 Goodman (\"심리언어학적 추측 게임\")", "<b>상호작용<\/b>: 상향식과 하향식이 동시에 작용. 이론가 Rumelhart", "<b>교섭<\/b>(역락·사회평론): 상호작용에 <b>맥락<\/b>을 더한 모형. 이론가 Rosenblatt (국교이에는 없음)"], "diff": [{"b": "역", "t": "[표 1-2] 4모형 비교. 의미의 위치는 글 / 독자 / 독자·글 / 독자·글·저자·맥락입니다. 배경 심리학은 행동주의 / 형태심리학 / 인지심리학 / 사회구성주의입니다. 독서 형태는 상향식=음독·유창한 읽기, 하향식=발췌독·재독, 상호작용=묵독, 교섭=비판적·심미적·창의적 독서입니다. 교섭의 의미는 독자·다른 독자·글·저자·맥락에 편재(distributed)합니다."}, {"b": "사", "t": "굿맨(1970) 하향식 모형의 절차(사전 예측→검색→고정→단서 선택→형성→탐색)와 하향식 4대 비판(설명이 추상적, 눈동자 추적 연구, 능숙한 독자만 전제, 능동적 추측이 오히려 비효율)을 제시합니다. 러멜하트 모형의 구조는 형태종합장치 중심입니다. 교섭 모형과 유사한 취지의 <b>사회·문화 모형<\/b>을 별도로 다룹니다."}, {"b": "국", "t": "3대 모형(고프 1972 / 굿맨 1984 / 러멜하트 1985)만 다루며 발달단계표와 결합해 압축합니다. 스키마 이론의 한계(PDP 모형으로의 재검토)를 덧붙입니다."}], "explain": "<p>⚠️ 역락 [표 1-2]는 OCR로 표가 흐트러져 재구성된 것이라 특히 <b>'주요 독서 형태' 열은 원문 확인<\/b>이 필요하다고 자료에 표시되어 있습니다.<\/p><p>연도가 책마다 다릅니다: 러멜하트는 사평 1977, 국교이 1985 / 굿맨은 사평 1970, 국교이 1984. 서로 다른 저작을 가리킬 수 있습니다.<\/p><p>모형별 상세는 '상향식 모형', '하향식 모형', '상호작용 모형', '교섭 모형과 사회·문화 모형' 카드를 보세요.<\/p>", "src": "역락 1장 [표 1-2] · 사회평론 4장 · 국교이 2절"}, {"id": "r37", "name": "상향식 모형", "warn": true, "exam": "", "items": ["글의 가장 작은 단위(자소·음절·단어…)부터 순차적으로 뜻을 파악해 글 전체를 이해한다고 봄 (퍼즐 조각 맞추기 비유)", "글 중심·기능(skill) 중심의 독서, 의미는 글 속의 저자가 의도한 의미", "하위 기능은 독립적으로 순서대로 가르침 → 직접교수법 선호, 독자는 수동적", "독해 = 해독 × 듣기"], "diff": [{"b": "역", "t": "하위 단위 처리가 안 되면 상위 처리도 어렵다고 가정합니다. 하위기능 예: 해독·단어 재인·어구 나누기·유창성·추론. 통제된 텍스트를 쓰는데 실제 세상의 글이 아니라는 비판을 받습니다. 발달 순서 가정은 '해독 → 단어 이해 → 글의 의미 이해'이고, 해독이 자동화되지 않으면 인지 자원이 해독에 소모되어 독해가 실패한다고 봅니다. 이론가는 P. V. Gough로, 정음법(phonics)을 강조합니다."}, {"b": "사", "t": "자모 → 단어 → 구 → 절 → 문장 순으로 확대되는 단선적 모형입니다. <b>고프(1972) 모형<\/b>의 흐름: 문자시각정보 입력 → 시각영상 → 스캐너(문자형태재인) → 문자등록기 → 해독기 → 음운테이프 → 의미사전·어휘목록 → 1차기억저장소 → 멀린(Merlin, 통사·의미지식을 적용하는 마법장치) → 최종기억등록장치. <b>4대 비판<\/b>(노명완 1990): ①의미단어가 무의미단어보다 빨리 인식되는 현상(태극기 &gt; 기극태) ②음운규칙에 부합하는 무의미단어의 인식속도 차이 ③의미적 인접성에 따른 지각속도 차이(침실-이불 &gt; 침실-반찬) ④문맥에 의한 중의성 해소를 설명 못함. 눈동자 추적 연구에서는 전체 단어의 50~75%에만 시선이 고정됩니다."}, {"b": "국", "t": "고프(1972) 모형으로 소개합니다. 검은 글자 모양만을 단서로 분석하며 문맥·배경지식을 배제하고, 행동주의 교육관(모방·반복)+기능 중심 개념과 결합해 읽기 기능을 문자-단어-구-문장-단문-장문 단위로 나눠 훈련하는 프로그램식 지도법이 됩니다. 독자는 수동적이고 글의 의미는 하나라는 관념을 심었다고 비판하지만, 문자 지각·인식 과정 연구를 이끌어냈다는 연구사적 의의도 인정합니다."}], "explain": "<p>'숙련 효과는 단위가 작을수록 크다'는 원리는 국교이의 기능 설명과 연결됩니다(카드 '독서 기능 vs 독서 전략').<\/p>", "src": "역락 1장 · 사회평론 4장 · 국교이 2절"}, {"id": "r38", "name": "하향식 모형", "warn": true, "exam": "", "items": ["의미는 글이 아니라 <b>독자의 머리<\/b>에 있음, 독자가 배경지식을 적극 활성화해 의미를 구성 (독자 중심)", "글은 의미의 단초·자극일 뿐 — 사진의 필름과 현상액(배경지식) 비유", "이론가 Goodman, 독서를 '심리언어학적 추측 게임'으로 명명"], "diff": [{"b": "역", "t": "하향식 등장의 계기는 상향식이 설명 못한 현상(배경지식 연결을 통제하면 이해에 실패)으로, Bransford &amp; Johnson(1972) 세탁물 실험이 사례입니다. 의미 구성 과정: 배경지식 활성화 → 선택 → 인출 → 내용 예측·생략 추론 → 새 내용을 배경지식에 통합·기억. 이 과정이 목적 지향적이며 최적 방법을 유연하게 고르는 사고이므로 <b>전략(strategy)<\/b>이라 부릅니다(상향식의 기능과 대비)."}, {"b": "사", "t": "<b>굿맨(1970) 모형<\/b>은 변형생성문법(1960년대)에 기반하고 '독자의 사전 예측'이 핵심입니다. 절차는 사전 예측 → 검색(scan) → 고정(fix) → 단서 선택 → 형성 → 탐색이며, 결과로 의미 / 예측 / 부분적 의미 세 형태를 얻습니다. <b>4대 비판<\/b>: ①세부 설명 없이 추상적(상위정보가 하위처리에 '영향을 미친다'고만 함) ②눈동자 추적 연구(Just &amp; Carpenter 1980)에서 가정·추론이 눈동자 움직임을 제어하지 않음 ③능숙한 독자만 전제(미숙한 독자 설명 불가) ④어려운 글에서는 가정·추측이 오히려 비효율적. 모형 수립 근거가 초등학생의 오독분석이었다는 한계도 지적됩니다."}, {"b": "국", "t": "굿맨(1984) 모형입니다. 배경지식·큰 단위 의미(맥락)가 작은 단위(문자) 인식에 영향을 미치고, '표집과 예측'으로 기호를 분석합니다. '정확한 의미 파악'에서 '가능한 의미의 구성'으로 지도 중심이 이동했습니다. 한계: 미숙한 독자는 적은 정보로 과일반화하고, 스키마 과대적용은 아는 것만 더 잘 알게 하며, 스키마의 위계 구조는 PDP 모형으로 재검토됩니다."}], "explain": "<p>연도 차이(굿맨 사평 1970 / 국교이 1984)는 서로 다른 저작을 가리킬 수 있습니다.<\/p>", "src": "역락 1장 · 사회평론 4장 · 국교이 2절"}, {"id": "r39", "name": "상호작용 모형", "warn": true, "exam": "", "items": ["상향식과 하향식이 <b>동시에<\/b> 일어난다고 인정 (의미는 글에도, 독자에도 있음)", "이론가 Rumelhart", "실제 대부분의 독서는 글과 독자의 상호작용으로 이루어짐"], "diff": [{"b": "역", "t": "상향식·하향식 지지자 사이의 '독서 전쟁(reading war)'이 배경입니다. 음독 오류(miscues)를 상향식은 부정적으로, 하향식은 능동적 읽기의 증거로 해석했습니다. 진행: 목적 고려 → 배경지식 활성화 → 내용 예측 → 예측 확인 → 불일치하면 다시 읽기 → 새 의미를 배경지식에 재통합(Watson, Burke &amp; Goodman 1996). 지도 모형은 <b>균형적 지도법<\/b>이고, 하위 과정을 해독·어휘·독해로 나눠 병렬적으로 지도합니다."}, {"b": "사", "t": "<b>러멜하트(1977) 모형<\/b>: 문자소정보 → 시각정보저장소(특성추출장치) → <b>형태종합장치<\/b>(통사·의미·철자·어휘 지식이 동시에 작동) → 최적 의미해석. 특성추출장치가 양쪽에 동시에 영향을 주는 구조가 상호작용성을 구현합니다. <b>4대 비판<\/b>(노명완 1990): ①절충인지 통합인지 불명료 ②독서 실패의 원인 특정이 어려움 ③지식자원을 갖고도 인출에 실패하는 현상 설명 못함 ④<b>초인지 처리 장치가 없음<\/b>."}, {"b": "국", "t": "러멜하트(1985) 모형입니다. 고프 모형에 대한 반론이자 보완으로 6가지 반증을 제시하고(같은 모양 글자도 주위 글자에 따라 다르게 읽힘 등), 시지각 입력의 문자 분석과 전후 맥락의 예측·가정이 만나는 지점에서 해독이 확정된다고 설명합니다."}], "explain": "<p>4모형 비교는 '독서 과정 모형' 카드를 참고하세요.<\/p>", "src": "역락 1장 · 사회평론 4장 · 국교이 2절"}, {"id": "r41", "name": "교섭 모형과 사회·문화 모형", "warn": true, "exam": "", "items": ["상호작용 모형에 <b>맥락<\/b>(사회·문화적 요소)을 더한 모형", "독서는 고립된 개인의 활동이 아니라 사회적 활동, 독자는 사회적 존재", "배경 심리학은 사회구성주의(Vygotsky)"], "diff": [{"b": "역", "t": "<b>교섭 모형<\/b>(Rosenblatt). 맥락의 구성 요소는 인적 상황·물리적 환경·관계적 상황·사회문화적 맥락입니다. 의미는 독자·다른 독자·글·저자·맥락에 <b>편재(distributed)<\/b>하며, 저자가 의도하지 않은 의미까지 포함해 비판적·창조적 독서가 나타납니다. 네 모형 중 분석 대상에 가장 잘 맞는 모형을 골라 적용해야 하며, 기초기능이 부진한 느린 학습자에게는 상향식이 적합할 수 있습니다."}, {"b": "사", "t": "<b>사회·문화 모형<\/b>으로 별도 범주를 설정하고, 앞의 세 모형을 '인지 과정 모형'으로 묶습니다. 개인/사회/기관 차원의 관점·가치·신념·역사·언어·소통방식과 독서 맥락을 강조합니다. <b>루델 &amp; 언라우(1994) 모형<\/b>은 교실과 교사를 모형에 명시적으로 포함한 최초 사례이고, 독자 요인을 <b>인지적 조건<\/b>(선언적·절차적·조건적 지식, 언어지식, 텍스트처리전략과 초인지 등)과 <b>정의적 조건<\/b>(독서동기·태도·독자입장·사회문화적 가치·신념)으로 이원화했습니다. <b>3대 비판<\/b>: ①사회문화 요소가 무엇이고 어떻게 영향을 주는지 구체성 부족 ②요소-결과 간 예측력 부족 ③사회문화 요소를 인식·반영하는 것도 결국 독자이므로 독자의 능동성을 배제하기 어려움."}], "explain": "<p>역락은 4모형(상향·하향·상호작용·교섭), 사평은 3+1(인지 과정 모형 3 + 사회·문화 모형)로 분류가 다릅니다. 인덱스는 '교섭 모형과 유사한 위치이나 초점이 다르다'고 표시합니다.<\/p>", "src": "역락 1장 · 사회평론 4장"}, {"id": "r42", "name": "독서 모형의 정의·기능·한계", "warn": false, "exam": "", "scope": "사회평론 고유", "items": ["독서 모형: 독자 머릿속 의미 구성 과정을 명시적으로 드러낸 그림·도식 (1970~80년대가 전성기)", "독서 이론의 '거울' — 모형의 변화가 이론의 발전에 대응", "장점: 비가시적·복합적 과정을 명료화 / 단점: ①과도한 단순화 ②모형에 없는 요인은 배제 ③가설적 성격"], "diff": [{"b": "사", "t": "완전한 모형은 원리상 불가능합니다(잠정적 진술). 이 책은 상향식·하향식·상호작용을 '인지 과정 모형', 사회·문화 모형을 별도로 분류합니다."}], "explain": "", "src": "사회평론 4장"}]}, {"title": "C. 텍스트론", "cards": [{"id": "r06", "name": "통일성과 응집성", "warn": false, "exam": "", "scope": "역락 기준", "items": ["<b>통일성(coherence)<\/b>: 하위 내용이 하나의 주제로 <b>의미적<\/b>으로 연결, 겉으로 안 드러나 추론이 필요", "<b>응집성(cohesion)<\/b>: 요소들이 <b>표면적(문법적)<\/b>으로 연결, 지시·접속·대용 같은 응집 장치로 확인", "텍스트성 7기준(Beaugrande &amp; Dressler): 통일성·응집성·의도성·용인성·정보성·상황성·상호텍스트성 — 이 중 통일성·응집성이 가장 중요"], "diff": [{"b": "역", "t": "응집 장치는 Halliday &amp; Hasan(1976)의 5유형(지시·대용·생략·접속·어휘적 결속)이며, 교육과정 용어로는 지시·접속·대용·텍스트 구조 표지(담화 표지) 4가지입니다. 사례: \"모두 살색입니다\"(공익광고)는 표면상 튀지만 맥락+배경지식으로 통일성을 파악합니다. \"곱슬머리 학생이 손을 들었다. 그는 문제를 제기했다\"는 지시어로 응집됩니다."}, {"b": "사", "t": "통일성의 2층위를 나눕니다: 부분적(명제 간) + 전체적(글 전체). 텍스트성 7요소 중 응집성·통일성을 가장 중요하게 보는 입장을 '텍스트의 정의' 1번 입장(형태·구조 중심)으로 정리합니다."}], "explain": "<p>Stubbs(1983)는 cohesion=표면 결속, coherence=내면 결속으로 구분하고 Halliday &amp; Hasan(1976)은 구분 없이 cohesion으로 통합해 설명하는 번역·정의 차이가 있습니다(사평, '텍스트의 정의' 카드).<\/p>", "src": "역락 2장 · 사회평론 5장"}, {"id": "r07", "name": "설명문 텍스트 구조 (상위구조 유형)", "warn": true, "exam": "기출 ×3", "items": ["<b>미시구조<\/b>(문장 간) → <b>거시구조<\/b>(문단 단위·요약) → <b>상위구조<\/b>(전체의 관습적 도식) (van Dijk)", "설명문 구조의 대표 유형: <b>수집(나열)<\/b> · <b>인과<\/b> · <b>문제-해결<\/b> · <b>비교-대조<\/b>", "담화 표지어로 구조를 파악 (예: 왜냐하면·따라서=인과, 반면에=비교대조)"], "diff": [{"b": "사", "t": "Kintsch(1974)·Meyer(1975)의 5종(기술/집합/인과/반응/비교대조)에서 Carrell(1984)이 기술+집합을 <b>수집구조<\/b>로 합쳐 4종이 되었습니다. 표지어: 수집=첫째·둘째, 인과=왜냐하면·따라서, 문제해결=문제는~이다/해결책은~이다, 비교대조=이와 달리·반면에·한편. 인과·문제해결·비교대조는 의미관계가 <b>쌍<\/b>을 이루며 수집구조보다 연속성이 강합니다. 상위구조는 위상이 불분명하다는 비판(Brinker 1992)도 있습니다."}, {"b": "역", "t": "상위구조 유형을 학자별로 나열합니다(Carrell 4유형·Hillman 6유형·Arnaudet &amp; Barrett 4유형). 국어과 교육과정은 원인-결과·문제-해결·비교/대조·나열·수집·연대기식으로 소개합니다(2009개정). 8장에서는 설명텍스트 5대 구조를 원인-결과/문제-해결/비교대조/수집-기술/시간순서로 적습니다. 9장에는 설명문 독해 전략 9가지(서-본-결 활용, '은/는'으로 화제 파악 등)가 있습니다."}, {"b": "국", "t": "구조를 <b>위계형 vs 연쇄형<\/b> 2대 구조로 단순화합니다. 위계형은 중심-세부의 상하위 위계로 설명문·논설문의 거시구조이며, '근거-주장' 관계가 있으면 논증문입니다. 연쇄형은 앞뒤 내용이 꼬리를 무는 구조로 이야기류의 거시구조입니다."}], "explain": "<p>구조 <b>수<\/b>가 책마다 다릅니다: 사평 4 / 역락 3(교육과정)·5(8장)·학자별 4~6 / 국교이 2. 사평의 위계형=논증·설명, 연쇄형=이야기형과 대응하나 완전히 같은 층위는 아니라고 인덱스가 밝힙니다.<\/p>", "src": "사회평론 5장 · 역락 2장·8장·9장 · 국교이 2절"}, {"id": "r08", "name": "이야기 문법", "warn": false, "exam": "", "scope": "역락·사회평론 공통", "items": ["이야기가 지닌 일정한 구조·틀 (배경-주제-플롯(에피소드)-해결)", "Rumelhart(1975)가 최초 제안, Thorndyke(1977)가 수정", "에피소드 = 배경 + 사건들 (시초 사건 → 시도 → 결과·해결 → 반응)"], "diff": [{"b": "역", "t": "구성 요소: 이야기=주제+플롯 / 에피소드=배경+사건들 / 배경=시간+장소+중심인물. 콩쥐팥쥐 도식 적용 사례가 있고, 이야기 문법 기반 '탐정 독자' 전략(5Wh 질문)으로 지도합니다."}, {"b": "사", "t": "러멜하트: 이야기=배경에서 일어나는 일화로 구성. 소재별 유사 패턴 사례로 영웅 일대기(기이한 출생-비범한 능력-시련-조력자-성장 후 위기-고난 극복)와 남녀 사랑이야기(만남-사랑-이별-재회)를 듭니다."}], "explain": "<p>Propp(1928)·Colby(1973)도 사평이 제시한 이야기 구조 연구자입니다.<\/p>", "src": "역락 2장 · 사회평론 5장"}, {"id": "r09", "name": "텍스트의 유형과 종류", "warn": false, "exam": "", "scope": "역락·국교이 공통", "items": ["텍스트 <b>유형<\/b>: 기능·형식에 따른 대분류 (정보전달·설득·친교·정서표현)", "텍스트 <b>종류<\/b>(문종): 유형의 하위, 관습화된 형식 (논설문·기사문 등)", "하나의 종류가 항상 하나의 유형에만 속하지 않음 — 맥락에 따라 달라짐"], "diff": [{"b": "역", "t": "6차 교육과정부터 4분법을 반영했고 2015 개정에서 친교+정서표현을 통합해 3가지가 되었습니다. 사례: 소설은 친교·설득·미적 유형에 모두 속할 수 있고, 편지글은 통상 친교이지만 용돈 요구라면 설득이며, 책 소개 글이 신문 광고란에 실리면 광고(설득)입니다."}, {"b": "국", "t": "기능 중심(정서표현/친교/정보전달/설득)과 구조 중심(기술/설명/논증) 두 기준으로 분류합니다. 교육과정은 정보적 텍스트+정서표현 텍스트의 2대 분류입니다. 혼합형 사례: 서평·광고(설득+정보전달), 기행문(정보전달+표현). 유형별 관습적 전개는 견문과 감상 / 화제와 서술 / 주장과 논거입니다."}], "explain": "<p>분류 <b>개수<\/b>가 책마다 다릅니다: 역락 4→3분법(교육과정 변천) / 국교이 기능 4·구조 3, 교육과정 2대 분류.<\/p>", "src": "역락 2장 · 국교이 2절 · 사회평론 5장(학설사)"}, {"id": "r43", "name": "텍스트의 정의", "warn": true, "exam": "", "items": ["텍스트 = 통일성·응집성을 갖추어 짜인 기호물 (어원: texture·texere '직조·엮다')", "구조 중심 입장(응집성·통일성)과 의사소통 중심 입장이 있음", "읽기의 단위가 '텍스트'여야 하는 이유: 문법 지식만으로는 맥락을 못 읽고, 맥락은 텍스트 단위에서 드러남"], "diff": [{"b": "역", "t": "전통적으로 문장 이상의 단위였으나 현재는 영화·회화·동영상 등 이해·표현 대상이 되는 모든 매체로 확장됩니다(구어=discourse, 문어=text 구분은 통용되지 않음). 관련 개념: 발화(utterance), 발화수반 의미(화행이론). 사례: \"너 참 잘했다\"는 화병을 깬 상황이면 비난입니다(표면 의미 ≠ 맥락적 의미)."}, {"b": "사", "t": "<b>2가지 입장<\/b>. ①형태·구조 중심: 응집성(표면적 통사 연결)+통일성(의미론적 일관성), Beaugrande &amp; Dressler의 7요소 중 두 가지가 핵심. ②의사소통 중심: 의사소통 발화로 사용되는 언어 단위(Halliday &amp; Hasan 1976)로 분량 무관합니다(\"정지\" 표지판 한 단어도 텍스트). 종합 정의: \"어떤 맥락 내에서 응집성·통일성을 지니고 의사소통적 기능을 수행하는 의미의 완결체\"이며, 텍스트를 독자의 해석으로 완성되는 열린 대상으로 재규정합니다. 학자 간 번역·정의 차이: Stubbs(1983)는 cohesion=표면 결속, coherence=내면 결속으로 구분하고, Halliday &amp; Hasan(1976)은 구분 없이 cohesion으로 통합해 설명합니다."}], "explain": "<p>통일성·응집성 자세한 변별은 '통일성과 응집성' 카드를 보세요.<\/p>", "src": "역락 2장 · 사회평론 5장"}, {"id": "r44", "name": "텍스트 유형 분류 (학설사와 교육과정 분류)", "warn": true, "exam": "", "scope": "사회평론 기준", "items": ["교육과정은 6차부터 <b>목적(기능)<\/b> 기준으로 텍스트 유형을 분류함 (현재까지 지속)", "교육과정 3+1 대분류: 구어/문어 · 정보/문학 · 인쇄/복합양식 (+ 하이퍼텍스트)"], "diff": [{"b": "사", "t": "<b>텍스트언어학 3대 분류<\/b>: Janich(1972, 구조 중심) / Rolf(1993, 화용 중심) / <b>Brinker(1985, 기능 중심 통합)<\/b> — 기능 5종은 제보·호소·책무·접촉·선언(설명문·논설문·계약서·편지글·임명장 등과 대응). 국내 이도영(1998)은 제보적·설득적·표현적·미적·친교적 5종입니다. <b>구어 vs 문어<\/b>: 경계가 불명확(대화체 편지)하며, 문어는 시공간 제약이 없고 추론·상상을 촉진, 구어는 비언어적·준언어적 표현과 상황맥락 의존이 특징입니다. <b>정보 vs 문학<\/b>: 정보텍스트=정보전달/설득/친교 및 정서표현의 글 3종, 문학텍스트=서정·서사·극·교술 4갈래(친교 및 정서표현의 글은 문학과 경계가 모호). 2015개정 이후 정보전달·설득 2가지로 단순화되는 경향이며, &lt;화법과 작문&gt;에서는 '자기표현과 사회적 상호작용의 글'로 명칭이 바뀝니다. <b>인쇄 vs 복합양식<\/b>: 인쇄텍스트(8세기 중국 목판인쇄술 기원) / 복합양식텍스트(그림일기·삼강행실도는 디지털 이전에도 존재) / 하이퍼텍스트(하이퍼링크로 다른 문서를 호출, 필자-독자 관계가 쌍방향으로 변화)."}, {"b": "역", "t": "언어사용 목적 4분법(정보전달·설득·친교·정서표현)이 6차부터 반영되었고 2015에서 3가지로 줄었다고 설명합니다('텍스트의 유형과 종류' 카드)."}], "explain": "", "src": "사회평론 5장 · 역락 2장"}, {"id": "r45", "name": "텍스트 난도 판단의 3측면", "warn": false, "exam": "기출 ×1 (텍스트 수준 설정 방법)", "scope": "사회평론 고유", "items": ["<b>텍스트적 측면<\/b>: 언어적 특성(어휘 난도·빈도, 문장 길이·구조, 전체 구조·편집·삽화) + 내용적 특성(장르, 주제 친숙도)", "<b>독자적 측면<\/b>: 인지적 특성(지적능력·어휘력·배경지식·읽기능력) + 정의적 특성(흥미·동기·효능감)", "<b>상황적 측면<\/b>: 독서 목적(과제) + 독서 환경"], "diff": [{"b": "사", "t": "용어: <b>이독성(readability, 易讀性)<\/b>은 글의 읽기 쉬움 정도이고 <b>가독성(legibility)<\/b>은 폰트·편집 등 시각적 읽기 편의성입니다. 최근엔 텍스트 복잡도(text complexity, CCSS 2010)로 확장됩니다. 판별 사례: 문장이 간결해도 내용이 낯설면 어렵고(내용 친숙도의 독립적 영향), 같은 능력이어도 흥미·자발성(선택 vs 강요)에 따라 체감 난도가 다르며, 『어린왕자』도 개인적 감상 vs 비평적 분석에 따라 난도 체감이 다릅니다."}], "explain": "<p>국교이는 '평가 텍스트 선정 4대 기준'(난도가 학습자에 적합해야 함)에서 이 개념을 실무적으로 다룹니다.<\/p>", "src": "사회평론 5장 [표 5-5]"}, {"id": "r46", "name": "텍스트 난도 측정 (양적 측정 vs 질적 평정)", "warn": false, "exam": "기출 ×1", "scope": "사회평론 고유", "items": ["<b>양적 측정(이독성 공식)<\/b>: 어휘 난도·문장 길이·복잡도를 수치화", "<b>질적 평정<\/b>: 교사·전문가의 경험·직관 기반, 독자적 측면까지 포괄 가능"], "diff": [{"b": "사", "t": "양적 측정의 대표: Chall의 이독성 공식, Flesch Reading Ease(1948; 학년수준 = 0.39×(단어수/문장수) + 11.8×(음절수/단어수) − 15.59), Harris &amp; Jacobson(1982), Dale-Chall, Flesch-Kincaid. 국내는 윤창욱(2006)과 <b>서혁 외(2013) 텍스트 복잡도 공식<\/b>(초등·중등 별도, 설명력 75.2%·65.6%)이고 미국 렉사일(Lexile) 지수가 상용화 사례입니다. 한계: 객관적 지표이나 학생 적합성을 담보하지 못하고 어휘빈도·문장길이만으로 난도의 전모를 잡지 못합니다. 질적 평정: 정혜승(2010)이 양적 측정 보완용으로 제안하고, <b>최숙기(2012)<\/b>는 CCSS(2010) 모형에 기반해 4대 질적 요인(글의 의도·글의 구조·언어의 관습성과 명료성·지식 요구)을 평정합니다. 한계는 평정자 전문성 의존과 평정자 간 신뢰도이며 '학년수준 샘플 글' 구축이 보완책입니다. CCSS 3요인: 양적 영역 / 질적 영역 / 독자 및 과제."}], "explain": "", "src": "사회평론 5장"}, {"id": "r47", "name": "복합양식 텍스트", "warn": false, "exam": "", "scope": "역락·사회평론 공통", "items": ["둘 이상의 표현 양식(인쇄+이미지+사운드+움직임 등)이 결합된 텍스트", "각 양식은 고유 기능이 있어 메시지의 일부만 전달"], "diff": [{"b": "역", "t": "Kress(2010): 양식이 늘수록 의미 관계의 복잡성이 증가합니다(영화 &gt; 그림책 &gt; 포스터). 양식 구성 요소는 문어·구어·시각·시청각·공간적·몸짓 의미입니다. 유형은 종이 기반 / 실시간 기반(댄스·공연·구두이야기) / 디지털(영화·애니메이션·팟캐스트)이며, 필요한 읽기 기능은 아이디어 표현·개발 / 타인과의 상호작용·관계 / 텍스트 구조·조직입니다(Painter, Martin &amp; Unsworth 2013). 21세기 문식성 환경에서 복합양식 문식성(Multimodal Literacy) 교육이 필수화되고 있습니다."}, {"b": "사", "t": "'인쇄 vs 복합양식' 분류에서 다룹니다. 그림일기·삼강행실도가 디지털 이전에도 존재했던 사례입니다. 복합양식 교수학습의 방향과 모형은 '복합양식 텍스트 교수학습' 카드를 보세요."}], "explain": "", "src": "역락 2장 · 사회평론 5장"}, {"id": "r48", "name": "맥락 (상황 맥락 vs 사회문화적 맥락)", "warn": true, "exam": "", "items": ["<b>상황 맥락<\/b>: 읽기가 일어나는 직접적·가변적 환경 (시간·공간·과제·목적·관련 인물)", "<b>사회문화적 맥락<\/b>: 텍스트 이면의 가치·믿음·지식·이데올로기 등 거시적·역사적 배경"], "diff": [{"b": "역", "t": "2007 개정 교육과정과 Spivey(1997/2004)의 분류에 기반합니다. 판별기준: 지금 이 과제·목적으로 읽는다는 <b>즉각적 조건<\/b>이 좌우하는가(상황) vs 시대·집단·이념 같은 <b>거시적 배경지식<\/b>이 좌우하는가(사회문화). 근거: van Dijk(1979)는 상황 맥락의 영향이 텍스트 자체보다 크다고 보고, Alexander, Schallert &amp; Hare(1991)는 사회문화적 지식을 경험을 지각하게 하는 '여과 장치'로, Fish(1980)는 해석공동체를 제시합니다. 사례: Zwaan(1993) — 문학텍스트 독자는 형식을 잘 회상하고 신문기사 독자는 원인·이유를 더 추론합니다(상황 맥락). Barthes(1957) 잡지 표지 분석(흑인 병사의 거수경례)은 사회문화적 맥락 사례입니다. 학자별 구분: Irwin(1991)은 독해과제 맥락 vs 사회적 맥락, Fairclough(1989)는 사회조직의 3층위입니다."}, {"b": "국", "t": "<b>사회문화적 맥락<\/b>은 텍스트 내용과 직접 연관된 고정적 요인(예: 『달라이 라마의 행복론』 이해에 필요한 티베트 문화·불교 세계관)이고, <b>상황 맥락<\/b>은 읽기 상황을 규정하는 가변적 요인(독해 과제·목적, 흥미, 환경; 여가 독서 vs 보고서 독서)입니다. 정의가 간결하고 명확해 도입부 설명용으로 적합하다고 인덱스가 표시합니다."}], "explain": "<p>⚠️ 사회문화적 맥락의 범위가 다릅니다: 역락은 '이데올로기 층위의 역사적 맥락', 국교이는 '텍스트 내용과 직접 연관된 배경 정보(고정적 요인)'입니다.<\/p><p><b>생산 맥락 vs 수용 맥락<\/b>(역락): 생산 시점의 맥락과 현재 독자의 맥락이 다를 때 ①과거만 ②현재만 ③절충 중 무엇을 적용할지의 문제입니다(박지원의 문체가 당시엔 무시받았으나 오늘날 재평가된 사례). 문학교육에서 '사회문화적 배경(지식)'이 '맥락'과 혼동되며, 생산 시점의 배경은 엄밀히 '화석화된 맥락'이라고 지적합니다.<\/p>", "src": "역락 2장 · 국교이 2절"}, {"id": "r86", "name": "매체의 기능", "warn": false, "exam": "", "scope": "국교이 고유", "items": ["같은 텍스트·내용도 게재 <b>매체<\/b>(시사잡지·문집·신문·교과서·인터넷 백과사전·블로그)에 따라 이해 결과가 달라짐"], "diff": [{"b": "국", "t": "사례 1: 「기미독립선언문」은 1919년 파고다공원 낭독 당시엔 '참여 호소'가 핵심 의미였고, 오늘날 교과서에서는 '논설문 양식'을 보여주는 기능이 큽니다. 사례 2: 갯벌 설명 글도 지식정보 채널에서는 세세한 지식(정보전달), 시사 채널에서는 환경 변화(설득)로 성격이 다릅니다."}], "explain": "<p>역락 9장 디지털 텍스트, 사평 4·5장 복합양식·사회문화 모형과 연결된다고 인덱스가 표시합니다.<\/p>", "src": "국교이 3절"}]}, {"title": "D. 독자론", "cards": [{"id": "r10", "name": "스키마 이론", "warn": true, "exam": "기출 ×2", "items": ["경험이 조직된 지식구조(배경지식)", "스키마가 있으면 이해가 쉽고 빠르며, 생략된 정보를 스키마로 채워 <b>추론<\/b>함. 스키마가 없으면 이해 실패", "읽기 지도에서는 읽기 전에 배경지식을 활용하는 활동(스키마 활성화 등)으로 이어짐"], "diff": [{"b": "역", "t": "유형은 내용 스키마 vs 형식 스키마(Carrell &amp; Eisterhold 1987; 형식=구조 스키마=장르 지식), 3분법(Resnick 1984)입니다. 기능은 지식구조 형성 / 중요도 판단 / 추론 / 그 외(요약·편집, 탐색 순서 제공, 재구성)이고, 적용은 활성화·조성·예측하기·추론하기입니다. 내용 스키마의 영향이 형식 스키마보다 크다는 연구(Anderson 등 1983)도 있습니다. 기원은 Bartlett(1932)입니다."}, {"b": "사", "t": "지식이 도서관 분류표처럼 구조화되어 저장된다고 보고, 핵심 기능을 <b>추론<\/b>으로 봅니다. 필자가 남긴 정보의 '균열'을 독자가 스키마로 채웁니다. Rumelhart(1984)는 스키마가 없어도, 있어도 <b>활성화하지 못하면<\/b> 이해에 실패한다고 지적합니다."}, {"b": "국", "t": "이론의 한계를 함께 다룹니다: 미숙한 독자는 과일반화하고, 과대 적용하면 \"아는 것은 더 잘 알게 되지만 모르는 것은 계속 모르게 되는\" 문제가 있으며, 스키마의 위계 가정은 PDP 모형으로 재검토되는 추세입니다."}], "explain": "<p>실험 두 가지를 구분하세요. <b>Bransford &amp; Johnson(1972)<\/b>: 제목('옷 세탁') 없이 읽으면 이해·회상 실패, 제목을 주면 급상승(역락). <b>Bransford &amp; Johnson(1973)<\/b>: 그림을 먼저 본 집단의 회상이 높음(역락·사평, 사평은 8.0개 vs 3.6개).<\/p><p>판별 사례(역락): 학업이 우수해도 낯선 분야 글은 어렵고, 부진해도 익숙한 분야 글은 잘 이해 → 읽기능력은 배경지식에 의존적입니다.<\/p>", "src": "역락 2장·4장 · 사회평론 4장 · 국교이 2절"}, {"id": "r11", "name": "독서 기능 vs 독서 전략", "warn": true, "exam": "기출 ×3", "items": ["<b>기능<\/b>: 반복으로 숙달·자동화되는 수행 능력", "<b>전략<\/b>: 의식적으로 선택·적용하는 과정·절차·방법 (목적 지향)", "같은 과제(예: 중심 내용 찾기)에서 기능과 전략이 모두 나타남"], "diff": [{"b": "역", "t": "기능은 상향식 모형, 전략은 하향식 모형과 짝을 이룹니다(전략은 목적 지향적으로 여러 대안 중 최적을 선택). 둘은 같은 사고 작용을 관점만 달리해 부른 것입니다. 인지주의는 전략을 '일련의 행위가 연결된 목적 지향적인 것', 기능을 '환경 지향적·독립적·파편적'인 것으로 재정의합니다."}, {"b": "사", "t": "[표 3-5] 전략=비자동적·의식적·노력 필요·목표(문제) 지향 ↔ 기능=자동적·비의식적·노력 불요·목표 비지향. 본문의 판별기준은 <b>자동성·의도성·목표지향성<\/b> 3축입니다. 동전의 양면이라 같은 행위도 둘 다 될 수 있고, 전략도 반복 훈련으로 자동화되면 기능으로 전환됩니다. 전략 정의: \"독자의 의식적 통제 아래 있는 능력들을 조합해 특정 목적을 위해 의도적으로 선택된 일련의 행동\"입니다."}, {"b": "국", "t": "기능은 '~을 할 수 있다'로 표현되는 수행능력으로, 모방·반복의 <b>단위가 작을수록 숙련 효과가 큽니다<\/b>. 다만 반복해도 실패할 수 있어 전략 지도가 필요합니다. 전략은 기능을 수행하는 과정·절차·방법이며, 같은 기능도 여러 전략으로 수행합니다(중심내용찾기: 핵심어/표지어/배경지식 전략). 읽기 능력을 기능·전략·상위인지·태도 4요소로 봅니다."}], "explain": "<p>통합인덱스는 사평 표가 4기준이라 하고, 본문은 3축이라 합니다. 표는 속성 4가지, 판별 축은 3가지로 서로 다른 층위입니다.<\/p>", "src": "역락 1장·4장 · 사회평론 3장 [표 3-5] · 국교이 2절"}, {"id": "r12", "name": "Barrett(1976) 독해 기능 5단계", "warn": true, "exam": "", "items": ["<b>축어적 이해<\/b>(재인·회상) → <b>재구조화(재조직)<\/b> → <b>추론<\/b> → <b>평가<\/b> → <b>감상<\/b>", "Bloom(1956) 분류에 근거하며 읽기 기능 지도의 주요 근거로 쓰임"], "diff": [{"b": "사", "t": "하위 기능이 가장 상세합니다. 축어적=세부내용·중심생각·줄거리·비교·인과관계·인물특성 / 재구조화=유목화·개요·요약·종합 / 추론=8개 하위(뒷받침 세부내용·중심생각·연결관계·비교·인과관계·인물특성 추론, 결과 예측, 함축 언어 해석) / 평가=현실-환상·사실-의견·적절성-타당성·적합성·가치 판단 / 감상=정서 반응·인물·사건 동화·언어 사용 반응·심상. 본문 서술에는 '6단계'로 적힌 곳이 있으나 표는 5단계이고 다른 책·인덱스도 5단계입니다."}, {"b": "역", "t": "5수준(축어적 재인·회상 → 재조직 → 추론 → 평가 → 감상)으로 소개하고 Smith(1963)의 4단계(literal/interpretive/critical/creative)도 함께 다룹니다."}, {"b": "국", "t": "같은 표를 하위 항목과 함께 실었습니다(재조직, 비유적 언어 해석, 수용가능성 등 용어가 조금 다릅니다)."}], "explain": "<p>용어 차이: 재구조화(사평) = 재조직(역락·국교이). 다른 학자 분류: Kennedy(1981) 사실/추론/비판 3단계, Rubin &amp; Opitz(2007) 사실/해석/비판/창의 4단계.<\/p>", "src": "사회평론 3장 [표 3-3] · 역락 2장 · 국교이 2절"}, {"id": "r13", "name": "독서의 정의적 요인 (동기·태도·효능감 등)", "warn": true, "exam": "기출 ×4", "items": ["<b>독서 동기<\/b>: 읽기를 이끌어 내고 지속시키는 심리적 힘 — 내재적 동기 vs 외재적 동기", "<b>독서 태도<\/b>: 읽기에 대한 심리적 경향성 (호불호 감정과 그에 따른 반응)", "<b>독서 효능감<\/b>: 자신의 읽기 능력·성공적 수행에 대한 믿음 (Bandura의 자기효능감에서 출발)"], "diff": [{"b": "역", "t": "태도의 속성은 인지적·정서적·행동적 3요인이고, Mathewson(1994) 모형에서는 태도가 독서 지속 의도에 가장 큰 영향을 줍니다. 동기는 상황적/습관적 2속성이며, 지속에는 내재적 동기가 중요하고 자율성(자기결정)이 이를 높입니다(자기결정이론, 자기선택적 독서 프로그램). 효능감은 동기의 하위요인이거나 독립 요인으로 다룹니다. 2022 개정 교육과정은 '가치·태도' 범주에 읽기 흥미·효능감·긍정적 동기 등을 둡니다."}, {"b": "사", "t": "[표 2-2] 용어 <b>7종<\/b>: 동기·흥미(특정 주제에 대한 선호)·태도(장기간 형성된 호불호)·효능감·<b>몰입<\/b>(reading engagement, 인지·정의적으로 완전히 빠진 상태)·<b>자의지<\/b>(reading volition, 방해에도 집중하려는 자발적 노력)·<b>주체성<\/b>(reading ownership, 자신의 독서를 스스로 통제한다는 믿음). 내재적 동기는 효능감·호기심·몰입·가치인식·자기선택권, 외재적 동기는 경쟁·성적·칭찬·벌입니다."}, {"b": "국", "t": "태도를 '대상·상황에 대한 반응에 영향을 미치는 심리적 경향성(감정·판단·평가 포함)'으로 정의하고, 정의적 요인은 인지적 요인을 직접 수행하지는 않지만 <b>추동하는 근원적 힘<\/b>이라고 봅니다. 읽기 성취-태도 상관이 매우 높다고 하고, 『서머힐』의 사례를 듭니다."}], "explain": "<p>사평은 정의적 요인의 접근 방식이 근본적으로 다르다고 통합인덱스가 표시한 부분입니다(용어 7종 vs 3종). 체감 난도는 동기·흥미에 따라 달라진다는 점(사평)도 함께 알아 두세요.<\/p>", "src": "역락 2장 · 사회평론 2장 [표 2-2] · 국교이 2절"}, {"id": "r14", "name": "상위인지", "warn": false, "exam": "기출 ×3", "scope": "역락·국교이 공통", "items": ["자기 사고 과정에 대한 지식과 그것의 <b>계획·점검·평가<\/b>", "상위인지를 활용하는 학습자가 학업성취가 높고, 독해의 핵심 전략으로 제안됨"], "diff": [{"b": "국", "t": "교육과정 용어는 '읽기 과정의 점검과 조정'입니다. 과정은 <b>계획 → 전략 선택·사용 → 수행 점검·통제 → 반성·평가<\/b>입니다. 목적·사전지식·읽기능력·맥락·텍스트 유형을 고려해 전략을 고르고, 성공 여부를 점검·조정한 뒤 반성해 다음 읽기에 적용합니다."}, {"b": "역", "t": "인지주의 읽기 이론의 핵심 개념으로 소개합니다. 상호작용 모형 비판에서 '초인지 부재' 문제와 연결되고, 읽는 중 전략으로 점검 및 조정하기(self-monitoring)를 둡니다."}, {"b": "사", "t": "독서 상위인지 평가로 MARSI 검사지를 소개하고, 프로토콜 분석·오류 탐색 과제(의도적 오류가 포함된 글로 독해점검능력 평가)를 씁니다."}], "explain": "<p>사회평론은 상위인지를 평가 쪽에서 다룹니다. 상위인지 평가 방법은 자기평가(체크리스트) / 프로토콜 분석 / 오류 탐색 과제 / 요약하기 / 중요도 평정이며, <b>MARSI<\/b>(Mokhtari &amp; Reichard 2002, 최숙기 2010 번안)는 30문항 3범주(총체적 읽기전략·문제해결전략·지원읽기전략)이고 평균 3.5 이상 높음, 2.5~3.4 중간, 2.4 이하 낮음입니다. 연령별 변화는 '최숙기 2011' 카드를 보세요(상위인지는 중2까지 감소 후 중3에 반등).<\/p>", "src": "국교이 2절 · 역락 4장·8장"}, {"id": "r15", "name": "읽기 유창성", "warn": false, "exam": "기출 ×1", "scope": "역락·사회평론 공통", "items": ["빠르고 정확하게 읽는 능력 (해독과 독해를 잇는 연결고리)", "유창성이 높아지면 인지 자원을 의미 파악에 더 쓸 수 있어 이해도가 향상됨"], "diff": [{"b": "역", "t": "National Reading Panel(2000): 빠르고 정확하며 적절한 의미단위로 띄어 읽는 능력. 3요소는 <b>자동성·정확성·표현성<\/b>이고, 미국은 WCPM으로 측정합니다. 연구 이유는 능숙한 독자로 가는 필수 선행 단계(Chall 1983)라는 점과 인지 자원 배분입니다. 한국 초등교육은 글자를 익힌 뒤 곧장 긴 글 독해로 넘어가 유창성 지도가 부족하다고 비판합니다."}, {"b": "사", "t": "검사는 오류 분석(WCPM = 1분당 정확히 읽은 어절 수 = 전체 어절 − 오류 어절)입니다. 유창성이 낮으면 단어 읽기에만 주의가 쏠려 내용 기억·배경지식 연결에 실패하고, 높으면 의미 파악에 집중해 '단어 인지-글 이해'를 중재하는 핵심 기능이 됩니다."}], "explain": "<p>'해독과 해석(독해)' 카드와 함께 보세요.<\/p>", "src": "역락 3장 · 사회평론 3장"}, {"id": "r50", "name": "독서 발달 관련 용어 (읽기 준비도·발생적 문식성·읽기 부진·난독증)", "warn": false, "exam": "", "scope": "역락 고유", "items": ["<b>읽기 준비도<\/b>: 읽기를 배울 준비가 된 상태(인지·신체·정의·사회적 측면), 성숙주의+행동주의 관점", "<b>발생적 문식성<\/b>: 출생~기초 해독·쓰기 가능 시기까지 문식성이 사회적 상호작용으로 자연스럽게 '발현'된다는 관점 (Teale &amp; Sulzby 1989)", "<b>읽기 부진<\/b>: 해독·유창성·독해 기능의 문제로 해당 연령·학년 수준에 미달, 원인이 포괄적", "<b>난독증<\/b>: 정상 지능에도 읽기·쓰기에 어려움을 겪는 특정학습장애 (신경학적 원인)"], "diff": [{"b": "역", "t": "<b>읽기 준비도 vs 발생적 문식성<\/b>: 전자는 계열화된 기술 습득·형식적 측면을 강조하고(기초기술 습득 후에야 교육 가능, 읽기가 쓰기에 선행), 후자는 기능적 측면을 강조합니다(출생부터 자연스러운 발달; Teale &amp; Sulzby 1986). 원인이 감각·신경·유전이면 '읽기 장애', 그 외 조건은 정상이나 미달이면 '읽기 부진'으로 분류하며(Whithear 2011), 읽기부진·읽기장애·난독증은 현상적으로 구분되지 않아도 <b>원인<\/b>에서 다릅니다. 읽기장애로 분류돼도 읽기교육 대상에서 제외되지 않습니다. 해독·독해·유창성은 별도 카드를 보세요."}], "explain": "<p>인덱스가 '임용 빈출 개념어 뭉치'로 표시한 7가지(해독·독해·읽기 준비도·발생적 문식성·읽기 유창성·읽기 부진·난독증) 중 앞 세 가지는 다른 카드에 있습니다.<\/p>", "src": "역락 3장"}, {"id": "r51", "name": "독서 발달의 성격 (이행 vs 확장, 직선적 vs 곡선적)", "warn": false, "exam": "", "scope": "역락 고유", "items": ["독서 능력은 자연 성숙만으로는 안 되고 <b>성숙(자연적) + 교육(인위적)<\/b>이 함께 작용", "독서 발달은 <b>이행<\/b>이 아니라 <b>확장<\/b>으로 설명하는 것이 적절", "단계 제시는 직선적으로 보이나 실제 개인의 발달은 정체·퇴행이 있는 <b>곡선적<\/b>"], "diff": [{"b": "역", "t": "이행=기존 특성을 버리고 새 특성을 습득, 확장=기존 특성을 보유하면서 새 특성을 추가합니다(예: 묵독이 발달해도 음독 능력은 사라지지 않고, 어려운 글은 소리 내어 읽어 이전 단계 능력을 소환). 단계 구분의 효용은 학생 진단·자료 선정·지도·평가의 근거이지만, 개인차가 커서 엄격히 적용해 비정상으로 간주하면 안 됩니다."}], "explain": "", "src": "역락 3장"}, {"id": "r52", "name": "독서 발달 단계 이론 비교 (Chall·O'Donnell &amp; Wood·천경록 등)", "warn": true, "exam": "", "items": ["<b>Chall(1996)<\/b> 6단계: 0 읽기 전 / 1 초기읽기·해독 / 2 해독 공고화·유창성 / 3 새 지식 학습을 위한 읽기(3-A·3-B) / 4 다양한 관점으로 읽기 / 5 의미의 구성과 재구성", "<b>O'Donnell &amp; Wood(1992)<\/b> 5단계: 유아읽기기 / 초기읽기기 / 전이읽기기 / 자립읽기기 / 고급읽기기", "천경록(1999b) 7단계: 읽기맹아기 / 입문기 / 기초기능기 / 기초독해기 / 고급독해기 / 읽기전략기 / 독립읽기기"], "diff": [{"b": "역", "t": "Chall의 연령: 0단계 0~6세, 1단계 6~7세, 2단계 7~8세, 3단계 9~14세(3-A/3-B), 4단계 14~18세, 5단계 18세 이후. 그 밖에 생일케이크 이론(Early 1960, 6단계), Woods(1992, 5단계), Leslie &amp; Jett-Simpson(1997, 6단계: 맹아기·과도기·입문기·고급·통합적·성공적 독자), 이성영(Chall+Bereiter 쓰기 발달론 대응)이 있습니다. 미시적 발달단계(Ehri 1991 단어해독: 그림지각 → 과도기 → 문자인식 → 철자인식)와 거시적 발달단계(생애주기별)를 구분합니다. <b>Chall vs 천경록(1999b)<\/b> 비교표: 0↔맹아기(유치원), 1↔입문기(초1,2), 2↔기초기능기(초3,4), 3-A/3-B↔기초독해기(초5,6)/고급독해기(중1,2), 4↔읽기전략기(중3~고1), 5↔독립읽기기(고2~)."}, {"b": "사", "t": "Chall(1983, 1996) 6단계에서 3단계를 3A(9~11세)/3B(12~14세)로 세분합니다(4단계 15~17세, 5단계 18세~). 주요 연구자는 Gray·Gates·O'Donnell &amp; Wood·Chall·천경록·최숙기이며 대부분 O'Donnell &amp; Wood 또는 Chall을 기반으로 합니다."}, {"b": "국", "t": "Chall(1996) 기반 표를 7행으로 싣습니다(독서맹아기·입문기·기초기능기·기초독해기·고급독해기·독서전략기·독립독서기). 각 단계에 <b>지배적 모형<\/b>을 결합합니다: 맹아기 하향식 / 입문기 상향식 / 기초기능기 상향식+하향식 보조 / 기초독해기 하향식+상향식 / 고급독해기·전략기·독립독서기 상호작용."}], "explain": "<p>⚠️ 국교이 표 제목은 '8단계'인데 실제 행은 7개입니다(원문 그대로). 각 단계의 발달부진 지연 정도(교정독서/치료독서)는 OCR 손상으로 수치가 불확실하다고 원문에 표시되어 있습니다.<\/p>", "src": "역락 3장 · 사회평론 3장 · 국교이 2절"}, {"id": "r53", "name": "독서 발달 8단계 (천경록 2020a)", "warn": true, "exam": "역락 DB 표시: 최빈출", "scope": "역락 기준 (핵심 암기 표)", "items": ["1 <b>읽기 맹아기<\/b> (유아, 잠재적 독자, 유치원 이전): 문자 인식, 따라 읽기", "2 <b>읽기 입문기<\/b> (어린이 전기, 유창한 독자, 초1~2): 띄어 읽기, 유창하게 읽기 (음독→낭독→묵독 이행 시작)", "3 <b>기능적 독서기<\/b> (어린이 중기, 기능적 독자, 초2~4): 사실적·추론적 읽기, 묵독 완성, 중핵 기능 습득, 학습독서 시작", "4 <b>공감적 독서기<\/b> (어린이 후기, 사회적 독자, 초5~6): 정서적 반응, 몰입, 독서 토의·토론 (심미적 읽기)", "5 <b>전략적 독서기<\/b> (청소년 전기, 전략적 독자, 중1~2): 목적 지향적 읽기, 점검·조정(초인지)", "6 <b>비판적 독서기<\/b> (청소년 중기, 비판적 독자, 중3~고1): 잠복된 의도 파악, 맥락 활용", "7 <b>종합적 독서기<\/b> (청소년 후기, 통합적 독자, 고2~3): 다문서 읽기, 매체자료 읽기, 신토피컬 독서", "8 <b>독립적 독서기<\/b> (성인 독자, 자율적 독자, 대학 이후): 학업·직업·교양 독서"], "diff": [{"b": "역", "t": "단계별 세부: 맹아기는 발생적 문식성 시기로 그림책·글자책·낱말카드와 '따라 읽기'를 씁니다. 입문기는 단어 수준 해독 완성+자동성, 문장 수준 띄어 읽기, 글 수준 유창하게 읽기이며 큰 책(big book)·합창독을 씁니다. 기능적 독서기는 핵심어 확인·내용 확인·중심내용 파악·사실·의견 구분·생략 내용 추론·단어 의미 추론·인물 마음 짐작 같은 <b>중핵 기능(core skill)<\/b>을 습득합니다. 공감적 독서기는 로젠블랫의 심미적 읽기와 연결되며 지식정보 텍스트에도 적용됩니다. 전략적 독서기: 기능적 독자는 기능 '적용'에, 전략적 독자는 목적에 맞게 기능을 '활용'하는 데 주력합니다(천경록 2009b). 비판적 독서기는 비판적 문식성 이론과 연결됩니다. 독립적 독서기는 성인교육(andragogy, 자기주도) vs 아동교육(pedagogy, 타율적) 대비이며 비독자로의 전환 예방이 과제입니다."}, {"b": "사", "t": "'5단계 통합 모델'로 재구성합니다('독서 발달 5단계 통합 모델' 카드). 천경록(1999)의 후속 단계로 <b>능숙한 독서(proficient reading)<\/b> 단계를 언급합니다."}], "explain": "<p><b>교정 읽기 vs 치료 읽기<\/b>(역락): 교정 읽기(corrective reading)는 약 1개 학년 차이로 일반 학급 내 지도가 가능하고, 치료 읽기(remedial reading)는 2개 학년 이상 차이 또는 발달단계 1단계 이상 지체로 읽기 전문가의 특수 프로그램이 필요합니다.<\/p><p>천경록 1999b는 7단계, 2020a는 8단계입니다(같은 저자의 다른 저작).<\/p>", "src": "역락 3장"}, {"id": "r54", "name": "독서 발달 5단계 통합 모델", "warn": false, "exam": "", "scope": "사회평론 고유", "items": ["<b>독서 준비기<\/b>(출생~취학 전): 독서준비도 형성기", "<b>독서 입문기<\/b>(초1 전후): 스스로 해독 가능", "<b>독서 유창성기<\/b>(초2~3): 해독의 자동화, 읽기 유창성 확립, 음독→묵독 전환", "<b>독서 자립기<\/b>(초 중학년 이후): 묵독 기반의 다양하고 높은 수준의 독해, 내용교과 독서 본격화", "<b>독서 정교화기<\/b>(중학교~): 사실·추론·비판·창의적 이해 모두 가능, 자기조절적 전략 운용"], "diff": [{"b": "사", "t": "여러 연구를 종합한 이 책의 재구성입니다. 준비기 요건은 지능연령 도달·시청각·발성 장애 없음·흥미·생활경험·안정된 정서·독서 권장 환경이며, 이 시기 시청각기관 결핍은 난독증을 유발할 수 있습니다. 입문기: Chall은 고빈출단어 규칙 알기·규칙적 소리-글자 대응 단어 읽기·음운·철자 규칙 통찰로 낯선 단어 발음 가능. 유창성기의 <b>음독→묵독 전환<\/b>: 아동은 구어에 익숙해 낯선 문어 정보를 익숙한 청각정보로 전환할 필요가 있고, 반복훈련으로 문자-소리 대응이 내면화되면 시각정보만으로 의미화하는 묵독으로 전환되어 절약된 인지자원이 의미이해로 재분배됩니다. 자립기는 O'Donnell &amp; Wood의 '자립독서기'(길고 다양한 글, 묵독&gt;음독 속도), 천경록(1998)의 '기초독해기'에 대응합니다. 정교화기는 O'Donnell &amp; Wood의 '고급독서기'에 대응하며 Chall의 3B → 4단계 → 5단계로 세분됩니다."}], "explain": "", "src": "사회평론 3장"}, {"id": "r55", "name": "중학교 시기 독서 발달의 실증 연구 (최숙기 2011)", "warn": false, "exam": "", "scope": "사회평론 고유", "items": ["중1 독서발달 수준은 초6과 유사, 중2·중3은 서로 유사 — '중1'과 '중2~3' 두 발달유사집단", "중2부터 사실적·추론적 이해가 뚜렷이 발달, <b>비판적 이해는 중학교 시기 동안 유의미하게 발달하지 않음<\/b>", "독서 동기·태도는 중학교 시기 동안 지속적으로 감소"], "diff": [{"b": "사", "t": "[표 3-7][표 3-8] 국내 실증 데이터. 사실적·추론적·비판적 이해는 위계적으로 단계마다 발달하는 것이 아니라 전 단계에 걸쳐 연속적으로 나타납니다(제재·활동 수준의 심화는 있음). 어휘 인식은 전 학년 지속 향상, 단어재인 속도·정확도 향상. 상위인지(독서전략 인식)는 중2까지 감소하다 중3에 반등(전체적으로 소극적). 성별차: 여학생이 동기·태도·어휘 모두 우세하나 감소 추세는 동일. 독서 환경 인식은 부정적이나 독서능력에 직접 영향을 주지는 않는 것으로 나타났습니다. 중학교 이후(성인기) 독서 발달 연구는 상대적으로 추상적 수준에 머무릅니다."}], "explain": "", "src": "사회평론 3장"}, {"id": "r56", "name": "독자 유형 분류와 생애주기별 독자", "warn": true, "exam": "", "items": ["독자 유형 용어는 <b>독서 능력 / 독서량 / 독서 빈도 / 독서 자발성<\/b> 4속성 중 하나 이상을 기준으로 함", "<b>책맹(aliteracy)<\/b>: 읽을 능력은 있으나 읽지 않는 것 (능력 결핍인 문맹과 구분)", "평생 독자(생애 전반 자발적 독자)가 독서교육의 궁극 목표"], "diff": [{"b": "역", "t": "이순영(2019a) 재구성. 능력 기준: 능숙한 독자↔읽기부진 독자, 고성취↔저성취, 문맹 / 독서량 기준: 다독자·독서광·책벌레 / 빈도 기준: 애독자↔간헐적 독자 / 자발성 기준: 자발적 독자↔책맹. 생애주기는 Poplia &amp; Olds(1998)의 8단계(태내기·영아기·유아기·아동기·청년기·성년기·중년기·노년기)에 기반해 <b>어린이 독자<\/b>(7~12세, 피아제 구체적 조작기, 유창성 획득·묵독 완성), <b>청소년 독자<\/b>(13~19세, 자아정체성 확립, 읽기 위한 학습 → <b>학습을 위한 읽기<\/b>로 전환), <b>성인 독자<\/b>(학문 문식성+직업 문식성), <b>노인 독자<\/b>(노인 리터러시)를 다룹니다."}, {"b": "사", "t": "독자 유형 분류 [표 2-1]은 나이·독서수준·독서능동성·애착수준·텍스트수용태도·텍스트범위·집중도·완독여부·사회성·매체·장소 등 <b>11가지 판단기준<\/b>으로 정리하고, 이 중 '나이'를 축으로 생애주기별 독자 5단계(아동-어린이-청소년-성인-노인)를 상세히 기술합니다."}], "explain": "<p>⚠️ 역락은 4가지 기준, 사평은 11가지 기준이라 <b>기준의 수와 축<\/b>이 다릅니다. 사평은 사회적 관점, 역락은 인지발달 관점(8단계)으로 서로 보완적이라고 사평이 밝힙니다.<\/p>", "src": "역락 3장 · 사회평론 2장"}, {"id": "r84", "name": "해독 기능의 3대 하위요소 (음운 인식·단어 재인·읽기 유창성)", "warn": true, "exam": "기출 ×1 (해독능력 및 읽기 유창성)", "items": ["<b>음운 인식(phonemic awareness)<\/b>: 구어의 소리 단위·유형을 지각하는 능력", "<b>단어 재인(word recognition)<\/b>: 글자로 제시된 단어의 발음·의미를 파악하는 능력", "<b>읽기 유창성(reading fluency)<\/b>: 빠르고 정확하게 읽는 능력"], "diff": [{"b": "사", "t": "[표 3-1] 음운 인식 검사과제: 두운/각운, 음절수 세기, 음절·음소 탈락, 음소 합성, 음소 변별. 한국 아동의 발달 순서는 단어인식 → 음절인식(약 4세) → 음소인식(약 7세)으로 큰 단위에서 작은 단위로 발달합니다. 단어 재인 검사는 단어분석과제(카드·분류)와 단어식별과제(맥락 제시)이고, 미숙 징후는 단어 대치·문자 반전·순서 바꿈·발음 못함/느림입니다. 유창성은 오류분석(WCPM)으로 검사하며, 유창성이 높으면 의미 파악에 집중할 수 있어 '단어인지-글이해'를 중재하는 핵심 기능입니다. 해독을 숙달해야 독해로 나아갈 수 있다는 순차적 필요조건 관계이며, 독서 능력은 후천적 학습의 산물이고 '자연스러움'은 자동화의 결과입니다(뇌에 독서 전용 영역이 없음)."}, {"b": "역", "t": "해독 기능을 음운 인식(음절 인식보다 선행) / 단어 재인 / 읽기(낭독) 유창성(속도·정확성·처리유연성)으로 나눕니다. 유창성은 해독-독해의 연결고리로 중요합니다."}], "explain": "<p>'해독과 해석(독해)', '읽기 유창성' 카드와 함께 보세요. 음운 인식의 '음절 인식보다 선행' 서술(역락)과 '음절인식(4세) 후 음소인식(7세)' 발달 순서(사평)는 서로 다른 맥락의 서술입니다.<\/p>", "src": "사회평론 3장 · 역락 3장"}, {"id": "r85", "name": "독해 기능 분류의 학설사", "warn": true, "exam": "", "items": ["1925년 『국가교육연구협회 24차 연감』에서 독서 영역에 '기능'이 처음 등장", "Pennel &amp; Cusack(1929) 7단계 → Davis(1944) 9종 → <b>Barrett(1976)<\/b> → Kennedy(1981) 3단계 → Rubin &amp; Opitz(2007) 4단계", "학자마다 용어 차이는 있으나 명시적 정보 파악 → 비명시적 정보 추론·재구조화 → 평가적 준거의 비판적 이해 → 발산적 사고의 창의적 이해로 수렴"], "diff": [{"b": "사", "t": "Pennel &amp; Cusack: 주의집중 / 사고연계 / 상징-의미연결 / 경험연결 / 의미조직 / 평가 / 유지의 7단계. Davis(1944, 미국 교육과정 분석): 단어의미 / 문맥 속 단어의미 / 문단조직 / 중심생각 / 세부질문 답 / 재진술 / 추론 / 문학적 장치 / 필자의도 등 9종. Kennedy(1981): 사실적/추론적/비판적. Rubin &amp; Opitz(2007, Smith 1969 참조): 사실적/해석/비판적/창의적 이해 4단계이며 단계적 발달로 봅니다. 창의적·감상적 이해의 포함·분류 문제는 Barrett(1976)의 애매성에서 비롯되며, 축어적/추론적/평가적(비판적)/감상적(창의적) 4수준으로도 재분류할 수 있습니다. 국가교육과정은 낱말·문장 이해 / 내용 확인 / 추론 / 평가와 감상 / 읽기 과정의 점검과 조정 5범주를 반영합니다. Barrett의 목적은 독해검사 질문 개발을 돕는 것이었습니다."}, {"b": "역", "t": "Barrett, Herber, Pearson &amp; Johnson 등을 2장에서 소개합니다(사평과 상당 부분 중복). Smith(1963)의 literal/interpretive/critical/creative 4단계도 다룹니다."}], "explain": "<p>Barrett 상세는 'Barrett(1976) 독해 기능 5단계' 카드를 보세요. 역락의 Herber, Pearson &amp; Johnson 분류의 세부는 이 카드에 옮기지 못했습니다(원문 확인 필요).<\/p>", "src": "사회평론 3장 · 역락 2장"}]}, {"title": "E. 독서교육 이론사", "cards": [{"id": "r57", "name": "독서관의 심리학적 배경 (행동주의 vs 인지심리학)", "warn": false, "exam": "", "scope": "사회평론 기준 (역락 4장과 이론 동일)", "items": ["<b>행동주의<\/b>: 관찰 가능한 행동만 연구, 자극-블랙박스-반응 모형 → 독서 = 문자 해독 행위로 규정 (글 중심)", "<b>인지심리학<\/b>: 블랙박스(내적 처리)를 다시 연구 대상으로 복원, 정보처리모형 → 독서 = 머릿속 인지 처리로 의미를 구성·재구성하는 과정 (독자 중심)", "행동주의 → 인지심리학의 전환 = <b>독서 패러다임의 변화<\/b>"], "diff": [{"b": "사", "t": "행동주의는 20세기 초반 심리학의 '과학화' 요구가 배경이며 1920년대 정립되어 인지심리학 이전까지 지배적이었습니다. 현대의 흔적은 속독 훈련입니다(눈동자를 빠르게 움직이면 내용도 빨리 파악된다는 믿음). 인지심리학은 <b>기능주의(functionalism)<\/b>에 기반해 수행 주체·도구가 달라도 정보처리 과정은 같다고 가정하고, 읽기·쓰기가 정보처리 결과를 추론하기 가장 적합한 통로라 독서·작문 연구가 활발해졌으며 1980년 이후 독서가 재정의되었습니다. <b>본질 vs 현상<\/b> 비유: 야구공·빗방울·알밤이 떨어지는 현상 너머에 중력이라는 본질이 있듯이, 눈동자로 문자를 판독하는 현상 너머에 의미를 구성하는 정신작용이 있습니다(정보처리과정 = 의미구성과정, 용어차). 각 처리 단계의 점검·조정 상위기제가 <b>초인지<\/b>입니다."}, {"b": "역", "t": "'행동주의 읽기 이론'과 '인지주의 읽기 이론' 카드를 참고하세요. 행동주의 = 해독·상향식·하위기능 접근·Thorndike 4법칙, 인지주의 = 인지 전략·스키마·정보처리(Atkinson &amp; Shiffrin 1977)·상위인지·Rumelhart 상호작용 모형입니다."}], "explain": "<p>사평이 심리학사적 배경을 더 깊이 서술하고, 이론 내용 자체는 역락 4장과 같다고 인덱스가 표시합니다.<\/p>", "src": "사회평론 4장 · 역락 4장"}, {"id": "r16", "name": "읽기 교육 이론 3관점 (행동주의·인지주의·사회구성주의)", "warn": false, "exam": "", "scope": "역락 기준", "items": ["<b>행동주의<\/b>: 텍스트 요인, 의미는 텍스트에 고정, 해독·상향식, 하위기능 분절 지도, 모방·반복", "<b>인지주의<\/b>: 독자 요인, 의미는 독자가 구성, 스키마·전략·상위인지, 하향식·상호작용", "<b>사회구성주의<\/b>: 맥락 요인, 의미는 담화공동체 내 대화·협상으로 다듬어짐, 협력 학습, ZPD"], "diff": [{"b": "역", "t": "Thorndike 연결주의 4법칙(효과·준비·동일요소·연습)은 직접교수법의 뿌리입니다. 행동주의는 성숙주의와 연동하여 읽기 준비도를 다룹니다. 인지주의에서는 Rumelhart(1977)의 상호작용 모형과 스키마·정보처리·상위인지를 다루고, Piaget는 성숙도 환경도 아닌 유기체-환경 상호작용으로 문식성 발달을 설명합니다(Woolfolk 4요인). 사회구성주의는 Vygotsky의 ZPD, 비계, 책임이양입니다. Piaget는 개인 내부에서 시작하고 Vygotsky는 사람들 사이에서 시작해 내면화한다고 대비합니다."}, {"b": "사", "t": "독서관의 심리학적 배경을 <b>행동주의(관찰 가능한 행동만 연구, 독서=문자 해독) vs 인지심리학(블랙박스 복원, 독서=의미 구성)<\/b>으로 심리학사적 배경까지 더 깊이 서술합니다('독서관의 심리학적 배경' 카드)."}, {"b": "국", "t": "행동주의 심리학사를 덧붙여, 상향식 지도가 문자~장문 단위로 나눠 훈련하는 프로그램식 지도법과 결합되고 독자를 수동적으로, 의미를 하나로 본다고 서술합니다."}], "explain": "<p>독서 3변인 종합표(역락): 텍스트 요인↔행동주의, 독자 요인↔인지주의, 맥락 요인↔사회구성주의.<\/p>", "src": "역락 4장 · 사회평론 4장 · 국교이 2절"}, {"id": "r58", "name": "행동주의 읽기 이론과 성숙주의 문식성 발달 이론", "warn": false, "exam": "", "scope": "역락 고유", "items": ["행동주의: 학습 = 관찰 가능한 행동 변화, 읽기 = 부분의 합, 하위기능 접근·상향식 독해, 텍스트 의미는 고정불변·객관적", "Thorndike 연결주의 4법칙: 효과 / 준비 / 동일요소 / 연습 → 직접교수법의 이론적 뿌리", "성숙주의: 정신발달도 자연 성숙 → 일정 연령 전 인위적 문식성 학습 자제 (읽기 준비도의 근거)"], "diff": [{"b": "역", "t": "행동주의 2대 가설은 ①행동 = 자극에 대한 반응 ②외부 자극이 행동을 강화/약화하는 것이고, 3대 이론은 Pavlov 고전적 조건형성 / Thorndike 연결주의 / Skinner 조작적 조건형성(모두 연합주의 기반)입니다. 해독 하위기능은 음운 인식·발음·단어 재인·유창성이며 읽기준비도(청각·시각 식별, 좌우 안구운동 등)를 훈련합니다. 이해 실패 시 처방은 반복 읽기나 교사가 '정해진 의미'를 전달하는 것입니다. <b>성숙주의<\/b>(1920~30년대)는 페스탈로치·프뢰벨의 자연계발 이론과 연결되며, Morphett &amp; Washburne(1931)는 정신연령 6세 반 기점 연구로 읽기 준비도 개념의 근거를 제공했습니다. <b>Holdaway(1979)<\/b>는 '문식성 발달 이론' 용어를 최초로 사용하고 부모와의 상호작용을 강조해 가족 문식성 개념의 토대를 놓았으며 빅북 접근법을 제안했습니다. 한국 교실이 여전히 행동주의적 '자극-모방-연습'에 머문다는 비판이 있습니다."}], "explain": "<p>인지주의·사회구성주의 문식성 발달 이론(Piaget vs Vygotsky)은 '읽기 교육 이론 3관점' 카드를 보세요.<\/p>", "src": "역락 4장"}, {"id": "r17", "name": "ZPD·비계·책임 이양", "warn": false, "exam": "기출 ×3 (점진적 책임 이양)", "scope": "역락·국교이 공통", "items": ["<b>ZPD(근접발달영역)<\/b>: 혼자 하는 실제 수준과 도움을 받으면 가능한 잠재 수준 사이의 간극 (Vygotsky)", "<b>비계(scaffolding)<\/b>: 유능한 타인(교사)의 도움", "<b>책임 이양<\/b>: 교사 주도 → 공유 → 학생 독립 (비계는 줄고 자기 조절은 늘어남)"], "diff": [{"b": "역", "t": "학습자 중심의 원리 안에 ZPD·비계·자기조절학습(Pintrich 2004)·책임 이양(Cazden 1988)을 묶습니다. 비계는 Wood·Bruner·Ross(1976)입니다."}, {"b": "국", "t": "5대 교수학습 원리로 재구성해 ①ZPD 과제 ②비계 설정(자전거 보조바퀴 비유) ③반응 유도 ④상위인지 점검 ⑤책임 이양을 둡니다. 책임 이양은 수업 초반 교사 주도(안내·프로토콜 시범) → 중반 교사 안내·조언, 학생 수행 → 후반 학생 독립 수행입니다."}], "explain": "<p>사고구술·프로토콜은 국교이에서 '시범' 수단으로 나옵니다.<\/p>", "src": "역락 4장·7장 · 국교이 3절"}]}, {"title": "F. 독서 교수·학습 원리와 모형", "cards": [{"id": "r18", "name": "독서 교수·학습의 원리", "warn": true, "exam": "", "items": ["근접발달영역에 맞는 과제와 <b>비계<\/b> 제공", "<b>책임 이양<\/b>: 교사 → 학생", "학습자 중심 (개별 독자의 반응·수준 고려)"], "diff": [{"b": "역", "t": "<b>4가지<\/b>: ①학습자 중심(ZPD·비계·자기조절·책임이양) ②개별성(교재·학습과제·학습프로그램) ③활동 지향성(전략 학습이 실행까지) ④실제성(자료·과제의 실제성 + 통합). 사례 문제: 학생이 건의문 제재에 공감하지 못해 반응이 피상적이면 '실제성의 원리' 위반으로 진단합니다."}, {"b": "국", "t": "<b>5가지<\/b>: ZPD 과제 / 비계 설정 / 반응 유도 / 상위인지 점검 / 책임 이양. 반응 유도는 머릿속 읽기를 밖으로 표현하게 하는 것입니다."}], "explain": "<p>역락은 4원리, 국교이는 5원리로 재구성한다고 인덱스가 밝힙니다. 사회평론은 원리 목록 대신 <b>정보 텍스트 교수학습의 방향 3가지<\/b>(명시적 설명·시범 / 균형적 접근 / 어휘·구조 지도 선행)를 제시합니다('정보 텍스트 교수학습의 방향 3가지' 카드).<\/p>", "src": "역락 7장 · 국교이 3절"}, {"id": "r59", "name": "글깨치기 지도 3방식 (발음 중심·총체적 언어·균형적 지도)", "warn": false, "exam": "", "scope": "역락 고유", "items": ["<b>발음 중심 지도(phonics)<\/b>: 상향식 기반, 글자-소리 관계를 체계적·명시적으로 지도, 하위기능 자동화 후 상위기능", "<b>총체적 언어 지도(whole language)<\/b>: 하향식 기반, 의미 있는 텍스트를 읽으며 낱자-소리 관계 학습", "<b>균형적 읽기 지도<\/b>: 두 방식 절충"], "diff": [{"b": "역", "t": "발음 중심의 단점은 맥락 없는 기계적 반복으로 동기 유발이 저해되는 것이고, 총체적 언어의 단점은 해독 지도의 체계·절차 부족입니다. 판별기준: '작은 단위에서 큰 단위로'의 순서가 뚜렷한가(발음 중심) / 의미 있는 텍스트 노출이 먼저이고 해독은 그 속에서 습득되는가(총체적) / 두 방식을 병행하는가(균형적). 균형적 접근은 넓은 의미로 교사선택 vs 학생선택 독서, 학습목적 vs 여가목적 독서, 문학적 vs 정보적 텍스트 사이의 균형까지 포괄합니다."}], "explain": "", "src": "역락 7장"}, {"id": "r60", "name": "글 수준 읽기 지도 3방식 (과정 중심·독본 중심·문학 기반)", "warn": false, "exam": "", "scope": "역락 고유", "items": ["<b>과정 중심 읽기 지도<\/b>: 읽기 전·중·후 3단계 전략 지도", "<b>독본 중심 기초 읽기 지도(basal reading approach)<\/b>: 수준별 시리즈 독본으로 순차적 기초 기능 지도", "<b>문학 기반 지도<\/b>: 학생이 문학작품을 스스로 선택·읽고 이야기 나누며 흥미·즐거움 형성"], "diff": [{"b": "역", "t": "독본(讀本)은 책·워크북·활동지이며 미국에서 가장 보편적이고 이독성 공식 개발과 연계됩니다. 문학 기반 지도는 문학작품에 국한되지 않고 설명문·역사기록·연설·에세이 등 다양한 장르를 포함할 수 있습니다. 참고로 Vacca 외(2006)는 기초기능읽기지도 / 언어경험접근법(LEA) / 통합언어접근법 / 문학기반지도 / 기술기반지도로 달리 분류합니다."}], "explain": "", "src": "역락 7장"}, {"id": "r61", "name": "직접교수법", "warn": true, "exam": "", "items": ["교사가 과정·절차·방법을 설명하고 시범 → 학생이 활동으로 익힘 (교사 주도)", "절차: 설명하기 → 시범보이기 → 질문하기 → 활동하기 (4단계)", "행동주의 기반, 기능(skill) 지도에 적합"], "diff": [{"b": "역", "t": "연역적 접근, 짧은 시간의 집중 연습과 교정적 피드백을 씁니다. 책임 이동은 명시되지 않고(교사 중심), 지식·이론 습득 목표에는 부적합합니다. 판별기준은 교사가 무엇을 하는지 눈에 보이는 행동으로 시범이 가능한가입니다. Thorndike 연결주의가 이론적 뿌리입니다."}, {"b": "사", "t": "절차 4단계: 설명하기(동기유발+개념·필요성·방법) → 시범보이기(<b>사고구술<\/b>로 시범) → 질문하기(교사-학생 문답, 권한이 학생에게 전이) → 활동하기(교사안내활동+학생독립활동, 비계 제공). Explicit Instruction의 특정 유형으로 1960년대 후반 Engelmann &amp; Bereiter가 개발했고(DISTAR 프로그램 기원), 절차 확립은 Rosenshine(1983)입니다. 국내에서 '80년대 오레곤대에서 시작'으로 알려진 것은 오류이고 실제로는 1960년대 기원입니다."}, {"b": "국", "t": "<b>연역적<\/b> 지도법: 교사가 과정·절차·방법을 설명·시범한 뒤 학생이 활동으로 익힙니다. 문제해결 학습 모형(귀납)과 대비됩니다."}], "explain": "<p>현시적 교수법과의 구별은 '현시적 교수법' 카드를 보세요. 사고구술이 어느 쪽 특징인지가 책마다 다릅니다.<\/p>", "src": "역락 7장 · 사회평론 8장 · 국교이 3절"}, {"id": "r19", "name": "현시적 교수법 (직접교수법과 구별)", "warn": true, "exam": "기출 ×3", "items": ["시범 → 교사 안내 활동 → 학생 독립 활동으로 나아가는 <b>책임 이양<\/b>", "직접교수법과 구별되는 교수 모형"], "diff": [{"b": "역", "t": "<b>3단계<\/b>(시범 → 안내된 연습 → 학생 읽기, 경우에 따라 설명·질문 포함). 핵심 기법은 <b>사고구술(think-aloud)<\/b>로 눈에 보이지 않는 인지 과정을 드러내는 것이고 독해 전략 지도에 적합합니다. 직접교수법은 행동주의 기반, 교사 주도, 설명 → 시범 → 질문 → 활동 4단계이며 기능 지도에 적합합니다. 판별기준: 눈에 보이는 행동으로 시범 가능한가 vs 사고구술이 핵심인가."}, {"b": "사", "t": "<b>4단계<\/b>(Pearson &amp; Dole 1987): 설명 및 시범 → 교사 안내 연습 → 학생 독립 연습 → 적용. 직접교수법보다 <b>학생 활동 비중이 높고<\/b> 책임의 점진적 이양을 더 체계적으로 단계화합니다. 직접교수법은 Explicit Instruction의 특정 유형(Engelmann &amp; Bereiter, 1960년대 DISTAR; 절차 확립 Rosenshine 1983)이며, 시범 단계에 사고구술을 넣습니다."}, {"b": "국", "t": "<b>3대 지도모형<\/b>을 귀납/연역 틀로 정리합니다. 직접교수법=연역(교사 설명·시범 → 학생 활동), 문제해결학습=귀납(목표만 알려주고 학생이 해결한 뒤 방법을 발견), 현시적 교수 모형=둘의 조합(학생이 먼저 문제 상황에 접해 생각한 뒤 방법 제시·설명). 4단계는 시범 → 교사유도활동 → 강화 → 학생독립활동입니다."}], "explain": "<p>⚠️ 사고구술이 역락에서는 현시적의 핵심이지만, 사평에서는 직접교수법의 시범 단계에 들어 있습니다. 국교이는 개념 설명(학생이 먼저 문제 접함)과 4단계 표(첫 단계가 시범)가 서로 안 맞아 보이므로 원문 확인이 필요합니다.<\/p>", "src": "역락 7장 · 사회평론 8장 · 국교이 3절"}, {"id": "r20", "name": "SQ3R과 KWL", "warn": false, "exam": "기출 ×3 (KWL·SQ3R)", "items": ["<b>SQ3R<\/b>: Survey(훑어보기) - Question(질문하기) - Read(읽기) - Recite(암송·확인) - Review(검토)", "<b>KWL<\/b>(Ogle 1986): K(아는 것) - W(알고 싶은 것) - L(배운 것), 읽기 전·후 모두 사용", "공통점: 읽기 전 배경지식 활성화 + 질문 만들기"], "diff": [{"b": "역", "t": "KWL은 학습 내용 <b>정리·기록<\/b>에 중점, SQ3R은 <b>암송·기억 훈련<\/b>에 중점(원문 기출 변형 수록). KWL(H)는 정보를 찾는 방법(H)까지 4란 그래픽 조직자입니다."}, {"b": "사", "t": "SQ3R(Robinson 1941)의 Recite를 '확인하기(자기 말로 표현)', Review를 '재검토하기'로 적고, 변형으로 <b>CSQ3R<\/b>(시각 바꾸기 추가)과 <b>SRUN<\/b>(훑어보기-읽기-밑줄긋기-정리하기)을 소개합니다."}, {"b": "국", "t": "SQ3R을 개관-질문-읽기-암송-검토로 적고, 과정중심 지도의 전/중/후를 압축한 형태라고 봅니다."}], "explain": "<p>용어 표기가 책마다 조금씩 다릅니다(개관/훑어읽기/훑어보기, 암송/확인, 검토/재검토).<\/p>", "src": "역락 7장·8장 · 사회평론 8장 · 국교이 3절"}, {"id": "r21", "name": "반응 중심 교수·학습 모형", "warn": true, "exam": "", "scope": "역락·사회평론 공통", "items": ["근거: Rosenblatt 독자 반응 이론 (문학 감상 지도)", "반응 형성 → 반응 명료화 → 반응 심화의 흐름", "텍스트와 독자의 거래 → 독자 간 상호작용 → 텍스트 간 관련짓기(상호텍스트성)"], "diff": [{"b": "역", "t": "<b>4단계<\/b>: 반응 준비하기(배경지식 활성화) → 반응 형성하기(심미적 독서 격려) → 반응 명료화하기(질문·토의·쓰기) → 반응 심화하기(타 작품·현실과 관련)."}, {"b": "사", "t": "<b>3단계<\/b>로 축약: 반응의 형성 → 명료화(독자 간 상호작용, 반성적 쓰기) → 심화(상호텍스트성). '반응의 일반화'를 더해 4단계로 보는 변이형도 있다고 적습니다."}], "explain": "<p>단계 수가 다르지만 같은 모형입니다(역락 준비하기 = 사평에는 없음).<\/p>", "src": "역락 7장 · 사회평론 8장"}, {"id": "r22", "name": "GRP · DRA · DRTA", "warn": false, "exam": "기출 ×3 (항목 공유)", "scope": "국교이 고유", "items": ["<b>GRP<\/b>: 텍스트 구조 확인 + 회상능력 강화 (읽기 목적 설정 → 읽기 → 읽기 확인 → 재지도 → 평가)", "<b>DRA<\/b> 5단계: 동기유발·배경지식 개발 → 텍스트 읽기 → 기능 학습 → 후속 학습 → 강화 학습", "<b>DRTA<\/b>: DRA를 학생 중심으로 상세화 (학생이 스스로 목적 설정, 자기 관찰)"], "diff": [{"b": "국", "t": "판별기준: DRA는 교사가 사전에 질문을 준비해 이해 방향을 잡아주는 데 비해, DRTA는 학생 스스로(또는 교사와 상호작용하며) 목적을 설정하고 자기관찰(상위인지)을 하며 속도를 조절해 더 학생 주도적입니다. DRA의 기능 학습 단계는 직접교수법으로 지도합니다. GRP는 읽기 확인 때 텍스트를 덮고 기억한 내용을 칠판에 적고(오류 포함) 나중에 대조하며, 직후와 2~3주 후에 재평가합니다."}], "explain": "<p>이 모형들은 역락·사회평론에 없어서 국교이 기준으로만 정리했습니다.<\/p>", "src": "국교이 3절"}, {"id": "r62", "name": "독서 수업의 실행 (과정별 지도 내용·수업 설계)", "warn": false, "exam": "", "scope": "역락 고유", "items": ["읽기 전: 사전지식 조성(어휘·배경지식·유추) + 활성화(선행조직자·학습목표·사전검사)", "읽기 중: 질문하기 + 스터디가이드 + 독후활동", "읽기 후: 토의하기 + 읽기기능학습"], "diff": [{"b": "역", "t": "박영목 외(2008) 재구성. 수업 목표는 <b>수업내용 + 행동특성<\/b> 2요소로 기술하고, 수업변인(교사·학습자·환경) 분석 → 수업내용 상세화 → 수업방법 계획 → 평가계획 순서로 설계합니다. 읽기 수업의 특수성은 '수업'과 '읽기'가 동시에 일어난다는 점이라 도입-전개-정리 + 읽기과정(전-중-후) + 읽기전략 + 텍스트 특성을 함께 고려해야 합니다. 사례: 학생이 건의문에 공감하지 못해 반응이 피상적이면 '실제성의 원리' 위반으로 진단합니다."}], "explain": "", "src": "역락 7장"}, {"id": "r63", "name": "안내된 읽기 지도(GRI)와 개별화 읽기 접근", "warn": false, "exam": "", "scope": "역락 고유", "items": ["<b>안내된 읽기 지도(GRI, Fountas &amp; Pinnell 1996)<\/b>: 자료선정·수업준비 → 자료 소개 → 교사 도움 하 학생 독서 → 자료에 대한 토론 → 교사의 평가 및 보충심화 (5단계)", "<b>개별화 읽기 접근(Olson 1949)<\/b>: 총체적 언어 접근의 하위 모형 — 자료 자기선택 → 자료 제공 → 학생·교사 협의 → 심화과제 → 모둠구성 → 독서경험 공유 (6단계)"], "diff": [{"b": "역", "t": "GRI의 목표는 집중력·글 구조 확인·회상 능력·문제해결 능력 신장이며, 약간 어렵지만 부담스럽지 않은 수준의 자료를 고릅니다. 개별화 읽기 접근의 3원칙은 읽을거리 탐색·자기선택(self selection)·속도 조절이고, 자료는 학생당 3~5권(상하 1~2학년 폭)을 제공하며 모둠은 융통성 있게 구성·해체합니다. 창의성·동기화·신뢰·자아개념·책임감이 장점이고 읽기 회복 프로그램·읽기 워크숍과 결합해 쓰입니다."}], "explain": "", "src": "역락 7장"}, {"id": "r64", "name": "정보 텍스트 교수학습의 방향 3가지", "warn": false, "exam": "", "scope": "사회평론 고유", "items": ["①교사의 <b>명시적 설명·시범<\/b> 필요 (교사는 안내자로서 능숙한 독자의 모범을 보임)", "②<b>균형적 접근<\/b>: 직접교수법(기능 강조) + 실제적 읽기·쓰기 경험의 결합", "③어휘 지도 + 텍스트 구조 지도의 선행"], "diff": [{"b": "사", "t": "근거: Durkin(1978~79)이 7000분 이상 관찰한 초등 독서수업에서 교사가 독서방법을 명확히 설명한 비율은 1% 미만(대부분 과제 제시·평가에 그침)이었습니다. 균형적 접근은 독해 기능·전략을 분절적으로만 지도하는 것을 경계하고 총체적·통합적 지도를 지향합니다."}], "explain": "", "src": "사회평론 8장"}, {"id": "r65", "name": "대화 중심 교수학습 모형", "warn": false, "exam": "", "scope": "사회평론 고유", "items": ["학습자의 주체적·능동적 감상을 지향하되 텍스트에 근거한 다층적 <b>대화<\/b>를 강조", "6단계: 문학텍스트 지식 이해 → 텍스트 읽기(작중인물과 대화) → <b>독자 개인의 내적 대화<\/b> → <b>독자 간 대화<\/b> → <b>교사와 독자 간 대화<\/b> → 텍스트의 의미 정리(비평문 등 2차 텍스트 생산)"], "diff": [{"b": "사", "t": "판별기준: 반응중심모형은 '개인 반응의 형성·공유·심화'에 초점, 대화중심모형은 '내적대화 → 또래대화 → 교사대화'의 다층적 대화 단계를 명시적으로 구조화한 점이 차별점입니다. 교사와 독자 간 대화 단계에서 오독을 확인·수정하고 새 관점을 제시합니다."}], "explain": "", "src": "사회평론 8장 (역락에 없음)"}, {"id": "r66", "name": "복합양식 텍스트 교수학습 (방향 4가지와 모형 3종)", "warn": false, "exam": "", "scope": "사회평론 고유", "items": ["방향 4가지: ①기호적 형상화·언어적 의미실현 ②사회문화적 맥락에서의 의미형성·소통·영향 ③듣기말하기·읽기·쓰기의 통합 ④비판적 읽기 중점", "모형 3종: <b>매체 비교 토의·토론<\/b> / <b>영상 수용·생산<\/b> / <b>디지털 텍스트 읽기<\/b>"], "diff": [{"b": "사", "t": "<b>매체 비교 토의·토론<\/b>: 같은 내용을 2개 이상 매체로 감상하고 유사점·차이점을 토의해 <b>전언성(傳言性)과 형상성(形象性)<\/b>을 추론·일반화합니다(매체특성 안내·자료 선정 → 감상·수용 → 비교분석 토의·토론 → 특성 정리·일반화). <b>영상 수용·생산<\/b>: 영상특성 안내 → 감상·수용(핵심부분·부수적 부분 구분) → 영상제작 → 발표·토의. <b>디지털 텍스트 읽기<\/b> 5단계: 과제제시 → 정보탐색을 위한 읽기(reading to locate) → 평가하며 읽기(reading to evaluate) → 종합하며 읽기(reading to synthesize) → 의사소통하기. 방향 ④의 취지는 매체가 특정 집단의 힘을 실은 메시지를 암묵적으로 전달할 가능성을 인식하는 것입니다."}], "explain": "", "src": "사회평론 8장"}]}, {"title": "G. 독해 전략", "cards": [{"id": "r23", "name": "5대 독해 전략 (사실·추론·비판·감상·창의)", "warn": true, "exam": "기출 최빈출", "scope": "역락 기준 5범주 (국교이는 4범주)", "items": ["<b>사실적 이해<\/b>: 표면적 내용을 있는 그대로 파악 (중심생각·요지·전개방식)", "<b>추론적 이해<\/b>: 암시·생략된 내용을 배경지식·단서로 추론", "<b>비판적 이해<\/b>: 주제·주장·근거·논증·표현 방식을 준거(타당성·신뢰성·공정성)로 판단", "<b>감상적 이해<\/b>: 공감·감동하며 읽기 (정보 텍스트도 가능)", "<b>창의적 이해<\/b>: 새로운 아이디어로 의미 재구성, 대안·해결 실마리 도출"], "diff": [{"b": "역", "t": "국어과 교육과정 반영 형태로 <b>5범주 × 5하위전략<\/b>을 정리합니다. 사실적: 단위별 내용·관계 파악 / 지식·경험·맥락으로 중심내용 파악 / 전개방식·구조 파악 / 목적에 따른 선별 / 자기 말로 요약. 추론적: 생략 내용 추론 / 의도·목적·숨은 주제 추론 / 인물·장면·분위기 상상 / 여러 관점에서 분석·종합 / 목적·상황과 연결해 의미구성. 비판적: 타당성·공정성·신뢰성 판단 / 공감·반박 부분 찾기 / 필자 가치관·이념 비판 / 구성·표현 효과 비판 / 유사 주제 글과 비교. 감상적: 공감·동일시 부분 찾기 / 감동 내면화 / 필자 배경과 관련지어 감상 / 자신의 정서 변화 인식 / 사회적 독서 참여. 창의적: 생각 재구성 / 문제 해결법 찾기 / 필자 생각의 대안 / 여러 글 비교·재구성 / 창의적 사유."}, {"b": "국", "t": "<b>4단계<\/b>(내용 확인 → 추론 → 평가 → 창의)로 단순화합니다. '감상'을 따로 두지 않습니다. 평가의 기준은 정확성·객관성·편향성(사실), 타당성(의견), 적절성·적합성(텍스트 밖 요소), 효과성(표현), 공공성(매체)이고, 평가의 원리는 <b>비교<\/b>입니다. 평가 결과가 수용일 때 정서적 효과와 적용·문제 해결·새 아이디어가 창의로 나타난다고 봅니다."}, {"b": "사", "t": "독해 기능(Barrett 등) 분류의 학설사와 국가 교육과정의 5범주(낱말·문장 이해 / 내용 확인 / 추론 / 평가와 감상 / 읽기 과정의 점검과 조정)를 소개합니다."}], "explain": "<p><b>비판적 이해 vs 비판적 문식성<\/b>(역락): 전자는 개별 텍스트를 평가하는 독해 전략, 후자는 이데올로기 비판 관점의 능력·성향(비판이론·비판적 담화 분석 전제)으로 범주가 다릅니다.<\/p><p>김혜정(2002): 비판적 이해는 동시에 일어나도 논리적으로는 사실적·추론적 이해가 선결된 고차 단계입니다. 5범주는 임의적 구분이며 실제 독서에는 동시에 관여합니다.<\/p>", "src": "역락 8장 · 국교이 1절 · 사회평론 3장"}, {"id": "r24", "name": "독서 전·중·후 전략 (과정 중심 지도)", "warn": false, "exam": "기출 ×2 (날개질문)", "scope": "역락·국교이 공통", "items": ["읽기 <b>전<\/b>: 예측하기, 배경지식 활성화, 목적 명료화 등 (하향식 이론 근거)", "읽는 <b>중<\/b>: 질문하기, 시각화, 점검 및 조정하기(상위인지), 구조·맥락 분석", "읽은 <b>후<\/b>: 요약, 구조 파악, 평가·비판, 감상, 읽기 방법 반성"], "diff": [{"b": "역", "t": "배경은 인지주의이며 사고구술법과 프로토콜 분석으로 능숙한 독자의 인지 과정을 확인한 것입니다. 능숙한 독자의 특징 8가지(배경지식 활용·독해 과정 조정·중요도 판단·정보 종합·추론 생성·질문 생성·능동적 의미구성·목적에 맞는 전략 사용). 결과 중심 지도는 다 읽은 뒤에야 지도하지만 과정 중심은 읽기 전·중에도 개입합니다. 전략: 전=예측·배경지식 활성화·연상 / 중=질문하기(명시적 vs 암시적)·참고자료·시각화·점검 / 후=요약·구조 파악·비판·감상. 독해 5수준 전략은 전·중·후 모두에 걸치므로 엄격히 구분하지 않습니다."}, {"b": "국", "t": "전=배경지식 활성화·어휘 학습·목표 명료화·미리보기·훑어보기·예측·질문 목록 / 중=장르 추론·구조 분석·맥락적 의미 추리·사실과 의견 구별·정교화·상위인지 활성화(보조 활동: 그래픽 조직자·질문하기·메모하기) / 후=요약·회상·필자 의도 추론·평가·창의·읽기방법 반성. 전은 하향식, 중은 상향식 중심에 하향식을 부분 적용한다고 이론과 대응시킵니다."}], "explain": "<p>사회평론에는 [표 3-4] 독서 전략 점검 질문 예시가 있습니다. 읽기 전: 목적 구체화? 계획? 미리보기? 예측? / 읽기 중: 예측 점검? 질문 생성·답 찾기? 배경지식 연결? 요약? 추론? 문맥으로 단어 추측? 담화표지 활용? / 읽기 후: 어려운 부분 파악·조정? 평가? 목표 충족도 판단? 재점검?<\/p>", "src": "역락 7·8장 · 국교이 3절"}, {"id": "r25", "name": "주제 통합적 독서 (신토피컬 독서)", "warn": false, "exam": "기출 ×4", "scope": "역락·국교이 공통 (사회평론에는 없음)", "items": ["하나의 주제를 중심으로 다양한 글을 종합적으로 읽고 주제를 재구성", "다문서 읽기가 대표 사례, 여러 텍스트의 관점을 비교·종합"], "diff": [{"b": "역", "t": "장점 6가지: 균형 있고 깊은 이해 / 다분야 독서 경험 / 비판적·창의적 사고력 동반 증진 / 상호텍스트성 기반 독서량 증가 / 지식 재구성 / 편견 없는 균형 잡힌 시각. 절차 5단계: 읽기 과제·쟁점 확인 → 자료 선정·수집 → 각 자료의 관점·내용·형식 정리 → 비교대조표 작성 → 자신의 관점 수립·종합."}, {"b": "국", "t": "'주제 중심 독서'로 명명하고, 관심 주제 명료화 → 관련 텍스트 선정 → 주제 중심 선별·통합·결과물 생성 절차를 둡니다. 텍스트는 다양한 매체에서 폭넓게 고르되 신뢰성 검토가 필요합니다."}], "explain": "<p>사회평론에는 이 개념이 없습니다(원문 검색 결과 '신토피컬·주제통합·다문서'가 나오지 않습니다). 역락 3장 독서 발달 8단계의 '종합적 독서기'와 연결됩니다.<\/p>", "src": "역락 8장 · 국교이 1절"}, {"id": "r26", "name": "도해 조직자 (그래픽 조직자)", "warn": false, "exam": "기출 ×3", "scope": "세 책 공통 (역락 기준)", "items": ["개념·정보를 시각적 표현(선·화살표·공간 배열·순서도 등)으로 나타내는 전략", "텍스트 구조를 파악하는 지도에 활용 (텍스트 구조 스키마·담화표지어와 함께)", "교사의 비계로도 활용"], "diff": [{"b": "역", "t": "의미 시각화법. 지도 절차는 모형화 → 안내 → 피드백. 4유형은 <b>수형도(범주·위계) / 표(비교대조) / 시간기반 다이어그램(사건 순서) / 흐름도(과정 단계)<\/b>입니다."}, {"b": "사", "t": "설명문 상위구조 지도 전략 3가지: 텍스트구조 스키마 활용 / 도해조직자 활용(선·화살표·공간배열·순서도로 시각화) / 담화표지어 활용."}, {"b": "국", "t": "읽는 중 보조 활동(비계)으로 그래픽 조직자·질문하기·메모하기를 듭니다(도해조직자·다른 관점 텍스트 제공을 비계 사례로 언급)."}], "explain": "<p>KWL(4란 그래픽 조직자)도 넓게는 도해조직자에 속합니다.<\/p>", "src": "역락 8장 · 사회평론 5장 · 국교이 3절"}, {"id": "r67", "name": "설명적 텍스트 독해 전략 (분석 틀 4가지·전략 9가지)", "warn": false, "exam": "역락 DB 표시: 최빈출", "scope": "역락 고유", "items": ["분석 4대 틀: ①텍스트 유형 이론 ②글 구조 이론(미시·거시·상위구조) ③화제 전개 이론 ④응집성 이론", "중심생각(main idea) = 화제(topic) + 설명·논평(comment)", "독해 전략 9가지: ①서-본-결 형식 ②보조사 '은/는'으로 화제 파악 ③상위구조 지식 ④담화 표지 ⑤핵심어·핵심문장(테마-레마) ⑥부사어·기능어휘·시간표현 ⑦유추·결론으로 낯선 개념 추론 ⑧담화 화제의 연결 구조 ⑨밑줄·동그라미·화살표"], "diff": [{"b": "역", "t": "<b>4대 틀<\/b>. ①Meyer(1985): 설명글은 논리적 관계의 위계적 응집성, 서사글은 시간·인과 관계의 연쇄적 응집성. ②글 구조: 미시(문장 간, 세부정보) / 거시(문단·소제목, 요약) / 상위구조(관습적 수사구조=Schema, 내용 조직). 요약은 미시→거시 구조 형성 과정이며 van Dijk(1980)의 삭제·선택·일반화·재구성 규칙을 적용합니다. ③화제 전개 이론은 주제부(Thema) + 논평(Rhema)의 연쇄로 논지가 전개되는 '동적 구조'(상위구조는 '정적 구조')이며 Toulmin(1958) 논증구조는 주장 + 이유 + 근거입니다. ④응집성 이론은 지시·접속·대용·생략·어휘적 결속으로 정보의 재수용 관계를 봅니다. 전략 세부: 첫 문단은 화제 제시, 마지막 문단은 정리·새 정보 추가 기능이고, '은/는'은 주제부 표시이며 신정보 제시 시 사용됩니다. 기능어휘(~로 정의된다)는 문장 역할을 메타적으로 표시하고 부사어(그대로, 특별히)는 숨은 의미 신호입니다. 추가 전략: 그림과 글을 연결해 생략 내용 정교화, 세부정보 위치 파악, 시간어휘로 연대기식 구조 파악. 이 전략들이 사실적·추론적 독해에 편중되어 있다는 한계를 저자가 밝힙니다."}], "explain": "<p>'설명문 텍스트 구조' 카드와 함께 보세요.<\/p>", "src": "역락 9장"}, {"id": "r68", "name": "정보 텍스트 독서 방법 7단계 (요약의 거시규칙 포함)", "warn": false, "exam": "", "scope": "역락 고유", "items": ["①화제 파악 ②중심생각 파악 ③논지 전개 과정 파악 ④요약하기 ⑤생략된 내용 추론 ⑥비판적으로 읽기 ⑦사회문화적 의미의 비판적 해석(기호학적 해석)"], "diff": [{"b": "역", "t": "②중심생각은 화제 + 설명이며 문단별로는 소주제문 + 뒷받침 문장(명시적·암시적·분산형)을 구분합니다. ④<b>요약하기<\/b>는 요약문 작성이 아니라 질적 왜곡·누락 없이 정보를 양적으로 축소해 기억하는 것이며, 무조건 '절반으로 줄이기'는 정보 편중·중요정보 누락 위험이 있어 부적절합니다. Kintsch &amp; van Dijk(1978) 거시규칙은 <b>삭제<\/b>(비중요정보 제외) / <b>선택<\/b>(중요정보 기억) / <b>일반화<\/b>(하위개념을 상위개념어로) / <b>구성(construction=재구성)<\/b>(여러 명제를 하나의 단순명제로 대체)입니다. ⑤생략 내용 추론은 배경지식·담화표지·사회문화적 맥락을 활용합니다(물 절약 광고의 수사적 질문+동전주입구 그림에서 숨은 주장 추론). ⑥김혜정(2002): 비판적 이해는 논리적으로 사실적·추론적 이해가 선결된 고차 단계입니다. ⑦<b>Barthes 신화학(1957)<\/b>: 신화는 기존 기호(기표+기의)를 다시 전유해 상위 기표로 삼는 2차적 기호체계(메타언어)이며, 내용의 타당성·신뢰성을 넘어 그 텍스트가 어떤 맥락에서 생산·소비되며 삶에 어떤 메타적 의미를 갖는지 보는 '해석론적 관점'입니다(사례: 아파트 광고 \"당신이 사는 곳이 당신을 말해줍니다\"의 물질주의·배금주의 이데올로기 분석)."}], "explain": "<p>거시규칙 4가지(삭제·선택·일반화·구성)는 '설명적 텍스트 독해 전략' 카드의 van Dijk(1980) 규칙과 같은 계열입니다.<\/p>", "src": "역락 8장"}, {"id": "r69", "name": "서사적 텍스트 독해 전략", "warn": false, "exam": "", "scope": "역락 고유", "items": ["설명적 텍스트의 전개 원리는 <b>논리성<\/b>, 서사적 텍스트는 <b>정서성<\/b>", "반응 중심 읽기와 구조 중심 읽기(스토리 맵), Tierney(1982)의 세부 전략", "국어과 교육과정은 서사텍스트 전용 전략을 따로 규정하지 않고 '감상적 이해'(공감 + 내면화, 동일시를 통한 감정이입)로 설명"], "diff": [{"b": "역", "t": "판별: 설명적 텍스트는 정보를 파악하고 설득 여부에 주의하며 읽고, 서사적 텍스트는 깨달음·즐거움과 감정·정서에 주목하며 읽습니다. 설명적 텍스트가 서사적 텍스트보다 어렵다는 연구가 있어 독서 발달 초기에는 서사적 텍스트가 유리하고 흥미·몰입도도 높습니다. 문학 장르별로 소설은 주제-구성-문체, 시는 운율-심상-주제 중심이며 McKee의 이야기 정의에 따라 '갈등과 해결방안 찾기' 전략을 씁니다. <b>반응 중심 읽기<\/b>(Rosenblatt 1938, 1978)는 반응준비-형성-명료화-심화 절차이며 장점은 독자의 주체적 반응 존중, 단점은 '해석의 무정부 상태'입니다. <b>구조 중심 읽기(스토리 맵)<\/b>는 이야기 문법을 도식화하며 4요소는 배경·등장인물·줄거리·주제입니다. <b>Tierney(1982) 세부 전략<\/b>: 다시 말하기(인지적 중재) / 예측하기 / 질문 생성과 답변 찾기 / 교사의 안내에 따라 읽기('3-2-1 전략': 알게 된 것 3개-흥미로운 것 2개-궁금한 것 1개) / 시각화하기(Pressley 1977) 등."}], "explain": "", "src": "역락 9장"}, {"id": "r70", "name": "디지털 텍스트 독해 (3대 새로운 읽기 관습과 독해 전략)", "warn": false, "exam": "기출 ×2 (부분 연관)", "scope": "역락 고유 (사평 5장에 하이퍼텍스트·8장에 교수학습 5단계)", "items": ["이재현(2013) 3대 읽기 관습: <b>다중 읽기<\/b> = 다문서 읽기 / <b>소셜 읽기<\/b> = 사회적 읽기 / <b>증강 읽기<\/b> = 하이퍼텍스트 읽기", "디지털 텍스트 이해 과정: 필요정보 탐색을 위한 텍스트 선정 → 내용 분석과 추론 → 적절성 평가 및 성찰 (비유: 항해, 상위인지 필요)", "독해 전략 3가지: ①여러 관점에서 분석·종합하기 ②글이 미칠 사회적 영향 평가하기 ③사회적 관계와 힘(권력·이데올로기) 평가하기"], "diff": [{"b": "역", "t": "다중 읽기(multiple reading)는 비선형적이고 일시적 주의를 배분하며, 이재현은 '표상 세계로 들어가는 읽기(looking-through)'가 아닌 '텍스트 표면에 머무는 읽기(looking-at)'로 피상성이 필연적이라고 비판적으로 평가합니다. 소셜 읽기 사례: 킨들의 Popular Highlights(다른 독자의 밑줄 공유), 인터넷 기사 댓글. 새 관습이 등장해도 묵독의 지배적 위치는 약화되지 않고 음독도 특정 맥락에서 유지됩니다. ③은 기호학적 분석이며 5단계는 지시적 의미 파악 → 주장과 근거 분석 → 논리적 타당성 분석 → 함축의미·제작자 의도 분석 → 사회문화적 기호 분석입니다(사례: 아파트 광고의 '베를린 효과'). ②는 만평·여론형성 목적의 글에서 필자 의도 추론+사회적 영향 예측입니다."}, {"b": "사", "t": "디지털 텍스트 읽기 교수학습은 5단계(과제제시 → 정보탐색을 위한 읽기 → 평가하며 읽기 → 종합하며 읽기 → 의사소통하기)이며 '복합양식 텍스트 교수학습' 카드에 있습니다. 하이퍼텍스트는 사평 5장의 '인쇄 vs 복합양식' 분류에서 다룹니다."}], "explain": "<p>인덱스는 이재현 용어와 국어교육 용어의 <b>매칭<\/b>을 임용 빈출로 표시합니다(다중 읽기↔다문서 읽기, 소셜 읽기↔사회적 읽기, 증강 읽기↔하이퍼텍스트 읽기).<\/p>", "src": "역락 9장 · 사회평론 5장·8장"}]}, {"title": "H. 독서지도 방안", "cards": [{"id": "r27", "name": "지속적 묵독(SSR)", "warn": false, "exam": "", "scope": "사회평론 고유", "items": ["다독의 한 방법: 자율적 책 선정 + 무과제 자율 읽기 (1960년대 등장)", "McCracken: 전원 참여 + 정해진 시간 + 무과제가 핵심", "절차: 준비하기 → 묵독하기(교사도 함께) → 공유하기(선택)"], "diff": [{"b": "사", "t": "정독(적은 양을 꼼꼼히)과 대비됩니다. 쉬운 자료를 많이 읽어 자신감·즐거움을 형성합니다. 시간은 초등 15~20분 / 중학 20~30분 / 고등 30분입니다. 교사가 함께 묵독하는 것은 역할 모델 기능입니다."}], "explain": "", "src": "사회평론 9장"}, {"id": "r28", "name": "자기 선택적 독서와 BOOKMATCH", "warn": false, "exam": "", "scope": "사회평론 고유", "items": ["이론 근거: Deci &amp; Ryan의 <b>자기결정감 이론<\/b> (자율적 행동이 내적 동기를 진작)", "4블록 모형(Cunningham &amp; Hall): 초등, 교사가 책 선정 주도(제한적 자율성)", "박영민·최숙기(2008): 중학생 이상, 완전한 선정 자율성 + <b>BOOKMATCH<\/b> 전략(9개 요소)"], "diff": [{"b": "사", "t": "BOOKMATCH 9요소: Book Length(길이) / Ordinary Language(언어 친숙성) / Organization(구조) / Knowledge prior to book(선행지식) / Manageable text(다룰 만한 텍스트) / Appeal to genre(장르 관심) / Topic appropriateness(주제 적합성) / Connection(연관) / High-interest(흥미). 절차 5단계: 전략 설명·시범 → 전략 활용 책 선정 → 자기주도적 책 읽기 → 읽은 내용 공유 → 정리 및 평가."}], "explain": "", "src": "사회평론 9장 (역락 2장에 자기선택적 독서 프로그램 언급)"}, {"id": "r29", "name": "내용교과 독서", "warn": false, "exam": "", "scope": "사회평론 고유", "items": ["특정 교과 학습을 위해 교과서·관련 도서를 읽고 개념·지식을 습득하는 독서 활동", "국어(독서)교사는 '읽는 법'(learn to read), 내용교과 교사는 '학습을 위한 독서'(read to learn)에 중점", "절차 3단계: 독서 자료 선정 → 질문 생성 및 답 찾기 → 개념어·학습 내용 정리"], "diff": [{"b": "사", "t": "Chall(1996)은 초4~중3을 '새로운 학습을 위한 독서 발달 단계'로 명명했습니다. 전략: 개요 작성·학습일지·메모·요약·SQ3R·KWL·브레인스토밍·벤다이어그램·도해조직자 등입니다."}, {"b": "역", "t": "'학습독서' 개념으로 부분적으로 다룹니다(8장)."}], "explain": "", "src": "사회평론 9장 · 역락 8장"}, {"id": "r71", "name": "독서토론 (사회적 의미 구성 활동)", "warn": false, "exam": "", "scope": "사회평론 고유", "items": ["사회적 의미구성 지도방안 3종: <b>독서토론 / 독서클럽(book club) / 독서워크숍(reading workshop)<\/b>", "독서토론: 일정 인원이 특정 텍스트에 대한 의견·감상을 논의하는 활동 ('논제'와 '갈등' 포함)", "절차: 준비하기 → 묵독 및 토론자료 마련 → 토론하기 → 반응 정교화하기"], "diff": [{"b": "사", "t": "이론적 배경은 비고츠키·상황적 인지이론입니다. 판별기준: <b>지배적 반응<\/b>(공유된 의미) vs <b>다변적 반응<\/b>(갈등 유발) — 다변적 반응이 있을 때 자신의 해석을 정당화하려는 노력이 독서토론입니다. 준비하기는 모둠 6~8인 이하·논제 설정·찬반 균등 배분, 토론하기는 CEDA 토론 변형(입론 - 작전타임 - 반론펴기 - 반론꺾기 - 청중질의응답 - 작전타임 - 최종변론), 반응 정교화는 비평문·논설문·독후감상문 작성입니다(김주환·이순영 2015)."}], "explain": "", "src": "사회평론 9장"}, {"id": "r72", "name": "진로 독서지도", "warn": false, "exam": "", "scope": "사회평론 고유", "items": ["3단계: 진로 탐색을 위한 도서 선정 → 독서를 통한 직업 이해 → 진로 결정을 위한 내면화 활동 (1회기 단위 구성 가능)"], "diff": [{"b": "사", "t": "원문 서술이 한 줄로 간략합니다."}], "explain": "", "src": "사회평론 9장"}]}, {"title": "I. 독서 평가", "cards": [{"id": "r30", "name": "평가 관련 용어의 위계", "warn": false, "exam": "", "scope": "역락 고유", "items": ["포괄성 순서: <b>검사(test) &lt; 측정(measurement) &lt; 평가(assessment) &lt; 총평(evaluation)<\/b>", "검사=반응을 얻는 도구 / 측정=척도로 점수 부여(양화) / 평가=측정 결과로 판단해 의사결정 / 총평=제도·교재·교육과정 등까지 가치 판단"], "diff": [{"b": "역", "t": "진단(diagnosis)은 독서 발달·장애·어려움을 확인하는 것으로 진단평가-형성평가-총합평가 흐름의 사전 단계입니다. 판별: 평가는 정상 발달 학생 대상으로 전·중·후 모두 쓰고, 진단은 읽기부진아·난독증·비독자 등을 교수학습 전에 판별할 때 씁니다."}], "explain": "", "src": "역락 10장"}, {"id": "r31", "name": "독서 평가 설계의 5대 준거", "warn": false, "exam": "역락 DB 표시: 최빈출", "scope": "역락 기준", "items": ["<b>타당도 vs 신뢰도<\/b>", "<b>절대평가(준거지향) vs 상대평가(규준지향)<\/b>", "<b>형식평가 vs 비형식평가<\/b>", "<b>과정평가 vs 결과평가<\/b>", "<b>교실평가 vs 고부담평가<\/b>"], "diff": [{"b": "역", "t": "타당도는 측정하려는 것을 제대로 측정하는 정도(내용·구인·준거타당도)이고, 성취기준이 아닌 지문 중심으로 문항을 구성하면 타당도가 떨어집니다. 절대평가는 목표 지향·발달적 교육관(진단에 유리), 상대평가는 서열 정보·선발적 교육관입니다. 형식평가는 표준화 검사, 비형식은 관찰·포트폴리오이며 저자는 비형식평가의 타당성이 더 높을 수 있다고 봅니다. 초인지 평가는 과정평가에 포함되고, 교실평가는 교사 주도, 고부담평가는 외부에서 부과됩니다."}, {"b": "사", "t": "평가 유형을 준거지향/규준지향 2대 분류로 표현하고, 진단·형성·성취평가와 결합해 재조직합니다. 인덱스는 '완전한 동의어로 병기만 하면 된다'고 표시합니다."}, {"b": "국", "t": "평가 목표를 성취도 평가(가르친 것) vs 전체 읽기능력 평가(학기초 진단 등) 2대 성격으로 나눕니다."}], "explain": "", "src": "역락 10장 · 사회평론 10장 · 국교이 4절"}, {"id": "r32", "name": "대안적 독서 평가 방법", "warn": true, "exam": "기출 ×7 (합산)", "items": ["<b>회상검사<\/b>(자유회상·단서회상)", "<b>요약하기<\/b>와 <b>중요도 평정<\/b>", "<b>오독 분석<\/b>: 소리 내어 읽기의 오류(대치·생략·삽입 등)를 분석", "<b>프로토콜 분석<\/b>: 사고구술로 얻은 자료 분석 (전략·상위인지 관찰)", "<b>빈칸 메우기<\/b>(Cloze test)"], "diff": [{"b": "역", "t": "<b>7종<\/b>: 회상검사 / 요약하기 / 오독 분석 / 프로토콜 분석 / 빈칸 메우기 / 중요도 평정 / 포트폴리오. 자유회상 vs 단서회상, 정확 단어 채점 vs 허용 단어 채점, 중요도 평정은 4단계 척도로 학생 평정과 전문가 평정을 비교, 포트폴리오는 성장을 보여주는 평가(자료 상자가 되면 안 됨; 신뢰도 방어가 어려움)입니다. 프로토콜 분석은 어린 독자는 사고구술이 어렵고 성인은 검열 가능성이 있다는 단점이 있습니다."}, {"b": "사", "t": "평가를 <b>과정(빈칸 메우기·오독 분석·안구운동 분석) / 결과(선다형·진위형·자유회상·탐문검사) / 상위인지(자기평가 체크리스트·프로토콜 분석·오류 탐색 과제·요약하기·중요도 평정)<\/b> 3대 방법으로 분류합니다. 빈칸 메우기는 Taylor(1953)이고 지문 250~350단어, 첫·끝 문장은 보존합니다. 오독 분석은 Goodman(1968)의 5유형(대체·생략·삽입·전치·반복 및 수정)이며, 안구운동은 고정·회귀·도약을 봅니다. 상위인지 검사지 MARSI는 30문항 3범주입니다."}, {"b": "국", "t": "<b>과정 평가·상위인지 평가 5종<\/b>(눈멈춤과 읽기속도 / 오독과 자율적 수정 / 빈칸 메우기 / 프로토콜 / 읽기 수행의 관찰)과 <b>결과 평가 5종<\/b>(자유회상과 탐문 / 요약과 중요도 평정 / 선다형과 객관식 / 서술형·논술형·토론형 / 독해 포트폴리오)으로 나눕니다. 빈칸 메우기를 과정평가로 쓰면 빈칸을 발견 즉시 메우며 읽는 방식으로, 결과평가(다 읽은 뒤 채움)와 구분합니다."}], "explain": "<p>분류 체계가 세 책이 모두 다릅니다(역락 7종 나열 / 사평 과정·결과·상위인지 / 국교이 과정·결과 각 5종). 같은 방법(예: 빈칸 메우기)이 책에 따라 <b>과정평가<\/b>에 속하기도 하고 결과평가로 쓰이기도 합니다.<\/p>", "src": "역락 10장 · 사회평론 10장 · 국교이 4절"}, {"id": "r33", "name": "평가 텍스트 선정 4대 기준", "warn": false, "exam": "기출 ×1", "scope": "국교이 고유", "items": ["<b>새로운<\/b> 텍스트 (이전에 읽거나 학습한 적 없어야 능력이 아닌 기억을 재지 않음)", "<b>장르<\/b>가 평가 목표에 부합 (성취도 평가는 학습 텍스트와 같은 장르, 전반 평가는 대표 장르를 골고루)", "텍스트 <b>난도<\/b>가 대상 학습자에 적합 (너무 쉽거나 어려우면 변별력 상실)", "내용의 <b>편향 없음<\/b> (특정 독자에게 친숙한 내용은 배경지식 격차로 불공정)"], "diff": [{"b": "국", "t": "판별 사례: '생물의 분류체계' 텍스트를 쓸 때, 과학 교과 관점은 '생물 특징을 아는가'를 보지만 읽기 평가 관점은 '이런 텍스트를 얼마나 독해할 수 있는가'(독해력)를 봅니다. 두 관점의 혼동을 경계합니다."}, {"b": "사", "t": "텍스트 난도(사평 5장)를 텍스트적·독자적·상황적 3측면으로 다루고 양적·질적 측정법을 정리합니다('텍스트 난도 판단의 3측면' 카드)."}], "explain": "", "src": "국교이 4절"}, {"id": "r73", "name": "독서 평가의 문제점 8가지와 개선 방향", "warn": false, "exam": "", "scope": "역락 고유", "items": ["문제점: ①목적 불분명 ②타당성·신뢰성 낮음 ③능력-태도 불균형 평가 ④선다형 일변도 ⑤수행형 평가 자료 불충분 ⑥평가-교수학습 분리 ⑦결과 미활용 ⑧교사 전문성 향상 미흡", "핵심 개선: <b>정합성(alignment, 일체화)<\/b> 제고 — 학습내용 → 교재·교수학습 → 평가의 일관성"], "diff": [{"b": "역", "t": "개선 방향은 검사를 넘어 교육적 기능 강조 / 타당도·신뢰도 제고 / 인지·정의 균형 / 선다형+수행형 상호보완 / 수행형 부수도구(채점기준·예시답안) 개발 / 정합성 제고 / 평가 정보의 기록·관리·활용(포트폴리오 등 누가기록) / 교사의 평가 전문성 향상입니다. 정합성은 Wiggins &amp; McTighe(2005/2008)의 역방향설계(바라는 결과 확인 → 수용 가능한 증거 결정 → 학습경험·수업 계획)와 연결됩니다. 비유: 간접평가는 체중계 없이 신장으로 체중을 추론하듯 측정 대상과 상관이 높은 다른 것을 측정해 추론하는 것입니다."}], "explain": "", "src": "역락 10장"}, {"id": "r74", "name": "독서 평가의 목적과 교사의 역할 변화", "warn": false, "exam": "", "scope": "역락 고유", "items": ["목적 2가지: ①개별 학생 진단 → 교수학습 개선(준비도평가 → 형성평가 → 총괄평가) ②국가 수준 독서능력 추이 파악(PISA 등)", "평가 내용은 독서(읽기) 교육과정의 <b>성취기준<\/b>이어야 정합성·타당도 확보", "교사 역할: 전통적 = 지식 전달자·평가에서 심판자 → 새 관점 = 진단자·관찰자·시범자·촉진자(facilitator)"], "diff": [{"b": "역", "t": "<b>책무성(accountability)<\/b>: 평가 결과의 책임을 교사에게만 돌리지 않고 가정환경·학습자 노력·학교행정·교재 등 다양한 요인으로 분산해 파악해야 합니다. 의사 비유: 표준화검사 결과를 존중하되 최종 판단은 교사 자신의 임상적 경험(전문성)에 기반합니다."}], "explain": "", "src": "역락 10장"}, {"id": "r75", "name": "전통적 평가관 vs 대안적 평가관", "warn": false, "exam": "역락 DB 표시: 최빈출", "scope": "역락 고유 (종합 비교표)", "items": ["독서의 개념: 글 내용에 대한 <b>기억<\/b> ↔ <b>의미의 구성<\/b>", "중점 사고기제: 장기기억 ↔ 작동기억(working memory)", "평가 대상: 사고의 결과 ↔ 사고의 과정", "평가 목적: 학생 선발·교사 책무성 ↔ 학생 진단·성취 확인·교수학습 개선", "평가 중점: 신뢰도(객관도) ↔ 타당도", "배경 교육관: 선발적 ↔ 발달적", "평가 방식: 상대평가 중시 ↔ 절대평가 중시", "교사 역할: 지식 전달자·당락 심판자 ↔ 발달 진단자·기능 시범자·내면화 조력자", "책무성: 전적으로 교사 ↔ 교육공동체 구성원 모두", "평가 방법: 주로 선다형(단일) ↔ 포트폴리오·중요도평정·프로토콜분석·오독분석·관찰평가·빈칸메우기(다양)"], "diff": [], "explain": "<p>(전통적 ↔ 대안적 순서입니다.) 인덱스가 '임용 최빈출' 표로 표시한 부분입니다.<\/p>", "src": "역락 10장"}, {"id": "r76", "name": "선다형 검사", "warn": false, "exam": "", "scope": "역락·사회평론·국교이 공통", "items": ["가장 보편적인 표준화된 형식평가, 결과 중심 평가로 흐르기 쉬움", "장점: 집단검사 가능, 경제성 (대규모 국가고시에 적합)", "단점: 타당한 문항 구성이 어렵고, 오답 원인 진단이 어렵고, 분절적 접근 (기초기능 측정에 치우침)"], "diff": [{"b": "역", "t": "분절적 접근 비판의 요지는 독서능력이 하위요소의 단순 총합이 아니라는 반론이며, 고급 독해능력보다 기초기능 측정에 치우친다고 봅니다."}, {"b": "사", "t": "선다형 하위유형: 최선답형 / 정답형 / 다답형 / 합답형 / 부정형. <b>진위형<\/b>은 추측 확률이 50%로 높아 보완 문항이 필요합니다."}, {"b": "국", "t": "선다형·객관식(진위형·연결형 포함)은 효율성·경제성이 높지만 타당성은 낮은 편이며 문항·답지 구성의 질이 관건입니다."}], "explain": "", "src": "역락 10장 · 사회평론 10장 · 국교이 4절"}, {"id": "r77", "name": "진단평가·형성평가·성취평가", "warn": false, "exam": "", "scope": "사회평론 고유", "items": ["<b>독서 진단평가<\/b>: 강점·약점 진단, 점수·순위가 아니라 <b>독자 프로파일<\/b> 구성이 목적", "<b>독서 형성평가<\/b>: 수업 중 성취기준 도달도 점검, 학생 현재 수준에 대한 피드백과 교사 교수전략 정보를 함께 제공 (성장 참조적)", "<b>독서 성취평가<\/b>: 능숙도(proficiency) 측정, 교육과정 이수 후 실시"], "diff": [{"b": "사", "t": "준거지향(절대평가)은 과업 수행 수준·통과/실패 판단이고 규준지향(상대평가)은 집단 내 상대적 위치(백분위)를 확인합니다. 진단 요인은 음운인식·해독·유창성·이해입니다. 해외 도구: CTOPP, PPVT, <b>우드콕-존슨III 진단적독서검사(WJ III DRB)<\/b>(표준화, 10개 하위평가), <b>질적독서검사-5(QRI-5)<\/b>(비형식적, 규준참조 아님, 단어재인+독해 수준 진단). 한국은 체계적 독서 진단평가 도구 개발이 매우 미흡해 기초어휘목록+이독성공식 개발이 선행과제입니다. 성취평가 예: 국가수준 학업성취도평가(낱말이해·내용확인·추론·평가와감상), <b>PISA 읽기소양<\/b>(만 15세, 읽기상황/텍스트/읽기양상: 접근 및 확인 - 통합 및 해석 - 성찰 및 평가)."}, {"b": "국", "t": "평가 목표를 성취도 평가(가르친 것) vs 전체 읽기능력 평가(학기초 진단 등)로 나눕니다. 평가 내용은 지식적 내용(읽기과정·텍스트·전략에 대한 지식) vs 기능적 내용(읽기 기능의 수행 — 가장 핵심적인 평가내용)이며, 피드백은 결함 발견 → 보완, 장점 발견 → 계발 두 방향입니다."}], "explain": "", "src": "사회평론 10장 · 국교이 4절"}, {"id": "r78", "name": "독서 평가 추진 절차 5단계", "warn": false, "exam": "", "scope": "역락 고유", "items": ["계획 수립(학기초) → 도구 개발 → 평가 시행 → 결과 정리 및 해석 → 의사결정 및 활용"], "diff": [{"b": "역", "t": "도구 개발에는 이원목적분류표·평가기준·채점기준·예시답안·기록지가 포함되고, 시행에는 장애학생 검사도구 적응(adaptation)이 포함됩니다. 결과 정리 및 해석에서는 왜곡 여부를 점검하고, 의사결정은 교육적(모둠편성·재지도·피드백)과 사회적(선발·진학·책무성)으로 나뉩니다."}], "explain": "", "src": "역락 10장"}, {"id": "r79", "name": "오독 분석법", "warn": true, "exam": "대안적 평가 7종에 포괄", "items": ["소리 내어 읽을 때의 잘못 읽는 부분(오독)을 분석하는 평가", "독서 입문기·기초기능기 아동, 부진아, 특수교육 대상에 활용도가 높음", "오류 유형(대체·생략·삽입 등) 분석으로 정음법 습득도·어려움 지점·배경지식 활용 예측 여부 파악"], "diff": [{"b": "역", "t": "오류 유형은 무반응 / 삽입 / 생략 / 무의미단어 / 의미대치 / 자기수정 / 반복 / 더듬거림 / 반전 / 건너뜀이며 각각 표시방법·점수화가 있습니다. 텍스트 단어와 오독 단어의 어형·음소 유사성(상/중/하), 문맥적 허용 정도(허용불가/부분허용/전체허용)로 세분 채점할 수 있습니다."}, {"b": "사", "t": "<b>Goodman(1968)<\/b>: 독자를 합리적 단서 사용자(cue user)로 보고 통사적·의미적·음성적 단서체계 활용을 전제합니다. <b>오독 5유형<\/b>: 대체 / 생략 / 삽입 / 전치 / 반복 및 수정. 절차: 미학습 자료 준비(고학년 300단어, 저학년 150~200단어) → 소리 내어 읽기 녹음 → 정확도(%) 계산 → 자기수정 비율 계산 → 오독분석 → 이해도 측정 질문."}, {"b": "국", "t": "오독=대치·삽입·누락·잘못된 띄어읽기 등(통사적·의미적 능력 판단), <b>자율적 수정<\/b>은 상위인지 요소(의미에 대한 민감도·주의 깊은 독해 판단)입니다. 주로 입문기·기초기능기(낭독 단계) 대상이며 일대일로 약간 어려운 새 텍스트 전체를 읽힙니다."}], "explain": "<p>오독 유형 수가 다릅니다: 역락 10종(세분), 사평 5종. 자료 표시대로 옮겼습니다.<\/p>", "src": "역락 10장 · 사회평론 10장 · 국교이 4절"}, {"id": "r80", "name": "빈칸 메우기 (Cloze test, 낱말 깁기 검사)", "warn": true, "exam": "", "items": ["글의 n번째 부분을 공란으로 만들어 채우게 함, 형태심리학(배경지식으로 미완성 부분을 채우려는 성향)에 근거", "첫·끝 문장은 공란에서 제외 (배경지식 활성화 목적)", "채점: <b>정확 단어 채점법<\/b> vs <b>허용 단어 채점법<\/b>"], "diff": [{"b": "역", "t": "변형: 음절삭제형 / 어절삭제형 / 내용어삭제형 / 기능어삭제형(보통 내용어=체언·용언 중심). 허용 단어 채점법은 문맥상 통하면 정답입니다(이희세 1989). 전병만(1985)은 독자의 글 이해를 전제로 하므로 고등사고기능으로서 독서능력을 측정할 수 있고 타당도·신뢰도가 높으며 문항 제작·채점이 쉬워 활용가치가 높다고 봅니다. 채점 배점 예: 정확단어 2점 / 허용(유사)단어 1점 / 관련 없는 단어 0점."}, {"b": "사", "t": "<b>Taylor(1953)<\/b>가 원어민 대상 이독성 측정 도구로 개발했습니다. 낱말삭제방법(고정비율 vs 변동비율) × 낱말채점방법(정확낱말 / 적정낱말 / 고빈도낱말)이며, 지문 요건은 250~350단어·명료한 내용·첫·끝 문장 보존·두 번째 문장부터 삭제 시작입니다. 과정 평가로 분류합니다."}, {"b": "국", "t": "빈칸 메우기를 <b>과정평가<\/b>로 쓰면 다 읽은 뒤 채우는 결과평가와 달리 빈칸을 발견 즉시 메우며 읽는 방식으로, 실시간 추론·배경지식·전략 유연성을 판단합니다. 빈칸 구성은 목적(핵심어·중심문장·표지어 등)에 따라 조정할 수 있습니다."}], "explain": "<p>⚠️ 사평·국교이는 과정평가, 역락은 '대안적 평가 7종' 중 하나로 나열합니다. 같은 방법이 <b>어느 분류에 속하는지<\/b>가 책마다 다릅니다.<\/p>", "src": "역락 10장 · 사회평론 10장 · 국교이 4절"}, {"id": "r81", "name": "프로토콜 분석법 (사고구술)", "warn": false, "exam": "기출 ×1", "items": ["사고구술(think-aloud)로 얻은 언어자료(프로토콜)를 분석", "해독보다는 <b>독서전략·초인지 수행<\/b> 관찰에 사용, 의미 형성 과정·연상·추론 양상 파악에 유용", "단점: 어린 독자는 사고구술 자체를 익히기 어렵고, 성인은 의도적 검열 가능성, 분석자의 전문성 필요"], "diff": [{"b": "역", "t": "예시 「소나기」 읽기: 예측하기 / 배경지식 활성화 / 의도 추론하기(왜 '소년·소녀'라는 중립적 명사를 썼는지) / 사건 전개 예측 / 인물 성격 추론 등으로 분류·진단합니다. 검사 도구는 마주 앉기 → 지문 제시 → 소리 내어 끊어 읽으며 사고구술 → 반응 유형 체크리스트에 범주화 표시 순이며 기록지의 반응 유형은 무반응 / 내용확인 / 추론적 / 창의적 / 점검적 반응 / 읽기유창성 등입니다."}, {"b": "사", "t": "상위인지 평가에 포함하며, 어린 독자에겐 한계가 있어 사고구술 자체의 자동화 훈련이 필요합니다."}, {"b": "국", "t": "초등 고학년 이상(자기 읽기 과정을 관찰할 수 있는 연령)이 대상이고 사전 훈련이 필요합니다. 전반적 독해력 특징 검사에 가장 적합합니다."}], "explain": "", "src": "역락 10장 · 사회평론 10장 · 국교이 4절"}, {"id": "r82", "name": "포트폴리오 평가", "warn": true, "exam": "기출 ×1 (독서 포트폴리오)", "items": ["타당도 높은 비형식 평가, 결과뿐 아니라 <b>과정<\/b>도 평가 가능 (어원: performance + files)", "학생이 생성한 다양한 증거물(독서목록·감상문·초고·완성글·동료비평·토의내용 등)", "'자료 상자(document container)'가 되면 안 됨 — 학생의 발달·성장을 보여주는 <b>대표 자료<\/b>만 교사가 선별"], "diff": [{"b": "역", "t": "목적별 종류: 전시용(showcase) / 평가용 / 기록용 / 과정용 / 작업용(천경록 2001; 학생생활기록부 = 평가용 포트폴리오). 장점: ①독서발달의 종합적·개별화된 파악 ②평가-교수학습 상황의 통합(생태적 평가, 과정중심평가 가능) ③독서 수행의 질(quality) 중시(McLaughlin &amp; Vogt 1996). 단점: 신뢰도 방어 곤란, 대단위 선발 검사로는 부적합, 관찰지·면담지·평가기준의 추가 개발 필요. 그 밖의 수행형 평가로 관찰법·토론법·면접법·프로젝트법·체크리스트법이 있습니다."}, {"b": "국", "t": "독해 포트폴리오: 텍스트목록·요지·개요·줄거리·느낀점·낙서·글·그림·토의기록·교사관찰일지 등 결과+과정 자료를 포괄적으로 수집합니다. 특정 목적 중심으로 구체화하거나 무제한 수집하는 방식 모두 가능합니다."}], "explain": "", "src": "역락 10장 · 국교이 4절"}, {"id": "r83", "name": "회상검사·요약하기 검사·중요도 평정법", "warn": true, "exam": "기출: 자유회상 ×2 · 중요도평정 ×3", "items": ["<b>회상검사<\/b>: 텍스트를 읽고 내용을 말·글로 회상 — 자유회상(조건 없음) vs 단서회상(제목·시작어절 등 단서)", "<b>요약하기 검사<\/b>: 중심내용(main idea) 파악력 평가에 적합", "<b>중요도 평정법<\/b>: 글의 의미 단위의 중요도를 학생이 판단하고 전문가 평정과 비교"], "diff": [{"b": "역", "t": "회상은 단어(개념)나 명제(proposition) 단위로 채점하며, 글로 하는 회상은 쓰기능력이 개입하므로 초3 이후 실시를 권장합니다(이해력 vs 표현력). 단순 암기를 막으려 회상 전에 무관한 계산문제를 배치하기도 합니다. <b>회상 vs 요약<\/b>: 회상은 독자 생각이 개입되는 자유 재구성, 요약은 글 중심의 압축으로 더 객관적입니다(요약은 분량별·구조별·화제별·위계별·시간순으로 조건을 다양화할 수 있음). 중요도 평정은 보통 절 단위를 4단계 척도(매우 중요-조금 중요-덜 중요-중요하지 않음)로 평정하며, 중요정보(중심내용)와 비중요정보(뒷받침내용)를 가려내는 것 자체를 글 이해의 증거로 봅니다(김명순 1998)."}, {"b": "사", "t": "<b>자유회상<\/b>은 기억량·연결 순서(sequence)·정확성을 평가하며 결과 평가에 속합니다. 요약하기·중요도평정은 상위인지 평가에 포함합니다."}, {"b": "국", "t": "<b>자유회상과 탐문(단서회상)<\/b>은 요소별이 아닌 총체적 독해수준 판단에 적합합니다. <b>요약<\/b>은 위계관계를 드러내는 과제이고 <b>중요도평정<\/b>은 문장·문단별 4~6등급 척도로 글 구조의 중요도만 판단하며 요약의 중간 과정으로도 활용됩니다. 둘 다 결과 평가에 넣습니다."}], "explain": "<p>⚠️ 요약·중요도평정이 사평에서는 상위인지 평가, 국교이에서는 결과 평가입니다.<\/p>", "src": "역락 10장 · 사회평론 10장 · 국교이 4절"}]}]}]}</script>
<script>
const DB = JSON.parse(document.getElementById('dbdata').textContent);
const LS_M = 'kgrq_mastery_v1', LS_S = 'kgrq_scope_v1';
const BOOK = {역:'역락', 사:'사회평론', 국:'국교이', 이:'의사소통이론'};
function load(k, def){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; }catch(e){ return def; } }
function save(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
let mastery = load(LS_M, {});
let scope = Object.assign({domains:DB.domains.filter(d => d.sections.some(s => s.cards.length)).map(d => d.id), warn:false, exam:false, unsure:true}, load(LS_S, {}));

const flat = [], byId = {};
DB.domains.forEach(d => d.sections.forEach(s => s.cards.forEach(c => {
  const f = Object.assign({}, c, {dId:d.id, dLabel:d.label, sTitle:s.title});
  flat.push(f); byId[c.id] = f;
})));
const domCards = id => flat.filter(c => c.dId === id);

const $main = document.getElementById('main'), $ttl = document.getElementById('ttl'), $back = document.getElementById('back');
let stack = [{v:'home'}];
let draw = null;

function go(v, p){ stack.push(Object.assign({v}, p||{})); render(); window.scrollTo(0,0); }
function back(){ if(stack.length > 1){ stack.pop(); render(); } }

function dot(id){ const m = mastery[id]; return '<span class="dot ' + (m ? m.s : '') + '"></span>'; }
function tags(c){ return (c.warn ? '<span class="tag">책별 차이</span>' : '') + (c.exam ? '<span class="tag ex">' + c.exam + '</span>' : ''); }

function itemsHtml(list){
  return '<ul class="items">' + list.map(i => typeof i === 'string' ? '<li>' + i + '</li>' :
    '<li>' + i.t + (i.c && i.c.length ? itemsHtml(i.c) : '') + '</li>').join('') + '</ul>';
}
function cardBody(c, openDiff){
  let h = '<div class="blk"><h3>떠올릴 항목 (' + (c.scope || '세 책 공통') + ')</h3>' + itemsHtml(c.items) + '</div>';
  if(c.diff && c.diff.length){
    h += '<details class="diff"' + (openDiff ? ' open' : '') + '><summary>책별 차이 (' + c.diff.map(x => x.b).join('·') + ')</summary>' +
      c.diff.map(x => '<div class="d"><span class="bk">' + BOOK[x.b] + '</span><div>' + x.t + '</div></div>').join('') + '</details>';
  }
  if(c.explain) h += '<div class="explain">' + c.explain + '</div>';
  if(c.src) h += '<p class="src">출처 위치: ' + c.src + '</p>';
  return h;
}

function vHome(){
  $ttl.textContent = '국어교육론';
  const total = flat.length, known = flat.filter(c => mastery[c.id] && mastery[c.id].s === 'know').length;
  let h = '<p class="lead">개념 이름만 보고 떠올린 뒤, 정답을 확인하세요.</p>';
  DB.domains.forEach(d => {
    const n = d.sections.reduce((a, s) => a + s.cards.length, 0);
    const k = domCards(d.id).filter(c => mastery[c.id] && mastery[c.id].s === 'know').length;
    h += '<button class="spine' + (n ? '' : ' off') + '" data-d="' + d.id + '" data-act="domain" data-id="' + d.id + '"><span class="in"><div class="nm">' + d.label +
      '</div><div class="sub">' + (n ? n + '개 개념 · 알았다 ' + k + '개' : '준비 중') + '</div></span></button>';
  });
  h += '<button class="drawbtn" data-act="drawscope"><div class="nm">랜덤 뽑기</div><div class="sub">' + (total ? '전체 ' + total + '개 개념에서 무작위 · 범위 선택 가능' : '준비 중') + '</div></button>';
  h += '<div class="foot"><button class="link" data-act="reset">학습 기록 초기화</button></div>';
  return h;
}

function vDomain(p){
  const d = DB.domains.find(x => x.id === p.id);
  $ttl.textContent = d.label;
  let h = '<div data-d="' + d.id + '"><div class="dhead"><div class="t">' + d.label + '</div><button class="btn dc" data-act="drawscope" data-id="' + d.id + '">이 영역 뽑기</button></div>';
  d.sections.forEach((s, si) => {
    const known = s.cards.filter(c => mastery[c.id] && mastery[c.id].s === 'know').length;
    h += '<details class="sec"' + (si === 0 ? ' open' : '') + '><summary><span>' + s.title + '</span><span class="n">' + known + '/' + s.cards.length + '</span></summary>';
    s.cards.forEach(c => { h += '<button class="crow" data-act="card" data-id="' + c.id + '">' + dot(c.id) + '<span class="cn">' + c.name + '</span>' + tags(c) + '</button>'; });
    h += '<div class="secact"><button class="btn" data-act="drawsec" data-d="' + d.id + '" data-s="' + si + '">이 장만 뽑기</button></div></details>';
  });
  return h + '</div>';
}

function vCard(p){
  const c = byId[p.id]; $ttl.textContent = c.dLabel;
  const m = mastery[c.id];
  return '<div data-d="' + c.dId + '"><div class="meta"><span class="pill">' + c.dLabel + '</span><span>' + c.sTitle + '</span>' + tags(c) + '</div>' +
    '<div class="cname">' + c.name + '</div>' + cardBody(c, true) +
    '<div class="bar"><button class="btn" data-act="setm" data-id="' + c.id + '" data-v="unsure">헷갈렸다' + (m && m.s === 'unsure' ? ' ✓' : '') +
    '</button><button class="btn" data-act="setm" data-id="' + c.id + '" data-v="know">알았다' + (m && m.s === 'know' ? ' ✓' : '') + '</button></div></div>';
}

function poolFrom(sc, cardsSrc){
  let list = cardsSrc || flat.filter(c => sc.domains.includes(c.dId));
  if(sc.warn) list = list.filter(c => c.warn);
  if(sc.exam) list = list.filter(c => c.exam);
  return list;
}
function vScope(p){
  $ttl.textContent = '랜덤 뽑기';
  const n = poolFrom(scope).length;
  let h = '<h3 style="margin:0">영역</h3><div class="chips">' + DB.domains.map(d => {
    const has = domCards(d.id).length > 0;
    return '<button class="chip' + (scope.domains.includes(d.id) ? ' on' : '') + (has ? '' : ' dis') + '" data-act="tdom" data-id="' + d.id + '"' + (has ? '' : ' disabled') + '>' + d.label + (has ? '' : ' (준비 중)') + '</button>';
  }).join('') + '</div><h3 style="margin:0">조건</h3><div class="chips">' +
    '<button class="chip' + (scope.warn ? ' on' : '') + '" data-act="tflag" data-f="warn">책별 차이 있는 카드만</button>' +
    '<button class="chip' + (scope.exam ? ' on' : '') + '" data-act="tflag" data-f="exam">기출 표시 카드만</button>' +
    '<button class="chip' + (scope.unsure ? ' on' : '') + '" data-act="tflag" data-f="unsure">헷갈린 카드 더 자주</button></div>' +
    '<p class="count">뽑을 수 있는 카드 ' + n + '개' + (scope.domains.length > 1 ? ' · 영역은 골고루 뽑힙니다' : '') + '</p>' +
    '<button class="btn solid big" data-act="start"' + (n ? '' : ' disabled') + '>뽑기 시작</button>';
  if(p && p.note) h = '<p class="count">' + p.note + '</p>' + h;
  return h;
}

function pick(){
  const pool = draw.pool.map(id => byId[id]);
  let cand = pool.length > 1 ? pool.filter(c => c.id !== draw.cur) : pool;
  const groups = {}; cand.forEach(c => (groups[c.dId] = groups[c.dId] || []).push(c));
  const keys = Object.keys(groups), g = groups[keys[Math.floor(Math.random() * keys.length)]];
  const w = g.map(c => { const m = mastery[c.id]; return !m ? 2 : (m.s === 'unsure' ? (scope.unsure ? 4 : 1) : 1); });
  let r = Math.random() * w.reduce((a, b) => a + b, 0), i = 0;
  while(i < g.length - 1 && r >= w[i]){ r -= w[i]; i++; }
  draw.cur = g[i].id; draw.shown = false;
}
function vDraw(){
  $ttl.textContent = '랜덤 뽑기';
  if(!draw || !draw.cur) return '<p class="empty">뽑을 카드가 없습니다.</p>';
  const c = byId[draw.cur];
  let h = '<div data-d="' + c.dId + '"><div class="meta"><span class="pill">' + c.dLabel + '</span>' + (c.warn ? '<span class="tag">책별 차이</span>' : '') +
    '<span style="margin-left:auto">' + draw.done + '번째</span></div><div class="cname">' + c.name + '</div>';
  if(!draw.shown){
    h += '<p class="hide">먼저 떠올려 보세요.</p><button class="btn solid big" data-act="reveal">정답 보기</button>';
  } else {
    h += cardBody(c, false) + '<div class="bar"><button class="btn" data-act="mark" data-v="unsure">헷갈렸다</button><button class="btn" data-act="mark" data-v="know">알았다</button></div>';
  }
  return h + '</div>';
}

function render(){
  const t = stack[stack.length - 1];
  const fn = {home:vHome, domain:vDomain, card:vCard, scope:vScope, draw:vDraw}[t.v];
  $main.innerHTML = fn(t);
  const isHome = stack.length === 1;
  $back.textContent = isHome ? '‹ 과목 선택' : '‹ 뒤로';
  $back.setAttribute('href', isHome ? 'index.html' : '#');
}
$back.addEventListener('click', e => { if(stack.length > 1){ e.preventDefault(); back(); } });

function startDraw(list, fromScope){
  if(!list.length) return;
  draw = {pool:list.map(c => c.id), cur:null, shown:false, done:1};
  pick();
  stack = fromScope ? stack.filter(s => s.v !== 'scope') : stack;
  go('draw');
}
$main.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if(!t) return;
  const a = t.dataset.act, D = t.dataset;
  if(a === 'domain'){ if(domCards(D.id).length) go('domain', {id:D.id}); }
  else if(a === 'card') go('card', {id:D.id});
  else if(a === 'drawscope'){ if(D.id) scope.domains = [D.id]; save(LS_S, scope); go('scope'); }
  else if(a === 'drawsec'){
    const s = DB.domains.find(x => x.id === D.d).sections[+D.s];
    const list = poolFrom(scope, s.cards.map(c => byId[c.id]));
    if(list.length) startDraw(list, false);
    else { stack.push({v:'scope', note:'이 장에는 현재 조건에 맞는 카드가 없습니다. 조건을 바꿔 보세요.'}); render(); }
  }
  else if(a === 'tdom'){ const i = scope.domains.indexOf(D.id); if(i >= 0){ if(scope.domains.length > 1) scope.domains.splice(i,1); } else scope.domains.push(D.id); save(LS_S, scope); render(); }
  else if(a === 'tflag'){ scope[D.f] = !scope[D.f]; save(LS_S, scope); render(); }
  else if(a === 'start') startDraw(poolFrom(scope), true);
  else if(a === 'reveal'){ draw.shown = true; render(); }
  else if(a === 'mark'){
    const prev = mastery[draw.cur] || {n:0};
    mastery[draw.cur] = {s:D.v, n:prev.n + 1, t:Date.now()}; save(LS_M, mastery);
    draw.done++; pick(); render(); window.scrollTo(0,0);
  }
  else if(a === 'setm'){ const prev = mastery[D.id] || {n:0}; mastery[D.id] = {s:D.v, n:prev.n + 1, t:Date.now()}; save(LS_M, mastery); render(); }
  else if(a === 'reset'){ if(confirm('알았다/헷갈렸다 기록을 모두 지울까요?')){ mastery = {}; save(LS_M, mastery); render(); } }
});
render();
</script>
</body>
</html>
