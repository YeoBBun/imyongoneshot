\"mn-table\">\n<tr><th>방법</th><th>검사지/횟수</th><th>내용</th><th>장점</th><th>단점</th></tr>\n<tr><td>재검사 신뢰도</td><td>1장/2회</td><td>같은 검사를 시간 간격을 두고 두 번 실시, 상관계수 계산</td><td>간단·직관적, 문항 차이로 인한 오류 없음</td><td>시간간격이 신뢰도에 영향, 기억효과로 왜곡 가능</td></tr>\n<tr><td>동형검사 신뢰도</td><td>2장/2회</td><td>내용은 다르지만 동일 능력을 측정하는 두 검사를 같은 집단에 실시</td><td>시간간격 영향 최소화, 기억·연습효과 최소화</td><td>동형검사 제작이 매우 어려움(거의 안 씀)</td></tr>\n<tr><td>반분검사 신뢰도</td><td>1장/1회</td><td>한 검사를 두 부분(예: 홀/짝수 문항)으로 나눠 상관계수 계산</td><td>한 번의 검사로 가능(비용·시간 절감)</td><td>난이도가 한쪽에 몰리면 신뢰도 저하, 문항 수 적으면 저하</td></tr>\n<tr><td><strong>문항내적 합치도</strong></td><td>1장/1회</td><td>문항 각각을 독립된 검사로 보고 합치성·동질성을 종합(크론바흐 알파 계수 사용, 보통 0.7 이상이 적절)</td><td>한 번으로 가능, 반분검사와 달리 문항 쏠림 문제 없음</td><td>모든 문항이 동일 능력을 측정하도록 만들기 어려움</td></tr>\n<tr><td>(측정의 표준오차)</td><td>—</td><td>지능·성적 등 단일 대상을 같은 도구로 반복해 개인 내 일관성을 보는 방법</td><td>—</td><td>—</td></tr>\n</table></div>\n<div class=\"mn-block\"><h4>신뢰도에 영향을 주는 요인 및 높이는 방법 (6)</h4><p>검사 길이 증가(문항 수 늘림) / 반응점수 범위 확대(선택지 수 증가) / 학습내용 골고루 출제 / 문항난이도 적절(50% 유지) / 이질집단(동질집단보다 신뢰도 높음) / 검사시간 충분히 부여</p></div>\n<div class=\"mn-block\"><h4>타당도와 신뢰도의 관계</h4><p>타당도가 높으면 신뢰도도 높지만, 신뢰도가 높다고 타당도가 높은 것은 아님 (신뢰도는 타당도의 <strong>필요조건</strong>이지 충분조건이 아니며, 타당도는 신뢰도의 충분조건).</p></div>\n<div class=\"mn-tip\">💡 흔한 비유: 과녁에 총알이 몰려 있으면(신뢰도 높음) 그것이 반드시 과녁 중심(타당도)에 있는 것은 아니지만, 총알이 과녁 중심에 정확히 모여 있다면(타당도 높음) 당연히 몰려도 있는 것(신뢰도도 높음)입니다.</div>"},{"id":"eval-25","name":"객관도","items":[{"text":"정의","children":[]},{"text":"종류(채점자 내/채점자 간 신뢰도)","children":[]},{"text":"높이는 방법","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>기본개념</h4><p>채점자가 채점을 얼마나 일관성 있게 하였는지의 정도. (채점자의 일관성)</p></div>\n<div class=\"mn-block\"><h4>객관도 종류 (2)</h4><p>채점자 내 신뢰도(한 채점자가 계속 일관되게 측정했는가) / 채점자 간 신뢰도(여러 채점자가 얼마나 유사하게 평가했는가)</p></div>\n<div class=\"mn-block\"><h4>객관도를 높이는 방법 (4)</h4><p>모범답안·루브릭 제시 / 개인정보 숨기기 / 문항 단위 채점(학생 단위 X) / 여러 사람이 채점 후 평균</p></div>"},{"id":"eval-26","name":"실용도","items":[{"text":"정의","children":[]},{"text":"조건","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>기본개념</h4><p>검사 도구가 채점에서 비용·시간·노력 등을 적게 들이고도 목적을 얼마나 달성하는지의 정도. (측정도구의 경제성)<br><strong>조건 (2)</strong>: 채점 방법·결과 해석·활용이 모두 쉬워야 함 / 비용·시간·노력이 절약되어야 함</p></div>"}]},{"title":"6. 평가문항의 분석","theories":[{"id":"eval-27","name":"문항난이도","items":[{"text":"정의 및 공식","children":[]},{"text":"해석방법(이상적인 수치)","children":[]},{"text":"문항특성곡선의 의미","children":[]},{"text":"활용법","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>기본개념</h4><p>한 문항의 어렵고 쉬움의 정도를 지수로 나타낸 것.<br><strong>공식</strong>: P = (정답자 수 / 총 응시자 수) × 100(%)<br><strong>해석방법</strong>: P는 0~100% 범위. <strong>P가 높을수록 쉬운 문항</strong>. 30~70%면 양호하고 <strong>50%일 때 최대 변별이 가능</strong>해 가장 이상적.<br><strong>문항특성곡선</strong>: 정답반응확률 0.5일 때의 능력수준 값이 기준. 곡선이 오른쪽에 위치할수록 어려운 문항.<br><strong>활용법</strong>: 난이도 50%인 문항을 많이 사용 / 쉬운 문항→어려운 문항 순으로 배열 / 난이도가 너무 높은(어려운) 문항은 능력이 낮은 학생에게 주면 동기저하가 아니라 오히려 낮은 난이도 문항으로 성취감을 주는 방식으로 활용</p></div>"},{"id":"eval-28","name":"문항변별도","items":[{"text":"정의 및 공식","children":[]},{"text":"해석방법(이상적인 수치)","children":[]},{"text":"난이도와 변별도의 관계","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>기본개념</h4><p>한 문항이 피험자의 능력을 변별하는 정도를 지수로 나타낸 것.<br><strong>공식</strong>: DI = (상위집단 중 정답자 수 − 하위집단 중 정답자 수) / (집단 인원수의 절반)<br><strong>해석방법</strong>: DI는 −1~+1 범위. <strong>+1에 가까울수록 바람직</strong>(상위집단 전원 정답, 하위집단 전원 오답일 때 최대). 0이면 변별력 없음. <strong>난이도가 50%일 때 변별도가 +1에 가까워짐</strong>(둘은 서로 연동됨).<br><strong>활용법</strong>: 변별도는 최소 0.2 이상, 0.3 이상이면 만족스러운 수준.</p></div>"},{"id":"eval-29","name":"문항추측도","items":[{"text":"정의","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>기본개념</h4><p>능력이 없는 학생이 추측(찍기)으로 문항의 답을 맞힐 수 있는 확률. 값이 클수록 좋지 않은 문항.</p></div>"},{"id":"eval-30","name":"문항반응분포","items":[{"text":"정의","children":[]},{"text":"해석방법(이상적인 반응 분포)","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>기본개념</h4><p>문항 속 답지 하나하나에 학생들이 어떻게 반응했는지 분석 — 오답의 매력도, 정답의 제 역할 여부를 확인.<br><strong>해석방법</strong>: 정답지에 50%가 반응하고 나머지 50%가 오답지에 골고루 분산될 때가 가장 바람직. 정답지에는 하위집단보다 <strong>상위집단</strong> 학생이 더 많이 반응해야 이상적.</p></div>"}]},{"title":"7. 교육연구","theories":[{"id":"eval-31","name":"양적연구와 질적연구","items":[{"text":"정의 및 초점의 차이","children":[]},{"text":"양적연구의 종류(실험·준실험·상관연구)","children":[]},{"text":"질적연구의 종류(내러티브·현상학적·사례·문화기술지 연구)","children":[]},{"text":"장단점 비교","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>교육연구</h4><p>란 과학적 방법으로 교육현상에 대해 정확하고 신뢰할 만한 정보를 얻으려는 활동이며, 목적은 교육 현상의 예측·통제·개선에 있습니다. 크게 <strong>양적연구</strong>와 <strong>질적연구</strong>로 나뉩니다.</p></div>\n<div class=\"mn-table-wrap\"><table class=\"mn-table\">\n<tr><th>구분</th><th>양적연구</th><th>질적연구</th></tr>\n<tr><td>초점</td><td>객관적 측정·통계분석으로 수치화·일반화</td><td>인간 행동·경험을 주관적 관점에서 이해·해석</td></tr>\n<tr><td>특징</td><td>객관성, 수량화, 일반화, 연역적 사고</td><td>주관성, 비수량화, 맥락 중시</td></tr>\n<tr><td>종류</td><td>실험연구(인과관계 규명) / 준실험연구(독립변인 조작이 어려운 상황) / 상관연구(변인 간 관계 규명)</td><td>내러티브 연구(개인의 경험) / 현상학적 연구(사건에 부여한 의미) / 사례연구(특정 사례 집중 분석) / 문화기술지 연구(집단 문화 기술)</td></tr>\n<tr><td>장점</td><td>객관성, 일반화 가능성</td><td>심층적 이해, 맥락 고려</td></tr>\n<tr><td>단점</td><td>맥락 무시 가능, 응답 편향</td><td>주관성, 일반화 어려움</td></tr>\n</table></div>"},{"id":"eval-32","name":"표집","items":[{"text":"정의","children":[]},{"text":"확률적 표집의 종류","children":[{"text":"단순무선표집","children":[]},{"text":"체계적표집","children":[]},{"text":"유층표집","children":[]},{"text":"군집표집","children":[]}]},{"text":"비확률적 표집의 종류","children":[{"text":"의도적표집","children":[]},{"text":"우연적표집","children":[]},{"text":"눈덩이표집","children":[]}]}],"explainHtml":"<div class=\"mn-block\"><h4>표집(Sampling)</h4><p>모집단의 특성을 잘 반영하는 표본을 뽑는 것. 표집 크기가 클수록, 무선(Random) 표집에 가까울수록 신뢰도·대표성이 높아짐.<br>- <strong>확률적 표집</strong>(모집단 개별요소가 뽑힐 확률이 동일하도록 설계): 단순무선표집(무작위) / 체계적표집(일정 간격 추출) / 유층표집(동질적 하위집단으로 나눠 무선추출) / 군집표집(자연발생적 이질적 하위집단에서 무선추출)<br>- <strong>비확률적 표집</strong>(연구자의 주관적 판단으로 추출): 의도적표집 / 우연적표집(길거리 인터뷰 등) / 눈덩이표집(연속 소개받으며 추출)</p></div>"},{"id":"eval-33","name":"실험연구","items":[{"text":"정의","children":[]},{"text":"내적타당도의 저해요인","children":[]},{"text":"외적타당도의 저해요인","children":[]},{"text":"내적타당도와 외적타당도의 차이","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>실험연구</h4><p>통제된 상황에서 독립변인을 인위적으로 조작해 종속변인에 미치는 영향을 분석하는 방법.<br>- <strong>내적타당도</strong>(독립변인이 순수하게 종속변인에 미치는 정도)의 저해요인: 역사(우발적 사건), 성숙, 검사경험, 측정도구 변화, 피험자 중도탈락, 통계적 회귀, 선발-성숙 상호작용 — 이를 통제하려면 무선화, 가외변인의 통제/동일수준 유지 등이 필요<br>- <strong>외적타당도</strong>(결과를 다른 상황에 일반화할 수 있는 정도)의 저해요인: 검사-처치 상호작용, 피험자선정-처치 상호작용, 실험상황에 대한 반발효과, 중다처치 간섭(이월)효과</p></div>"},{"id":"eval-34","name":"자료수집 방법","items":[{"text":"의미분석법","children":[]},{"text":"투사법","children":[]},{"text":"메타분석법","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>자료수집 방법</h4><p>의미분석법(오스굿 개발, 개념의 심리적 의미를 3차원 의미공간에 표시·비교) / 투사법(머레이&amp;모건 개발, 모호한 그림에 대한 반응으로 내면 파악, 예: 주제통각검사 TAT) / 메타분석법(기존 연구결과들을 종합적으로 재분석)</p></div>"},{"id":"eval-35","name":"가설의 검증","items":[{"text":"영가설과 대립가설의 정의","children":[]},{"text":"변량분석(분산분석)의 정의 및 활용조건","children":[]},{"text":"변량분석의 종류(일원·이원·공변량분석)","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>가설의 검증</h4><p>가설은 변인 간 관계에 대한 잠정적 결론. <strong>영가설</strong>(차이가 없다고 가정) vs <strong>대립가설</strong>(영가설과 반대). 검증방법으로 <strong>변량분석(분산분석, ANOVA)</strong>을 사용해 두 집단 이상의 평균치 차이가 유의한지 검증(종속변인이 정규분포를 따를 때 사용). 종류: 일원분산분석(독립변인 1개) / 이원분산분석(독립변인 2개) / 공변량분석(집단이 동질적이지 않을 때 표집조건을 동질화해 검증).</p></div>"}]}]},{"id":"admin","label":"교육행정 및 경영","sections":[{"title":"1. 교육행정의 이해","theories":[{"id":"admin-1","name":"교육행정의 개념","items":[{"text":"정의","children":[]},{"text":"개념의 종류","children":[{"text":"국가공권설","children":[]},{"text":"조건정비설","children":[]},{"text":"행동행위설","children":[]},{"text":"행정과정설","children":[]},{"text":"사회과정설","children":[]},{"text":"교육지도성설","children":[]}]},{"text":"조건정비설과 행동행위설의 관점 차이","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>기본개념</h4><p>교육행정이란 교육에서 국가 및 지역사회의 교육적 목표를 효과적으로 달성하는 데 필요한 모든 인적·물적 자원을 제공하는 활동. 개념의 종류는 “행정의 역할을 무엇으로 보느냐”에 따라 달라짐.</p></div>\n<h4>종류 (6)</h4>\n<div class=\"mn-table-wrap\"><table class=\"mn-table\">\n<tr><th>종류</th><th>관점</th></tr>\n<tr><td>국가공권설(국가통치권설)</td><td>교육행정을 행정의 하위영역으로 봄(<strong>행정 우위</strong>). 중앙집권적·관료적, 법규로 교육활동을 감독·통제</td></tr>\n<tr><td><strong>조건정비설</strong>(기능주의설)</td><td>교육행정을 교육목적 달성에 필요한 인적·물적·재정적 조건을 지원하는 수단적 활동으로 봄(<strong>교육 우위</strong>). 민주적·지방분권적</td></tr>\n<tr><td><strong>행동행위설</strong>(행정행위설, 경영설)</td><td>교육과 행정을 분리하지 않고 하나로 통합된 것으로 봄(<strong>행정=교육</strong>). 협동적 행위로 정의</td></tr>\n<tr><td>행정과정설</td><td>행정이 이루어지는 순환적 경로(과정)로 봄. (뒤에 나오는 행정관리론과 동일 맥락)</td></tr>\n<tr><td>사회과정설</td><td>교육행정을 하나의 사회적 과정으로 봄</td></tr>\n<tr><td>교육지도성설</td><td>교육 목적을 효과적으로 달성하기 위해 지도성을 발휘하는 것으로 봄</td></tr>\n</table></div>"},{"id":"admin-2","name":"교육행정의 원리","items":[{"text":"정의(법규 측면과 운영 측면의 구분)","children":[]},{"text":"법규 측면의 원리","children":[{"text":"합법성의 원리","children":[]},{"text":"기회균등의 원리","children":[]},{"text":"자주성의 원리","children":[]},{"text":"지방분권의 원리","children":[]}]},{"text":"운영 측면의 원리","children":[{"text":"민주성의 원리","children":[]},{"text":"효율성의 원리","children":[]},{"text":"안정성의 원리","children":[]},{"text":"전문성 보장의 원리","children":[]},{"text":"적응성의 원리","children":[]}]}],"explainHtml":"<div class=\"mn-block\"><h4>기본개념</h4><p>교육행정을 효율적으로 수행하기 위한 기본 지침. <strong>법규 측면</strong>(법에서 추출된 원리)과 <strong>운영 측면</strong>(실제 운영에 필요한 원리)으로 구분.</p></div>\n<h4>법규 측면의 원리 (4)</h4>\n<div class=\"mn-table-wrap\"><table class=\"mn-table\">\n<tr><th>원리</th><th>내용</th></tr>\n<tr><td>합법성의 원리</td><td>모든 교육행정은 법이 정한 범위 내에서 이루어져야 함(행정재량권 남용 방지, 교원 신분 보장의 근거)</td></tr>\n<tr><td>기회균등의 원리</td><td>모든 국민이 교육 기회를 균등하게 누릴 수 있어야 함(예: 무상 의무교육, 장학금)</td></tr>\n<tr><td>자주성의 원리</td><td>교육은 정치·종교로부터 중립성을 지켜야 하며, 일반 행정으로부터 분리 운영되어야 함(<strong>교육자치제도의 근거</strong>)</td></tr>\n<tr><td>지방분권의 원리</td><td>지역의 특수성·다양성을 반영해 지역주민의 참여와 통제를 기반으로 시행</td></tr>\n</table></div>\n<h4>운영 측면의 원리 (5)</h4>\n<div class=\"mn-table-wrap\"><table class=\"mn-table\">\n<tr><th>원리</th><th>내용</th></tr>\n<tr><td>민주성의 원리</td><td>독단과 편견을 배제하고 국민의 의사를 반영(예: 각종 위원회 설치)</td></tr>\n<tr><td>효율성의 원리</td><td>최소 노력·경비로 최대 성과(예: 학교·학급 ’경영’이라는 용어 사용)</td></tr>\n<tr><td>안정성의 원리</td><td>교육정책은 장기적으로 계속성·일관성 유지(빈번한 개편 지양)</td></tr>\n<tr><td>전문성 보장의 원리</td><td>전문 지식·기술을 갖춘 전문가가 담당(예: 교장·교감의 자격 요건)</td></tr>\n<tr><td>적응성의 원리</td><td>새로운 환경 변화에 신축적으로 대응</td></tr>\n</table></div>"}]},{"title":"2. 교육행정의 발달과정","theories":[{"id":"admin-3","name":"과학적 관리론","items":[{"text":"등장배경","children":[]},{"text":"정의","children":[]},{"text":"교육에의 적용방법(보비트)","children":[]},{"text":"장점","children":[]},{"text":"문제점","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>등장배경</h4><p>산업혁명으로 대규모 공장이 생기며 노동자의 업무가 단순·반복화되어 태업(불성실한 업무 수행)과 생산성 저하가 발생 → 프레더릭 테일러(Taylor)가 제안. <em>교육학자 보비트가 이 이론을 교육에 도입하면서 [학교-학생-커리큘럼-사회]를 [공장-원자재-생산라인-소비자]에 비유했습니다 — 원자재(학생)가 공장(학교)에서 생산라인(커리큘럼)을 거쳐 사회가 원하는 완제품으로 만들어진다는 발상입니다. (교육과정 파트의 ’보비트의 교육과정 과학화 모형’과 같은 뿌리)</em></p></div>\n<div class=\"mn-block\"><h4>기본개념</h4><p>인간을 수동적인 존재로 인식해 노동자의 작업과정을 표준화하고 과학적으로 관리하면 조직의 능률과 생산성을 극대화할 수 있다는 이론.</p></div>\n<div class=\"mn-block\"><h4>교육에 적용방법 (4, by 보비트)</h4><p>교사는 가르치는 일에만 전념하고 행정은 별도 행정가가 담당 / 모든 시간에 모든 시설을 최대 활용 / 교직원의 작업능률을 최대화하고 인원은 최소화 / 교육활동 중 낭비 최대한 제거</p></div>\n<div class=\"mn-block\"><h4>장점 (3)</h4><p>교육의 효율성 향상(낭비 감소) / 구성원의 동기 유발(성과급 차등) / 교사의 전문성 향상(업무 표준화)<br><strong>문제점 (3)</strong>: 교육의 발전 저하(자율성 제한) / 교육 만족도 저하(자율성·창의성 제한) / 개인의 개성 상실(규격화)</p></div>"},{"id":"admin-4","name":"행정관리론","items":[{"text":"정의","children":[]},{"text":"패욜의 학교 하위체제 분류","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>기본개념</h4><p>행정가의 작업과정을 표준화하여 과학적으로 관리하면 조직의 능률과 생산성을 극대화할 수 있다는 이론. 과학적 관리론이 노동자의 직무분석에 초점을 뒀다면, 행정관리론은 조직 전체의 관리도 함께 중시. 패욜은 학교의 하위체제를 기획-조직-명령-조정-통제 체제로 분류.</p></div>\n<div class=\"mn-tip\">💡 과학적 관리론을 “공장”에, 관료제론을 “주민센터”에 비유하면 두 이론의 이미지가 쉽게 구분됩니다. 둘 다 능률·효율성·합리성을 강조한다는 공통점이 있어 장단점도 동일하게 활용 가능합니다.</div>"},{"id":"admin-5","name":"관료제론","items":[{"text":"정의","children":[]},{"text":"특징(5가지)","children":[{"text":"권위의 위계화","children":[]},{"text":"분업과 전문화","children":[]},{"text":"규칙과 규정 강조","children":[]},{"text":"경력지향성","children":[]},{"text":"몰인정성","children":[]}]}],"explainHtml":"<div class=\"mn-block\"><h4>기본개념</h4><p>조직의 형태·구조에 관심을 두고 최소의 인적·물적 자원으로 조직의 목적을 달성하고자 하는 이론.</p></div>\n<div class=\"mn-block\"><h4>특징 (5)</h4><p>권위의 위계화(명확한 위계) / 분업과 전문화 / 규칙과 규정 강조(일관된 통제) / 경력 지향성(직무경력 중시) / 몰인정성(감정·편견 없이 업무 수행)</p></div>\n<div class=\"mn-block\"><h4>장점/문제점</h4><p>과학적 관리론과 동일</p></div>"},{"id":"admin-6","name":"인간관계론","items":[{"text":"등장배경(호손실험)","children":[]},{"text":"호손효과의 개념","children":[]},{"text":"정의","children":[]},{"text":"특징 및 시사점","children":[{"text":"인간의 사회적 동물성","children":[]},{"text":"비공식 조직의 중요성","children":[]}]},{"text":"한계","children":[]},{"text":"과학적 관리론과의 공통점","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>등장배경</h4><p>과학적 관리론이 노동자의 능률·획일성만 강조하고 자율성·창의성을 제한한다는 비판 → 노동조합 결성 등 시대적 변화 속에서 등장. 메이요(Mayo)와 뢰슬리스버거(Roethlisberger)의 <strong>호손실험</strong>(1924~1932, 호손 공장에서 8년간 노동조건 변화와 생산성의 관계를 조사)이 결정적 계기.</p></div>\n<div class=\"mn-tip\">💡 호손실험의 핵심 발견: 노동환경(임금·작업시간 등)을 원래대로 되돌렸는데도 생산능률이 낮아지지 않았습니다. 원인은 ’연구자의 관찰’이었습니다 — 근로자들이 관찰당하고 있다는 것을 의식해 근무환경이 나빠져도 높은 생산성을 유지한 것입니다. 이 발견에서 나온 것이 <strong>호손효과</strong>(다른 사람의 시선을 인식할 때 본래 의도·천성과 다르게 행동하는 현상, 예: 공개수업에서 학생들이 평소보다 발표를 열심히 함)입니다.</div>\n<div class=\"mn-block\"><h4>기본개념</h4><p>인간을 능동적인 존재로 인식해 경제적 보상보다 정서적·사회적·심리적 측면을 중시하면 조직의 능률과 생산성을 극대화할 수 있다는 이론.</p></div>\n<div class=\"mn-block\"><h4>특징·장점·시사점 (2)</h4><p>1. 인간은 사회적 동물 — 직무동기는 경제적 보상보다 소속·인정 욕구에서 생김 (실제 적용: 의견 수렴, 의사결정 참여, 배려·존중)<br>2. <strong>비공식 조직</strong>은 생산성에 중요한 영향을 미침 (실제 적용: 관리자와 비공식 조직 간 관계 개선)</p></div>\n<div class=\"mn-block\"><h4>한계 (4)</h4><p>경제적 동기를 과소평가 / 공식 조직의 중요성 간과 / 효율성·합리성 간과 / 정의적 측면(태도)을 지나치게 강조<br><strong>과학적 관리론과의 공통점 (2)</strong>: 조직 외부 환경 무시(내부 문제에만 관심) / 조직의 생산성 강조(궁극적 목적)</p></div>"},{"id":"admin-7","name":"행동과학론","items":[{"text":"정의(과학적 관리론과 인간관계론의 통합)","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>기본개념</h4><p>과학적 관리론과 인간관계론의 장점을 통합해 조직의 생산성을 향상하고 구성원도 성취감을 느끼게 하는 이론.</p></div>"},{"id":"admin-8","name":"체제이론","items":[{"text":"정의","children":[]},{"text":"체제이론의 기본가정","children":[]},{"text":"개방체제의 정의","children":[]},{"text":"학교 개방체제의 특징","children":[]}],"explainHtml":"<div class=\"mn-table-wrap\"><table class=\"mn-table\">\n<tr><th>모형</th><th>핵심 내용</th></tr>\n<tr><td><strong>카우프만</strong>의 체제접근 모형</td><td>조직 문제 개선을 위한 <strong>5단계</strong>: ①문제확인(요구분석) ②대안결정(MBO 활용) ③해결전략 선정(PPBS 활용) ④해결전략 시행(PERT 활용) ⑤성취효과 확인(성과평가)</td></tr>\n<tr><td><strong>브루코버</strong>의 사회체제접근 모형(미시적 모형)</td><td>교사의 기대·평가와 그에 대한 학생의 지각 등으로 측정한 학교의 사회·심리적 풍토가 학업격차에 영향을 준다는 이론. <strong>효과적인 학교</strong>란 학습기회·지원·환경·교사기대를 동등하게 제공하고 투입변인(인적배경·물리적환경)과 과정변인(조직구조·프로그램·학습풍토)으로 높은 성취를 산출하는 학교</td></tr>\n<tr><td><strong>겟젤스와 구바</strong>의 사회과정 모형</td><td>인간의 사회적 행동은 조직의 <strong>규범적 차원</strong>(제도·역할·역할기대)과 개인의 <strong>심리적 차원</strong>(개인·인성·욕구성향)의 상호작용 결과. 학교는 위기 시에는 역할을, 안정기에는 인성을 더 강조</td></tr>\n<tr><td><strong>겟젤스와 셀렌</strong>의 사회과정모형(수정모형)</td><td>구바 모형이 두 차원만 다룬다는 비판을 보완해 인류학적·조직풍토·생물학적 차원을 추가(5차원). 개인의 행동이 사회적 행동으로 나타나기 위한 <strong>구성원의 사기 진작 요인(3)</strong>: 합리성(역할기대=사회적 가치 일치), 일체감(개인욕구=조직목표 일치), 소속감(역할기대=개인욕구 일치)</td></tr>\n</table></div>"},{"id":"admin-9","name":"체제이론의 하위 모형","items":[{"text":"카우프만의 체제접근 모형(5단계)","children":[]},{"text":"브루코버의 사회체제접근 모형","children":[{"text":"효과적인 학교의 정의","children":[]}]},{"text":"겟젤스와 구바의 사회과정 모형","children":[{"text":"규범적 차원과 심리적 차원","children":[]}]},{"text":"겟젤스와 셀렌의 사회과정모형(수정모형)","children":[{"text":"추가된 차원","children":[]},{"text":"구성원의 사기 진작 요인(합리성·일체감·소속감)","children":[]}]}],"explainHtml":"<div class=\"mn-table-wrap\"><table class=\"mn-table\">\n<tr><th>모형</th><th>핵심 내용</th></tr>\n<tr><td><strong>카우프만</strong>의 체제접근 모형</td><td>조직 문제 개선을 위한 <strong>5단계</strong>: ①문제확인(요구분석) ②대안결정(MBO 활용) ③해결전략 선정(PPBS 활용) ④해결전략 시행(PERT 활용) ⑤성취효과 확인(성과평가)</td></tr>\n<tr><td><strong>브루코버</strong>의 사회체제접근 모형(미시적 모형)</td><td>교사의 기대·평가와 그에 대한 학생의 지각 등으로 측정한 학교의 사회·심리적 풍토가 학업격차에 영향을 준다는 이론. <strong>효과적인 학교</strong>란 학습기회·지원·환경·교사기대를 동등하게 제공하고 투입변인(인적배경·물리적환경)과 과정변인(조직구조·프로그램·학습풍토)으로 높은 성취를 산출하는 학교</td></tr>\n<tr><td><strong>겟젤스와 구바</strong>의 사회과정 모형</td><td>인간의 사회적 행동은 조직의 <strong>규범적 차원</strong>(제도·역할·역할기대)과 개인의 <strong>심리적 차원</strong>(개인·인성·욕구성향)의 상호작용 결과. 학교는 위기 시에는 역할을, 안정기에는 인성을 더 강조</td></tr>\n<tr><td><strong>겟젤스와 셀렌</strong>의 사회과정모형(수정모형)</td><td>구바 모형이 두 차원만 다룬다는 비판을 보완해 인류학적·조직풍토·생물학적 차원을 추가(5차원). 개인의 행동이 사회적 행동으로 나타나기 위한 <strong>구성원의 사기 진작 요인(3)</strong>: 합리성(역할기대=사회적 가치 일치), 일체감(개인욕구=조직목표 일치), 소속감(역할기대=개인욕구 일치)</td></tr>\n</table></div>"}]},{"title":"3. 동기이론","theories":[{"id":"admin-10","name":"허즈버그의 동기-위생이론(2요인 이론)","items":[{"text":"등장배경 및 매슬로우와의 초점 차이","children":[]},{"text":"정의","children":[]},{"text":"동기요인과 위생요인의 구분","children":[{"text":"정의","children":[]},{"text":"예시","children":[]},{"text":"충족/미충족 시 효과","children":[]}]},{"text":"직무풍요화의 개념 및 방법","children":[]},{"text":"시사점","children":[]},{"text":"비판점","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>등장배경</h4><p>산업심리학자 허즈버그(1923~2000)가 1966년 발표.</p></div>\n<div class=\"mn-block\"><h4>배경</h4><p>매슬로우와 허즈버그 모두 동기유발을 탐색했다는 공통점이 있지만, 매슬로우는 <strong>개인 내부</strong>에, 허즈버그는 <strong>직무환경</strong>에 초점을 둠.</p></div>\n<div class=\"mn-block\"><h4>기본개념</h4><p>작업 태도·행동을 동기추구자와 위생추구자로 구분. 인간에게 만족요인(동기요인)과 불만족요인(위생요인)이 동시에 존재한다고 봐서 <strong>2요인이론</strong>이라고도 부름.</p></div>\n<h4>요인 구분</h4>\n<div class=\"mn-table-wrap\"><table class=\"mn-table\">\n<tr><th>요인</th><th>정의</th><th>예</th><th>특징</th></tr>\n<tr><td><strong>동기요인</strong>(만족요인, 내적요인)</td><td>직무 그 자체에서 주어지는 것</td><td>성장, 책임감, 인정, 성취감, 승진</td><td>충족 안 돼도 불만은 없으나, 충족되면 높은 만족감·적극적 태도</td></tr>\n<tr><td><strong>위생요인</strong>(불만족요인, 외적요인)</td><td>직무 환경과 관련된 것</td><td>봉급, 인간관계, 근무조건, 직업 안정성</td><td>충족 안 되면 불만족, <strong>충족돼도 동기가 향상되거나 생산능력이 늘지는 않음</strong></td></tr>\n</table></div>\n<div class=\"mn-tip\">💡 위생요인을 아무리 개선해도(예: 갈등 부서원을 다른 부서로 옮김) 불편함만 사라질 뿐 생산성·동기가 향상되지는 않는다는 것이 핵심입니다. 동기 향상을 위해서는 위생요인 제거와 <strong>별개로</strong> 동기요인(승진·인정 등)을 반드시 함께 제공해야 합니다.</div>\n<div class=\"mn-block\"><h4>동기향상(직무풍요화) 요인</h4><p>직무풍요화란 직무 수행상의 권한을 대폭 이양하고 자율성·책임감을 부여해 능력을 발휘하며 성장할 기회를 얻도록 직무내용을 재편성하는 것. 방법: 높은 수준의 지식·기술을 요구하는 작업을 직무에 포함 / 자율성·책임을 많이 부여 / 개인능력 발휘 기회 제공. <em>[학교 현장 상식] 수석교사 제도가 직무풍요화의 한 예로 언급됩니다 — 교사의 직무를 수직적으로 확장해 승진 기회를 제공하고 수업 전문성을 우대하는 교직풍토를 조성하는 제도(15년 이상 경력 필요).</em></p></div>\n<div class=\"mn-block\"><h4>시사점</h4><p>불만족요인(위생요인)을 최소화하고 동기요인을 향상시켜야 함<br><strong>비판점 (2)</strong>: 개인에 따라 만족·불만족 요인이 동시에 나타날 수 있음 / 구체적인 동기향상 방안을 제시하지 않음</p></div>"},{"id":"admin-11","name":"브룸의 기대이론","items":[{"text":"기본개념(3요소)","children":[{"text":"성과기대","children":[]},{"text":"보상기대","children":[]},{"text":"유인가","children":[]}]},{"text":"동기부여 방안","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>기본개념 (3)</h4><p>동기는 다음 세 요소가 모두 충족될 때 최대로 촉진됨: ①<strong>성과기대</strong>(expectancy, 노력하면 성과를 이룰 것이라는 기대) ②<strong>보상기대</strong>(instrumentality, 성과에 보상이 따를 것이라는 기대) ③<strong>유인가</strong>(Valence, 그 보상이 자신이 원하는 것/목표의 매력성)</p></div>\n<div class=\"mn-block\"><h4>동기부여 방안 (3)</h4><p>높은 성과기대(노력→성과 믿음 심어주기) / 높은 보상기대(성과→보상 연결을 구체적으로 제시) / 높은 유인가(구성원이 원하는 보상 파악)</p></div>"},{"id":"admin-12","name":"맥그리거의 X-Y 이론","items":[{"text":"정의(X이론과 Y이론)","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>기본개념</h4><p>인간 본성을 부정적으로 보는 X이론(수동적, 책임회피 → 과학적 관리론적 접근)과 긍정적으로 보는 Y이론(능동적, 스스로 책임 → 인간관계론적 접근)으로 나눠 동기를 부여하는 전략.</p></div>"},{"id":"admin-13","name":"아지리스의 미성숙-성숙 이론","items":[{"text":"정의","children":[]},{"text":"조직 유형에 따른 구성원 행동의 차이","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>기본개념</h4><p>인간의 성격은 미성숙 상태(X이론)에서 성숙 상태(Y이론)로 발전한다는 가정 하에, 조직이 이 변화를 어떻게 지원할지를 설명. 통제받는 조직은 수동적·의존적 행동이, 격려·신뢰를 받는 조직은 스스로 성숙한 행동이 나타남. → 관리자는 구성원을 성숙한 인간으로 취급하고 격려·신뢰를 제공해야 함.</p></div>"},{"id":"admin-14","name":"아담스의 공정성 이론","items":[{"text":"정의(투입과 성과의 비교)","children":[]},{"text":"공정성 회복을 위한 행동유형(4가지)","children":[]},{"text":"시사점","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>기본개념</h4><p>한 개인이 다른 사람에 비해 얼마나 공정하게 대우받는지에 초점을 둔 이론(=균형이론, 교환이론). 자신과 타인의 <strong>투입</strong>(지식·경험·경력 등 기여) 대비 <strong>성과</strong>(급여·내적보상·승진 등)를 비교해, 비슷하면 공정성을, 불균등하면 불공정성을 느끼고 공정성 회복을 위한 동기가 발생.</p></div>\n<div class=\"mn-block\"><h4>공정성 회복(불공정성 감소)을 위한 행동유형 (4)</h4><p>투입조정(보상이 적다고 느끼면 노력을 줄임, 많다고 느끼면 늘림) / 성과조정(투입 증가 없이 보상 인상 요구) / 성과의 왜곡(인지적으로 왜곡해 불공정성을 줄임) / 조직이탈(전보 요청, 이직)<br><strong>시사점 (2)</strong>: 학교 경영자는 교사에게 공정한 대우를 해 공정한 학교문화를 구축해야 함 / 조직 안팎의 다른 교사와의 관계까지 고려해야 함</p></div>"},{"id":"admin-15","name":"매슬로우의 욕구위계이론","items":[{"text":"정의","children":[]},{"text":"욕구위계순서(5단계)","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>기본개념</h4><p>인간의 내적 욕구를 동기유발 요인으로 보며, 5가지 위계가 있다고 가정. 기초 동기가 충족되지 않으면 다음 단계 동기는 발생하지 않음.</p></div>\n<div class=\"mn-block\"><h4>욕구위계순서 (5)</h4><p>생리적 욕구(의식주·성욕) → 안전의 욕구(법·질서·자유) → 사회적 욕구(소속감·애정) → 존경의 욕구(승진 등 타인·자기 존중) → 자아실현의 욕구(잠재력 실현, 일의 즐거움)</p></div>"},{"id":"admin-16","name":"알더퍼의 ERG 이론","items":[{"text":"정의(3단계로의 단순화)","children":[]},{"text":"매슬로우와의 차이점","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>기본개념</h4><p>매슬로우의 욕구위계이론을 3단계로 단순화: 생존의 욕구(매슬로우 1·2단계) / 관계의 욕구(2·3·4단계) / 성장의 욕구(4·5단계)</p></div>\n<div class=\"mn-block\"><h4>매슬로우와 알더퍼의 차이점</h4><p>알더퍼는 2가지 욕구가 동시에 작용할 수 있고 퇴행도 가능함 / 하위단계가 충족되지 않아도 상위 욕구가 발생할 수 있음</p></div>"},{"id":"admin-17","name":"로크의 목표설정이론","items":[{"text":"정의","children":[]},{"text":"목표가 지녀야 할 속성(6가지)","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>배경</h4><p>로크에 따르면 인간의 동기는 가치와 목표에 의해 결정.</p></div>\n<div class=\"mn-block\"><h4>기본개념</h4><p>개인이 목표를 어떤 형태로 설정하는가에 따라 동기가 달라짐 — 목표가 구체적·도전적·달성 가능할 때 지속력·집중력 향상.</p></div>\n<div class=\"mn-block\"><h4>목표가 지녀야 할 속성 (6, 스티어스가 구체화)</h4><p>목표의 구체성(모호성 감소) / 목표의 곤란성(적당히 어려운 목표가 도전감 자극) / 목표설정에 참여(직무만족도 향상) / 노력에 대한 피드백 / 목표달성에 대한 동료 간 경쟁(단, 지나친 경쟁은 안 됨) / 목표의 수용성(자발적 수용이 강요보다 나음)</p></div>"}]},{"title":"4. 지도성 이론","theories":[{"id":"admin-18","name":"피들러의 상황 지도성 이론","items":[{"text":"정의","children":[]},{"text":"리더십 유형(관계지향적·과업지향적, LPC 척도)","children":[]},{"text":"상황의 호의성 변인(3가지)","children":[]},{"text":"상황별 효과적인 리더십 유형","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>기본개념</h4><p>피들러는 리더십 유형과 <strong>상황의 호의성</strong> 변인을 고려해 리더의 효과성을 측정. 과업의 성공은 리더십 유형과 상황의 호의성에 따라 달라짐.</p></div>\n<div class=\"mn-block\"><h4>리더십 유형 (2)</h4><p><strong>LPC</strong>(least preferred coworker) 척도(함께 일하기 어려웠던 동료에게 점수를 매기는 방식)로 결정.<br>- 관계지향적 지도자(LPC 점수 높음): 부하에게 배려심 있는 행동, 신뢰관계 중시, 관계를 맺은 후 과업목표에 관심<br>- 과업지향적 지도자(LPC 점수 낮음): 과업목표 달성을 우선시, 규칙·데드라인 중시, 과업을 잘 수행했을 때만 좋은 관계</p></div>\n<div class=\"mn-block\"><h4>상황의 호의성 변인 (3)</h4><p>— “상·중·하”로 점수 부여, 지도자가 집단에 얼마나 영향력을 발휘할 수 있는 상황인지를 의미<br>1. 지도자와 구성원의 관계 — 구성원이 리더를 지지하는 정도<br>2. 과업 구조 — 목표·절차·지침이 명확한 정도<br>3. 지도자의 권력 — 부하에게 보상을 부여할 수 있는 권한 정도</p></div>\n<div class=\"mn-block\"><h4>리더십 유형과 상황관계</h4><p>지도자-구성원 관계가 좋고, 과업구조가 구조화되어 있고, 권력이 강할 때가 가장 유리(이상적이나 현실적으로 어려움). <strong>영향력이 중간 정도</strong>일 때는 <strong>관계지향적</strong> 지도자가, <strong>영향력이 크거나 작을</strong> 때는 <strong>과업지향적</strong> 지도자가 효과적.</p></div>"},{"id":"admin-19","name":"허쉬와 블랜차드의 상황적 지도성","items":[{"text":"정의(과업행동·관계행동·구성원의 성숙도)","children":[]},{"text":"지도성 유형(4가지)","children":[{"text":"지시형","children":[]},{"text":"지도형","children":[]},{"text":"지원형","children":[]},{"text":"위임형","children":[]}]},{"text":"유형별 성숙도와 효과적인 행동","children":[]},{"text":"피들러 이론과의 차이(상황 측정 기준)","children":[]}],"explainHtml":"<div class=\"mn-tip\">💡 피들러와 이름이 비슷해 헷갈리기 쉽지만, 피들러는 상황을 지도자-구성원 관계·과업구조·지도자 권력으로 측정한 반면, 허쉬와 블랜차드는 <strong>구성원의 성숙도</strong>(동기+직무능력)로 측정한다는 차이가 있습니다.</div>\n<div class=\"mn-block\"><h4>기본개념</h4><p>효과적인 리더십은 구성원의 욕구를 얼마나 잘 충족시키느냐에 달려있다는 전제 아래, 지도성 행위를 <strong>과업행동</strong>과 <strong>관계행동</strong>으로 구분하고, <strong>구성원의 성숙도</strong>를 주요 상황 변인으로 삼음.</p></div>\n<h4>지도성 유형 (4)</h4>\n<div class=\"mn-table-wrap\"><table class=\"mn-table\">\n<tr><th>유형</th><th>성숙도</th><th>효과적인 행동</th><th>지도자의 역할</th></tr>\n<tr><td>지시형(M1)</td><td>동기·능력 모두 낮음</td><td>높은 과업행동 + 낮은 관계행동</td><td>역할 규정, 행동 지시</td></tr>\n<tr><td>지도형(설득형)(M2)</td><td>동기 높고 능력 낮음</td><td>높은 과업행동 + 높은 관계행동</td><td>쌍방적 의사소통, 방향 제시·피드백</td></tr>\n<tr><td>지원형(참여형)(M3)</td><td>동기 낮고 능력 높음</td><td>낮은 과업행동 + 높은 관계행동</td><td>의사결정에 참여시킴, 방향제시 불필요</td></tr>\n<tr><td>위임형(M4)</td><td>동기·능력 모두 높음</td><td>낮은 과업행동 + 낮은 관계행동</td><td>과업 위임, 책임·결정권 부여</td></tr>\n</table></div>\n<div class=\"mn-block\"><h4>시사점 (2)</h4><p>지도자와 구성원 간 종합적 분석 제공 / 구성원의 성숙도에 따라 지도성 유형을 달리해야 함</p></div>"},{"id":"admin-20","name":"에반스와 하우스의 행로-목표 이론","items":[{"text":"정의","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>기본개념</h4><p>지도자가 상황적 요인(구성원 특성+환경 특성)을 고려해 목표달성을 위한 적절한 행로(길)를 제시할 때, 그것을 구성원들이 어떻게 지각하느냐에 따라 효과가 달라진다는 이론.</p></div>"},{"id":"admin-21","name":"리더십 대용상황 이론","items":[{"text":"등장배경","children":[]},{"text":"대용상황과 억제상황의 정의 및 예시","children":[]},{"text":"시사점","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>등장배경</h4><p>기존 상황적 리더십 이론의 한계(리더십이 아예 불필요한 경우가 있음)를 보완하기 위해 개발.</p></div>\n<div class=\"mn-block\"><h4>기본개념 (2)</h4><p>지도자의 리더십이 상황에 따라 <strong>대용(대체)</strong>되거나 <strong>억제(제약)</strong>될 수 있다는 이론. 구성원 특성·업무 특성·조직 특성에 따라 구분.<br>- <strong>대용상황</strong>: 리더의 지도가 불필요한 상황 (예: 교사의 경험·능력이 우수한 경우)<br>- <strong>억제상황</strong>: 리더의 지도가 제한·무력화되는 상황 (예: 보상 권력이 없거나 교사들이 보상에 무관심한 경우)</p></div>\n<div class=\"mn-block\"><h4>시사점 (3)</h4><p>능력·만족도·조직 안정성이 좋으면 리더십이 거의 필요 없거나 대체될 수 있음 / 상황에 따라 지도자 행동의 영향력이 다른 이유를 이해할 수 있음 / 학교는 복잡한 조직이라 이분법적 적용에는 무리가 있음</p></div>"},{"id":"admin-22","name":"거래적 지도성","items":[{"text":"정의","children":[]},{"text":"특징","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>기본개념</h4><p>지도자가 구성원들에게 순종을 요구하고 과업 성과에 대한 대가로 <strong>외적 보상</strong>을 제공해 동기를 유발하는 지도성(=교환적 지도성).<br><strong>특징 (2)</strong>: 역할·과업 조건을 명확히 제시해 조직의 효율성·안정성 유지에 도움 / 단기적 목표 달성에만 관심, 구성원의 개인적 성장에는 관심 없음</p></div>"},{"id":"admin-23","name":"변혁적 지도성","items":[{"text":"정의","children":[]},{"text":"특징(4가지)","children":[{"text":"이상적인 영향력","children":[]},{"text":"영감적인 동기부여","children":[]},{"text":"지적 자극","children":[]},{"text":"개별적 배려","children":[]}]},{"text":"한계점","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>기본개념</h4><p>거래적 지도성의 단점을 극복, 구성원의 성장욕구를 자극해 동기화함으로써 태도·신념을 변화시키고 새로운 비전·장기계획으로 개인과 조직의 발전을 함께 추구하는 지도성.</p></div>\n<div class=\"mn-block\"><h4>특징 (4)</h4><p>이상적인 영향력(카리스마, 도덕적 모범으로 존경·신뢰 획득) / 영감적인 동기부여(비전 공유로 기대·도전감) / 지적 자극(창의적 문제해결 격려) / 개별적 배려(개인 성장 욕구에 관심)</p></div>\n<div class=\"mn-block\"><h4>한계점 (3)</h4><p>지도자-구성원 관계에만 초점 / 상황 변인의 중요성 간과 / 훈련이 어렵고 개인 성향에 좌우</p></div>"},{"id":"admin-24","name":"카리스마적 지도성","items":[{"text":"정의","children":[]},{"text":"변혁적 지도성과의 차이","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>기본개념</h4><p>지도자의 비범한 능력(미래 비전 제시)과 개인적 매력(자기희생)으로 구성원의 헌신적 복종·충성을 이끌어내는 지도성. <em>변혁적 지도성에서 파생된 이론이라 한계점도 동일하지만, 구성원이 지도자를 <strong>우상화·숭배</strong>한다는 점에서 변혁적 지도성과 차이가 있습니다.</em></p></div>"},{"id":"admin-25","name":"분산적 지도성","items":[{"text":"등장배경","children":[]},{"text":"정의","children":[]},{"text":"특징(3가지)","children":[]},{"text":"필수조건(3가지)","children":[]},{"text":"한계점","children":[]},{"text":"초우량 지도성과의 차이","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>등장배경</h4><p>지도자 중심 리더십(‘집중된 지도성’)이 현대사회의 복잡·광범위한 목표 달성에 한계를 느껴 등장.</p></div>\n<div class=\"mn-block\"><h4>기본개념</h4><p>구성원 간의 공유·상호의존·신뢰를 바탕으로 지도자의 역할을 <strong>공동으로 구성·실행</strong>하는 지도성.</p></div>\n<div class=\"mn-block\"><h4>특징 (3)</h4><p>공동 리더십 강조(모든 구성원이 협력) / 구성원의 전문성 극대화 / 공동 책임 지향</p></div>\n<div class=\"mn-block\"><h4>필수조건 (3)</h4><p>지도자(비전 제시, 협력 촉진, 참여 유도) / 구성원(스스로 리더십 발휘, 협력) / 상황(신뢰·존중·협력을 장려하는 문화)</p></div>\n<div class=\"mn-block\"><h4>한계점 (2)</h4><p>조직 내 갈등 유발 가능(정치적 성향 시) / 새로운 접근을 제한할 가능성(보수적 신념 시)</p></div>"},{"id":"admin-26","name":"초우량 지도성","items":[{"text":"정의","children":[]},{"text":"한계점","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>기본개념</h4><p>지도자가 구성원 개개인을 지도자로 성장시켜 모든 구성원이 스스로 자율적 지도(Self leadership)를 하도록 하는 지도성.</p></div>\n<div class=\"mn-tip\">💡 분산적 지도성과 헷갈리기 쉬운데, 분산적 지도성은 “구성원 모두에게 리더십이 있다”(예: 교장 일을 교사들이 나눠 가짐)는 전제인 반면, 초우량 지도성은 “지도자가 구성원을 지도자로 만든다”는 <strong>자율(Self)</strong>이 포인트입니다(예: 교사가 자기 본연의 일을 스스로 잘하게 함).</div>\n<div class=\"mn-block\"><h4>한계점</h4><p>모두가 효과적인 지도자가 될 수는 없음</p></div>"},{"id":"admin-27","name":"교육적·문화적·도덕적 지도성","items":[{"text":"3가지 지도성의 정의","children":[]}],"explainHtml":"<div class=\"mn-table-wrap\"><table class=\"mn-table\">\n<tr><th>유형</th><th>정의</th></tr>\n<tr><td>교육적 지도성</td><td>지도자가 교육 전문지식과 능력으로 교수학습·교육프로그램·교육과정 개발, 장학, 평가 등을 효율적으로 수행</td></tr>\n<tr><td>문화적 지도성</td><td>교사·학생은 관료적 규칙보다 관습·신념·규범에 더 잘 반응 → 학교문화에 관심을 기울이고 구성원을 조직의 주인으로 만듦</td></tr>\n<tr><td>도덕적 지도성</td><td>지도자의 도덕성+구성원의 자율성으로 모든 구성원을 자율적 지도자로 자극(=초우량 지도성 + 도덕성)</td></tr>\n</table></div>"},{"id":"admin-28","name":"서번트 리더십","items":[{"text":"정의","children":[]},{"text":"지도성 이론의 공통 실현방안","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>기본개념</h4><p>일방적 지휘나 강한 통솔력보다 존중·솔선수범·헌신적 봉사를 통해 구성원의 능력과 창의성을 성장시키는 지도성.</p></div>\n<div class=\"mn-block\"><h4>지도성 이론들의 만능 실현방안 (5)</h4><p>모델링(본보기) / 목표설정 지원 / 격려와 지도 / 보상(칭찬과 질책) / 셀프리더십 문화 구축 지원</p></div>"}]},{"title":"5. 조직이론","theories":[{"id":"admin-29","name":"공식 조직과 비공식 조직","items":[{"text":"정의 및 특징 비교","children":[]},{"text":"비공식 조직의 순기능","children":[]},{"text":"비공식 조직의 역기능","children":[]}],"explainHtml":"<div class=\"mn-table-wrap\"><table class=\"mn-table\">\n<tr><th>구분</th><th>정의</th><th>특징</th></tr>\n<tr><td>공식 조직</td><td>공적 목표 달성을 위해 인위적으로 구성, 제도화된 공식규범으로 형성</td><td>권한의 계층, 명료한 책임분담, 표준화된 업무수행, 냉담한 인간관계 (<strong>과학적 관리론</strong> 시대에 중시)</td></tr>\n<tr><td>비공식 조직</td><td>공식 조직 내에서 구성원 간 인간관계로 구성, 학연·지연·혈연·취미·종교 등으로 형성(자생조직)</td><td>(<strong>인간관계론</strong> 시대에 중시)</td></tr>\n</table></div>\n<div class=\"mn-block\"><h4>비공식 조직의 순기능 (3)</h4><p>원활한 의사전달(공식 조직의 불충분한 전달을 보충) / 효율적인 직무수행(자유로운 협조) / 공식 조직의 경직성 완화<br><strong>비공식 조직의 역기능 (3)</strong>: 적대감 발생 우려(공식 조직 마비 가능) / 의사전달의 역기능(왜곡된 소문) / 공식 조직의 목표 달성 저해 우려</p></div>"},{"id":"admin-30","name":"계선조직과 참모조직","items":[{"text":"정의 비교(집행 기능 유무)","children":[]},{"text":"예시","children":[]},{"text":"장단점","children":[]}],"explainHtml":"<div class=\"mn-table-wrap\"><table class=\"mn-table\">\n<tr><th>구분</th><th>정의</th><th>예</th><th>장점</th><th>단점</th></tr>\n<tr><td>계선(직계)조직</td><td>상하 위계의 지휘명령 계통에 따라 움직이는 수직적 조직(<strong>실제 집행 기능 있음</strong>)</td><td>학교(교사-부장-교감-교장)</td><td>효율적 업무수행, 신속한 의사결정</td><td>업무량 증가, 관리자의 독단적 의사결정</td></tr>\n<tr><td>참모(막료)조직</td><td>계선조직을 지원하는 수평적 조직(기획·자문·협의·정보제공, <strong>실제 집행 기능 없음</strong>)</td><td>학교 내 교육과정부실·연구부실</td><td>합리적 의사결정(전문가 활용), 수평적 업무조정</td><td>책임 전가 우려, 구성원·부서 간 갈등</td></tr>\n</table></div>"},{"id":"admin-31","name":"조직 유형 분류(분류기준별)","items":[{"text":"파슨스의 조직분류(사회적 기능 기준)","children":[]},{"text":"블라우와 스콧의 조직분류(1차 수혜자 기준)","children":[]},{"text":"칼슨의 조직분류(고객 선택권 유무 기준)","children":[{"text":"4가지 유형과 학교의 위치(사육조직)","children":[]},{"text":"사육조직의 문제점","children":[]}]},{"text":"에치오니의 조직분류(권력·참여 유형 기준)","children":[]},{"text":"홀의 교육조직 분류(관료성·전문성 정도 기준)","children":[]},{"text":"민츠버그의 조직분류","children":[{"text":"조직의 구성요소","children":[]},{"text":"조정기제","children":[]},{"text":"조직의 유형(5가지)과 학교의 위치(전문적 관료제)","children":[]}]}],"explainHtml":"<h4>1. 파슨스의 조직분류 (사회적 기능 기준)</h4>\n<p>생산조직(적응기능, 예: 대기업) / 정치적 목표지향 조직(공동목표 달성, 예: 정부) / 통합조직(구성원 간 통합, 예: 법원·경찰) / <strong>유형유지조직</strong>(문화 유지·잠재적 기능, 예: <strong>학교</strong>)</p>\n<h4>2. 블라우와 스콧의 조직분류 (1차 수혜자 기준)</h4>\n<p>호혜조직(구성원이 수혜자, 예: 노동조합) / 사업조직(소유자가 수혜자, 예: 기업) / 공공조직(일반대중이 수혜자, 예: 군대·경찰) / <strong>봉사조직</strong>(이용 고객이 수혜자, 예: <strong>학교·병원</strong>)</p>\n<h4>3. 칼슨의 조직분류 (조직과 고객의 선택권 유무 기준, 봉사조직 세분화)</h4>\n<div class=\"mn-table-wrap\"><table class=\"mn-table\">\n<tr><th>유형</th><th>조직의 선택권</th><th>고객의 선택권</th><th>예</th></tr>\n<tr><td>야생조직</td><td>있음</td><td>있음</td><td>사립학교, 특목고, 사립대학</td></tr>\n<tr><td>적응조직</td><td>없음</td><td>있음</td><td>미국 주립대학, 자유등록제 학교</td></tr>\n<tr><td>강압조직</td><td>있음</td><td>없음</td><td>군대</td></tr>\n<tr><td><strong>사육조직</strong>(온상조직)</td><td>없음</td><td>없음</td><td><strong>공립학교</strong>, 정신병원, 교도소</td></tr>\n</table></div>\n<div class=\"mn-block\"><h4>사육조직의 문제점 (2)</h4><p>교육에 큰 관심 없음(질이 떨어져도 법적 배정) / 폐쇄할 수 없음(법적 보호)</p></div>\n<h4>4. 에치오니의 조직분류 (권력·참여 유형 기준)</h4>\n<p>강제조직(강제적 통제, 소외감 속 참여, 예: 교도소) / 공리조직(물질적 보상, 타산적 참여, 예: 기업) / <strong>규범조직</strong>(사랑·존중·사명감 등 규범적 권력, 헌신적 참여, 예: <strong>학교</strong>·종교·병원)</p>\n<h4>5. 홀의 교육조직 분류 (관료성·전문성 정도 기준)</h4>\n<div class=\"mn-table-wrap\"><table class=\"mn-table\">\n<tr><th>유형</th><th>전문성</th><th>관료성</th><th>특징</th></tr>\n<tr><td>Weber형</td><td>높음</td><td>높음</td><td>전문화와 관료화가 상호보완적(Weber의 이상적 형태)</td></tr>\n<tr><td>권위주의형</td><td>낮음</td><td>높음</td><td>상급자가 최종결정, 구성원은 순응</td></tr>\n<tr><td>전문형</td><td>높음</td><td>낮음</td><td>구성원을 전문가로 간주, 의사결정 위임</td></tr>\n<tr><td>혼돈형</td><td>낮음</td><td>낮음</td><td>혼란과 갈등이 전형적으로 나타남</td></tr>\n</table></div>\n<h4>6. 민츠버그의 조직분류</h4>\n<div class=\"mn-block\"><h4>조직의 구성요소</h4><p>최고관리층(전략부문, 예: 교육감) / 지원부서층(간접지원, 예: 시설담당자) / 중간관리층(전략-운영 연결, 예: 교장·교감·부장교사) / 기술구조층(업무 표준화, 예: 장학사) / 핵심운영층(현장 수행, 예: 교사)</p></div>\n<div class=\"mn-block\"><h4>조정기제</h4><p>직접감독 / 상호조절(비공식 의사소통) / 산출의 표준화 / 과정의 표준화 / 기술의 표준화</p></div>\n<h4>조직의 유형 (5)</h4>\n<div class=\"mn-table-wrap\"><table class=\"mn-table\">\n<tr><th>유형</th><th>핵심부분</th><th>조정기제</th><th>예</th></tr>\n<tr><td>단순구조</td><td>최고관리층</td><td>직접감독</td><td>소규모 학교·기업</td></tr>\n<tr><td>임시구조</td><td>지원부서층</td><td>상호조절</td><td>벤처기업, 스타트업</td></tr>\n<tr><td>사업부제</td><td>중간관리층</td><td>산출의 표준화</td><td>대학교, 대기업, 종합병원</td></tr>\n<tr><td>기계적 관료제</td><td>기술구조층</td><td>작업과정의 표준화</td><td>행정직 공무원(Weber의 관료제와 가장 유사)</td></tr>\n<tr><td><strong>전문적 관료제</strong></td><td>핵심운영층</td><td>기술의 표준화</td><td><strong>전문적 학교</strong>, 전문가조직(분권화+표준화 동시 허용, 이완된 구조, 수평적 행정구조)</td></tr>\n</table></div>"},{"id":"admin-32","name":"전문적 관료제(호이와 미스켈)","items":[{"text":"정의(이원적 조직)","children":[]},{"text":"관료적 특징(5가지)과 순기능·역기능","children":[]},{"text":"전문적 특징(3가지)","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>기본개념</h4><p>학교는 <strong>관료적 특징</strong>(행정업무 관련)과 <strong>전문적 특징</strong>(교수학습 활동 관련)을 모두 갖춘 이원적 조직.</p></div>\n<h4>관료적 특징 (5, 순기능·역기능)</h4>\n<div class=\"mn-table-wrap\"><table class=\"mn-table\">\n<tr><th>특징</th><th>순기능</th><th>역기능</th></tr>\n<tr><td>권위의 위계화(교장-교감-<strong>보직교사</strong>-교사)</td><td>업무를 원활히 조정</td><td>의사소통 장애 가능</td></tr>\n<tr><td>분업과 전문화(교무부·연구부 등)</td><td>전문성 향상</td><td>반복업무로 피로·권태감</td></tr>\n<tr><td>규칙과 규정 강조</td><td>업무의 통일성·안정성</td><td>조직 운영 경직, 목표전도 현상</td></tr>\n<tr><td>경력지향성</td><td>조직 충성 유도</td><td>능력 있어도 경력 때문에 승진 제한</td></tr>\n<tr><td>몰인정성(공평무사성)</td><td>의사결정의 합리성</td><td>개별 특성 미고려로 사기 저하 가능</td></tr>\n</table></div>\n<div class=\"mn-tip\">💡 [학교 현장 상식] <strong>보직교사(부장교사)</strong>는 각 부서를 총괄하는 교사로, 원칙적으로 1급 정교사 자격증이 필요합니다(부족 시 2급도 가능). 매월 보직수당(약 15만원)과 직책수당이 나오지만 책임이 많아 승진을 원하지 않는 교사는 선호하지 않는 편입니다. 부장회의는 일반 교사는 참석하지 않으며, 부장교사와 평교사는 법적으로 직위·직급이 동등해 부장이 평교사에게 업무를 일방적으로 지시할 권한은 없습니다.</div>\n<div class=\"mn-block\"><h4>전문적 특징 (3)</h4><p>교실에서 교수학습 활동에 자율성 보장 / 직무수행의 통일된 표준을 갖기 어렵고 감독받지 않음 / 의사결정에 많은 참여 보장</p></div>"},{"id":"admin-33","name":"조직화된 무질서 조직","items":[{"text":"정의","children":[]},{"text":"특징(3가지)","children":[{"text":"불분명한 목표","children":[]},{"text":"불확실한 기술","children":[]},{"text":"구성원의 유동적 참여","children":[]}]}],"explainHtml":"<div class=\"mn-block\"><h4>기본개념</h4><p>학교는 조직화되어 있지만 불분명한 목표·불확실한 기술·구성원의 유동적 참여 등으로 구조화되어 있지 않아 합리적으로 파악될 수 없는 조직.</p></div>\n<div class=\"mn-block\"><h4>특징 (3)</h4><p>불분명한 목표(구체적이지 않고 수시로 변함, 구성원마다 다르게 규정) / 불확실한 기술(교수방법·자료가 다 다르고 합의된 견해 없음) / 구성원의 유동적 참여(수시 이동으로 의사결정 일관성 유지 어려움)</p></div>\n<div class=\"mn-tip\">💡 이런 특징 때문에 학교 조직을 <strong>쓰레기통 모형</strong>(garbage-can model, 의사결정이 합리적이지 않고 우연적으로 이루어짐)으로 부르기도 합니다.</div>"},{"id":"admin-34","name":"이완조직","items":[{"text":"정의","children":[]},{"text":"특징(4가지)","children":[]},{"text":"이완조직과 조직화된 무질서 조직의 관점 차이","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>기본개념</h4><p>학교 내 부서들은 서로 연결되어 있으나 구조적으로 느슨하게 결합되어 있어 각각 독립성을 유지하는 조직.</p></div>\n<div class=\"mn-block\"><h4>특징 (4)</h4><p>교사는 전문가로서 자율권을 행사(상사 권위에 순종적이지 않음) / 한 부분의 성공·실패가 다른 부분과 연결되지 않음 / 직무에 대한 엄격한 평가가 불가능 / 투입과 결과가 분리됨</p></div>\n<div class=\"mn-tip\">💡 마이어&amp;로완은 이런 이완조직도 나름 <strong>신뢰의 논리</strong>(logic of confidence)에 의해 운영된다고 봤습니다 — 학교 구성원 간에는 신뢰가 있어야 한다는 관점입니다. 조직화된 무질서 조직과 이완조직은 둘 다 관료제론을 비판하며 등장해 비슷해 보이지만, 학교를 “무질서한 조직”으로 볼지 “이완적인 조직”으로 볼지의 관점 차이가 있습니다.</div>"},{"id":"admin-35","name":"이중조직","items":[{"text":"정의(교수활동과 행정의 이원적 결합구조)","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>기본개념</h4><p>학교는 교수활동(수업) 측면에서는 느슨한 결합구조(이완조직), 학교경영·행정(시설관리) 측면에서는 엄격한 결합구조(관료적 조직)를 동시에 갖는 이중조직.</p></div>"},{"id":"admin-36","name":"학습조직","items":[{"text":"등장배경","children":[]},{"text":"정의","children":[]},{"text":"학습조직의 원리(5가지)","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>등장배경</h4><p>1980년대 기업들이 구조개혁·인원감축을 시도했지만 효과가 없어, 1990년대 피터 센지가 “끊임없이 학습하는 조직만 살아남는다”는 전제로 개발.</p></div>\n<div class=\"mn-block\"><h4>기본개념</h4><p>신뢰와 존중, 지속적인 정보공유·협력적 학습활동을 통해 새로운 지식을 창출·경영하려는 조직.</p></div>\n<div class=\"mn-block\"><h4>학습조직의 원리 (5)</h4><p>개인적 숙련(꿈과 비전을 위한 끊임없는 노력) / 정신모형(인식체계 형성을 위해 서로 도움) / 공유비전(방향에 대한 공감대 형성) / 팀 학습 / 시스템 사고(전체적으로 인지·사고)</p></div>"},{"id":"admin-37","name":"전문적 학습 공동체(전학공)","items":[{"text":"정의","children":[]},{"text":"특징(3가지)","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>기본개념</h4><p>기존 학교의 개인주의·폐쇄적 교과주의를 극복하기 위해, 교사들이 함께 연구·실천·대화·협의하며 함께 성장하는 학습공동체 활동. <em>현장에서는 ’전학공’으로 줄여 부르며, 동료장학의 개선판 정도로 이해하면 됩니다. 미국의 학습조직(센지) 이론을 우리나라 교육현장에 적용한 것이라 원리·특징을 공유합니다.</em></p></div>\n<div class=\"mn-block\"><h4>특징 (3)</h4><p>가치와 비전의 공유 / 협력적 학습 및 적용 / 개인적 경험의 공유 및 반성적 대화(수업 공개·검토)</p></div>"},{"id":"admin-38","name":"조직문화와 조직풍토의 구분","items":[{"text":"개념 정의 비교","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>조직문화 vs 조직풍토</h4><p>조직문화=구성원이 공유하는 규범·절차·가치관·신념·행동양식(장기적 방향성·정체성) / 조직풍토=구성원이 느끼는 분위기·환경(현재 모습). 최근에는 조직풍토보다 조직문화를, 수직적·위계적보다 수평적·민주적 문화를 중시.</p></div>"},{"id":"admin-39","name":"호이와 미스켈의 조직문화의 수준","items":[{"text":"3가지 수준","children":[{"text":"공유된 규범으로서의 문화","children":[]},{"text":"공유된 가치로서의 문화","children":[]},{"text":"묵시적 가정으로서의 문화","children":[]}]}],"explainHtml":"<div class=\"mn-block\"><h4>조직문화 vs 조직풍토</h4><p>조직문화=구성원이 공유하는 규범·절차·가치관·신념·행동양식(장기적 방향성·정체성) / 조직풍토=구성원이 느끼는 분위기·환경(현재 모습). 최근에는 조직풍토보다 조직문화를, 수직적·위계적보다 수평적·민주적 문화를 중시.</p></div>\n<h4>조직문화의 유형(수준) (3)</h4>\n<div class=\"mn-table-wrap\"><table class=\"mn-table\">\n<tr><th>수준</th><th>정의</th><th>예</th></tr>\n<tr><td>공유된 규범으로서의 문화(가장 구체적·표면적)</td><td>구성원이 공유하는 규범·절차·행동양식</td><td>관리자 보고 방법, 복장 규정, 출근 시간</td></tr>\n<tr><td>공유된 가치로서의 문화(중간 수준)</td><td>구성원이 공유하는 가치관·신념</td><td>학생 만족, 교육 품질 우선</td></tr>\n<tr><td>묵시적 가정으로서의 문화(가장 추상적·심층적)</td><td>구성원이 당연시하는 무언의 생각·태도</td><td>“윗사람 말은 무조건 따라야 한다”</td></tr>\n</table></div>"},{"id":"admin-40","name":"세티아와 글리노우의 문화유형론","items":[{"text":"분류기준(인간에 대한 관심·성과에 대한 관심)","children":[]},{"text":"4가지 유형","children":[{"text":"보호문화","children":[]},{"text":"통합문화","children":[]},{"text":"냉담문화","children":[]},{"text":"실적문화","children":[]}]}],"explainHtml":"<div class=\"mn-block\"><h4>기본개념</h4><p>조직의 관심이 인간과 성과 중 어디에 있는지에 따라 4가지로 분류.</p></div>\n<div class=\"mn-block\"><h4>분류기준 (2)</h4><p>인간에 대한 관심(구성원 복지) / 성과에 대한 관심(성과 기대)</p></div>\n<h4>조직문화의 유형 (4)</h4>\n<div class=\"mn-table-wrap\"><table class=\"mn-table\">\n<tr><th>유형</th><th>인간관심</th><th>성과관심</th><th>특징</th></tr>\n<tr><td>보호문화</td><td>높음</td><td>낮음</td><td>복지를 강조하지만 높은 성과는 요구하지 않음, 지도자에 대한 충성심</td></tr>\n<tr><td>통합문화</td><td>높음</td><td>높음</td><td>복지+성과 모두 관심, 잠재력 계발·조직발전 기대</td></tr>\n<tr><td>냉담문화</td><td>낮음</td><td>낮음</td><td>복지·성과 모두 무관심, 음모·분열·냉소주의</td></tr>\n<tr><td>실적문화</td><td>낮음</td><td>높음</td><td>복지는 무관심, 높은 성과만 요구, 성공·경쟁·혁신 중시</td></tr>\n</table></div>"},{"id":"admin-41","name":"핼핀과 크로프트의 학교풍토 유형","items":[{"text":"정의(OCDQ)","children":[]},{"text":"교사의 행동 특성 변인","children":[]},{"text":"교장의 행동 특성 변인","children":[]},{"text":"학교풍토 유형(6가지)","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>기본개념</h4><p>교사와 교장의 행동 특성이 학교풍토에 영향을 미친다는 것을 규명. 조직풍토 기술 질문지(OCDQ)로 교사 스스로 평가해 학교 조직풍토를 6가지로 분류.</p></div>\n<div class=\"mn-block\"><h4>교사의 행동 특성 변인</h4><p>이탈(업무에 얽매이지 않음) / 방해(교장을 방해적 존재로 여김) / 사기(성취감) / 친밀(우호적 인간관계)<br><strong>교장의 행동 특성 변인</strong>: 냉담(원리원칙에 따라 거리 유지) / 강조(일방적 지시) / 추진(학교를 잘 운영) / 배려(인간적으로 도와줌)</p></div>\n<h4>학교풍토 유형 (6)</h4>\n<div class=\"mn-table-wrap\"><table class=\"mn-table\">\n<tr><th>유형</th><th>특징</th></tr>\n<tr><td><strong>개방적 풍토</strong></td><td>교장은 융통성, 교사는 자발적 협동·만족감 (가장 바람직)</td></tr>\n<tr><td><strong>자율적 풍토</strong></td><td>교장은 냉담(과업 강조 안 함), 교사는 자유롭게 업무·사회적 욕구 충족</td></tr>\n<tr><td><strong>통제적 풍토</strong></td><td>교장은 냉담+과업 강조, 교사는 방해로 느끼며 사회적 욕구 소홀</td></tr>\n<tr><td><strong>친교적 풍토</strong></td><td>우호적 태도로 욕구 충족은 잘되나 목표달성 활동 부족(사교적)</td></tr>\n<tr><td><strong>간섭적 풍토</strong></td><td>교장은 독단적+과업 강조, 성취·사회적 욕구 모두 부정적 영향</td></tr>\n<tr><td><strong>폐쇄적 풍토</strong></td><td>교사 사기 극도로 저하, 교장은 냉담+불필요한 일 강조 (가장 비효율적)</td></tr>\n</table></div>"},{"id":"admin-42","name":"호이와 미스켈의 학교풍토 유형","items":[{"text":"정의(Re-OCDQ, 4가지 유형)","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>기본개념</h4><p>개정된 조직풍토척도(Re-OCDQ)를 사용해 학교풍토를 4가지로 분류(개방·참여·일치·폐쇄형). <em>핼핀과 크로프트의 6가지 유형을 근거로 좀 더 간결하게 재구성한 것입니다.</em></p></div>"},{"id":"admin-43","name":"리커트의 관리체제유형","items":[{"text":"정의(부하에 대한 신뢰·의사결정 참여)","children":[]},{"text":"관리체제의 유형(4가지)","children":[]},{"text":"시사점(X-Y이론과의 관계, 연결핀)","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>등장배경</h4><p>리커트가 1950년대 초 미국의 공장·병원을 대상으로 조직의 관리체제를 연구, 관리체제가 구성원의 태도·행동에 영향을 미침을 발견.</p></div>\n<div class=\"mn-block\"><h4>기본개념</h4><p><strong>부하에 대한 신뢰</strong>와 <strong>의사결정에 참여</strong>라는 두 기준으로 체제1~4로 조직을 분류.</p></div>\n<h4>관리체제의 유형 (4)</h4>\n<div class=\"mn-table-wrap\"><table class=\"mn-table\">\n<tr><th>체제</th><th>성격</th><th>신뢰</th><th>참여</th></tr>\n<tr><td>체제1: 착취적(이기적) 권위형</td><td>권위적</td><td>불신</td><td>의사결정이 최고경영자에 집중, 명령·처벌</td></tr>\n<tr><td>체제2: 자선적(온정적) 권위형</td><td>권위적</td><td>다소 신뢰</td><td>참여 없음, 보살핌만 받음</td></tr>\n<tr><td>체제3: 자문적(협의적) 민주형</td><td>민주적</td><td>상당히 신뢰</td><td>부분적 참여, 의견 수렴</td></tr>\n<tr><td>체제4: 참여적 민주형</td><td>민주적</td><td>완전히 신뢰</td><td>구성원 주도적 참여, 자율성 존중</td></tr>\n</table></div>\n<div class=\"mn-block\"><h4>시사점 (4)</h4><p>체제1·2는 X이론, 체제3·4는 Y이론에 해당 / 조직의 생산성·사기는 체제1→4로 갈수록 높아짐 / Y이론·성숙행동·동기요인·내재적 동기를 중시 / 조직체제 간 유기적 연결을 수행하는 사람을 ’연결핀(Linking pin)’이라 함</p></div>"},{"id":"admin-44","name":"학교 내 갈등","items":[{"text":"원인","children":[]},{"text":"순기능","children":[]},{"text":"역기능","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>원인</h4><p>학생·교사·학부모·관리자 등 구성원 간 의견 차이·목표 차이·이해관계 충돌<br><strong>순기능 (2)</strong>: 문제점 파악과 혁신 촉진 / 구성원 간 관계 개선<br><strong>역기능 (2)</strong>: 안정성·통일성 저하 / 정신적·신체적 고통</p></div>"},{"id":"admin-45","name":"토마스의 갈등해결모형","items":[{"text":"분류기준(협조성·자기의견 주장정도)","children":[]},{"text":"5가지 방식","children":[{"text":"경쟁","children":[]},{"text":"회피","children":[]},{"text":"타협","children":[]},{"text":"협력","children":[]},{"text":"수용","children":[]}]},{"text":"방식별 적절한 상황","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>기본개념</h4><p>조직의 목표달성과 구성원의 필요 충족이라는 갈등을 다루는 방식을 <strong>협조성 정도</strong>와 <strong>자기의견 주장정도</strong>의 두 차원으로 5가지로 분류.</p></div>\n<div class=\"mn-table-wrap\"><table class=\"mn-table\">\n<tr><th>방식</th><th>정의</th><th>적절한 상황</th></tr>\n<tr><td>경쟁</td><td>자신의 이익만 충족, 상대방 희생</td><td>신속한 결정이 필요한 긴급 상황, 조직 성장에 매우 중요한 문제</td></tr>\n<tr><td>회피</td><td>양쪽 이익 모두 무시, 갈등 자체를 회피</td><td>다른 문제 해결로 자연스럽게 해결될 때, 갈등해소 부작용이 클 때</td></tr>\n<tr><td>타협</td><td>양쪽이 서로 양보해 절충안 모색</td><td>당사자 주장이 대치될 때, 복잡한 문제의 일시적 해결책이 필요할 때</td></tr>\n<tr><td>협력</td><td>양쪽 모두 만족하는 해결책 모색</td><td>양쪽의 협력이 필요하고 이익이 매우 중요할 때</td></tr>\n<tr><td>수용</td><td>자신의 이익 포기, 상대방 갈등만 해소</td><td>자기 잘못을 알았을 때, 조화·안정이 중요할 때</td></tr>\n</table></div>\n<div class=\"mn-tip\">💡 조직 내 갈등은 ’협력’형으로 윈윈하는 것이 가장 이상적이지만, 상황에 따라 ’타협’이나 ’수용’이 더 유리할 수도 있습니다.</div>"}]},{"title":"6. 장학이론","theories":[{"id":"admin-46","name":"약식장학","items":[{"text":"정의","children":[]},{"text":"특징 및 장점","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>정의</h4><p>교장이나 교감이 간헐적으로 짧은 시간 동안 학급을 순시하거나 수업을 참관해 지도·조언하는 장학.<br><strong>특징 및 장점 (3)</strong>: 교장·교감 주도의 비공식적 성격(충분한 신뢰관계 필요) / 학교교육 전반의 정보 파악에 도움 / 간헐적·짧은 시간의 순시·참관 중심</p></div>"},{"id":"admin-47","name":"임상장학","items":[{"text":"정의(교사 중심)","children":[]},{"text":"특징 및 장점","children":[]},{"text":"절차(3단계)","children":[]},{"text":"마이크로티칭의 개념","children":[]},{"text":"컨설팅장학과의 차이","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>기본개념</h4><p>교실 내에서 교사와 장학 담당자(장학사·교장·교감)가 1:1의 친밀한 관계 속에서 교사의 수업기술 향상과 전문성 성장을 위해 수업을 직접 관찰하고 대면적 상호작용으로 교수활동을 분석하는 <strong>교사 중심</strong>의 장학.</p></div>\n<div class=\"mn-block\"><h4>특징 및 장점 (4)</h4><p>수업분석 중심(교사의 인성 변화는 중요하지 않음) / 동료적 관점 지향(상하관계 아님) / 친밀한 인간관계(교사의 요청에 따라 진행) / 실패에 대한 비난 금지(건설적 분석)</p></div>\n<div class=\"mn-block\"><h4>절차 (3단계)</h4><p>①계획협의회(친밀한 관계, 공동 계획 수립) ②수업관찰(장학 담당자가 실제 수업 관찰) ③피드백협의회(수집 자료로 개선 전략 모색)</p></div>\n<div class=\"mn-block\"><h4>마이크로티칭</h4><p>임상장학의 ‘축소판’. 학생 수·수업시간·내용을 모두 축소하고 한두 가지 수업기술 향상에 초점을 둔 연습 수업(녹화-피드백-재계획-재수업-비평의 반복)</p></div>"},{"id":"admin-48","name":"동료장학","items":[{"text":"정의","children":[]},{"text":"특징 및 장점","children":[]},{"text":"멘토링장학과의 차이","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>기본개념</h4><p>둘 이상의 동료 교사가 서로 수업을 관찰한 후 상호 조언하며 함께 연구하는 장학.<br><strong>특징 및 장점 (3)</strong>: 자율성·협동성 기초 / 공식·비공식 행위 모두 포함 / 개인적 발달+학교의 조직적 발달 도모</p></div>\n<div class=\"mn-tip\">💡 세 장학의 부담 정도: 약식장학(관리자가 불시에 관찰, 다소 불편) &gt; 임상장학(사전 협의는 하지만 관리자 참여로 부담) &gt; 동료장학(마음 맞는 교사끼리라 부담 적음) 순으로 이해하면 좋습니다.</div>\n<h4>교내자율장학의 문제점 및 개선방안</h4>\n<div class=\"mn-table-wrap\"><table class=\"mn-table\">\n<tr><th>문제점</th><th>해결책</th></tr>\n<tr><td>장학에 대한 부정적 인식(형식적으로만 이루어짐)</td><td>수업기술 우수 교사를 우대하는 풍토 조성</td></tr>\n<tr><td>관리자에 의한 일방적 장학</td><td><strong>선택적 장학</strong> 방법 활용(초임교사-표준적 교수법 제시, 3~5년 경력교사-상호협동적 장학, 경력 많은 교사-스스로)</td></tr>\n<tr><td>장학여건 미비(시간·예산 부족)</td><td>현장 업무를 경감시켜 자율적 참여 유도</td></tr>\n<tr><td>장학 전문 인력 부족</td><td>특정 교과에 능통한 교사를 장학 담당자로 선정</td></tr>\n</table></div>"},{"id":"admin-49","name":"교내자율장학의 문제점 및 개선방안","items":[{"text":"선택적 장학의 개념","children":[]}],"explainHtml":"<h4>교내자율장학의 문제점 및 개선방안</h4>\n<div class=\"mn-table-wrap\"><table class=\"mn-table\">\n<tr><th>문제점</th><th>해결책</th></tr>\n<tr><td>장학에 대한 부정적 인식(형식적으로만 이루어짐)</td><td>수업기술 우수 교사를 우대하는 풍토 조성</td></tr>\n<tr><td>관리자에 의한 일방적 장학</td><td><strong>선택적 장학</strong> 방법 활용(초임교사-표준적 교수법 제시, 3~5년 경력교사-상호협동적 장학, 경력 많은 교사-스스로)</td></tr>\n<tr><td>장학여건 미비(시간·예산 부족)</td><td>현장 업무를 경감시켜 자율적 참여 유도</td></tr>\n<tr><td>장학 전문 인력 부족</td><td>특정 교과에 능통한 교사를 장학 담당자로 선정</td></tr>\n</table></div>"},{"id":"admin-50","name":"자기장학","items":[{"text":"정의","children":[]},{"text":"특징","children":[]},{"text":"방법","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>기본개념</h4><p>외부의 강요 없이 교사 스스로 전문성 신장을 위해 계획을 수립·실천하는 자율장학. 자기실현 욕구가 강한 교사에게 효과적.<br><strong>특징 (3)</strong>: 스스로 계획+자기반성 시간 / 개인학습을 선호하므로 긍정적 효과 기대 / 모든 교사에게 적합하지는 않음(고도의 전문성 필요)<br><strong>방법 (4)</strong>: 수업 녹화·분석(마이크로티칭 활용) / 학생·학부모·동료로부터 피드백 / 상급 대학원 진학 / 세미나·학회 참석</p></div>"},{"id":"admin-51","name":"멘토링장학","items":[{"text":"정의","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>기본개념</h4><p>신규교사가 경력교사와 역할을 분담해 교수학습 기술·생활지도·상담·학급경영에 대해 전문성을 구축하는 장학.</p></div>\n<div class=\"mn-tip\">💡 동료장학과 헷갈리기 쉬운데, 동료장학=스터디(비슷한 레벨끼리 연구), 멘토링장학=과외(높은 수준이 낮은 수준을 가르침)로 비유하면 쉽습니다. 또한 동료장학은 주로 수업 연구를 다루지만, 멘토링장학은 수업뿐 아니라 생활지도·학급경영 등 여러 분야를 아우릅니다.</div>"},{"id":"admin-52","name":"선택 장학","items":[{"text":"정의(장학 유형별 적합 대상)","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>기본개념</h4><p>교사가 개인차를 고려해 여러 장학 대안 중 자신에게 가장 적합한 장학을 선택하는 장학. (예: 약식장학-모든 교사, 임상장학-초임교사, 동료장학-모든 교사, 자기장학-경험 많은 교사)</p></div>"},{"id":"admin-53","name":"컨설팅장학","items":[{"text":"정의(자발적 의뢰)","children":[]},{"text":"임상장학과의 차이(3가지)","children":[]},{"text":"원리 및 특징(6가지)","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>기본개념</h4><p>교내·외의 전문성을 갖춘 장학 요원이 학교와 구성원의 <strong>자발적 의뢰</strong>에 따라 학교 운영 및 교수-학습과 관련된 문제를 해결하기 위해 전문가가 조언하는 장학.</p></div>\n<div class=\"mn-tip\">💡 임상장학과의 3가지 차이점: ①임상장학=교내 단위, 컨설팅장학=<strong>교외까지 확장</strong> ②임상장학=교실 내 수업기술, 컨설팅장학=<strong>학교운영 전반</strong>의 문제 진단·해결 ③임상장학=비자발적일 수 있음(필요에 따른 강제성), 컨설팅장학=<strong>구성원의 자발적 의뢰</strong></div>\n<div class=\"mn-block\"><h4>원리 &amp; 특징 (6, 기존 장학과의 차이점)</h4><p>자발성(학교장·교사의 자발적 요청) / 독립성(교사와 동등한 관계, 상하관계 아님) / 전문성(전문지식을 갖춘 사람이 진행) / 자문성(컨설턴트가 의뢰인을 대신 경영하지 않음) / 학습성(문제해결에 필요한 정보·교육 제공) / <strong>일시성</strong>(특정 과제해결을 위한 일시적 관계)</p></div>"},{"id":"admin-54","name":"인적자원론적 장학","items":[{"text":"등장배경","children":[]},{"text":"정의","children":[]},{"text":"인간관계론과의 인과관계 순서 차이","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>등장배경</h4><p>서지오바니에 의해 연구. 인간중심 장학 형태를 최근 선호하며 출제 가능성이 높음.</p></div>\n<div class=\"mn-block\"><h4>기본개념</h4><p>교사들을 학교 의사결정 과정에 참여시켜 공동 의사결정을 도입하면 학교 효율성이 증가하고, 이를 통해 교사의 직무만족도가 증가한다고 보는 장학.</p></div>\n<div class=\"mn-tip\">💡 인간관계론과의 인과관계 순서 차이가 핵심입니다 — <strong>인간관계론</strong>: 학교 의사결정에 교사 참여 → 교사 직무만족도 증진 → 학교 효과성 향상. <strong>인적자원론</strong>: 학교 의사결정에 교사 참여 → <strong>학교 효과성 향상</strong> → 교사 직무만족도 증진(순서가 반대!).</div>\n<div class=\"mn-block\"><h4>특징 (2)</h4><p>교사 개인의 욕구와 학교 목적·과업의 통합에 중점 / 학교 경영자는 교사가 목표 달성에 능력을 최대한 발휘하도록 환경을 조성</p></div>"}]},{"title":"7. 정책이론","theories":[{"id":"admin-55","name":"교육기획","items":[{"text":"정의","children":[]},{"text":"접근방법(4가지)","children":[{"text":"사회수요에 의한 접근","children":[]},{"text":"인력수요에 의한 접근","children":[]},{"text":"수익률에 의한 접근","children":[]},{"text":"국제 비교에 의한 접근","children":[]}]},{"text":"장점","children":[]},{"text":"단점","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>기본개념</h4><p>미래 교육활동에 대비해 교육목표 달성을 위한 효과적인 수단·방법을 제시하여, 교육정책 결정의 효율성과 안정성을 보장하는 사전 준비과정.</p></div>\n<div class=\"mn-block\"><h4>접근방법 (4)</h4><p>사회수요에 의한 접근(교육 기회 균등 원칙 기반) / <strong>인력수요</strong>에 의한 접근(경제성장에 필요한 인적자본 중심으로 교육 공급 조절) / 수익률에 의한 접근(경제적 수익률이 높은 방식 채택) / 국제 비교에 의한 접근(유사 국가의 경험 비교)</p></div>\n<div class=\"mn-block\"><h4>장점 (3)</h4><p>사회적·정치적 안정에 기여 / 경제적 효율성 향상 / 교육투자의 합리적 배분<br><strong>단점 (3)</strong>: 예측의 어려움 / 교육본질의 훼손 가능성(경제성장 목표에 치우침) / 기술적 한계(과거 기준 미래 추정의 한계)</p></div>"},{"id":"admin-56","name":"교육정책","items":[{"text":"정의","children":[]},{"text":"교육기획 및 교육정책의 기준(8가지)","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>의미</h4><p>교육목적 달성을 위해 국가가 공적으로 제시하는 기본방침. (예: 평생교육, 다문화교육, 무상교육 등)<br><strong>평가</strong>: 정책이 일어난 이후 집행 과정·결과를 검토·평가하는 활동.</p></div>\n<div class=\"mn-block\"><h4>교육기획 및 교육정책의 기준 (8)</h4><p>타당성 / 효율성 / 민주성(국민 참여) / 전문성(전문가 검토) / 중립성(정치·종교 압력 배제) / 적응성(융통성) / 안정성(일관성 유지) / 공평성(기회균등·자원의 평등 배분)</p></div>"},{"id":"admin-57","name":"의사결정을 보는 관점","items":[{"text":"4가지 관점(합리적·참여적·정치적·우연적)","children":[]}],"explainHtml":"<p>합리적 관점(최선의 대안 선택) / 참여적 관점(당사자 간 논의·합의) / 정치적 관점(문제해결·타협점 찾기) / 우연적 관점(수많은 요소가 우연히 모여 이루어짐)</p>"},{"id":"admin-58","name":"의사결정모형","items":[{"text":"합리성 모형","children":[]},{"text":"만족 모형","children":[]},{"text":"점증 모형","children":[]},{"text":"혼합 모형","children":[]},{"text":"최적 모형","children":[]},{"text":"쓰레기통 모형","children":[]},{"text":"모형별 학자, 장단점","children":[]}],"explainHtml":"<h4>의사결정모형 (6)</h4>\n<div class=\"mn-table-wrap\"><table class=\"mn-table\">\n<tr><th>모형</th><th>학자</th><th>내용</th><th>장점</th><th>단점</th></tr>\n<tr><td><strong>합리성 모형</strong></td><td>—</td><td>모든 대안을 객관적으로 분석·종합해 최선의 대안을 찾음</td><td>—</td><td>계량화 불가능한 부분 존재, 인간은 심리적 동물, 이상론적 모형</td></tr>\n<tr><td><strong>만족 모형</strong></td><td>Simon&amp;March</td><td>(합리성 모형의 한계 지적) 객관적 자료를 바탕으로 하되 의사결정자가 <strong>주관적으로 만족스러운</strong> 대안을 선택</td><td>합리성 모형의 한계 극복</td><td>만족 상태를 결정하는 기준이 모호</td></tr>\n<tr><td><strong>점증 모형</strong></td><td>Lindbloom</td><td>(합리성 모형의 한계 지적) 기존 정책보다 <strong>약간 개선된</strong> 대안을 선택</td><td>안정적 정책결정, 실현가능성 높음, 갈등 없음</td><td>보수적·소극적, 개혁적 결정에 부적절</td></tr>\n<tr><td><strong>혼합 모형</strong></td><td>Etzioni</td><td>합리성 모형(기본방향)+점증 모형(세부 문제)의 결합</td><td>현실적 안정성</td><td>절충된 모형이라 독자적 가치는 떨어짐</td></tr>\n<tr><td><strong>최적 모형</strong></td><td>Dror</td><td>합리성+점증 모형의 결합이나, 직관·통찰·상상력 같은 <strong>초합리적 판단</strong>과 함께 최적안 선택</td><td>창의적·혁신적 정책결정에 도움</td><td>초합리성 개념이 불명확, 비현실적</td></tr>\n<tr><td><strong>쓰레기통 모형</strong></td><td>Cohen&amp;March&amp;Olsen</td><td>쓰레기가 우연히 쓰레기통에 모이듯 <strong>우연적·비합리적</strong>으로 이루어짐(주먹구구식, 대학조직=조직화된 무질서)</td><td>문제가 해결되지 않는 이유를 설명 가능</td><td>모든 조직이 조직화된 무질서는 아니라서 일반화 불가</td></tr>\n</table></div>\n<div class=\"mn-block\"><h4>시사점</h4><p>각 모형은 장단점이 있으므로 상황에 맞게 적용해야 함</p></div>"},{"id":"admin-59","name":"브리지스의 참여적 의사결정 모형","items":[{"text":"배경(불필요한 참여의 역효과)","children":[]},{"text":"정의(수용영역)","children":[]},{"text":"판단기준(적절성·전문성)","children":[]},{"text":"상황별 참여 여부","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>배경</h4><p>구성원의 의사결정 참여는 직무만족도·사기를 높여 목표달성에 도움을 주지만, <strong>불필요한 참여</strong>는 오히려 사기를 떨어뜨릴 수 있음.</p></div>\n<div class=\"mn-block\"><h4>기본개념</h4><p>상급자가 구성원을 참여시킬 때 어떤 기준으로 결정해야 하는지, 상급자의 역할은 무엇인지 설명하는 이론.</p></div>\n<h4>참여적 의사결정 형태 (3)</h4>\n<div class=\"mn-table-wrap\"><table class=\"mn-table\">\n<tr><th>— 핵심 개념: <strong>수용영역</strong>(상급자의 결정을 의심 없이 받아들이는 영역), 판단기준: 적절성(관련성, 나와 상관 있는가)과 전문성(내가 잘 아는가)</th></tr>\n<tr><td>상황</td><td>참여 여부</td></tr>\n<tr><td>수용영역 밖</td><td>처음부터 적극적으로 참여시킴</td></tr>\n<tr><td>수용영역의 한계 영역</td><td>가끔 참여시킴(관련성 有 전문성 無: 최종합의로 저항 최소화 / 관련성 無 전문성 有: 훌륭한 아이디어를 위해)</td></tr>\n<tr><td>수용영역 안(관련성·전문성 모두 없음)</td><td>참여시키지 않음</td></tr>\n</table></div>"},{"id":"admin-60","name":"호이와 타터의 참여적 의사결정 모형","items":[{"text":"브리지스 모형과의 차이(추가된 변인)","children":[]},{"text":"5가지 상황별 조건·참여방식·의사결정구조·리더의 역할","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>배경</h4><p>브리지스 모형에 <strong>구성원의 신뢰·상황·의사결정구조·리더의 역할</strong>이라는 변인을 추가해 더 복잡·상세하게 발전시킴.</p></div>\n<h4>참여적 의사결정 모형 (5가지 상황)</h4>\n<div class=\"mn-table-wrap\"><table class=\"mn-table\">\n<tr><th>상황</th><th>조건</th><th>참여 방식</th><th>의사결정 구조</th><th>리더의 역할</th></tr>\n<tr><td>수용영역 밖(민주적)</td><td>관련성○ 전문성○ 신뢰○</td><td>항상, 광범위하게</td><td>집단합의(다수결)</td><td>통합자</td></tr>\n<tr><td>수용영역 밖(갈등적)</td><td>관련성○ 전문성○ 신뢰X</td><td>항상, 제한적으로</td><td>집단자문(쟁점 설명·토론 후 수용)</td><td>교육자</td></tr>\n<tr><td>수용영역의 한계(전문가)</td><td>관련성X 전문성○</td><td>가끔, 제한적으로</td><td>집단자문</td><td>교육자</td></tr>\n<tr><td>수용영역의 한계(간청자)</td><td>관련성○ 전문성X</td><td>가끔, 제한적으로</td><td>개인자문(조언·충고를 구함)</td><td>간청자</td></tr>\n<tr><td>수용영역 안(비협조적)</td><td>관련성X 전문성X</td><td>배제</td><td>일방적 결정</td><td>지시자</td></tr>\n</table></div>\n<div class=\"mn-tip\">💡 표를 외우기보다, 예시로 감을 잡으면 좋습니다 — 교내 골프장 설치(관련성○ 전문성X, 원하는 사람이 있을 수도 없을 수도)는 집단자문, 장애인 교사 출근 편의(관련성X 전문성○)는 개인자문, 교장실 커피 구매(관련성X 전문성X)는 일방적 결정이 적절합니다.</div>"},{"id":"admin-61","name":"효과적인 의사소통의 원리","items":[{"text":"7가지 원리","children":[]}],"explainHtml":"<p>분포성(배포성, 모든 대상에게 골고루 전달) / 적응성(융통성, 환경에 적절히 적응) / 적시성(적절한 시기) / 명료성(분명하고 정확하게) / 일관성(전후 모순 없음) / 적량성(적정성, 정보량이 적절) / 통일성(조직 전체에 동일하게 수용)</p>"},{"id":"admin-62","name":"의사소통의 종류","items":[{"text":"공식적 의사소통과 비공식적 의사소통의 비교","children":[]},{"text":"언어적 의사소통과 비언어적 의사소통","children":[]}],"explainHtml":"<h4>형식에 따른 구분 (2)</h4>\n<div class=\"mn-table-wrap\"><table class=\"mn-table\">\n<tr><th>구분</th><th>정의</th><th>예</th><th>장점</th><th>단점</th></tr>\n<tr><td>공식적 의사소통</td><td>공식조직 내 공식 경로</td><td>공문서, 구두보고</td><td>확실한 전달, 분명한 책임</td><td>느린 전달속도, 개인 감정 전달 불가</td></tr>\n<tr><td>비공식적 의사소통</td><td>개인 친분·학연·지연을 통한 소통</td><td>소문</td><td>빠른 전달, 개인 사정·감정 전달 가능</td><td>불확실한 전달, 불분명한 책임, 왜곡된 정보</td></tr>\n</table></div>\n<div class=\"mn-block\"><h4>방법에 따른 구분 (2)</h4><p>언어적 의사소통(말·문서, 예: 전화·공문) / 비언어적 의사소통(자세·몸짓·표정·공간배열, 예: 침묵·사무실 배열)</p></div>"},{"id":"admin-63","name":"조하리의 창","items":[{"text":"등장배경","children":[]},{"text":"정의","children":[]},{"text":"4가지 영역과 의사소통 유형","children":[{"text":"개방적 영역(민주형)","children":[]},{"text":"맹목적 영역(독단형)","children":[]},{"text":"잠재적 영역(과묵형)","children":[]},{"text":"미지적 영역(폐쇄형)","children":[]}]},{"text":"시사점","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>등장배경</h4><p>조셉 루프트(Joseph Luft)와 해리 잉햄(Harry Ingham)이 공동 개발(이름 첫 글자를 따서 Johari). <em>자신을 표현하는 형용사 카드 중 자신과 타인이 각각 고른 것을 겹치는지 여부로 분류해 자신의 의사소통 스타일을 확인하는 실험에서 유래했습니다.</em></p></div>\n<div class=\"mn-block\"><h4>기본개념</h4><p>대인관계 능력의 개선방향이나 대인 간 갈등 분석에 사용. 타인과 의사소통할 때 4가지 유형(창)이 있다는 이론.</p></div>\n<h4>의사소통 시 4가지 형태</h4>\n<div class=\"mn-table-wrap\"><table class=\"mn-table\">\n<tr><th>영역(창)</th><th>자신은</th><th>타인은</th><th>의사소통 유형</th><th>특징</th></tr>\n<tr><td>개방적 영역(열린 창)</td><td>안다</td><td>안다</td><td>민주형</td><td>서로 잘 알고 상호작용 → 효과적 의사소통</td></tr>\n<tr><td>맹목적 영역(보이지 않는 창)</td><td>모른다</td><td>안다</td><td>독단형</td><td>자기 얘기만 하고 상대 얘기는 안 들음, 비판적. 피드백 못 받으면 소통 어려움</td></tr>\n<tr><td>잠재적 영역(숨겨진 창)</td><td>안다</td><td>모른다</td><td>과묵형</td><td>방어적, 자신의 감정·태도를 잘 알리지 않음, 타인 정보만 얻으려 함</td></tr>\n<tr><td>미지적 영역(미지의 창)</td><td>모른다</td><td>모른다</td><td>폐쇄형</td><td>의견도 안 내고 피드백도 안 받음, 자기 폐쇄적</td></tr>\n</table></div>\n<div class=\"mn-block\"><h4>시사점 (3)</h4><p>효과적 의사소통을 위해 개방적 영역을 넓혀야 함(자기노출+피드백) / 숨겨진 창·보이지 않는 창에 주목해 관계 개선 / 미지의 영역은 조금씩 노력해 긍정적 방향 모색</p></div>"}]},{"title":"8. 학교경영과 예산","theories":[{"id":"admin-64","name":"학교관리와 학교경영","items":[{"text":"정의 비교(객관적/주관적)","children":[]}],"explainHtml":"<div class=\"mn-table-wrap\"><table class=\"mn-table\">\n<tr><th>구분</th><th>정의</th></tr>\n<tr><td>학교관리</td><td>교육법규·상부기관 중심(<strong>객관적</strong>)으로 수동적·의존적 활동을 통해 인적·물적 자원을 관리·운용</td></tr>\n<tr><td>학교경영</td><td>학교장 중심(<strong>주관적</strong>)으로 교직원의 능동적·주체적 활동을 통해 단위학교의 특성을 살려 교육목표를 효율적으로 달성(최소투입·최대산출)</td></tr>\n</table></div>"},{"id":"admin-65","name":"단위학교 책임경영제(SBM)","items":[{"text":"등장배경","children":[]},{"text":"정의(위임·자율성·책무성)","children":[]},{"text":"장점","children":[]},{"text":"정착을 위한 방안(4가지)","children":[{"text":"학교운영위원회 설치","children":[]},{"text":"도급경비제 실시","children":[]},{"text":"공모교장제 및 초빙교사제","children":[]},{"text":"학교회계제도 도입","children":[]}]}],"explainHtml":"<div class=\"mn-block\"><h4>등장배경</h4><p>서지오바니가 개발. 기존 중앙집권적 교육행정이 교육과정 운영의 자율성을 제약하고 현장의 목소리를 반영하지 못한다고 비판, 1980년대 초반부터 미국에 도입.</p></div>\n<div class=\"mn-block\"><h4>기본개념</h4><p>학교의 운영권을 단위학교에 대폭 위임하여 자율적으로 운영하고 그 결과에 대한 책임(<strong>책무성</strong>)을 지는 제도. (핵심 키워드: <strong>위임·자율성·책무성</strong>)</p></div>\n<div class=\"mn-block\"><h4>장점 (3)</h4><p>수요자 중심 교육(학교장 경영권 확대) / 교육의 효율성 증대(당사자들의 적극적 참여) / 교육자치제 실현(자율적 예산 운영)</p></div>\n<div class=\"mn-block\"><h4>정착을 위한 방안 (4)</h4><p>1. <strong>학교운영위원회</strong> 설치 — 학부모·교원·지역인사가 공동 참여, 투명성·민주성 확보<br>2. <strong>도급경비제</strong> 실시 — 예산을 총액으로 지급해 재량권 확대<br>3. <strong>공모교장제 및 초빙교사제</strong> — 학교 실정에 맞는 교장·교사 초빙<br>4. <strong>학교회계제도</strong> 도입 — 세입·세출 일원화, 자율적 예산 편성·운영</p></div>"},{"id":"admin-66","name":"조직개발기법(OD)","items":[{"text":"정의","children":[]},{"text":"조직개발을 위한 방안","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>기본개념</h4><p>스타인호프와 오웬스가 개발. 행동과학적 지식(심리학·사회학·인류학 등)과 기술을 활용해 학교의 목적과 개인의 욕구를 연관시켜 조직 전체의 변화·발전을 도모하는 기법.</p></div>\n<div class=\"mn-block\"><h4>조직개발을 위한 방안 (4)</h4><p>팀 빌딩(팀워크 향상) / 의사소통 훈련 / 갈등 관리 / 조직문화 변화</p></div>"},{"id":"admin-67","name":"정보관리체제(MIS)","items":[{"text":"정의","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>기본개념</h4><p>조직의 목표를 효율적으로 달성할 수 있도록 각종 자료를 수집·보관·평가하여 합리적 의사결정을 위한 정보를 신속·정확하게 제공하는 종합적 정보관리 체제. (예: 수강신청·등록금·회계·성적 자료 등)</p></div>"},{"id":"admin-68","name":"목표관리기법(MBO)","items":[{"text":"등장배경","children":[]},{"text":"정의","children":[]},{"text":"장점(특징)","children":[]},{"text":"단점","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>등장배경</h4><p>1954년 드러커(Drucker)가 최초 제안, 오디온이 체계화, 이반세비치가 추가 연구.</p></div>\n<div class=\"mn-block\"><h4>기본개념</h4><p>조직 구성원들이 공동으로 참여해 교육목표를 수립하고 그 목표 달성을 위한 전략·절차를 공유함으로써 효율적으로 목표를 달성하는 경영기법.</p></div>\n<div class=\"mn-block\"><h4>장점(특징) (3)</h4><p>교육의 효율성 증대(모든 활동을 목표에 집중) / 의사소통 활성화(목표설정에 모두 참여) / 역할 갈등의 해소(명료한 목표·책임)<br><strong>단점 (3)</strong>: 장기적·전인적 목표에 부적합(단기·구체적 목표 강조) / 교직원의 업무부담(목표설정·성과보고에 많은 시간) / 질적인 교육 저해(측정 가능한 목표만 평가)</p></div>"},{"id":"admin-69","name":"과업평가 계획기법(PERT)","items":[{"text":"정의","children":[]},{"text":"장점(특징)","children":[]},{"text":"단점","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>기본개념</h4><p>사업 수행에 필요한 세부 작업활동·수행단계를 나눈 후, 선후관계를 검토해 플로차트(흐름도)를 작성하고, 각 작업활동·전체 과제의 소요시간을 산출해 업무를 순차적으로 추진하는 관리기법.</p></div>\n<div class=\"mn-block\"><h4>장점(특징) (3)</h4><p>인적·물적 자원의 효율적 활용(어려운/쉬운 작업 구별 가능) / 원만한 작업수행(책임 부서 명확) / 참여의식 향상(관계자 전원 참여)<br><strong>단점 (2)</strong>: 많은 시간과 노력 소요(세분화·시간추정 필요) / 계획 변경의 어려움(복잡한 계산 기반)</p></div>"},{"id":"admin-70","name":"총체적 질 관리(TQM)","items":[{"text":"정의","children":[]},{"text":"특징","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>기본개념</h4><p>지속적인 품질관리를 위해 경영을 개선하려는 노력으로, 고객(수요자)의 만족 수준을 높이기 위해 모든 구성원을 조직화하고 참여시키는 경영기법(데밍의 철학에 기초).</p></div>\n<div class=\"mn-block\"><h4>특징 (3)</h4><p>총체적 참여 중시(전 구성원의 의사결정 참여) / 수요자 중심교육 강조(교사에게 수업 관련 권한 위임) / 구성원의 헌신 강조(지속적 개선·품질향상)</p></div>"},{"id":"admin-71","name":"교육재정의 운영원리","items":[{"text":"운영과정(확보-배분-지출-평가)","children":[]},{"text":"운영원리들","children":[]},{"text":"공정성과 균형성의 차이","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>운영과정</h4><p>(확보) → (배분) → (지출) → (평가)</p></div>\n<div class=\"mn-block\"><h4>원리들</h4><p>충족성(재원을 충분히 확보) / 자구성(스스로 확보할 제도적 장치) / 안정성(일관성 있는 재원) / <strong>효율성</strong>(최소투자·최대성과) / <strong>공정성</strong>(기준에 따른 차등적 분배) / 균형성(개인·지역 간 동등 배분) / <strong>자율성</strong>(단위기관의 자율성 보장) / <strong>투명성</strong>(운영 과정 공개) / 적정성(적절한 지원과 기회) / <strong>책무성</strong>(사용 경비에 대한 책임) / 효과성(목표 도달 여부 측정)</p></div>\n<div class=\"mn-tip\">💡 배분 단계의 공정성(차등)과 균형성(동등)이 헷갈리기 쉬운데, 둘 다 필요한 이유는 상황에 따라 다르게 적용되기 때문입니다 — 무상급식비처럼 동등 지원이 맞는 경우(균형성)도 있고, 장학금·전년도 실적에 따른 차등 지원이 맞는 경우(공정성)도 있습니다.</div>"},{"id":"admin-72","name":"교육비의 종류","items":[{"text":"직접교육비와 간접교육비","children":[]},{"text":"공교육비와 사교육비","children":[]},{"text":"공부담 교육비와 사부담 교육비","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>기본개념</h4><p>국가·지방자치단체·학부모가 교육활동을 위해 지출하는 비용.</p></div>\n<h4>교육비의 종류</h4>\n<div class=\"mn-table-wrap\"><table class=\"mn-table\">\n<tr><th>분류 기준</th><th>종류</th><th>정의</th></tr>\n<tr><td>교육목적 관련 지출 여부</td><td><strong>직접교육비</strong></td><td>교육활동에 직접 지출되는 모든 공교육비+사교육비</td></tr>\n<tr><td></td><td><strong>간접교육비</strong></td><td>교육기간 중 취업 못해 발생하는 유실 수입(기회비용) — 학생이 포기한 경비+시설 감가상각비+포기된 이자</td></tr>\n<tr><td>운영형태</td><td><strong>공교육비</strong></td><td>예산회계 절차를 거쳐 투입되는 경비(혜택이 모든 학생에게)</td></tr>\n<tr><td></td><td><strong>사교육비</strong></td><td>예산회계 절차 없이 학부모가 부담(혜택이 나에게만)</td></tr>\n<tr><td>부담주체</td><td><strong>공부담 교육비</strong></td><td>국가·지자체·학교법인 등이 부담</td></tr>\n<tr><td></td><td><strong>사부담 교육비</strong></td><td>학부모가 부담</td></tr>\n</table></div>"},{"id":"admin-73","name":"예산제도의 발전","items":[{"text":"품목별 예산제도(LIBS)","children":[{"text":"등장배경, 정의, 장단점","children":[]}]},{"text":"성과주의 예산제도(PBS)","children":[{"text":"등장배경, 정의, 장단점","children":[]}]},{"text":"기획 예산제도(PPBS)","children":[{"text":"등장배경, 정의, 장단점","children":[]}]},{"text":"영기준 예산제도(ZBBS)","children":[{"text":"등장배경, 정의, 장단점","children":[]}]},{"text":"예산제도 발전의 시대적 흐름","children":[]}],"explainHtml":"<div class=\"mn-table-wrap\"><table class=\"mn-table\">\n<tr><th>제도</th><th>등장 시기/배경</th><th>기본개념</th><th>장점</th><th>단점</th></tr>\n<tr><td><strong>품목별(항목별) 예산제도</strong>(LIBS)</td><td>1900년대 초, 미국 공무원의 예산 오남용 방지</td><td>지출대상을 인건비·시설비 등 품목별로 분류해 지출대상과 한계를 명확히 규정</td><td>분명한 책임소재, 예산 남용 방지</td><td>전체성과 파악 어려움, 탄력적 운영 어려움</td></tr>\n<tr><td><strong>성과주의 예산제도</strong>(PBS)</td><td>1950년대, 품목별 제도가 구매목적·전체성과 파악이 어려운 것을 보완</td><td>목표·활동별로 분류, 단위원가×업무량으로 예산액을 미리 표시해 성과를 평가·반영</td><td>사업 이해 쉬움, 생산성 향상 유도</td><td>많은 시간·노력, 수량화 어려운 사업에 적용 한계</td></tr>\n<tr><td><strong>기획(계획) 예산제도</strong>(PPBS)</td><td>1960년대, 제2차 세계대전 후 미국의 대규모 자원 효율화 필요</td><td>장기계획(Planning) 수립 → 자원 구조화(Programming) → 예산 편성(Budgeting), 5년 정도의 장기 목표 고려</td><td>자원의 합리적 배분, 의사결정의 일원화</td><td>중앙집권적 성향 초래, 구성원 갈등</td></tr>\n<tr><td><strong>영기준 예산제도</strong>(ZBBS)</td><td>1970~80년대, 성과주의·기획 예산제도의 단점 보완</td><td>전년도를 고려하지 않고 매 회계연도마다 모든 사업을 <strong>제로(0)</strong>에서 재검토</td><td>합리적 예산분배, 재원 낭비 최소화</td><td>많은 시간·노력 요구, 비협조적 풍토 야기 가능</td></tr>\n</table></div>"},{"id":"admin-74","name":"단위학교 예산(회계)제도(SBBS)","items":[{"text":"등장배경","children":[]},{"text":"정의","children":[]},{"text":"일상경비와 도급경비의 구분","children":[]},{"text":"특징(7가지)","children":[{"text":"학교회계연도","children":[]},{"text":"예산배부방식","children":[]},{"text":"예산배부시기","children":[]},{"text":"잔액 처리","children":[]},{"text":"회계장부","children":[]},{"text":"세출예산편성","children":[]},{"text":"시설사용료 처리","children":[]}]},{"text":"학교의 주요 세입","children":[]},{"text":"학교의 주요 세출","children":[]},{"text":"장점","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>등장배경</h4><p>학교 예산을 도급경비·일상경비 등으로 각각 분리 배부하던 기존 방식은 회계연도·법규가 달라 비효율적이었음 → 이를 보완하기 위해 도입.</p></div>\n<div class=\"mn-block\"><h4>기본개념</h4><p>단위학교 책임경영이 강조되며 도입, 교장이 예산과정의 중심 역할을 담당하는 단위학교 중심의 분권화된 예산제도. 국공립 초·중·고·특수학교에서 실시(사립 제외).</p></div>\n<h4>일상경비 vs 도급경비</h4>\n<div class=\"mn-table-wrap\"><table class=\"mn-table\">\n<tr><th>구분</th><th>정의</th><th>예</th></tr>\n<tr><td>일상경비</td><td>교육청이 세부 항목별로 예산을 편성, 사용목적이 분명히 정해짐</td><td>교직원 인건비, 시설비(냉난방), 여비(출장비)</td></tr>\n<tr><td>도급경비(‘사업비’)</td><td>학교가 자율적으로 운용할 수 있도록 총액 지급</td><td>행정보조원 인건비, 급식실 운영비, 환경개선비</td></tr>\n</table></div>\n<div class=\"mn-block\"><h4>특징 (7)</h4><p>학교회계연도(<strong>3월 1일~다음 해 2월 말일</strong>, 학년도와 일치) / 예산배부방식(일상·도급 구분 없이 <strong>총액 배부</strong>, 자율 편성) / 예산배부시기(회계연도 개시 50일 전 통보) / 잔액(다음 회계연도로 이월 가능) / 회계장부(여러 자금을 학교회계로 통합·단일화) / 세출예산편성(자율적 편성) / 학교시설 사용료·수수료(학교 자체 수입으로 처리)</p></div>\n<div class=\"mn-block\"><h4>학교의 주요 세입 (5)</h4><p>국가/지자체 교육비특별회계 전입금 / <strong>학교발전기금</strong> 전입금 / 학교운영위원회 심의를 거친 학부모 부담 경비 / 국가·지자체 보조금·지원금 / 시설사용료·수수료·이월금 등</p></div>\n<div class=\"mn-tip\">💡 [학교 현장 상식] <strong>학교발전기금</strong>은 학교운영위원회 위원장 명의로 운영되며, 학교시설 보수·교육기자재 구매·체육활동 지원 등에 쓰이지만 교직원 복지비나 방과후학교·급식비(수익자 부담 경비) 등에는 사용할 수 없습니다.</div>\n<div class=\"mn-block\"><h4>학교의 주요 세출 (5)</h4><p>인건비(교직원·일용직) / 학교운영비(학생복리비·교수학습 활동비) / 일반운영비(전기세·시설유지보수) / 수익자부담경비(현장학습·급식·수학여행 등) / 예비비</p></div>\n<div class=\"mn-block\"><h4>장점 (3)</h4><p>효율적 운영(세입·세출 일원화) / 투명성·신뢰성 향상(교사·학부모 참여) / 교육의 질 향상(자율적 예산운영)</p></div>"},{"id":"admin-75","name":"학교의 재구조화","items":[{"text":"정의","children":[]},{"text":"재구조화의 종류(4가지)","children":[]},{"text":"재구조화를 위한 방안","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>기본개념</h4><p>학교 조직의 효율성을 증대하기 위해 기존의 학교 공간과 운영 방식을 개선해 미래 사회에 적합한 교육을 실현하기 위한 노력. <em>현장에서는 ‘그린스마트 미래학교’, ‘공간혁신’ 등으로 불립니다.</em></p></div>\n<div class=\"mn-block\"><h4>재구조화의 종류 (4)</h4><p>학교공간 재구조화(교실·복도·도서관 등 개조) / 교육과정 재구조화(융합·개방형 전환, 예: 고교학점제) / 학교운영 재구조화(구성원 참여·협력 확대, 예: 학운위·학생자치회 권한 확대) / 학교업무 재구조화(비효율적 행정업무 체계 개선)</p></div>\n<div class=\"mn-block\"><h4>재구조화를 위한 방안 (4)</h4><p>지역사회·학부모의 참여 / 단위학교 경영체제 구축(학운위 등) / 교사의 권한 증대 / 개방형 교실환경 구축</p></div>"},{"id":"admin-76","name":"학교운영위원회","items":[{"text":"정의","children":[]},{"text":"설립취지","children":[]},{"text":"위원의 성격(국공립 심의기구, 사립 자문기구)","children":[]},{"text":"위원의 구성 비율","children":[]},{"text":"위원의 선출 및 자격","children":[]},{"text":"위원의 임기","children":[]},{"text":"위원의 기능","children":[{"text":"심의기능","children":[]},{"text":"심의의결기능(학교발전기금)","children":[]}]},{"text":"장점","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>기본개념</h4><p>학교 운영에 관한 의사결정에 학부모·교원·지역사회 인사가 함께 참여함으로써 학교 정책결정의 민주성·합리성을 확보하고 교육목표를 효율적으로 달성하기 위한 의사결정 기구.</p></div>\n<div class=\"mn-block\"><h4>설립취지 (3)</h4><p>학교자치 실현 / 학교공동체의 책무성 증대 / 수요자 중심 교육</p></div>\n<div class=\"mn-block\"><h4>위원의 성격 (2)</h4><p>모든 초·중·고·특수학교에 설치해야 하는 독립된 <strong>법정기구</strong>. <strong>국공립학교는 심의기구</strong>, <strong>사립학교는 자문기구</strong></p></div>\n<div class=\"mn-block\"><h4>위원의 구성</h4><p>5명 이상~15인 이내(학교규모·학생수 고려). 학부모위원(40~50%), 교원위원(30~40%), 지역사회위원(10~30%)</p></div>\n<div class=\"mn-block\"><h4>위원의 선출 및 자격</h4><p>학부모위원(재학생 학부모 중 선출) / 교원위원(당연직 교장 제외, 교직원 전체회의 무기명투표로 선출, <strong>위원장·부위원장 불가</strong>) / 지역위원(학부모·교원위원의 추천을 받아 무기명투표로 선출)</p></div>\n<div class=\"mn-block\"><h4>위원의 임기</h4><p>위원 2년(1회 연임 가능), 위원장·부위원장 1년(연임 가능)</p></div>\n<div class=\"mn-block\"><h4>위원의 기능</h4><p>1. <strong>심의기능</strong>: 학칙 제·개정, 예산·결산, 교육과정 운영방법, 교육자료 선정, 학교급식, 시설관리 등<br>2. <strong>심의의결기능</strong>: <strong>학교발전기금</strong> 사용에 관한 사항(위원장 명의로 조성·운영). 교장이 심의 결과와 다르게 시행하려면 학운위와 관할청에 서면 보고 필요</p></div>\n<div class=\"mn-block\"><h4>장점 (3)</h4><p>학교 의사결정 과정의 민주성 증진 / 단위학교의 자율성·책무성 강화 / 수요자 중심의 학교 운영 가능</p></div>"},{"id":"admin-77","name":"학교 교육과정위원회","items":[{"text":"정의","children":[]},{"text":"구성원","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>기본개념</h4><p>학교 교육과정 편성 및 운영에 관한 사항을 심의·자문하는 위원회. 학교 교육계획서 수립, 교육과정 편성, 교과서 선정, 학사 운영 등을 협의. <strong>구성원</strong>: 교장/교감/부장교사/교사 일부</p></div>\n<div class=\"mn-tip\">💡 [학교 현장 상식] <strong>학교교육계획서</strong>는 학년별 연간교육계획을 담은 문서로, 교육목표·교육과정 편성·연간 수업일수·창의적체험활동·평가운영방법·학생생활규정 등 학교 운영의 거의 모든 내용을 포함합니다. 매년 2월 말~3월 초 작성해 책자로 비치하고 학교 홈페이지에도 공개됩니다.</div>"},{"id":"admin-78","name":"교과 협의회와 교사 협의회","items":[{"text":"정의 비교","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>교과 협의회</h4><p>같은 교과목(전공)을 가르치는 교사들이 모여 교육과정 운영·교수학습 방법·평가 방법 등을 협의하는 회의.<br><strong>교사 협의회</strong>: 교과 운영상 여러 논점을 협의하기 위한 회의.</p></div>"}]},{"title":"9. 기타","theories":[{"id":"admin-79","name":"교직관","items":[{"text":"정의","children":[]},{"text":"종류(4가지)","children":[{"text":"성직관","children":[]},{"text":"노동직관","children":[]},{"text":"전문직관","children":[]},{"text":"공직관","children":[]}]}],"explainHtml":"<div class=\"mn-block\"><h4>개념</h4><p>교직의 본질과 성격을 어떻게 파악·이해하느냐에 관한 관점. 교사의 교육관과 직결되어 실제 교육에 큰 영향을 미침. 네 가지 관점은 서로 겹치지 않으며 상호공존.</p></div>\n<h4>종류 (4)</h4>\n<div class=\"mn-table-wrap\"><table class=\"mn-table\">\n<tr><th>관점</th><th>내용</th></tr>\n<tr><td>성직관</td><td>성직자가 교직을 담당했던 데서 유래, 교직을 성직으로 봄 — 사랑·헌신·희생·봉사정신 강조</td></tr>\n<tr><td>노동직관</td><td>교직은 노동직의 하나, 교사는 노동을 제공한 대가로 보수를 받는 노동자 — 근로기준법상 권리를 대등하게 누려야 함</td></tr>\n<tr><td><strong>전문직관</strong></td><td>성직관+노동직관을 합친 것 — 봉사정신+전문적 지식·기술 모두 필요, 고도의 지적 능력·장기간 전문교육·엄격한 자격 제한</td></tr>\n<tr><td>공직관</td><td>국가공무원법에 근거, 국공립·사립 학교 모든 교원이 공직의무·법령에 충실해야 함</td></tr>\n</table></div>"},{"id":"admin-80","name":"교육자치제도","items":[{"text":"정의","children":[]},{"text":"원리(4가지)","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>개념</h4><p>교육행정의 지방분권을 통해 주민의 참여의식을 높이고 지역 실정에 맞는 교육정책을 실시함으로써 자주성·전문성·정치적 중립성을 확보하려는 제도.</p></div>\n<div class=\"mn-block\"><h4>원리 (4)</h4><p>지방분권의 원리(권한을 지방에 분산) / 주민 통제의 원리(지역주민 대표를 통한 심의·운영) / 교육 자주성의 원리(정치·종교 중립, 일반 행정으로부터 분리) / 전문적 관리의 원리(교육 전문가에 의한 운영)</p></div>"},{"id":"admin-81","name":"행정조직의 원리","items":[{"text":"3가지 원리","children":[{"text":"기능적 분업의 원리","children":[]},{"text":"적도집권의 원리","children":[]},{"text":"조정의 원리","children":[]}]}],"explainHtml":"<div class=\"mn-block\"><h4>원리 (3)</h4><p>기능적 분업의 원리(업무를 성질별로 구분해 분담) / 적도집권의 원리(중앙집권과 분권 사이의 적절한 균형) / 조정의 원리(업무 수행 조절과 조화로운 인간관계로 협동 효과를 극대화)</p></div>"},{"id":"admin-82","name":"학급경영","items":[{"text":"정의","children":[]},{"text":"학급경영의 관점(3가지)","children":[]},{"text":"학급경영의 원리(4가지)","children":[]},{"text":"학급경영의 평가(주체 및 영역)","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>기본개념</h4><p>담임교사가 교육목표를 달성하기 위해 학급 내에서 실행하는 모든 활동. 주목적은 <strong>생활지도</strong>와 <strong>교수학습의 촉진</strong>.</p></div>\n<div class=\"mn-block\"><h4>학급경영의 다양한 관점 (3, Johnson &amp; Brooks)</h4><p>질서유지로서의 학급경영(훈육·생활지도) / 조건정비로서의 학급경영(학습환경 조성) / 교육경영으로서의 학급경영(조직의 협동 활동)</p></div>\n<div class=\"mn-block\"><h4>학급경영의 원리(원칙) (4)</h4><p>1. 교육적 학급경영 — 학생의 전인적 성장이 목적, 자율성·책임감·협력·배려 증진에 초점<br>2. 학생이해의 학급경영 — 학생 개개인의 특성·요구를 고려한 유연한 경영<br>3. <strong>민주적 학급경영</strong> — 학급은 민주사회의 축소판, 학생의 참여·의사결정 존중<br>4. 효율적 학급경영 — 한정된 자원을 경제적으로 사용</p></div>\n<div class=\"mn-block\"><h4>학급경영의 평가</h4><p>학급경영의 발전과 담임교사의 성장을 위한 활동. <strong>평가는 담임교사 스스로</strong> 실시(단, 지도·조언용으로 학교장이 직접 할 수도 있음). 평가영역: 학습지도·생활지도·시설환경관리·교사활동(학부모·지역사회) 영역</p></div>"},{"id":"admin-83","name":"교원연수","items":[{"text":"종류","children":[{"text":"직무연수","children":[]},{"text":"자격연수","children":[]},{"text":"의무연수","children":[]},{"text":"41조연수","children":[]},{"text":"자율연수","children":[]}]},{"text":"종류별 정의 및 특징","children":[]}],"explainHtml":"<div class=\"mn-tip\">💡 [학교 현장 상식] 임용 후 실제로 부딪히게 되는 연수 종류입니다. 필수 연수는 학교에서 안내하지만 나머지는 스스로 챙겨야 하는 경우가 많습니다.</div>\n<div class=\"mn-table-wrap\"><table class=\"mn-table\">\n<tr><th>연수</th><th>정의</th><th>비고</th></tr>\n<tr><td><strong>직무연수</strong></td><td>직무를 수행하는 데 필요한 능력을 향상하기 위한 연수</td><td>이수 장소: 교육청 인정 온·오프라인(티처빌, 아이스크림 연수원 등). 보통 연간 60시간 이상(시도교육청마다 다름), 의무 미이수 시 인사 불이익 가능</td></tr>\n<tr><td><strong>자격연수</strong></td><td>특정 직무 수행에 필요한 자격을 취득하기 위한 연수</td><td>예: 1급 정교사, 수석교사, 교감, 교장 자격연수. 최근 승진 관련 점수제가 P/F로 변경됨</td></tr>\n<tr><td><strong>의무연수</strong></td><td>교직원 누구나 필수로 들어야 하는 연수</td><td>예: 생활기록부 연수, 학교폭력 예방교육, 아동학대 예방교육 등. 주로 교내에서 단체로 실시</td></tr>\n<tr><td><strong>41조연수</strong></td><td>교육공무원법 41조에 근거, 방학·재량휴업 등 특별한 상황에서 학교 밖 장소에서 근무하는 것으로 인정되는 연수</td><td>나이스(NEIS)로 제출</td></tr>\n<tr><td><strong>자율연수</strong></td><td>개인적인 이유로 듣는 모든 연수</td><td>예: 토익, 컴활, 한국사능력검정 등. 특별한 제약 없음, 학교 지원 가능한 경우도 있음</td></tr>\n</table></div>"}]}]}],"flat":[{"id":"curriculum-1","name":"교육과정 유형 분류체계","items":[{"text":"공식화 정도에 따른 분류","children":[{"text":"표면적(공식적) 교육과정","children":[]},{"text":"잠재적(비공식적) 교육과정","children":[]},{"text":"영 교육과정","children":[]}]},{"text":"진행과정에 따른 분류","children":[{"text":"계획된(의도된, 문서화된) 교육과정","children":[]},{"text":"실행된(전개된, 가르친) 교육과정","children":[]},{"text":"경험된(실현된, 학습성과로서의) 교육과정","children":[]}]},{"text":"결정주체에 따른 분류","children":[{"text":"국가수준 교육과정","children":[]},{"text":"지역수준 교육과정","children":[]},{"text":"학교수준 교육과정","children":[]},{"text":"교실수준 교육과정","children":[]}]}],"domainId":"curriculum","domainLabel":"교육과정","sectionTitle":"Ⅰ. 교육과정의 유형","explainHtml":"<div class=\"mn-block\"><h4>관련 분류 체계</h4><p>- 공식화 정도: 표면적(공식적) / 잠재적(비공식적) / 영 교육과정<br>- 수준·진행과정: 계획된(의도된, 문서화된) / 실행된(전개된, 가르친) / 경험된(실현된, 학습성과로서의) 교육과정<br>- 결정주체: 국가수준 / 지역수준 / 학교수준 / 교실수준 교육과정</p></div>"},{"id":"curriculum-2","name":"교과중심 교육과정","items":[{"text":"정의","children":[]},{"text":"등장배경","children":[{"text":"진보주의자들이 이전 교육과정을 통칭하며 생긴 용어","children":[]},{"text":"전통주의 교육과정이라는 별칭","children":[]}]},{"text":"이론적 근거: 형식도야설","children":[{"text":"능력심리학에 근거","children":[]},{"text":"일반 정신능력 훈련을 통한 전이","children":[]}]},{"text":"특징","children":[{"text":"교육목표: 문화유산의 체계적 전달","children":[]},{"text":"교육내용: 교과의 논리에 따른 선정·조직","children":[]},{"text":"교육방법: 교사중심 강의식 수업","children":[]}]},{"text":"장점","children":[{"text":"평가의 용이성","children":[]},{"text":"통제의 용이성","children":[]},{"text":"전달의 용이성","children":[]}]},{"text":"단점","children":[{"text":"학생 흥미 저하","children":[]},{"text":"수동적 학습 태도","children":[]},{"text":"고등정신능력 저하","children":[]}]},{"text":"조직유형","children":[{"text":"분과형","children":[]},{"text":"상관형","children":[]},{"text":"융합형","children":[]},{"text":"광역형","children":[]}]},{"text":"학문중심 교육과정과의 비교","children":[]}],"domainId":"curriculum","domainLabel":"교육과정","sectionTitle":"Ⅰ. 교육과정의 유형","explainHtml":"<div class=\"mn-block\"><h4>등장배경</h4><p>특정 학자가 만든 이론이 아니라, 1920년 이전까지 서양(7자유학과: 문법·수사학·논리학·산수·기하·천문·음악)과 동양(6예)에서 전통적으로 가르쳐 온 교과목 편성 방식을 가리키는 말. 1920년대 진보주의자들이 자신들의 경험중심 교육과정을 정당화하기 위해 그 이전의 모든 교육과정을 “교과중심”으로 통칭하면서 이 용어가 생겼다. (그래서 “전통주의 교육과정”이라고도 함)</p></div>\n<div class=\"mn-block\"><h4>기본개념(정의)</h4><p>학생들이 배우고 익혀야 하는 모든 교과와 교재를 논리적·체계적으로 구성하여 학습효과를 극대화하는 교육과정.</p></div>\n<div class=\"mn-block\"><h4>특징 (4)</h4><p>— 이론적 근거·교육목표·교육내용·교육방법<br>1. [이론적 근거] <strong>형식도야설</strong>(일반 정신능력(기억력·추리력·주의력·상상력)을 훈련하면 전이가 잘 된다는 설. 능력심리학에 근거)에서 근거를 찾음<br>2. [교육목표] 인류가 축적한 문화유산을 다음 세대에 체계적으로 전달, 인간을 사회적 존재로 만드는 것<br>3. [교육내용] 교과의 논리에 따라 문화유산을 선정·조직<br>4. [교육방법] 교사중심의 강의식 수업</p></div>\n<div class=\"mn-block\"><h4>장점 (3)</h4><p>- 평가가 쉬움(객관적 기준) / 통제가 쉬움(교사 주도) / 전달이 쉬움(체계적 조직)</p></div>\n<div class=\"mn-block\"><h4>단점 (3)</h4><p>- 학생 흥미 저하 / 수동적 학습 태도 / 고등정신능력(비판력·창의성) 저하</p></div>\n<h4>조직유형 (4)</h4>\n<div class=\"mn-table-wrap\"><table class=\"mn-table\">\n<tr><th>유형</th><th>정의</th></tr>\n<tr><td>분과형</td><td>교과를 완전히 독립적으로 가르침 (개별 성격 유지)</td></tr>\n<tr><td>상관형</td><td>교과 간 관련 있는 공통 내용을 가르침 (개별 성격 유지)</td></tr>\n<tr><td>융합형</td><td>교과 간 공통 개념을 추출해 새 교과로 융합 (간학문적 통합, 개별 성격 약화)</td></tr>\n<tr><td>광역형</td><td>융합형보다 더 넓은 범위에서 유사 과목을 하나로 통합 (다학문적 통합, 개별 성격 유지)</td></tr>\n</table></div>\n<div class=\"mn-note\"><strong>시험 팁</strong>: 조직유형별 장단점을 따로 외울 필요 없음 — ③④번 장단점을 그대로 활용.</div>"},{"id":"curriculum-3","name":"경험중심 교육과정","items":[{"text":"정의","children":[]},{"text":"등장배경","children":[{"text":"진보주의·실용주의에 토대","children":[]},{"text":"국내 도입 시기(제2차 교육과정)","children":[]}]},{"text":"특징","children":[{"text":"교육목표: 전인교육·문제해결능력","children":[]},{"text":"교육내용: 학습자 흥미·실생활 문제 중심","children":[]},{"text":"교육방법: 학생의 능동적 활동","children":[]}]},{"text":"장점","children":[{"text":"능동적 활동 촉진","children":[]},{"text":"문제해결력 향상","children":[]},{"text":"사고력·표현력 향상","children":[]}]},{"text":"단점","children":[{"text":"기초학력 저하","children":[]},{"text":"경제성 저하","children":[]},{"text":"유능한 교사 의존성","children":[]}]},{"text":"조직유형","children":[{"text":"활동중심","children":[]},{"text":"생활영역","children":[]},{"text":"생성(현성) 교육과정","children":[]},{"text":"중핵 교육과정","children":[]}]},{"text":"인간중심 교육과정과의 비교","children":[]}],"domainId":"curriculum","domainLabel":"교육과정","sectionTitle":"Ⅰ. 교육과정의 유형","explainHtml":"<div class=\"mn-block\"><h4>등장배경</h4><p>1920년대 미국에서 학생들의 문제해결력 부족이 사회문제로 대두 → 진보주의자들이 교과중심을 비판하며 등장. 실용주의·진보주의에 토대. 우리나라는 1963년 제2차 교육과정 시기 도입.</p></div>\n<div class=\"mn-block\"><h4>기본개념 (1920~1950년대)</h4><p>학습자가 교육의 중심이 되어, 학교의 지도하에 학생들이 가지게 되는 모든 경험과 활동으로 구성된 교육과정.</p></div>\n<div class=\"mn-block\"><h4>특징 (3)</h4><p>1. [교육목표] 개인·사회를 동시에 중시 → 전인교육, 문제해결능력 향상<br>2. [교육내용] 실생활 문제 해결에 도움될 때만 가치 인정 → 학습자의 흥미·실생활 문제 중심 조직<br>3. [교육방법] 학생의 능동적 활동 강조, 학습자 중심</p></div>\n<div class=\"mn-block\"><h4>장점 (3)</h4><p>- 능동적 활동 촉진 / 문제해결력 향상 / 사고력·표현력 향상</p></div>\n<div class=\"mn-block\"><h4>단점 (3)</h4><p>- 기초학력 저하 / 경제성 저하(운영에 많은 시간) / 유능한 교사만 운영 가능</p></div>\n<h4>조직유형 (4)</h4>\n<div class=\"mn-table-wrap\"><table class=\"mn-table\">\n<tr><th>유형</th><th>정의</th><th>예</th></tr>\n<tr><td>활동중심</td><td>학생의 흥미·요구에 따른 활동</td><td>프로젝트법, 동아리</td></tr>\n<tr><td>생활영역</td><td>개인 생활의 모든 영역에서 참여 경험 확장</td><td>현장체험학습, 직업체험</td></tr>\n<tr><td>생성(현성)</td><td>사전 계획 없이 교사·학생이 현장에서 함께 만듦</td><td>만들어가는 교육과정</td></tr>\n<tr><td>중핵</td><td>학생 흥미·요구 또는 사회문제를 중심에 두고 주변 내용을 통합</td><td>깨끗한 우리 동네 만들기</td></tr>\n</table></div>\n<div class=\"mn-note\"><strong>혼동 포인트</strong>: 생성·중핵 교육과정은 경험중심의 하위유형이므로, 이들의 장단점을 물으면 경험중심의 장단점을 그대로 활용하면 됨(별도 암기 불필요).</div>"},{"id":"curriculum-4","name":"학문중심 교육과정","items":[{"text":"정의","children":[]},{"text":"학자: 브루너","children":[]},{"text":"등장배경","children":[{"text":"경험중심 교육과정의 부작용","children":[]},{"text":"스푸트니크 발사 충격","children":[]},{"text":"저서 『교육의 과정』","children":[]}]},{"text":"특징","children":[{"text":"교육목표: 지식의 구조 이해·탐구","children":[]},{"text":"교육내용: 지식의 구조","children":[]},{"text":"교육방법: 발견학습(탐구학습)","children":[]},{"text":"교육과정 조직형태: 나선형 교육과정","children":[]}]},{"text":"브루너의 대담한 가설","children":[]},{"text":"지식의 구조를 표현하는 3가지 표현양식","children":[{"text":"행동적(작동적) 표현양식","children":[]},{"text":"영상적(구체적) 표현양식","children":[]},{"text":"상징적 표현양식","children":[]}]},{"text":"장점","children":[{"text":"높은 학습 전이","children":[]},{"text":"내재적 동기 향상","children":[]},{"text":"교육의 질 향상","children":[]}]},{"text":"단점","children":[{"text":"정의적 교육 소홀","children":[]},{"text":"상위권 학습자 편중","children":[]},{"text":"학습환경 조성의 어려움","children":[]}]},{"text":"교과중심 교육과정과의 차이","children":[]}],"domainId":"curriculum","domainLabel":"교육과정","sectionTitle":"Ⅰ. 교육과정의 유형","explainHtml":"<div class=\"mn-block\"><h4>등장배경</h4><p>경험중심 교육과정의 부작용(지식교육 소홀) + 1957년 소련 스푸트니크 발사 충격 → 미국의 교육과정 개편 요구. 1959년 브루너가 주도한 세미나 결과물인 저서 『교육의 과정(The Process of Education, 1960)』이 기반. 우리나라는 1973년 제3차 교육과정에 반영.</p></div>\n<div class=\"mn-block\"><h4>학자</h4><p>제롬 브루너(Jerome Bruner, 1915~2016, 미국 교육심리학자, 하버드대)</p></div>\n<div class=\"mn-block\"><h4>기본개념 (1950~1960년대)</h4><p>각 학문의 핵심적 지식과 원리를 체계적으로 조직하여 학생들이 지식의 구조를 이해·탐구하는 능력을 기르는 것이 목표.</p></div>\n<div class=\"mn-block\"><h4>특징 (4)</h4><p>1. [교육목표] 교과 내 핵심 지식·원리 습득, 탐구능력 향상<br>2. [교육내용] <strong>지식의 구조</strong> — 각 분야의 가장 중요한 기본원리·핵심아이디어를 논리적으로 체계화한 것<br>3. [교육방법] 발견학습(탐구학습) — 교사 지시 최소화, 학생 스스로 발견<br>4. [교육과정 조직형태] <strong>나선형 교육과정</strong> — 발달단계를 고려해 기본개념·원리를 반복하며 폭과 깊이를 점진적으로 확대·심화 (달팽이 껍질 모양)</p></div>\n<div class=\"mn-block\"><h4>핵심 부속 개념</h4><p>- <strong>브루너의 대담한 가설</strong>: 어떤 교과 내용도 아동의 인지구조에 적합하게 제시하면 어떤 발달단계의 아동에게도 효과적으로 가르칠 수 있다.<br>- <strong>지식의 구조를 표현하는 3가지 표현(표상) 양식</strong>, 인지발달에 따라 순서대로 제시<br>1. 행동적(작동적) 표현양식 — 신체적 동작으로 표현 (예: 시소놀이를 직접 해봄)<br>2. 영상적(구체적) 표현양식 — 그림·모형으로 표현<br>3. 상징적 표현양식 — 글·수식·기호로 표현 (예: 힘f×거리a = 힘w×거리b)</p></div>\n<div class=\"mn-block\"><h4>장점 (3)</h4><p>- 높은 학습 전이 가능 / 내재적 동기 향상(발견학습) / 교육의 질 향상(사고력·이해력)</p></div>\n<div class=\"mn-block\"><h4>단점 (3)</h4><p>- 정의적 교육 소홀 / 상위권 학습자에게만 유리 / 학습환경 조성의 어려움</p></div>\n<div class=\"mn-note\"><strong>혼동 포인트(교과중심 vs 학문중심)</strong>: 둘 다 지식을 강조하지만, 교과중심은 교사가 주입해 암기시키는 것을 지향한 반면 학문중심은 학생이 스스로 지식의 구조를 발견하는 것을 지향. 차이는 ‘지식의 구조 제시’ + ‘학습자 스스로 발견’.<br>참고: 여기서 나오는 “테일러”는 타일러(Ralph <strong>Ty</strong>ler, 교육과정)와 다른 인물로, 프레더릭 윈슬로 <strong>Ta</strong>ylor(과학적 관리법 창시자, 교육행정)를 가리킴. 보비트 항목에서 다시 등장.</div>"},{"id":"curriculum-5","name":"인간중심(인본주의) 교육과정","items":[
