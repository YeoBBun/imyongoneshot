v>\n<div class=\"mn-table-wrap\"><table class=\"mn-table\">\n<tr><th>순서</th><th>학습자의 내적과정</th><th>수업사태(외적사태)</th><th>설명</th></tr>\n<tr><td>1</td><td>주의집중</td><td>주의집중 획득</td><td>학습자의 주의력을 확보 (예: 질문한다)</td></tr>\n<tr><td>2</td><td>기대</td><td>학습목표 제시</td><td>수업 후 얻게 될 결과를 명확히 알려 기대·동기 향상</td></tr>\n<tr><td>3</td><td>장기기억→단기기억 정보인출</td><td>선수학습회상</td><td>새 학습 전 이전 학습내용을 확인</td></tr>\n<tr><td>4</td><td>선택적 지각</td><td>자극자료 제시</td><td>(새로운 정보) 학습할 내용을 제시, 학습자는 선택적 지각으로 작동기억에 저장 (예: 예시·사례·영상·밑줄긋기·시범)</td></tr>\n<tr><td>5</td><td>의미의 부호화</td><td>학습안내 제공</td><td>(이미 알던 내용) 학습한 내용을 종합·상관관계 제시해 장기기억을 도움 (도표·규칙·순서도 = 스캐폴딩)</td></tr>\n<tr><td>6</td><td>반응</td><td>수행유도</td><td>학습한 내용을 유사한 실제 문제 상황에 적용 (예: 연습문제·숙제·실험)</td></tr>\n<tr><td>7</td><td>강화</td><td>피드백 제공</td><td>성공적이면 칭찬, 아니면 재학습 기회+피드백</td></tr>\n<tr><td>8</td><td>재생과 파지</td><td>성취행동 평가</td><td>수업목표 달성 여부를 성취수준으로 평가(단순암기가 아닌 수행평가 권장)</td></tr>\n<tr><td>9</td><td>일반화</td><td>파지 및 전이 증진</td><td>연습 기회를 계속 제공해 파지(장기기억 저장)와 전이(다른 상황 적용)를 증진</td></tr>\n</table></div>\n<div class=\"mn-tip\">💡 4단계(자극자료 제시→선택적 지각)와 5단계(학습안내 제공→의미의 부호화)를 구분하는 핵심은 “<strong>학생이 그 내용을 이전에 배운 적이 있는가</strong>”입니다. 처음 보는 새 정보라면 4단계(자극자료 제시), 이미 배운 내용을 정리·비교·연결하는 것이면 5단계(학습안내 제공)입니다.</div>"},{"id":"method-9","name":"가네의 수업목표(5가지 학습결과)","items":[{"text":"5가지 수업목표","children":[{"text":"언어정보","children":[]},{"text":"지적기능","children":[]},{"text":"인지전략","children":[]},{"text":"태도","children":[]},{"text":"운동기능","children":[]}]},{"text":"목표별 효과적 과제분석방법","children":[]},{"text":"지적기능의 학습위계(변별학습~문제해결학습)","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>기본개념</h4><p>가네는 수업목표(학습의 결과, learning outcomes)를 5가지로 구분하고 각 영역에 맞는 교수방법·전략을 제시.</p></div>\n<h4>5가지 수업목표 및 학습과제 분석 방법</h4>\n<div class=\"mn-table-wrap\"><table class=\"mn-table\">\n<tr><th>목표</th><th>정의</th><th>예</th><th>효과적 과제분석방법</th><th>효과적 학습방법</th></tr>\n<tr><td>언어정보</td><td>사실·개념·원리·법칙 등 지식 습득 (명제적/선언적 지식)</td><td>영문법, 역사지식, 수학공식</td><td>군집분석(위계관계 없는 학습과제를 서로 관련 있는 것끼리 묶음)</td><td>청킹, 선행조직자 제시</td></tr>\n<tr><td>지적기능</td><td>문제해결·추론·판단·의사결정 등 지적 능력 (방법적/절차적 지식)</td><td>삼각함수 푸는 법</td><td>위계분석(난이도 낮은 것→높은 것으로 구조화)</td><td>개념학습, 문제해결학습</td></tr>\n<tr><td>인지전략</td><td>학습·사고·과제 해결에 필요한 전략 습득</td><td>단어암기법, 시간관리법</td><td>(과제분석 방법 없음)</td><td>학습전략 설명·토론</td></tr>\n<tr><td>태도</td><td>특정 대상·상황에 대한 개인적 성향 형성·변화</td><td>건강관·환경보호 태도</td><td>통합분석(군집+위계+절차 혼합)</td><td>관찰학습, 시범</td></tr>\n<tr><td>운동기능</td><td>신체 조작 능력 습득</td><td>악기연주, 수영</td><td>절차분석(먼저/나중 수행 순서 분석)</td><td>반복학습, 시범</td></tr>\n</table></div>\n<div class=\"mn-block\"><h4>지적기능의 형태에 따른 학습순서(쉬운 것→어려운 것)</h4><p>변별학습(대상 간 속성 구별) → 구체적 개념학습(외형적 특성 분류) → 정의적 개념학습(합의된 정의로 분류) → 원리(법칙) 학습(개념 간 관계 이해) → 문제해결 학습(원리로 새 문제 해결)</p></div>"},{"id":"method-10","name":"메릴의 내용-요소 제시이론(CDT)","items":[{"text":"등장배경","children":[]},{"text":"정의(내용-요소, 수행수준)","children":[]},{"text":"특징","children":[{"text":"미시적 교수설계이론","children":[]},{"text":"처방적 수업설계모형","children":[]}]},{"text":"내용×수행 행렬표","children":[{"text":"내용차원(사실·개념·절차·원리)","children":[]},{"text":"수행차원(기억하기·활용하기·발견하기)","children":[]}]},{"text":"교수방법(자료제시형태)","children":[{"text":"1차 제시형","children":[]},{"text":"2차 제시형","children":[]}]},{"text":"라이겔루스 이론과의 관계(미시적 vs 거시적)","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>등장배경</h4><p>메릴은 1970년부터 교육 내용 분류법을 연구. 당시 쓰이던 <strong>가네의 일차원적 수업목표 분류</strong>로는 모든 교육 내용을 나누기에 한계가 있다고 보고, 이를 이차원적 분류체계로 업그레이드.</p></div>\n<div class=\"mn-block\"><h4>기본개념</h4><p>복잡한 학습내용을 낱개의 <strong>내용-요소</strong>(구성요소, Components)로 나누고, 그 학습의 <strong>수행수준</strong>(기억하기·활용하기·발견하기)을 결정한 다음, 각 내용에 적합한 수업방법을 제시(전시, Display)하는 교수설계이론.</p></div>\n<div class=\"mn-block\"><h4>특징 (3)</h4><p>- <strong>미시적 교수설계이론</strong> — 차시 수준의 매우 작은 수업 단위에서 낱개 요소를 가르침 (↔ 라이겔루스는 거시적)<br>- 처방적 수업설계모형 — 학습자가 수행할 학습활동을 구체적으로 제시<br>- 인지적 영역의 수업 설계에 효과적</p></div>\n<div class=\"mn-tip\">💡 메릴(미시적)과 라이겔루스(거시적)는 짝을 이루는 이론입니다. 메릴은 “낱개 개념 하나를 어떻게 가르칠까”를, 라이겔루스는 “여러 개념을 어떤 순서로 조직해서 하나의 큰 단원을 만들까”를 다룹니다.</div>\n<div class=\"mn-block\"><h4>내용×수행 행렬표 (4×3)</h4><p>- 내용차원(학습내용): 사실(임시로 연관된 단편정보) / 개념(공통 속성을 지닌 집합) / 절차(목적 달성에 필요한 단계·순서) / 원리(현상을 설명·예측하는 인과·상관관계)<br>- 수행차원(수행수준): 기억하기(저장된 정보 인출, ≈가네의 언어정보) / 활용하기(구체적 실제상황에 적용, ≈가네의 지적기능) / 발견하기(새로운 것을 찾아냄, ≈가네의 인지전략)<br>- 12개 조합 중 “사실×발견”과 “사실×활용” 두 칸은 이론적으로 성립하지 않음(사실은 발견·활용의 대상이 아니라 암기의 대상이므로)</p></div>\n<div class=\"mn-block\"><h4>교수방법(자료제시형태) (2)</h4><p>- <strong>1차 제시형(필수)</strong>: 학습목표 도달을 위한 최소한의 기본 형태. 설명식(교사가 개념·원리를 설명 / 사례를 설명) or 탐구식(질문으로 회상시킴 / 사례를 직접 찾아보게 함)<br>- <strong>2차 제시형(선택)</strong>: 부가적으로 효율성을 높이는 형태. 방법: 맥락제공·선수학습·암기법·도움말·표현법·피드백</p></div>"},{"id":"method-11","name":"라이겔루스의 교수설계이론","items":[{"text":"등장배경(가네·메릴과의 관계)","children":[]},{"text":"교수설계 3대 변인","children":[{"text":"교수의 조건","children":[]},{"text":"교수의 방법","children":[]},{"text":"교수의 결과","children":[]}]},{"text":"교수의 방법 하위요소","children":[{"text":"조직전략(미시적/거시적)","children":[]},{"text":"전달전략","children":[]},{"text":"관리전략","children":[]}]},{"text":"미시적 조직전략의 하위개념","children":[{"text":"전형 형성","children":[]},{"text":"변별","children":[]},{"text":"일반화","children":[]}]},{"text":"교수의 결과 하위요소(효과성·효율성·매력성·안정성)","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>등장배경</h4><p>가네는 교수 목표에 따라 다른 방법이 필요하다고 했지만 구체적 방법은 제시하지 않았음. 메릴이 미시적 관점에서 이 빈틈을 채웠다면, <strong>라이겔루스는 거시적 관점</strong>에서 채움.</p></div>\n<div class=\"mn-block\"><h4>기본개념(교수설계 3대 변인)</h4><p>교수설계의 3대 변인을 <strong>교수의 조건-교수의 방법-교수의 결과</strong>로 설정하고, 이들의 상호협력하에 처방적인 거시적 교수설계모형을 제시.</p></div>\n<div class=\"mn-block\"><h4>1) 교수의 조건(Conditions)</h4><p>교과내용·교과목표·학습자 특성·교수환경 등 설계자가 통제하기 어려운 제약조건. 완벽히 파악해야 함.</p></div>\n<div class=\"mn-block\"><h4>2) 교수의 방법(Methods)</h4><p>조직전략·전달전략·관리전략<br>- <strong>조직전략</strong>: 학습내용을 어떻게 계열화·수준별로 제시할지에 대한 전략<br>- <strong>미시적 조직전략</strong>(단일 개념 학습): 제시-연습-피드백<br>- 제시의 하위개념: <strong>전형 형성</strong>(대표적 예시를 통해 개념을 이해, 예: ’조류’하면 참새·비둘기를 떠올림) / <strong>변별</strong>(공통 속성을 가르쳐 개념에 속하는 것과 속하지 않는 것을 구분, 핵심은 <strong>결정적 속성</strong>을 가르치는 것) / <strong>일반화</strong>(가변적 속성을 반영한 다양한 사례로 새로운 예시에도 적용 가능한 원리를 파악)<br>- <strong>거시적 조직전략</strong>(복잡한 개념 학습): 정교화 교수이론(아래 5번 참고)<br>- <strong>전달전략</strong>: 학습내용을 어떻게 제시할 것인가<br>- <strong>관리전략</strong>: 학습내용을 언제 사용할 것인가</p></div>\n<div class=\"mn-block\"><h4>3) 교수의 결과(Outcomes)</h4><p>수업 후 학습자 반응. <strong>효과성</strong>(목표 달성 정도) / <strong>효율성</strong>(들인 노력·시간·비용, 적을수록 좋음) / <strong>매력성</strong>(흥미 정도) / <strong>안정성</strong>(정서적 안정, 정치·종교 비난 금지)</p></div>\n<div class=\"mn-block\"><h4>시사점</h4><p>교수의 조건과 결과에 따라 다른 교수전략을 사용해야 함</p></div>"},{"id":"method-12","name":"라이겔루스의 정교화 교수이론","items":[{"text":"정의(정수, 줌렌즈 방법)","children":[]},{"text":"교수전략(7가지)","children":[{"text":"정교화된 계열화","children":[]},{"text":"선수학습요소의 계열화","children":[]},{"text":"요약자 사용","children":[]},{"text":"종합자 사용","children":[]},{"text":"비유 활용","children":[]},{"text":"인지전략활성자 준비","children":[]},{"text":"학습자 통제방안 마련","children":[]}]},{"text":"정교화된 계열화의 3가지 방법","children":[{"text":"개념적 정교화","children":[]},{"text":"절차적 정교화","children":[]},{"text":"이론적 정교화","children":[]}]}],"explainHtml":"<div class=\"mn-block\"><h4>기본개념</h4><p>거시적 조직전략으로, 복합적인 여러 아이디어를 가르칠 때 개념·절차·원리 등 <strong>정수(Epitome, 가장 단순하면서도 대표성이 높은 핵심 요약)</strong>를 추출하고 단순한 것에서 복잡한 것으로 학습 내용을 조직하는 것. <strong>줌렌즈 방법</strong>에 비유: 전체개요를 개괄적으로 본 후(줌아웃) → 세분화해 상세히 살펴보고(줌인) → 다시 전체를 종합해 봄(줌아웃).</p></div>\n<h4>교수전략 (7가지)</h4>\n<div class=\"mn-table-wrap\"><table class=\"mn-table\">\n<tr><th>전략</th><th>내용</th></tr>\n<tr><td>1) 정교화된 계열화(단순→복잡)</td><td>정수를 추출한 뒤 단순한 것에서 복잡한 것으로 제시. 방법 3가지: <strong>개념적 정교화</strong>(일반적·포괄적 개념→상세·세부 개념 순), <strong>절차적 정교화</strong>(과정·절차를 계열화), <strong>이론적 정교화</strong>(기초적 원리→세부·복잡한 원리 순)</td></tr>\n<tr><td>2) 선수학습요소의 계열화</td><td>새 개념 전 반드시 학습해야 할 선수요소를 체계적으로 정리</td></tr>\n<tr><td>3) 요약자 사용</td><td>학습내용을 잊지 않도록 복습. 학습단원 요약자(각 단원 후) / 교과전체 요약자(학년말 총정리)</td></tr>\n<tr><td>4) 종합자 사용</td><td>이미 학습한 개별내용을 서로 연결해 통합. (방법: 전체 개념도, 통합적 예시 제시)</td></tr>\n<tr><td>5) 비유 활용</td><td>새 개념을 친숙한 정보로 연결 (예: 빛의 직진성을 화살에 비유)</td></tr>\n<tr><td>6) 인지전략활성자 준비</td><td>학습자가 능동적으로 학습하도록 인지전략(그림·도표·기억술)을 돕는 전략</td></tr>\n<tr><td>7) 학습자 통제방안 마련</td><td>학습내용·속도·전략을 학습자가 스스로 선택하도록 함</td></tr>\n</table></div>\n<div class=\"mn-tip\">💡 개념적 정교화 vs 이론적 정교화는 “개념(대상·현상을 이해하는 기본 단위)”과 “이론(개념들을 체계적으로 연결해 설명한 것)”의 차이입니다. 예: ’민주주의’라는 개념 자체를 단순→복잡으로 풀면 개념적 정교화, ’민주주의가 어떻게 작동하는가’라는 인과관계·원리를 단순→복잡으로 풀면 이론적 정교화입니다.</div>"},{"id":"method-13","name":"켈러의 ARCS 학습동기설계 이론","items":[{"text":"등장배경","children":[]},{"text":"정의","children":[]},{"text":"4요소 및 하위전략","children":[{"text":"주의집중(지각적 주의환기·탐구적 주의환기·다양성 전략)","children":[]},{"text":"관련성(친밀성·목적지향성·학습동기와의 부합 전략)","children":[]},{"text":"자신감(학습의 필요조건 제시·성공기회 제시·개인적 조절감 증대 전략)","children":[]},{"text":"만족감(내재적 강화·외재적 보상·공정성 강조 전략)","children":[]}]}],"explainHtml":"<div class=\"mn-block\"><h4>등장배경</h4><p>존 켈러(John M. Keller)는 기존 교수설계 이론들이 학습자의 인지적 측면(지식 이해)에만 초점을 맞추고 동기적 측면(욕구·가치)을 충분히 고려하지 못했다고 지적, 학습자가 흥미를 갖고 참여하도록 하는 설계 방법을 개발.</p></div>\n<div class=\"mn-block\"><h4>기본개념</h4><p>교수-학습 상황에서 동기 유발·유지를 위한 구체적이고 처방적인 전략을 제시하는 이론.</p></div>\n<h4>ARCS 방법 (4요소 및 하위전략)</h4>\n<div class=\"mn-table-wrap\"><table class=\"mn-table\">\n<tr><th>요소</th><th>하위전략</th><th>방법</th><th>예</th></tr>\n<tr><td><strong>주의집중</strong>(Attention)</td><td>지각적 주의환기 전략</td><td>시청각 자료 활용, 비일상적 내용 제시</td><td>그림·그래프·놀라운 통계</td></tr>\n<tr><td></td><td>탐구적 주의환기 전략</td><td>호기심 자극하는 질문·과제 제시</td><td>신기한 문제 제시</td></tr>\n<tr><td></td><td>다양성 전략</td><td>수업 요소를 변화시켜 흥미 유발</td><td>강의식+토론식 혼합</td></tr>\n<tr><td><strong>관련성</strong>(Relevance)</td><td>친밀성 전략</td><td>학습자의 경험과 친밀하게 관련</td><td>익숙한 인물·그림 제시</td></tr>\n<tr><td></td><td>목적지향성 전략</td><td>실용성에 중점을 둔 목표 제시</td><td>목표가 미래(취업·입시)와 연관됨을 인식</td></tr>\n<tr><td></td><td>학습동기와의 부합 전략</td><td>학습자 동기와 관련된 수업</td><td>다양한 수준의 목표를 스스로 선택</td></tr>\n<tr><td><strong>자신감</strong>(Confidence)</td><td>학습의 필요조건 제시 전략</td><td>필요조건·평가기준 제시로 성공기대감 향상</td><td>평가기준 미리 공지</td></tr>\n<tr><td></td><td>성공기회 제시 전략</td><td>수준에 맞는 과제 제공</td><td>쉬운 것→어려운 것 계열화</td></tr>\n<tr><td></td><td>개인적 조절감 증대 전략</td><td>학습자 스스로 조절·통제</td><td>진도를 스스로 통제</td></tr>\n<tr><td><strong>만족감</strong>(Satisfaction)</td><td>내재적 강화 전략</td><td>내재적 즐거움 제공</td><td>연습문제·모의상황·게임</td></tr>\n<tr><td></td><td>외재적 보상 전략</td><td>강화·피드백 제공</td><td>상장, 긍정적 피드백</td></tr>\n<tr><td></td><td>공정성 강조 전략</td><td>수업-평가의 일관성 유지</td><td>수업내용과 평가문항 일치</td></tr>\n</table></div>"},{"id":"method-14","name":"캐롤의 학교학습 모형","items":[{"text":"정의(완전학습모형)","children":[]},{"text":"학교학습의 모형도(산출공식)","children":[]},{"text":"학교학습의 5대 변인","children":[{"text":"적성","children":[]},{"text":"수업 이해력","children":[]},{"text":"학습 지속력","children":[]},{"text":"학습 기회","children":[]},{"text":"수업의 질","children":[]}]},{"text":"개인차 변인과 수업 변인의 구분","children":[]},{"text":"시사점","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>기본개념</h4><p>인지적 학습에 영향을 주는 주요 변인들을 추출해 변인 간 상호관계를 종합적으로 고려, 학습과정의 경제성과 완전학습을 도모하는 이론. (=완전학습모형) <strong>인지적 학습에는 적용 가능하나 정의적 학습에는 적용 불가.</strong></p></div>\n<div class=\"mn-block\"><h4>학교학습의 모형도(산출공식)</h4><p>학습의 정도 = (학습에 사용한 시간) / (학습에 필요한 시간)</p></div>\n<h4>학교학습의 5대 변인</h4>\n<div class=\"mn-table-wrap\"><table class=\"mn-table\">\n<tr><th>구분</th><th>변인</th><th>정의</th></tr>\n<tr><td>개인차 변인(학생)</td><td>적성(Aptitude)</td><td>최적 조건에서 과제를 완전히 학습하는 데 필요한 시간 (짧을수록 적성 높음)</td></tr>\n<tr><td></td><td>수업 이해력</td><td>수업 내용을 이해하는 일반지능·언어능력 (예: IQ, 어휘력)</td></tr>\n<tr><td></td><td>학습 지속력</td><td>학습자가 실제로 인내하며 노력한 시간 (동기와 밀접 — ARCS와 연계)</td></tr>\n<tr><td>수업 변인(교사)</td><td>학습 기회</td><td>교사가 학습자에게 허용한 학습 시간</td></tr>\n<tr><td></td><td>수업의 질</td><td>과제 제시 정도·수업방법의 적절성</td></tr>\n</table></div>\n<div class=\"mn-block\"><h4>시사점 (4)</h4><p>- 필요시간을 줄이고 사용시간을 늘리면 학습 극대화 가능<br>- 개인차 변인은 조절이 어려우므로 수업 변인(질·기회)을 최대한 고려해야 함<br>- 수업의 질↑ → 이해력↑ → 필요시간↓ → 학업성적↑<br>- 학습기회 충분히 제공 → 사용시간↑ → 완전학습 가능</p></div>"},{"id":"method-15","name":"블룸의 완전학습 모형","items":[{"text":"정의(완전학습의 기준)","children":[]},{"text":"완전학습을 위한 수업절차","children":[{"text":"수업 전 단계","children":[]},{"text":"수업 중 단계","children":[]},{"text":"수업 후 단계","children":[]}]},{"text":"캐롤 모형과의 관계","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>기본개념</h4><p>기존 학교교육은 비효율적이라 비판하며, 캐롤의 학습모형에 영향을 받아 <strong>95%의 학생이 학습과제의 90% 이상을 학습</strong>하는 것을 완전학습으로 정의하고 이를 달성할 전략을 제시.</p></div>\n<h4>완전학습을 위한 수업절차 (3단계)</h4>\n<div class=\"mn-table-wrap\"><table class=\"mn-table\">\n<tr><th>시점</th><th>단계</th></tr>\n<tr><td>수업 전</td><td>①학습결손 진단(출발점행동·진단평가) ②결손 시 보충학습 제공(스키너의 프로그램학습 활용) ③학습목표 명시 ④수업활동(불필요한 판서 억제)</td></tr>\n<tr><td>수업 중</td><td>⑤수업보조활동(다양한 자료 제공) ⑥형성평가(부진아→보충학습, 일반학생→심화학습) ⑦제2차 학습기회(교정학습 및 형성평가 재실시)</td></tr>\n<tr><td>수업 후</td><td>⑧총괄평가(최종 학업성취도 평가, 논문형 권장)</td></tr>\n</table></div>\n<div class=\"mn-tip\">💡 캐롤(5대 변인 개념)과 블룸(수업 절차 구체화)은 세트로 묶어서 보면 좋습니다. 캐롤이 “왜 학습 결과가 다른가”에 대한 이론이라면, 블룸은 “그럼 실제로 수업을 몇 단계로 어떻게 진행할까”에 대한 실행판입니다.</div>"},{"id":"method-16","name":"브루너의 발견학습","items":[{"text":"정의","children":[]},{"text":"발견학습의 순서(4단계)","children":[]},{"text":"발견학습의 4가지 요소와 교사의 역할","children":[{"text":"학습의욕","children":[]},{"text":"지식의 구조","children":[]},{"text":"계열화","children":[]},{"text":"강화","children":[]}]},{"text":"장점","children":[]},{"text":"단점","children":[]},{"text":"학문중심 교육과정과의 관계","children":[]},{"text":"객관주의/구성주의 분류 논쟁","children":[]}],"explainHtml":"<div class=\"mn-tip\">💡 이 이론은 <strong>교육과정 파트의 ’학문중심 교육과정’과 사실상 세트</strong>입니다(같은 브루너, 같은 지식의 구조 개념). 학문중심 교육과정을 먼저 복습하면 이해가 훨씬 빠릅니다.</div>\n<div class=\"mn-block\"><h4>기본개념</h4><p>교사는 학습 안내를 최소화하고, 학생은 관찰·토론·실험 등을 통해 지식의 구조를 스스로 발견해 내도록 하는 교수방법.</p></div>\n<div class=\"mn-block\"><h4>발견학습의 순서 (4)</h4><p>문제인식(학습안내) → 가설설정 → 가설검증(탐색) → 결론도출(적용·일반화)</p></div>\n<h4>발견학습의 4가지 요소와 교사의 역할</h4>\n<div class=\"mn-table-wrap\"><table class=\"mn-table\">\n<tr><th>요소</th><th>정의</th><th>교사의 역할</th></tr>\n<tr><td>학습의욕(학습경향성)</td><td>학습하고자 하는 의욕·동기</td><td>불확실성을 가진 과제 제시로 의욕 극대화 / 학습활동이 수업목표와 관련 있음을 인식시킴</td></tr>\n<tr><td>지식의 구조</td><td>각 분야의 핵심 원리·아이디어를 체계적으로 조직한 것</td><td>지시를 최소화하고 학생이 스스로 발견하도록 동료 역할(스캐폴딩) / 부득이 제시할 때는 구조화하여 제시</td></tr>\n<tr><td>계열화</td><td>학습과제 수준을 점차 높여 폭·깊이를 확대(질적심화·양적확대)</td><td>학습자의 경험·발달단계 고려해 과제 조직 / 작동적→영상적→상징적 순으로 제시</td></tr>\n<tr><td>강화</td><td>학습결과에 대한 보상</td><td>외적 보상보다 내적보상(발견의 기쁨)을 중시 / 사전에 강화계획을 명시</td></tr>\n</table></div>\n<div class=\"mn-block\"><h4>장점(특징) (3)</h4><p>높은 학습 전이 / 내재적 동기 향상 / 교육의 질 향상<br><strong>단점 (3)</strong>: 정의적 교육 소홀 / 상위권 학습자에게 유리 / 학습환경 조성의 어려움</p></div>\n<div class=\"mn-tip\">💡 흥미로운 분류 이슈: 브루너의 발견학습은 학습자 중심적으로 보여서 구성주의로 오해하기 쉽지만, 보통 <strong>객관주의(그 중에서도 인지주의)</strong>로 분류합니다. 왜냐하면 “지식의 구조”라는 정해진 답이 이미 있고 그것을 찾아가는 과정이기 때문입니다 — 구성주의처럼 “정답 자체가 정해져 있지 않다”는 전제와는 다릅니다. 다만 관점에 따라 구성주의로 보는 책도 있으니 분류 자체에 스트레스 받을 필요는 없습니다.</div>"},{"id":"method-17","name":"오수벨의 유의미 수용학습이론","items":[{"text":"등장배경","children":[]},{"text":"정의(교사 중심 수업이론)","children":[]},{"text":"브루너 발견학습과의 차이(귀납-연역)","children":[]},{"text":"유의미 학습조건 및 단계","children":[{"text":"선행조직자 제시","children":[]},{"text":"유의미한 학습과제 제시","children":[]},{"text":"관련 정착 지식 및 유의미한 학습태세","children":[]},{"text":"인지조직 정착 및 강화","children":[]}]},{"text":"선행조직자의 유형(설명조직자·비교조직자)","children":[]},{"text":"유의미한 학습과제의 조건(실사성·구속성)","children":[]},{"text":"포섭의 유형","children":[{"text":"상위적 포섭","children":[]},{"text":"병렬적 포섭","children":[]},{"text":"상관적 포섭","children":[]},{"text":"파생적 포섭","children":[]}]},{"text":"장점","children":[]},{"text":"단점","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>등장배경</h4><p>1970년대 발견학습·문제해결학습 같은 탐구학습이 인기였지만, 현장에서는 여전히 강의식 수업이 주를 이뤘음. 오수벨은 “강의식 수업을 피할 수 없다면 그것을 유의미하게 만드는 것이 최선”이라고 보고 이 이론을 제안.</p></div>\n<div class=\"mn-block\"><h4>기본개념</h4><p>새로 학습할 내용이 학습자의 인지구조 속 기존 개념과 연관을 지음으로써 의미를 갖고 전이할 수 있도록 하는, <strong>교사 중심</strong> 수업이론.</p></div>\n<div class=\"mn-tip\">💡 브루너(귀납적 사고: 가설 없이 연구 후 결론 도출, 발견학습)와 오수벨(연역적 사고: 가설을 먼저 세우고 결론 도출, 수용학습)은 반대 축입니다. 발견학습은 “학습내용을 미리 안 주고 학습자가 발견”, 수용학습은 “학습내용을 미리 주고 학습자가 그것을 배움”이라는 차이로 기억하면 쉽습니다.</div>\n<h4>유의미 학습조건 &amp; 단계 (4)</h4>\n<div class=\"mn-table-wrap\"><table class=\"mn-table\">\n<tr><th>단계</th><th>내용</th></tr>\n<tr><td>1) 선행조직자 제시</td><td>학습 전 제시, 학습과제보다 높은 수준의 포괄성·일반성 필요. 선행지식 없을 때 <strong>설명조직자</strong>(포괄적 개념·일반적 예 제시) / 선행지식 있을 때 <strong>비교조직자</strong>(기존 개념과 새 개념의 유사점·차이점 제시)</td></tr>\n<tr><td>2) 유의미한 학습과제 제시</td><td>학습과제는 <strong>실사성</strong>(어떻게 표현해도 의미가 안 변함)과 <strong>구속성</strong>(사회적 약속으로 관계가 굳어져 변경 불가)을 가져야 함(=논리적 유의미성). <strong>점진적 분화의 원리</strong>로 제시(포괄적 개념→계열적 구조화)</td></tr>\n<tr><td>3) 관련 정착 지식 &amp; 유의미한 학습태세</td><td>학습자는 새 내용을 흡수(포섭)하기 위한 사전지식(관련 정착 지식)과 학습 의도·성향(유의미한 학습태세)이 있어야 함. <strong>포섭의 유형(4)</strong>: 상위적 포섭(상위개념 학습) / 병렬적 포섭(대등개념 학습) / 상관적 포섭(기존개념 수정·변형) / 파생적 포섭(기존개념의 특수사례 학습)</td></tr>\n<tr><td>4) 인지조직 정착 및 강화</td><td>새 학습내용을 정착·강화 (비판적 접근, 명료화, 요점정리 활용)</td></tr>\n</table></div>\n<div class=\"mn-block\"><h4>장점 (2)</h4><p>경제성 향상(발견에 시간 낭비 방지) / 전이가 용이(기존 지식과 연결)<br><strong>단점 (1)</strong>: 지식의 무비판적 수용 가능성</p></div>\n<div class=\"mn-tip\">💡 오수벨 문제는 대부분 이 4가지 키워드(선행조직자·유의미한 학습과제·관련 정착 지식·유의미한 학습태세)를 축으로 풀립니다. “유의미 학습단계”를 물으면 4가지 모두, “유의미 학습조건(모의고사에서 자주 나옴)”을 물으면 보통 1~3번까지를 답으로 쓰면 됩니다.</div>"},{"id":"method-18","name":"구성주의 교수이론(총론)","items":[{"text":"등장배경(객관주의 수업의 문제점)","children":[]},{"text":"정의","children":[]},{"text":"구성주의 교수설계의 원리(6가지, 공통 특징)","children":[{"text":"평가의 변화","children":[]},{"text":"학습자 중심 학습","children":[]},{"text":"문제해결중심 학습","children":[]},{"text":"실제적 과제와 맥락 강조","children":[]},{"text":"촉진자 역할","children":[]},{"text":"협동학습 강조","children":[]}]},{"text":"장점","children":[]},{"text":"단점","children":[]},{"text":"인지적 구성주의와 사회적 구성주의의 구분","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>등장배경(객관주의 수업의 문제점)</h4><p>- 개별 지식 습득만 강조, 지식의 상호관련성·상황(맥락)을 무시해 통합적 학습이 어려움<br>- 교사가 사전에 조직한 내용이라 학습자의 흥미·수준이 무시되기 쉽고, 능동적 지식 재구성을 기대하기 어려움</p></div>\n<div class=\"mn-block\"><h4>구성주의 기본개념</h4><p>지식이 객관적으로 존재하는 게 아니라 학습자의 경험을 통해 구성된다는 것을 기본가정으로 하는 교수이론. 학습자는 스스로 의미를 재구성하는 능동적 주체.</p></div>\n<div class=\"mn-tip\">💡 구성주의는 크게 <strong>인지적 구성주의</strong>(피아제의 인지발달이론 기반 — 지식은 개인의 내면적 인지작용으로 구성)와 <strong>사회적 구성주의</strong>(비고츠키의 심리발달이론 기반 — 지식은 사회적 상호작용이 내면화되어 구성)로 나뉩니다. 아래에 나오는 개별 이론들도 이 두 갈래 중 어느 쪽에 가까운지 생각해보면 이해가 쉽습니다(예: 상황정착학습·인지적도제는 사회적 구성주의 쪽에 가깝습니다).</div>\n<div class=\"mn-block\"><h4>구성주의 교수설계의 원리(특징) (6)</h4><p>— <em>⚠️ 이 6가지는 뒤에 나오는 모든 구성주의 이론(문제해결학습, PBL, GBS, 상보적 교수법, 상황정착학습, 인지적 도제, 인지적 유연성 등)의 특징을 물을 때 공통으로 활용 가능한 “만능 답안”입니다.</em><br>1. 평가의 변화 — 과정에 대한 수행평가, 잠재적 발달수준까지 포함하는 역동적 평가<br>2. 학습자 중심 학습 — 능동적 지식 구성을 위한 학습자 중심 환경<br>3. 문제해결중심 학습 — 실생활 문제해결을 통한 학습<br>4. 실제적 과제와 맥락 강조 — 지식은 항상 상황 안에서 이루어짐<br>5. 촉진자(안내자) 역할 — 교사는 지식 전달자가 아닌 안내자·보조자·촉진자<br>6. 협동학습 강조 — 개인의 인지활동+사회적 상호작용을 통한 지식 구성</p></div>\n<div class=\"mn-block\"><h4>구성주의 교수의 장점 (2)</h4><p>자기주도적 학습능력 및 흥미 향상 / 문제해결력 및 협동능력 향상<br><strong>구성주의 교수의 단점 (2)</strong>: 교수설계의 어려움(교사의 높은 전문성·많은 시간 필요) / 오개념 형성 및 기본지식 소홀 가능성</p></div>"},{"id":"method-19","name":"문제해결학습","items":[{"text":"학자","children":[]},{"text":"정의(반성적 사고)","children":[]},{"text":"프로젝트법과의 차이(이론적 vs 현실적 문제해결)","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>학자</h4><p>존 듀이(J. Dewey)</p></div>\n<div class=\"mn-block\"><h4>기본개념</h4><p>학습자가 현실생활에서 직면하는 문제를 스스로 해결해 나가는 과정에서 <strong>반성적 사고</strong>(reflective thinking, 자기 생각·행동·경험을 비판적으로 사고하는 것)로 지식·기술·태도를 획득하는 학습 방법. <strong>이론적</strong> 문제해결(상상 속에서 해결)에 초점.</p></div>"},{"id":"method-20","name":"프로젝트법(구안법)","items":[{"text":"등장배경","children":[]},{"text":"정의","children":[]},{"text":"프로젝트법의 단계","children":[{"text":"과제 선정","children":[]},{"text":"계획 수립","children":[]},{"text":"실행","children":[]},{"text":"평가","children":[]}]},{"text":"장점","children":[]},{"text":"단점","children":[]},{"text":"교사 주의점","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>등장배경</h4><p>문제해결학습의 한계(이론적 상상에 그침)를 보완하기 위해 1918년 킬패트릭(W. Kilpatrick)이 제안.</p></div>\n<div class=\"mn-block\"><h4>기본개념</h4><p>실생활과 관련된 학습주제를 학생 스스로 선정·계획·정보수집한 다음 과제수행을 통해 구체적인 결과물을 만들어 내는 학습 방법. <strong>현실적</strong> 문제해결(실천적 사고)에 초점.</p></div>\n<div class=\"mn-tip\">💡 문제해결학습과 프로젝트법의 차이는 “상상으로 그치는가(이론적) vs 실제 결과물을 만드는가(현실적)”입니다. 또한 프로젝트법은 구성주의가 등장(20세기 후반)하기 전인 20세기 초에 만들어진 이론이라 엄밀히는 구성주의로 분류하기 애매하지만, 내용상 비슷해 구성주의로 분류하는 책도 많습니다.</div>\n<h4>프로젝트법 단계 (4)</h4>\n<div class=\"mn-table-wrap\"><table class=\"mn-table\">\n<tr><th>단계</th><th>교사의 역할</th><th>학생의 역할</th></tr>\n<tr><td>1. 과제 선정</td><td>재료 구득 가능성·교육과정 관련성·수준·평가방법 등을 고려해 안내</td><td>과제 선정 및 목표 확인</td></tr>\n<tr><td>2. 계획 수립(가장 중요)</td><td>학습자들이 선정한 수단·방법을 수정·보완, 관찰·조력·피드백</td><td>학습수단·방법을 선정·검토·결정 (토의 활용)</td></tr>\n<tr><td>3. 실행</td><td>학습활동 조력</td><td>산출물 제작, 실제 과제 수행, 지속적 성찰</td></tr>\n<tr><td>4. 평가</td><td>학습자와 함께 평가·조언</td><td>결과발표·토론, 자율평가, 학습자 간 평가</td></tr>\n</table></div>\n<div class=\"mn-block\"><h4>장점(구성주의 장점 활용 가능)</h4><p>자발적·능동적 학습 촉진 / 사회성·도덕성 함양 / 긍정적 자아개념 형성<br><strong>단점(구성주의 단점 활용 가능)</strong>: 자료 부족 시 실패 가능 / 관리의 어려움 / 능력 부족 학생의 시간·활동력 낭비 / 우수 학생의 독점 가능<br><strong>교사 주의점 (3)</strong>: 시간 낭비 방지 조력 / 흥미·수준 고려한 프로젝트 선택 / 전체 교육계획과의 조화</p></div>"},{"id":"method-21","name":"문제중심학습법(PBL)","items":[{"text":"등장배경","children":[]},{"text":"정의(비구조화된 문제)","children":[]},{"text":"학습목표","children":[{"text":"자기주도적 학습능력","children":[]},{"text":"협동학습능력","children":[]}]},{"text":"절차(5단계)","children":[{"text":"도입단계","children":[]},{"text":"문제제시단계","children":[]},{"text":"문제해결단계","children":[]},{"text":"발표 및 토의단계","children":[]},{"text":"정리단계","children":[]}]},{"text":"평가 방식","children":[]},{"text":"교사와 학생의 역할","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>등장배경</h4><p>1960년대 캐나다 맥마스터 의과대학 배로우즈(H. S. Barrows) 교수가 개발. 강의식·암기식으로는 의대생의 문제해결력을 충분히 기를 수 없다고 판단.</p></div>\n<div class=\"mn-block\"><h4>기본개념</h4><p>교사가 실제 생활과 관련된 <strong>비구조화된 문제</strong>(ill-structured, 지식이 학습자와 복잡하게 얽혀 존재)를 제시하고 학습자가 이를 해결해 나가는 과정에서 문제해결력·관련 지식·기능을 학습하는 수업방식.</p></div>\n<div class=\"mn-block\"><h4>학습목표 (2)</h4><p>자기주도적 학습능력(문제 해결의 전 과정과 결과에 책임을 짐) / 협동학습능력(정보 공유·통합으로 문제해결능력 향상)</p></div>\n<div class=\"mn-block\"><h4>절차 (5단계)</h4><p>1. 도입단계 — 5명 내외 소집단 구성, 목적·절차·역할 설명<br>2. 문제제시단계(자기주도적 학습) — 비구조적 문제 제시, 가설 설정(<strong>PBL은 가설-연역적 수업</strong>), 학습과제 설정, 실천계획 수립 후 개별학습·조사<br>3. 문제해결단계(소집단학습) — 조사결과 공유·종합해 최적 해결안 도출<br>4. 발표 및 토의단계(일반화) — 학급 전체 발표, 타 팀과 비교·토의<br>5. 정리단계(반성) — 스스로 탐구능력·사고과정을 반성, 다양한 평가 실시</p></div>\n<div class=\"mn-block\"><h4>평가</h4><p>종합평가+과정평가, 교사평가+자기평가+동료평가 등 다양한 유형<br><strong>교사의 역할</strong>: 지원자·촉진자 (지속적 모니터링, 간접적 피드백)<br><strong>학생의 역할</strong>: 자기주도적 학습 수행 / 협동학습 수행<br><strong>장점</strong>: 구성주의 장점 활용 / <strong>단점</strong>: 구성주의 단점 활용</p></div>"},{"id":"method-22","name":"생크의 목표기반 시나리오 모형(GBS)","items":[{"text":"정의","children":[]},{"text":"구성요소(7가지)","children":[{"text":"목표","children":[]},{"text":"미션","children":[]},{"text":"표지이야기","children":[]},{"text":"역할","children":[]},{"text":"시나리오 운영","children":[]},{"text":"자원","children":[]},{"text":"피드백","children":[]}]},{"text":"목표지향적 학습과 기대 실패의 관계","children":[]},{"text":"설계 시 유의사항","children":[]},{"text":"PBL과의 차이","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>기본개념</h4><p>정해진(구조화된) 목표를 중심으로 연극이나 역할놀이처럼 시나리오에 따른 역할을 수행하는 과정에서 자신도 모르게 목표를 성취하도록 하는 교수학습 모형. (쉽게 말해 “연극을 하면서 배우기”)</p></div>\n<h4>구성요소 (7)</h4>\n<div class=\"mn-table-wrap\"><table class=\"mn-table\">\n<tr><th>요소</th><th>정의</th><th>예</th></tr>\n<tr><td>목표(Goal)</td><td>학습자가 획득하기를 원하는 지식·기능</td><td>운양호 사건 관련 정치적 의사결정 능력</td></tr>\n<tr><td>미션(Mission)</td><td>목표 성취를 위해 수행해야 하는 과제</td><td>조정 대신 역할로 조선의 운명을 바꿈</td></tr>\n<tr><td>표지이야기(Cover story)</td><td>미션과 관련된 구체적 상황·장면을 이야기 형식으로 설명</td><td>사건 배경과 조정 대신들의 논의 장면</td></tr>\n<tr><td>역할(Role)</td><td>학습자가 표지이야기 속에서 맡는 인물</td><td>조정 대신 역할</td></tr>\n<tr><td>시나리오 운영(Scenario operation)</td><td>임무를 수행하는 구체적 활동</td><td>정책 제안마다 고종·대신의 반응 제시</td></tr>\n<tr><td>자원(Resources)</td><td>미션 수행에 필요한 정보</td><td>참고 가능한 문서·정보</td></tr>\n<tr><td>피드백(Feedback)</td><td>미션 수행 중 어려움 해결을 위한 교수자 도움</td><td>정책 제안에 대한 수시 피드백</td></tr>\n</table></div>\n<div class=\"mn-block\"><h4>특징 (3)</h4><p>- 목표지향적 학습(상황 안에서 역할 수행 → 자연스럽게 목표지향적 학습)<br>- 목표지향적 학습은 <strong>기대 실패</strong>(자신의 지식 부족으로 형성된 기대가 타당하지 않음을 확인했을 때의 심리적 요인)를 분석하고 부족한 지식을 채우며 이루어짐<br>- 사례기반 학습 — 기대 실패를 만든 문제 상황을 해결하는 경험이 유사 문제 해결의 원동력이 됨</p></div>\n<div class=\"mn-block\"><h4>설계 시 유의사항 (3)</h4><p>내용지식(선언적)과 과정지식(절차적) 목표를 구분 제시 / 두 지식이 모두 포함된 실제적 사례로 시나리오 구성 / 개별적·주관적·질적 평가 지향</p></div>\n<div class=\"mn-tip\">💡 GBS와 PBL의 차이: PBL은 자기주도학습을 지향해 학생에게 상당한 자유를 주는 반면, GBS는 목표와 시나리오가 어느 정도 미리 구조화되어 있어(객관주의적 요소 포함) 현장 교사 입장에서는 PBL보다 다루기 쉬운 편입니다.</div>"},{"id":"method-23","name":"상보적 교수법","items":[{"text":"학자 및 적용영역(독해력)","children":[]},{"text":"정의","children":[]},{"text":"수업전략(4단계)","children":[{"text":"안내단계","children":[]},{"text":"시범단계(요약하기·질문하기·명료화하기·예측하기)","children":[]},{"text":"모방단계","children":[]},{"text":"피드백단계","children":[]}]}],"explainHtml":"<div class=\"mn-block\"><h4>학자</h4><p>팰린사(A. Palincsar)와 브라운(A. Brown). <strong>독해력(Reading) 지도</strong>를 위해 제안.</p></div>\n<div class=\"mn-block\"><h4>기본개념</h4><p>학생끼리 또는 학생과 교사 간의 상보적(상호적)인 도움을 통해 독해전략을 향상하기 위해 만든 수업방식. 목적은 학생이 읽은 내용을 깊이 이해하고 생각하도록 돕는 것.</p></div>\n<div class=\"mn-block\"><h4>수업전략 (4단계)</h4><p>1. 안내단계 — 수업목적 설명 후 조용히 읽게 함<br>2. 시범단계 — 교사가 <strong>요약하기·질문하기·명료화하기·예측하기</strong>를 시범: 요약하기(자신의 용어로 요약) / 질문하기(교사-학생, 학생-학생이 질문·응답) / 명료화하기(어려운 부분을 다시 읽거나 사전으로 확인) / 예측하기(다음 내용 예측)<br>3. 모방단계 — 학습자가 연습을 통해 교사를 모방하며 전략을 내면화<br>4. 피드백단계 — 교사가 미흡한 부분에 피드백, 점차 도움을 줄여나감</p></div>"},{"id":"method-24","name":"상황정착 수업이론(앵커드 모형)","items":[{"text":"학자","children":[]},{"text":"정의(앵커의 의미)","children":[]},{"text":"교수설계 원리(4가지)","children":[]},{"text":"실행공동체와 정당한 주변적 참여의 개념","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>학자</h4><p>레이브(Lave)와 웽거(Wenger)</p></div>\n<div class=\"mn-block\"><h4>기본개념</h4><p>새로운 개념을 학생의 인지구조에 연결하기 위해서 구체적인 개념 및 실제상황(<strong>앵커</strong>)과 비슷한 영상매체를 제시해 문제해결력을 증진하고 전이를 촉진하는 학습 방법.</p></div>\n<div class=\"mn-tip\">💡 앵커(anchor)는 “학습자가 원래 가진 지식”이 아니라, <strong>새로운 지식을 연결 짓기 위해 제공하는 구체적인 실제 상황·아이디어</strong>입니다(오개념 주의). 예: 비타민C 개념을 가르칠 때 키위와 딸기를 보여주는 것이 앵커입니다.</div>\n<div class=\"mn-block\"><h4>상황정착 수업의 교수설계 원리 (4)</h4><p>1. 텍스트보다 비디오 기반 자료 제공 (시각적·역동적 정보가 더 잘 기억됨)<br>2. 실제적인 과제를 맥락과 함께 제공<br>3. 구체적이고 다양한 사례 제공<br>4. 수행평가와 역동적 평가 등 다양한 평가 활용</p></div>\n<div class=\"mn-block\"><h4>실행공동체와 정당한 주변적 참여</h4><p>효과적인 상황학습을 위해서는 <strong>실행공동체</strong>(같은 목표를 가진 사람들이 협력·상호작용하며 성장하는 공동체)를 구성하고 <strong>정당한 주변적 참여</strong>(지식·기술 습득을 위해 실행공동체 주변에서 관찰·참여하는 것)의 기회를 제공해야 함.</p></div>\n<div class=\"mn-tip\">💡 “상황학습”은 구성주의의 여러 이론(인지적 도제, 인지적 유연성 등)을 ’상황’이라는 키워드로 묶은 더 큰 범주이고, “상황정착 수업이론(정황학습)”은 그 하위 한 예입니다. 기출문제에서 정황학습을 상황학습으로, 상황학습을 상황정착학습으로 혼용해 부르는 경우가 있으므로 이 셋을 하나로 통합해 이해하는 것이 실전에서 유리합니다.</div>"},{"id":"method-25","name":"인지적 도제 모형","items":[{"text":"등장배경(ZPD와의 관계)","children":[]},{"text":"정의","children":[]},{"text":"수업절차(6단계)","children":[{"text":"모델링","children":[]},{"text":"코칭","children":[]},{"text":"스캐폴딩/페이딩","children":[]},{"text":"명료화","children":[]},{"text":"반성","children":[]},{"text":"탐구","children":[]}]},{"text":"장점","children":[]},{"text":"단점","children":[]},{"text":"조나센 CLEs 학습자활동과의 순서 차이","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>등장배경</h4><p>1987년 콜린스(Collins), 브라운(Brown), 뉴먼(Newman)이 공동 개발. 전통적 도제식 교육(스승이 제자를 일대일로 엄하게 가르침)이 단순 모방·반복에 머무는 한계를 극복하기 위해 <strong>비고츠키의 근접발달영역(ZPD)</strong> 개념을 도입.</p></div>\n<div class=\"mn-block\"><h4>기본개념</h4><p>초보 학습자들이 실제상황에서 전문가의 작업과정을 관찰·모방함으로써 전문가의 지식·문제해결력·기술 등을 습득하는 교수방법. (“전문가가 하는 걸 보고 배우기”)</p></div>\n<h4>수업절차 (MCSARE, 6단계)</h4>\n<div class=\"mn-table-wrap\"><table class=\"mn-table\">\n<tr><th>단계</th><th>내용</th></tr>\n<tr><td>1) 모델링(Modeling)</td><td>교사가 실제 문제해결 과정을 직접 시범</td></tr>\n<tr><td>2) 코칭(Coaching)</td><td>학습자의 과제수행을 관찰하고 피드백</td></tr>\n<tr><td>3) 스캐폴딩/페이딩</td><td>어려운 문제에 직접 도움 대신 힌트·유도질문(간접 도움) → 익숙해지면 점차 도움을 줄임</td></tr>\n<tr><td>4) 명료화(Articulation)</td><td>학습한 지식·문제해결 과정·전략을 설명하도록 요구</td></tr>\n<tr><td>5) 반성(Reflection)</td><td>자신의 방법과 교사의 방법을 비교해 개선점을 성찰</td></tr>\n<tr><td>6) 탐구(Exploration)</td><td>학습자 스스로 새로운 방식을 시도해 다른 상황에 적용할 보편적 지식을 습득</td></tr>\n</table></div>\n<div class=\"mn-block\"><h4>장점</h4><p>실제상황 학습으로 더 깊은 학습 가능<br><strong>단점</strong>: 전문가-학습자 간 일대일 상호작용에 집중해, 다른 학습자와의 사회적 상호작용·협동학습 효과를 기대하기 어려움</p></div>\n<div class=\"mn-tip\">💡 조나센 CLEs의 학습자활동 순서(탐색-명료화-반성)와 인지적 도제의 순서(명료화-반성-탐구)는 순서가 서로 다르니 혼동에 주의하라고 원문에서도 강조합니다.</div>"},{"id":"method-26","name":"인지적 유연성 이론","items":[{"text":"등장배경","children":[]},{"text":"정의(인지적 유연성)","children":[]},{"text":"교수설계원리 및 방법(4가지)","children":[{"text":"주제중심의 학습","children":[]},{"text":"다양한 지적 표상 제공","children":[]},{"text":"다양한 사례 중심 학습","children":[]},{"text":"임의적 접근 학습","children":[]}]},{"text":"장점(목적)","children":[]},{"text":"단점","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>등장배경</h4><p>1987년 리처드 스피로(Spiro)가 발표. 기존 교수학습 이론이 지식을 단순화하고 학습자의 인지구조를 고려하지 않는다고 비판 — 지식은 복잡한 다차원적 개념이라고 주장.</p></div>\n<div class=\"mn-block\"><h4>기본개념</h4><p>실제 세계와 같은 복잡한 학습 환경을 제공해, 학습자가 다차원적 지식을 습득하고 이를 기반으로 <strong>인지적 유연성</strong>(상황 의존적인 스키마 연합체 — 상황·문맥에 따라 적절한 도식을 선택·조합해 새 지식으로 재구성하는 능력)을 형성하도록 돕는 교수학습 방법.</p></div>\n<div class=\"mn-block\"><h4>교수설계원리 &amp; 방법 (4)</h4><p>1. 주제중심의 학습<br>2. 다양한 지적 표상 제공 — 학습과제를 여러 방식(글+그림, 행동+사진 등)으로 세분화 표현<br>3. 다양한 사례 중심 학습<br>4. 임의적 접근 학습 — 단순 내용을 피하고 학습 순서를 비순차적으로 배치, <strong>하이퍼텍스트</strong>(글→텍스트 연결)·<strong>하이퍼미디어</strong>(글→영상 연결) 활용</p></div>\n<div class=\"mn-block\"><h4>장점(목적) (3)</h4><p>실제상황 학습으로 깊은 학습 / 비순차적·다차원적 전략으로 지식의 전이성 향상 / 기초지식→상위지식 재구성에 도움<br><strong>단점 (3)</strong>: 인지적 작용·과제에 치중해 사회적 상호작용·협동학습 소홀 / 낮은 수준 학습자에게 너무 많은 자료가 부담 / 정형화된 지식을 가르치기엔 부적합</p></div>"},{"id":"method-27","name":"스키너의 프로그램 학습이론(PI)","items":[{"text":"이론적 기반(조작적 조건형성)","children":[]},{"text":"적용대상(학습부진아의 정의)","children":[]},{"text":"프로그램 학습의 원리(4가지)","children":[{"text":"능동적 반응의 원리","children":[]},{"text":"점진적 접근의 원리","children":[]},{"text":"자기 속도의 원리","children":[]},{"text":"즉각적 강화의 원리","children":[]}]}],"explainHtml":"<div class=\"mn-block\"><h4>기본개념</h4><p>스키너의 <strong>조작적 조건형성 이론</strong>에 기반. 학습부진아(지능이 낮은 학생만이 아니라 진단평가·형성평가로 학습결손·보충학습이 필요하다고 판단된 학생 포함)를 위한 프로그램.</p></div>\n<div class=\"mn-block\"><h4>프로그램 학습의 원리 (4)</h4><p>1. 능동적(적극적) 반응의 원리 — 학습자 수준에 맞게 문제 제시, 적극적 참여 유도<br>2. 점진적 접근(Small Step)의 원리 — 작은 단계로 나눠 쉬운 것→어려운 것 순으로 제시<br>3. 자기 속도의 원리 — 학습자 스스로 속도 조절<br>4. 즉각적 강화의 원리 — 결과를 곧바로 알려줘 쉽게 교정</p></div>\n<div class=\"mn-tip\">💡 여기서 나오는 <strong>교수기계(Teaching Machine)</strong>는 학습자가 자기 속도로 학습하고 즉각적 피드백을 받도록 고안된 자동학습장치로, 오늘날의 컴퓨터 기반 학습 소프트웨어까지 포괄하는 개념입니다.</div>"},{"id":"method-28","name":"적성-처치 상호작용 모형(ATI)","items":[{"text":"등장배경","children":[]},{"text":"정의","children":[]},{"text":"구성요소(3가지)","children":[{"text":"적성","children":[]},{"text":"처치","children":[]},{"text":"상호작용","children":[]}]},{"text":"이상적 형태와 현실적 형태의 차이","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>등장배경</h4><p>크론바흐와 스노우(Cronbach &amp; Snow, 1977)가 기존 이론이 학습방법 개선에만 초점을 맞춘다고 비판하며 개발.</p></div>\n<div class=\"mn-block\"><h4>기본개념</h4><p>학습자의 적성이 모두 다르므로, 학습자의 적성에 맞는 교수방법(처치)을 사용하면 학습 효과를 극대화할 수 있다는 개별화 학습 모형.</p></div>\n<div class=\"mn-block\"><h4>ATI 구성요소 (3)</h4><p>1. <strong>적성</strong>(Aptitude) — 개인적 능력·특성 (일반지능, 성격유형, 학습동기, 불안 등)<br>2. <strong>처치</strong>(Treatment) — 학생에게 투입되는 교수 프로그램·수업방법 (학생중심/교사중심, 개별/협동, 강의식/토론식 등)<br>3. <strong>상호작용</strong>(Interaction) — 적성과 처치 두 변인 사이의 효과</p></div>\n<div class=\"mn-block\"><h4>시사점 (2)</h4><p>- (이상적 형태) 최적의 개별화 수업을 위해 학습자 적성을 고려해야 함 — 적성이 낮으면 처치B, 높으면 처치A가 효과적이라는 이론적 예측<br>- (현실적 형태) 그러나 실제로는 적성과 무관하게 더 효과적인 처치가 존재하므로, 다양한 수업방법을 활용해 학생 간 개인차를 줄이는 것도 중요</p></div>\n<div class=\"mn-tip\">💡 ATI의 “이상적 형태 vs 현실적 형태” 그래프가 시험에서 중요한 포인트입니다. 이론상으로는 적성별로 다른 처치가 필요하다는 교차 그래프(이상적)가 예측되지만, 실제 연구에서는 특정 처치(A)가 적성 수준과 무관하게 항상 더 효과적인 비교차 그래프(현실적)가 관찰되었다는 것이 핵심입니다.</div>"},{"id":"method-29","name":"켈러의 개별화 교수체제(PSI)","items":[{"text":"등장배경 및 이론적 기반","children":[]},{"text":"정의","children":[]},{"text":"수업절차 및 특징(5가지)","children":[{"text":"자료 배부","children":[]},{"text":"개별 속도 학습","children":[]},{"text":"완전학습 후 진급","children":[]},{"text":"학습보조원","children":[]},{"text":"강의","children":[]}]},{"text":"ARCS 켈러와의 인물 구분","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>등장배경</h4><p>브라질리아 대학교에서 켈러(Fred S. Keller)와 셔먼(Sherman)이 개발. 스키너의 조작적 조건형성 이론과 프로그램 학습을 참고. <em>⚠️ (주의: ARCS의 켈러(John M. Keller)와는 다른 인물)</em></p></div>\n<div class=\"mn-block\"><h4>기본개념</h4><p>학습자의 특성을 고려해 최적의 학습환경을 조성, 개개인의 학습속도에 맞게 진행되는 개별화 교수방법.</p></div>\n<div class=\"mn-block\"><h4>수업절차 및 특징 (스키너의 프로그램학습 1~3번 + 4·5번 추가)</h4><p>1. 스스로 공부할 자료 2가지(프로그램 학습자료+학습 안내서) 배부<br>2. 자신의 능력에 맞춘 개별 속도 학습<br>3. 각 단원의 일정 요구 수준을 완전히 성취해야 다음 단원 진행<br>4. <strong>학습보조원</strong> — 단원을 성공적으로 수행한 학습자를 다른 학습자의 보조원으로 활용<br>5. <strong>강의</strong> — 학습자들의 동기 향상과 개별학습 보충을 위해 강의 실시 (단, 중요한 정보는 강의로 제공하지 않음)</p></div>"},{"id":"method-30","name":"글레이저의 개별처방 교수법(IPI)","items":[{"text":"정의","children":[]},{"text":"PSI와의 차이(사전 진단검사)","children":[]},{"text":"수업절차(4단계)","children":[]},{"text":"특징","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>기본개념</h4><p>글레이저(R. Glaser)와 동료들이 개발. <strong>PSI와 달리 본격적 학습 전에 진단검사를 실시</strong>해 학습자 수준을 파악한 다음, 수준에 따라 출발점을 다르게 시작하는 개별처방 교수법.</p></div>\n<div class=\"mn-block\"><h4>수업절차 (4, PSI의 1~3단계 앞에 사전 진단검사를 추가)</h4><p>1. 사전 진단검사로 학습자 수준 파악<br>2. 스스로 공부할 자료 2가지 배부<br>3. 개별 속도로 학습<br>4. 일정 요구 수준 완전 성취 후 다음 단원</p></div>\n<div class=\"mn-block\"><h4>특징 (3)</h4><p>같은 단원도 학습자마다 출발 수준이 다름 / 스키너의 프로그램 학습에 기초해 완전학습 지향 / 사전 진단검사 실시</p></div>"},{"id":"method-31","name":"자율개별계약 교수법","items":[{"text":"정의(학습계약의 구성요소)","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>기본개념</h4><p>학습자의 자발적·독립적 학습능력을 기르고자 하는 개별화 교수법. 학습자가 학습목표·내용·방법·성취증거 제시방법·평가기준·기간 등을 교사와 협의해 체결한 <strong>계약</strong>을 바탕으로 이루어짐.</p></div>"},{"id":"method-32","name":"자원기반학습(Big 6 Skills)","items":[{"text":"등장배경","children":[]},{"text":"정의","children":[]},{"text":"특징(장점)","children":[]},{"text":"설계방법(4가지)","children":[{"text":"상황맥락적 문제상황","children":[]},{"text":"자원(정보원)","children":[]},{"text":"학습도구","children":[]},{"text":"스캐폴딩","children":[]}]},{"text":"Big 6 Skills의 절차(6단계)","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>등장배경</h4><p>1960년대 중반 아이젠버그와 베르코비츠가 개발.</p></div>\n<div class=\"mn-block\"><h4>기본개념</h4><p>학습자 스스로 다양한 학습자원과 직접 상호작용하며 자료를 수집·분석한 후, 과제해결에 필요한 최종 결과물을 만들어 내는 학습자 중심의 학습방법.</p></div>\n<div class=\"mn-block\"><h4>특징(장점)</h4><p>학습자 맞춤형 학습(자원 선택 기회) / 학습자 주도적 학습(스스로 목표 설정·설계) / 교실 밖 자원(인터넷·전문가) 활용 가능</p></div>\n<div class=\"mn-block\"><h4>설계방법 (4)</h4><p>1. 상황맥락적 문제상황 — 다양한 관점에서 조사 가능한 문제 제시<br>2. 자원(정보원) — 컴퓨터실(전자매체), 도서관(인쇄매체), 전문가(인간자원) 등 다양한 자원 지원<br>3. 학습도구 — 조작도구(실험키트 등) / 협업도구(이메일·게시판 등)<br>4. 스캐폴딩 — 개념적(주요개념 이해 지원) / 절차적(자료 절차 이해 지원) / 전략적(학습전략 지원) / 메타인지적(계획·점검·평가 지원)</p></div>\n<div class=\"mn-block\"><h4>대표 모형: Big 6 Skills</h4><p>— 정보리터러시 증진을 위한 대표 모형. <strong>절차(6, 순서대로 진행 필수 아님)</strong>: ①과제정의 ②정보탐색전략 ③소재파악과 접근 ④정보활용 ⑤종합정리 ⑥평가</p></div>"},{"id":"method-33","name":"노울즈의 자기주도적 학습(SDL)","items":[{"text":"학자(안드라고지)","children":[]},{"text":"정의","children":[]},{"text":"자기주도적 학습능력 증진 방안(4가지)","children":[{"text":"교수방법의 개선","children":[]},{"text":"교육과정의 구조 개선","children":[]},{"text":"교육과정의 탄력적 운영","children":[]},{"text":"평가의 개별화·다양화·자율화","children":[]}]}],"explainHtml":"<div class=\"mn-block\"><h4>학자</h4><p>말콤 노울즈(Malcolm S. Knowles, 1913~1997). 평생교육의 창시자, ‘<strong>안드라고지</strong>’ 이론 제시.</p></div>\n<div class=\"mn-tip\">💡 안드라고지(성인교육학)는 교육사회 파트의 평생교육 개념과 연결됩니다. 노울즈가 분석한 성인학습의 특징 중 핵심은 “성인 학습자는 자기주도적이다”라는 것입니다.</div>\n<div class=\"mn-block\"><h4>기본개념</h4><p>학습자가 스스로 자신의 학습요구를 진단하고 학습목표를 설정하며, 필요한 인적·물적 자원을 파악하고 적절한 학습전략을 선택·실행하여, 자신이 성취한 학습결과를 스스로 평가하는 학습방법.</p></div>\n<div class=\"mn-block\"><h4>자기주도적 학습능력 증진 방안 (4)</h4><p>— 교육과정·교육방법·교육평가 측면<br>1. 교수방법의 개선 — 교사중심에서 학생참여형 수업으로 전환<br>2. 교육과정의 구조 개선 — 교과목 수·내용을 축소 운영<br>3. 교육과정의 탄력적 운영 — 창의적 체험활동·방과후 활동을 통한 자기주도 학습 기회 확대<br>4. 평가의 개별화·다양화·자율화 — 개별 평가, 자기평가 등 다양한 평가 활용</p></div>"},{"id":"method-34","name":"토의법","items":[{"text":"정의","children":[]},{"text":"종류 및 청중 참여 가능 여부","children":[{"text":"원탁토의","children":[]},{"text":"배심토의","children":[]},{"text":"대담토의","children":[]},{"text":"공개토의(포럼)","children":[]},{"text":"단상토의(심포지엄)","children":[]},{"text":"세미나","children":[]},{"text":"버즈토의","children":[]}]},{"text":"배심토의와 대담토의의 차이","children":[]},{"text":"공개토의와 단상토의의 차이","children":[]},{"text":"협동학습과의 차이점","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>정의</h4><p>특정 문제에 대하여 서로 비판적인 의견을 교환하여 올바른 결론에 도달하는 학습방법.</p></div>\n<div class=\"mn-tip\">💡 각 토의법은 정해진 인원수·시간이 책마다 달라 세부 숫자에 매몰될 필요는 없고, <strong>청중의 참여 가능 여부</strong>로 유형을 구분하는 것이 가장 실전적입니다.</div>\n<h4>종류 (7)</h4>\n<div class=\"mn-table-wrap\"><table class=\"mn-table\">\n<tr><th>유형</th><th>개념</th><th>청중 참여</th></tr>\n<tr><td>원탁토의</td><td>참가자 전원(5~10명)이 대등한 관계로 자유롭게 의견 교환</td><td>참가자 = 청중 (전원 참여)</td></tr>\n<tr><td>배심토의(패널토의)</td><td>상반된 견해의 배심원(패널)들이 사회자 진행에 따라 청중 앞에서 토의</td><td>원칙적으로 <strong>불가능</strong></td></tr>\n<tr><td>대담토의</td><td>청중 대표(2~4명)와 전문가 대표(2~4명)가 사회자 진행에 따라 토의</td><td><strong>가능</strong></td></tr>\n<tr><td>공개토의(포럼)</td><td>전문가(1~3명)가 발표 후 청중과 질의응답</td><td><strong>가능</strong></td></tr>\n<tr><td>단상토의(심포지엄)</td><td>서로 다른 의견의 전문가(2~5명)가 공개강연 후 발표자끼리 질의응답</td><td>원칙적으로 <strong>불가능</strong></td></tr>\n<tr><td>세미나</td><td>전문지식을 갖춘 참가자(5~30명) 전원이 토의</td><td>구성원 전원 능동 참여 (일반 대중은 이해 어려움)</td></tr>\n<tr><td>버즈토의(분임토의)</td><td>전체를 소집단으로 나눠 토론 후 다시 모여 전체 결과 도출 (3~6명, 6분씩 = 6.6법)</td><td>소집단별 참여</td></tr>\n</table></div>\n<div class=\"mn-tip\">💡 헷갈리는 두 쌍: ①배심토의 vs 대담토의 — 둘 다 소수가 앞에서 토의하지만 청중 참여 여부로 구분. ②공개토의(포럼) vs 단상토의(심포지엄) — 역시 청중 참여 여부로 구분(포럼=가능, 심포지엄=불가능). 다만 실제로는 사회자 재량·토론 상황에 따라 융통성 있게 바뀔 수 있습니다.</div>\n<div class=\"mn-block\"><h4>협동학습과의 차이점</h4><p>모둠 구성 시 토의법은 학생 수준을 고려하지 않지만, 협동학습은 이질적 구성원을 전제. 진행방법도 토의법은 구두 의견교환, 협동학습은 학습목표 중심의 소집단 활동.</p></div>"},{"id":"method-35","name":"협동학습(원리)","items":[{"text":"정의","children":[]},{"text":"원리 및 특징(5가지)","children":[{"text":"긍정적 상호의존성","children":[]},{"text":"개별적 책무성","children":[]},{"text":"이질적인 팀 구성","children":[]},{"text":"대면적 상호작용","children":[]},{"text":"사회적 기술","children":[]}]},{"text":"문제상황별 해결책","children":[{"text":"무임승차효과와 봉 효과의 개념","children":[]},{"text":"대응 모형","children":[]}]}],"explainHtml":"<div class=\"mn-block\"><h4>정의</h4><p>학습자들이 이질적 소집단을 구성하여, 학습목표·과제·기능을 구성원 간 상호작용을 통해 모든 구성원이 달성하도록 하는 학습방법으로, 집단적 성취도에 따라 교육적 보상을 받는 교수·학습과정.</p></div>\n<div class=\"mn-block\"><h4>원리·특징 (5)</h4><p>1. <strong>긍정적 상호의존성</strong> — 자신뿐 아니라 동료도 성취하도록 서로 돕는 관계 (구체적 집단목표·집단보상으로 조성)<br>2. <strong>개별적 책무성</strong> — 각 학습자가 자신의 학습에 책임을 짐<br>3. <strong>이질적인 팀 구성</strong> — 인지적 능력·문화 배경 차이가 클수록 다양한 관점 확보<br>4. <strong>대면적 상호작용</strong> — 얼굴을 맞대고 서로 격려<br>5. <strong>사회적 기술</strong>(대인관계 능력) — 갈등관리·의사결정·경청 방법 등 발달 필요</p></div>\n<h4>단점 및 해결책 (3)</h4>\n<div class=\"mn-table-wrap\"><table class=\"mn-table\">\n<tr><th>문제상황</th><th>발생 현상</th><th>해결책</th></tr>\n<tr><td>구성원이 이질적</td><td>집단 내 분쟁</td><td>상호의존성·책무성 교육, 주기적 소집단 재편성</td></tr>\n<tr><td>개별적 책무성 없음</td><td><strong>무임승차효과</strong>(다른 학생의 결과물을 공유만 함) / <strong>봉 효과</strong>(노력이 다른 학습자에게 돌아간다고 인식해 소극적 참여)</td><td>직소모형·Co-op 모형(과제 의존성 높임)</td></tr>\n<tr><td>개인 흥미 배제</td><td>소극적 참여</td><td>성취과제분담모형(STAD, 개별+집단 보상)</td></tr>\n</table></div>"},{"id":"method-36","name":"협동학습의 종류","items":[{"text":"직소 모형의 발전(1~4)","children":[{"text":"직소 1의 구조와 절차","children":[]},{"text":"직소 2의 개선점(집단보상)","children":[]},{"text":"직소 3의 개선점(정리시간)","children":[]},{"text":"직소 4의 개선점","children":[]}]},{"text":"성취과제분담학습(STAD)","children":[{"text":"정의 및 절차","children":[]},{"text":"직소2와의 차이(역할분담 유무)","children":[]}]},{"text":"자율적 협동학습(Co-op Co-op)","children":[{"text":"정의 및 평가방식","children":[]}]},{"text":"팀보조 개별학습(TAI)","children":[{"text":"정의(개별학습 속도)","children":[]}]},{"text":"토너먼트 게임식 팀학습(TGT)","children":[{"text":"STAD와의 차이(게임 경쟁)","children":[]}]},{"text":"집단조사(GI)","children":[]},{"text":"함께 학습하기(LT)","children":[]}],"explainHtml":"<div class=\"mn-tip\">💡 종류가 많지만 기출 빈도가 높은 Jigsaw·STAD·Co-op·TAI 위주로 집중하고 나머지는 “이런 게 있다” 정도로만 알아둬도 충분합니다.</div>\n<div class=\"mn-table-wrap\"><table class=\"mn-table\">\n<tr><th>모형</th><th>개발자</th><th>핵심 특징</th></tr>\n<tr><td><strong>직소(Jigsaw) 1</strong></td><td>애론슨(Aronson), 1978</td><td>모집단(Home team)이 전문가집단(Expert team)으로 갈라졌다 다시 모집단으로 돌아오는 구조(직소 퍼즐과 유사). 절차: 도입→모집단 활동→전문가 활동→모집단 재소집→개별평가. 인종차별 문제 해결을 위해 고안</td></tr>\n<tr><td>직소 2</td><td>슬래빈(Slavin), 1983</td><td>직소1에 <strong>집단보상</strong> 추가 — 개별점수+개인별 향상점수로 팀점수 산출, 개별+집단 보상</td></tr>\n<tr><td>직소 3</td><td>스타인브링크&amp;스탈, 1994</td><td>직소1·2에 개별평가 전 <strong>학습 정리시간</strong> 추가 (평가 방식은 직소2와 동일)</td></tr>\n<tr><td>직소 4</td><td>홀리데이, 1995</td><td>직소3에 도입단계 전체수업 소개, 전문가활동 단계 퀴즈, 개별평가단계 선택적 재교육 추가</td></tr>\n<tr><td><strong>성취과제분담학습(STAD)</strong></td><td>슬래빈, 1986</td><td>‘학생 팀 성취 보상모형’. 직소2와 비슷하나 <strong>역할 분담이 없는 공동학습구조</strong>. 절차: 학습안내→팀구성(4~6명)→팀활동→개별평가(개별+향상점수)→팀점수 산출→게시→보상(개별+집단)</td></tr>\n<tr><td><strong>자율적 협동학습(Co-op Co-op)</strong></td><td>—</td><td>교사·학생이 함께 학습과제 선정, 팀 활동 후 다면적 평가(팀동료-팀기여도, 교사-소주제 기여도, 학급동료-팀보고서). 소집단 경쟁이 아닌 <strong>소집단 협력</strong>을 지향. 무임승차·봉 효과 최소화에 유용</td></tr>\n<tr><td><strong>팀보조 개별학습(TAI)</strong></td><td>—</td><td>이질적 팀 구성 후 <strong>개별학습 속도</strong>로 진행(대부분의 협동학습과 달리 정해진 진도가 없음). 개별학습→동료 도움 협동학습→개별평가(개별점수 합산해 팀점수)→보상</td></tr>\n<tr><td>토너먼트 게임식 팀학습(TGT)</td><td>—</td><td>절차는 STAD와 유사하나 개별평가(퀴즈) 대신 <strong>토너먼트 게임</strong>으로 팀 간 경쟁 유도. 공동작업구조+집단 내 협동/집단 외 경쟁</td></tr>\n<tr><td>집단조사(GI)</td><td>—</td><td>학생들이 과제 선정부터 계획·분담·보고까지 모든 활동을 스스로 진행. 개별·집단평가를 자유롭게 선택 가능</td></tr>\n<tr><td>함께 학습하기(LT)</td><td>—</td><td>전체 학습과제를 집단별로 수행, 보상도 집단별. 시험은 개별이나 성적은 소속 집단 평균 → 무임승차·봉 효과 우려</td></tr>\n</table></div>"},{"id":"method-37","name":"인지부하이론과 멀티미디어 교수설계 원리","items":[{"text":"등장배경(스웰러)","children":[]},{"text":"인지부하의 종류","children":[{"text":"내재적 인지부하","children":[]},{"text":"외재적 인지부하","children":[]},{"text":"본질적 인지부하","children":[]}]},{"text":"종류별 제거 가능 여부","children":[]},{"text":"멀티미디어 교수설계 원리","children":[{"text":"완성된 예시의 활용 원리","children":[]},{"text":"사전훈련 원리","children":[]},{"text":"근접성의 원리","children":[]},{"text":"양식의 원리","children":[]},{"text":"중복의 원리","children":[]},{"text":"일관성의 원리","children":[]},{"text":"개인화의 원리","children":[]},{"text":"자기설명 및 인지리허설의 원리","children":[]}]}],"explainHtml":"<div class=\"mn-tip\">💡 이 이론은 교육심리의 ’정보처리이론’과 바로 이어지는 내용이라 함께 공부하면 좋습니다.</div>\n<div class=\"mn-block\"><h4>등장배경</h4><p>호주 출신 교육심리학자 스웰러(Sweller)가 연구. 인간의 작업기억(작동기억) 용량에는 한계가 있어, 너무 많은 정보를 한꺼번에 제시하면 인지적 과부하가 일어나 학습을 방해한다는 것이 핵심.</p></div>\n<h4>인지부하 종류 및 멀티미디어 교수설계 원리 (3)</h4>\n<div class=\"mn-table-wrap\"><table class=\"mn-table\">\n<tr><th>종류</th><th>정의</th><th>제거 가능 여부</th><th>교수설계 원리</th></tr>\n<tr><td><strong>내재적 인지부하</strong></td><td>학습자료·과제 자체의 난이도·복잡성에 의해 발생</td><td>제거 불가(과제 자체이므로), 관리만 가능</td><td>완성된 예시의 활용 원리(단계별 예시 답안을 먼저 보여줌) / 사전훈련 원리(선수학습을 먼저 시행)</td></tr>\n<tr><td><strong>외재적 인지부하</strong></td><td>비합리적인 학습방법(엉망인 자료·설계)에 의해 발생</td><td>제거·감소 가능</td><td>근접성의 원리(글과 그림을 가깝게) / 양식의 원리(시각+청각을 함께 제시) / 중복의 원리(동일 내용의 글+나레이션 동시 제공 지양) / 일관성의 원리(관련 없는 배경음악·그림 제거)</td></tr>\n<tr><td><strong>본질적(본유적) 인지부하</strong></td><td>학습자료 이해·정보처리를 위해 학습자가 정신적 노력을 기울일 때 발생 (누구나 본질적으로 가짐)</td><td>—</td><td>개인화의 원리(학습자와 대화하듯 전달) / 자기설명 및 인지리허설의 원리(스스로 설명해보게 함)</td></tr>\n</table></div>\n<div class=\"mn-tip\">💡 메이어(Mayer)는 스웰러의 인지부하이론을 참고해 이 멀티미디어 교수설계 원리들을 만들었습니다 — 인지부하이론(이론적 배경, 스웰러)과 멀티미디어 교수설계 원리(구체적 실천 지침, 메이어)를 한 세트로 기억하면 됩니다.</div>"},{"id":"method-38","name":"원격교육","items":[{"text":"정의","children":[]},{"text":"특징(4가지)","children":[{"text":"독립성","children":[]},{"text":"자율성","children":[]},{"text":"학습공간의 확장성","children":[]},{"text":"상호작용성(3가지 유형)","children":[]}]},{"text":"매체 선정 시 고려요소(ACTIONS 모형)","children":[]},{"text":"원격수업의 형태(E-learning·U-learning·M-learning)","children":[]},{"text":"장점","children":[]},{"text":"단점","children":[]},{"text":"학습자 고립감 해소방법","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>개념</h4><p>교사와 학습자가 직접 대면하지 않고 시간적·공간적 제약에서 벗어나 방송교재·오디오·비디오 교재 등을 매개로 교수학습 활동을 하는 교육방법.</p></div>\n<div class=\"mn-block\"><h4>특징 (4)</h4><p>1. 독립성 — 시공간적으로 분리된 상태에서 매체 기반 독립 학습 (교사는 좋은 교재 제작 책임)<br>2. 자율성 — 학습자가 언제·어디서·무엇을·어떻게 학습할지 의사결정권을 가짐<br>3. 학습공간의 확장성 — 웹사이트·SNS·게시판 등 정보 습득·공유·가공 공간이 무한 확대<br>4. 상호작용성 — 세 가지 상호작용이 중요: ①학습자-학습내용(교재) ②학습자-교수자 ③학습자-학습자</p></div>\n<div class=\"mn-block\"><h4>원격교육 매체 선정 시 고려요소 — 베이츠(Bates)의 ACTIONS 모형</h4><p>Access(접근성)·Cost(경제성)·Teaching and Learning(교수-학습지원성)·Interactivity and user-friendliness(상호작용성 및 친화성)·Organizational issues(조직변화성)·Novelty(참신성)·Speed(신속성)</p></div>\n<div class=\"mn-block\"><h4>원격수업의 도구 (3)</h4><p>온라인 게시판(패들렛·멘티미터·잼보드) / 온라인 화상회의(줌·구글미트) / 온라인 교실(구글 클래스룸·EBS온라인클래스·네이버밴드)</p></div>\n<div class=\"mn-block\"><h4>원격수업의 형태 (3)</h4><p>E-learning(웹기반학습, 웹퀘스트) / U-learning(유비쿼터스 러닝) / M-learning(모바일 러닝)</p></div>\n<div class=\"mn-block\"><h4>장점 (3)</h4><p>시공간 제약 없음 / 학습자 자율성 향상 / 비용 절감<br><strong>단점 (3)</strong>: 학습자 고립감 증가 / 집중력 저하 / 수업 중단 가능성(기술적 문제)<br><strong>학습자 고립감 해소방법 (2)</strong>: 실시간 쌍방향 수업 / 과제형 수업(토론 등 상호작용 유도)</p></div>"},{"id":"method-39","name":"블렌디드 러닝","items":[{"text":"정의(교육적·경제적 목적)","children":[]},{"text":"특징(3가지)","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>기본개념</h4><p>온라인과 오프라인 강좌를 융합해 학업성취도 제고(교육적 목적)와 교육행정 비용 절감(경제적 목적)을 동시에 달성하고자 고안된 교육방법.</p></div>\n<div class=\"mn-block\"><h4>특징 (3)</h4><p>학습효과 극대(다양한 교수방법) / 학습공간 확대(시공간 제약 탈피) / 학습자 중심 수업(개별화·자기주도)</p></div>"},{"id":"method-40","name":"플립드 러닝","items":[{"text":"등장배경","children":[]},{"text":"정의(역진행 수업 방식)","children":[]},{"text":"설계 시 고려사항(4가지)","children":[{"text":"유연한 환경","children":[]},{"text":"학생중심 수업","children":[]},{"text":"계획된 내용","children":[]},{"text":"전문적인 교사","children":[]}]},{"text":"블렌디드 러닝과의 관계","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>등장배경</h4><p>2000년대 미국 베이커(Baker) 교수가 자신의 수업방식을 Flipped라고 설명하며 주목받음.</p></div>\n<div class=\"mn-block\"><h4>기본개념</h4><p>블렌디드 학습의 수업형태에 선행학습 개념을 도입해, 온라인을 통한 선행학습 이후 오프라인 강의를 통해 교사와 토론식 강의·프로젝트 수업을 진행하는 <strong>역진행 수업 방식</strong>.</p></div>\n<div class=\"mn-block\"><h4>설계 시 고려사항 (4)</h4><p>1. 유연한 환경 — 학습시간·공간에 유연·탄력적, 혼란스러운 수업 환경도 수용 가능해야 함<br>2. 학생중심 수업 — 본 수업시간은 보충·심화학습 제공 방식으로 전환<br>3. 계획된 내용 — 수업내용·사전학습내용에 대한 명확한 계획 필요<br>4. 전문적인 교사 — 단순 지식전달자를 넘어 사전자료 제공+심화학습 제공 능력 필요</p></div>\n<div class=\"mn-tip\">💡 플립드 러닝은 “블렌디드 러닝의 업그레이드 버전”이라 특징(학습효과 극대·학습공간 확대·학습자중심)이 동일하고, 장단점도 원격교육의 장단점을 그대로 활용할 수 있어 따로 외울 필요가 없습니다.</div>"},{"id":"method-41","name":"에듀테크","items":[{"text":"정의","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>기본개념</h4><p>온라인 수업을 듣는 기존 e-learning을 넘어, 개인의 학습 패턴을 파악해 부족한 부분은 더 공부하게 하고 틀린 문제는 다시 풀게 하는 프로세스를 통해 개인별 맞춤형 수업이 가능한 교육과 기술을 결합한 교육.</p></div>"}]},{"title":"3. 교육공학","theories":[{"id":"method-42","name":"교육공학의 개념","items":[{"text":"정의(AECT 정의)","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>기본개념</h4><p>효과적인 교수·학습을 위해 인적·물적 자원을 효율적으로 활용하는 데 관심을 둔 학문. 미국교육공학협회(AECT)는 교사와 교수매체를 구별하지 않는 광범위한 정의로 “교육목적을 성취하기 위한 수단에 관한 체계적 연구로, 교육과정의 설계·개발·활용·관리·평가에 관한 이론과 실제를 다루는 학문”이라고 규정.</p></div>"},{"id":"method-43","name":"교육공학의 영역","items":[{"text":"5가지 영역","children":[{"text":"설계","children":[]},{"text":"개발","children":[]},{"text":"활용","children":[]},{"text":"관리","children":[]},{"text":"평가","children":[]}]},{"text":"ADDIE와의 관계","children":[]}],"explainHtml":"<h4>영역 (5)</h4>\n<div class=\"mn-table-wrap\"><table class=\"mn-table\">\n<tr><th>영역</th><th>내용</th></tr>\n<tr><td>설계</td><td>학습자 특성·학습조건을 분석하고 교수목적 달성에 필요한 방법·전략을 기획</td></tr>\n<tr><td>개발</td><td>설계에서 나온 데이터를 근거로 인쇄자료·시청각자료·컴퓨터 활용 등 구체적 교수매체 제작</td></tr>\n<tr><td>활용</td><td>학습 절차·자원을 사용하는 행위에 관한 실제 학습 영역</td></tr>\n<tr><td>관리</td><td>프로그램 조직, 직원 관리, 예산·시설 기획·집행, 변화 대처 (하위영역: 프로젝트관리·자원관리·전달체제관리·정보관리)</td></tr>\n<tr><td>평가</td><td>교육 프로그램·교육과정의 질·효과·가치 판단 (하위영역: 문제분석·준거지향평가·형성평가·총괄평가)</td></tr>\n</table></div>\n<div class=\"mn-tip\">💡 이 5가지 영역(설계·개발·활용·관리·평가)은 사실상 ADDIE(분석·설계·개발·실행·평가)와 뿌리가 비슷한 발상입니다 — 교육공학이라는 학문 자체가 “체계적으로 기획하고, 만들고, 쓰고, 관리하고, 평가한다”는 큰 흐름을 공유하기 때문입니다.</div>"},{"id":"method-44","name":"벌로의 SMCR 모형","items":[{"text":"정의","children":[]},{"text":"통신과정 요소(4가지)","children":[{"text":"송신자(S)","children":[]},{"text":"전달내용(M)","children":[]},{"text":"통신수단","children":[]},{"text":"수신자(R)","children":[]}]},{"text":"전달내용의 하위요소(내용·요소·구조·코드·처리)","children":[]},{"text":"시사점","children":[]},{"text":"피드백의 유무(선형적 모형)","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>기본개념</h4><p>교수학습 과정에 통신 개념을 도입해, 교사와 학습자 간의 통신과정(상호작용)으로 보는 모형.</p></div>\n<h4>통신과정 요소 (4, SMCR)</h4>\n<div class=\"mn-table-wrap\"><table class=\"mn-table\">\n<tr><th>요소</th><th>내용</th></tr>\n<tr><td><strong>S</strong>(Source, 송신자=교사)</td><td>통신기술·태도·지식수준·사회체제·문화양식에 영향받음</td></tr>\n<tr><td><strong>M</strong>(Message, 전달내용)</td><td>내용(교육내용) / 요소(어떤 내용을 선택할지) / 구조(어떤 순서로 전달할지) / 코드(언어·비언어 코드, 예: 몸짓·표정·사진) / 처리(선택된 코드·내용을 어떤 형식으로 전달할지)</td></tr>\n<tr><td>(통신수단)</td><td>송신자의 오감(시각·청각·촉각·후각·미각)을 통하거나 TV·라디오·책·인터넷 등으로 통신</td></tr>\n<tr><td><strong>R</strong>(Receiver, 수신자=학습자)</td><td>송신자와 마찬가지로 통신기술·태도·지식수준·사회체제·문화양식에 영향받음</td></tr>\n</table></div>\n<div class=\"mn-block\"><h4>시사점(특징) (4)</h4><p>- 송신자-수신자의 하위영역(통신기술·태도·지식수준·문화양식)이 일치할수록 커뮤니케이션이 원만 (단, 사회체제는 교사가 통제 불가)<br>- 통신수단은 5감각 모두를 통해 전달되므로 다양한 매체 활용 필요<br>- 전달내용은 내용·요소·구조·코드·처리로 구체화되어야 함<br>- <strong>SMCR 모형은 피드백이 따로 없는 선형적 모형</strong></p></div>"},{"id":"method-45","name":"쉐논과 슈람의 통신모형","items":[{"text":"정의","children":[]},{"text":"통신과정 요소(6가지)","children":[{"text":"경험의 장","children":[]},{"text":"기호화","children":[]},{"text":"신호","children":[]},{"text":"해독","children":[]},{"text":"잡음","children":[]},{"text":"피드백","children":[]}]},{"text":"시사점","children":[]},{"text":"벌로 모형과의 차이(피드백 유무)","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>기본개념</h4><p>벌로 모형과 마찬가지로 통신 개념을 교수학습 과정에 도입한 모형.</p></div>\n<div class=\"mn-block\"><h4>통신과정 요소 (6)</h4><p>경험의 장(송신자·수신자의 경험이 일치할수록 통신이 완벽) → 기호화(메시지를 보내는 과정) → 신호(오감 활용) → 해독(메시지를 받는 과정) → <strong>잡음</strong>(통신을 방해하는 요소, 예: 소음·냄새·밝기) → <strong>피드백</strong>(수신자의 반응을 송신자에게 다시 전달)</p></div>\n<div class=\"mn-block\"><h4>시사점(특징) (3)</h4><p>- 경험이 일치할수록 통신이 완벽 → 경험의 장을 확대해야 함<br>- 잡음이 적을수록 통신이 잘 일어남 → 최적의 교실 환경 구축 필요<br>- <strong>피드백이 많을수록 경험 차이·잡음에서 나오는 문제를 해결 가능</strong> → 피드백 필요</p></div>\n<div class=\"mn-tip\">💡 벌로(SMCR)와 쉐논&amp;슈람의 가장 큰 차이는 “<strong>피드백의 유무</strong>”입니다. 벌로는 피드백이 없는 일방향(선형) 모형인 반면, 쉐논&amp;슈람은 피드백이 있는 순환형 모형입니다. 이 차이 하나만 기억해도 두 모형을 구분하는 문제는 대부분 풀립니다.</div>"},{"id":"method-46","name":"교수매체의 특성","items":[{"text":"기능적 특성(4가지)","children":[{"text":"고정성","children":[]},{"text":"조작성","children":[]},{"text":"확충성","children":[]},{"text":"반복성","children":[]}]}],"explainHtml":"<div class=\"mn-block\"><h4>교수매체의 기능적 특성 (4)</h4><p>1. 고정성 — 사물·상황을 그대로 포착·보존·재생 (예: 사진, 동영상, 녹음)<br>2. 조작성 — 사진·비디오를 여러 방법으로 변형 (예: 느리게 재생)<br>3. 확충성 — 거의 동일한 경험을 많은 사람에게 제공 (예: 어느 지역에서든 시청 가능한 동영상 강의)<br>4. 반복성 — 동일 내용을 반복적으로 사용 (예: 이해할 때까지 반복 시청)</p></div>"},{"id":"method-47","name":"교수매체의 효과성 연구","items":[{"text":"등장배경","children":[]},{"text":"연구 유형","children":[{"text":"교수매체 비교연구","children":[]},{"text":"교수매체 특성 연구","children":[]},{"text":"교수매체 선호 연구","children":[]},{"text":"교수매체 경제성 연구","children":[]}]},{"text":"교수매체 비교연구의 한계(신기성 효과)","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>등장배경</h4><p>새로운 교수매체가 도입되었을 때 기존 방식보다 정말 효과적인가에 대한 의문에서 시작.</p></div>\n<h4>연구 유형 (4)</h4>\n<div class=\"mn-table-wrap\"><table class=\"mn-table\">\n<tr><th>연구</th><th>이론적 토대</th><th>내용</th><th>한계/특징</th></tr>\n<tr><td>교수매체 비교연구</td><td>행동주의 심리학</td><td>매체 간 상대적 효과성 비교 (예: 동영상 vs 실제 교사 수업)</td><td><strong>일관성 없음</strong>이 문제 — 수업내용 차이, 설계 노력 차이, <strong>신기성 효과</strong>(Novelty effect: 새로운 매체에 대한 호기심으로 처음엔 집중하지만 시간이 지나면 효과 감소)가 학업성취에 영향을 준다는 점을 간과</td></tr>\n<tr><td>교수매체 특성(속성) 연구</td><td>인지주의 심리학</td><td>특정 매체의 속성 자체가 학업성취에 미치는 영향 (예: 텍스트 매체가 추론능력에 미치는 효과)</td><td>—</td></tr>\n<tr><td>교수매체 선호 연구</td><td>—</td><td>매체 활용에 대한 학습자의 태도·가치관·신념이 학습에 미치는 영향</td><td>—</td></tr>\n<tr><td>교수매체 경제성 연구</td><td>—</td><td>매체 개발의 경제적 비용이 콘텐츠 질에 미치는 영향</td><td>—</td></tr>\n</table></div>"},{"id":"method-48","name":"컴퓨터 보조 수업(CAI)","items":[{"text":"정의","children":[]},{"text":"장점","children":[]},{"text":"단점","children":[]},{"text":"교육용 소프트웨어(코스웨어)의 유형","children":[{"text":"개인교수형","children":[]},{"text":"반복학습형","children":[]},{"text":"시뮬레이션형","children":[]},{"text":"게임형","children":[]},{"text":"발견학습형","children":[]}]},{"text":"코스웨어 개발단계","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>기본개념</h4><p>컴퓨터를 활용해 교과내용을 학습자에게 가르치는 교수 방법.</p></div>\n<div class=\"mn-block\"><h4>장점 (4)</h4><p>상호작용 가능한 수업 / 개별화 수업(수준별 프로그램) / 흥미 유발(멀티미디어·시뮬레이션·게임) / 실시간 피드백<br><strong>단점 (3)</strong>: 학습자의 능동적 참여 필요 / 컴퓨터 활용 능력 필요 / 유지관리 비용</p></div>\n<div class=\"mn-block\"><h4>교육용 소프트웨어(코스웨어) 유형 (5)</h4><p>개인교수형(교사 역할을 컴퓨터가 담당) / 반복학습형(단어암기 프로그램 등) / 시뮬레이션형(모의실험, 예: 가상 운전연습) / 게임형 / 발견학습형(스스로 정보를 찾아가는 유형)</p></div>\n<div class=\"mn-block\"><h4>코스웨어 개발단계</h4><p>분석단계(내용선정→목표설정→교수전략선정) → 개발단계(흐름도 작성→스토리보드 작성→프로그래밍) → 평가단계(지침서 준비→형성평가→수정 및 완성)</p></div>"},{"id":"method-49","name":"컴퓨터 관리수업(CMI)","items":[{"text":"정의","children":[]},{"text":"특징","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>기본개념</h4><p>컴퓨터를 교수매체로 사용하지 않고, 수업 관련 정보·자료를 기록·분석·종합·평가 (예: 시험출제·채점·성적관리 프로그램)<br><strong>특징 (2)</strong>: 교사의 행정업무 부담 경감 / 개발에 전문지식·시간·경비 소요</p></div>"},{"id":"method-50","name":"컴퓨터 매개통신(CMC)","items":[{"text":"정의","children":[]},{"text":"특징","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>기본개념</h4><p>컴퓨터에 정보통신망을 연결해 사용자 간 정보 공유·의사소통을 가능하게 하는 시스템 (예: 웹기반 수업, 전자우편, 인터넷 게시판)<br><strong>특징 (2)</strong>: 1인 교사 대 다수 학생이라는 전통적 교실의 한계 극복 / 협동적 상호작용 환경 구축 가능</p></div>"},{"id":"method-51","name":"컴퓨터 능력적응검사(CAT)","items":[{"text":"정의","children":[]},{"text":"특징(3가지)","children":[{"text":"문항 적응적 제시","children":[]},{"text":"측정의 효율성","children":[]},{"text":"즉각적 피드백 가능","children":[]}]}],"explainHtml":"<div class=\"mn-block\"><h4>기본개념</h4><p>학습자의 개별 능력을 측정하기 위해 개발된 평가용 프로그램. <strong>학습자 수준에 따라 문항을 다르게 제시</strong>하는 시스템.<br><strong>특징 (3)</strong>: 단순 컴퓨터 이용 검사(CBT)와 달리 이전 문항 응답 결과를 반영해 다음 문항을 제시 / 짧은 시간·적은 문항으로도 정확한 측정 가능(예: CAT 10문제≈전통검사 40문제 신뢰도) / 검사 도중에도 언제든 피드백 제공 가능(전통검사는 종료 후에만 가능)</p></div>"},{"id":"method-52","name":"컴퓨터 리터러시","items":[{"text":"정의","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>기본개념</h4><p>리터러시(Literacy, 원래는 텍스트를 읽고 쓰는 능력)가 디지털 시대에 확장되어, 컴퓨터를 불편함 없이 활용할 수 있는 능력을 의미하게 된 것.</p></div>"}]},{"title":"4. 기타","theories":[{"id":"method-53","name":"로젠샤인의 수업 효과성 연구","items":[{"text":"정의(수업의 효과성)","children":[]},{"text":"연구 3단계","children":[{"text":"1단계: 교사의 인성적 특성 연구","children":[]},{"text":"2단계: 과정-산출 모형","children":[]},{"text":"3단계: 학습자의 적극적 참여 연구","children":[]}]},{"text":"단계별 연구결과","children":[]},{"text":"3단계에서 밝혀진 학습자 관련 변인(내용·시간·분위기)","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>기본개념</h4><p>수업의 효과성(효율성)이란 학습자의 학업성취 수준을 최대한 높이기 위해 수업의 활동·자원을 효율적으로 투입해 최대의 성과를 거두는 수업 방법. 로젠샤인(1979)은 이를 3단계로 나눠 연구.</p></div>\n<h4>수업의 효과성 연구 3단계</h4>\n<div class=\"mn-table-wrap\"><table class=\"mn-table\">\n<tr><th>단계</th><th>연구 내용</th><th>결과</th></tr>\n<tr><td>1단계</td><td>교사의 인성적 특성에 관한 연구(자아통제·사려성·열정·매력·외모·협동심·흥미·지도력 등이 학업성취와 관련 있는지)</td><td><strong>상관관계 없음</strong>을 발견</td></tr>\n<tr><td>2단계</td><td>과정-산출 모형: 교사의 행동과 학생의 학업성취(산출) 간 관계</td><td>내용제시의 명확성·수업활동의 다양성·교사의 열정·과제지향성·학생의 학습기회가 어느 정도 관련 있었으나 <strong>설명력 부족</strong></td></tr>\n<tr><td>3단계</td><td>학습자의 적극적 참여에 관한 연구</td><td>교사 행동 변인보다 <strong>학습자 관련 변인 3가지</strong>가 수업 효과성에 가장 중요함을 발견: ①수업에서 다뤄진 (내용) ②학습자가 사용한 (시간) ③학습자의 참여도를 높이는 학급 (분위기/상황)</td></tr>\n</table></div>\n<div class=\"mn-tip\">💡 이 연구가 흥미로운 지점은, “좋은 교사는 원래 성격이 좋다”는 통념(1단계)이 부정되고, 결국 “교사가 무엇을 어떻게 하느냐”(2·3단계)가 더 중요하다는 쪽으로 연구가 발전해 갔다는 서사입니다.</div>"},{"id":"method-54","name":"발문의 원리","items":[{"text":"발문 내용면의 원리","children":[]},{"text":"발문 방법면의 원리","children":[]},{"text":"교사가 반응할 때의 원리","children":[]}],"explainHtml":"<div class=\"mn-table-wrap\"><table class=\"mn-table\">\n<tr><th>구분</th><th>원리</th></tr>\n<tr><td>발문 내용면</td><td>수업목표 전 영역을 망라하는 다양한 발문 / 직접적이고 명료할 것 / 아동의 수준에 적합할 것</td></tr>\n<tr><td>발문 방법면</td><td>한 번에 한 가지 발문 / 쉬운 것에서 어려운 것 순으로 / 발문 후 충분한 시간 제공 / 특정 아동만이 아닌 고루 발문</td></tr>\n<tr><td>교사가 반응할 때</td><td>관대함 / 긍정적 / 용기를 줌</td></tr>\n</table></div>"}]}]},{"id":"eval","label":"교육평가 및 연구","sections":[{"title":"1. 교육평가의 이해","theories":[{"id":"eval-1","name":"검사관","items":[{"text":"정의","children":[]},{"text":"종류","children":[{"text":"측정관","children":[]},{"text":"평가관","children":[]},{"text":"총평관","children":[]}]},{"text":"유형별 인간관","children":[]},{"text":"유형별 중시하는 개념(신뢰도·객관도 / 내용타당도 / 구인타당도)","children":[]},{"text":"유형별 관련 교육관","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>기본개념</h4><p>검사관이란 학습자에게 어떤 변화가 일어났는지 확인하기 위한 정보를 수집하는 과정을 바라보는 관점.</p></div>\n<h4>검사관의 종류 (3)</h4>\n<div class=\"mn-table-wrap\"><table class=\"mn-table\">\n<tr><th>구분</th><th>측정관(measurement)</th><th>평가관(evaluation)</th><th>총평관(assessment, =사정)</th></tr>\n<tr><td>정의</td><td>일정한 규칙에 따라 학습자에게 수치를 부여하는 것으로 보는 관점</td><td>측정에 가치판단을 더해 변화·성취도를 알아보는 관점</td><td>인간의 행동특성을 다양한 방법으로 종합평가하는 관점</td></tr>\n<tr><td>인간관</td><td>행동특성은 변하지 않는다고 가정</td><td>행동특성은 변한다고 가정</td><td>행동특성은 환경과의 상호작용을 통해 변한다고 가정</td></tr>\n<tr><td>중시하는 것</td><td>신뢰도·객관도</td><td>내용타당도</td><td>구인타당도</td></tr>\n<tr><td>관련 교육관</td><td>선발적 교육관</td><td>발달적 교육관</td><td>인본주의적 교육관</td></tr>\n<tr><td>측정방법</td><td>상대평가 활용</td><td>변화의 증거를 얻을 수 있는 모든 방법</td><td>모든 방법을 종합적으로 활용</td></tr>\n<tr><td>예</td><td>몸무게 52kg, 토익 750점</td><td>토익 750점 = 기초 영문법을 다 설명할 수 있는 수준</td><td>내신·수능·면접·논술을 종합평가(졸업사정회 등)</td></tr>\n</table></div>\n<div class=\"mn-tip\">💡 세 관점은 “숫자만 본다(측정) → 숫자에 의미를 더한다(평가) → 여러 방법을 총동원해 종합적으로 본다(총평)”로 갈수록 넓어지는 흐름으로 이해하면 쉽습니다.</div>"},{"id":"eval-2","name":"교육관","items":[{"text":"정의","children":[]},{"text":"종류","children":[{"text":"선발적 교육관","children":[]},{"text":"발달적 교육관","children":[]},{"text":"인본주의적 교육관","children":[]}]},{"text":"유형별 전제(유전론/환경론/상호작용)","children":[]},{"text":"유형별 실패의 책임 소재","children":[]},{"text":"유형별 중시하는 평가방식","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>기본개념</h4><p>교육관이란 교육에 대한 포괄적인 견해로, 교육관에 따라 교육목표·교육평가의 방향과 방법이 달라짐.</p></div>\n<h4>교육관의 종류 (3)</h4>\n<div class=\"mn-table-wrap\"><table class=\"mn-table\">\n<tr><th>구분</th><th>선발적 교육관</th><th>발달적 교육관</th><th>인본주의적 교육관</th></tr>\n<tr><td>전제</td><td>유전론 — 지적 능력은 타고났고 교육받을 수 있는 집단은 소수</td><td>환경론 — 적절한 교수학습 환경만 있으면 누구나 목표 도달 가능</td><td>인간은 환경과 능동적으로 상호작용, 교육은 자아실현 과정</td></tr>\n<tr><td>실패의 책임</td><td>학생에게 있음</td><td>교사에게 있음</td><td>교사와 학생 모두에게 있음</td></tr>\n<tr><td>중시하는 평가</td><td>상대평가(규준지향평가) — 개인차 변별 중시</td><td>절대평가(목표지향평가) — 수업목표 달성도 중시</td><td>수행평가 — 전인적 특성 파악 중시</td></tr>\n<tr><td>행동변화 관점</td><td>교육으로 행동을 변화시킬 수 없다고 전제</td><td>교육으로 행동을 변화시킬 수 있다고 전제</td><td>학습자의 자율적·적극적 참여 중시</td></tr>\n<tr><td>관련 검사관</td><td>측정관</td><td>평가관</td><td>총평관</td></tr>\n</table></div>"}]},{"title":"2. 교육과정 평가의 모형","theories":[{"id":"eval-3","name":"타일러의 목표중심 평가모형","items":[{"text":"정의(이원목적 분류표)","children":[]},{"text":"평가절차(7단계)","children":[]},{"text":"장점","children":[]},{"text":"단점","children":[]},{"text":"스크리븐 모형과의 차이","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>기본개념</h4><p>평가를 미리 설정된 프로그램의 목표 달성 정도를 확인하는 것으로 보고, 명확하게 진술된 행동목표와 <strong>이원목적 분류표(문항 정보표)</strong>를 활용해 교육 성과를 평가하는 모형.</p></div>\n<div class=\"mn-tip\">💡 [학교 현장 상식] 이원목적 분류표는 학습목표를 내용영역·성취기준·난이도·배점 등으로 구분한 평가기준표로, 최근에는 ’문항 정보표’라는 이름으로 나이스(NEIS)에서 기본 제공됩니다. 교사는 시험마다 이걸 작성해 결재를 받아야 합니다.</div>\n<div class=\"mn-block\"><h4>평가절차 (7단계)</h4><p>①학교의 교육목표 설정 → ②교육목표 분류 → ③행동적 용어로 진술 → ④달성 여부를 확인할 장면·조건 설정 → ⑤측정방법·도구 선정/개발 → ⑥측정으로 자료 수집 → ⑦자료 분석해 성취를 행동목표와 비교</p></div>\n<div class=\"mn-block\"><h4>장점 (4)</h4><p>명확한 평가기준 제시(행동적 용어) / 논리적 일관성 유지(목표-내용-평가) / 교육목표 달성 정도를 정확히 파악 / 교육활동에 대한 책무성 향상</p></div>\n<div class=\"mn-block\"><h4>단점 (4)</h4><p>행동목표로 표현하기 어려운 내용(음악·미술·체육)은 평가 어려움 / 잠재적 교육효과 평가 어려움 / 교육과정 자체에 대한 평가 소홀 가능성 / 비교육적 행동 유발 가능성(과정 무시, 결과만 좋으면 그만이라는 식)</p></div>"},{"id":"eval-4","name":"그 외 목표중심 계열 모형","items":[{"text":"프로버스의 불일치(괴리) 모형","children":[]},{"text":"해몬드의 평가모형","children":[]},{"text":"스테이크의 반응평가모형","children":[]},{"text":"구바와 링컨의 자연주의 평가모형","children":[]},{"text":"팔릿과 해밀톤의 조명적 평가모형","children":[]}],"explainHtml":"<div class=\"mn-table-wrap\"><table class=\"mn-table\">\n<tr><th>모형</th><th>핵심 내용</th></tr>\n<tr><td>프로버스(Provus)의 불일치(괴리) 모형</td><td>프로그램이 달성하고자 하는 목표와 실제 수행 사이의 <strong>불일치(괴리) 정보</strong>를 파악해 개선·유지에 활용하는 모형. 타일러·CIPP와 특징을 공유</td></tr>\n<tr><td>해몬드(Hammond)의 평가모형</td><td>교육목표·평가를 <strong>수업차원·기관차원·행동차원</strong> 세 축으로 설정. 학교 현장 교사가 직접 활용 가능한 평가모형(타일러·스터플빔·스크리븐은 전문가용)</td></tr>\n<tr><td>스테이크(Stake)의 반응평가모형</td><td>평가자와 이해관계자들이 지속적으로 서로의 요구에 <strong>반응</strong>하면서 평가과정을 창조해나가는 모형</td></tr>\n<tr><td>구바와 링컨의 자연주의 평가모형</td><td>스테이크의 반응평가모형에 자연주의 패러다임을 적용, 평가 관계자들을 평가과정에 직접 참여시킴</td></tr>\n<tr><td>팔릿과 해밀톤의 조명적 평가모형</td><td>학습결과만이 아니라 그에 영향을 미치는 프로그램 개발과정·운영·상황·문제점 등을 <strong>총체적으로 탐구</strong>(조명적: 멀리서 전체를 비춰봄)</td></tr>\n</table></div>"},{"id":"eval-5","name":"스크리븐의 가치판단 모형(탈목표 평가모형)","items":[{"text":"등장배경","children":[]},{"text":"정의(외재적 준거)","children":[]},{"text":"특징(5가지)","children":[{"text":"목표중심+탈목표 평가","children":[]},{"text":"비교평가+비비교평가","children":[]},{"text":"내재적 준거+외재적 준거","children":[]},{"text":"형성평가와 총합평가의 구분","children":[]},{"text":"메타평가와의 관계","children":[]}]},{"text":"장점","children":[]},{"text":"단점","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>등장배경</h4><p>목표에 따른 평가는 내재적 가치를 제대로 평가할 수 없다는 한계(예: 시험점수는 높지만 실제 배운 게 없는 경우 vs 점수는 낮지만 깊이 있게 배운 경우) → 타일러의 목표중심 평가를 탈피하자는 취지에서 제안. <strong>탈목표 평가모형·소비자중심 평가·요구근거평가</strong>로도 불림.</p></div>\n<div class=\"mn-block\"><h4>기본개념</h4><p>평가를 프로그램의 가치를 판단하는 과정으로 보고, 프로그램이 의도한 효과뿐 아니라 <strong>부수적인 효과까지 포함</strong>해 종합적으로 판단하는 평가모형. 평가의 준거로 <strong>외재적 준거</strong>(의도된 목표뿐 아니라 의도되지 않은 부수 효과까지 포함하는 준거)를 삼음.</p></div>\n<div class=\"mn-block\"><h4>특징 (5)</h4><p>1. 목표중심 평가 + <strong>탈목표(goal-free) 평가</strong>를 모두 중시<br>2. 비(非)비교평가(프로그램 자체의 가치) + 비교평가(다른 프로그램과의 비교)를 모두 중시<br>3. 내재적 준거(평가도구·방법의 신뢰도·객관도) + <strong>외재적 준거</strong>(부수적 효과)에 모두 관심<br>4. 형성평가와 총합평가의 구분<br>5. <strong>메타평가</strong> — 이 모형은 평가도구의 개선을 위한 것이므로 메타평가라고도 할 수 있음</p></div>\n<div class=\"mn-block\"><h4>장점</h4><p>잠재적 결과(부수효과)까지 고려해 실제 효과를 종합적으로 파악<br><strong>단점</strong>: 목표 이외의 부가적 효과를 객관적으로 파악하기 어려워 신뢰성·타당성 확보가 어려움</p></div>"},{"id":"eval-6","name":"메타평가","items":[{"text":"정의(평가에 대한 평가)","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>기본개념</h4><p>스크리븐은 “평가 자체가 평가받아야 한다”고 주장하며 메타평가를 제안. 실시된 평가의 장단점을 평가관련자에게 알려주고, 평가 방법의 질적 개선을 위한 정보를 얻기 위해 실시하는 평가 — 즉 <strong>평가과정과 평가결과에 대한 평가</strong>.</p></div>"},{"id":"eval-7","name":"스터플빔의 의사결정모형(CIPP)","items":[{"text":"등장배경","children":[]},{"text":"정의","children":[]},{"text":"평가유형(4가지)","children":[{"text":"상황평가","children":[]},{"text":"투입평가","children":[]},{"text":"과정평가","children":[]},{"text":"산출평가","children":[]}]},{"text":"평가유형별 대응 의사결정 단계","children":[]},{"text":"장점","children":[]},{"text":"단점","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>등장배경</h4><p>1960년대 미국 오하이오 주립대 스터플빔 교수가 초중등 교육 개선을 위해 개발. “평가는 목적 달성 여부 파악보다, <strong>프로그램을 개선하기 위해</strong> 사용해야 한다”는 것이 핵심 주장.</p></div>\n<div class=\"mn-block\"><h4>기본개념</h4><p>평가를 의사결정자에게 유용한 정보를 제공해 의사결정을 돕는 과정으로 보고, 상황(Context)·투입(Input)·과정(Process)·산출(Product)의 4가지 평가유형을 제시(CIPP).</p></div>\n<h4>평가유형 (4)</h4>\n<div class=\"mn-table-wrap\"><table class=\"mn-table\">\n<tr><th>유형</th><th>대응 의사결정 단계</th><th>내용</th></tr>\n<tr><td>상황평가(Context)</td><td>계획단계</td><td>상황(맥락)과 집단의 요구를 분석해 교육목표를 결정하는 합리적 이유 제공</td></tr>\n<tr><td>투입평가(Input)</td><td>구조화단계</td><td>목표 달성을 위한 전략·절차·인적물적자원·예산·시기 정보 수집. 효과보다 노력·비용이 초과하면 프로그램을 배제하는 수단으로 활용 가능</td></tr>\n<tr><td>과정평가(Process)</td><td>실행단계</td><td>프로그램이 계획대로 실행되고 있는지 관찰·설문·토의로 정보 수집</td></tr>\n<tr><td>산출평가(Product)</td><td>재순환단계</td><td>최종 산출된 결과의 가치를 판단해 프로그램 존폐 결정에 필요한 정보 제공</td></tr>\n</table></div>\n<div class=\"mn-block\"><h4>장점 (2)</h4><p>의사결정자에게 도움이 되는 정보 제공 / 투입-산출 간 논리적 일관성 유지<br><strong>단점 (2)</strong>: 평가대상의 가치 자체는 평가하지 않음 / 의사결정 과정·방법이 구체적이지 않음</p></div>"}]},{"title":"3. 교육평가의 유형","theories":[{"id":"eval-8","name":"준거지향평가(절대평가)","items":[{"text":"정의","children":[]},{"text":"특징(5가지)","children":[{"text":"목표 성취 여부 중심","children":[]},{"text":"발달적 교육관 근거","children":[]},{"text":"타당도 중시","children":[]},{"text":"부적편포 전제","children":[]},{"text":"개인차에 대한 관점","children":[]}]},{"text":"장점","children":[]},{"text":"단점","children":[]},{"text":"규준지향평가와의 비교","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>기본개념</h4><p>평가기준을 절대적 기준인 <strong>학습목표</strong>에 두고 학습목표를 얼마나 달성했는지 성취수준을 확인하는 평가방법. 목표 미도달 시 교정학습 제공, 교수-학습 개선 정보 획득 목적도 있음. (준거=criterion=개인 점수의 절대적 기준)</p></div>\n<div class=\"mn-block\"><h4>특징 (5)</h4><p>1. 목표 성취 여부에 관심 (얼마나 성취했나보다 무엇을 성취했나)<br>2. <strong>발달적 교육관</strong>에 근거 (충분한 시간·조건이면 누구나 도달 가능하다고 봄)<br>3. <strong>타당도</strong>를 중시 (교육목표를 얼마나 충실히 측정하는가)<br>4. <strong>부적편포</strong>를 전제 (대부분 목표 달성 → 정규분포가 아닌 한쪽으로 치우친 분포)<br>5. 개인차는 교육 실패 때문이며 교육적 노력으로 해결 가능하다고 봄</p></div>\n<div class=\"mn-block\"><h4>장점 (3)</h4><p>내재적 동기 향상(경쟁 완화) / 교수학습 개선에 유용(무엇을 모르는지 직접 정보 제공) / 건전한 학습 분위기 조성(협동학습)<br><strong>단점 (3)</strong>: 개인차 변별 어려움 / 상급 학습자의 수업 흥미 저하 가능 / 준거(합격선) 설정이 어려움</p></div>"},{"id":"eval-9","name":"규준지향평가(상대평가)","items":[{"text":"정의","children":[]},{"text":"특징(5가지)","children":[{"text":"개인차 변별 중심","children":[]},{"text":"선발적 교육관 근거","children":[]},{"text":"신뢰도 중시","children":[]},{"text":"정규분포 전제","children":[]},{"text":"개인차에 대한 관점","children":[]}]},{"text":"장점","children":[]},{"text":"단점","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>기본개념</h4><p>평가기준을 <strong>집단 내부</strong>에 두고 개인의 성취수준을 집단 내 상대적 위치로 나타내는 평가방법. (규준=norm=원점수의 상대적 비교를 위한 기준)</p></div>\n<div class=\"mn-block\"><h4>특징 (5)</h4><p>1. 개인차 변별에 관심 (목표달성 여부·교육의 질에는 관심 없음)<br>2. <strong>선발적 교육관</strong>에 근거 (개인차를 당연시, 우수학생 선발 목적)<br>3. <strong>신뢰도</strong>를 중시 (개인차를 정확히 변별하는 것이 관건)<br>4. <strong>정규분포</strong>를 전제<br>5. 개인차는 무조건 발생하며, 개인차가 클수록 평가가 성공적이라고 봄</p></div>\n<div class=\"mn-block\"><h4>장점 (3)</h4><p>개인차 변별 가능 / 외적 동기유발에 효과적(경쟁) / 교사의 주관적 편견 배제(객관적 검사)<br><strong>단점 (3)</strong>: 내재적 동기 저하(지나친 경쟁으로 정서적 불안) / 교수학습 개선 곤란 / 열등감·패배감 초래 가능성</p></div>\n<div class=\"mn-tip\">💡 준거지향평가와 규준지향평가는 1장의 발달적 교육관/선발적 교육관, 그리고 검사관 중 평가관/측정관과 각각 짝을 이룹니다 — 서로 대칭 구조이므로 하나를 정확히 외우면 반대쪽은 뒤집어서 추론할 수 있습니다.</div>"},{"id":"eval-10","name":"진단평가","items":[{"text":"정의(시행 시점)","children":[]},{"text":"특징","children":[]},{"text":"시행전략","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>기본개념</h4><p>수업 전에 학생의 수준과 특성을 진단하기 위해 실시하는 평가.<br><strong>특징 (4)</strong>: 선수학습 정도 파악 / 학습 결손 파악 / 오개념 파악 / 학습자 특성(적성·흥미·사고력) 파악<br><strong>시행전략 (4)</strong>: 수업 전 쪽지시험·질문·퀴즈 / 표준화 진단검사 / 관찰법 / 체크리스트 활용</p></div>"},{"id":"eval-11","name":"형성평가","items":[{"text":"정의(시행 시점)","children":[]},{"text":"특징 및 장점","children":[]},{"text":"시행전략","children":[{"text":"구체적 피드백 제공","children":[]},{"text":"수시 평가","children":[]},{"text":"교정학습 기회","children":[]},{"text":"준거지향평가 실시","children":[]},{"text":"성적 미반영 원칙","children":[]}]},{"text":"효과적인 피드백 전략","children":[]},{"text":"형성평가 도구 제작 시 유의점","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>기본개념</h4><p>수업 <strong>중에</strong> 학생들이 학습목표를 제대로 달성하고 있는지, 내용을 얼마나 잘 이해하고 있는지 점검하기 위해 실시하는 평가.</p></div>\n<div class=\"mn-block\"><h4>특징 및 장점 (3)</h4><p>학습동기 유발(성공기대감) / 학습능력 향상(자기조절학습) / 교수전략 개선(피드백으로 지도방법 개선)</p></div>\n<div class=\"mn-block\"><h4>시행 전략 (5)</h4><p>구체적인 피드백 제공(형성평가만으론 부족) / 수시로 평가 실시(유능감·자기효능감 증진) / 교정학습 기회 제공 / <strong>준거지향평가(절대평가)</strong> 실시(목표달성·학습결손 파악) / 형성평가 결과는 최종 성적에 미반영(“할 수 있다”는 가능성을 느끼게 하기 위함)</p></div>\n<div class=\"mn-block\"><h4>효과적인 피드백 전략 (3)</h4><p>구체적 피드백으로 잘못을 고치게 함 / 간결한 형태로 제공 / 과제 수행 직후 제공</p></div>\n<div class=\"mn-block\"><h4>형성평가 도구 제작 시 유의점 (4)</h4><p>교사가 직접 제작(수업 내용에 대한 정보를 얻으려는 목적이므로) / 중요한 학습요소를 모두 포함 / 다양한 형식의 문항 활용(단, 복잡한 논문형은 지양) / 학습위계에 따라 문항 제작(하위 단원이 상위 단원의 필요조건이 되도록)</p></div>"},{"id":"eval-12","name":"총괄평가","items":[{"text":"정의(시행 시점)","children":[]},{"text":"특징","children":[]},{"text":"시행전략","children":[]},{"text":"진단·형성·총괄평가의 비교","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>기본개념</h4><p>일정한 교수학습이 끝난 <strong>후</strong> 교육목표의 달성 여부를 종합적으로 확인하는 평가. (주의: 매 수업 후가 아니라 학기말 검사·종합평가·표준화 검사 등을 의미)<br><strong>특징 (4)</strong>: 목표 달성 여부 판단 / 학업성적 결정 / 자격 부여(예: 장학금 추천) / 집단 간 성적 비교<br><strong>시행전략 (3)</strong>: 중간고사 / 기말고사 / 종합검사</p></div>"},{"id":"eval-13","name":"양적 평가와 질적 평가","items":[{"text":"양적 평가의 정의 및 장단점","children":[]},{"text":"질적 평가의 정의 및 장단점","children":[]},{"text":"교사 다면평가와의 관계(정량·정성평가)","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>기본개념</h4><p>평가대상을 수량화하여 통계적 분석을 통해 평가하는 방법. (예: 수능 점수, 매출액)<br><strong>특징</strong>: 수치화를 통한 객관성·신뢰성 확보가 목표<br><strong>장점</strong>: 과학적·체계적이라 객관적·신뢰성 있는 결과<br><strong>단점</strong>: 심층적 평가가 어렵고 질적 측면 간과 가능</p></div>"},{"id":"eval-14","name":"표준화 검사","items":[{"text":"정의","children":[]},{"text":"특징","children":[]},{"text":"기능","children":[{"text":"예측기능","children":[]},{"text":"진단기능","children":[]},{"text":"조사기능","children":[]}]},{"text":"교사제작 검사와의 차이","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>기본개념</h4><p>전문가들이 제작하고 표준화된 절차에 따라 실시·채점·해석하는 검사. (종류: 학력검사, 지능검사, 적성검사, 성격검사, 흥미검사, 창의성검사 등)<br><strong>특징 (3)</strong>: 전문가 제작, 규모 크고 절차 체계적 / 엄격한 절차·규정된 문항 / 표준화된 해석절차·채점기준(규준)·검사방법<br><strong>기능 (3)</strong>: 예측기능(장래 행동 특성 추정) / 진단기능(성격·흥미·지능 진단) / 조사기능(집단의 일반적 경향 파악)</p></div>"},{"id":"eval-15","name":"자기참조 평가","items":[{"text":"정의(3유형)","children":[{"text":"성장지향평가","children":[]},{"text":"능력지향평가","children":[]},{"text":"노력지향평가","children":[]}]},{"text":"장점","children":[]},{"text":"단점","children":[]}],"explainHtml":"<h4>기본개념(3유형)</h4>\n<div class=\"mn-table-wrap\"><table class=\"mn-table\">\n<tr><th>유형</th><th>관심</th><th>특징</th></tr>\n<tr><td>성장지향평가(성장참조)</td><td>초기 성취수준 대비 얼마나 성장했나</td><td>현재 성취가 과거보다 높으면 좋은 성적</td></tr>\n<tr><td>능력지향평가(능력참조)</td><td>잠재 능력 대비 얼마나 발휘했나</td><td>시험성적이 같아도 능력이 낮은 학생이 더 높은 성적 받을 수 있음</td></tr>\n<tr><td>노력지향평가(노력참조)</td><td>얼마나 노력했나</td><td>열심히 노력한 학생이 더 높은 성적</td></tr>\n</table></div>\n<div class=\"mn-block\"><h4>장점 (3)</h4><p>개별화 학습 촉진 / 학습동기 유발(노력에 따라 좋은 점수 가능) / 학습태도 개선<br><strong>단점 (2)</strong>: 객관적 평가가 어려움(사전시험 점수를 일부러 낮게 받는 등 왜곡 가능) / 공정성 문제로 실제 적용이 어려움</p></div>"},{"id":"eval-16","name":"성취평가","items":[{"text":"등장배경","children":[]},{"text":"정의(준거지향평가의 한 형태)","children":[]},{"text":"성취기준과 성취수준의 구분","children":[]},{"text":"성취수준의 두 형태(영역별 상중하, 학기단위 A~E)","children":[]},{"text":"성취평가 방법(5단계)","children":[]},{"text":"특징","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>등장배경</h4><p>2022 개정 교육과정(고교학점제 도입)으로 중요해진 개념. 우리나라는 상대평가를 중시해왔으나 경쟁 과열화로 절대평가를 되살리려는 흐름 속에서, 기존 절대평가(수우미양가처럼 성취기준과 연동되지 않은 단순 등급)를 보완해 <strong>성취기준에 근거한 학생평가</strong>로 발전시킨 것.</p></div>\n<div class=\"mn-block\"><h4>기본개념</h4><p>국가 교육과정에 근거해 개발된 교과목별 <strong>성취기준</strong>과 <strong>성취수준</strong>에 따라 학생이 무엇을 어느 정도 성취했는가를 평가하는 준거지향평가(절대평가)의 한 형태.</p></div>\n<div class=\"mn-block\"><h4>성취기준 vs 성취수준</h4><p>- 성취기준: 학생들이 성취해야 할 지식·기능·태도를 진술한 것(평가적 요소 없음). 예: “중력의 개념을 이해한다”<br>- 성취수준: 성취기준에 따라 몇 단계로 구분해 각 특성을 설명한 것. 상/중/하(<strong>영역별</strong> 성취수준, 국가가 개발해 학교에 제공) 또는 A~E(<strong>학기단위</strong> 성취수준, 단위학교 교사가 개발)</p></div>\n<div class=\"mn-block\"><h4>성취평가 방법 (5단계)</h4><p>①성취기준 분석 → ②성취수준 구체화 → ③평가도구 개발(A~E 전체를 점검할 수 있도록) → ④분할점수 설정(비율 근거 또는 내용분석 근거) → ⑤성취평가 결과 산출 및 보고</p></div>\n<div class=\"mn-block\"><h4>특징 (4)</h4><p>내용·과정의 심층 분석으로 교수학습 개선 용이 / 학생이 무엇을 알고 할 수 있는지 파악 가능 / 수준별 맞춤형 교육과정 운영 가능 / 미리 선정된 교육목표에 따라 평가하고 해석</p></div>"},{"id":"eval-17","name":"수행평가","items":[{"text":"정의(다른 명칭들)","children":[]},{"text":"이론적 근거(구성주의적 지식관)","children":[]},{"text":"특징(5가지)","children":[{"text":"집단평가 중시","children":[]},{"text":"과정 중시","children":[]},{"text":"지속적 평가","children":[]},{"text":"학생의 평가 참여","children":[]},{"text":"실제 상황에서의 달성 여부","children":[]}]},{"text":"설계 시 유의사항","children":[]},{"text":"장점","children":[]},{"text":"단점","children":[]},{"text":"수행평가의 종류(10가지)","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>기본개념</h4><p>실제 상황 하에서 학생 스스로 자신의 지식·기능을 산출물이나 행동으로 표현하거나 답으로 작성하도록 요구하는 평가. <strong>과정중심 평가·참평가·역동적평가·질적평가·직접평가·대안적평가·포트폴리오평가</strong>로도 불림.</p></div>\n<div class=\"mn-tip\">💡 여기서 “행동”은 신체 동작만이 아니라 말하기·읽기·쓰기·그리기·만들기 등 지식·기능·태도를 나타내는 모든 활동과 그 준비과정까지 포함합니다. 전통적 평가(선택형)가 절대주의 진리관·서열화 중심(양적평가)이라면, 수행평가는 구성주의적 지식관(상대주의 진리관)·성장 중심(질적평가)에 근거합니다.</div>\n<div class=\"mn-block\"><h4>수행평가 특징 (5)</h4><p>집단평가 중시(개인+집단) / 결과뿐 아니라 과정도 중시 / 지속적인 평가(일회성 지양) / 학생을 평가에 참여시킴(자기평가·보고서) / 실제 상황에서의 달성 여부 파악</p></div>\n<div class=\"mn-block\"><h4>설계 시 유의사항 (4)</h4><p>타당성·신뢰도 확보(명확한 채점기준=루브릭 제시) / 다양한 학습성과 평가(지능·인지전략·태도·운동기능 등) / 공정성 확보 / 실제적 과제로 평가</p></div>\n<div class=\"mn-block\"><h4>장점 (4)</h4><p>종합적·전인적 평가(인지+정의+심동 영역) / 결과뿐 아니라 수행과정도 평가 / 학습동기·흥미 유발(실생활 관련 과제) / 자기주도적 학습능력 향상<br><strong>단점 (4)</strong>: 평가도구 개발의 어려움 / 채점과 평가의 어려움(항목이 많음) / 객관성·신뢰성 저하(채점자 주관 개입) / 많은 시간과 노력 소요</p></div>\n<div class=\"mn-note\"><strong>Q&amp;A</strong>: “창의·인성교육을 위한 평가”나 “과정중심 평가”는 새로운 평가 종류가 아니라 수행평가를 다르게 표현한 것이므로, 수행평가의 내용을 그대로 활용하면 됩니다.</div>"},{"id":"eval-18","name":"루브릭","items":[{"text":"정의","children":[]},{"text":"특징(장점)","children":[]},{"text":"활용 시 유의사항","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>수행평가의 종류 (10)</h4><p>서술형·논술형 검사 / 구술시험 / 토론법 / 실험실습법 / 면접법 / 관찰법 / 자기평가 및 동료평가 / 연구보고서법 / 포트폴리오법 / 프로젝트법</p></div>\n<div class=\"mn-tip\">💡 각 유형별 특징·장단점은 따로 외울 필요 없이, 위 “수행평가”의 특징·장단점을 그대로 활용하면 됩니다.</div>\n<div class=\"mn-block\"><h4>루브릭(Rubric)</h4><p>학생들의 수행 과정과 결과를 측정하기 위해 고안된 평가척도(=채점기준표). 정해진 양식은 없으며 보통 왼쪽에 평가요소, 오른쪽에 성취수준·채점기준을 제시.</p></div>\n<div class=\"mn-tip\">💡 [학교 현장 상식] 루브릭은 학기초 작성하는 ‘교과 평가계획’에 반드시 포함해야 하는 요소입니다. 평가계획·진도계획은 ’학교알리미’ 사이트에 공시되며, 오류(예: 배점 실수, 선행출제)가 발견되면 학업성적관리위원회(위원장=교장) 심의를 거쳐야 해서 현장 교사들이 특히 신경 쓰는 업무입니다.</div>\n<div class=\"mn-block\"><h4>루브릭 특징(장점) (3)</h4><p>객관도·신뢰도 향상(사전 제시된 채점기준) / 자기조절 학습태도 증진(구체적 안내) / 현재 상태 진단에 도움(수준별 세분화)<br><strong>루브릭 활용 시 유의사항 (3)</strong>: 충분한 사전 설명 필요 / 실제적인 피드백 병행 필요 / 구체적인 수행 수준 명시 필요</p></div>"},{"id":"eval-19","name":"정의적 평가","items":[{"text":"정의","children":[]},{"text":"필요성","children":[]},{"text":"평가방법의 종류","children":[{"text":"관찰법(일화기록법·체크리스트·평정척도)","children":[]},{"text":"자기보고법(질문지법·리커트 척도·의미변별척도·써스톤 척도)","children":[]},{"text":"사회성 측정법(동료지명법·동료평정법·짝진비교법)","children":[]},{"text":"면접법","children":[]}]}],"explainHtml":"<div class=\"mn-block\"><h4>기본개념</h4><p>기존의 줄 세우는 평가에서 벗어나 학생들의 태도·자아개념·학습동기·자기효능감·대인관계·성격·도덕성 등 <strong>정의적 특성</strong>을 평가해 학생들을 이해하고 돕기 위한 평가.</p></div>\n<div class=\"mn-block\"><h4>필요성 (3)</h4><p>교수학습 효과 극대화 / 전인교육 실현 / 교수 프로그램 개선</p></div>\n<h4>종류 (4)</h4>\n<div class=\"mn-table-wrap\"><table class=\"mn-table\">\n<tr><th>종류</th><th>개념</th><th>세부 방법</th></tr>\n<tr><td>관찰법</td><td>일상·학습상황에서 행동을 직접 관찰·해석</td><td><strong>일화기록법</strong>(우발적 행동을 구체적으로 기록, 장점: 간편/단점: 원인 파악 어려움), <strong>체크리스트</strong>(행동 목록의 시행 여부만 표시, 장점: 빠름/단점: 목록 밖 행동은 놓침), <strong>평정척도</strong>(수치·급간으로 평가 — 숫자평정척도/도식평정척도/기술식 도식평정척도)</td></tr>\n<tr><td>자기보고법</td><td>자신의 감정·태도·신념을 스스로 표현</td><td><strong>질문지법</strong>(구조화된 질문에 스스로 응답), <strong>척도법</strong> — <strong>리커트 척도</strong>(모든 진술문에 반응해 합산하는 종합평정법, 긍정+부정 진술문으로 구성해야 함), <strong>의미변별척도</strong>(대비되는 형용사 양극단에 표시), <strong>써스톤 척도</strong>(우호적~비우호적 태도를 등간격으로 구분한 등간척도, =‘유사동간척도’)</td></tr>\n<tr><td>사회성 측정법(교우관계 조사법)</td><td>모레노(Moreno)가 개발, 학급 구성원 간 호의·배척관계를 조사해 집단 성격 파악</td><td><strong>동료지명법</strong>(이름 쓰기), <strong>동료평정법</strong>(순위 매기기), <strong>짝진비교법</strong>(둘 중 택1)</td></tr>\n<tr><td>면접법</td><td>학생과 직접 대화로 정보 수집</td><td>직접면접, 전화면접, 화상면접</td></tr>\n</table></div>\n<div class=\"mn-block\"><h4>정의적 영역 평가 시 고려사항</h4><p>관찰법·면접법 활용 시 평가의 오류(아래 6번 참고)에 주의</p></div>"},{"id":"eval-20","name":"평가(평정)의 오류","items":[{"text":"평가의 오류와 평정의 오류의 구분","children":[]},{"text":"오류의 종류(7가지)","children":[{"text":"논리적 오류","children":[]},{"text":"인상의 오류(후광효과)","children":[]},{"text":"집중화 경향의 오류","children":[]},{"text":"대비의 오류","children":[]},{"text":"관대화의 오류","children":[]},{"text":"엄격화의 오류","children":[]},{"text":"근접의 오류","children":[]}]},{"text":"오류별 발생이유","children":[]},{"text":"해결책","children":[]}],"explainHtml":"<div class=\"mn-tip\">💡 ’평가의 오류’는 평가 전 과정에서 일어나는 모든 오류(지식·경험 부족, 도구 부적절 등)를, ’평정의 오류’는 그중에서도 <strong>평가자의 주관적 판단</strong>으로 발생하는 오류(주로 관찰법·면접법 사용 시)를 가리킵니다.</div>\n<h4>평정의 오류 종류 (7)</h4>\n<div class=\"mn-table-wrap\"><table class=\"mn-table\">\n<tr><th>오류</th><th>정의</th><th>발생이유</th></tr>\n<tr><td>논리적 오류</td><td>논리적으로 무관한 두 특성을 연관지어 판단 (예: 키가 낮으면 성적도 낮을 것)</td><td>두 특성이 논리적으로 관련 있다고 착각</td></tr>\n<tr><td>인상의 오류(후광효과)</td><td>선입견·사전정보에 따라 다른 특성까지 긍정/부정적으로 평가 (예: 잘생기면 성격도 좋을 것)</td><td>평가요소를 무시하고 인상으로 평가</td></tr>\n<tr><td>집중화 경향의 오류</td><td>극단 점수를 배제하고 중간 점수를 줌</td><td>평가자의 미숙(불확실성·불안감)</td></tr>\n<tr><td>대비의 오류</td><td>절대 기준 없이 자신이 잘 아는 분야는 과소평가, 모르는 분야는 과대평가</td><td>자신을 피평가자에 투사</td></tr>\n<tr><td>관대화의 오류</td><td>전체적으로 점수를 높게 줌</td><td>평가 기준이 너무 후함</td></tr>\n<tr><td>엄격화의 오류</td><td>전체적으로 점수를 낮게 줌</td><td>평가 기준이 너무 인색함</td></tr>\n<tr><td>근접의 오류</td><td>유사 항목이 시간·공간적으로 가까이 있어 비슷하게 평가 (예: 여러 운동을 동시 수행평가)</td><td>나눠서 평가하지 않고 몰아서 평가</td></tr>\n</table></div>\n<div class=\"mn-note\"><strong>인상의 오류 = 후광효과(halo effect)</strong>: 같은 개념을 다른 학자가 다르게 번역·명명했을 뿐이라, 두 용어가 동시에 출제되지는 않습니다.</div>\n<div class=\"mn-block\"><h4>평정의 오류 만능 해결책 (3)</h4><p>채점기준 구체화(루브릭 활용) / 채점자 신뢰도 검증(불일치가 큰 채점자 자료는 배제) / 채점자 사전교육 및 훈련</p></div>"}]},{"title":"4. 평가도구의 제작","theories":[{"id":"eval-21","name":"평가문항의 제작 절차","items":[{"text":"6단계 절차","children":[]}],"explainHtml":"<p>①교육목표 설정(무엇을 평가할지) → ②문항정보표(이원목적 분류표) 작성(타당도 확보용) → ③평가장면 설정(지필검사·수행평가 등 방법 선택) → ④평가도구 제작(타당도·신뢰도·객관도·실용도 고려) → ⑤평가 실시 후 수정·보완 → ⑥최종 문항 활용</p>"},{"id":"eval-22","name":"선택형과 서답형의 비교","items":[{"text":"자유도·강조점·객관도·소요시간의 차이","children":[]},{"text":"객관형이 적합한 경우","children":[]},{"text":"서술형이 적합한 경우","children":[]},{"text":"객관형 문항 제작 시 유의사항","children":[]},{"text":"서술형 문항 제작 시 유의사항","children":[]},{"text":"서술형 문항 채점 시 유의사항","children":[]}],"explainHtml":"<div class=\"mn-table-wrap\"><table class=\"mn-table\">\n<tr><th>구분</th><th>선택형(객관형)</th><th>서답형(주관형)</th></tr>\n<tr><td>자유도</td><td>좁음</td><td>넓음</td></tr>\n<tr><td>특징</td><td>문항이 요구하는 지식에만 반응</td><td>요구지식 + 문장구성력·표현력까지 요구</td></tr>\n<tr><td>강조점</td><td>정확한 지식</td><td>종합적 이해</td></tr>\n<tr><td>객관도</td><td>높음</td><td>낮음</td></tr>\n<tr><td>출제 소요시간</td><td>많음</td><td>(상대적으로 적음)</td></tr>\n<tr><td>채점 소요시간</td><td>적음</td><td>(상대적으로 많음)</td></tr>\n</table></div>\n<div class=\"mn-block\"><h4>객관형이 적합한 경우 (4)</h4><p>검사집단이 큰 경우 / 믿을 수 있는 점수가 필요할 때 / 평가의 객관성 유지가 필요할 때 / 채점 결과를 빨리 원할 때<br><strong>서술형이 적합한 경우 (3)</strong>: 검사집단이 작은 경우 / 문장 표현 기술을 발달시키고자 할 때 / 학생의 태도를 알아보고 싶을 때</p></div>\n<div class=\"mn-block\"><h4>객관형 문항 제작 시 유의사항</h4><p>쉬운 용어로 간결·명확하게 / 복잡한 문장·전문용어·부정문 지양 / 정답 단서 배제 / 정답·오답의 길이를 비슷하게 / 정답은 분명하게, 오답은 그럴듯하게 / 정답 번호를 무작위 배열</p></div>\n<div class=\"mn-block\"><h4>서술형 문항 제작 시 유의사항</h4><p>모범답안을 미리 작성해 채점기준 공유 / 평가 집단의 성질 고려 / 문항 수 적절히 조정(광범위한 내용은 다수의 문항으로)</p></div>\n<div class=\"mn-block\"><h4>서술형 문항 채점 시 유의사항</h4><p>학생 단위가 아닌 <strong>문항 단위</strong>로 채점 / 여러 사람이 채점 후 평균 / 학생의 인적사항을 모르는 상태에서 채점 / 충분한 시간을 갖고 채점</p></div>"}]},{"title":"5. 좋은 평가도구가 갖춰야 할 조건","theories":[{"id":"eval-23","name":"타당도","items":[{"text":"정의","children":[]},{"text":"종류","children":[{"text":"내용타당도","children":[]},{"text":"안면타당도","children":[]},{"text":"준거타당도(공인타당도·예언타당도)","children":[]},{"text":"구인타당도","children":[]},{"text":"결과타당도","children":[]}]}],"explainHtml":"<div class=\"mn-block\"><h4>기본개념</h4><p>검사가 측정하고자 하는 변인을 ‘제대로’ 측정하였는지에 대한 정도. (측정도구의 정확성)</p></div>\n<h4>타당도 종류 (6)</h4>\n<div class=\"mn-table-wrap\"><table class=\"mn-table\">\n<tr><th>종류</th><th>정의</th></tr>\n<tr><td><strong>내용타당도</strong></td><td>평가 문항이 측정하려는 내용·행동영역 전체를 얼마나 잘 대표하는지. 높이려면 이원목적 분류표(문항정보표)를 사용해 목표를 세분화하고 그에 맞춰 문항을 제작</td></tr>\n<tr><td>안면타당도</td><td>일반인(비전문가)이 검사문항을 잠깐 보고 타당성을 판단하는 것. 너무 주관적이라 잘 쓰이지 않음</td></tr>\n<tr><td>준거타당도</td><td>어떤 평가도구와 다른 평가도구(준거)와의 관계를 통해 타당도를 평가. 하위에 공인타당도·예언타당도</td></tr>\n<tr><td>ㄴ <strong>공인타당도</strong>(동시타당도)</td><td>새로 만든 검사와 기존 검사 간의 상관관계를 측정. 기존 검사를 새 검사로 대체하고자 할 때 사용</td></tr>\n<tr><td>ㄴ <strong>예언타당도</strong>(예측타당도)</td><td>한 검사가 피험자의 장래 행동 특성을 얼마나 잘 예측하는지 (예: 공무원 시험성적↔실제 근무성적)</td></tr>\n<tr><td><strong>구인타당도</strong>(심리적 타당도)</td><td>측정하려는 구인(직접 관찰 불가능한 개인의 심리적 특성, 예: 창의성·지능)을 조작적으로 정의하고, 검사가 그 구인을 얼마나 잘 측정하는지</td></tr>\n<tr><td>결과타당도(영향타당도)</td><td>평가 후 그 결과가 원래 의도한 목적을 제대로 달성했는지 (예: 영어독해 시험에서 단어만 아는 학생이 고득점하면 결과타당도가 낮음)</td></tr>\n</table></div>"},{"id":"eval-24","name":"신뢰도","items":[{"text":"정의","children":[]},{"text":"추정방법(5가지)","children":[{"text":"재검사 신뢰도","children":[]},{"text":"동형검사 신뢰도","children":[]},{"text":"반분검사 신뢰도","children":[]},{"text":"문항내적 합치도","children":[]},{"text":"측정의 표준오차","children":[]}]},{"text":"추정방법별 검사지 수·실시 횟수 구분","children":[]},{"text":"신뢰도를 높이는 방법","children":[]},{"text":"타당도와 신뢰도의 관계(필요조건·충분조건)","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>기본개념</h4><p>검사가 동일 대상자에게 반복 실시되었을 때 그 점수들이 일관성 있게 나오는 정도. (측정도구의 일관성)</p></div>\n<h4>신뢰도 추정방법 (5)</h4>\n<div class=\"mn-table-wrap\"><table class=
