<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>교육학 인출 연습 · 임용 국어 공부</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Song+Myung&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: light dark;
    --paper:#E7E6DC; --card:#F5F3EA; --card-line:#D9D4C1; --line:#C9C4B0;
    --ink:#23252A; --ink-soft:#63665C; --ink-faint:#96988A;
    --dc-curriculum:#35548C; --dc-method:#3F7A57; --dc-eval:#A6791E; --dc-admin:#8B3A46;
    --dc-curriculum-bg:#DFE4EE; --dc-method-bg:#DEE9E1; --dc-eval-bg:#EEE4CE; --dc-admin-bg:#EBDBDD;
    --good:#3F7A57; --warn:#B0532E;
    --r-sm:8px; --r-md:14px; --r-lg:20px;
    --shadow: 0 1px 0 rgba(35,37,42,0.05), 0 6px 16px -10px rgba(35,37,42,0.35);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#1B1C1E; --card:#242527; --card-line:#37383A; --line:#3A3B3C;
      --ink:#ECEAE2; --ink-soft:#A8AA9F; --ink-faint:#75776C;
      --dc-curriculum:#7C9BD8; --dc-method:#79B994; --dc-eval:#D6AC56; --dc-admin:#CE8794;
      --dc-curriculum-bg:#2A3444; --dc-method-bg:#243530; --dc-eval-bg:#3A331F; --dc-admin-bg:#3A2A2E;
      --shadow: 0 1px 0 rgba(0,0,0,0.2), 0 10px 24px -12px rgba(0,0,0,0.6);
    }
  }
  :root[data-theme="dark"]{
    --paper:#1B1C1E; --card:#242527; --card-line:#37383A; --line:#3A3B3C;
    --ink:#ECEAE2; --ink-soft:#A8AA9F; --ink-faint:#75776C;
    --dc-curriculum:#7C9BD8; --dc-method:#79B994; --dc-eval:#D6AC56; --dc-admin:#CE8794;
    --dc-curriculum-bg:#2A3444; --dc-method-bg:#243530; --dc-eval-bg:#3A331F; --dc-admin-bg:#3A2A2E;
    --shadow: 0 1px 0 rgba(0,0,0,0.2), 0 10px 24px -12px rgba(0,0,0,0.6);
  }
  *{box-sizing:border-box;}
  html,body{height:100%; margin:0;}
  body{
    background:var(--paper); color:var(--ink);
    font-family:'IBM Plex Sans KR', sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  html{ scroll-padding-top: env(safe-area-inset-top,0px); }
  #app{ min-height:100%; max-width:600px; margin:0 auto; padding:0 18px 40px; display:flex; flex-direction:column; }
  a,button{ font-family:inherit; }

  header.topbar{
    position:sticky; top:0; z-index:5;
    display:flex; align-items:center; justify-content:space-between;
    padding: calc(env(safe-area-inset-top,0px) + 14px) 0 10px;
    background:var(--paper);
  }
  .back-btn{
    background:none; border:none; color:var(--ink-soft); font-size:14.5px; cursor:pointer;
    padding:6px 4px; display:flex; align-items:center; gap:5px; visibility:hidden; border-radius:6px;
  }
  .back-btn.show{ visibility:visible; }
  .back-btn:hover{ color:var(--ink); }
  .top-meta{ font-size:12.5px; color:var(--ink-faint); text-align:right; line-height:1.4; }

  main{ flex:1; display:flex; flex-direction:column; }

  h1,h2,h3{ margin:0; font-weight:400; }
  .serif{ font-family:'Song Myung', serif; }

  /* ---------- Home ---------- */
  .hero{ padding:6px 0 22px; }
  .hero h1{
    font-family:'Song Myung', serif; font-size:32px; line-height:1.35; letter-spacing:0.01em;
    margin-bottom:8px;
  }
  .hero p{ color:var(--ink-soft); font-size:14px; line-height:1.6; margin:0; max-width:40ch; }

  .mastery-strip{
    display:flex; flex-direction:column; gap:9px;
    background:var(--card); border:1px solid var(--card-line); border-radius:var(--r-md);
    padding:14px 16px; margin-bottom:20px;
  }
  .mastery-row{ display:flex; align-items:center; gap:10px; }
  .mastery-label{ font-size:12.5px; color:var(--ink-soft); width:104px; flex-shrink:0; }
  .mastery-bar{ flex:1; height:6px; border-radius:4px; background:var(--line); overflow:hidden; }
  .mastery-fill{ height:100%; border-radius:4px; transition:width 0.4s ease; }
  .mastery-count{ font-size:12px; color:var(--ink-faint); width:52px; text-align:right; flex-shrink:0; font-variant-numeric:tabular-nums; }

  .mode-grid{ display:grid; grid-template-columns:1fr; gap:10px; margin-bottom:22px; }
  .mode-card{
    display:flex; flex-direction:column; align-items:flex-start; gap:4px;
    text-align:left; border:none; cursor:pointer;
    border-radius:var(--r-lg); padding:20px 20px 18px; box-shadow:var(--shadow);
  }
  .mode-card.primary{ background:var(--ink); color:var(--paper); }
  .mode-card.primary .mode-sub{ color:color-mix(in srgb, var(--paper) 65%, transparent); }
  .mode-card.secondary{ background:var(--card); color:var(--ink); border:1px solid var(--card-line); box-shadow:none; }
  .mode-card.secondary .mode-sub{ color:var(--ink-soft); }
  .mode-title{ font-family:'Song Myung', serif; font-size:20px; }
  .mode-sub{ font-size:13px; line-height:1.55; }

  .domain-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .domain-tile{
    border:1px solid var(--card-line); background:var(--card); border-radius:var(--r-md);
    padding:14px 14px 13px; cursor:pointer; text-align:left; position:relative; overflow:hidden;
  }
  .domain-tile::before{
    content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--tile-accent);
  }
  .domain-tile .dname{ font-size:14px; font-weight:600; margin-bottom:3px; padding-left:6px; }
  .domain-tile .dcount{ font-size:12px; color:var(--ink-faint); padding-left:6px; }

  .section-label{ font-size:12.5px; color:var(--ink-faint); margin:0 0 10px 2px; }

  /* ---------- Scope select (quiz) ---------- */
  .scope-list{ display:flex; flex-direction:column; gap:8px; margin-bottom:18px; }
  .scope-item{
    display:flex; align-items:center; gap:12px; padding:13px 14px;
    background:var(--card); border:1px solid var(--card-line); border-radius:var(--r-md); cursor:pointer;
  }
  .scope-item .chk{
    width:19px; height:19px; border-radius:5px; border:1.5px solid var(--line); flex-shrink:0;
    display:flex; align-items:center; justify-content:center; background:var(--paper);
  }
  .scope-item.checked .chk{ background:var(--tile-accent); border-color:var(--tile-accent); }
  .scope-item .chk svg{ display:none; width:12px; height:12px; }
  .scope-item.checked .chk svg{ display:block; }
  .scope-item .slabel{ flex:1; font-size:14.5px; }
  .scope-item .scount{ font-size:12.5px; color:var(--ink-faint); }

  .toggle-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:13px 14px; background:var(--card); border:1px solid var(--card-line); border-radius:var(--r-md);
    margin-bottom:18px; font-size:14px;
  }
  .switch{ width:38px; height:22px; border-radius:12px; background:var(--line); position:relative; flex-shrink:0; cursor:pointer; }
  .switch::after{ content:""; position:absolute; width:18px; height:18px; border-radius:50%; background:var(--card); top:2px; left:2px; transition:left 0.18s ease; box-shadow:0 1px 2px rgba(0,0,0,0.25); }
  .switch.on{ background:var(--ink); }
  .switch.on::after{ left:18px; }

  .big-btn{
    width:100%; border:none; cursor:pointer; border-radius:var(--r-md);
    background:var(--ink); color:var(--paper); font-size:15.5px; font-weight:600;
    padding:16px 18px; display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .big-btn:disabled{ opacity:0.4; cursor:default; }
  .big-btn.ghost{ background:transparent; color:var(--ink-soft); font-weight:500; border:1px solid var(--card-line); }

  .empty-note{ font-size:13.5px; color:var(--ink-faint); text-align:center; padding:20px 10px; }

  /* ---------- Browse ---------- */
  .accordion{ display:flex; flex-direction:column; gap:8px; }
  .acc-section{ border:1px solid var(--card-line); border-radius:var(--r-md); background:var(--card); overflow:hidden; }
  .acc-head{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:14px 15px; cursor:pointer;
  }
  .acc-head .atitle{ font-size:14.5px; font-weight:600; }
  .acc-head .acount{ font-size:12px; color:var(--ink-faint); flex-shrink:0; }
  .acc-chevron{ transition:transform 0.2s ease; color:var(--ink-faint); flex-shrink:0; }
  .acc-section.open .acc-chevron{ transform:rotate(90deg); }
  .acc-body{ display:none; border-top:1px solid var(--card-line); }
  .acc-section.open .acc-body{ display:block; }
  .theory-row{
    padding:12px 15px 12px 22px; font-size:14px; cursor:pointer; border-top:1px solid var(--card-line);
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .theory-row:first-child{ border-top:none; }
  .theory-row .tname{ flex:1; }
  .theory-row .titem-count{ font-size:11.5px; color:var(--ink-faint); flex-shrink:0; }
  .theory-detail{ display:none; padding:4px 15px 16px 22px; border-top:1px solid var(--card-line); }
  .theory-detail.open{ display:block; }
  .mastery-toggle-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    font-size:13px; padding:9px 0 13px;
  }
  .mastery-hint{ color:var(--ink-faint); font-size:11.5px; }
  .theory-detail .quiz-jump{
    margin-top:10px; font-size:12.5px; color:var(--ink-soft); background:none; border:1px solid var(--card-line);
    border-radius:7px; padding:6px 11px; cursor:pointer;
  }

  .item-tree{ margin:0; padding:0; list-style:none; }
  .item-tree li{ font-size:13.5px; line-height:1.7; padding-left:14px; position:relative; }
  .item-tree li::before{ content:"–"; position:absolute; left:0; color:var(--ink-faint); }
  .item-tree ul{ list-style:none; margin:2px 0 4px; padding-left:16px; }
  .item-tree ul li{ font-size:12.8px; color:var(--ink-soft); }
  .item-tree ul li::before{ content:"·"; }

  /* ---------- master-note explanation content (mn-*) ---------- */
  .mn-explain{ margin-top:4px; }
  .mn-explain h4{ font-size:13px; font-weight:600; color:var(--ink); margin:14px 0 4px; }
  .mn-explain h4:first-child{ margin-top:0; }
  .mn-explain p{ font-size:13.5px; line-height:1.72; color:var(--ink); margin:0 0 2px; }
  .mn-explain .mn-block{ margin:0 0 4px; }
  .mn-explain .mn-tip{
    font-size:12.5px; line-height:1.62; font-style:italic; color:var(--ink-soft);
    background:var(--paper); border-left:3px solid var(--ink-faint);
    padding:8px 11px; border-radius:6px; margin:10px 0;
  }
  .mn-explain .mn-note{
    font-size:12.5px; line-height:1.6; color:var(--ink-soft);
    background:var(--paper); border-left:3px solid var(--warn);
    padding:8px 11px; border-radius:6px; margin:10px 0;
  }
  .mn-explain .mn-table-wrap{ overflow-x:auto; margin:10px 0; -webkit-overflow-scrolling:touch; }
  .mn-explain table.mn-table{ width:100%; border-collapse:collapse; font-size:12.3px; }
  .mn-explain table.mn-table th, .mn-explain table.mn-table td{
    border:1px solid var(--card-line); padding:6px 8px; text-align:left; vertical-align:top;
  }
  .mn-explain table.mn-table th{ background:var(--paper); font-weight:600; white-space:nowrap; }
  .mn-explain table.mn-table td{ min-width:80px; }
  .mn-explain strong{ font-weight:700; }


  /* ---------- Quiz card ---------- */
  .quiz-top{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:6px; }
  .progress-dots{ display:flex; gap:5px; flex-wrap:wrap; max-width:160px; }
  .progress-dots span{ width:6px; height:6px; border-radius:50%; background:var(--card-line); }
  .progress-dots span.done-known{ background:var(--good); }
  .progress-dots span.done-shaky{ background:var(--warn); }
  .quiz-count{ font-size:12.5px; color:var(--ink-faint); font-variant-numeric:tabular-nums; }
  .hide-again-btn{
    background:none; border:none; color:var(--ink-soft); font-size:12.5px; cursor:pointer;
    padding:4px 2px; display:flex; align-items:center;
  }
  .hide-again-btn:hover{ color:var(--ink); }

  .quiz-card{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:26px 6px 10px; min-height:44vh;
  }
  .quiz-breadcrumb{
    display:inline-flex; align-items:center; gap:6px; font-size:12px; padding:5px 11px;
    border-radius:20px; margin-bottom:22px; color:var(--tile-accent); background:var(--tile-accent-bg);
  }
  .quiz-theory-name{
    font-family:'Song Myung', serif; font-size:27px; line-height:1.4; margin-bottom:14px; max-width:22ch;
  }
  .quiz-hint{ font-size:12.5px; color:var(--ink-faint); margin-bottom:10px; }
  .prompt-list{ text-align:left; display:inline-block; margin:0 auto 28px; }
  .prompt-list .prompt-item{
    font-size:14.5px; color:var(--ink-soft); line-height:1.95; padding-left:17px; position:relative;
  }
  .prompt-list .prompt-item::before{ content:"–"; position:absolute; left:0; color:var(--ink-faint); }
  .reveal-btn{
    border:1.5px solid var(--ink); background:transparent; color:var(--ink);
    border-radius:24px; padding:12px 26px; font-size:14.5px; font-weight:600; cursor:pointer;
  }

  .answer-panel{ width:100%; text-align:left; margin-top:6px; padding-bottom:6px; }
  .answer-panel .item-tree li{ font-size:14.5px; margin-bottom:8px; }
  .answer-panel .item-tree ul li{ font-size:13px; margin-bottom:4px; }
  .answer-divider{ border:none; border-top:1px dashed var(--card-line); margin:16px 0; }

  .judge-row{ display:flex; gap:10px; margin-top:22px; }
  .judge-btn{
    flex:1; border-radius:var(--r-md); padding:14px 10px; font-size:14px; font-weight:600;
    cursor:pointer; border:1.5px solid; display:flex; flex-direction:column; align-items:center; gap:2px;
  }
  .judge-btn.shaky{ border-color:var(--warn); color:var(--warn); background:transparent; }
  .judge-btn.known{ border-color:var(--good); color:var(--good); background:transparent; }
  .judge-btn .jsub{ font-size:11px; font-weight:400; opacity:0.75; }

  .quiz-footer{ display:flex; justify-content:center; margin-top:18px; }
  .end-session-link{ font-size:12.5px; color:var(--ink-faint); background:none; border:none; cursor:pointer; text-decoration:underline; text-underline-offset:3px; }

  /* ---------- Summary ---------- */
  .summary-card{
    background:var(--card); border:1px solid var(--card-line); border-radius:var(--r-lg);
    padding:26px 22px; text-align:center; margin-bottom:18px;
  }
  .summary-num{ font-family:'Song Myung', serif; font-size:44px; line-height:1; margin-bottom:6px; }
  .summary-sub{ font-size:13.5px; color:var(--ink-soft); margin-bottom:18px; }
  .summary-split{ display:flex; justify-content:center; gap:22px; font-size:13.5px; }
  .summary-split b{ display:block; font-size:18px; font-weight:600; }
  .split-known b{ color:var(--good); } .split-shaky b{ color:var(--warn); }

  @media (min-width:640px){
    .mode-grid{ grid-template-columns:1fr 1fr; }
  }
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <button class="back-btn" id="backBtn">‹ 뒤로</button>
    <span class="top-meta" id="topMeta"></span>
  </header>
  <main id="main"></main>
</div>

보주의자들이 자신들의 경험중심 교육과정을 정당화하기 위해 그 이전의 모든 교육과정을 “교과중심”으로 통칭하면서 이 용어가 생겼다. (그래서 “전통주의 교육과정”이라고도 함)</p></div>\n<div class=\"mn-block\"><h4>기본개념(정의)</h4><p>학생들이 배우고 익혀야 하는 모든 교과와 교재를 논리적·체계적으로 구성하여 학습효과를 극대화하는 교육과정.</p></div>\n<div class=\"mn-block\"><h4>특징 (4)</h4><p>— 이론적 근거·교육목표·교육내용·교육방법<br>1. [이론적 근거] <strong>형식도야설</strong>(일반 정신능력(기억력·추리력·주의력·상상력)을 훈련하면 전이가 잘 된다는 설. 능력심리학에 근거)에서 근거를 찾음<br>2. [교육목표] 인류가 축적한 문화유산을 다음 세대에 체계적으로 전달, 인간을 사회적 존재로 만드는 것<br>3. [교육내용] 교과의 논리에 따라 문화유산을 선정·조직<br>4. [교육방법] 교사중심의 강의식 수업</p></div>\n<div class=\"mn-block\"><h4>장점 (3)</h4><p>- 평가가 쉬움(객관적 기준) / 통제가 쉬움(교사 주도) / 전달이 쉬움(체계적 조직)</p></div>\n<div class=\"mn-block\"><h4>단점 (3)</h4><p>- 학생 흥미 저하 / 수동적 학습 태도 / 고등정신능력(비판력·창의성) 저하</p></div>\n<h4>조직유형 (4)</h4>\n<div class=\"mn-table-wrap\"><table class=\"mn-table\">\n<tr><th>유형</th><th>정의</th></tr>\n<tr><td>분과형</td><td>교과를 완전히 독립적으로 가르침 (개별 성격 유지)</td></tr>\n<tr><td>상관형</td><td>교과 간 관련 있는 공통 내용을 가르침 (개별 성격 유지)</td></tr>\n<tr><td>융합형</td><td>교과 간 공통 개념을 추출해 새 교과로 융합 (간학문적 통합, 개별 성격 약화)</td></tr>\n<tr><td>광역형</td><td>융합형보다 더 넓은 범위에서 유사 과목을 하나로 통합 (다학문적 통합, 개별 성격 유지)</td></tr>\n</table></div>\n<div class=\"mn-note\"><strong>시험 팁</strong>: 조직유형별 장단점을 따로 외울 필요 없음 — ③④번 장단점을 그대로 활용.</div>"},{"id":"curriculum-3","name":"경험중심 교육과정","items":[{"text":"정의","children":[]},{"text":"등장배경","children":[{"text":"진보주의·실용주의에 토대","children":[]},{"text":"국내 도입 시기(제2차 교육과정)","children":[]}]},{"text":"특징","children":[{"text":"교육목표: 전인교육·문제해결능력","children":[]},{"text":"교육내용: 학습자 흥미·실생활 문제 중심","children":[]},{"text":"교육방법: 학생의 능동적 활동","children":[]}]},{"text":"장점","children":[{"text":"능동적 활동 촉진","children":[]},{"text":"문제해결력 향상","children":[]},{"text":"사고력·표현력 향상","children":[]}]},{"text":"단점","children":[{"text":"기초학력 저하","children":[]},{"text":"경제성 저하","children":[]},{"text":"유능한 교사 의존성","children":[]}]},{"text":"조직유형","children":[{"text":"활동중심","children":[]},{"text":"생활영역","children":[]},{"text":"생성(현성) 교육과정","children":[]},{"text":"중핵 교육과정","children":[]}]},{"text":"인간중심 교육과정과의 비교","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>등장배경</h4><p>1920년대 미국에서 학생들의 문제해결력 부족이 사회문제로 대두 → 진보주의자들이 교과중심을 비판하며 등장. 실용주의·진보주의에 토대. 우리나라는 1963년 제2차 교육과정 시기 도입.</p></div>\n<div class=\"mn-block\"><h4>기본개념 (1920~1950년대)</h4><p>학습자가 교육의 중심이 되어, 학교의 지도하에 학생들이 가지게 되는 모든 경험과 활동으로 구성된 교육과정.</p></div>\n<div class=\"mn-block\"><h4>특징 (3)</h4><p>1. [교육목표] 개인·사회를 동시에 중시 → 전인교육, 문제해결능력 향상<br>2. [교육내용] 실생활 문제 해결에 도움될 때만 가치 인정 → 학습자의 흥미·실생활 문제 중심 조직<br>3. [교육방법] 학생의 능동적 활동 강조, 학습자 중심</p></div>\n<div class=\"mn-block\"><h4>장점 (3)</h4><p>- 능동적 활동 촉진 / 문제해결력 향상 / 사고력·표현력 향상</p></div>\n<div class=\"mn-block\"><h4>단점 (3)</h4><p>- 기초학력 저하 / 경제성 저하(운영에 많은 시간) / 유능한 교사만 운영 가능</p></div>\n<h4>조직유형 (4)</h4>\n<div class=\"mn-table-wrap\"><table class=\"mn-table\">\n<tr><th>유형</th><th>정의</th><th>예</th></tr>\n<tr><td>활동중심</td><td>학생의 흥미·요구에 따른 활동</td><td>프로젝트법, 동아리</td></tr>\n<tr><td>생활영역</td><td>개인 생활의 모든 영역에서 참여 경험 확장</td><td>현장체험학습, 직업체험</td></tr>\n<tr><td>생성(현성)</td><td>사전 계획 없이 교사·학생이 현장에서 함께 만듦</td><td>만들어가는 교육과정</td></tr>\n<tr><td>중핵</td><td>학생 흥미·요구 또는 사회문제를 중심에 두고 주변 내용을 통합</td><td>깨끗한 우리 동네 만들기</td></tr>\n</table></div>\n<div class=\"mn-note\"><strong>혼동 포인트</strong>: 생성·중핵 교육과정은 경험중심의 하위유형이므로, 이들의 장단점을 물으면 경험중심의 장단점을 그대로 활용하면 됨(별도 암기 불필요).</div>"},{"id":"curriculum-4","name":"학문중심 교육과정","items":[{"text":"정의","children":[]},{"text":"학자: 브루너","children":[]},{"text":"등장배경","children":[{"text":"경험중심 교육과정의 부작용","children":[]},{"text":"스푸트니크 발사 충격","children":[]},{"text":"저서 『교육의 과정』","children":[]}]},{"text":"특징","children":[{"text":"교육목표: 지식의 구조 이해·탐구","children":[]},{"text":"교육내용: 지식의 구조","children":[]},{"text":"교육방법: 발견학습(탐구학습)","children":[]},{"text":"교육과정 조직형태: 나선형 교육과정","children":[]}]},{"text":"브루너의 대담한 가설","children":[]},{"text":"지식의 구조를 표현하는 3가지 표현양식","children":[{"text":"행동적(작동적) 표현양식","children":[]},{"text":"영상적(구체적) 표현양식","children":[]},{"text":"상징적 표현양식","children":[]}]},{"text":"장점","children":[{"text":"높은 학습 전이","children":[]},{"text":"내재적 동기 향상","children":[]},{"text":"교육의 질 향상","children":[]}]},{"text":"단점","children":[{"text":"정의적 교육 소홀","children":[]},{"text":"상위권 학습자 편중","children":[]},{"text":"학습환경 조성의 어려움","children":[]}]},{"text":"교과중심 교육과정과의 차이","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>등장배경</h4><p>경험중심 교육과정의 부작용(지식교육 소홀) + 1957년 소련 스푸트니크 발사 충격 → 미국의 교육과정 개편 요구. 1959년 브루너가 주도한 세미나 결과물인 저서 『교육의 과정(The Process of Education, 1960)』이 기반. 우리나라는 1973년 제3차 교육과정에 반영.</p></div>\n<div class=\"mn-block\"><h4>학자</h4><p>제롬 브루너(Jerome Bruner, 1915~2016, 미국 교육심리학자, 하버드대)</p></div>\n<div class=\"mn-block\"><h4>기본개념 (1950~1960년대)</h4><p>각 학문의 핵심적 지식과 원리를 체계적으로 조직하여 학생들이 지식의 구조를 이해·탐구하는 능력을 기르는 것이 목표.</p></div>\n<div class=\"mn-block\"><h4>특징 (4)</h4><p>1. [교육목표] 교과 내 핵심 지식·원리 습득, 탐구능력 향상<br>2. [교육내용] <strong>지식의 구조</strong> — 각 분야의 가장 중요한 기본원리·핵심아이디어를 논리적으로 체계화한 것<br>3. [교육방법] 발견학습(탐구학습) — 교사 지시 최소화, 학생 스스로 발견<br>4. [교육과정 조직형태] <strong>나선형 교육과정</strong> — 발달단계를 고려해 기본개념·원리를 반복하며 폭과 깊이를 점진적으로 확대·심화 (달팽이 껍질 모양)</p></div>\n<div class=\"mn-block\"><h4>핵심 부속 개념</h4><p>- <strong>브루너의 대담한 가설</strong>: 어떤 교과 내용도 아동의 인지구조에 적합하게 제시하면 어떤 발달단계의 아동에게도 효과적으로 가르칠 수 있다.<br>- <strong>지식의 구조를 표현하는 3가지 표현(표상) 양식</strong>, 인지발달에 따라 순서대로 제시<br>1. 행동적(작동적) 표현양식 — 신체적 동작으로 표현 (예: 시소놀이를 직접 해봄)<br>2. 영상적(구체적) 표현양식 — 그림·모형으로 표현<br>3. 상징적 표현양식 — 글·수식·기호로 표현 (예: 힘f×거리a = 힘w×거리b)</p></div>\n<div class=\"mn-block\"><h4>장점 (3)</h4><p>- 높은 학습 전이 가능 / 내재적 동기 향상(발견학습) / 교육의 질 향상(사고력·이해력)</p></div>\n<div class=\"mn-block\"><h4>단점 (3)</h4><p>- 정의적 교육 소홀 / 상위권 학습자에게만 유리 / 학습환경 조성의 어려움</p></div>\n<div class=\"mn-note\"><strong>혼동 포인트(교과중심 vs 학문중심)</strong>: 둘 다 지식을 강조하지만, 교과중심은 교사가 주입해 암기시키는 것을 지향한 반면 학문중심은 학생이 스스로 지식의 구조를 발견하는 것을 지향. 차이는 ‘지식의 구조 제시’ + ‘학습자 스스로 발견’.<br>참고: 여기서 나오는 “테일러”는 타일러(Ralph <strong>Ty</strong>ler, 교육과정)와 다른 인물로, 프레더릭 윈슬로 <strong>Ta</strong>ylor(과학적 관리법 창시자, 교육행정)를 가리킴. 보비트 항목에서 다시 등장.</div>"},{"id":"curriculum-5","name":"인간중심(인본주의) 교육과정","items":[{"text":"정의","children":[]},{"text":"등장배경","children":[{"text":"학문중심 교육과정에 대한 비판(인간 소외 현상)","children":[]},{"text":"실존주의 교육철학","children":[]}]},{"text":"경험중심 교육과정과의 차이","children":[]},{"text":"특징","children":[{"text":"교육목표: 자아실현·전인교육","children":[]},{"text":"교육과정: 잠재적·통합교육과정 중시","children":[]},{"text":"교육방법: 학생의 주체성 존중, 인간주의적 교사상","children":[]},{"text":"교육평가: 자율적 자기평가","children":[]}]},{"text":"장점","children":[{"text":"긍정적 자아개념 형성","children":[]},{"text":"전인교육에 도움","children":[]},{"text":"비인간화 현상 극복","children":[]}]},{"text":"단점","children":[{"text":"현실 적용의 어려움","children":[]},{"text":"개인주의 우려","children":[]},{"text":"평가의 어려움","children":[]}]}],"explainHtml":"<div class=\"mn-block\"><h4>등장배경</h4><p>학문중심 교육과정이 지나치게 학문만 강조하면서 발생한 인간 소외 현상(인간이 스스로 만든 문화에 오히려 지배당하는 현상)에 대한 비판으로 등장. 실존주의 교육철학에 근간.</p></div>\n<div class=\"mn-block\"><h4>기본개념 (1960년대~)</h4><p>학생들의 잠재적 능력을 계발하고 자아실현·전인교육을 돕기 위해, 학교에서 의도하거나 의도하지 않은 <strong>모든 경험</strong>으로 이루어진 교육과정.</p></div>\n<div class=\"mn-note\"><strong>혼동 포인트(경험중심 vs 인간중심)</strong>: 경험중심 = 학교가 ‘의도한’ 경험 / 인간중심 = 의도한 경험 + 의도하지 않은 경험(잠재적 교육과정) <strong>모두</strong>. 인간중심 교육과정에서는 표면적 교육과정보다 잠재적·통합 교육과정을 더 중시함(표면적을 배제하는 것은 아님).</div>\n<div class=\"mn-block\"><h4>특징 (4)</h4><p>1. [교육목표] 인간을 성장 가능성을 지닌 주체적 존재로 봄. 자아실현에 도움 되는 교육, 전인교육 강조<br>2. [교육과정] 잠재적 교육과정·통합교육과정 중시 → 인지·정의·신체 영역의 전반적 성장 추구<br>3. [교육방법] 교사는 학생의 주체성 존중, 잠재력 발휘를 돕는 역할 — 존중과 수용·공감적 이해·진실성 있는 인간주의적 교사가 이상적 교사상<br>4. [교육평가] 자기 주도성·자기 이해를 돕는 <strong>자율적 자기평가</strong> 지향</p></div>\n<div class=\"mn-block\"><h4>장점 (3)</h4><p>- 긍정적 자아개념 형성 / 전인교육에 도움 / 비인간화 현상 극복</p></div>\n<div class=\"mn-block\"><h4>단점 (3)</h4><p>- 현실 적용 어려움(추상적) / 개인주의 우려(공동체 의식 약화) / 평가의 어려움(목표·기준 불명확)</p></div>"},{"id":"curriculum-6","name":"통합중심 교육과정(중핵 교육과정)","items":[{"text":"정의","children":[]},{"text":"등장배경","children":[]},{"text":"특징(알버티)","children":[{"text":"교육내용: 학생 흥미 고려한 공동 계획","children":[]},{"text":"교육방법: 프로젝트 학습활동","children":[]},{"text":"교재: 통합 교재 직접 제작","children":[]},{"text":"교사역할: 안내자·조력자·상담자","children":[]}]},{"text":"교과 통합의 원칙","children":[{"text":"중요성 원칙","children":[]},{"text":"일관성 원칙","children":[]},{"text":"적합성 원칙","children":[]}]},{"text":"통합교육과정의 유형: 교과가 묶이는 형태","children":[{"text":"상관형","children":[]},{"text":"광역형","children":[]}]},{"text":"통합교육과정의 유형: 학문이 연결되는 방식(드레이크)","children":[{"text":"다학문적 통합","children":[]},{"text":"간학문적 통합","children":[]},{"text":"탈학문적 통합","children":[]}]},{"text":"STEAM 교육과정의 정의 및 의의","children":[]},{"text":"중핵 교육과정과 통합교육과정의 관계","children":[]},{"text":"경험중심 교육과정과의 관계(장단점 공유)","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>등장배경</h4><p>교과중심(단편적 지식)과 경험중심(흥미)을 보완하기 위해 등장. 진보주의가 유행한 1920년대, 경험중심 교육과정의 하위분류로 등장.</p></div>\n<div class=\"mn-block\"><h4>기본개념</h4><p>학생의 흥미·요구 또는 사회의 특정 문제를 중심으로 하고 관련 부분을 주변영역으로 하여 교육내용을 통합하는 교육과정. 인격통합과 사회적 통합을 함께 추구.</p></div>\n<div class=\"mn-block\"><h4>특징 (4, by 알버티 Alberty)</h4><p>1. [교육내용] 학생 흥미를 고려해 교사와 함께 학습 주제를 계획<br>2. [교육방법] 프로젝트 학습활동(소풍·실험·토론)으로 진행<br>3. [교재] 자료를 많이 수집해 통합 교재를 직접 제작<br>4. [교사역할] 지식 전달자가 아니라 안내자·조력자·상담자</p></div>\n<div class=\"mn-block\"><h4>장점/단점</h4><p>경험중심 교육과정의 장단점을 그대로 활용 (별도 암기 불필요)</p></div>\n<div class=\"mn-block\"><h4>교과 통합의 원칙 (3)</h4><p>- 중요성 원칙(각 교과의 중요 내용 포함) / 일관성 원칙(통합된 일관된 전개) / 적합성 원칙(학습자 수준·전인격적 성장에 부합)</p></div>\n<div class=\"mn-block\"><h4>통합교육과정의 유형 (2가지 분류축)</h4><p>1) <strong>교과가 묶이는 형태</strong>에 의한 통합: 상관형(교과 간 관련 내용 추출), 광역형(유사 과목을 하나의 학습영역으로 통합) — 교과중심 파트와 동일 개념<br>2) <strong>학문이 연결되는 방식</strong>에 의한 통합 (드레이크 Drake의 관점)<br>- <strong>다학문적 통합</strong>: 학문 간 독립성 유지하며 하나의 주제를 여러 학문 관점에서 다룸 (예: 통일을 정치학·사회학·심리학·지리학 관점에서)<br>- <strong>간학문적 통합</strong>: 학문 간 경계를 허물어 공통 주제를 추출해 새로 조직 (예: 이주 현상을 여러 학문의 공통 개념으로 통합)<br>- <strong>탈학문적 통합</strong>: 학문의 경계를 초월해 실생활 주제·문제 중심으로 조직 (예: STEAM, 탐구생활)</p></div>\n<div class=\"mn-block\"><h4>실례 [STEAM 교육과정]</h4><p>Science·Technology·Engineering·Arts·Mathematics의 융합. 과학기술에 대한 흥미·이해를 높이고 융합적 사고력·실생활 문제해결력을 기르는 교육과정. 우리나라에서 만든 탈학문적 통합의 대표 예.</p></div>\n<div class=\"mn-note\"><strong>혼동 포인트 Q&amp;A</strong><br>- Q. 중핵 교육과정과 통합교육과정의 차이는? → <strong>통합교육과정이 상위개념</strong>, 중핵 교육과정은 그 한 예. “하나의 개념을 중심으로”라는 뉘앙스면 중핵, “어떤 기준으로 학습내용을 묶어 편성”이면 통합.<br>- Q. STEAM은 통합중심의 예인가 중핵의 예인가? → 둘 다 맞음. 통합교육과정의 예가 중핵 교육과정이고, 중핵 교육과정의 구체적 사례가 STEAM.<br>- 상관형·광역형(교과중심 파트)과 다학문·간학문·탈학문(드레이크 분류)은 내용이 비슷해 헷갈리지만, <strong>분류 카테고리 자체가 다른 것</strong>이므로 억지로 나눌 필요 없음.</div>"},{"id":"curriculum-7","name":"역량중심 교육과정","items":[{"text":"정의","children":[]},{"text":"등장배경","children":[]},{"text":"핵심역량(6가지, 2022 개정 기준)","children":[{"text":"자기관리 역량","children":[]},{"text":"지식정보처리 역량","children":[]},{"text":"창의적 사고 역량","children":[]},{"text":"심미적 감성 역량","children":[]},{"text":"협력적 소통 역량","children":[]},{"text":"공동체 역량","children":[]}]},{"text":"2015-2022 개정 간 역량 명칭 변화(의사소통→협력적 소통)","children":[]},{"text":"교육과정 설계 시 특징","children":[{"text":"교사의 자율성 보장","children":[]},{"text":"핵심역량 우선 선정","children":[]},{"text":"지속적 평가","children":[]},{"text":"학생 중심 수업","children":[]}]},{"text":"교사의 역할","children":[{"text":"교육과정 재구성자","children":[]},{"text":"조력자·촉진자","children":[]}]},{"text":"장점: 융통성 있는 교육과정","children":[]},{"text":"단점: 구체적 대안 제시 부족","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>등장배경</h4><p>2012년경 급변하는 사회 속에서 기존 교과중심 교육과정의 한계 인식 → 교육부·한국교육과정평가원이 <strong>2015 개정 교육과정</strong>을 역량중심으로 설계.</p></div>\n<div class=\"mn-block\"><h4>기본개념</h4><p>21세기를 살아가는 데 필요한 지식·기능·태도 등 학생이 ’무엇을 할 수 있는가’에 중점을 둔 교육과정. <strong>역량</strong> = 단순 지식 암기를 넘어 지식·기능·태도·가치를 통합해 실제 문제 상황을 해결하는 힘.</p></div>\n<h4>핵심역량 (6)</h4>\n<div class=\"mn-table-wrap\"><table class=\"mn-table\">\n<tr><th>— 2022 개정 교육과정 기준</th></tr>\n<tr><td>역량</td><td>정의</td></tr>\n<tr><td>자기관리 역량</td><td>자아정체성·자신감을 가지고 삶과 진로를 자기주도적으로 설계</td></tr>\n<tr><td>지식정보처리 역량</td><td>다양한 지식·정보를 비판적으로 탐구·활용해 문제 해결</td></tr>\n<tr><td>창의적 사고 역량</td><td>다양한 지식·기술·경험을 융합해 새로운 것을 창출</td></tr>\n<tr><td>심미적 감성 역량</td><td>공감적 이해·문화적 감수성으로 삶의 의미와 가치를 성찰·향유</td></tr>\n<tr><td>협력적 소통 역량</td><td>타인의 관점을 존중·경청하며 효과적으로 표현, 상호협력</td></tr>\n<tr><td>공동체 역량</td><td>개방적·포용적 가치·태도로 지속가능한 공동체 발전에 참여</td></tr>\n</table></div>\n<div class=\"mn-note\"><strong>연계 포인트</strong>: 자기관리↔메타인지 / 지식정보처리↔정보처리이론 / 창의적사고↔창의성 / 심미적감성↔아이즈너(교육적 감식안·교육비평) / 협력적소통↔협동학습 / 공동체↔콜버그(도덕성)<br><strong>개정 변화</strong>: 2015 개정의 ‘의사소통 역량’(개인 차원) → 2022 개정 ‘협력적 소통 역량’(공동체 속 협력까지 강조)으로 명칭 변경.</div>\n<div class=\"mn-block\"><h4>교육과정 설계 시 특징 (4)</h4><p>1. 교사의 자율성 보장(교사가 직접 교육내용 선정) 2. 핵심역량 먼저 선정 후 목표·내용 구성 3. 지속적 평가로 개선점 도출 4. 학생 중심 수업</p></div>\n<div class=\"mn-block\"><h4>교사의 역할 (2)</h4><p>교육과정 재구성자 / 조력자·촉진자<br><strong>장점</strong>: 융통성 있는 교육과정 (사회 변화에 따라 재구성 가능)<br><strong>단점</strong>: 구체적 대안 제시 부족</p></div>"},{"id":"curriculum-8","name":"내러티브 교육과정","items":[{"text":"정의","children":[]},{"text":"등장배경(브루너의 발견학습 이론 수정)","children":[]},{"text":"특징","children":[{"text":"교육목표: 내러티브적 사고 촉진","children":[]},{"text":"교육내용: 사고·감정표현방식 관련 교과","children":[]},{"text":"교육방법: 학생 스스로 의미 구성","children":[]},{"text":"교육평가: 대안적 평가 방법","children":[]}]},{"text":"교육적 시사점","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>등장배경</h4><p>브루너가 자신의 발견학습 이론(지식은 탐구를 통해 발견됨)에 오류가 있음을 구성주의를 통해 깨닫고, 지식은 고정된 것이 아니라 학습자 각자의 경험으로 재구성되는 것임을 인정하며 새로 제안한 교육과정. (중요도 낮음, 구성주의와 연계해 이해하면 쉬움)</p></div>\n<div class=\"mn-block\"><h4>기본개념 (3)</h4><p>- 내러티브란 현실 세계에 대한 인간의 의미부여 과정<br>- 지식은 객관적 실체가 아니라 인간이 타인과 상호작용하며 머릿속에서 구성하는 것<br>- 교사가 분리된 사실·행동을 연결해 사건의 흐름을 의미 있는 이야기로 재구성하는 교육과정</p></div>\n<div class=\"mn-block\"><h4>특징 (4)</h4><p>1. [교육목표] 내러티브적 사고와 관련된 지식·기능·태도 촉진<br>2. [교육내용] 사고방식·감정표현방식 관련 교과 위주 구성<br>3. [교육방법] 학생 스스로 의미를 구성하도록 가르침<br>4. [교육평가] 새로운 깨달음을 확인하는 대안적 평가 방법 활용</p></div>\n<div class=\"mn-block\"><h4>시사점</h4><p>내러티브적 이야기 구조를 통해 교과가 새롭게 통합되고 교육과정이 재개념화되어야 함</p></div>"},{"id":"curriculum-9","name":"잠재적 교육과정","items":[{"text":"정의(2가지 의미)","children":[]},{"text":"학자: 잭슨","children":[]},{"text":"등장배경","children":[]},{"text":"발생원인","children":[{"text":"학교 풍토(군집성·상찬·권력관계)","children":[]},{"text":"교사의 영향","children":[]},{"text":"교육목표의 차이","children":[]},{"text":"사회환경","children":[]}]},{"text":"시사점 및 교사의 역할","children":[{"text":"교육목표 측면","children":[]},{"text":"교육내용 측면","children":[]},{"text":"교육방법 측면","children":[]},{"text":"교육평가 측면(탈목표 평가)","children":[]}]},{"text":"영 교육과정과의 차이","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>학자</h4><p>필립 잭슨(Philip W. Jackson, 1928~2015). 1968년 저서 『아동의 교실생활(Life in Classrooms)』에서 이론화.</p></div>\n<div class=\"mn-block\"><h4>등장배경</h4><p>의도되고 계획된 학교 교육(표면적 교육과정)만으로는 전인교육이 실패하는 것을 보고, 그 원인을 교육과정에서 찾고자 함.</p></div>\n<div class=\"mn-block\"><h4>기본개념 (2)</h4><p>학교생활 중 은연중에 가지게 되는 경험의 총체로서,<br>1) 학교에서 의도했으나 의도와 다른 학습결과를 초래하거나,<br>2) 학교에서 의도하지 않았지만 은연중에 학생들이 중요한 변화를 학습하는 교육과정.<br>(예: 절대평가 도입 후 오히려 영어 성적이 낮아짐 / 특성화고 견학 후 오히려 진학률이 낮아짐)</p></div>\n<div class=\"mn-block\"><h4>발생원인 (4)</h4><p>1. <strong>학교 풍토</strong> — 잭슨은 군집성(crowd)·상찬(praise)·권력관계(power)로 설명<br>- 군집성: 성적 상·중·하 학생이 모두 모이는 공간 → 협력과 경쟁이 자연스럽게 발생<br>- 상찬: 교사의 평가(상·칭찬) 속에서 학생들이 스스로 성공 전략을 세움<br>- 권력관계: 교사 지시에 따라 행동하며 은연중 권력구조를 학습<br>2. <strong>교사의 영향</strong> — 교사의 언행·태도·사고방식(무관심·권위적·편견 등)<br>3. <strong>교육목표의 차이</strong> — 학교의 표면적 목표와 교사·학부모·학생의 실제 목표가 다를 때<br>4. <strong>사회환경</strong> — 경제적·정치적·사회적 변화</p></div>\n<div class=\"mn-block\"><h4>시사점 &amp; 교사의 역할 (4)</h4><p>- [교육목표] 인지적 영역뿐 아니라 정의적 영역까지 고려해 다양한 관점에서 목표 수립<br>- [교육내용] 리더십·봉사·협력·환경·정서교육 등 공식 교육과정이 다루지 못하는 가치를 신중히 구성<br>- [교육방법] 교사는 언행·태도로 솔선수범<br>- [교육평가] 목표중심 평가에서 벗어나 의도하지 않은 결과도 중시하는 <strong>탈목표 평가</strong> 수용</p></div>\n<div class=\"mn-block\"><h4>관련 분류 체계</h4><p>- 공식화 정도: 표면적(공식적) / 잠재적(비공식적) / 영 교육과정<br>- 수준·진행과정: 계획된(의도된, 문서화된) / 실행된(전개된, 가르친) / 경험된(실현된, 학습성과로서의) 교육과정<br>- 결정주체: 국가수준 / 지역수준 / 학교수준 / 교실수준 교육과정</p></div>\n<div class=\"mn-note\"><strong>Q&amp;A</strong>: 공식적·잠재적·영 교육과정은 동시에 존재 — 공식적 교육과정에서 배제된 것이 영 교육과정, 공식적·영 교육과정을 통해 학생의 행동·태도·가치관에 영향을 주는 것이 잠재적 교육과정.</div>"},{"id":"curriculum-10","name":"영 교육과정","items":[{"text":"정의(2가지 의미)","children":[]},{"text":"학자: 아이즈너","children":[]},{"text":"등장배경","children":[]},{"text":"발생원인","children":[{"text":"학교의 오래된 관행","children":[]},{"text":"교사나 학생의 무능","children":[]},{"text":"정치적·사회적 요인","children":[]}]},{"text":"영 교육과정의 성립 조건","children":[]},{"text":"시사점 및 교사의 역할","children":[{"text":"교육목표 측면","children":[]},{"text":"교육내용 측면","children":[]},{"text":"교육방법 측면","children":[]},{"text":"교육평가 측면(참평가)","children":[]}]},{"text":"잠재적 교육과정과의 차이","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>학자</h4><p>엘리엇 아이즈너(Elliot W. Eisner, 1933~2014). 시각예술 전공, 1979년 저서 『교육적 상상력(The Educational Imagination)』에서 처음 제안.</p></div>\n<div class=\"mn-block\"><h4>등장배경</h4><p>아이즈너는 교육의 과학화(=행동목표·타일러식 접근)를 비평하며 예술적 접근을 시도.</p></div>\n<div class=\"mn-block\"><h4>기본개념 (2)</h4><p>1) 배울 만한 가치가 있음에도 공식적 교육과정에 포함되지 않거나,<br>2) 공식적 교육과정에 편성되어 있더라도 학교에서 <strong>의도적으로</strong> 가르치지 않는 교육과정.<br>(예: 성 소수자 차별 관련 내용 미포함 / 노동자 권리 교육 배제 등)</p></div>\n<div class=\"mn-block\"><h4>발생원인 (3)</h4><p>1. 학교의 오래된 관행(타성) — 개발자의 편견·경직된 제도·신념<br>2. 교사나 학생의 무능 — 교사의 지식·교수법 부족, 학생의 학습의욕·능력 부족<br>3. 정치적·사회적 요인 — 교육정책 변화, 학생 가치관·관심사 변화</p></div>\n<div class=\"mn-block\"><h4>영 교육과정의 조건 (3)</h4><p>1. 배울 만한 가치 2. 학습자의 발달 수준에 맞음 3. 학교 교육목표에 부합</p></div>\n<div class=\"mn-block\"><h4>시사점 &amp; 교사의 역할 (3)</h4><p>- [교육목표] 행동적 목표뿐 아니라 문제해결 목표·표현적 결과까지 고려, 사회변화에 따라 재설정<br>- [교육내용] 예술적 감각·비판적 사고력을 키우는 예술·문학·역사 등 다양한 영역<br>- [교육방법] 솔선수범 등 다양한 의사소통 방법<br>- [교육평가] 참평가(교육적 감식안·교육비평 활용)</p></div>\n<div class=\"mn-note\"><strong>혼동 포인트(잠재적 vs 영 교육과정)</strong><br>- 잠재적 교육과정의 핵심 = <strong>“의도하지 않았다”</strong>(비의도적) — 아무도 의도하지 않았는데 학생이 무언가(순종·시기·질투 등 정의적 영역)를 배움<br>- 영 교육과정의 핵심 = <strong>“의도적으로 배제했다”</strong><br>- 두 이론은 서로 짝을 이루므로 잭슨(잠재적)-아이즈너(영) 함께 공부하면 효율적.</div>"}]},{"title":"Ⅱ. 교육과정의 개발모형","theories":[{"id":"curriculum-11","name":"블룸의 교육목표 분류","items":[{"text":"등장배경 및 학자","children":[]},{"text":"타일러의 이원분류(내용-행동)와의 관계","children":[]},{"text":"인지적 영역(6단계)","children":[{"text":"지식","children":[]},{"text":"이해","children":[]},{"text":"적용","children":[]},{"text":"분석","children":[]},{"text":"종합","children":[]},{"text":"평가","children":[]}]},{"text":"정의적 영역(5단계)","children":[{"text":"감수(수용)","children":[]},{"text":"반응","children":[]},{"text":"가치화","children":[]},{"text":"조직화","children":[]},{"text":"인격화","children":[]}]},{"text":"정의적 영역의 내면화 원리","children":[]},{"text":"인지적 영역의 위계화 원리(복잡성의 원리)","children":[]},{"text":"심동적 영역의 단계 및 특징","children":[]},{"text":"교육목표 분류의 개정(지식차원-인지과정차원)","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>학자</h4><p>벤저민 블룸(Benjamin Bloom, 1913~1999). 타일러와 함께 연구하며 1956년 수업목표를 구체화. 인지적 영역은 블룸이, 정의적 영역은 크래쓰월(Krathwohl), 심동적 영역은 심슨(Simpson)·해로우(Harrow)가 주로 담당.</p></div>\n<div class=\"mn-block\"><h4>기본개념</h4><p>타일러는 교육목표를 ’내용’과 ’행동’으로 이원분류했는데, 블룸은 이 중 ’행동’을 다시 <strong>인지적·정의적·심동적(운동기능적) 영역</strong>으로 세분화해 교육목표를 체계화. (단, 세 영역이 어떻게 명확히 구분되는지는 뚜렷이 설명하지 못함)</p></div>\n<h4>② 인지적 영역 (6단계)</h4>\n<div class=\"mn-table-wrap\"><table class=\"mn-table\">\n<tr><th>— 복잡성의 원리에 따라 위계화(하위 능력이 상위 능력의 선행조건).</th></tr>\n<tr><td>단계</td><td>정의</td><td>예</td></tr>\n<tr><td>지식</td><td>사실·개념·원리·방법 등을 기억·재생</td><td>영양소의 종류를 안다</td></tr>\n<tr><td>이해</td><td>배운 내용의 의미 파악 (번역/해석/추론)</td><td>피타고라스 법칙을 그림으로 설명</td></tr>\n<tr><td>적용</td><td>배운 내용을 특정 상황에 적용해 문제해결</td><td>수요·공급 법칙을 사회문제에 적용</td></tr>\n<tr><td>분석</td><td>자료의 요소·조직원리·상호관계 발견</td><td>민주주의·공산주의 장단점 분석</td></tr>\n<tr><td>종합</td><td>여러 부분을 새로운 의미체계로 통합</td><td>문법 내용을 독특한 방식으로 창안</td></tr>\n<tr><td>평가</td><td>준거를 활용해 자료의 가치를 판단</td><td>논문을 읽고 가치를 판단</td></tr>\n</table></div>\n<h4>③ 정의적 영역 (5단계)</h4>\n<div class=\"mn-table-wrap\"><table class=\"mn-table\">\n<tr><th>— 크래쓰월, 내면화의 원리에 따라 위계화.</th></tr>\n<tr><td>단계</td><td>정의</td><td>예</td></tr>\n<tr><td>감수(수용)</td><td>자극·활동에 주의를 기울이고 기꺼이 수용</td><td>클래식 음악을 귀 기울여 듣는다</td></tr>\n<tr><td>반응</td><td>적극적으로 참여·반응해 만족감을 얻음</td><td>교사 지시에 따라 악기를 연습</td></tr>\n<tr><td>가치화</td><td>대상·활동의 가치를 직접 추구·행동화</td><td>클래식을 친구에게 강력하게 권함</td></tr>\n<tr><td>조직화</td><td>서로 다른 가치를 비교·종합해 일관된 체계 형성</td><td>클래식 신념으로 힙합 애호가와 논쟁</td></tr>\n<tr><td>인격화</td><td>가치관이 내면화되어 인격의 일부가 됨</td><td>클래식이 삶의 일부가 되어 음악가를 꿈꿈</td></tr>\n</table></div>\n<div class=\"mn-block\"><h4>④ 심동적(심리행동적) 영역 (7단계)</h4><p>— 심슨·해로우 제안. 대상 조작·운동기능을 강조.<br>지각 → 태세 → 유도반응 → 기계화 → 복합외현반응 → 적응 → 독창성<br>(※ 타당성·실용성 논란이 있어 시험 출제 빈도 낮음. 인지적·정의적 영역 위주로 학습 권장)</p></div>\n<div class=\"mn-block\"><h4>⑤ 블룸의 교육목표 분류의 개정 (중요도 낮음)</h4><p>1956년 인지적 영역을 ‘<strong>지식 차원</strong>’(사실적/개념적/절차적/메타인지)과 ‘<strong>인지과정 차원</strong>’(기억-이해-적용-분석-평가-창안)으로 재구분. 지식차원 위주 암기: (사·개·절·메타)</p></div>"},{"id":"curriculum-12","name":"교육목표의 진술방법","items":[{"text":"메이거의 행동목표 진술방법","children":[{"text":"조건(상황)","children":[]},{"text":"평가기준(준거)","children":[]},{"text":"도착점행동(성취행동)","children":[]},{"text":"형성평가와의 관련성","children":[]}]},{"text":"그론룬드의 진술방법","children":[{"text":"일반적 수업목표","children":[]},{"text":"명세적 수업목표","children":[]}]},{"text":"행동목표 진술 시 유의사항","children":[]},{"text":"행동목표 진술의 장점","children":[]},{"text":"행동목표 진술의 단점","children":[]}],"explainHtml":"<h4>메이거(Rudolf F. Mager, 1962)</h4>\n<div class=\"mn-block\"><h4>기본개념</h4><p>교육목표와 평가에 구체적 지침이 되도록, 수업목표 진술 시 구체적·관찰가능한 행동동사 사용을 강조한 (=행동목표) 진술 방법. 타일러 방식보다 더 구체적으로 진술하려 함. <strong>형성평가</strong>에 적합(형성평가는 이원분류표의 내용을 모두 출제해야 하므로).</p></div>\n<div class=\"mn-block\"><h4>메이거의 진술방법 (3요소)</h4><p>1. 조건(상황) — 행동이 나타날 상황·조건 제시<br>2. 평가기준(준거) — 평가를 위한 기준(수락기준) 제시<br>3. 도착점행동(수준, =성취행동) — 명시적 동사(비교·열거 등)로 최종 도착행동 제시<br>- 예: (조건)도표를 보고 (기준)근의 공식을 이용해 (성취행동)2차방정식을 푼다</p></div>\n<div class=\"mn-block\"><h4>그론룬드의 진술방법 (2단계)</h4><p>일반적 수업목표를 먼저 서술한 후 명세적 수업목표를 진술.<br>1. 일반적 수업목표 — 포괄적·장기적 목표, 내재적 행동 동사(안다·이해한다)로 제시<br>2. 명세적 수업목표 — 일반적 목표를 명시적 동사(예를 제시한다·구분한다·설명한다·지적한다)로 구체화<br>- 예: [일반] 형용사를 이해할 수 있다 → [명세] 형용사의 예를 제시할 수 있다 / 형용사와 명사를 구분할 수 있다 등</p></div>\n<div class=\"mn-block\"><h4>행동목표 진술 시 유의사항 (4)</h4><p>1. 한 목표에는 한 개의 행동목표만 (두 개 이상 X)<br>2. 교사 관점이 아닌 학생의 성취 관점에서 작성<br>3. 학습 과정이 아닌 학습 결과(도착점 행동)의 관점에서 작성<br>4. 구체적 행위동사로 끝맺음(“~할 수 있다”)</p></div>\n<div class=\"mn-block\"><h4>행동목표 진술의 장점 (2)</h4><p>수업 전개 구체화 가능 / 교육효과의 정확한 측정 가능<br><strong>행동목표 진술의 단점 (2)</strong>: 수업의 역동적 과정을 모두 사전 구체화하기 불가능 / 창의성 중시 예술영역은 행동용어 진술에 한계</p></div>"},{"id":"curriculum-13","name":"스펜서의 교육과정 논의","items":[{"text":"전통 교육과정에 대한 비판","children":[]},{"text":"생활영역과 교과목의 우선순위","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>기본개념</h4><p>종교적 교리·고전 교과 중심의 전통 교육과정을 “현실사회와 관련성이 없다”고 비판. 교육의 목적은 개인·사회의 행복이므로 실용적 과학교육을 주장, 근대 과학의 연구 성과를 교육과정 논의에 적용.</p></div>\n<div class=\"mn-block\"><h4>생활영역과 교과목의 우선순위</h4><p>(건강·생리학이 최상위, 시·미술·음악은 여가활동이라 최하위)<br>1. 직접적 자기보존(건강·생리학) 2. 간접적 자기보존(자연과학·사회과학) 3. 자녀 양육·교육(가사·심리학) 4. 시민 생활(역사) 5. 여가(시·미술·음악)</p></div>"},{"id":"curriculum-14","name":"보비트의 교육과정 과학화 모형","items":[{"text":"등장배경(테일러의 과학적 관리기법 도입)","children":[]},{"text":"교육과정 과학화 5단계","children":[]},{"text":"테일러와 타일러의 인물 구분","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>기본개념</h4><p>전통 교과는 근거가 불분명 → 학교 교육과정은 과학적 연구에 기초해 새롭게 구성되어야 함. <strong>테일러(Frederick Winslow Taylor)</strong>의 과학적 관리기법을 학교에 도입해 교육의 효율성을 높이려 함.</p></div>\n<div class=\"mn-block\"><h4>성인의 활동영역</h4><p>언어·건강·시민·사회·여가·정신관리 활동 등 10가지</p></div>\n<div class=\"mn-block\"><h4>교육과정 과학화 5단계</h4><p>1. 인간 경험을 광범위하게 분석 2. 주요 분야의 직무 분석 3. 교육목표 열거 4. 교육목표 선정 5. 상세한 교육계획 수립</p></div>\n<div class=\"mn-note\"><strong>혼동 포인트</strong>: “테일러(Taylor, 과학적 관리법 창시자, 교육행정 분야)”와 “타일러(Tyler, 교육과정 개발모형)”는 <strong>다른 인물</strong>.</div>"},{"id":"curriculum-15","name":"타일러의 합리적 교육과정 개발모형","items":[{"text":"정의(목표중심 모형)","children":[]},{"text":"학자 배경","children":[]},{"text":"교육목표의 설정","children":[{"text":"목표 설정의 3원천(학습자·지역사회·교과전문가)","children":[]},{"text":"교육철학·교육심리의 체","children":[]},{"text":"교육목표 진술 원칙","children":[]}]},{"text":"학습경험의 선정 원리","children":[{"text":"기회의 원리","children":[]},{"text":"만족의 원리","children":[]},{"text":"학습가능성의 원리","children":[]},{"text":"일목표다경험의 원리","children":[]},{"text":"일경험다성과의 원리","children":[]}]},{"text":"학습경험의 조직 원리","children":[{"text":"계속성","children":[]},{"text":"계열성","children":[]},{"text":"수직적 연계성","children":[]}]},{"text":"교육평가 단계의 특징","children":[]},{"text":"장점","children":[{"text":"체계적인 모형","children":[]},{"text":"효율적인 개발","children":[]},{"text":"평가의 유용성","children":[]}]},{"text":"단점","children":[{"text":"부수적 목표 간과","children":[]},{"text":"실질적 내용 부족","children":[]},{"text":"수업의 역동성 간과","children":[]}]},{"text":"타바 모형과의 비교","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>학자</h4><p>랄프 타일러(Ralph Tyler, 1902~1994). 시카고대 졸업, 미국진보주의교육협회 팀장. 테일러(Frederick Taylor)의 과학적 경영운동에서 영감을 받음. 진보주의자들의 ‘경험’·‘흥미’ 키워드에 영향받음(그래서 학습경험 선정·조직 단계에 ’경험’이라는 표현이 자주 등장).</p></div>\n<div class=\"mn-block\"><h4>기본개념</h4><p>교육과정에 포함되어야 할 내용과 그 전개 방식을 목표중심으로 체계적으로 개발해야 한다는 모형. 목표 중심 모형 / 평가 중심 모형이라고도 불림.</p></div>\n<div class=\"mn-block\"><h4>교육과정 개발 시 고려할 사항 (4단계)</h4><p>1. <strong>교육목표의 설정</strong> — 외부 전문가가(교사 아님) <strong>학습자·지역사회·교과전문가</strong>의 요구로 잠정적 목표를 설정한 뒤, <strong>교육철학</strong>(추구할 가치가 있는가)·<strong>교육심리</strong>(달성 가능한가)의 체(=망)를 걸러 최종 목표 확정<br>- 교육목표 진술 원칙(6): 실현가능성·구체성·포괄성·타당성·일관성·적합성<br>2. <strong>학습경험의 선정</strong>(=교육내용 선정의 원리)<br>- 기회의 원리(목표달성 기회 제공) / 만족의 원리(학생이 만족을 느낄 경험) / 학습가능성의 원리(발달수준에 맞음) / 일목표다경험의 원리(한 목표에 여러 경험) / 일경험다성과의 원리(한 경험으로 여러 목표 달성)<br>3. <strong>학습경험의 조직</strong>(=교육내용 조직의 원리)<br>- 계속성(continuity): 같은 내용을 학년이 올라가도 반복<br>- 계열성(sequence): 수준을 점차 높여 폭과 깊이 확대(질적심화·양적확대), 가르치는 순서 결정<br>- 수직적 연계성(articulation): 이전에 배운 내용과 앞으로 배울 내용이 자연스럽게 연결<br>4. <strong>교육평가</strong> — 목표 도달 여부 확인 위해 평가도구 제작. 객관적 도구 사용, 다회성 평가, 결과는 피드백(재투입)되어야 함</p></div>\n<div class=\"mn-block\"><h4>장점 (3)</h4><p>- 체계적인 모형(처방적 모형) / 효율적인 개발 가능 / 평가의 유용성</p></div>\n<div class=\"mn-block\"><h4>단점 (3)</h4><p>- 부수적 목표 간과(아이즈너의 표현적 결과·내면적 변화 소홀) / 실질적 내용 부족(구체적 지침 없음) / 수업의 역동성 간과(예상치 못한 변화에 유연히 대응 못함)</p></div>\n<div class=\"mn-note\"><strong>용어 참고</strong>: “처방적”이란 학습을 촉진하는 방법을 제시한다는 뜻(약을 처방하듯).</div>"},{"id":"curriculum-16","name":"타바의 귀납적 교육과정 개발모형","items":[{"text":"정의(교사중심 교육과정)","children":[]},{"text":"학자 배경","children":[]},{"text":"타일러 모형과의 차이(4가지 특징)","children":[{"text":"교사 중심 모형","children":[]},{"text":"귀납적 모형","children":[]},{"text":"역동적 모형","children":[]},{"text":"처방적 모형","children":[]}]},{"text":"개발절차(5단계)","children":[]},{"text":"장점(타일러 모형과 동일)","children":[]},{"text":"단점","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>학자</h4><p>힐다 타바(Hilda Taba, 1902~1967, 에스토니아 출신, 건축가·교육과정 개혁자). 박사과정 중 쏜다이크·타일러·듀이와 교류. 타일러 모형을 완전히 반대하지 않고 <strong>보완</strong>함.</p></div>\n<div class=\"mn-block\"><h4>기본개념</h4><p>타일러와 반대로, 교육과정은 <strong>교사가 직접</strong> 학생의 요구·흥미를 파악하는 것에서 출발해야 한다고 주장(=교사중심 교육과정). 타일러의 학습내용 부분을 ’내용’과 ’학습경험’으로 구분해 개발단계를 세분화.</p></div>\n<div class=\"mn-block\"><h4>특징 (4, 타일러와 비교)</h4><p>1. <strong>교사 중심 모형</strong> — 타일러는 외부 전문가(교육청)가 담당, 타바는 교사가 현장을 고려해 직접 만듦 (=풀뿌리 개발모형, grass-roots, bottom-up)<br>2. <strong>귀납적 모형</strong> — 타일러는 교과를 먼저 선정하는 연역적 모형, 타바는 교사가 최선의 프로그램을 개발하고 원리를 발견해가는 귀납적 모형 (귀납: 단원→전체교과 / 연역: 전체교과→단원)<br>3. <strong>역동적 모형</strong> — 타바는 타일러보다 좁은 범위에서 학습자의 흥미·요구·수업환경을 지속 진단, 교사 상황에 맞게 수정 가능한 유연성 보유<br>4. <strong>처방적 모형</strong> — 학습내용(내용)과 학습경험(학습자)을 구분해 더 실용적으로 제시</p></div>\n<div class=\"mn-block\"><h4>개발절차 (5단계)</h4><p>1. 시험단원 개발 (하위 8단계: 요구진단→목표설정→내용선정(타당성·가치)→내용조직(수준)→학습경험 선정→학습경험 조직→평가내용/방법/수단 결정→균형과 계열성 검증)<br>2. 시험단원 검증 3. 수정 및 보완 4. 단원 구조화(범위와 계열) 5. 새 단원의 정착 및 보급</p></div>\n<div class=\"mn-block\"><h4>장점</h4><p>타일러 모형과 동일(체계적·효율적 개발·평가의 유용성)<br><strong>단점 (2)</strong> — 상위수준 교육과정을 교사에게 맡기는 건 부적절(국가·지역단위) / 개별 교과에 매몰돼 전체 교육과정을 보는 시야가 줄어듦</p></div>"},{"id":"curriculum-17","name":"스킬백의 학교중심 교육과정 개발모형(SBCD)","items":[{"text":"정의(학교 수준 교육과정)","children":[]},{"text":"등장배경(교사배제 교육과정의 문제점)","children":[]},{"text":"특징","children":[{"text":"상황분석을 통한 개별 학교 맞춤 개발","children":[]},{"text":"역동적(융통적) 모형","children":[]},{"text":"높은 상호작용성","children":[]}]},{"text":"개발절차(5단계)","children":[{"text":"상황분석","children":[]},{"text":"목표설정","children":[]},{"text":"프로그램 구성","children":[]},{"text":"해석과 실행","children":[]},{"text":"모니터링·피드백·평가·재구성","children":[]}]},{"text":"타일러 모형과의 순서 차이(상황분석 선행)","children":[]},{"text":"장점","children":[]},{"text":"단점","children":[]},{"text":"워커 모형과의 적용 범위 차이","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>학자</h4><p>맬컴 스킬백(Malcolm Skilbeck, 호주 출신, 시드니대 교육과정개발센터원장).</p></div>\n<div class=\"mn-block\"><h4>등장배경</h4><p>타일러(전문가 중심)→타바(교사 중심)로 흘렀으나, 교사마다 능력차가 커서 교육효과가 상이해지는 문제 발생 → 이를 해결하려 등장한 것이 <strong>교사배제 교육과정</strong>(Teacher-Proof curriculum: 어느 교사가 써도 같은 결과가 나오도록 전문가가 만든 교육과정). 스킬백은 이 교사배제 교육과정의 문제점을 개선하고자 학교중심 교육과정(SBCD)을 제안.</p></div>\n<div class=\"mn-block\"><h4>기본개념</h4><p>교사가 주체가 되어 학교·학부모·학생의 특성을 고려한 <strong>학교 수준</strong>의 교육과정.</p></div>\n<div class=\"mn-block\"><h4>특징 (3)</h4><p>1. 상황분석을 통한 개별 학교 맞춤 개발(현실적 교육과정)<br>2. <strong>역동적(융통적) 모형</strong> — 타일러와 달리 어느 단계에서든 개발 시작 가능, 목표를 행동용어로 진술할 필요도 없음<br>3. <strong>상호작용성이 높음</strong> — 학생·학부모·지역사회·학교 대표가 토론을 거쳐 교육과정을 만듦 (타일러는 전문가가 만듦)</p></div>\n<div class=\"mn-block\"><h4>개발절차 (5단계)</h4><p>1. <strong>상황분석</strong> — 외적요인(지역사회·학부모·국가교육과정) + 내적요인(학생·교사·학교환경)<br>2. 목표설정 — 교사·학생의 행동을 강화할 목표<br>3. 프로그램 구성 — 교육내용·방법 설계<br>4. 해석(판단)과 실행<br>5. 모니터링·피드백·평가·재구성</p></div>\n<div class=\"mn-note\">타일러와 달리 <strong>목표 설정 전에 상황분석</strong>을 먼저 하는 것이 스킬백의 핵심.</div>\n<div class=\"mn-block\"><h4>장점 (3)</h4><p>학습자 중심교육 / 유연성 / 교사의 자율성·전문성 향상<br><strong>단점 (2)</strong>: 통합성 부족(학교마다 달라 국가수준 목표 달성 어려움) / 객관적 평가기준 설정 어려움</p></div>\n<div class=\"mn-note\"><strong>혼동 포인트(스킬백 vs 워커)</strong>: 워커는 단위학교뿐 아니라 국가·시도 수준에서도 적용 가능하지만, <strong>스킬백은 단위학교에서만</strong> 적용되는 모형.</div>"},{"id":"curriculum-18","name":"위긴스와 맥타이의 백워드 교육과정 설계모형","items":[{"text":"정의(선평가-후교육 모형)","children":[]},{"text":"이해중심 교육과정과의 관계","children":[]},{"text":"개발절차(3단계)","children":[{"text":"교육목표 설정과 영속적 이해","children":[]},{"text":"교육평가 계획과 수용 가능한 증거","children":[]},{"text":"학습경험 및 수업계획(WHERE 절차)","children":[]}]},{"text":"장점","children":[]},{"text":"단점","children":[]},{"text":"학교교육의 목표가 되는 6가지 측면(영속적 이해)","children":[{"text":"설명","children":[]},{"text":"해석","children":[]},{"text":"적용","children":[]},{"text":"관점","children":[]},{"text":"공감","children":[]},{"text":"자기지식","children":[]}]}],"explainHtml":"<div class=\"mn-block\"><h4>학자</h4><p>데이비드 위긴스(David Wiggins)·제임스 맥타이(James McTighe), 1990년대 후반.</p></div>\n<div class=\"mn-block\"><h4>기본개념</h4><p>타일러의 목표중심 모형 + 브루너의 내용중심 모형에 기반, 목표가 모든 교육활동의 준거라는 기본 틀은 유지하되, 목표 달성을 위해 <strong>평가를 먼저 강조</strong>하는 <strong>선(先)평가-후(後)교육</strong>의 평가우위 모형. 후진 설계모형 / 거꾸로 설계모형 / 역방향 설계모형이라고도 부름. <strong>이해중심 교육과정</strong>과 같은 개념.</p></div>\n<div class=\"mn-block\"><h4>개발절차 (3)</h4><p>1. <strong>교육목표 설정</strong>(바라는 결과 확인하기) — 국가 수준 성취기준을 바탕으로 핵심 아이디어(기본개념·원리)를 선정, 단원 전체를 구조화. <strong>영속적 이해</strong>(enduring understanding, 상세 내용을 잊어도 남는 포괄적 개념) 중심<br>2. <strong>교육평가 계획</strong>(수용할 수 있는 증거 결정하기) — 교사가 평가자 입장에서 수행과제를 결정, 6가지 이해 종류를 활용해 평가방법(지필/수행) 선택, 평가기준(루브릭) 마련. 즉 “학생이 이해했다는 것을 수락할 만한 증거를 미리 확인하는 것”<br>3. <strong>학습경험 및 수업계획</strong> — WHERE 절차 활용(Where and why / Hook and hold / Explore &amp; equip / Rethink &amp; reflect / Evaluate)</p></div>\n<div class=\"mn-block\"><h4>장점 (3)</h4><p>지속적 이해에 도움(브루너 지식의 구조 기반) / 구체적 평가계획 강조 / 성취기준 강조<br><strong>단점 (3)</strong>: 많은 시간과 노력 필요 / 평가 설정이 어려움 / 교사의 높은 전문성 요구</p></div>"},{"id":"curriculum-19","name":"슈왑의 실제적 교육과정 개발모형","items":[{"text":"등장배경(교육과정 재개념화의 시발점)","children":[]},{"text":"기본개념(실제적·구체적·절충적 접근)","children":[]},{"text":"워커 모형과의 차이(개발절차 유무)","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>배경</h4><p>1969년 슈왑(J. Schwab)이 “교육과정은 죽어가고 있다”고 발언 — 비전문가에 의해 개발되고 있었기 때문. 행동주의 접근 비판자들이 동조하며 교육과정 재구축 시작. <strong>교육과정 재개념화(=실제적 교육과정 탐구 패러다임)의 시발점</strong>이 되는 이론.</p></div>\n<div class=\"mn-block\"><h4>기본개념</h4><p>전통적 교육과정이 이론에만 집착했음을 비판, 교육과정 연구는 <strong>실제적·구체적·절충적</strong>인 방향으로 진행되어야 한다고 주장.</p></div>"},{"id":"curriculum-20","name":"워커의 숙의모형","items":[{"text":"정의(실제적/자연주의적 모형)","children":[]},{"text":"개발절차(3단계)","children":[{"text":"강령단계","children":[]},{"text":"숙의단계","children":[]},{"text":"설계단계","children":[]}]},{"text":"절차의 융통성(역동적 모형)","children":[]},{"text":"장점","children":[]},{"text":"단점","children":[]},{"text":"스킬백 모형과의 적용 범위 차이","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>기본개념</h4><p>타일러의 합리적 교육과정과 달리, 교육과정은 <strong>현장의 실제 상황</strong>에서 연구·개발되어야 한다는 이론(=<strong>숙의</strong>: 깊이 생각해 충분히 의논함).</p></div>\n<div class=\"mn-block\"><h4>개발절차 (3단계)</h4><p>1. <strong>강령단계</strong>(platform, 출발점, 토대다지기) — 개발자들의 신념·가치·교육목적에 대한 다양한 견해를 토대로 교육이념·방향성·철학을 논의<br>2. <strong>숙의단계</strong> — 목표(토대) 달성을 위한 가장 바람직한 대안을 검토·합의를 통해 선택<br>3. <strong>설계단계</strong> — 숙의에서 선택된 대안을 실천할 구체적 프로그램 제작</p></div>\n<div class=\"mn-note\">순서에 구애받지 않고 융통성 있게 진행 가능(역동적 모형).</div>\n<div class=\"mn-block\"><h4>장점 (4)</h4><p>학생 개별 흥미·능력·적성 반영 가능(충분한 토의) / 구성원 합의 도출 가능 / 창조적 교육과정 개발 가능 / 현실적인 모형(현장 전문가 참여)<br><strong>단점 (3)</strong>: 전문가 투입 위한 상당한 자금 필요(소규모 학교엔 부적절) / 강령·숙의에 상당한 시간 필요 / 구체적 교육내용에 대한 직접적 답을 주지 않음</p></div>\n<div class=\"mn-note\"><strong>혼동 포인트(슈왑 vs 워커)</strong>: 슈왑은 실제 모형을 주장했지만 개발절차는 구체적으로 언급하지 않음. 워커는 구체적 개발절차(강·숙·설)까지 제시 — 이것이 둘의 가장 큰 차이. 시험 출제 비중은 워커가 더 큼.<br><strong>혼동 포인트(워커 vs 스킬백)</strong>: 둘 다 ’실제 현장’을 강조하지만, 워커는 단위학교뿐 아니라 국가·시도 수준에서도 적용 가능한 모형인 반면, 스킬백은 단위학교에서만 적용됨.</div>"},{"id":"curriculum-21","name":"파이너의 교육과정 재개념화","items":[{"text":"등장배경(교육과정 재개념화 운동)","children":[]},{"text":"타일러의 기술공학적 논리에 대한 비판","children":[]},{"text":"기본개념(인간의 실존적 해방)","children":[]},{"text":"쿠레레 방법(4단계)","children":[{"text":"회귀","children":[]},{"text":"전진","children":[]},{"text":"분석","children":[]},{"text":"종합","children":[]}]},{"text":"자서전적 방법(3단계)","children":[]},{"text":"쿠레레 방법과 자서전적 방법의 관계","children":[]},{"text":"시사점","children":[]},{"text":"애플의 재개념화와의 차이","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>학자</h4><p>윌리엄 파이너(William Pinar, 1947~현재, 미국 출신, 캐나다 브리티시컬럼비아대 사범대학 석좌교수).</p></div>\n<div class=\"mn-block\"><h4>등장배경</h4><p>1969년 슈왑의 발언에 동조하는 교수들(행동주의 비판자들)이 교육과정을 재구축하기 시작한 것이 <strong>교육과정 재개념화 운동</strong>이며, 이를 주도한 사람이 파이너. 파이너는 기존의 합리적 교육과정이 인간의 구체적 경험을 왜곡했으며, 타일러의 <strong>기술공학적 논리</strong>(과학적 방법)가 학교교육을 지배해 학생에게 무의미한 교육을 했다고 비판.</p></div>\n<div class=\"mn-block\"><h4>기본개념</h4><p>교육의 목적을 인간과 세계를 종합적으로 이해하는 <strong>인간의 실존적 해방</strong>에 두고, 교육과정은 사회적 맥락 속에서 개인의 고유한 경험이 되도록 재개념화되어야 한다는 이론. 방법으로 <strong>쿠레레 방법</strong>과 <strong>자서전적 방법</strong>을 제시.</p></div>\n<h4>쿠레레 방법 (교사 입장, 4단계)</h4>\n<div class=\"mn-table-wrap\"><table class=\"mn-table\">\n<tr><th>회귀·전진·분석·종합의 단계를 거쳐 자신의 자서전을 기술함으로써 개인의 교육적 경험을 분석하는 방법.</th></tr>\n<tr><td>단계</td><td>내용</td></tr>\n<tr><td>회귀(소급, Regressive)</td><td>과거로 돌아가 의미 있던 교육경험을 있는 그대로 기억·묘사</td></tr>\n<tr><td>전진(Progressive)</td><td>자신의 미래 모습을 상상·묘사</td></tr>\n<tr><td>분석(Analysis)</td><td>과거·현재·미래의 연관성을 탐구해 삶을 비판적으로 분석</td></tr>\n<tr><td>종합(Synthesis)</td><td>현실로 돌아와 과거 교육경험의 영향을 자신의 목소리로 되짚음</td></tr>\n</table></div>\n<div class=\"mn-block\"><h4>자서전적 방법 (학생 입장, 3단계)</h4><p>쿠레레 교육과정을 바탕으로 자신과 타인의 교육경험을 분석해 교육상황을 이해하고 자아성찰을 촉진하는 교육방법.<br>1. 자신의 교육경험 표현(자서전 방식 작성) 2. 교육경험의 비판적 성찰(동료와의 대화로 반성) 3. 타인의 교육경험 분석(공감·이해)</p></div>\n<div class=\"mn-note\">두 방법은 본질적으로 같은 내용이며, 다루는 <strong>주체(교사/학생)</strong>에 따라 구분한 것.</div>\n<div class=\"mn-block\"><h4>시사점 (3)</h4><p>학교 지식의 필요성을 재인식 / 자기 이해에 도움 / 교사는 지식 전달만이 아니라 학생과 함께 의미를 재구성해야 함</p></div>"},{"id":"curriculum-22","name":"아이즈너의 예술적 교육과정","items":[{"text":"기본개념(교육적 상상력)","children":[]},{"text":"개발절차(7단계)","children":[{"text":"목표설정","children":[]},{"text":"내용선정","children":[]},{"text":"학습기회의 결정","children":[]},{"text":"학습기회의 조직","children":[]},{"text":"내용영역의 조직","children":[]},{"text":"제시방법","children":[]},{"text":"평가","children":[]}]},{"text":"목표설정의 세 가지 유형","children":[{"text":"행동적 목표","children":[]},{"text":"문제해결 목표","children":[]},{"text":"표현적 결과","children":[]}]},{"text":"참평가의 구성요소","children":[{"text":"교육적 감식안","children":[]},{"text":"교육비평","children":[]}]},{"text":"장점","children":[]},{"text":"단점","children":[]},{"text":"영 교육과정과의 관계(동일 학자)","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>학자</h4><p>엘리엇 아이즈너(1933~2014, 시각예술 전공, 1960년대 시카고대 박사, 스탠퍼드대 명예교수). (영 교육과정과 동일 학자)</p></div>\n<div class=\"mn-block\"><h4>기본개념</h4><p>아이즈너는 타일러의 행동목표를 비판하며, 교육과정 개발은 예술가가 상상력을 발휘하듯 <strong>교육적 상상력</strong>을 발휘하는 과정이라고 주장. 학생들의 의미 형성을 위해 학습자 특성에 맞게 창의적으로 운영하는 것.</p></div>\n<h4>개발절차(특징) (7단계)</h4>\n<div class=\"mn-table-wrap\"><table class=\"mn-table\">\n<tr><th>단계</th><th>핵심 내용</th></tr>\n<tr><td>1) 목표설정</td><td>행동적 목표뿐 아니라 <strong>문제해결 목표</strong>·<strong>표현적 결과</strong>까지 고려</td></tr>\n<tr><td>2) 내용선정</td><td>개인·사회·교과 요구를 고려, <strong>영 교육과정</strong>도 함께 고려</td></tr>\n<tr><td>3) 학습기회의 결정</td><td>교사의 <strong>교육적 상상력</strong>을 동원해 학생에게 맞는 학습기회 제공</td></tr>\n<tr><td>4) 학습기회의 조직</td><td><strong>비선형적 접근</strong>(자유로운 탐구·실험) 강조, 교사 역할을 <strong>거미집 모형</strong>으로 비유</td></tr>\n<tr><td>5) 내용영역의 조직</td><td>여러 교과가 유기적으로 연결되도록 지식을 조직</td></tr>\n<tr><td>6) 제시방법</td><td>다양한 의사소통 방법 활용, <strong>은유적 표현</strong> 사용</td></tr>\n<tr><td>7) 평가</td><td><strong>참평가</strong>(Authentic assessment, 질적·과정평가) — <strong>교육적 감식안</strong>(교사 스스로 미묘한 차이를 감식) + <strong>교육비평</strong>(감식한 것을 비전문가가 이해할 언어로 표현)</td></tr>\n</table></div>\n<div class=\"mn-block\"><h4>목표설정 세부</h4><p>- 행동적 목표: 관찰 가능한 최종 행동, 양적(결과) 평가 (예: 삼각함수를 계산할 수 있다)<br>- 문제해결 목표: 조건은 주되 자유롭게 해결, 참평가(질적·과정평가) (예: 100만원으로 전교생 만족 음식 찾기)<br>- 표현적 결과: 구체적 목표 없이 시작해 활동 중/후 결과적으로 얻는 것, 참평가 (예: 박물관 견학 후 느끼고 배움)</p></div>\n<div class=\"mn-block\"><h4>장점 (2)</h4><p>역동적 교육과정 개발(타일러보다 융통성) / 교사의 전문성 강조(교육비평·감식안)<br><strong>단점 (2)</strong>: 현실 적용의 어려움(통일성 유지 곤란) / 구체적 대안 제시 부족</p></div>\n<div class=\"mn-note\"><strong>혼동 포인트</strong>: “표현적 결과”는 타일러 모형의 단점에서도 등장하는 개념(타일러 모형이 놓친 것). “영 교육과정”의 조건·발생원인은 이 항목과 연계해서 함께 공부하면 이해가 빠름.</div>"},{"id":"curriculum-23","name":"애플의 구조적 재개념화 모형","items":[{"text":"등장배경 및 파이너와의 비교","children":[]},{"text":"학교교육·교육과정에 대한 비판","children":[{"text":"문화재생산","children":[]},{"text":"표면적 교육과정을 통한 문화자본의 적법화","children":[]},{"text":"잠재적 교육과정을 통한 권력관계 유지","children":[]}]},{"text":"타일러의 기술공학적 논리 비판","children":[]},{"text":"컴퓨터 교육에 대한 비판","children":[{"text":"탈숙련화","children":[]},{"text":"재숙련화","children":[]},{"text":"계층 간 차별 심화","children":[]}]},{"text":"탈숙련화와 재숙련화의 차이","children":[]},{"text":"시사점 및 해결책","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>학자</h4><p>마이클 애플(Michael W. Apple, 1942~현재, 노동자계급 출생, 컬럼비아대 박사, 위스콘신대 석좌교수).</p></div>\n<div class=\"mn-block\"><h4>등장배경</h4><p>파이너·아이즈너와 마찬가지로 타일러의 기술공학적 논리를 비판. <strong>파이너는 인간의 실존적 해방</strong>(실존적 재개념화), <strong>애플은 억압된 사회구조로부터의 정치적 해방</strong>(구조적 재개념화)을 주장.</p></div>\n<div class=\"mn-block\"><h4>기본개념</h4><p>학생의 학습실패는 사회체제·제도 때문이므로, 억압된 사회구조에 구속된 인간을 해방해야 한다.</p></div>\n<div class=\"mn-block\"><h4>애플의 구조적 재개념화 핵심내용 (3)</h4><p>1. <strong>학교교육·교육과정에 대한 비판</strong><br>- <strong>문화재생산</strong>: 학교는 기성세대의 사회체제·권력관계를 다음 세대에 그대로 전달<br>- 표면적 교육과정을 통해 문화자본을 적법화(지배집단 문화자본을 자연스럽게 유지)<br>- 잠재적 교육과정을 통해 기존 권력관계 유지<br>2. <strong>타일러의 기술공학적 논리 비판</strong><br>- 교육의 가치창조적 측면 무시(학업성취도로만 결과 판단)<br>- 교사의 관리자 전락 및 소외현상(효율적 목표달성의 관리자로 전락)<br>- 학생의 비판적 사고·자율적 판단능력 상실(목표달성=우수 학생으로 간주)<br>3. <strong>컴퓨터 교육에 대한 비판</strong><br>- 교사의 단순노동자 전락 및 <strong>탈숙련화(Deskilling)</strong> — 이미 만들어진 자료 활용이 늘수록 수업자료 제작 과정에서 소외되어 전문성 저하<br>- 교사의 관리자 전락 및 <strong>재숙련화(Reskilling)</strong> — 소프트웨어 실행 관리자로 전락, 새 기술 습득에만 몰두해 비판적 사고·문제해결·창의성으로부터 소외<br>- 아동들의 계층 간 차별 심화(컴퓨터·인터넷 접근성 격차)</p></div>\n<div class=\"mn-block\"><h4>시사점 &amp; 해결책 (4)</h4><p>- 교사 자신을 교육의 능동적 주체로 인식하고 교육과정·수업방법 개선<br>- 학교는 지배와 저항이 공존하는 공간이므로 억압적 구조를 비판적으로 수용<br>- 학생을 비판적·자율적 존재로 키워 저항의지를 극대화하면 불평등 구조 개혁 가능<br>- 새로운 기술(테크놀로지)은 분명한 이유를 갖고 도입</p></div>\n<div class=\"mn-note\"><strong>탈숙련화 vs 재숙련화</strong>: 탈숙련화=기술 발전으로 노동자(교사)의 숙련도가 감소하는 현상, 재숙련화=기존 기술·지식이 무효화됐을 때 새로운 것을 다시 습득하는 과정. 둘 다 컴퓨터 교육 비판 맥락에서 부정적으로 쓰임(→ 교사가 단순 관리자·기술습득자로 전락).</div>"},{"id":"curriculum-24","name":"복고주의적 교육과정 운동(파이데이아 제안서)","items":[{"text":"학자 및 등장배경","children":[]},{"text":"기본개념(교육 기회의 균등성)","children":[]},{"text":"핵심 내용","children":[{"text":"모든 학생에게 동일한 교육과정 제공","children":[]},{"text":"고전 교육 강조","children":[]},{"text":"학생 중심 교육 강조","children":[]}]},{"text":"단선제와 복선제의 차이","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>학자</h4><p>모티머 아들러(M. J. Adler). 1980년 『파이데이아 제안서(Paideia Proposal)』 발표. 항존주의(교육철학)를 토대로 함.</p></div>\n<div class=\"mn-block\"><h4>등장배경</h4><p>1970년대까지 인기 있던 교육과정 재개념주의에 대한 반발로 1980년대 보수주의 운동이 일어남 → “예전으로 돌아가자”는 복고주의. 파이데이아(Paideia)는 고대 그리스어로 훈련·교육·계몽을 뜻함.</p></div>\n<div class=\"mn-block\"><h4>기본개념</h4><p>아들러는 미국 교육이 엘리트주의에 빠져 있다고 비판하며, 모든 어린이에게 교육의 양·질에서 균등성을 확보하는 참 민주적 체제 확립을 주장.</p></div>\n<div class=\"mn-block\"><h4>핵심 내용 (3)</h4><p>1. <strong>모든 학생에게 동일한 교육과정 제공</strong> — 모든 학생에게 잠재력이 있다고 보고, <strong>단선제</strong>(미·일·한국식: 학교 간 이동 가능, 교육 기회 균등, 단점: 기술혁신 인재 양성 어려움)를 강조하며 <strong>복선제</strong>(유럽식: 이동 불가·교육과정 차이·계층 고정화 우려)와 선택과목제 폐지를 제안<br>2. <strong>고전 교육 강조</strong> — 인문학적 소양과 도덕적 가치관 확립을 위해 고전 교육을 공교육 중심에 둠<br>3. <strong>학생 중심 교육 강조</strong> — 교사는 지식 전달에만 치중하지 말고, 학생 스스로 목표를 설정·학습할 학습환경을 조성해야 함</p></div>"}]},{"title":"Ⅲ. 교육과정의 운영","theories":[{"id":"curriculum-25","name":"중앙집권형 교육과정","items":[{"text":"정의(국가 수준 교육과정)","children":[]},{"text":"교사배제 교육과정과의 관계","children":[]},{"text":"장점","children":[]},{"text":"단점","children":[{"text":"권위주의적 교육풍토","children":[]},{"text":"획일화·경직화","children":[]},{"text":"지역 특수성 반영의 어려움","children":[]},{"text":"교육과정 사소화 현상","children":[]}]}],"explainHtml":"<div class=\"mn-block\"><h4>기본개념</h4><p>국가(교육부)에서 소수 전문가를 중심으로 교육과정을 결정. 국가에서 만들기 때문에 국가 수준 교육과정. 교사 참여가 배제되므로 <strong>교사배제 교육과정(Teacher-Proof curriculum)</strong>이라고도 함(스킬백 항목 참고).</p></div>\n<div class=\"mn-block\"><h4>장점 (4)</h4><p>풍부한 전문인력·자원 투입으로 질 높은 개발·관리 / 통일된 평가기준으로 전국 학교수준 균등화 / 새 교육과정·국가목표 달성에 도움 / 학교급·학교 간 연계성 충족<br><strong>단점 (4)</strong>: 권위주의적 교육풍토 조성 가능성 / 개정에 대한 신중성 때문에 획일화·경직화, 수정 어려움 / 지역·학교·학생의 특수성 반영 어려움 / <strong>교육과정 사소화 현상</strong>(교사가 개발에 주체적으로 참여할 기회가 줄어 교육과정의 중요성을 간과하게 됨)</p></div>"},{"id":"curriculum-26","name":"지방분권형 교육과정","items":[{"text":"정의(학교 수준 교육과정)","children":[]},{"text":"스킬백 모형과의 관계","children":[]},{"text":"장점","children":[]},{"text":"단점","children":[]},{"text":"중앙집권형과의 장단점 대칭 구조","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>기본개념</h4><p>시도교육청 또는 단위학교에서 교사 및 다양한 인사의 참여로 교육과정을 결정. 각 지역 학교에서 만들기 때문에 <strong>학교 수준 교육과정</strong>이라고도 함(스킬백 SBCD와 연계).</p></div>\n<div class=\"mn-block\"><h4>장점 (3)</h4><p>지역·학교·학생 특성을 고려한 다양한 교육과정 개발 / 신속하고 유연한 수정·운영 / 교사의 전문성·자율성 향상<br><strong>단점 (4)</strong>: 전문인력·자원 한계로 질 높은 개발 어려움 / 전국적으로 통일된 교육과정·평가기준 갖기 어려움 / 국가수준 교육목표 달성 어려움 / 지역·학교 간 격차 심화 가능성</p></div>\n<div class=\"mn-note\"><strong>참고</strong>: 중앙집권형과 지방분권형 외 <strong>절충형</strong>(스킬백 SBCD와 거의 동일)도 있음. 두 유형의 장단점은 서로 반대 개념이므로, 하나를 외우면 다른 하나는 뒤집어서 인출 가능.</div>"},{"id":"curriculum-27","name":"교육과정의 재구성","items":[{"text":"정의","children":[]},{"text":"필요성","children":[]},{"text":"재구성 방법","children":[{"text":"교과 내 재구성","children":[]},{"text":"교과 간 재구성","children":[]},{"text":"교과와 창의적 체험활동의 연계 재구성","children":[]}]},{"text":"재구성 절차(5단계)","children":[]},{"text":"고려사항","children":[]},{"text":"장점","children":[]},{"text":"창의적 체험활동의 영역 구성(2022 개정 기준)","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>기본개념</h4><p>이미 만들어진 국가 수준 교육과정을 교사가 학생 특성·교육상황에 맞게 변경해 새롭게 구성하는 것.</p></div>\n<div class=\"mn-block\"><h4>필요성 (3)</h4><p>교과서 중심수업 탈피 / 교과 간 중복 회피 / 융합을 통한 학습동기·흥미 유발</p></div>\n<div class=\"mn-block\"><h4>재구성 방법 (3)</h4><p>1. <strong>교과 내 재구성</strong> — 한 교과 내에서 재구성 (예: 순서 변경, 내용 압축, 블록타임제·전일제 운영)<br>2. <strong>교과 간 재구성</strong> — 교과 간 연계·공통내용 통합 (예: 사회+과학 통합, 마찰력 주제로 과학+기술 프로젝트)<br>3. <strong>교과와 창의적 체험활동의 연계 재구성</strong> (예: 국어+진로활동 = 이력서 쓰기·면접연습, 과학+봉사활동 = 분리수거·탄소중립교육)</p></div>\n<div class=\"mn-block\"><h4>재구성 절차 (5단계)</h4><p>교육과정 분석 → 재구성 유형 결정 → 교과내용 재구성 → 교수방법·평가계획 수립 → 피드백 및 수정</p></div>\n<div class=\"mn-block\"><h4>고려사항 (2)</h4><p>전체 수업의 연결성(범위·계열성·계속성·통합성·연계성) / 평가계획(교육목표·학생수준 고려)<br><strong>장점 (3)</strong>: 효율성 향상 / 다양성 향상 / 교사의 전문성 향상</p></div>\n<div class=\"mn-note\"><strong>[학교 현장 상식] 창의적 체험활동(창체)</strong>: 국가 수준 교육과정에서 교과 이외의 활동. 2022 개정 교육과정 기준 <strong>자율·자치활동 / 동아리활동 / 진로활동</strong>의 3영역. 기존 4영역(자율·동아리·봉사·진로)에서 봉사활동이 동아리 활동 영역 안으로 흡수되며 3영역으로 개편됨.</div>"},{"id":"curriculum-28","name":"2015 개정 교육과정","items":[{"text":"기본개념(창의융합형 인재)","children":[]},{"text":"변화내용","children":[{"text":"문이과 통합교육과정","children":[]},{"text":"한국사 추가","children":[]},{"text":"SW수업 강화","children":[]},{"text":"자유학기제 실시","children":[]}]},{"text":"자유학기제의 운영방법","children":[]},{"text":"추구하는 인간상","children":[]},{"text":"2022 개정과의 핵심역량 명칭 차이","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>기본개념 (5)</h4><p>7차 교육과정(1997~2015)을 개정. 문·이과 칸막이를 없애고 인문·사회·과학기술 기본소양을 토대로 인문학적 상상력과 과학기술 창조력을 갖춘 <strong>창의융합형 인재</strong>를 양성하는 교육과정. 인성교육, 학습자중심 교수방법, 과정중심 평가를 강조.</p></div>\n<div class=\"mn-block\"><h4>변화내용 (4)</h4><p>문이과 통합교육과정(통합사회·통합과학) / 기초영역에 한국사 추가 / SW수업 강화 / 중학교 자유학기제 실시</p></div>\n<div class=\"mn-note\"><strong>자유학기제</strong>란 중학교에서 한 학기(또는 두 학기) 동안 지식·경쟁 중심에서 벗어나 학생 참여형 수업과 체험활동 중심으로 운영하는 제도. 2025학년도부터 전국 모든 학교가 시행(운영방법(3): 참여형 프로그램 활용, 융합·연계 수업, 지필평가 대신 과정중심 평가).</div>\n<div class=\"mn-block\"><h4>추구하는 인간상 (4)</h4><p>— 2022 개정과 동일<br>자기주도적인 사람 / 창의적인 사람 / 교양 있는 사람 / 더불어 사는 사람</p></div>\n<div class=\"mn-block\"><h4>핵심역량 (6)</h4><p>2015의 ‘의사소통 역량’(개인 차원 초점) → 2022에서 ‘협력적 소통 역량’(공동체 속 협력까지 강조)으로 명칭 변경. (역량 세부내용은 Ⅰ장 “6. 역량중심 교육과정” 표 참고)</p></div>"},{"id":"curriculum-29","name":"2022 개정 교육과정","items":[{"text":"등장배경","children":[]},{"text":"기본개념(지식 중심에서 역량 중심으로의 전환)","children":[]},{"text":"고교학점제의 정의","children":[]},{"text":"2015 개정과의 차이","children":[]},{"text":"중학교 변화내용","children":[{"text":"자유학기제 개편","children":[]},{"text":"진로연계 학기 도입","children":[]},{"text":"창의적 체험활동 개편","children":[]},{"text":"학교스포츠클럽 활동 개선","children":[]}]},{"text":"고등학교 변화내용","children":[{"text":"고교학점제 도입","children":[]},{"text":"과목선택권 확대","children":[]},{"text":"창의적 체험활동 축소","children":[]}]},{"text":"고교학점제의 장점","children":[]},{"text":"고교학점제의 단점","children":[]},{"text":"고교학점제 안착을 위한 시사점(대책)","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>기본개념</h4><p>AI 시대의 디지털 전환·학령인구 감소 대응, 미래 불확실성에 유연히 대응하기 위해 2021.11.24 교육부가 7차 교육과정(1997~2015)을 개정 발표. 핵심은 <strong>고교학점제 도입</strong>이며 2025년부터 전면 시행 예정. <strong>지식 중심 → 역량 중심 전환</strong> + <strong>고교학점제 도입</strong>이 핵심 두 축.</p></div>\n<div class=\"mn-note\">고교학점제란? 고등학교에서 학생 수요에 따라 과목을 개설해 자율적 선택권을 보장하고, 석차등급제 대신 과정중심 평가로 성취기준 도달 여부를 확인해 평가·졸업을 결정하는 제도.</div>\n<div class=\"mn-block\"><h4>2015 개정 vs 2022 개정 차이</h4><p>2015는 창의융합형 인재 양성(문이과 통합)에, 2022는 미래사회 ‘역량’ 함양을 목표로 한 <strong>개별 성장 맞춤형 교육과정</strong>에 방점.</p></div>\n<div class=\"mn-block\"><h4>중학교 변화내용 (4)</h4><p>1. 자유학년제 폐기 → 자유학기제(1학년 1~2학기 중)로 변경<br>2. 진로연계 학기(3학년 2학기) 도입<br>3. 창의적 체험활동 개편 — 4영역(자·동·봉·진) → 3영역(자율자치·동아리·진로)<br>4. 학교스포츠클럽 활동 개선 — 연간 34시간(33.3%) 증대(102→136시간)</p></div>\n<div class=\"mn-block\"><h4>고등학교 변화내용 (3)</h4><p>1. <strong>고교학점제 도입</strong> — 단위→학점(1단위 17회→1학점 16회), 204단위→192학점(교과174+창체18) 이수. 학업성취율 40% 이상 미충족 시 미이수, 재수강 필요<br>2. <strong>과목선택권 확대</strong> — 1학년 공통과목 이수 후 2학년부터 선택과목. 학교에 없는 과목은 타학교·온라인·대학 연계 수강 가능<br>3. 창의적 체험활동 축소 — 24단위(408시간)→18학점(288시간)</p></div>\n<div class=\"mn-block\"><h4>고교학점제 장점 (3)</h4><p>진로·적성에 맞는 과목 선택 가능 / 자율성·자기주도 능력 함양 / 교사의 전문성 있는 학습전문가로의 성장<br><strong>고교학점제 단점 (3)</strong>: 진로체험 실효성 의문·기초학력 저하 우려 / 수도권-지방 교육환경 격차로 인한 학력격차 심화 우려 / 특정과목 쏠림으로 인한 폐강·수강기회 제한<br><strong>시사점(대책) (4)</strong>: 학교 자율성 부여 필요 / 교사 연수·자료 지원 필요 / 학생·학부모·교사 논의 시스템과 법령 정비 필요 / 공통과목까지 포함한 전과목 성취평가제 도입 필요</p></div>"},{"id":"curriculum-30","name":"스나이더의 교육과정 운영관점","items":[{"text":"기본개념","children":[]},{"text":"운영관점의 3가지 유형","children":[{"text":"충실도적 관점","children":[]},{"text":"상호적응적 관점","children":[]},{"text":"형성적 관점","children":[]}]},{"text":"관점별 개발주체와 교사의 역할","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>기본개념</h4><p>스나이더는 개발된 교육과정을 학교 현장에서 실행할 때의 <strong>3가지 운영관점</strong>을 제시.</p></div>\n<h4>교육과정 운영(실행)관점 (3)</h4>\n<div class=\"mn-table-wrap\"><table class=\"mn-table\">\n<tr><th>관점</th><th>정의</th><th>개발주체</th><th>교사의 역할</th></tr>\n<tr><td>① 충실도적 관점(계획된 관점)</td><td>교육부·시도교육청 개발자의 의도대로 충실히 이행되어야 한다는 관점</td><td>외부 전문가 (교사 배제)</td><td>전달자·소비자, 소극적</td></tr>\n<tr><td>② 상호적응적 관점(조정된 관점)</td><td>학교의 특수 상황에 맞춰 교사가 조정할 수 있다는 관점</td><td>전문가+교사 (교사=조정자)</td><td>적극적인 재구성자</td></tr>\n<tr><td>③ 형성적 관점(생성된 관점)</td><td>교사와 학생이 함께 만들어야 한다는 관점</td><td>교사+학생 (교사=개발자)</td><td>개발자, 주체적·능동적</td></tr>\n</table></div>\n<div class=\"mn-note\">참고: 21년도 시험에 오픈형으로 출제되어 이후 중요도는 낮아짐. 다시 출제된다면 교사배제 교육과정·스킬백 이론과 함께 나올 확률이 더 높음.</div>"},{"id":"curriculum-31","name":"홀의 교사 관심에 기초한 교육과정 적용모형(CBAM)","items":[{"text":"기본개념","children":[]},{"text":"관심 단계(7단계)","children":[{"text":"무관심(지각단계)","children":[]},{"text":"정보단계","children":[]},{"text":"개인단계","children":[]},{"text":"운영단계","children":[]},{"text":"결과단계","children":[]},{"text":"협동단계","children":[]},{"text":"개선단계","children":[]}]},{"text":"시사점","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>기본개념</h4><p>홀의 <strong>CBAM</strong>(Concerns-Based Adoption Model): 새로 채택된 교육과정의 성공 여부는 (충실도적 관점에서) 교사의 관심에 따라 달라진다는 모형. 단계가 높아질수록 교사의 관심도가 높아짐.</p></div>\n<h4>관심 단계 (7단계, 4영역)</h4>\n<div class=\"mn-table-wrap\"><table class=\"mn-table\">\n<tr><th>단계</th><th>관심의 표현</th></tr>\n<tr><td>0. 무관심(지각단계)</td><td>새 교육과정에 관심이 전혀 없음</td></tr>\n<tr><td>1. 정보단계</td><td>개괄적으로 알고 있으며 더 알고 싶어함</td></tr>\n<tr><td>2. 개인단계</td><td>자신에게 미치는 영향이 궁금함</td></tr>\n<tr><td>3. 운영단계</td><td>운영을 위한 정보·자원 활용에 관심</td></tr>\n<tr><td>4. 결과단계</td><td>학생들에게 미치는 영향에 관심</td></tr>\n<tr><td>5. 협동단계</td><td>다른 교사와의 협동·조정에 관심</td></tr>\n<tr><td>6. 개선단계(최고 단계)</td><td>수정·보완을 통한 더 좋은 결과에 관심</td></tr>\n</table></div>\n<div class=\"mn-block\"><h4>시사점</h4><p>교사들의 관심과 요구를 미리 확인하고 지원하는 것이 중요(예: 교사 맞춤형 연수 제공)</p></div>"},{"id":"curriculum-32","name":"렌줄리의 교육과정 압축","items":[{"text":"학자 및 등장배경","children":[]},{"text":"기본개념","children":[]},{"text":"방법","children":[{"text":"학생수준 평가","children":[]},{"text":"중복내용 제거","children":[]},{"text":"심화학습 제공","children":[]}]}],"explainHtml":"<div class=\"mn-block\"><h4>학자</h4><p>조셉 렌줄리(Joseph S. Renzulli, 1978년 개발). 기존 영재교육 프로그램이 영재 수준에 맞지 않아 학습 흥미·동기를 저하시킨다고 비판.</p></div>\n<div class=\"mn-block\"><h4>기본개념</h4><p>정규 교육과정 내 학생의 완전학습 정도를 파악해 주요 교육과정을 체계적으로 압축, 학습 속도를 올린 다음 심화학습 기회를 제공하는 교육과정 재구성 방법.</p></div>\n<div class=\"mn-block\"><h4>방법 (3)</h4><p>1. 학생수준 평가 — 숙달 정도 파악 후 추가 도전활동 제공(예: 소그룹 프로젝트, 친구 가르치기)<br>2. 중복내용 제거 — 이미 아는 내용을 제거해 학습속도 향상(가속화와는 다름)<br>3. 심화학습 제공 — 대표 개념·개인 아이디어를 적용하는 심화학습 제공</p></div>"},{"id":"curriculum-33","name":"렌줄리의 영재교육(심화학습 모형)","items":[{"text":"기본개념 및 등장배경","children":[]},{"text":"영재의 3요소(세 가지 고리)","children":[{"text":"지능","children":[]},{"text":"창의성","children":[]},{"text":"과제집착력","children":[]}]},{"text":"심화학습 모형의 단계","children":[{"text":"일반 탐색활동","children":[]},{"text":"집단 훈련활동","children":[]},{"text":"실제 문제 해결 및 연구활동","children":[]}]},{"text":"장점","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>기본개념</h4><p>교육과정 압축 이론으로 확보한 시간을 활용해 더 심화된 학습 기회를 제공하기 위해 1986년 개발. 소수 영재 대상이던 기존 영재교육을 더 많은 학생에게 확대하려는 학습모형.</p></div>\n<div class=\"mn-block\"><h4>영재의 3요소 (세 가지 고리, Three-Ring Conception of Giftedness)</h4><p>지능(문제해결력·추론력·사고력·학습능력) / 창의성(새 아이디어·해결책을 찾는 능력) / 과제집착력(목표 달성을 위한 끈기)<br>→ 세 요소가 모두 우수하게 발달한 사람을 영재로 분류.</p></div>\n<div class=\"mn-block\"><h4>심화학습 모형 (3단계)</h4><p>1. <strong>일반 탐색활동</strong>(일반+영재 모두 가능) — 관심·흥미 자극, 다양한 주제 지식 습득<br>2. <strong>집단 훈련활동</strong>(일반+영재 모두 가능) — 사고력·문제해결력·창의성 향상, 프로젝트 수업<br>3. <strong>실제 문제 해결 및 연구활동</strong>(영재만 가능, 핵심 단계) — 1·2단계 지식을 바탕으로 실생활 문제를 창의적으로 해결, 산출물 제작</p></div>\n<div class=\"mn-block\"><h4>장점 (3)</h4><p>학생의 흥미·잠재력 향상 / 창의력·문제해결력 향상 / 개별화된 교육</p></div>\n<div class=\"mn-note\"><strong>참고</strong>: 렌줄리의 두 이론은 교육심리 파트에 배치된 교재도 있으나, 교육과정 압축 이론과 묶어 이해·암기하는 것이 유리해 교육과정 파트에 정리하는 것이 일반적. 중요도는 둘 다 별 1개로 높지 않음.</div>"}]}]},{"id":"method","label":"교육방법 및 교육공학","sections":[{"title":"1. 교수설계모형","theories":[{"id":"method-1","name":"교수설계의 개념","items":[{"text":"정의(체제적 접근)","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>기본개념</h4><p>교육에 관련된 요구 및 문제점을 파악하고 이를 토대로 목표에서 내용, 방법, 평가에 이르기까지 교수체제의 전 과정을 계획하고 개발하기 위한 체제적 접근.</p></div>\n<div class=\"mn-tip\">💡 ’체제적’과 ’체계적’이 헷갈리기 쉬운데, 엄밀히 구분하려 하지 말고 “어떤 현상을 조직적·순서적으로 파악하는 것” 정도로 뭉뚱그려 이해해도 실전에서는 무리가 없습니다.</div>"},{"id":"method-2","name":"ADDIE 모형(ISD 모형)","items":[{"text":"등장배경","children":[]},{"text":"정의","children":[]},{"text":"단계별 핵심 활동","children":[{"text":"분석","children":[]},{"text":"설계","children":[]},{"text":"개발","children":[]},{"text":"실행","children":[]},{"text":"평가","children":[]}]},{"text":"형성평가의 3가지 방법","children":[{"text":"일대일평가","children":[]},{"text":"소집단평가","children":[]},{"text":"현장평가","children":[]}]}],"explainHtml":"<div class=\"mn-block\"><h4>등장배경</h4><p>교수체제설계(Instructional System Design, ISD)는 1950년대 미국에서 군사훈련의 효율성을 높이기 위해 개발된 모형. 교육공학자 실즈&amp;리치(Seels &amp; Richey)가 이를 교육 분야에 도입해 ADDIE 모형으로 발전시켰다.</p></div>\n<div class=\"mn-block\"><h4>기본개념</h4><p>효율적인 교육 프로그램을 개발하기 위해 교수체제설계(ISD)의 <strong>분석-설계-개발-실행-평가</strong> 단계를 활용한 가장 기본적인 교수설계 모형.</p></div>\n<h4>단계 (5)</h4>\n<div class=\"mn-table-wrap\"><table class=\"mn-table\">\n<tr><th>단계</th><th>핵심 활동</th></tr>\n<tr><td>1. 분석(Analysis)</td><td>목표 설정을 위해 학습 관련 요인 분석: 바람직한 수준과 실제 수준의 격차 파악, 목표달성에 필요한 지식·기능·태도와 계열성 분석, 학습자의 배경·적성·동기·수준 파악, 학습환경과 수행환경 분석</td></tr>\n<tr><td>2. 설계(Design)</td><td>분석 결과를 종합해 구체적 교육계획서 설계: 구체적 목표(수행목표) 진술, 평가도구 개발(준거지향평가 문항), 교수전략·매체 선정, 계열화(가르치는 순서)</td></tr>\n<tr><td>3. 개발(Development)</td><td>실제 수업에서 쓸 교수 프로그램·자료 제작 → <strong>형성평가</strong>(일대일평가 / 소집단평가 / 현장평가) → 수정 및 제작</td></tr>\n<tr><td>4. 실행(Implementation)</td><td>개발된 프로그램을 실제 교육 현장에서 활용</td></tr>\n<tr><td>5. 평가(Evaluation)</td><td><strong>총괄평가</strong>를 통해 프로그램의 효과성·효율성을 평가, 최종 사용 여부와 문제점 수정</td></tr>\n</table></div>\n<div class=\"mn-block\"><h4>형성평가 3가지 방법</h4><p>1. 일대일평가 — 대표 학습자에게 어려움을 느끼는지 평가<br>2. 소집단평가 — 수정된 프로그램을 8~20명에게 실시해 주의집중·흥미·난이도 파악<br>3. 현장평가 — 실제 활용될 상황에서 유용성 파악</p></div>"},{"id":"method-3","name":"딕과 캐리의 체제적 교수설계모형","items":[{"text":"정의(ADDIE와의 관계)","children":[]},{"text":"개발단계(10단계)","children":[{"text":"요구분석","children":[]},{"text":"교수분석","children":[]},{"text":"학습자 및 환경분석","children":[]},{"text":"수행목표 진술","children":[]},{"text":"평가도구 개발","children":[]},{"text":"교수전략 개발","children":[]},{"text":"교수자료 개발 및 선정","children":[]},{"text":"형성평가","children":[]},{"text":"프로그램 수정","children":[]},{"text":"총괄평가","children":[]}]},{"text":"요구분석의 개념 및 절차","children":[]},{"text":"학습과제분석 기법","children":[{"text":"위계분석","children":[]},{"text":"군집분석","children":[]},{"text":"통합분석","children":[]},{"text":"절차분석","children":[]}]},{"text":"특징(교육의 책무성, 실행단계 생략)","children":[]},{"text":"장점","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>기본개념</h4><p>ADDIE 모형을 세분화한 모형. (ADDIE의 기본개념을 활용해도 무방)</p></div>\n<div class=\"mn-tip\">💡 ADDIE의 5단계와 딕과 캐리의 10단계를 억지로 1:1 매칭할 필요는 없습니다. 원문에서도 “우리 시험은 주관식 논술이라 이렇게 디테일한 매칭을 물을 수 없다”고 설명합니다. 그보다는 딕과 캐리 고유의 순서(요구분석→…→총괄평가) 자체를 익히는 게 중요합니다.</div>\n<h4>순서 (10단계)</h4>\n<div class=\"mn-table-wrap\"><table class=\"mn-table\">\n<tr><th>단계</th><th>내용</th></tr>\n<tr><td>1. 요구분석(=요구사정, =교수목적설정)</td><td>요구분석을 통해 최종 학습목표를 도출. <strong>요구분석의 개념</strong>: 불확실한 문제의 본질을 규명하고자 실시하며, 요구란 최적 수행수준과 실제 수행수준 사이의 격차. <strong>절차(4)</strong>: ①이상적 수준 규정 ②현재 상황 측정 ③격차(요구) 분석 ④중요도·우선순위 고려해 교수목표 추출</td></tr>\n<tr><td>2. 교수분석(=목표분석, =하위기능분석, =학습과제분석)</td><td>최종 목표 성취에 필요한 학습유형과 하위기능을 분석(=가네와 연계). <strong>학습과제분석 절차(최상부→하향식)</strong>: 목표확인→학습요소추출→구조도 작성→순서결정. <strong>학습과제분석 기법(4)</strong>: 위계분석(지적기능), 군집분석(언어정보), 통합분석(태도), 절차분석(운동기능)</td></tr>\n<tr><td>3. 학습자 및 환경분석</td><td>선수지식(출발점 행동)→학습자 특성→학습상황·조건 순으로 분석 (진단평가 활용)</td></tr>\n<tr><td>4. 수행목표 진술</td><td>구체적 수행목표를 <strong>메이거의 진술방식</strong>(조건-준거-성취행동)으로 진술</td></tr>\n<tr><td>5. 평가도구 개발</td><td>수행목표 기준으로 목표도달여부를 평가할 절대평가 문항(준거지향평가) 개발</td></tr>\n<tr><td>6. 교수전략 개발</td><td>학습자 수준·특성 고려한 동기유발전략·내용제시전략·피드백전략 등</td></tr>\n<tr><td>7. 교수자료 개발 및 선정</td><td>학습자&amp;교사 지침서, 비디오, 컴퓨터 기반 멀티미디어 등 최적 자료 개발</td></tr>\n<tr><td>8. 형성평가</td><td>개발이 완료된 프로그램을 형성평가로 수정·보완·개선 (<strong>학생 성취도가 아니라 프로그램의 효과를 평가</strong>하는 것)</td></tr>\n<tr><td>9. 프로그램 수정</td><td>형성평가 결과를 바탕으로 교수전략·자료의 결점을 다시 수정·보완</td></tr>\n<tr><td>10. 총괄평가</td><td>개발된 프로그램의 효과를 종합적으로 검증 (<strong>외부 평가자</strong>가 실시하므로 교수설계 전 과정 밖에 있음. 목표도달여부 확인이 아님)</td></tr>\n</table></div>\n<div class=\"mn-block\"><h4>특징 (2)</h4><p>- 교육의 책무성 강조 — 평가도구 개발이 목표 진술 직후 미리 나옴<br>- 수업설계자(교사 아닌 상급기관의 교육과정 전문가) 입장에서 만들어져 ADDIE의 실행단계가 생략됨</p></div>\n<div class=\"mn-block\"><h4>장점 (2)</h4><p>초기부터 명확한 목표 진술로 후속 활동이 효과적 / 지속적 오류 수정으로 효과적인 프로그램 완성</p></div>"},{"id":"method-4","name":"ASSURE 모형","items":[{"text":"등장배경","children":[]},{"text":"정의","children":[]},{"text":"단계","children":[{"text":"학습자 분석","children":[]},{"text":"목표 진술","children":[]},{"text":"교수방법·매체·자료의 선정","children":[]},{"text":"매체와 자료의 활용","children":[]},{"text":"학습자 참여 요구","children":[]},{"text":"평가와 수정","children":[]}]},{"text":"목표 진술의 ABCD 기법","children":[]},{"text":"매체 활용의 계획요소(5P)","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>등장배경</h4><p>하이니히(대표자, Heinich), 몰렌다(Molenda), 러셀, 스말디노가 개발. 교육 프로그램을 효과적으로 설계하고 교사들이 교실 수업에서 교수매체를 효과적으로 활용하도록 개발됨.</p></div>\n<div class=\"mn-block\"><h4>기본개념</h4><p>교육프로그램을 효과적으로 설계하기 위해 교사들이 교수매체와 자료를 체계적으로 활용할 수 있도록 개발된 모형.</p></div>\n<h4>단계 (6)</h4>\n<div class=\"mn-table-wrap\"><table class=\"mn-table\">\n<tr><th>단계(영문)</th><th>핵심 내용</th></tr>\n<tr><td>1. 학습자 분석(Analyze learners)</td><td>학습자 고려사항(3): ①일반적 특성(연령·성별·지능·문화·경제적 요인) ②출발점 능력(사전지식) ③학습양식(매체 선호도·학습동기)</td></tr>\n<tr><td>2. 목표 진술(State objective)</td><td>메이거의 <strong>ABCD 기법</strong>으로 구체적 진술: Audience(대상)-Behavior(행동)-Conditions(조건)-Degree(기준). 예: 남자 중학생은(A) 운동장 100m를(C) 17초 이내에(D) 달릴 수 있다(B)</td></tr>\n<tr><td>3. 교수방법·매체·자료의 선정</td><td>선정기준(3): 교육과정과 일치하는가? 자료가 참신한가? 흥미를 유발하는가?</td></tr>\n<tr><td>4. 매체와 자료의 활용(Utilize)</td><td><strong>계획요소 5P</strong>: ①매체점검(Preview, 폭력성·선정성 사전검토) ②매체준비(Prepare materials, 순서·방법 결정) ③환경준비(Prepare environment) ④학습자준비(Prepare learners, 동기유발) ⑤수업제공(Provide, 실제 수업 진행)</td></tr>\n<tr><td>5. 학습자 참여 요구(Require participation)</td><td>능동적 참여 유도(3): 호기심 자극 질문 / 연습기회 제공(게임·토론·문제) / 피드백 제공(교사·동료·자기평가)</td></tr>\n<tr><td>6. 평가와 수정(Evaluate &amp; Revise)</td><td>매체 활용 수업의 효과·목표달성 정도를 평가(지필·수행)하고 다음 수업을 위해 수정</td></tr>\n</table></div>\n<div class=\"mn-tip\">💡 ASSURE는 이름 자체가 각 단계의 앞글자(Analyze-State-Select-Utilize-Require-Evaluate)라서, 영어 단어를 그대로 순서대로 떠올리는 것이 한글 암기보다 오히려 헷갈리지 않습니다.</div>"},{"id":"method-5","name":"조나센의 구성주의 학습환경 설계모형(CLEs)","items":[{"text":"정의(정해진 절차가 없는 특징)","children":[]},{"text":"학습지원 도구 자원(6가지)","children":[{"text":"문제/프로젝트","children":[]},{"text":"관련 사례","children":[]},{"text":"정보자원","children":[]},{"text":"인지적 도구","children":[]},{"text":"대화/협력도구","children":[]},{"text":"사회적·맥락적 지원","children":[]}]},{"text":"교수활동(3가지)","children":[{"text":"모델링","children":[]},{"text":"코칭","children":[]},{"text":"스캐폴딩","children":[]}]},{"text":"학습자 활동(3가지)","children":[{"text":"탐색","children":[]},{"text":"명료화","children":[]},{"text":"반성","children":[]}]}],"explainHtml":"<div class=\"mn-block\"><h4>학자</h4><p>데이비드 H. 조나센(미국, 교육심리학자, 펜실베니아주립대)</p></div>\n<div class=\"mn-block\"><h4>기본개념</h4><p>구성주의(지식은 객관적으로 존재하는 게 아니라 학습자의 경험을 통해 구성된다는 가정)에 기반해, 설계 절차를 먼저 고려하는 다른 교수설계 모형과 달리 <strong>학습자를 능동적 주체로 보고 자발적 학습이 가능한 학습환경 설계에 집중</strong>한 모형. 그래서 다른 모형들처럼 정해진 절차·단계가 없다.</p></div>\n<h4>학습지원 도구 자원 (6가지)</h4>\n<div class=\"mn-table-wrap\"><table class=\"mn-table\">\n<tr><th>자원</th><th>내용</th></tr>\n<tr><td>문제/프로젝트</td><td>학습환경 설계 시 가장 먼저 고려. 비구조적이고 다양한 관점으로 해결 가능한 문제를 제시, 문제해결 과정에서 지식을 새로 학습</td></tr>\n<tr><td>관련 사례</td><td>문제와 관련된 사례를 충분히 제공해 문제를 정확히 이해하도록 함</td></tr>\n<tr><td>정보자원</td><td>문제 해결에 필요한 정보를 충분히 제공</td></tr>\n<tr><td>인지적 도구</td><td>학습자의 인지활동 지원 (예: 시각화도구-도표/그래프, 정보수집도구-인터넷, 수행지원도구-체크리스트)</td></tr>\n<tr><td>대화/협력도구</td><td>사회적으로 공유된 지식을 협력 구성하도록 공동체를 형성 (예: 게시판, 이메일, SNS)</td></tr>\n<tr><td>사회적·맥락적 지원</td><td>구성주의 학습환경의 맥락적 요인을 이해·수용하도록 학부모·교사·사회단체 등이 지원 (예: 사전 오리엔테이션)</td></tr>\n</table></div>\n<h4>교수활동 (3가지, 교수자 활동)</h4>\n<div class=\"mn-table-wrap\"><table class=\"mn-table\">\n<tr><th>활동</th><th>내용</th></tr>\n<tr><td>모델링</td><td>전문가의 수행 과정을 보여주고 과제 수행법을 이해시킴</td></tr>\n<tr><td>코칭</td><td>숙달된 상태로 발전하도록 도움 제공, 동기 촉진, 오류 점검</td></tr>\n<tr><td>스캐폴딩</td><td>혼자서는 달성 못할 것을 체계적으로 도와줌 → 이후 점차 도움을 줄여(페이딩) 스스로 하게 유도 (난이도 조절, 과제 재구조화, 인지적 도구 사용)</td></tr>\n</table></div>\n<div class=\"mn-block\"><h4>학습자 활동 (3가지)</h4><p>탐색(주도적으로 정보를 찾고 분석) / 명료화(알게 된 것을 실제 적용해 분명히 함) / 반성(성찰, 학습내용을 돌이켜 확인)</p></div>"},{"id":"method-6","name":"메리엔보어의 4C/ID 모형","items":[{"text":"등장배경","children":[]},{"text":"정의","children":[]},{"text":"4가지 구성요소","children":[{"text":"학습과제","children":[]},{"text":"지원정보","children":[]},{"text":"절차정보","children":[]},{"text":"부분과제 연습","children":[]}]},{"text":"특징","children":[{"text":"객관주의·구성주의 관점의 통합","children":[]},{"text":"미시적 수준의 설계","children":[]},{"text":"분석과 설계 중심","children":[]}]}],"explainHtml":"<div class=\"mn-block\"><h4>등장배경</h4><p>로저 메리엔보어(Roger Merrienboer)는 기존 교수설계 모형들이 학습자의 능동적 참여를 충분히 고려하지 못한다고 비판, 실제 문제 해결 경험이 필요하다고 주장하며 1996년 제안.</p></div>\n<div class=\"mn-block\"><h4>기본개념</h4><p>인지부하이론에 영향을 받아, 학습자가 지식을 실제상황에 적용하거나 자기주도 학습·복잡한 인지과제 학습을 위해 개발된 모형. 4C(Four Components) = 네 가지 구성요소, ID = Instruction Design.</p></div>\n<h4>4가지 구성요소</h4>\n<div class=\"mn-table-wrap\"><table class=\"mn-table\">\n<tr><th>구성요소</th><th>내용</th></tr>\n<tr><td>학습과제(Learning Tasks)</td><td>실제적 환경·시뮬레이션 환경에서 실제적 형태로 제공. 간단한 것→복잡한 것 순으로 계열화. 스캐폴딩 제공 후 점차 페이딩</td></tr>\n<tr><td>지원정보(Supportive Information)</td><td>학습과제 해결에 필요한 <strong>선언적(명제적) 지식</strong>을 지원하는 정보 (예: 영문법, 수학공식). 필요할 때 언제든(Just In Time) 풍부·구체적으로 제공</td></tr>\n<tr><td>절차정보(Procedural Information)</td><td>학습과제 해결에 필요한 <strong>절차적 지식</strong>을 지원하는 정보 (예: 삼각함수 푸는 방법). 수업 직전 제시가 효과적이나 필요시 언제든 활용 가능해야 함</td></tr>\n<tr><td>부분과제 연습(Part Task Practice)</td><td>관련 기능의 자동화를 위해 수업 후 반복 연습(숙제)으로 제시</td></tr>\n</table></div>\n<div class=\"mn-block\"><h4>특징 (3)</h4><p>- 객관주의 관점과 구성주의 관점을 통합 (실제적 환경의 과제 + 선언적/절차적 지식과 반복연습을 함께 제공)<br>- 미시적 수준의 설계 (교육과정 같은 거시적 수준이 아니라 학습코스·모듈 수준)<br>- 모든 교수 단계를 다루지 않고 분석과 설계에 초점 (ADDIE처럼 요구분석·실행 단계가 없음)</p></div>\n<div class=\"mn-tip\">💡 4C/ID가 “구성주의 교수설계”로 분류되어 있지만 특징에서 보듯 실은 객관주의(선언적/절차적 지식, 반복연습)와 구성주의(실제적 과제)를 절충한 모형입니다. 분류표에 있다고 순수 구성주의로 오해하지 않는 게 중요합니다.</div>"},{"id":"method-7","name":"쾌속원형(Rapid Prototyping) 모형","items":[{"text":"등장배경","children":[]},{"text":"정의(프로토타입)","children":[]},{"text":"절차 및 주요활동(3단계)","children":[{"text":"개발","children":[]},{"text":"평가","children":[]},{"text":"수정 및 보완","children":[]}]},{"text":"특징(장점)","children":[{"text":"비선형적 설계","children":[]},{"text":"시간과 비용 절감","children":[]},{"text":"학습자 요구 반영","children":[]}]}],"explainHtml":"<div class=\"mn-block\"><h4>등장배경</h4><p>전통적 ADDIE 모형은 효율성은 높지만 현실의 복잡성을 다 반영하지 못하고 개발 기간이 오래 걸리는 단점 → 트립(Tripp)과 비첼메이어(Bichelmeyer)가 1990년에 대안으로 제안.</p></div>\n<div class=\"mn-block\"><h4>기본개념</h4><p>교수설계 의뢰인이나 학습자의 요구를 반영해 교수설계 초기에 빠르게(Rapid) 최종 결과물의 초기형태인 <strong>프로토타입</strong>(제품·서비스의 초기 버전, 예: 평가판)을 개발하는 모형.</p></div>\n<div class=\"mn-block\"><h4>절차 및 주요활동 (핵심 3단계)</h4><p>ADDIE와 달리 각 단계가 끝난 후 다음 단계로 가는 게 아니라, <strong>동시적·순환적·반복적</strong>으로 이루어짐.<br>1. <strong>개발</strong> — 교육목표 달성을 위한 교육내용·교수학습 요소를 파악해 신속하게 프로토타입 형태로 개발<br>2. <strong>평가</strong>(사용성 평가) — 개발된 프로토타입에 대해 교사·학습자 의견을 수집해 효과성·효율성 평가<br>3. <strong>수정 및 보완</strong> — 평가 결과를 체계적으로 분석해 수정·보완</p></div>\n<div class=\"mn-block\"><h4>장점(특징) (3)</h4><p>- 비선형적 설계 — 각 단계가 동시적·순환적·반복적으로 이루어져 탄력적·역동적 개발 가능<br>- 시간과 비용 절감 — 신속한 프로토타입 개발로 기존 모형보다 절감<br>- 학습자 요구 반영 — 개발 초기부터 요구를 적극 반영</p></div>"}]},{"title":"2. 교수설계이론","theories":[{"id":"method-8","name":"가네의 교수설계이론","items":[{"text":"기본개념","children":[]},{"text":"학습의 조건","children":[{"text":"외적조건","children":[]},{"text":"내적조건","children":[]}]},{"text":"9가지 수업사태","children":[{"text":"주의집중 획득","children":[]},{"text":"학습목표 제시","children":[]},{"text":"선수학습회상","children":[]},{"text":"자극자료 제시","children":[]},{"text":"학습안내 제공","children":[]},{"text":"수행유도","children":[]},{"text":"피드백 제공","children":[]},{"text":"성취행동 평가","children":[]},{"text":"파지 및 전이 증진","children":[]}]},{"text":"자극자료 제시와 학습안내 제공의 구분 기준","children":[]}],"explainHtml":"<div class=\"mn-block\"><h4>기본개념</h4><p>학습목표에 따라 어떤 교수방법을 사용해야 하는가에 대한 원리를 탐구한 모형으로, 외부에서 정보를 준다고 학습이 이루어지는 것이 아니라 <strong>교수활동은 인간의 내적 학습과정에 맞추어 이루어져야 한다</strong>는 것에 기반.</p></div>\n<div class=\"mn-block\"><h4>학습의 조건 (2)</h4><p>성공적인 학습을 위해서는 학습자의 외적조건과 내적조건이 만족되어야 함.<br>- 외적조건 — 학습자 외부에서 가해지는 교수사태. 강화의 원리(보상이 주어질 때 학습이 잘 일어남) / 접근의 원리(자극과 반응이 시간상 근접할 때) / 반복의 원리(반복 연습으로 파지 증진)<br>- 내적조건 — 학습자의 내적 인지과정. 선행학습 / 학습동기 / 자아개념 / 주의력</p></div>\n<div class=\"mn-block\"><h4>9가지 수업사태</h4><p>학습의 인지과정에 근거해 하나의 학습능력을 가르치기 위한 수업 계열화의 기본 원리. 각 단계의 구체적 내용은 학습이 의도한 5가지 영역(언어·지적·인지·운동기능·태도)에 따라 달라짐.</p></di
